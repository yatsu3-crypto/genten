<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FBF5E6">
<title>原典｜やまもと皮膚科・漢方クリニック</title>
<!-- このファイルは build.py が genten.html の元にする雛形。genten.html を直接直さないこと -->
<!-- 唯一許可された外部リソース: Google Fonts（オフライン時はシステムフォントに自動フォールバック） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --washi:#FBF5E6;--washi-d:#F2E9D2;--card:#FFFCF4;--line:#D9CDB3;
  --sumi:#332C25;--sumi2:#5B5247;--usu:#8C8073;
  --shu:#C1432E;--shu-d:#9A3A2E;--kin:#C08A22;--kin-d:#8A6410;
  --matsu:#2E5D4B;--ai:#22376B;--akane:#8A4A5A;
  --shadow:0 1px 0 rgba(0,0,0,.04),0 6px 18px -10px rgba(60,45,25,.35);
  --r:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",-apple-system,sans-serif;
  color:var(--sumi);background:var(--washi);
  background-image:
    radial-gradient(circle at 18% 12%,rgba(192,138,34,.05),transparent 40%),
    radial-gradient(circle at 82% 78%,rgba(34,55,107,.05),transparent 42%);
  font-size:15px;line-height:1.65;-webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
h1,h2,h3,.mincho{font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;font-weight:700;letter-spacing:.02em}

header{position:sticky;top:0;z-index:30;
  background:linear-gradient(180deg,rgba(251,245,230,.97),rgba(251,245,230,.9));
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) calc(16px + env(safe-area-inset-right)) 10px calc(16px + env(safe-area-inset-left))}
.brand{display:flex;align-items:center;gap:11px}
.brand h1{font-size:18px;margin:0}
.brand .sub{font-size:11px;color:var(--sumi2);letter-spacing:.04em;margin-top:1px}
.tampopo{width:34px;height:34px;flex:0 0 auto}
.search{position:relative;margin-top:10px}
.search input{width:100%;padding:12px 14px 12px 40px;border:1px solid var(--line);border-radius:var(--r);
  font-size:16px;background:var(--card);color:var(--sumi);font-family:inherit;-webkit-appearance:none}
.search input::placeholder{color:var(--usu)}
.search input:focus{outline:none;border-color:var(--kin);box-shadow:0 0 0 3px rgba(192,138,34,.15)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.5}

main{max-width:760px;margin:0 auto;padding:14px calc(14px + env(safe-area-inset-right)) 90px calc(14px + env(safe-area-inset-left))}
.view{display:none;animation:fade .25s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.sectitle{font-size:12px;letter-spacing:.16em;color:var(--matsu);font-weight:700;margin:4px 2px 8px}

.list{display:flex;flex-direction:column;gap:7px}
.al{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:9px 12px;cursor:pointer;min-height:56px;width:100%;text-align:left;font-family:inherit;color:inherit;font-size:inherit}
.al:active{background:var(--washi-d)}
.al .num{flex:0 0 auto;min-width:36px;text-align:center;font-size:12px;font-weight:700;color:var(--kin-d);
  border:1px solid var(--line);border-radius:8px;padding:3px 4px;background:var(--washi)}
.al .am{flex:1;min-width:0}
.al .an{font-size:16px;font-weight:700;line-height:1.3}
.al .ax{font-size:11.5px;color:var(--sumi2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.back{display:inline-flex;align-items:center;gap:5px;background:none;border:none;color:var(--ai);font-weight:700;
  font-size:14px;cursor:pointer;padding:0 4px 0 0;font-family:inherit;min-height:44px}
.dhead{margin:2px 2px 14px}
.dhead h2{font-size:26px;margin:0;line-height:1.3}
.dhead .yomi{font-size:13px;color:var(--sumi2);margin-top:2px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card)}
.pill.num{color:var(--kin-d)}
.pill.src{color:var(--matsu)}
.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:11px 14px 12px;margin-bottom:9px}
.sec h3{font-size:13px;letter-spacing:.12em;color:var(--matsu);margin:0 0 5px}
.sec .body{white-space:pre-wrap;word-break:break-word}
.sec.jobun .body{font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;font-size:16.5px;line-height:1.9}
.todo{display:inline-block;font-size:12px;font-weight:700;color:var(--shu);border:1.5px dashed var(--shu);border-radius:8px;padding:2px 9px;background:rgba(193,67,46,.05)}

.listempty{text-align:center;color:var(--sumi2);padding:40px 20px;font-size:14px}
.listempty .big{font-size:40px;margin-bottom:8px}
.disc{font-size:11.5px;color:var(--sumi2);border-top:1px dashed var(--line);margin-top:24px;padding-top:14px;line-height:1.6}
.foot{text-align:center;font-size:11px;color:var(--sumi2);margin-top:18px}
@media print{
  header,.back,.disc{display:none!important}
  body{background:#fff;background-image:none}
  .sec,.al{break-inside:avoid;box-shadow:none}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg class="tampopo" viewBox="0 0 48 48" aria-hidden="true">
      <g fill="none">
        <line x1="24" y1="46" x2="24" y2="24" stroke="#5a6e48" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M24 40c-4-1-7-4-8-7" stroke="#5a6e48" stroke-width="2" stroke-linecap="round"/>
        <circle cx="24" cy="18" r="7.5" fill="#a87d35"/>
        <g stroke="#c9a24a" stroke-width="1.5" stroke-linecap="round">
          <line x1="24" y1="18" x2="24" y2="4"/><line x1="24" y1="18" x2="34" y2="8"/>
          <line x1="24" y1="18" x2="38" y2="18"/><line x1="24" y1="18" x2="34" y2="28"/>
          <line x1="24" y1="18" x2="14" y2="8"/><line x1="24" y1="18" x2="10" y2="18"/>
          <line x1="24" y1="18" x2="14" y2="28"/><line x1="24" y1="18" x2="31" y2="3"/>
          <line x1="24" y1="18" x2="17" y2="3"/><line x1="24" y1="18" x2="39" y2="11"/>
          <line x1="24" y1="18" x2="9" y2="11"/>
        </g>
        <g fill="#fff8e8"><circle cx="24" cy="4" r="2.1"/><circle cx="34" cy="8" r="2.1"/><circle cx="38" cy="18" r="2.1"/><circle cx="34" cy="28" r="2.1"/><circle cx="14" cy="8" r="2.1"/><circle cx="10" cy="18" r="2.1"/><circle cx="14" cy="28" r="2.1"/><circle cx="31" cy="3" r="1.8"/><circle cx="17" cy="3" r="1.8"/><circle cx="39" cy="11" r="1.8"/><circle cx="9" cy="11" r="1.8"/></g>
      </g>
    </svg>
    <div>
      <h1>原典</h1>
      <div class="sub">方剤の条文・出典・構成・方意をすぐ引く</div>
    </div>
  </div>
  <div class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#332C25" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input type="search" id="q" placeholder="方剤名・読み・番号・生薬で探す" autocomplete="off" enterkeyhint="search">
  </div>
</header>

<main>
  <section class="view on" id="v-list">
    <div class="sectitle" id="count"></div>
    <div class="list" id="list"></div>
  </section>
  <section class="view" id="v-detail"></section>
  <div class="disc">※院内の参照用です。条文・構成は資料から転記したもので、「要確認」は資料からの転記が済んでいない項目です。最終判断は医師が行います。</div>
  <div class="foot mincho">やまもと皮膚科・漢方クリニック　🌼 たんぽぽちゃん<br><span id="built"></span></div>
</main>

<script id="genten-data" type="application/json">__GENTEN_DATA__</script>
<script>
var DATA = JSON.parse(document.getElementById("genten-data").textContent);
var $ = function(s){ return document.querySelector(s); };

function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
/* 検索用：カタカナ→ひらがな、全角英数→半角、空白除去 */
function norm(s){
  return String(s||"").toLowerCase()
    .replace(/[ァ-ヶ]/g, function(c){ return String.fromCharCode(c.charCodeAt(0)-0x60); })
    .replace(/[！-～]/g, function(c){ return String.fromCharCode(c.charCodeAt(0)-0xfee0); })
    .replace(/\s+/g, "");
}
DATA.entries.forEach(function(e){
  e._idx = norm([e["名前"], e["読み"], e["ツムラ番号"], e["出典"], e["本文"]["構成"]].join(" "));
});
var TODO = '<span class="todo">要確認</span>';

function renderList(){
  var q = norm($("#q").value);
  var hits = DATA.entries.filter(function(e){ return !q || e._idx.indexOf(q) !== -1; });
  if (!DATA.entries.length){
    $("#count").textContent = "";
    $("#list").innerHTML = '<div class="listempty"><div class="big">🌼</div>まだ方剤が登録されていません<br>entries/ に方剤を足して build.py を実行してください</div>';
    return;
  }
  $("#count").textContent = q ? "該当 " + hits.length + " 件" : "方剤 " + hits.length + " 件";
  if (!hits.length){
    $("#list").innerHTML = '<div class="listempty"><div class="big">🔍</div>見つかりません</div>';
    return;
  }
  $("#list").innerHTML = hits.map(function(e){
    var sub = [e["読み"], e["出典"]].filter(Boolean).join("　");
    return '<button class="al" data-f="' + esc(e.file) + '">' +
      '<span class="num">' + (e["ツムラ番号"] ? esc(e["ツムラ番号"]) : "—") + '</span>' +
      '<span class="am"><span class="an" style="display:block">' + esc(e["名前"]) + '</span>' +
      '<span class="ax" style="display:block">' + (sub ? esc(sub) : "読み・出典 要確認") + '</span></span></button>';
  }).join("");
}

function renderDetail(e){
  var h = '<button class="back" onclick="history.length>1?history.back():go(\'\')">‹ 一覧へ</button>';
  h += '<div class="dhead"><h2>' + esc(e["名前"]) + '</h2>' +
    '<div class="yomi">' + (e["読み"] ? esc(e["読み"]) : TODO) + '</div>' +
    '<div class="tags"><span class="pill num">ツムラ ' + (e["ツムラ番号"] ? esc(e["ツムラ番号"]) : "要確認") + '</span>' +
    '<span class="pill src">' + (e["出典"] ? esc(e["出典"]) : "出典 要確認") + '</span></div></div>';
  DATA.sections.forEach(function(k){
    var v = e["本文"][k];
    h += '<div class="sec' + (k === "条文" ? " jobun" : "") + '"><h3>' + esc(k) + '</h3>' +
      '<div class="body">' + (v ? esc(v) : TODO) + '</div></div>';
  });
  $("#v-detail").innerHTML = h;
}

/* 画面の状態は URL ハッシュ（#<方剤ファイル名>）で表す */
function go(f){ location.hash = f ? encodeURIComponent(f) : ""; }
function route(){
  var f = decodeURIComponent(location.hash.slice(1));
  var e = DATA.entries.filter(function(x){ return x.file === f; })[0];
  $("#v-list").classList.toggle("on", !e);
  $("#v-detail").classList.toggle("on", !!e);
  if (e){ renderDetail(e); window.scrollTo(0, 0); }
}
$("#list").addEventListener("click", function(ev){
  var b = ev.target.closest(".al"); if (b) go(b.dataset.f);
});
$("#q").addEventListener("input", function(){ renderList(); if (location.hash) go(""); });
window.addEventListener("hashchange", route);
$("#built").textContent = "データ更新 " + DATA.built;
renderList(); route();
</script>
</body>
</html>

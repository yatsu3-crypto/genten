header{position:sticky;top:0;z-index:30;

.brand{display:flex;align-items:center;gap:11px}
.brand h1{font-size:18px;margin:0}
.brand .sub{font-size:11px;color:var(--sumi2);letter-spacing:.04em;margin-top:1px}
.tampopo{width:34px;height:34px;flex:0 0 auto}
.search{position:relative;margin-top:10px}
.search input{width:100%;padding:12px 14px 12px 40px;border:1px solid var(--line);border-radius:var(--r);
  font-size:16px;background:var(--card);color:var(--sumi);font-family:inherit;-webkit-appearance:none}
.search input::placeholder{color:var(--usu)}
.search input:focus{outline:none;border-color:var(--kin);box-shadow:0 0 0 3px rgba(192,138,34,.15)}

main{max-width:760px;margin:0 auto;padding:14px calc(14px + env(safe-area-inset-right)) 90px calc(14px + env(safe-area-inset-left))}
.view{display:none;animation:fade .25s ease}

@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  .tbl td[data-label]:not(:first-child)::before{content:attr(data-label);display:block;font-size:11px;font-weight:700;color:var(--usu);letter-spacing:.04em}
  .tbl td.blank{display:none}

.listempty{text-align:center;color:var(--sumi2);padding:40px 20px;font-size:14px}
.listempty .big{font-size:40px;margin-bottom:8px}

@media print{
  header,.back,.disc{display:none!important}

<script id="genten-data" type="application/json">{"built": "2026-10-22", "edition": "public", "sections": ["条文", "出典", "構成", "方意", "諸家の論", "院長メモ"], "entries": [{"file": "葛根湯", "名前": "葛根湯", "読み": "かっこんとう", "ツムラ番号": "1", "出典": "傷寒論（巻第三・弁太陽病脈証并治中第六）／金匱要略（痙湿暍病脈証并治第二）", "本文": {"条文": "### 『傷寒論』巻第三・弁太陽病脈証并治中第六\n\n**書き下し**（読み：社員案）（1条目：項背強）\n太陽病、項背強ばること几几、汗無く悪風するは、葛根湯之を主る。\n\n**原文**（翻刻確認）\n太陽病，項背強几几，無汗惡風，葛根湯主之。\n\n**現代語訳**（訳：社員案）\n太陽病で、うなじから背中が几几とこわばり、汗が出ず、風を嫌うものは、葛根湯が主治する。\n\n**書き下し**（読み：社員案）（2条目：合病の自下利。1条目の方の後に続く）\n太陽と陽明との合病の者は、必ず自下利す。葛根湯之を主る。\n\n**原文**（翻刻確認）\n太陽與陽明合病者，必自下利，葛根湯主之。\n\n**現代語訳**（訳：社員案）\n太陽と陽明の合病のものは、必ずひとりでに下痢する。葛根湯が主治する。\n\n### 『金匱要略』痙湿暍病脈証并治第二\n\n**書き下し**（読み：社員案）\n太陽病、汗無くして小便反って少なく、気胸に上衝し、口噤して語るを得ず、剛痙を作さんと欲するは、葛根湯之を主る。\n\n**原文**（翻刻確認）\n太陽病，無汗而小便反少，氣上衝胸，口噤不得語，欲作剛痙，葛根湯主之。\n\n**現代語訳**（訳：社員案）\n太陽病で、汗が出ないのに尿がかえって少なく、気が胸に突き上げ、口を食いしばってものが言えず、剛痙を起こしかけているものは、葛根湯が主治する。\n\n### 注記\n- 「几几」は資料のルビで「キキ」と読む\n- 『傷寒論』の2条はどちらも宋本の翻刻と、四庫全書本『傷寒論注釈』（成無己注）の翻刻で同じ句（翻刻確認）\n- 四庫全書本『傷寒論注釈』の翻刻は「強」を「强」、「麻黃」を「麻黄」の字形で書く（要原本照合）\n- 『金匱要略』の篇名は、資料の中で「痙湿暍病脈証第二」と「痙湿暍病脈証治第二」の2通りに書かれる。翻刻は「痙濕暍病脈證並治第二」（翻刻確認）\n- 『金匱要略』の巻数は資料に記載がない（要確認）\n- 葛根湯方の煎じ方で、麻黄・葛根を先に煮て減らす水の量は、宋本『傷寒論』の翻刻では「減六升」（要原本照合）。本文は、『金匱要略』の翻刻・四庫全書本『傷寒論注釈』と、宋本の翻刻のほかの方（桂枝加葛根湯・葛根加半夏湯など）の「減二升」を採った\n- 『金匱要略』と四庫全書本『傷寒論注釈』の葛根湯方には「㕮咀」と「不須啜粥、餘如桂枝湯法將息及禁忌」の句があり、宋本『傷寒論』の翻刻にはない（要原本照合）\n- 四庫全書本『傷寒論注釈』の翻刻は桂枝を「桂」と書く（要原本照合）", "出典": "### 原典の構成\n- 『傷寒論』（宋本）：葛根4両、麻黄3両（去節）、桂枝2両（去皮）、生姜3両（切）、甘草2両（炙）、芍薬2両、大棗12枚（擘）（翻刻確認）\n- 『金匱要略』：葛根4両、麻黄3両（去節）、桂枝2両（去皮）、芍薬2両、甘草2両（炙）、生姜3両（切）、大棗12枚（擘）（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』（宋本）：7味を水1斗で、まず麻黄・葛根を煮て2升減らし（宋本の翻刻の「6升」は注記）、白い泡を去る。残りの薬を入れて3升に煮つめ、滓を去って1升を温服する。衣をかけてわずかに汗ばむ程度の汗をとる（翻刻確認）\n- 『金匱要略』：7味を刻み、水1斗で、まず麻黄・葛根を煮て2升減らし、泡を去る。残りの薬を入れて3升に煮つめ、滓を去って1升を温服する。衣をかけてわずかに汗ばむ程度の汗をとる。粥をすする必要はなく、ほかは桂枝湯の法に従って養生と禁忌を守る（翻刻確認）\n\n### 処方の変遷\n- 桂枝湯（桂皮・生姜・甘草・芍薬・大棗）に葛根・麻黄を加えた処方\n- 『太平恵民和剤局方』巻之二・傷寒附中暑には、葛根・麻黄・黄芩・芍薬・甘草・肉桂を粗末とし、棗を入れて煎じる「葛根解肌湯」が載るとされる（要原本照合）\n- 『丹渓心法附余』巻之一・外感門上には、傷寒の項に原典どおり7味の葛根湯、温熱病の項に『和剤局方』の葛根解肌湯が載るとされる。おおむね黄芩の有無で傷寒の薬と温熱病の薬が分けられている（要原本照合）\n- 現行エキス剤（ツムラ1）は 葛根・大棗・麻黄・甘草・桂皮・芍薬・生姜 の7味（PMDA 添付文書 2026年8月改訂 第2版で確認）。原典の「桂枝」は、資料の組成欄では「桂皮」と書かれる", "構成": "葛根・大棗・麻黄・甘草・桂皮・芍薬・生姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論", "院長メモ"]}, {"file": "葛根湯加川芎辛夷", "名前": "葛根湯加川芎辛夷", "読み": "かっこんとうかせんきゅうしんい", "ツムラ番号": "2", "出典": "本朝経験方", "本文": {"条文": "", "出典": "### 原典の構成\n\n### 原典の服用法\n\n### 処方の変遷\n- 葛根湯に川芎・辛夷を加えた加味方で、資料の出典欄は「本朝経験方」（日本の経験方）。創製者は不明とされ、多紀元簡編の書『本朝経験方』を指すものではないとされる（要確認）\n- もとの葛根湯の出典は『傷寒論』巻第三・弁太陽病脈証并治中第六と『金匱要略』痙湿暍病脈証并治第二（条文は葛根湯の項を参照）\n- 吉益東洞『方機』の葛根湯の条には応鐘散（芎黄散：大黄・川芎）の兼用が示され、葛根湯に川芎・大黄を加えた形で処方されていたとされる（要原本照合）\n- 原南陽『叢桂亭医事小言』巻之四下には、葛根湯・五物解毒湯に辛夷を加える用い方が載るとされる（要原本照合）\n- 浅田宗伯『勿誤薬室方函口訣』巻之上の葛根湯の項には、川芎・大黄を加えて脳漏・眼耳痛を治すとあるとされる（要原本照合）\n- 現行エキス剤（ツムラ2）は 葛根・大棗・麻黄・甘草・桂皮・芍薬・辛夷・川芎・生姜 の9味（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "葛根・大棗・麻黄・甘草・桂皮・芍薬・辛夷・川芎・生姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["出典", "構成", "方意", "諸家の論"]}, {"file": "乙字湯", "名前": "乙字湯", "読み": "おつじとう", "ツムラ番号": "3", "出典": "叢桂亭医事小言（巻之七・叢桂亭蔵方）／浅田家方", "本文": {"条文": "### 『叢桂亭医事小言』巻之七・叢桂亭蔵方（原南陽）\n\n**書き下し**\n乙字湯　痔疾、脱肛痛楚、或いは下血腸風、或いは前陰痒痛する者を理する方。\n\n（方後）諸瘡疥、洗伝の薬を禁ず。下部の瘡疥、最も之を忌む。誤りて枯薬洗伝し、頓に愈えて後、上逆鬱冒す。気癖の如く繊憂細慮し、或いは心気不定の如き者、并びに之を主る。而して長強に灸す。傷風下血、久服して効無き者は理中湯に宜し。\n\n**原文**（要原本照合）\n資料に原文の記載がない（要確認）\n\n**現代語訳**（訳：社員案）\n乙字湯　痔疾、脱肛の痛み苦しみ、あるいは下血・腸風、あるいは前陰の痒みや痛みがある者を治める処方。\n\n（方後）諸々の瘡疥には、洗ったり塗ったりする薬を禁じる。下部の瘡疥ではとりわけこれを忌む。誤って枯らす薬で洗ったり塗ったりし、急に治った後に、上逆して鬱冒する。気癖のように細かなことを思い悩み、あるいは心気が定まらないような者も、併せてこれを主治する。そして長強に灸をする。傷風による下血で、長く服用しても効かない者には理中湯がよい。\n\n### 『勿誤薬室方函』巻上（浅田家方）\n\n浅田宗伯『勿誤薬室方函』巻上の乙字湯は出典を南陽とし、上の方後の文のうち「洗伝の薬を禁ず。下部の瘡疥、最も之を忌む」と「而して長強に灸す。傷風下血、久服して効無き者は理中湯に宜し」を除いて引く。構成は原方と異なり、内容は「出典」の見出しに記す（要原本照合）\n\n### 注記\n- 書き下しは資料（sources/２.pdf の本の83頁）に引かれたもの。原文は資料になく、維基文庫にも翻刻が見当たらない（要原本照合）\n- 「洗伝」の「伝」は資料の表記のまま（要原本照合）\n- 原方の薬味は、資料の『叢桂亭医事小言』の引用では柴胡・黄芩・升麻・大黄・甘草・大棗・生姜の7味だが、津田玄仙『療治経験筆記』巻之九の引用は「原南陽の乙字湯の六味」とされる（要原本照合）", "出典": "### 原典の構成\n- 『叢桂亭医事小言』（原南陽の原方）：柴胡・黄芩 各7分、升麻・大黄・大棗 各4分、甘草3分、生姜2分（要原本照合）\n- 『勿誤薬室方函』（浅田家方）：柴胡・大黄・升麻・黄芩・甘草・当帰（分量は資料に記載なし）（要原本照合）\n\n### 原典の服用法\n\n### 処方の変遷\n- 「乙字湯」の名は、原南陽の蔵方の五十八方を甲字湯（瘀血）・乙字湯（痔疾）・丙字湯（諸淋）・丁字湯（澼嚢）…と名付けたうちの2番目であることによる（要原本照合）\n- 『叢桂亭医事小言』の原方には当帰が入っていない（要原本照合）\n- 『勿誤薬室方函』巻上の乙字湯は、原方から大棗・生姜を去り当帰を加えた加減方である（要原本照合）\n- 現行エキス剤（ツムラ3）は 当帰・柴胡・黄芩・甘草・升麻・大黄 の6味で、浅田家方と同じ顔ぶれ。大棗・生姜は入っていない（添付文書 2023年12月改訂 第1版で確認）", "構成": "当帰・柴胡・黄芩・甘草・升麻・大黄", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["出典", "構成", "方意", "諸家の論"]}, {"file": "安中散", "名前": "安中散", "読み": "あんちゅうさん", "ツムラ番号": "5", "出典": "太平恵民和剤局方（巻三・一切気門）／原南陽方", "本文": {"条文": "### 『太平恵民和剤局方』巻三・一切気門\n\n**書き下し**（読み：社員案）\n遠年日近の脾疼・翻胃（反胃）、口に酸水を吐し、寒邪の気、内に留滞し、停積消えず、胸膈脹満し、腹脇を攻刺し、悪心嘔逆し、面黄ばみ肌痩せ、四肢倦怠するを治す。又、婦人の血気刺痛、小腹腰に連なり、攻疰重痛するを治す。並びに能く之を治す。\n\n**原文**（翻刻確認）\n治遠年日近脾疼翻胃、口吐酸水、寒邪之氣留滯於内、停積不消、胸膈脹滿、攻刺腹脇、惡心嘔逆、面黄肌痩、四肢倦怠。又治婦人血氣刺痛、小腹連腰、攻疰重痛、並能治之。\n\n**現代語訳**（訳：社員案）\n長年続くものも近ごろ起きたものも、胃の痛みや翻胃（反胃。食べたものを吐く）で、口から酸っぱい水を吐き、寒邪の気が体内に留まって滞り、停滞したものが消えず、胸や膈が張って膨れ、腹や脇腹を刺すように痛み、吐き気がして嘔吐し、顔色が黄ばんで痩せ、手足がだるいものを治す。また、婦人の血気による刺すような痛みで、下腹が腰に連なって、差し込むように重く痛むものを治す。いずれもよく治す。\n\n### 『証治摘要』巻上・嘔吐反胃膈噎（原南陽方）\n\n中川成章『証治摘要』に、縮砂を加えた8味の安中散が原南陽の方として引かれている。引かれているのは構成と用法で、内容は「出典」の見出しに記す（要原本照合）\n\n### 注記\n- 「翻胃」は、四庫全書本の『和剤局方』では「翻胃」（翻刻確認）、同じ主治を載せる『普済方』では「反胃」（翻刻確認）、資料の書き下しでは「飜胃」と書かれる。書き下しはどちらにも決めず「翻胃（反胃）」とした\n- 「遠年日近」は、四庫全書本の『和剤局方』では「逺年近日」と書かれる（要原本照合）。資料と別の翻刻本（「远年日近」）に合わせ、本文は「遠年日近」を採った\n- 「攻疰重痛」の「疰」は、別の翻刻本では「注」と書かれる（要原本照合）\n- 原南陽方の「縮砂」は、資料の引用では「宿砂」と書かれる（要原本照合）", "出典": "### 原典の構成\n- 『和剤局方』：延胡索（去皮）・良姜（炒）・乾姜（炮）・茴香（炒）・肉桂 各5両、牡蛎（煅）4両、甘草（炒）10両（翻刻確認）\n- 原南陽方（『証治摘要』の引用）：甘草10両、縮砂・延胡索・良姜・乾姜・茴香・桂枝 各5両、牡蛎4両（要原本照合）\n\n### 原典の服用法\n- 『和剤局方』：細末とし、1回2銭を熱酒で服す。婦人は淡醋湯（薄めた酢）で服す。酒を飲まない者は塩湯で服す。時を問わず服用（翻刻確認）\n- 原南陽方（『証治摘要』の引用）：末とし、1回2銭を熱酒で服す。縮砂を去り牡蛎を3倍にして水で煎じて服す法もある（要原本照合）\n\n### 処方の変遷\n- 安中散は『和剤局方』の宝慶年間（1225〜1227年）の増補（宝慶新増方）に属する（翻刻確認。四庫全書本には宝慶新増の印がない）\n- 『和剤局方』の安中散は乾姜を含み縮砂を含まない7味（翻刻確認）\n- 縮砂を加えた8味の安中散は、中川成章『証治摘要』に原南陽の方として引かれる。原南陽自身の著書には見当たらないとされる（要原本照合）\n- 原南陽『叢桂亭医事小言』巻之四上・噎膈反胃には、牡蛎を3倍にした安中散を癖嚢病に用いる記載があるとされる（要原本照合）\n- 浅田宗伯『勿誤薬室方函』巻上には局方の安中散から乾姜を去り縮砂を加えた方、巻下・散薬部には局方の方そのものが載るとされる（要原本照合）\n- 現行エキス剤（ツムラ5）は 桂皮・延胡索・牡蛎・茴香・縮砂・甘草・良姜 の7味で、乾姜は入っていない（PMDA 添付文書 2023年12月改訂で確認）。縮砂入りの8味から乾姜を去って7味にしたのは浅田宗伯とする説がある（要確認）", "構成": "桂皮・延胡索・牡蛎・茴香・縮砂・甘草・良姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "黄連解毒湯", "名前": "黄連解毒湯", "読み": "おうれんげどくとう", "ツムラ番号": "15", "出典": "肘後百一方（巻二・治傷寒時気温病方第十三）／外台秘要方（巻一・崔氏方の引用）", "本文": {"条文": "### 『肘後百一方』巻二・治傷寒時気温病方第十三\n\n**書き下し**（読み：社員案）\n若し已に六七日、熱極まり、心下煩悶し、狂言して鬼を見、起ちて走らんと欲す。……又方、黄連三両、黄檗・黄芩各二両、梔子十四枚、水六升もて煎じて二升を取り、分けて再服す。煩嘔して眠るを得ざるを治す。\n\n**原文**（翻刻確認）\n若已六七日、熱極、心下煩悶、狂言見鬼、欲起走。……又方、黄連三兩、黄檗・黄芩各二兩、梔子十四枚、水六升、煎取二升、分再服。治煩嘔不得眠。\n\n**現代語訳**（訳：社員案）\n発病してすでに6〜7日たち、熱が極まって、みぞおちが苦しく悶え、うわごとを言って幻を見、起き上がって走り出そうとするもの。……別の方として、黄連3両、黄檗・黄芩各2両、梔子14枚を水6升で煎じて2升を取り、2回に分けて服す。胸苦しくて吐き気があり、眠れないものを治す。\n\n### 『外台秘要方』巻一・崔氏方\n\n**書き下し**（読み：社員案）\n又、前軍督護劉車なる者、時疾を得て三日、已に汗して解す。飲酒に因りて復た劇しく、煩悶・乾嘔に苦しみ、口燥きて呻吟し、錯語して臥するを得ず。余思いて此の黄連解毒湯方を作る。\n\n一服して目明らかに、再服して粥を進め、此に於いて漸く差ゆ。余以て凡そ大熱盛んにして、煩嘔・呻吟し、錯語して眠るを得ざるを療するに、皆佳し。伝えて諸人に語り、之を用いて亦効あり。此れ直ちに熱毒を解し、酷熱を除く。必ずしも飲酒して劇しき者ならず、此の湯もて療すること五日中に神効あり。豬肉・冷水を忌む。\n\n**原文**（翻刻確認）\n又前軍督護劉車者、得時疾三日、已汗解、因飲酒復劇、苦煩悶乾嘔、口燥呻吟、錯語不得卧、余思作此黄連解毒湯方。\n\n一服目明、再服進粥、於此漸差。余以療凡大熱盛、煩嘔呻吟、錯語不得眠、皆佳。傳語諸人、用之亦效。此直解熱毒、除酷熱、不必飲酒劇者、此湯療五日中神效。忌豬肉冷水。\n\n**現代語訳**（訳：社員案）\n前軍督護の劉車という者が、流行病にかかって3日目に、発汗してすでに治っていたが、飲酒によって再びひどくなり、胸苦しい悶えと空えずきに苦しみ、口が乾いてうめき、うわごとを言って横になれなかった。そこで私はこの黄連解毒湯を考えて作った。1回服すと目がはっきりし、2回服すと粥が食べられるようになり、そこから次第に治った。私はこれを用いて、およそ高熱が盛んで、胸苦しく吐き気があってうめき、うわごとを言って眠れないものを治したが、いずれもよく効いた。人々に伝えたところ、用いた者にもやはり効いた。これは直ちに熱毒を解き、激しい熱を除く。飲酒でひどくなったものでなくても、この湯で治療すれば5日のうちに著しく効く。豚肉と冷水を避ける。\n\n### 注記\n- 『肘後百一方』では本方に方名がない。「若已六七日…欲起走」の条の下に並ぶ「又方」の一つとして載り、最後に「治煩嘔不得眠」とある（翻刻確認）\n- 方名「黄連解毒湯」は『外台秘要方』巻一の崔氏方に出る（翻刻確認）\n- 翻刻のページ名は『肘後備急方』（四庫全書本、晋・葛洪撰）。同書の提要に、陶弘景が補って『肘後百一方』とし、楊用道が附広したとある（翻刻確認）\n- 『外台秘要方』の「復劇」の「劇」は、四庫全書本の翻刻では外字のため確認できず、別の翻刻本では「劇」（要原本照合）\n- 『外台秘要方』の「乾嘔」は、別の翻刻本では「幹嘔」と書かれる（機械的な繁体化によるものとみられる。要原本照合）\n- 『外台秘要方』の「余」は、四庫全書本では「余」、別の翻刻本では「餘」（要原本照合）\n- 『外台秘要方』の構成の「黄柏」は、四庫全書本では「黄蘗」と書かれる（要原本照合）", "出典": "### 原典の構成\n- 『肘後百一方』：黄連3両、黄檗（黄柏）・黄芩 各2両、梔子14枚（翻刻確認）\n- 『外台秘要方』（崔氏方）：黄連3両、黄芩・黄柏 各2両、梔子14枚（擘く）（翻刻確認）\n\n### 原典の服用法\n- 『肘後百一方』：水6升で煎じて2升を取り、2回に分けて服す（翻刻確認）\n- 『外台秘要方』（崔氏方）：4味を刻み、水6升で煮て2升を取り、2回に分けて服す。猪肉・冷水を忌む（翻刻確認）\n\n### 処方の変遷\n- 『肘後百一方』に方名のない「又方」として4味が載り、『外台秘要方』巻一の崔氏方で「黄連解毒湯」の名が付く（翻刻確認）\n- 『傷寒活人書』巻十八にも同じ主治で収載される（要原本照合）\n- 劉完素『黄帝素問宣明論方』巻四・熱論では、黄連・黄柏・黄芩・大黄の大金花丸から大黄を去り梔子を加えたものを梔子金花丸とし、巻六・傷寒方では黄連解毒湯を茶と共に煎服する。腹満・嘔吐などに半夏・厚朴・茯苓を加え生姜で煎じる半夏黄連解毒湯の記載もある（要原本照合）\n- 劉完素『傷寒直格方』巻下では、細末にして水で丸じ温水で服す法を載せる（要原本照合）\n- 書によって梔子金花丸に大黄を含むものと含まないものがあり、方名は錯雑している（要原本照合）\n- 『万病回春』巻二・傷寒には柴胡・連翹を加えた6味の黄連解毒湯、同書の火証にはさらに芍薬を加えた方が載る。後者は後の一貫堂の四物黄連解毒湯のもとになったとされる（要原本照合）\n- 『外科正宗』巻二・疔瘡論では、連翹・甘草・牛蒡子を加えて灯心で煎服する（要原本照合）\n- 現行エキス剤（ツムラ15）は 黄芩3.0・黄連2.0・山梔子2.0・黄柏1.5g（7.5g中）の4味（PMDA 添付文書 2023年12月改訂で確認）。原典は黄連が最も多い", "構成": "黄芩・黄連・山梔子・黄柏", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "加味逍遙散", "名前": "加味逍遙散", "読み": "かみしょうようさん", "ツムラ番号": "24", "出典": "万病回春（巻之六・婦人科・虚労）／薛氏医案（内科摘要・巻下・各症方薬）／薛氏医案（女科撮要・附方并注）／薛氏医案（保嬰撮要・脇癰）", "本文": {"条文": "### 『万病回春』巻之六・婦人科・虚労（逍遙散の条）\n\n**書き下し**（読み：社員案）\n虚労にて熱嗽し汗有る者。逍遙散　肝脾の血虚して発熱し、或いは潮熱し、或いは自汗・盗汗し、或いは頭痛・目眩し、或いは怔忡して寧からず、煩赤して口乾き、或いは月経調わず、或いは肚腹痛みを作し、或いは小腹重墜して水道渋痛し、或いは腫痛して膿を出だし、内熱して渇を作すを治す。（方後に）牡丹皮・梔子（炒）を加え、加味逍遙散と名づく。\n\n**原文**（翻刻確認）\n虛勞熱嗽有汗者。逍遙散　治肝脾血虛發熱、或潮熱、或自汗盜汗、或頭痛目眩、或怔忡不寧、煩赤口乾、或月經不調、或肚腹作痛、或小腹重墜水道澀痛、或腫痛出膿、内熱作渴。（方後）加牡丹皮、梔子炒、名加味逍遙散。\n\n**現代語訳**（訳：社員案）\n虚労で熱があって咳をし、汗の出るもの。逍遙散は、肝脾の血虚で発熱し、あるいは潮熱し、あるいは自汗・盗汗し、あるいは頭痛・めまいがし、あるいは動悸がして落ち着かず、顔が赤く口が乾き、あるいは月経が整わず、あるいは腹が痛み、あるいは下腹が重く下がる感じがして尿の出が渋って痛み、あるいは腫れて痛み膿が出て、内に熱があって口が渇くものを治す。（方の後に）牡丹皮・山梔子（炒）を加えたものを加味逍遙散と名づける。\n\n### 『内科摘要』巻下・各症方薬（薛己）\n\n**書き下し**（読み：社員案）\n加味逍遙散　肝脾の血虚して発熱し、或いは潮熱・晡熱し、或いは自汗・盗汗し、或いは頭痛・目渋し、或いは怔忡して寧からず、或いは頬赤く口乾き、或いは月経調わず、肚腹痛みを作し、或いは小腹重墜して水道渋痛し、或いは腫痛して膿を出だし、内熱して渇を作す等の症を治す。\n\n**原文**（翻刻確認）\n加味逍遙散　治肝脾血虛發熱、或潮熱晡熱、或自汗盜汗、或頭痛目澀、或怔忡不寧、或頰赤口乾、或月經不調、肚腹作痛、或小腹重墜、水道澀痛、或腫痛出膿、内熱作渴等症。\n\n**現代語訳**（訳：社員案）\n加味逍遙散は、肝脾の血虚で発熱し、あるいは潮熱・夕方の発熱があり、あるいは自汗・盗汗し、あるいは頭痛がして目がしぶり、あるいは動悸がして落ち着かず、あるいは頬が赤く口が乾き、あるいは月経が整わず腹が痛み、あるいは下腹が重く下がる感じがして尿の出が渋って痛み、あるいは腫れて痛み膿が出て、内に熱があって口が渇くなどの症を治す。\n\n### 『女科撮要』附方并注（薛己）\n\n**書き下し**（読み：社員案）\n加味逍遙散　血虚して熱有り、遍身搔痒し、或いは口燥き咽乾き、発熱・盗汗し、食少なくして嗜臥し、小便渋滞する等の症を治す。\n\n**原文**（翻刻確認）\n加味逍遙散　治血虛有熱、遍身搔癢、或口燥咽乾、發熱盜汗、食少嗜臥、小便澀滯等症。\n\n**現代語訳**（訳：社員案）\n加味逍遙散は、血虚で熱があり、全身がかゆく、あるいは口や喉が乾き、発熱して盗汗し、食が少なく横になりたがり、尿の出が渋って滞るなどの症を治す。\n\n### 『保嬰撮要』脇癰（薛鎧）\n\n**書き下し**（読み：社員案）\n加味逍遙散　小児の肝脾血虚・内熱にて、脇腹痛みを作し、頭目昏黒し、怔忡・頬赤し、口燥き咽乾き、或いは発熱・盗汗し、食少なく寐ねず、或いは口舌に瘡を生じ、胸乳膨脹し、小便利せず、或いは女子前症を患いて、経候調わず、発熱・咳嗽し、寒熱往来する等の症を治す。（方は発熱不止に見ゆ）\n\n**原文**（翻刻確認）\n加味逍遙散　治小兒肝脾血虛内熱、脇腹作痛、頭目昏黑、怔忡頰赤、口燥咽乾、或發熱盜汗、食少不寐、或口舌生瘡、胸乳膨脹、小便不利、或女子患前症、經候不調、發熱咳嗽、寒熱往來等症。（方見發熱不止）\n\n**現代語訳**（訳：社員案）\n加味逍遙散は、小児の肝脾の血虚と内熱で、脇腹が痛み、頭がくらくらして目の前が暗くなり、動悸がして頬が赤く、口や喉が乾き、あるいは発熱して盗汗し、食が少なく眠れず、あるいは口や舌にできものができ、胸や乳が張り、尿の出が悪いもの、あるいは女子が前に挙げた症を患って月経が整わず、発熱して咳をし、寒気と熱が交互に来るなどの症を治す。（方は「発熱不止」の項に載る）\n\n### 注記\n- 『万病回春』の条は逍遙散の条で、加味逍遙散は方後の「牡丹皮・梔子（炒）を加え、加味逍遙散と名づく」の一句だけで示される。加味逍遙散だけの条はない（翻刻確認）\n- 『万病回春』の「煩赤口乾」は、『内科摘要』では「頰赤口乾」（要原本照合）\n- 『万病回春』の「目眩」は、『内科摘要』では「目澀」。『万病回春』の条には『内科摘要』の「晡熱」がない（翻刻確認）\n- 維基文庫の『萬病回春』『内科摘要』『女科撮要』『保嬰撮要』は簡体字の本で、原文は社員が繁体字に直した。字形（澀／渋、癢／痒など）は要原本照合\n- 『保嬰撮要』の脇癰は、維基文庫の本では巻十三にある。資料は巻十一とする（要原本照合）\n- 『保嬰撮要』の方は「発熱不止」の項の方を採った（柴胡7分）。同書の巻三・天釣内釣の項の方では柴胡が1銭（要原本照合）\n- 『女科撮要』の附方并注は、維基文庫の本では巻末の「附方并注」の先頭に加味逍遙散があり、続けて「逍遙散　即ち前方より丹皮・山梔を去る」とある（翻刻確認）", "出典": "### 原典の構成\n- 『万病回春』巻之六・虚労：逍遙散（当帰（酒洗）・白芍（酒炒）・白朮（土炒）・白茯苓・柴胡（酒炒） 各1銭、甘草（炙）5分）に牡丹皮・梔子（炒）を加える。加える量の記載はない（翻刻確認）\n- 『内科摘要』巻下・各症方薬：当帰・芍薬・茯苓・白朮（炒）・柴胡 各1銭、牡丹皮・山梔（炒）・甘草（炙） 各5分（翻刻確認）\n- 『女科撮要』附方并注：甘草（炙）・当帰（炒）・芍薬（酒炒）・茯苓・白朮（炒）・柴胡 各1銭、牡丹皮・山梔（炒） 各5分（翻刻確認）\n- 『保嬰撮要』発熱不止の方：当帰・甘草（炙）・芍薬（酒拌）・茯苓・白朮（炒） 各1銭、柴胡・牡丹皮・山梔（炒） 各7分（翻刻確認。柴胡の異同は条文の注記を参照）\n\n### 原典の服用法\n- 『万病回春』：1剤に刻み、煨姜1片・薄荷少々を入れて水で煎じて服す（翻刻確認）\n- 『内科摘要』：水で煎じて服す（翻刻確認）\n- 『女科撮要』：水で煎じて服す（翻刻確認）\n- 『保嬰撮要』発熱不止の方：4剤に分けて水で煎じて服す。乳母の肝脾血虚・内熱、あるいは寒熱・遍身瘙痒などの症にとくに宜しい（翻刻確認）\n\n### 処方の変遷\n- 原方は逍遙散。逍遙散の出典は『太平恵民和剤局方』巻之九・婦人諸疾（附産図）で、甘草・芍薬・当帰・茯苓・白朮・柴胡を粗末とし、煨生姜・薄荷で煎服する。資料は、『和剤局方』には加味逍遙散は載らず、逍遙散は原書五巻本に登載されるとする（要原本照合）\n- 資料の出典欄には『太平恵民和剤局方』『薛氏医案』『万病回春』が並ぶ。『和剤局方』は原方の逍遙散の出典にあたる\n- 『聖済総録』巻第百五十・婦人血風門には、逍遙飲が2方載る。婦人血風走注の方は柴胡・白茯苓・赤芍薬・白朮・当帰を粗く搗き、生姜・棗・甘草で煎服する。婦人血風身体骨節疼痛の方は白茯苓・柴胡・白朮・当帰・赤芍薬・甘草を粗く搗いて煎服する（要原本照合）\n- 『世医得効方』（危亦林編撰）巻第十五・産科兼婦人雑病科・癲狂には同名の加味逍遙散があり、局方の逍遙散の6味に姜・麦門冬を調理とし、遠志・桃仁・蘇木・紅花を加える（要原本照合）\n- 逍遙散に牡丹皮・山梔子を加えたのは薛己で、『内科摘要』各症方薬に載る（翻刻確認）。『内科摘要』『女科撮要』『保嬰撮要』の加味逍遙散には生姜・薄荷が入らない（翻刻確認）。資料は、『明医雑著』附方の加味逍遙散は「姜水煎服」で生姜はあるが薄荷はないとする（要原本照合）\n- 資料は、『薛氏医案』十六種のうち『保嬰粋要』『保嬰金鏡録』『銭氏小児直訣』『小児痘疹方論』にも加味逍遙散が載るとする（要原本照合）\n- 『万病回春』巻之六・婦人科・虚労の逍遙散は、煨姜・薄荷を入れて煎じ、牡丹皮・梔子を加えて加味逍遙散とする（翻刻確認）。資料は、ここで初めて十味の加味逍遙散が登載されたとする\n- 資料は、張三錫『医学六要』治法彙七巻・婦人門・経水の逍遙散の条に「丹皮・梔子加うるは更に佳し」とあるとする（要原本照合）\n- 現行エキス剤（ツムラ24）は 柴胡・芍薬・蒼朮・当帰・茯苓・山梔子・牡丹皮・甘草・生姜・薄荷 の10味で、朮は蒼朮（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "柴胡・芍薬・蒼朮・当帰・茯苓・山梔子・牡丹皮・甘草・生姜・薄荷", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "越婢加朮湯", "名前": "越婢加朮湯", "読み": "えっぴかじゅつとう", "ツムラ番号": "28", "出典": "金匱要略（水気病脈証并治第十四）／金匱要略（中風歴節病脈証并治第五・千金方の引用）", "本文": {"条文": "### 『金匱要略』水気病脈証并治第十四（裏水の条）\n\n**書き下し**（読み：社員案）\n裏水なる者は、一身面目黄腫し、其の脈沈、小便不利す、故に水を病ましむ。仮如し小便自利すれば、此れ津液を亡う、故に渇せしむるなり。越婢加朮湯之を主る。（方は下に見ゆ）\n\n**原文**（翻刻確認）\n裏水者，一身面目黃腫，其脈沉，小便不利，故令病水。假如小便自利，此亡津液，故令渴也。越婢加朮湯主之。（方見下）\n\n**現代語訳**（訳：社員案）\n裏水とは、全身と顔・目が黄色く腫れ、脈は沈で、小便の出が悪いもので、そのために水の病となる。もし小便が自然によく出るなら、それは津液を失っているので、口が渇くようになる。越婢加朮湯がこれを主治する。\n\n### 『金匱要略』水気病脈証并治第十四（裏水の条・2か所目）\n\n**書き下し**（読み：社員案）\n裏水は、越婢加朮湯之を主る。甘草麻黄湯も亦之を主る。\n\n**原文**（翻刻確認）\n裏水，越婢加朮湯主之；甘草麻黃湯亦主之。\n\n**現代語訳**（訳：社員案）\n裏水には越婢加朮湯が主治する。甘草麻黄湯もまたこれを主治する。\n\n### 『金匱要略』中風歴節病脈証并治第五・附方（『千金方』越婢加朮湯）\n\n**書き下し**（読み：社員案）\n肉極にて、熱すれば則ち身体の津脱し、腠理開きて汗大いに泄れ、厲風の気あり、下焦の脚弱きを治す。\n\n**原文**（翻刻確認）\n治肉極，熱則身體津脫，腠理開，汗大泄，厲風氣，下焦腳弱。\n\n**現代語訳**（訳：社員案）\n肉極で、熱があると体の津液が抜け出し、腠理（皮膚のきめ）が開いて汗が大量に漏れ、厲風の気があり、下半身の脚が弱いものを治す。\n\n### 関連条文（越婢湯の条）\n\n**書き下し**（読み：社員案）\n風水、悪風し、一身悉く腫れ、脈浮にして渇せず、続いて自ずから汗出で、大熱無きは、越婢湯之を主る。\n\n**原文**（翻刻確認）\n風水惡風，一身悉腫，脈浮不渴，續自汗出，無大熱，越婢湯主之。（「惡風」は要原本照合）\n\n**現代語訳**（訳：社員案）\n風水で、風を嫌い、全身がことごとく腫れ、脈は浮で口は渇かず、汗が絶えず自然に出て、ひどい熱のないものは、越婢湯が主治する。\n\n### 注記\n- 「朮」は、四部叢刊本（明嘉靖俞橋刊本の影印）の翻刻では「术」と書かれる（要原本照合）\n- 千金方越婢加朮湯の「肉極」は、四部叢刊本の翻刻では「内極」と書かれる（要原本照合）\n- 越婢湯の条の「惡風」は、四部叢刊本の翻刻では「急風」と書かれる（要原本照合）\n- 千金方越婢加朮湯の生姜は、越婢湯本体と一致する3両（四部叢刊本の翻刻）を本文に採った。別の翻刻本では2両（要原本照合）\n- 千金方越婢加朮湯の煎じ方の「先煮麻黃去沫」は、四部叢刊本の翻刻では「去上沫」と書かれる（要原本照合）\n- 「一身面目黃腫」の「黃」は『脈経』では「洪」とされる（要原本照合。資料50頁の引用による）\n- 越婢湯の条は越婢加朮湯の元の方の条として載せた。越婢加朮湯の方はこの条の後ろの越婢湯の方に朮を加えたものとして示される（「出典」を参照）", "出典": "### 原典の構成\n- 『金匱要略』水気病第十四（越婢加朮湯）：越婢湯（麻黄6両、石膏半斤、生姜3両、大棗15枚、甘草2両）に白朮4両を加える（翻刻確認）\n- 『金匱要略』中風歴節病第五・附方（『千金方』越婢加朮湯）：麻黄6両、石膏半斤、生姜3両、甘草2両、白朮4両、大棗15枚（翻刻確認。生姜の異同は条文の注記を参照）\n\n### 原典の服用法\n- 『金匱要略』水気病第十四（越婢湯の方）：5味を水6升で、まず麻黄を煮て上の泡を去り、残りの薬を入れて3升に煮詰め、3回に分けて温服する。悪風する者は附子1枚（炮）を加える。風水には朮4両を加える（古今録験）（翻刻確認）\n- 越婢加朮湯は越婢湯の方の中に白朮4両を加えるとだけあり、別の煎じ方の記載はない（翻刻確認）\n- 『金匱要略』中風歴節病第五・附方（『千金方』越婢加朮湯）：6味を水6升で、まず麻黄を煮て上の泡を去り、残りの薬を入れて3升に煮詰め、3回に分けて温服する。悪風には附子1枚（炮）を加える（翻刻確認）\n\n### 処方の変遷\n- 水気病第十四の越婢加朮湯の条には「方は下に見ゆ」とあり、方は越婢湯の後ろに「越婢湯の中に白朮4両を加える。また脚気の中にも見える」という注で示される（翻刻確認）\n- 越婢湯の方後に、風水には朮4両を加えるという『古今録験』の注がある（翻刻確認）\n- 中風歴節病第五の附方に、『千金方』の越婢加朮湯として同じ6味が肉極の方として載る（翻刻確認）\n- 原典の朮は、越婢加朮湯の方後注と『千金方』の附方では「白朮」、越婢湯の方後の『古今録験』の注では「朮」とだけ書かれる（翻刻確認）\n- 現行エキス剤（ツムラ28）は 石膏・麻黄・蒼朮・大棗・甘草・生姜 の6味で、朮は蒼朮（PMDA 添付文書 2023年12月改訂で確認）", "構成": "石膏・麻黄・蒼朮・大棗・甘草・生姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "桂枝湯", "名前": "桂枝湯", "読み": "けいしとう", "ツムラ番号": "45", "出典": "傷寒論（巻第二・弁太陽病脈証并治上第五）／金匱要略（婦人産後病脈証并治第二十一・婦人妊娠病脈証并治第二十）", "本文": {"条文": "### 『傷寒論』巻第二・弁太陽病脈証并治上第五\n\n**書き下し**（読み：社員案）（1条目：太陽中風）\n太陽の中風、陽浮にして陰弱、陽浮なる者は熱自ずから発し、陰弱なる者は汗自ずから出づ。嗇嗇として悪寒し、淅淅として悪風し、翕翕として発熱し、鼻鳴り乾嘔する者は、桂枝湯之を主る。\n\n**原文**（翻刻確認）\n太陽中風，陽浮而陰弱，陽浮者，熱自發，陰弱者，汗自出。嗇嗇惡寒，淅淅惡風，翕翕發熱，鼻鳴乾嘔者，桂枝湯主之。\n\n**現代語訳**（訳：社員案）\n太陽病の中風で、陽が浮き陰が弱い。陽が浮くものは熱がひとりでに出て、陰が弱いものは汗がひとりでに出る。嗇嗇と寒けがし、淅淅と風を嫌い、翕翕と熱が出て、鼻が鳴り、からえずきするものは、桂枝湯が主治する。\n\n**書き下し**（読み：社員案）（2条目：頭痛・発熱・汗出・悪風。1条目の方の後に続く）\n太陽病、頭痛、発熱、汗出で、悪風するは、桂枝湯之を主る。\n\n**原文**（翻刻確認）\n太陽病，頭痛，發熱，汗出，惡風，桂枝湯主之。\n\n**現代語訳**（訳：社員案）\n太陽病で、頭痛と発熱があり、汗が出て、風を嫌うものは、桂枝湯が主治する。\n\n### 『金匱要略』婦人産後病脈証并治第二十一（陽旦湯）\n\n**書き下し**（読み：社員案）\n産後の風、之に続くこと数十日解せず、頭微しく痛み、悪寒し、時時熱有り、心下悶え、乾嘔し、汗出づ。久しと雖も、陽旦の証続きて在るのみ。陽旦湯を与うべし。（即ち桂枝湯なり。方は下利の中に見ゆ）\n\n**原文**（翻刻確認）\n產後風，續之數十日不解，頭微痛，惡寒，時時有熱，心下悶，乾嘔，汗出，雖久，陽旦證續在耳，可與陽旦湯。（即桂枝湯，方見下利中。）\n\n**現代語訳**（訳：社員案）\n産後の風邪が数十日続いて治らず、頭が少し痛み、寒けがし、ときどき熱があり、みぞおちがもだえ苦しく、からえずきし、汗が出る。長引いていても、陽旦の証が続いているだけである。陽旦湯を与えてよい。（陽旦湯とは桂枝湯のことで、方は下利の篇に載る）\n\n### 『金匱要略』婦人妊娠病脈証并治第二十\n\n**書き下し**（読み：社員案）\n師曰く、婦人平脈を得、陰脈小弱、其の人渇して食すること能わず、寒熱無きは、妊娠と名づく。桂枝湯之を主る。（方は下利の中に見ゆ）\n\n**原文**（翻刻確認）\n師曰：婦人得平脈，陰脈小弱，其人渴，不能食，無寒熱，名妊娠，桂枝湯主之。（方見下利中）\n\n**現代語訳**（訳：社員案）\n師が言う。婦人の脈が平常で、陰の脈がやや弱く、その人がのどが渇いて食べられず、悪寒も発熱もないものは、妊娠という。桂枝湯が主治する。（方は下利の篇に載る）\n\n### 関連条文（禁忌）\n\n『傷寒論』巻第二・弁太陽病脈証并治上第五。桂枝湯を与えてはいけない例として、資料が『傷寒尚論篇』の引用で挙げる3条。\n\n**書き下し**（読み：社員案）（解肌の薬であること）\n桂枝は本解肌を為す。若し其の人脈浮緊、発熱して汗出でざる者は、之を与うべからざるなり。常に須らく此を識り、誤らしむること勿かるべし。\n\n**原文**（翻刻確認）\n桂枝本為解肌，若其人脈浮緊，發熱汗不出者，不可與之也，常須識此，勿令誤也。\n\n**現代語訳**（訳：社員案）\n桂枝湯はもともと肌を解く薬である。もしその人の脈が浮緊で、発熱して汗が出ないものには、与えてはならない。常にこのことを心得て、誤らせてはならない。\n\n**書き下し**（読み：社員案）（酒客）\n若し酒客病めば、桂枝湯を与うべからず。之を得れば則ち嘔す。酒客は甘きを喜ばざるを以っての故なり。\n\n**原文**（翻刻確認）\n若酒客病，不可與桂枝湯，得之則嘔，以酒客不喜甘故也。\n\n**現代語訳**（訳：社員案）\n酒飲みが病んだときは、桂枝湯を与えてはならない。飲めば吐く。酒飲みは甘いものを好まないからである。\n\n**書き下し**（読み：社員案）（服して吐く者）\n凡そ桂枝湯を服して吐する者は、其の後必ず膿血を吐するなり。\n\n**原文**（翻刻確認）\n凡服桂枝湯吐者，其後必吐膿血也。\n\n**現代語訳**（訳：社員案）\nおよそ桂枝湯を飲んで吐くものは、その後に必ず膿血を吐く。\n\n### 注記\n- 資料のルビ：淅淅は「セキセキ」、翕翕は「キュウキュウ」、漐漐は「チュウチュウ」。嗇嗇のルビは小さくて読めない（要確認）\n- 禁忌の1条目は、宋本の翻刻では「太陽病三日，已發汗，若吐、若下、若溫針，仍不解者，此為壞病，桂枝不中與之也。觀其脈證，知犯何逆，隨證治之。」に続く同じ条の後半（翻刻確認）\n- 宋本の翻刻の並びは、解肌の条 → 酒客の条 → 喘家の条 → 服して吐く者の条。資料が引く『傷寒尚論篇』は、解肌 → 服して吐く者 → 酒客の順で、字句にも多少の違いがあるとされる（要原本照合）\n- 1条目は、『備急千金要方』巻第九では「濇濇として悪風し、淅淅として悪寒し」と悪風・悪寒が逆になっているとされる（要原本照合）。また「陽浮」の上に「其脈」の2字があるとされる（要原本照合）\n- 婦人妊娠の条は、翻刻では「於法六十日當有此證；設有醫治逆者，卻一月加吐下者，則絕之。」と続く（翻刻確認）。資料は「桂枝湯之を主る」までを引く\n- 『金匱要略』の四部叢刊本の翻刻は、婦人産後の条の「雖久」を「雖又」、「名妊娠」を「名姙娠」と書き、婦人妊娠の条の小字注を「方見利中」と書く（要原本照合）。本文は通行本の翻刻の字を採った\n- 『金匱要略』の桂枝湯方は、嘔吐噦下利病脈証并治第十七の「下利腹脹滿，身體疼痛者，先溫其裏，乃攻其表。溫裏宜四逆湯，攻表宜桂枝湯。」の条に付く（翻刻確認）。維基文庫の通行本の翻刻には方の本文がなく、四部叢刊本の翻刻（巻中）で確かめた\n- 四部叢刊本『金匱要略』の翻刻では甘草が「三两炙」（要原本照合）。原典の構成は、『傷寒論』と添付文書の比率に合う2両を採った\n- 四部叢刊本『金匱要略』の服用法は、「右五味㕮咀」（宋本『傷寒論』は「㕮咀三味」）、「啜稀粥」（宋本は「啜熱稀粥」）、「如水淋漓」（宋本は「如水流漓」）と書かれ、漐漐は熱の異体字（U+24360）を重ねた字で書かれる。「一服汗出病差停後服」までで、その後の服し方と禁忌の句はない（要原本照合）", "出典": "### 原典の構成\n- 『傷寒論』（宋本）：桂枝3両（去皮）、芍薬3両、甘草2両（炙）、生姜3両（切）、大棗12枚（擘）（翻刻確認）\n- 『金匱要略』（嘔吐噦下利病篇）：桂枝3両（去皮）、芍薬3両、甘草2両（炙）、生姜3両、大棗12枚（要原本照合。四部叢刊本の翻刻では甘草3両。注記）\n\n### 原典の服用法\n- 『傷寒論』（宋本）：5味のうち3味を刻み、水7升で微火で煮て3升を取り、滓を去り、冷めすぎず熱すぎない温度で1升を服す。服し終えてしばらくして熱い薄粥を1升余りすすり、薬力を助ける。衣をかけて温め、2時間ほど全身がしっとりと微かに汗ばむようにするのがよく、水が流れ滴るほど汗をかかせてはならない（それでは病は除かれない）。1服で汗が出て病が治れば、残りは服さない。汗が出なければ同じ方法でまた服し、それでも出なければ間隔を少し詰めて、半日ほどで3服を飲み尽くす。病が重ければ昼夜通して服し、一昼夜様子を見て、1剤を飲み尽くしても病証が残れば、また作って服す。汗が出なければ2〜3剤まで服す。生もの・冷たいもの、粘りけやぬめりのあるもの、肉・麺、五辛、酒・乳製品、においの悪いものなどを禁ず（翻刻確認）\n- 『金匱要略』：5味を刻み、水7升で微火で煮て3升を取り、滓を去り、ほどよい温度で1升を服す。服し終えたら薄粥1升をすすって薬力を助ける。衣をかけて温め、2時間ほど全身がしっとりと微かに汗ばむようにするのがよく、水が滴るほど汗をかかせてはならない。1服で汗が出て病が治れば、残りは服さない（要原本照合。四部叢刊本の翻刻による。宋本『傷寒論』との違いは注記）\n\n### 処方の変遷\n- 『傷寒論』の最初に出てくる方剤で、太陽病中風の基本処方とされる。『傷寒論』では二十数か所に載る（資料の記載）\n- 『金匱要略』では陽旦湯ともいう。婦人産後病篇の陽旦湯の条の小字注に「即桂枝湯，方見下利中」とある（翻刻確認）\n- 『備急千金要方』巻第九 傷寒上・発汗湯第五には、桂枝湯（条文の悪風・悪寒が原典と逆）のほか、芍薬・甘草・乾姜・黄芩・桂心・大棗の陰旦湯と、桂枝湯と同じ主治の陽旦湯（自汗・渇・下利・心下悸・虚労裏急などの加減法つき）が載るとされる（要原本照合）\n- 『外台秘要方』第二巻 傷寒下・傷寒中風方では、『古今録験方』の陽旦湯として『千金方』の陽旦湯と同じ条文・加減法が載り、構成は大棗・桂枝・芍薬・生姜・甘草・黄芩（桂枝湯加黄芩）とされる。このため後世、陽旦湯は桂枝湯加黄芩とみなされることが多い（要原本照合）\n- 『太平聖恵方』巻第九・治傷寒一日候諸方の桂枝湯方は、桂枝・附子・乾姜・甘草・麻黄に葱白を入れて煎じる同名異方。同じ箇所に、桂心・赤芍薬・甘草に生姜・棗を入れて煎じる、名前のない事実上の桂枝湯も載るとされる（要原本照合）\n- 『太平恵民和剤局方』巻之二・傷寒附中暑の桂枝湯では、春の末から夏至の前までは黄芩半両を、夏至の後は知母半両・石膏2両、あるいは升麻半両を加えるとされる（要原本照合）\n- 現行エキス剤（ツムラ45）は 桂皮・芍薬・大棗・甘草・生姜 の5味（PMDA 添付文書 2023年12月改訂 第1版で確認）。原典の「桂枝」は、資料の組成欄では「桂皮」と書かれる", "構成": "桂皮・芍薬・大棗・甘草・生姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "荊芥連翹湯", "名前": "荊芥連翹湯", "読み": "けいがいれんぎょうとう", "ツムラ番号": "50", "出典": "万病回春（巻之五・耳病）／万病回春（巻之五・鼻病）／一貫堂方", "本文": {"条文": "### 『万病回春』巻之五・耳病\n\n**書き下し**（読み：社員案）\n両耳腫痛する者は、腎経に風熱有るなり。荊芥連翹湯。\n\n**原文**（翻刻確認）\n兩耳腫痛者、腎經有風熱也。荊芥連翹湯\n\n**現代語訳**（訳：社員案）\n両耳が腫れて痛むものは、腎経に風熱があるのである。荊芥連翹湯（を用いる）。\n\n### 『万病回春』巻之五・鼻病\n\n**書き下し**（読み：社員案）\n鼻淵の者は、胆、熱を脳に移すなり。荊芥連翹湯。\n\n**原文**（翻刻確認）\n鼻淵者、膽移熱於腦也。荊芥連翹湯\n\n**現代語訳**（訳：社員案）\n鼻淵は、胆が熱を脳に移したものである。荊芥連翹湯（を用いる）。\n\n### 注記\n- 『万病回春』の翻刻は簡体字の本で、原文は繁体字にそろえて書いた（两→兩、肿→腫、肾经→腎經、风热→風熱、胆→膽、热→熱、脑→腦、于→於 など）。字形の判断には使えない（要原本照合）\n- 同じ方名で、耳病と鼻病に構成の違う2方が載る。現行の荊芥連翹湯は一貫堂（森道伯）がこの2方を合わせ、黄連・黄柏を加えたものとされる（要原本照合）\n- 2方の順は、『万病回春』の掲載順（耳病が先）にした（要確認）", "出典": "### 原典の構成\n- 『万病回春』巻之五・耳病：荊芥・連翹・防風・当帰・川芎・白芍・柴胡・枳殻・黄芩・山梔・白芷・桔梗 各等分、甘草 減半（翻刻確認）\n- 『万病回春』巻之五・鼻病：荊芥・柴胡・川芎・当帰・生地黄・芍薬・白芷・防風・薄荷・山梔・黄芩・桔梗・連翹 各等分、甘草 減半（翻刻確認）\n\n### 原典の服用法\n- 『万病回春』巻之五・耳病：1剤に刻み、水で煎じて食後に服す（翻刻確認）\n- 『万病回春』巻之五・鼻病：刻んで散とし、水で煎じて食遠（食事から間をあけて）服す（翻刻確認）\n\n### 処方の変遷\n- 現行の荊芥連翹湯は一貫堂方。資料は『漢方一貫堂医学』により、『万病回春』巻之五の耳病・鼻病の同名方を基源とし、森道伯がこの2方を合方して黄連・黄柏を加え、一貫堂の青年期解毒証体質改善薬としたとする（要原本照合）\n- 耳病の方は現行方から地黄・黄連・黄柏・薄荷を去った形、鼻病の方は現行方から黄連・黄柏・枳殻を去った形（翻刻確認）\n- 資料は、一貫堂方としては四物湯に『万病回春』の黄連解毒湯（通常の黄連解毒湯加柴胡・連翹）を合方し甘草を加えた四物黄連解毒湯（温清飲加柴胡・連翹・甘草）に、ほかの薬味を配した方剤とする（要原本照合）\n- 四物湯の出典は『理傷続断方』、黄連解毒湯の出典は『肘後百一方』とされる。資料の出典欄にはこの2書も挙がる（要確認）\n- 一貫堂方では枳殻で処方されるが、医療用エキス剤では枳実で処方される\n- 現行エキス剤（ツムラ）は7.5g中、黄芩・黄柏・黄連・桔梗・枳実・荊芥・柴胡・山梔子・地黄・芍薬・川芎・当帰・薄荷・白芷・防風・連翹 各1.5g、甘草1.0g の17味（PMDA 添付文書 2023年12月改訂 第1版で確認）。添付文書に出典の欄はない", "構成": "黄芩・黄柏・黄連・桔梗・枳実・荊芥・柴胡・山梔子・地黄・芍薬・川芎・当帰・薄荷・白芷・防風・連翹・甘草", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "桂枝加芍薬湯", "名前": "桂枝加芍薬湯", "読み": "けいしかしゃくやくとう", "ツムラ番号": "60", "出典": "傷寒論（巻第六・弁太陰病脈証并治第十）", "本文": {"条文": "### 『傷寒論』巻第六・弁太陰病脈証并治第十\n\n**書き下し**（読み：社員案）\n本太陽病、医反って之を下し、爾るに因りて腹満し時に痛む者は、太陰に属するなり。桂枝加芍薬湯之を主る。大いに実痛する者は、桂枝加大黄湯之を主る。\n\n**原文**（翻刻確認）\n本太陽病，醫反下之，因爾腹滿時痛者，屬太陰也，桂枝加芍藥湯主之；大實痛者，桂枝加大黃湯主之。\n\n**現代語訳**（訳：社員案）\nもとは太陽病であったのに、医師がかえって下したため、腹が張って時に痛むものは、太陰に属する。桂枝加芍薬湯が主治する。ひどく実して痛むものは、桂枝加大黄湯が主治する。\n\n### 注記\n- 条の後半（大いに実痛する者）は桂枝加大黄湯の条で、同じ条にまとめて書かれている（翻刻確認）\n- 『金匱玉函経』巻第四・弁太陰病形証治第七の翻刻では、同じ条が「太陽病，醫反下之，因爾腹滿時痛者，屬太陰也，桂枝加芍藥湯主之。大實痛者，桂枝加大黃湯主之。」で、冒頭の「本」がない（翻刻確認）\n- 『金匱玉函経』巻第六・弁発汗吐下後病形証治第十九の翻刻では「太陽病，醫反下之，因腹滿時痛，為屬太陰，屬桂枝加芍藥湯證，其大實痛，屬桂枝加大黃湯證。」と書かれ、「爾」がなく「為屬太陰」となる（要原本照合）\n- 宋本の巻第十・弁発汗吐下後脈証并治第二十二に再掲された方は「第二巻の桂枝湯方の内に、更に芍薬三両を加え、前に随いて共に六両、余は桂枝湯の法に依る」と書かれる（要原本照合）", "出典": "### 原典の構成\n- 『傷寒論』（宋本）：桂枝3両（去皮）、芍薬6両、甘草2両（炙）、生姜3両（切）、大棗12枚（擘）（翻刻確認）\n- 『金匱玉函経』巻第七・方薬炮製（桂枝倍加芍薬湯方第十二）：桂枝3両、芍薬6両、生姜3両、甘草2両（炙）、大棗12枚（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』（宋本）：5味を水7升で煮て3升を取り、滓を去って、温めて3回に分けて服す。もとは桂枝湯で、今芍薬を加えたもの、と添える（翻刻確認）\n- 『金匱玉函経』：5味を㕮咀し、水7升で煮て3升を取り、滓を去って1升を温服する。もとは桂枝湯で、今芍薬を加えて用いる、と添える（翻刻確認）\n\n### 処方の変遷\n- 桂枝湯と同じ構成で、芍薬を倍にしたもの（翻刻確認）\n- 『金匱玉函経』では桂枝倍加芍薬湯の名で載る（翻刻確認）\n- 『傷寒総病論』巻第一・太陰証では、条文は同じで方名が桂枝芍薬湯とされる（要原本照合）\n- 『三因極一病証方論』巻之四・傷風証治の桂枝芍薬湯は、桂心半両・白芍薬3両を姜棗で煎服する方で、甘草を含まない（要原本照合）\n- 現行エキス剤（ツムラ60）は 芍薬・桂皮・大棗・甘草・生姜 の5味で、1日量7.5g中 シャクヤク6.0・ケイヒ4.0・タイソウ4.0・カンゾウ2.0・ショウキョウ1.0（g）の混合生薬の乾燥エキスを含む（PMDA 添付文書 2023年12月改訂 第1版で確認）。原典の「桂枝」は、添付文書では「ケイヒ」と書かれる", "構成": "芍薬・桂皮・大棗・甘草・生姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "帰脾湯", "名前": "帰脾湯", "読み": "きひとう", "ツムラ番号": "65", "出典": "薛氏医案（内科摘要・巻上・各症方薬）／厳氏済生方（健忘論治）／玉機微義（巻之十七・血証門・補剤）", "本文": {"条文": "### 『内科摘要』巻上・各症方薬（薛己）\n\n**書き下し**（読み：社員案）\n帰脾湯　思慮、脾を傷り、血を摂すること能わず、血の妄行を致し、或いは健忘・怔忡・驚悸・盗汗し、或いは心脾痛みを作し、嗜臥して食少なく、大便調わず、或いは肢体重痛し、月経調わず、赤白帯下し、或いは思慮、脾を傷りて瘧・痢を患うを治す。\n\n**原文**（翻刻確認）\n歸脾湯　治思慮傷脾、不能攝血、致血妄行、或健忘、怔忡、驚悸、盜汗、或心脾作痛、嗜臥少食、大便不調、或肢體重痛、月經不調、赤白帶下、或思慮傷脾而患瘧、痢。\n\n**現代語訳**（訳：社員案）\n帰脾湯は、思い悩みが脾を傷り、血を統べ収めることができず、血がみだりに巡って出血するもの、あるいは物忘れ・動悸・驚きやすさ・寝汗があるもの、あるいは心窩部から胸が痛み、横になりたがって食が少なく、便通が整わないもの、あるいは手足や体が重く痛み、月経が整わず、赤白のおりものがあるもの、あるいは思い悩みで脾を傷って瘧（おこり）や痢（下痢）を患うものを治す。\n\n### 『厳氏済生方』健忘論治（厳用和）\n\n**書き下し**（読み：社員案）\n帰脾湯　思慮過度にして、心脾を労傷し、健忘・怔忡するを治す。\n\n**原文**（翻刻確認）\n歸脾湯　治思慮過度、勞傷心脾、健忘怔忡。\n\n**現代語訳**（訳：社員案）\n帰脾湯は、思い悩みが度を過ぎて心と脾を疲れ傷り、物忘れや動悸があるものを治す。\n\n### 『玉機微義』巻之十七・血証門・補剤（徐用誠原輯・劉純続増）\n\n**書き下し**（読み：社員案）\n帰脾湯　思慮、脾を傷り、心血を統摂すること能わず、此れを以て妄行を致し、或いは吐血・下血するを治す。\n\n**原文**（翻刻確認）\n歸脾湯　治思慮傷脾、不能統攝心血、以此致妄行、或吐血下血。\n\n**現代語訳**（訳：社員案）\n帰脾湯は、思い悩みが脾を傷り、心血を統べ収めることができず、そのために血がみだりに巡って出血し、あるいは吐血・下血するものを治す。\n\n### 注記\n- 条文の順：現行エキス剤と同じ構成（当帰・遠志を含み、茯苓を用いる）の『内科摘要』を先頭にし、当帰・遠志がなく茯神を用いる『厳氏済生方』『玉機微義』を後ろに置いた\n- 『厳氏済生方』の「思慮過度」は、資料の書き下しでは「思慮、制を過ぎ」（原文「過制」にあたる）。維基文庫の2つの翻刻はどちらも「過度」（要原本照合）\n- 『厳氏済生方』の巻：資料は巻之三・健忘論治とする。維基文庫の四庫全書本では卷四・健忘、もう一つの本（簡体字）では驚悸怔忡健忘門・健忘論治（要原本照合）\n- 『内科摘要』の帰脾湯は、維基文庫の本では卷上・十二、各症方薬にある。卷下・各症方薬にはない（翻刻確認）\n- 維基文庫の『内科摘要』と『濟生方』（四庫全書本でない方）は簡体字の本で、原文は社員が繁体字に直した。字形は要原本照合\n- 「黃耆」は、四庫全書本の『濟生方』『玉機微義』では「黄茋」。簡体字の『内科摘要』『濟生方』では「黄」の次の字が欠けている（要原本照合）", "出典": "### 原典の構成\n- 『内科摘要』巻上・各症方薬：人参・白朮・白茯苓・黄耆・竜眼肉・酸棗仁 各2銭、遠志1銭、木香・甘草（炙） 各5分、当帰1銭（翻刻確認）\n- 『厳氏済生方』健忘論治：白朮・茯神（木を去る）・黄耆（蘆を去る）・竜眼肉・酸棗仁（炒り、殻を去る） 各1両、人参・木香（火を見ず） 各半両、甘草（炙）2銭半（翻刻確認）\n- 『玉機微義』巻之十七・血証門・補剤：白朮・茯神・黄耆・竜眼肉・酸棗仁 各1両、人参・木香 各半両、甘草（炙）2銭半（翻刻確認）\n- 『厳氏済生方』の茯神は、四庫全書本の翻刻では「茯苓（去木）」（要原本照合）\n- 『玉機微義』の方に、資料は当帰を挙げる。維基文庫の四庫全書本には当帰がない（要原本照合）\n\n### 原典の服用法\n- 『内科摘要』：生姜・大棗を入れ、水で煎じて服す（翻刻確認）\n- 『厳氏済生方』：㕮咀し、1回4銭を、水1盞半に生姜5片・棗子1枚を入れて7分に煎じ、滓を去って温服する。時を問わない（翻刻確認）\n- 『玉機微義』：㕮咀し、1回4〜5銭を、棗・姜を入れて煎じる（翻刻確認）\n- 『厳氏済生方』の「棗子一枚」は、四庫全書本の翻刻では「棗一枚」（要原本照合）\n\n### 処方の変遷\n- 本方は四君子湯に黄耆・当帰・竜眼肉・酸棗仁・遠志・木香を加えた形の方。資料は、本方の出典はまず四君子湯の出典を考えに入れる必要があるとする。四君子湯の出典は資料のこの項に書かれていない（要確認）\n- 一般に本方の出典は『厳氏済生方』とされる。『厳氏済生方』の方には当帰・遠志がなく、茯苓ではなく茯神を用いる（翻刻確認）。資料は、『厳氏済生方』は現在の帰脾湯の原方の出典というにとどまるとする\n- 『玉機微義』巻之十七・血証門・補剤の帰脾湯は、主治に吐血・下血が入る（翻刻確認）。資料は『厳氏済生方』の方に当帰を加えたものとするが、維基文庫の四庫全書本では当帰がなく、『厳氏済生方』と同じ8味（要原本照合）\n- 『内科摘要』巻上・各症方薬の帰脾湯は、当帰・遠志を含み茯苓を用いる、今日の帰脾湯と同じ構成（翻刻確認）。資料は、同じ方が『薛氏医案』の各処に見られるとする\n- 資料は、『薛氏医案』十六種のうち加味帰脾湯の項で挙げた8種を除く8種について、帰脾湯が載るのは『保嬰金鏡録』『癘瘍機要』『小児痘疹方論』（茯神）と『外科枢要』（茯苓）で、『保嬰粋要』『原機啓微』『敖氏傷寒金鏡録』『外科精要』には載らないとする（要原本照合）\n- 資料の出典欄には『聖済総録』『厳氏済生方』『玉機微義』『薛氏医案』が並ぶ。『聖済総録』は資料の本文（論考）に出てこず、何の出典として挙げられているかが分からない（要確認）\n- 現行エキス剤（ツムラ65）は 黄耆・酸棗仁・人参・白朮・茯苓・竜眼肉・遠志・大棗・当帰・甘草・生姜・木香 の12味で、『内科摘要』の方と同じ生薬からなる（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "黄耆・酸棗仁・人参・白朮・茯苓・竜眼肉・遠志・大棗・当帰・甘草・生姜・木香", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "甘麦大棗湯", "名前": "甘麦大棗湯", "読み": "かんばくたいそうとう", "ツムラ番号": "72", "出典": "金匱要略（婦人雑病脈証并治第二十二）", "本文": {"条文": "### 『金匱要略』婦人雑病脈証并治第二十二\n\n**書き下し**（読み：社員案）\n婦人の臓躁、喜く悲傷して哭せんと欲し、象神霊の作す所の如く、数欠伸するは、甘麦大棗湯之を主る。\n\n**原文**（翻刻確認）\n婦人臟躁，喜悲傷欲哭，象如神靈所作，數欠伸，甘麥大棗湯主之。\n\n**現代語訳**（訳：社員案）\n婦人の臓躁で、よく悲しみ傷んで泣きたがり、その様子は神霊の仕業のようであり、しばしばあくびをして伸びをするものは、甘麦大棗湯がこれを主治する。\n\n### 注記\n- 「臟躁」は、四部叢刊本（明嘉靖俞橋刊本の影印）の翻刻では「藏躁」と書かれる（要原本照合）\n- 「欲哭」の「欲」は、四部叢刊本の翻刻では異体字（Unicode U+238D4）で書かれる（字体の違い。要原本照合）\n- 「大棗」の「棗」は、四部叢刊本の翻刻では異体字（Unicode U+2C0F7）で書かれる（字体の違い。要原本照合）\n- 方の見出しは、四部叢刊本の翻刻では「甘草小麥大棗湯方」（棗は上の異体字）で、条の方名（甘麥大棗湯）と違う（翻刻確認）\n- 維基文庫の『金匱要略』の翻刻にはこの方の分量・服用法が載っておらず、「出典」の構成・服用法は四部叢刊本の翻刻だけで確かめた", "出典": "### 原典の構成\n甘草2両、小麦1升、大棗10枚（翻刻確認。四部叢刊本の翻刻だけで確かめた）\n\n### 原典の服用法\n3味を水6升で煮て3升を取り、温めて3回に分けて服す。また脾気を補う（翻刻確認）\n\n### 処方の変遷\n- 条では「甘麦大棗湯」、方の見出しでは「甘草小麦大棗湯」と書かれる（翻刻確認）\n- 『普済本事方』巻第十・婦人諸疾に、婦人の臓躁を治す「大棗湯」の名で載る（要原本照合）\n- 『婦人大全良方』巻之十五・妊娠臓躁悲傷方論第十三は許学士を引いて大棗湯を載せ、後に「専ら婦人を治する方」「甘草湯と名づく」と続ける（要原本照合）\n- 『袖珍方』巻之四・婦人方・調経衆疾は『大全良方』を引いて大棗湯として載せる（要原本照合）\n- 現行エキス剤（ツムラ72）は 大棗・甘草・小麦 の3味（PMDA 添付文書 2023年12月改訂 第1版で確認。小麦は「ショウバク」と書かれる）", "構成": "大棗・甘草・小麦", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "芎帰膠艾湯", "名前": "芎帰膠艾湯", "読み": "きゅうききょうがいとう", "ツムラ番号": "77", "出典": "金匱要略（婦人妊娠病脈証并治第二十）", "本文": {"条文": "### 『金匱要略』婦人妊娠病脈証并治第二十\n\n**書き下し**（読み：社員案）\n師曰く、婦人漏下する者有り、半産の後、因りて続けて下血し都て絶えざる者有り、妊娠下血する者有り。仮令えば妊娠して腹中痛むは、胞阻と為す。膠艾湯之を主る。\n\n**原文**（翻刻確認）\n師曰、婦人有漏下者、有半產後因續下血都不絕者、有妊娠下血者、假令妊娠腹中痛、為胞阻、膠艾湯主之。\n\n**現代語訳**（訳：社員案）\n師が言う。婦人には、不正出血（漏下）が続く者がおり、流産（半産）の後にそのまま出血が続いてまったく止まらない者がおり、妊娠中に出血する者がいる。もし妊娠して腹中が痛むなら、これを胞阻という。膠艾湯がこれを主治する。\n\n### 関連条文（膠姜湯の条）\n\n『金匱要略』婦人雑病脈証并治第二十二。林億らの注が、方のない膠姜湯を妊娠病篇の膠艾湯ではないかとする条。\n\n**書き下し**（読み：社員案）\n婦人陥経し、漏下黒くして解せざるは、膠姜湯之を主る。（臣億等、諸本を校するに膠姜湯の方無し。想うに是れ前の妊娠中の膠艾湯ならん。）\n\n**原文**（翻刻確認）\n婦人陷經、漏下黑不解、膠薑湯主之。（臣億等校諸本無膠薑湯方、想是前妊娠中膠艾湯。）\n\n**現代語訳**（訳：社員案）\n婦人が陥経となり、黒い不正出血が続いて治らないものは、膠姜湯がこれを主治する。（林億らが諸本を校合したところ膠姜湯の方はない。思うに、前の妊娠病の篇の膠艾湯であろう。）\n\n### 注記\n- 条文の方名は「膠艾湯」、方の見出しは「芎帰膠艾湯方」（翻刻確認）\n- 四部叢刊本（明嘉靖俞橋刊本の影印）の翻刻では、方の見出しの下に小字の注「一方加乾姜一两胡氏治婦人胞動無乾姜」がある。維基文庫の『金匱要略』の翻刻にはこの注がない（翻刻確認）\n- 四部叢刊本の翻刻は「姙娠」「半産」「不絶」と書く。字体だけの違い（要原本照合）\n- 膠姜湯の条の林億の注は、四部叢刊本の翻刻では「想是姙娠中膠艾湯」で「前」の字がない（要原本照合）。本文は維基文庫の『金匱要略』の字を採った。四部叢刊本は「黒」「姜」と書く（字体の違い）\n- 生薬の「芎窮」は、維基文庫の2つの翻刻ともこの字。資料は「芎藭」と書く（要原本照合）", "出典": "### 原典の構成\n- 『金匱要略』：芎窮・阿膠・甘草 各2両、艾葉・当帰 各3両、芍薬4両、乾地黄（分量の記載なし）（翻刻確認）\n- 乾地黄の分量は、維基文庫の『金匱要略』・四部叢刊本の2つの翻刻とも書かれていない。資料にも原典の分量の記載がない（要原本照合）\n\n### 原典の服用法\n- 『金匱要略』：7味を水5升・清酒5升を合わせて煮て3升を取り、滓を去り、膠を入れて溶かしきり、1升を温服する。日に3回服す。治らなければさらに作る（翻刻確認）\n\n### 処方の変遷\n- 処方の形は四物湯（地黄・芍薬・当帰・川芎）に阿膠・甘草・艾葉を加えたものだが、資料は歴史的には全く逆であるとする。四物湯の出典は資料のこの項に書かれていない（要確認）\n- 『備急千金要方』巻第二 婦人方上・妊娠諸病第四・胎動及数堕胎第一に、方名なしで艾葉・阿膠・芎藭・当帰・甘草の5味の方がある。同じ篇の下血第七には外傷・打撲による流産を防ぐ膠艾湯方がある（要原本照合）\n- 『医方類聚』巻之二百二十四 胎産救急方・漏胎では、この5味を孫真人方の芎帰膠艾湯として引く。同じく傷胎では『集験方』の膠艾湯（当帰・地黄・艾葉・阿膠・川芎。一方は地黄なく甘草を加える）を引き、結局5味と同じになる。資料は、一般に『千金方』の芎帰膠艾湯とされる5味の方は、本来『集験方』の膠艾湯の一方と称すべきとする（要原本照合）\n- 『外台秘要方』第三十三巻 婦人上・妊娠胎動方には、『小品方』からの引用として阿膠・艾葉の2味の膠艾湯が載る（要原本照合）\n- 藺道人『理傷続断方』又治傷損方論の膠艾湯は乾地黄・阿膠・川芎・艾葉（要原本照合）\n- 『太平聖恵方』巻第十・治傷寒鼻衄諸方の艾葉湯方は艾葉・生乾地黄・阿膠。巻第七十五・治妊娠胎動下血諸方の阿膠散方は阿膠・艾葉・芎藭・当帰・熟地黄を散とし、温酒で調下する（要原本照合）\n- 『聖済総録』巻第一百五十四 妊娠門・妊娠驚胎の当帰湯方は芎帰膠艾湯に人参を加えた方。妊娠胎動の膠艾湯方は芎帰膠艾湯の7味を水と酒で煎服し、小艾葉湯方は先の5味。巻第一百五十五 妊娠門・妊娠卒下血の膠艾湯方は原典の7味、芎藭湯方は先の5味（要原本照合）\n- 『三因極一病証方論』巻之十七 婦人論・漏阻例の膠艾湯は熟地黄・艾葉・当帰・甘草・芍薬・川芎・阿膠・黄耆を剉散として煎服する（芎帰膠艾湯加黄耆）。胸中逆冷には生姜5片・棗3枚を加える（要原本照合）\n- 『医塁元戎』巻十一 厥陰証・四物湯例の四物膠艾湯は四物湯加阿膠甘草艾（要原本照合）\n- 『千金方』巻第二十五 備急・被打第三の大膠艾湯は芎帰膠艾湯加乾姜。『千金翼方』第二十 雑病下・従高堕下第四にもほぼ同じ条がある（要原本照合）\n- 片倉鶴陵『産科発蒙』巻二・妊娠頓仆失踞胎動第四の大阿膠湯は当帰・芍薬・地黄・阿膠・艾葉・乾姜・川芎・甘草で、四部叢刊本の注の「一方加乾姜一两」の方にあたる（要原本照合）\n- 現行エキス剤（ツムラ77）は 地黄・芍薬・当帰・艾葉・甘草・川芎・阿膠 の7味で、原典と同じ生薬からなる（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "地黄・芍薬・当帰・艾葉・甘草・川芎・阿膠", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "黄耆建中湯", "名前": "黄耆建中湯", "読み": "おうぎけんちゅうとう", "ツムラ番号": "98", "出典": "金匱要略（血痺虚労病脈証并治第六）", "本文": {"条文": "### 『金匱要略』血痺虚労病脈証并治第六\n\n**書き下し**（読み：社員案）\n虚労、裏急、諸の不足は、黄耆建中湯之を主る。\n\n（原注）小建中湯の内に於いて黄耆一両半を加え、余は上法に依る。気短、胸満する者は生姜を加え、腹満する者は棗を去り茯苓一両半を加う。及び肺の虚損不足を療し、気を補うには半夏三両を加う。\n\n**原文**（翻刻確認）\n虛勞裏急、諸不足、黃耆建中湯主之。\n\n（原注）於小建中湯內加黃耆一兩半、餘依上法。氣短胸滿者加生薑、腹滿者去棗加茯苓一兩半、及療肺虛損不足、補氣加半夏三兩。\n\n**現代語訳**（訳：社員案）\n虚労で、裏急（腹がひきつれる）があり、もろもろの不足があるものは、黄耆建中湯が主治する\n\n（原注）小建中湯に黄耆1両半を加え、ほかは前の小建中湯の法に従う。息切れして胸が張るものには生姜を加え、腹が張るものには大棗を去って茯苓1両半を加える。肺の虚損・不足を治して気を補うには半夏3両を加える\n\n### 注記\n- 原注は条文に続く小字双行の注（資料の記載）\n- 原典の構成の小建中湯の甘草は、『金匱要略』の小建中湯方では3両（翻刻確認）、『傷寒論』（宋本）の小建中湯方では2両（要原本照合）。本文は『金匱要略』の値をとった", "出典": "### 原典の構成\n- 小建中湯（桂枝3両（去皮）・甘草3両（炙）・大棗12枚・芍薬6両・生姜3両・膠飴1升）に黄耆1両半を加える（翻刻確認）\n- 加減：気短・胸満には生姜を加える。腹満には大棗を去り茯苓1両半を加える。肺の虚損・不足を治し気を補うには半夏3両を加える（翻刻確認）\n\n### 原典の服用法\n- 小建中湯の法に依る：水7升で煮て3升を取り、滓を去り、膠飴を入れて再び弱火にかけて溶かし、1升を温服、日に3回（翻刻確認）\n- 小建中湯の条の注に、嘔家には甘いため建中湯を用いてはならないとある（翻刻確認）\n\n### 処方の変遷\n- 原典の注のとおり、小建中湯に黄耆を加えた方（翻刻確認）\n- 『備急千金要方』第十九・腎蔵・補腎第八の黄耆建中湯方には、嘔には生姜を倍にし、腹満には大棗を去り茯苓4両を加える加減法が付く（要原本照合）\n- 『太平恵民和剤局方』巻之五・補虚損（附 骨蒸）の黄耆建中湯は、白芍薬・肉桂・黄耆・甘草を生姜・大棗で煎じ、餳を少し入れて再び煎じる（要原本照合）\n- 『仁斎直指附遺方論』巻三・湿・中湿証治の黄耆建中湯は、黄耆・辣桂・甘草・白芍薬で、膠飴を用いない（要原本照合）\n- 『万安方』（梶原性全）巻第十四上・虚労門上・諸虚労通薬の黄耆建中湯（良験方）は、白芍薬・黄耆・桂心・甘草を生姜・大棗で煎じ、飴を少し入れて溶かす（要原本照合）\n- 『万安方』巻十四下の黄耆建中湯（必用方）は、乾大棗・生姜・黄耆・甘草・官桂・白芍薬・人参・半夏で、膠飴または糯米餳を入れる（要原本照合）\n- 『衆方規矩』（曲直瀬道三原著・曲直瀬玄朔増補）巻之中・自汗盗汗の黄耆建中湯は膠飴を用いない（要原本照合）\n- 『療治経験筆記』（津田玄仙）巻之五・六・汗門の黄耆建中湯は、黄耆・桂・芍薬・生姜・大棗・膠飴で甘草を用いない（要原本照合）\n- 『普済本事方』（許叔微）巻第八・傷寒時疫上に、建中湯に当帰・黄耆を加えた黄耆建中加当帰湯がある（要原本照合）\n- 『千金要方』に引かれる『古今録験方』の加減（乾姜を生姜に代え当帰4両を加える）は、実際上は華岡青洲の帰耆建中湯にあたると資料はする（要確認）\n- 現行エキス剤（ツムラ98）は 芍薬・黄耆・桂皮・大棗・甘草・生姜 の混合生薬の乾燥エキスに膠飴（日局コウイ）を加えたもの。1日量は芍薬6.0・黄耆4.0・桂皮4.0・大棗4.0・甘草2.0・生姜1.0g、コウイ10.0g（PMDA 添付文書 2023年12月改訂で確認）", "構成": "芍薬・黄耆・桂皮・大棗・甘草・生姜・膠飴", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "胃苓湯", "名前": "胃苓湯", "読み": "いれいとう", "ツムラ番号": "115", "出典": "医塁元戎（巻四・陽明証）／古今医鑑（巻五・泄瀉）／万病回春（巻三・泄瀉）", "本文": {"条文": "### 『医塁元戎』巻四・陽明証\n\n**書き下し**（読み：社員案）\n五苓・平胃各半の散、生薑にて調服し、心下の水を治す。五苓に石膏・寒水石・甘草を加えて甘露飲と為す。亦た心下の水、並びに飲酒して水瀉する者を治す。生薑にて三五銭を調え、清濁立ちどころに分かる。\n\n**原文**（翻刻確認）\n五苓平胃各半散、生薑調服、治心下水。五苓加石膏寒水石甘草、為甘露飲、亦治心下水並飲酒水瀉者、生薑調三五錢、清濁立分。\n\n**現代語訳**（訳：社員案）\n五苓散と平胃散を半分ずつ合わせた散を、生姜で溶いて服用し、心下の水を治す。五苓散に石膏・寒水石・甘草を加えると甘露飲となり、これも心下の水と、飲酒して水様の下痢をするものを治す。生姜で3〜5銭を溶いて服すと、清濁がたちまち分かれる。\n\n### 『古今医鑑』巻五・泄瀉\n\n**書き下し**（読み：社員案）\n暑に中り湿に傷られ、飲を停め食を夾み、脾胃和せず、腹痛泄瀉し、渇を作し、小便利せず、水穀化せず、陰陽分かれざるを治す。\n\n**原文**（翻刻確認）\n治中暑傷濕、停飲夾食、脾胃不和、腹痛泄瀉、作渴、小便不利、水穀不化、陰陽不分。\n\n**現代語訳**（訳：社員案）\n暑さに当たり湿に傷られ、水飲が停滞したうえに飲食の停滞も挟まり、脾胃が調和せず、腹痛して下痢し、口が渇き、尿の出が悪く、飲食物が消化されず、陰陽が分かれないものを治す。\n\n### 『万病回春』巻三・泄瀉\n\n**書き下し**（読み：社員案）\n泄瀉、清濁分かれざる者は、湿多くして五瀉を成すなり。胃苓湯　脾胃和せず、腹痛泄瀉し、水穀化せず、陰陽分かれざるを治す。\n\n**原文**（翻刻確認）\n泄瀉清濁不分者、濕多成五瀉也。胃苓湯　治脾胃不和、腹痛泄瀉、水穀不化、陰陽不分。\n\n**現代語訳**（訳：社員案）\n泄瀉で清濁が分かれないものは、湿が多くて五種の下痢となったものである。胃苓湯は、脾胃が調和せず、腹痛して下痢し、飲食物が消化されず、陰陽が分かれないものを治す。\n\n### 注記\n- 『医塁元戎』の条には「胃苓湯」の方名がない（翻刻確認）\n- 『医塁元戎』の「瀉」は、維基文庫の本（12巻本・四庫全書本とも）では「㵼」と書かれる（字体の違い）\n- 『医塁元戎』の「生薑調三五錢、清濁立分」が甘露飲だけにかかるのか、五苓平胃各半散にもかかるのかは、原文からは決めにくい（要原本照合）\n- 『万病回春』の胃苓湯の条には、『古今医鑑』の「中暑傷湿、停飲夾食」「作渇、小便不利」の句がない（翻刻確認）\n- 『万病回春』の「泄瀉清濁不分者、湿多成五瀉也」は、泄瀉の門の中で胃苓湯の前に置かれた見出しの句（翻刻確認）\n- 「停飲夾食」の「夾」は、書によって「挾」とも書かれる（要原本照合）。『醫方集解』（清・汪昂）は「停飲夾食」と書く（翻刻確認）\n- 『古今医鑑』の「泄瀉」は、資料の書き下しでは「洩瀉」と書かれる（要原本照合）\n- 『古今医鑑』の巻数は、維基文庫の本では本文が巻之五・泄瀉、冒頭の目次では巻三に洩瀉とある（翻刻確認）。資料は巻之五・泄瀉とする\n- 『古今医鑑』は龔信の撰で、序に「家君暨廷賢所編輯」とあり、子の龔廷賢も編纂に関わる（翻刻確認）。『万病回春』は龔廷賢（明）の著（翻刻確認）", "出典": "### 原典の構成\n- 『医塁元戎』：五苓散・平胃散 各半（翻刻確認）\n- 『古今医鑑』：蒼朮（米泔浸）・厚朴（姜汁炒）・陳皮・猪苓・沢瀉・白朮（炒）・白茯苓・白芍（炒） 各1銭、肉桂・甘草（炙） 各3分（翻刻確認）\n- 『万病回春』：蒼朮（米泔制）・厚朴（姜汁炒）・陳皮・猪苓・沢瀉・白朮（去芦）・茯苓（去皮）・白芍（煨） 各1銭、肉桂・甘草（炙） 各2分（翻刻確認）\n\n### 原典の服用法\n- 『医塁元戎』：散とし、生姜で調服する（翻刻確認）\n- 『古今医鑑』：1剤に刻み、生姜・棗を入れて水で煎じ、温服する（翻刻確認）\n- 『万病回春』：1剤に刻み、生姜・棗を入れて煎じ、空腹時に温服する（翻刻確認）\n\n### 処方の変遷\n- 平胃散と五苓散の合方。資料は、本方の出典は平胃散・五苓散の出典の上に成り立ち、そのうえで芍薬を含むかどうかで二つに分かれるとする\n- 五苓散の出典は『傷寒論』『金匱要略』（翻刻確認）。平胃散の出典は『博済方』『簡要済衆方』（要原本照合）。どちらも資料の出典欄に胃苓湯の出典と並べて挙げられている\n- 芍薬を含まない系統：『医塁元戎』（王好古・元）巻四・陽明証に「五苓平胃各半散」がある。胃苓湯の方名はない（翻刻確認）\n- 資料は、『医塁元戎』の原序に丁酉（1237年）、跋に辛卯（1231年）に成書したが元藁を盗まれて丁酉春に再編したとあり、現在の12巻本は顧遂が嘉靖22年（1543）に刊行し、万暦21年（1593）に屠本畯が重刊したものとする\n- 資料は、『医塁元戎』の一巻本・巻第八・太陰証・平胃散加減例に、平胃散を五苓散と半分ずつ合わせたものを対金飲子とする記載があるとする（要原本照合。維基文庫の四庫全書本12巻には見当たらない）\n- 資料は、羅天益『衛生宝鑑』巻十六・泄痢門・濡泄の対金飲子を、平胃散5銭・五苓散2銭半・草豆蔲5銭を姜・棗で煎服する方とする（要原本照合）\n- 『婦人大全良方』（陳自明）巻八に胃苓散があり、「治夏秋之間脾胃傷冷水穀不分泄瀉不止」「五苓散　平胃散」「右合和薑棗煎空心服妙陳日華方」とある（翻刻確認）。資料はこれを、胃苓湯がもとは胃苓散という方名だった根拠とする\n- 『世医得効方』巻五に「胃苓湯」の名で五苓散と平胃散を合わせて用いる記載がある（翻刻確認）。同書の著者・時代は要確認。分量の「二銭合和」の読み（各2銭か合わせて2銭か）は要原本照合\n- 『丹渓心法』（朱震亨）にも「胃苓湯」の名で五苓散と平胃散を合わせる記載がある（翻刻確認）\n- 資料は、朱佐『類編朱氏集験医方』巻之四・脾胃門の虚腫に、胃苓丸を腫れに用い、木通湯で呑み下す記載があるとする（要原本照合）\n- 『薛氏医案』巻六十では胃苓散とも呼び、末にして蜜丸にしたものを胃苓膏とする（翻刻確認）。資料は、ここの薬味は白朮・茯苓・沢瀉・厚朴・猪苓・陳皮・甘草・桂で、蒼朮を含まないとする（要原本照合）\n- 芍薬を含む系統：『古今医鑑』巻五・『万病回春』巻三の胃苓湯には白芍が入る（翻刻確認）。資料は、芍薬を含む胃苓湯の出典は従来『万病回春』とされてきたが、薬味は両書で同じで、『古今医鑑』の刊行は『万病回春』より11年早いとする\n- 資料は、呉尚黙訂『丹渓手鏡』巻之中・泄瀉二十六の平胃五苓散（平胃散・五苓散・白朮・芍薬・甘草）にも芍薬が入るとし、同書は明の天啓元年（1621）の撰とする（要原本照合）\n- 現行の医療用エキス剤（ツムラ115）は 蒼朮・厚朴・陳皮・猪苓・沢瀉・白朮・茯苓 各2.5g、桂皮2.0g、生姜・大棗 各1.5g、甘草1.0g の11味で、芍薬は入っていない（PMDA 添付文書 2023年12月改訂で確認）\n- 資料の組成欄は、芍薬を括弧で囲んで示し、本方を「五苓散合平胃散（加芍薬）」と説明する。そのうえで、現在は芍薬を配合した医療用エキス製剤はないとする\n- 資料は、かつては芍薬を含まない胃苓湯と含む胃苓湯の両方が医療用エキス製剤として薬価収載されていたが、芍薬を含む製剤は平成24年（2012）3月31日に経過措置期間が終わって薬価削除になった（そのメーカーは一般用漢方製剤として芍薬を含む胃苓湯を販売している）とする。このため資料は、現在の医療用エキス製剤胃苓湯の最終的な出典を『医塁元戎』とする", "構成": "蒼朮・厚朴・陳皮・猪苓・沢瀉・白朮・茯苓・桂皮・生姜・大棗・甘草", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "黄連湯", "名前": "黄連湯", "読み": "おうれんとう", "ツムラ番号": "120", "出典": "傷寒論（弁太陽病脈証并治下第七）", "本文": {"条文": "### 『傷寒論』弁太陽病脈証并治下第七\n\n**書き下し**（読み：社員案）\n傷寒、胸中に熱有り、胃中に邪気有り、腹中痛み、嘔吐せんと欲する者は、黄連湯之を主る。\n\n**原文**（翻刻確認）\n傷寒、胸中有熱、胃中有邪氣、腹中痛、欲嘔吐者、黄連湯主之。\n\n**現代語訳**（訳：社員案）\n傷寒で、胸の中に熱があり、胃の中に邪気があって、腹が痛み、吐きそうになる者は、黄連湯が主治する。\n\n### 注記\n- 宋本の翻刻では、方の服用法の後に林億らの「疑うらくは仲景の方に非ず」の注は見当たらない。資料は原典の後条文の最後にこの注があるとする（要原本照合）\n- 成無己『注解傷寒論』巻第四ではこの注がない（翻刻確認）。資料も同じ指摘をしている\n- 「胸中」は通行本（宋本）の字を採った。四庫全書本の成無己注本では「胷中」と書かれる（要原本照合）\n- 服用法は宋本の「温服、昼三、夜二」を採った。成無己注本では「温服一升、日に三服、夜に二服」と1回量が書かれる（要原本照合）", "出典": "### 原典の構成\n- 『傷寒論』：黄連3両、甘草（炙）3両、乾姜3両、桂枝（去皮）3両、人参2両、半夏（洗）半升、大棗（擘）12枚（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』：7味を水1斗で煮て6升を取り、滓を去って温服する。昼に3回、夜に2回（翻刻確認）\n\n### 処方の変遷\n- 『傷寒論』の半夏瀉心湯（黄連1両・黄芩3両）から黄芩を去り桂枝を加え、黄連を3両に増やした形。徐大椿『傷寒類方』瀉心湯類は「半夏瀉心湯去黄芩加桂枝」とする（半夏瀉心湯の構成は翻刻確認。『傷寒類方』は要原本照合）\n- 『祖剤』巻之一は、伊尹甘草瀉心湯を祖とし、黄連湯を半夏瀉心湯に黄連2両・桂枝3両を加え人参1両を減じた方として載せる。黄芩を去ることには触れない（要原本照合）\n- 東洞は、林億の「仲景の方に非ず」の注にかかわらず『類聚方』に本方を採っている。東洞がこの注のない成無己本を拠りどころにしていたためとされる（要原本照合）\n- 現行エキス剤（ツムラ120）は 半夏・黄連・乾姜・甘草・桂皮・大棗・人参 の7味。半夏6.0g、他の6味は各3.0g（PMDA 添付文書 2023年12月改訂 第1版で確認）。原典の桂枝は桂皮、人参は原典の2両に対し他の薬と同量になっている", "構成": "半夏・黄連・乾姜・甘草・桂皮・大棗・人参", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "加味帰脾湯", "名前": "加味帰脾湯", "読み": "かみきひとう", "ツムラ番号": "137", "出典": "薛氏医案（内科摘要・各症方薬）／薛氏医案（口歯類要・附方并注）／薛氏医案（明医雑著・附方）／薛氏医案（保嬰撮要・巻三・天釣内釣）", "本文": {"条文": "### 『内科摘要』各症方薬（薛己）\n\n**書き下し**（要原本照合）\n\n**原文**（要原本照合）\n資料に原文の記載がない（要確認）\n\n**現代語訳**\n\n### 『口歯類要』附方并注（薛己）\n\n**書き下し**（要原本照合）\n\n**原文**（要原本照合）\n資料に原文の記載がない（要確認）\n\n**現代語訳**\n\n### 『明医雑著』附方（王綸撰・薛己訂）\n\n**書き下し**（要原本照合）\n\n**原文**（要原本照合）\n資料に原文の記載がない（要確認）\n\n**現代語訳**\n\n### 『保嬰撮要』巻三・天釣内釣（薛氏医案）\n\n**書き下し**（要原本照合）\n\n**原文**（要原本照合）\n資料に原文の記載がない（要確認）\n\n**現代語訳**\n\n### 注記\n- 4書とも、資料（sources/３.pdf の本の111〜112頁）には書き下しの引用だけがあり、原文はない。翻刻で原文を確かめられなかったため、公開側の書き下し・現代語訳は空欄にした。資料の書き下しは手元版に置く（要原本照合）\n- 4書とも、加味帰脾湯は帰脾湯（「前方」）の後に項を改めて載り、帰脾湯に薬を加えたものとして示される（要原本照合）\n- 『保嬰撮要』の方は、茯苓ではなく茯神を用いる（要原本照合）", "出典": "### 原典の構成\n- 『内科摘要』各症方薬：前方（帰脾湯）に柴胡・山梔を加える（分量の記載は資料にない）（要原本照合）\n- 『口歯類要』附方并注：前方（帰脾湯）に柴胡・丹皮・山梔を加える（分量の記載は資料にない）（要原本照合）\n- 『明医雑著』附方：前方（帰脾湯）に牡丹皮・山梔 各1銭を加える（要原本照合）\n- 『保嬰撮要』巻三・天釣内釣：加味薬は牡丹皮・山梔子で、茯苓ではなく茯神を用いる（分量の記載は資料にない）（要原本照合）\n\n### 原典の服用法\n\n### 処方の変遷\n- 加味帰脾湯は、帰脾湯に諸薬を加えた方（要原本照合）\n- 資料の出典欄には『聖済総録』『厳氏済生方』『玉機微義』『薛氏医案』が並ぶ。帰脾湯そのものの出典は、帰脾湯を登録するときに帰脾湯の側に載せる（要確認）\n- 『薛氏医案』には3通りの加味帰脾湯がある。柴胡・山梔子を加えるもの（『内科摘要』『女科撮要』『正体類要』『婦人良方』『銭氏小児直訣』）、柴胡・牡丹皮・山梔子を加えるもの（『口歯類要』）、牡丹皮・山梔子を加えるもの（『明医雑著』『保嬰撮要』）。このうち『銭氏小児直訣』と『保嬰撮要』は茯苓でなく茯神を用いる（要原本照合）\n- 一部の書は本方の出典を『済世全書』とするが、『薛氏医案』の諸書にすでに収載されている（要確認）\n- 『古今医鑑』巻之十一・婦人科虚労の「加味帰脾湯」は、薬味が帰脾湯と同じで加味薬がない（要原本照合）\n- 『医宗必読』巻之八・心腹諸痛の「加味帰脾湯」は、帰脾湯に煨姜・菖蒲・桂心を加えたもので、柴胡・山梔を加える者もあると注される（要原本照合）\n- 現行エキス剤（ツムラ137）は 黄耆・柴胡・酸棗仁・蒼朮・人参・茯苓・竜眼肉・遠志・山梔子・大棗・当帰・甘草・生姜・木香 の14味で、柴胡・山梔子を加える系統。牡丹皮は入らず、朮は蒼朮（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "黄耆・柴胡・酸棗仁・蒼朮・人参・茯苓・竜眼肉・遠志・山梔子・大棗・当帰・甘草・生姜・木香", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "桔梗湯", "名前": "桔梗湯", "読み": "ききょうとう", "ツムラ番号": "138", "出典": "傷寒論（弁少陰病脈証并治第十一）／金匱要略（肺痿肺癰咳嗽上気病脈証并治第七）", "本文": {"条文": "### 『傷寒論』弁少陰病脈証并治第十一\n\n**書き下し**（読み：社員案）\n少陰病、二三日、咽痛む者は、甘草湯を与うべし。差えざる者は、桔梗湯を与う。\n\n**原文**（翻刻確認）\n少陰病、二三日、咽痛者、可与甘草湯。不差者、与桔梗湯。\n\n**現代語訳**（訳：社員案）\n少陰病で二、三日たち、咽が痛むものには、甘草湯を与えてよい。治らないものには、桔梗湯を与える。\n\n### 『金匱要略』肺痿肺癰咳嗽上気病脈証并治第七\n\n**書き下し**（読み：社員案）\n咳して胸満し、振寒して脈数、咽乾きて渇せず、時に濁唾腥臭を出だし、久久にして膿を吐くこと米粥の如き者は、肺癰と為す。桔梗湯之を主る。\n\n**原文**（翻刻確認）\n咳而胸満、振寒脈数、咽乾不渇、時出濁唾腥臭、久久吐膿如米粥者、為肺癰、桔梗湯主之。\n\n**現代語訳**（訳：社員案）\n咳をして胸が張って苦しく、寒気がして震え、脈は速く、咽は乾くが渇きはなく、ときどき濁った生臭い痰を出し、長く続いて米の粥のような膿を吐くものは、肺癰である。桔梗湯がこれを主治する。\n\n### 注記\n- 『傷寒論』の条は、維基文庫の宋本の翻刻で確かめた（翻刻確認）。翻刻の字は「與」で、本文は新字体にした。翻刻の条番号は三一一。甘草湯の条と同じ条\n- 『金匱要略』の条は、維基文庫の「金匱要略」の翻刻で確かめた（翻刻確認）。翻刻の字は「咳而胸滿，振寒脈數，咽乾不渴」などで、本文は新字体にした\n- 四部叢刊本『金匱要略方論』（明・兪橋刊本）の翻刻では、この条が「欬而胸滿振脉寒數…桔便湯主之」となっている。「振脉寒數」（振寒脈数）と「桔便湯」（桔梗湯）は異同として残す（要原本照合）。欬／咳は字体の差\n- 四部叢刊本の翻刻では、方名の下に小字で「亦治血痺」（亦た血痺を治す）とある（翻刻確認）。維基文庫の「金匱要略」の翻刻には、桔梗湯方の構成・服用法そのものが載っていない\n- 条文の順は、資料の出典欄の順（『傷寒論』が先）に仮に置いた。添付文書に出典の欄がなく、両書の構成も同じため、基準では決められない（要確認）", "出典": "### 原典の構成\n- 『傷寒論』：桔梗1両、甘草2両（炙の指示なし）（翻刻確認）\n- 『金匱要略』：桔梗1両、甘草2両（炙の指示なし）（翻刻確認。四部叢刊本）\n\n### 原典の服用法\n- 『傷寒論』：2味を水3升で煮て1升を取り、滓を去り、2回に分けて温服する（翻刻確認）\n- 『金匱要略』：2味を水3升で煮て1升を取り、2回に分けて温服する（翻刻確認。四部叢刊本）。続けて、服すと膿血を吐くとある（要原本照合。翻刻は「則吐膿血色」で末字が通らない）\n\n### 処方の変遷\n- 甘草湯に桔梗を加えた方。『傷寒論』では、甘草湯で治らない咽痛に与える方として甘草湯の条に続いて載る（翻刻確認）\n- 『外台秘要方』巻第一は『千金翼方』を引いて桔梗湯方を載せ、大桔梗1両・甘草（炙）3両とする。『千金翼方』巻第十・傷寒下・少陰病状第二の桔梗湯方には炙の字がない（要原本照合）\n- 『外台秘要方』第十巻・肺癰方は『集験』の桔梗湯方を載せ、桔梗2両（『千金』『古今方』は1両）・甘草（炙）2両とする。同じ巻に、『古今録験』の同名の桔梗湯方（桔梗・白朮・当帰・地黄・甘草・敗醤・薏苡仁・桑白皮）もある（要原本照合）\n- 『太平聖恵方』巻第八では甘草桔梗湯の名で甘草（炙）1両・桔梗1両、巻第十では桔梗散の名で桔梗1両・甘草（生用）2両・苦参半両とする（要原本照合）\n- 『和剤局方』巻之七・咽喉口歯の如聖湯は桔梗湯にあたり、甘草は炒とされる（要原本照合）\n- 『鶏峰普済方』巻第十一では国老湯の名で載る（要原本照合）\n- 医療用エキス剤は、ツムラ桔梗湯エキス顆粒（医療用）（ツムラ番号138。1日量7.5g中、日局カンゾウ3.0g・日局キキョウ2.0g。PMDA 添付文書 2023年12月改訂 第1版で確認）。添付文書に出典の欄はない。原典の桔梗1両・甘草2両とは比が異なる", "構成": "桔梗・甘草", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "黄芩湯", "名前": "黄芩湯", "読み": "おうごんとう", "ツムラ番号": "", "出典": "傷寒論（弁太陽病脈証并治下第七）", "本文": {"条文": "### 『傷寒論』弁太陽病脈証并治下第七\n\n**書き下し**（読み：社員案）\n太陽と少陽との合病、自下利する者は、黄芩湯を与う。若し嘔する者は、黄芩加半夏生姜湯之を主る。\n\n**原文**（翻刻確認）\n太陽與少陽合病、自下利者、與黃芩湯。若嘔者、黃芩加半夏生薑湯主之。\n\n**現代語訳**（訳：社員案）\n太陽と少陽の合病で、自然に下痢するものには黄芩湯を与える。もし嘔吐するものは、黄芩加半夏生姜湯がこれを主治する。\n\n### 関連条文（誤治の例）\n\n『傷寒論』弁厥陰病脈証并治第十二。黄芩湯で解熱させてはいけない例として資料が挙げる条。\n\n**書き下し**（読み：社員案）\n傷寒、脈遅なること六七日、而るに反って黄芩湯を与えて其の熱を徹す。脈遅は寒と為す。今黄芩湯を与えて復た其の熱を除けば、腹中応に冷ゆべく、当に食すること能わざるべし。今反って能く食す。此れを除中と名づく。必ず死す。\n\n**原文**（翻刻確認）\n傷寒脈遲、六七日、而反與黃芩湯徹其熱。脈遲為寒、今與黃芩湯復除其熱、腹中應冷、當不能食。今反能食、此名除中、必死。\n\n**現代語訳**（訳：社員案）\n傷寒で脈が遅のまま六、七日たっているのに、かえって黄芩湯を与えてその熱を取り去った。脈遅は寒である。いま黄芩湯を与えてさらにその熱を除けば、腹中は冷えるはずで、食べられなくなるはずである。ところがかえって食べられる。これを除中といい、必ず死ぬ。\n\n### 注記\n- 太陽少陽合病の条は、宋本の翻刻・『注解傷寒論』の四庫全書本（書名『傷寒論注釋』）巻四・『金匱玉函経』で字が同じ（翻刻確認。黄／黃の字形の差のみ）\n- 大棗の枚数は、維基文庫の宋本の翻刻では「二十枚」と書かれる。同じ条の黄芩加半夏生姜湯（宋本）、『注解傷寒論』の四庫全書本、『金匱玉函経』ではいずれも「十二枚」で、原典の構成は12枚とした（要原本照合）\n- 除中の条は、『金匱玉函経』では「今與黃芩湯」が「而與黃芩湯」、「此名除中」が「此為除中」と書かれる（要原本照合）。本文は宋本の字を採った", "出典": "### 原典の構成\n- 『傷寒論』：黄芩3両、芍薬2両、甘草2両（炙）、大棗12枚（擘）（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』：4味を水1斗で煮て3升を取り、滓を去り、1升を温服する。日に2回、夜に1回服す（翻刻確認）\n\n### 処方の変遷\n- 芍薬甘草湯（芍薬・甘草）に黄芩・大棗を加えた構成。主薬は黄芩\n- 『太平聖恵方』（王懐隠等）巻第八・傷寒三陰三陽応用湯散諸方の黄芩湯方は黄芩・赤芍薬・甘草の3味で大棗を含まず、散として煎服する（要原本照合）\n- 『小児衛生総微論方』（撰者不詳）巻第七・傷寒論の黄芩湯も黄芩・赤芍薬・甘草の3味を㕮咀して煎服し、傷寒の口舌の諸病（舌黄・舌黒・舌腫・舌裂・芒刺・舌上出血）と鼻衄に用いる（要原本照合）\n- 『扶寿精方』（呉旻）傷寒では、4味はそのままで黄芩芍薬湯と名を変え、姜を入れて煎じる（要原本照合）\n- 曲直瀬道三口授『師語録』巻下一の芍薬黄芩湯は黄芩・芍薬・茯苓・甘草で、黄芩湯から大棗を去り茯苓を加えた方（要原本照合）\n- 『金匱要略』に載る黄芩湯は『外台秘要方』の黄芩湯で、本方とは別方（六物黄芩湯とも呼ばれる）（要原本照合）\n- 医療用エキス剤は見当たらない（KEGG MEDICUS の医療用医薬品で該当0件、2026-10-21。PMDA 添付文書は未確認）。資料の組成は黄芩4・芍薬3・甘草3・大棗4（単位の記載なし。要確認）", "構成": "黄芩・芍薬・甘草・大棗（要確認）", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "葛根加朮附湯", "名前": "葛根加朮附湯", "読み": "かっこんかじゅつぶとう", "ツムラ番号": "", "出典": "方機（葛根湯の条）", "本文": {"条文": "### 『方機』葛根湯の条\n\n**書き下し**（要原本照合）\n\n**原文**（要原本照合）\n\n**現代語訳**\n\n### 注記\n- 『方機』の葛根湯の条は「朮」とだけ書き、蒼朮か白朮かを書かない（要原本照合。資料の論考②による）\n- 『方機』の条は、葛根湯の方の中に朮・附子を加えるとし、「加朮附湯」の名で腫脹・疼痛・頑腫悪腫・丹毒の類などに挙げ、紫円の兼用を添える（要原本照合。資料の引用は途中を省いている）", "出典": "### 原典の構成\n- 『方機』：葛根湯の方の中に朮・附子 各4分を加える（要原本照合）\n\n### 原典の服用法\n\n### 処方の変遷\n- 葛根湯に朮・附子を加えた加味方。葛根湯の出典は『傷寒論』巻第三・弁太陽病脈証并治中第六と『金匱要略』痙湿暍病脈証并治第二で、葛根湯の条文は葛根湯の項に載せる\n- 資料の出典欄は『傷寒論』『金匱要略』『方機』の3書を挙げる。葛根加朮附湯の名が出るのは『方機』の葛根湯の条（要原本照合）\n- 『方機』の著者・成立年は資料に記載がない（要確認）\n- 『類聚方広義』（上）の葛根湯の頭注にも、本方に朮附を加えて葛根加朮附湯と名づけるとある（要原本照合）\n- 構成は、桂枝加朮附湯（桂皮・芍薬・甘草・生姜・大棗・蒼朮・附子）に葛根・麻黄を加えたものと同じになる\n- 医療用エキス剤はツムラにはなく、三和生薬の「三和葛根加朮附湯エキス細粒」がある（KEGG MEDICUS と PMDA で 2026-10-22 確認）\n- 三和葛根加朮附湯エキス細粒は 葛根・麻黄・桂皮・甘草・芍薬・大棗・生姜・蒼朮・加工ブシ の9味で、朮は蒼朮、附子は加工ブシ（PMDA 添付文書 2025年10月改訂 第2版で確認）", "構成": "葛根・麻黄・桂皮・甘草・芍薬・大棗・生姜・蒼朮・附子（加工ブシ）", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "甘草湯", "名前": "甘草湯", "読み": "かんぞうとう", "ツムラ番号": "", "出典": "傷寒論（弁少陰病脈証并治第十一）／金匱要略（肺痿肺癰咳嗽上気病脈証并治第七・附方、千金方の引用）", "本文": {"条文": "### 『傷寒論』弁少陰病脈証并治第十一\n\n**書き下し**（読み：社員案）\n少陰病、二三日、咽痛む者は、甘草湯を与うべし。差えざる者は、桔梗湯を与う。\n\n**原文**（翻刻確認）\n少陰病、二三日、咽痛者、可與甘草湯。不差者、與桔梗湯。\n\n**現代語訳**（訳：社員案）\n少陰病で二、三日たち、咽が痛むものには、甘草湯を与えてよい。治らないものには、桔梗湯を与える。\n\n### 『金匱要略』肺痿肺癰咳嗽上気病脈証并治第七・附方\n\n**書き下し**（読み：社員案）\n『千金』甘草湯。\n\n**原文**（翻刻確認）\n《千金》甘草湯。\n\n**現代語訳**（訳：社員案）\n『千金方』の甘草湯。\n\n### 注記\n- 『傷寒論』の条は、維基文庫の宋本の翻刻で確かめた（翻刻確認。與／与の字体の差のみ）。翻刻の条番号は三一一\n- 『金匱要略』の千金甘草湯は、維基文庫の翻刻では方名の後に主治の文がなく、すぐに構成・服用法が続く（翻刻確認）。主治の文がある本があるかは確かめていない（要原本照合）\n- 『金匱要略』の篇名は、資料では「肺痿肺癰欬嗽上気病脉証治第七」、翻刻では「肺痿肺癰咳嗽上氣病脈證並治第七」と書かれる。本文は翻刻の篇名を新字体にして採った（要原本照合）", "出典": "### 原典の構成\n- 『傷寒論』：甘草2両（炙の指示なし）（翻刻確認）\n- 『金匱要略』（千金甘草湯）：甘草（分量の記載なし）（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』：1味を水3升で煮て1升半を取り、滓を去り、7合を温服する。日に2回服す（翻刻確認）\n- 『金匱要略』（千金甘草湯）：1味を水3升で煮て半分に減らし、3回に分けて温服する（翻刻確認）\n\n### 処方の変遷\n- 甘草1味の方。『傷寒論』の甘草湯方の甘草には「炙」の指示がない（翻刻確認）\n- 『備急千金要方』巻第十七・肺臓・肺痿第六に甘草湯方がある（要原本照合）\n- 『千金翼方』（孫思邈）巻第十五・補益・補五蔵第四では温液湯の名で載り、甘草は3両。『千金方』では2両（要原本照合）\n- 『外台秘要方』第十巻・肺痿方は『千金』を引いて甘草湯方を載せ、甘草は炙と指示される（要原本照合）\n- 『三因極一病証方論』（陳無択）巻之十三・肺痿証治にも温液湯の名で載り、甘草は炙と指示される（要原本照合）\n- 医療用エキス剤は、クラシエ甘草湯エキス細粒（1日量6.0g中、日局カンゾウ8.0g。PMDA 添付文書 2023年10月改訂 第1版で確認）。ツムラの医療用製剤は見当たらない（KEGG MEDICUS、2026-10-22）", "構成": "甘草", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "桔梗石膏", "名前": "桔梗石膏", "読み": "ききょうせっこう", "ツムラ番号": "", "出典": "一本堂医事説約（小児科・口瘡重舌）", "本文": {"条文": "### 『一本堂医事説約』小児科・口瘡重舌（香川修庵）\n\n**書き下し**（要原本照合）\n\n**原文**（要原本照合）\n\n**現代語訳**\n\n### 注記\n- 『一本堂医事説約』小児科・口瘡重舌の条は、小児の夜啼きと重舌を述べ、その後に方名のない「一方」として石膏・桔梗・甘草を挙げる（要原本照合。資料の書き下しによる）\n- 原文の翻刻は維基文庫に見当たらない（2026-10-22 検索。要原本照合）", "出典": "### 原典の構成\n- 『一本堂医事説約』：石膏・桔梗・甘草（分量は資料に記載なし）（要原本照合）\n\n### 原典の服用法\n\n### 処方の変遷\n- 原方は方名のない「一方」で、石膏・桔梗・甘草の3味。現行エキス剤の桔梗・石膏の2味とは甘草の有無が異なる（要原本照合）\n- 和田東郭『蕉窓方意解』巻之下・駆風解毒湯は、駆風解毒湯に石膏（大）・桔梗（中）を加えて纏喉風（咽喉の腫痛）に用いたとする（要原本照合）\n- 『勿誤薬室方函口訣』巻之上・駆風解毒湯は、葛根湯加桔石、駆風解毒湯加桔石の用法を挙げ、後者を東郭の工夫として引く（要原本照合）\n- 以後、葛根湯・小柴胡湯・駆風解毒湯・黄連解毒湯・当帰芍薬散などに加える加味方として用いられた例が多い（要確認。資料の論考による）\n- 医療用エキス剤はツムラにはなく、小太郎漢方製薬の「コタロー桔梗石膏エキス細粒」がある（識別コード N324。1日量6.0g中、日局キキョウ3.0g・日局セッコウ10.0g。PMDA 添付文書 2023年1月改訂 第1版で確認）。添付文書に出典の欄はない\n- ツムラには加味方の「ツムラ小柴胡湯加桔梗石膏エキス顆粒（医療用）」がある（KEGG MEDICUS で 2026-10-22 確認）", "構成": "桔梗・石膏", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "芎帰調血飲", "名前": "芎帰調血飲", "読み": "きゅうきちょうけついん", "ツムラ番号": "", "出典": "古今医鑑（巻之十二・産後）／万病回春（巻之六・産後）", "本文": {"条文": "### 『古今医鑑』巻之十二・産後\n\n**書き下し**（読み：社員案）\n芎帰調血飲（西園公の方）　産後の一切の諸病、気血虚損し、脾胃怯弱し、或いは悪露行らず、或いは血を去ること過多、或いは飲食節を失い、或いは怒気相冲き、以て発熱悪寒、自汗口乾、心煩喘急、心腹疼痛、脇肋脹満、頭暈眼花、耳鳴、口噤して語らず、昏憒等の証を致すを治す。\n\n**原文**（翻刻確認）\n芎歸調血飲（西園公方）　治產後一切諸病、氣血虛損、脾胃怯弱、或惡露不行、或去血過多、或飲食失節、或怒氣相冲、以致發熱惡寒、自汗口乾、心煩喘急、心腹疼痛、脅肋脹滿、頭暈眼花、耳鳴、口噤不語、昏憒等證。\n\n**現代語訳**（訳：社員案）\n芎帰調血飲（西園公の方）。産後のあらゆる病で、気血が虚して損なわれ、脾胃が弱く、あるいは悪露が下りず、あるいは出血が多すぎ、あるいは飲食の節度を失い、あるいは怒りの気が突き上げて、そのために発熱・悪寒、自汗・口の渇き、胸苦しさ・喘ぎ、胸腹部の痛み、脇の張り、めまい・目のかすみ、耳鳴り、口を食いしばって話さない、意識がぼんやりする、などの症状を来すものを治す。\n\n### 『万病回春』巻之六・産後\n\n**書き下し**（読み：社員案）\n芎帰補血湯　産後の一切の諸病、気血虚損し、脾胃怯弱し、或いは悪露行らず、或いは血を去ること過多、或いは飲食節を失い、或いは怒気相冲き、以て発熱悪寒、自汗口乾、心煩喘急、心腹疼痛、脇肋脹満、頭暈眼花、耳鳴、口噤して語らず、昏憒等の症を致すを治す。\n\n**原文**（翻刻確認）\n芎歸補血湯　治產後一切諸病、氣血虛損、脾胃怯弱、或惡露不行、或去血過多、或飲食失節、或怒氣相冲、以致發熱惡寒、自汗口乾、心煩喘急、心腹疼痛、脅肋脹滿、頭暈眼花、耳鳴、口噤不語、昏憒等症。\n\n**現代語訳**（訳：社員案）\n芎帰補血湯。産後のあらゆる病で、気血が虚して損なわれ、脾胃が弱く、あるいは悪露が下りず、あるいは出血が多すぎ、あるいは飲食の節度を失い、あるいは怒りの気が突き上げて、そのために発熱・悪寒、自汗・口の渇き、胸苦しさ・喘ぎ、胸腹部の痛み、脇の張り、めまい・目のかすみ、耳鳴り、口を食いしばって話さない、意識がぼんやりする、などの症状を来すものを治す。\n\n### 注記\n- 『万病回春』の方名は、維基文庫の翻刻では「芎歸補血湯」（芎归补血汤）。資料は同じ箇所を「芎帰調血飲」とし、方名の傍註に「西園公伝」があるとするが、翻刻には傍註がない（要原本照合）\n- 二書の条文は、末尾の「等證」（『古今医鑑』）と「等症」（『万病回春』）のほかは同じ字（翻刻確認）\n- 『古今医鑑』の翻刻は簡体字から繁体字に直した本で、字形の判断には使えない。「相冲」は翻刻の字のまま置いた（衝の字の異同は要原本照合）\n- 『古今医鑑』は龔信（明）の撰、『万病回春』は龔廷賢（明）の著（翻刻確認）。方名の下の「西園公方」の西園は、『万病回春』の序に龔廷賢の父「西園君」、巻末の志行紀に「父西園公」として出る（翻刻確認）\n- 二書の順は、刊行の早い『古今医鑑』を先にした（要確認）", "出典": "### 原典の構成\n- 『古今医鑑』：当帰・川芎・白朮・白茯苓・熟地・陳皮・香附（童便炒）・烏薬・乾姜（炒黒）・益母草・甘草・牡丹皮。分量の記載なし（翻刻確認）\n- 『万病回春』：当帰・川芎・白朮（去芦）・白茯苓（去皮）・熟地黄・陳皮・烏薬・香附（童便炒）・乾姜（炒黒）・益母草・牡丹皮・甘草。分量の記載なし（翻刻確認）\n\n### 原典の服用法\n- 『古今医鑑』：刻んで、生姜・棗を入れて煎じて服す。悪露が下りなければ益母草・牡丹皮を倍にし、童便・黄酒を加えて同服する。出血が多すぎれば川芎・当帰・乾姜を倍にする。ほかに飲食停滞・気悩・口噤・両脇痛・小腹陣痛・有汗・口乾苦の加味がある。産後はすぐに童便と熱酒を合わせて随意に飲めば百病を生じない、とも記す（翻刻確認）\n- 『万病回春』：1剤に刻み、生姜1片・棗1枚を入れて水で煎じ温服する。病をみて後に記す加減を行う（翻刻確認）\n\n### 処方の変遷\n- 資料は出典に『理傷続断方』『聖済総録』『扶寿精方』『古今医鑑』（龔信方）を挙げる。前の3書は、本方に至る流れの表に挙げられた四物湯・順気湯（四君子湯）・滋陽百補丸の書（要原本照合）\n- 本方は従来『万病回春』巻之六・産後が出典とされてきたが、それより前の『古今医鑑』巻之十二・産後に同じ条文で載り、方名の下に「西園公方」とある（翻刻確認）。資料はこれを龔信の創方の根拠とする\n- 『扶寿精方』婦人門の滋陽百補丸は、香附子・益母草・当帰・川芎・赤茯苓・白朮・白芍薬・人参・甘草・生地黄を煉蜜丸とし、白湯か酒で下す。資料は、四物湯合四君子湯（八珍湯）加香附子・益母草にあたり、嘉靖版は『古今医鑑』初刊の43年前の書とする（要原本照合）\n- 龔廷賢『寿世保元』庚集七巻・産後の帰朮保産湯は、当帰・川芎・白芍・熟地黄・白朮・白茯苓・陳皮・香附米・乾姜・甘草を姜棗で水煎する。本方から烏薬・益母草・牡丹皮を去り白芍を加えた形（要原本照合）\n- 『済世全書』巻之六離集・産後の芎帰調血飲は、当帰身・川芎・白芍・懐生地黄・白朮・白茯苓・陳皮・香附・甘草を姜棗で水煎する。『古今医鑑』の本方から烏薬・乾姜・益母草・牡丹皮を去り白芍を加えた形。資料は、元々は龔廷賢『種杏仙方』巻之三・産後に方名なしで記載されていたとする（要原本照合。方を指すのか、方後の注記を指すのかは資料の文から決めにくい。要確認）\n- 『医便』巻四・済陰類の済陰百補丸は、滋陽百補丸に玄胡索・木香を加えた形（要原本照合）\n- 『万病回春』の加減のうち、3番目（産後悪露不尽、胸腹飽悶疼痛、或いは腹中に塊有り、悪寒発熱）は本方に桃仁・紅花・肉桂・牛膝・枳殻・木香・玄胡索・童便・姜汁少許を加え熟地黄を去り、5番目（産後悪露不尽、瘀血上冲、昏迷して醒めず、腹満硬痛）は桃仁・紅花・肉桂・玄胡索・牛膝・童便・姜汁少許を加える（翻刻確認）。『古今医鑑』の本方の加減にはこの2方はない（翻刻確認）\n- 一貫堂の芎帰調血飲第一加減は、本方から熟地黄を去り、芍薬・乾地黄・桃仁・紅花・肉桂・牛膝・枳殻・木香・延胡索を加えたもの。資料は『万病回春』の3番目の加減より乾地黄・芍薬が多いとする（要原本照合）\n- 医療用エキス剤はツムラにはなく、太虎精堂製薬の「太虎堂のきゅう帰調血飲エキス顆粒」がある。1日量6.0g中、当帰・川芎・地黄・白朮・茯苓・陳皮・香附子・牡丹皮・烏薬 各2.0g、大棗・益母草 各1.5g、生姜・甘草 各1.0g の13味。原典の乾姜はなく、煎じるときの生姜・大棗が入る（PMDA 添付文書 2024年2月改訂 第1版・2023年10月改訂 第1版で確認）。添付文書に出典の欄はない", "構成": "当帰・川芎・地黄・白朮・茯苓・陳皮・香附子・牡丹皮・大棗・生姜・甘草・烏薬・益母草", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "九味檳榔湯", "名前": "九味檳榔湯", "読み": "くみびんろうとう", "ツムラ番号": "", "出典": "外台秘要方（巻七・檳榔湯）／山脇東洋方／原南陽方（叢桂亭医事小言 巻之三・脚気）／勿誤薬室方函（巻上）", "本文": {"条文": "### 『勿誤薬室方函』巻上・九味檳榔湯\n\n**書き下し**（要原本照合）\n\n**原文**（要原本照合）\n\n**現代語訳**\n\n### 『叢桂亭医事小言』巻之三・脚気（原南陽）\n\n**書き下し**（要原本照合）\n\n**原文**（要原本照合）\n\n**現代語訳**\n\n### 関連条文（元の方：『外台秘要方』巻七・腹内諸気及脹不下食方の檳榔湯）\n\n**書き下し**（読み：社員案）\n又、心頭冷えて硬く、結ぼれて痛むを療し、気を下す檳榔湯方。檳榔十顆、生薑・青木香各三両、橘皮・枳実（炙る）・甘草（炙る）・大黄各二両。右七味、切り、水六升を以て煮て二升半を取り、滓を絞り去り、分かちて温め三服す。服するに別に人の行くこと四五里の如くして一服を進め、微利を取る。生菜・熱麫・炙肉・海藻・菘菜等を忌む。\n\n**原文**（翻刻確認）\n又療心頭冷硬結痛下氣檳榔湯方。檳榔十顆、生薑・青木香各三兩、橘皮・枳實炙・甘草炙・大黄各二兩。右七味、切、以水六升、煮取二升半、絞去滓、分温三服、服別如人行四五里進一服、取微利。忌生菜・熱麫・炙肉・海藻・菘菜等。\n\n**現代語訳**（訳：社員案）\nまた、みぞおちが冷えて硬く、結ぼれて痛むものを治し、気を下す檳榔湯の方。檳榔10顆、生姜・青木香 各3両、橘皮・枳実（炙る）・甘草（炙る）・大黄 各2両。以上の7味を刻み、水6升で煮て2升半を取り、かすを絞って除き、温めて3回に分けて服す。1回服したら、人が4〜5里歩くほどの間をおいて次の1回を服し、軽い下痢を得るのを目安とする。生野菜・熱い麺・焼いた肉・海藻・菘菜などを避ける。\n\n### 注記\n- 『勿誤薬室方函』巻上の九味檳榔湯は「家方」とされ、脚気で腫満・短気するもの、および心腹が痞積して気血が凝滞するものを治すとする（要原本照合。資料の書き下しによる）\n- 『叢桂亭医事小言』巻之三・脚気の九味檳榔湯は、脚気で気血が凝滞するものを理すとする（要原本照合。資料の書き下しによる）\n- 『勿誤薬室方函』『叢桂亭医事小言』の原文の翻刻は維基文庫に見当たらない（2026-10-22 検索。要原本照合）\n- 『外台秘要方』の「檳榔」は、四庫全書本の翻刻では「㯽榔」と書かれる（要原本照合）\n- 『外台秘要方』の「青木香」は、資料の表では「木香」とされる（要原本照合）\n- 『外台秘要方』の条の「又」は、同じ門の先頭にある広済方を受ける。同門の方の末尾に「並出第二卷中」とある（翻刻確認）\n- 『外台秘要方』の門名「腹内諸気及脹不下食方」は翻刻で確かめた（翻刻確認）。資料の挙げる巻名「心痛心腹痛及寒疝」は翻刻で確かめていない（要原本照合）", "出典": "### 原典の構成\n- 『勿誤薬室方函』巻上：檳榔・大黄・厚朴・桂枝・橘皮・木香・蘇葉・甘草・生姜（分量は資料に記載なし）（要原本照合）\n- 『叢桂亭医事小言』巻之三：檳榔・橘皮・桂枝・木香・大黄・紫蘇・厚朴・枳実・生姜（分量は資料に記載なし）（要原本照合）\n- 『外台秘要方』巻七（元の方の檳榔湯）：檳榔10顆、生姜・青木香 各3両、橘皮・枳実（炙）・甘草（炙）・大黄 各2両（翻刻確認）\n\n### 原典の服用法\n- 『外台秘要方』巻七（元の方の檳榔湯）：7味を刻み、水6升で煮て2升半を取り、かすを絞り去り、温めて3回に分けて服す。服用の間は人が4〜5里歩くほどあけ、軽い下痢を得るのを目安とする。生菜・熱麫・炙肉・海藻・菘菜などを忌む（翻刻確認）\n\n### 処方の変遷\n- 『外台秘要方』巻七・腹内諸気及脹不下食方の檳榔湯（檳榔・生姜・青木香・橘皮・枳実・甘草・大黄の7味）に、山脇東洋が桂枝・紫蘇を加えて九味の方としたのが始まりとされる（要確認）。原南陽口授『復坐録』、『校正方輿輗』巻之十・脚気、今村了庵『脚気鉤要』巻上・併病がこの加味を伝える（要原本照合）\n- 『復坐録』『脚気鉤要』は元の方を「千金方」の七味檳榔湯とするため、本方の原方は『備急千金要方』出典と見なされてきた（要原本照合）\n- 山脇東洋『傷寒門温胆』は「檳榔湯　外台秘要」として檳榔・枳実・紫蘇・桂枝・陳皮・大黄・木香・甘草・生姜を、『方読弁解』中部中之一・心腹胸痛は外台の檳榔湯（7味）を載せる（要原本照合）\n- 山脇東門『東門先生方函』は東洋の方から甘草を去った8味とし、方名は九味檳榔湯のままとした（要原本照合）\n- 原南陽は東門の8味に厚朴を加えて再び9味とした（檳榔・橘皮・桂枝・木香・大黄・紫蘇・厚朴・枳実・生姜）。『復坐録』『叢桂亭医事小言』に載る（要原本照合）\n- この南陽の方から枳実を去り甘草を加えた9味（檳榔・大黄・厚朴・桂枝・甘草・木香・陳皮・紫蘇・生姜）が今日の九味檳榔湯にあたる。『東洋方函南門先生蔵方』、『療治経験筆記』巻之八・巻之九の脚気腫満短気に載る（巻之八は寛政七年〈1795〉の記録とされる）（要原本照合）\n- 『勿誤薬室方函』巻上はこの9味を「家方」として載せ、従来はこれが本方の出典とされてきた。方後に、大黄を去って呉茱萸・茯苓を加える加減を記す（要原本照合）\n- 『橘窓書影』巻之一には、九味檳榔湯去将加呉茱萸茯苓と九味檳榔湯加呉茱萸茯苓の治験があり、大黄の有無の2通りで用いられた（要原本照合。「去将」を大黄を去るとするのは資料の読み）。呉茱萸・茯苓の加味は和田東郭『蕉窓方意解』巻之上・柴胡桂枝乾姜湯の加味にならったものとされる（要確認）\n- 医療用エキス剤はツムラにはなく、小太郎漢方製薬の「コタロー九味檳榔湯エキス細粒」がある（識別コード N311。1日量6.0g中、ビンロウジ4.0・コウボク3.0・ケイヒ3.0・キッピ3.0・ソヨウ1.5・カンゾウ1.0・ダイオウ1.0・ショウキョウ1.0・モッコウ1.0・ゴシュユ1.0・ブクリョウ3.0g。PMDA 添付文書 2023年1月改訂 第1版で確認）。9味に呉茱萸・茯苓を加えた11味で、大黄も含む。添付文書に出典の欄はない", "構成": "檳榔子・厚朴・桂皮・橘皮・蘇葉・甘草・大黄・生姜・木香・呉茱萸・茯苓", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "桂枝加葛根湯", "名前": "桂枝加葛根湯", "読み": "けいしかかっこんとう", "ツムラ番号": "", "出典": "傷寒論（巻第二・弁太陽病脈証并治上第五）", "本文": {"条文": "### 『傷寒論』巻第二・弁太陽病脈証并治上第五\n\n**書き下し**（読み：社員案）\n太陽病、項背強ばること几几、反って汗出で悪風する者は、桂枝加葛根湯之を主る。\n\n**原文**（翻刻確認）\n太陽病，項背強几几，反汗出惡風者，桂枝加葛根湯主之。\n\n**現代語訳**（訳：社員案）\n太陽病で、うなじから背中が几几とこわばり、かえって汗が出て風を嫌うものは、桂枝加葛根湯が主治する。\n\n### 注記\n- 宋本の翻刻と、四庫全書本『傷寒論注釈』（成無己注）巻二の翻刻で同じ句（翻刻確認。強／强の字形の差のみ）\n- 『金匱玉函経』の翻刻では、同じ条が「太陽病，項背強𠘧𠘧，而反汗出惡風，桂枝湯主之。《論》云：桂枝加葛根湯主之。」と書かれ、方名が桂枝湯で「几几」が「𠘧𠘧」、「而反」となる。同書の別の箇所では「反汗出惡風者，屬桂枝加葛根湯」（要原本照合）\n- 宋本の方の後には林億らの注があり、太陽中風の自汗には桂枝、傷寒の無汗には麻黄を用いるのに、証は汗出・悪風で方中に麻黄がある、と指摘すると資料はいう。維基文庫の宋本の翻刻にはこの注が載っていない（要原本照合）\n- 宋本の巻第七・弁可発汗病脈証并治第十六にも本方が載り、服用法の後半に「薬力を助く」の句が加わると資料はいう。維基文庫の宋本の翻刻ではこの篇が省略されていて確かめられない（要原本照合）\n- 宋本の翻刻では、服用法の最後に「諸湯皆彷此」の句が続く（要原本照合）。宋本の巻第十に再掲された方は、甘草に「炙」がなく、服用法が「餘如桂枝法」で終わる（要原本照合）", "出典": "### 原典の構成\n- 『傷寒論』（宋本）：葛根4両、麻黄3両（去節）、芍薬2両、生姜3両（切）、甘草2両（炙）、大棗12枚（擘）、桂枝2両（去皮）（翻刻確認）\n- 『金匱玉函経』巻第七・方薬炮製（桂枝加葛根湯方第十七）：桂枝3両、芍薬2両、甘草2両（炙）、生姜3両、大棗12枚、葛根4両（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』（宋本）：7味を水1斗で、まず麻黄・葛根を煮て2升減らし、上の泡を去る。残りの薬を入れて3升に煮つめ、滓を去って1升を温服する。衣をかけてわずかに汗ばむ程度の汗をとる。粥をすする必要はない。ほかは桂枝湯の法に従って養生と禁忌を守る（翻刻確認）\n- 『金匱玉函経』：6味を水9升で、まず葛根を煮て2升減らし、上の泡を去る。残りの薬を入れて3升に煮つめ、滓を去って1升を温服する。衣をかけてわずかに汗ばむ程度の汗をとる。粥をすする必要はなく、ほかは桂枝湯の法に従う（翻刻確認）\n\n### 処方の変遷\n- 桂枝湯に葛根を加えたもの、あるいは葛根湯から麻黄を除いたもの\n- 宋本『傷寒論』の方には麻黄が入るが、条文（汗出・悪風）と合わないため、古くから麻黄は誤りとして除いて解釈されてきた（要原本照合）。『金匱玉函経』の方は麻黄を含まない6味（翻刻確認）\n- 『太平聖恵方』巻第十・治傷寒中風諸方には、桂心・甘草・赤芍薬・葛根に生姜・棗を入れて煎じる方が載り、事実上の桂枝加葛根湯とされる（要原本照合）\n- 『傷寒活人書』巻第十二の桂枝加葛根湯は桂枝・甘草・芍薬・葛根・麻黄を姜棗で煎服する。注に「伊尹湯液論」では桂枝湯に葛根を加えるだけで、監本が麻黄を用いるのは誤りとある（要原本照合）\n- 『傷寒直格方』巻中では桂枝湯加葛根湯の名で載り、巻下・諸証薬石分剤では桂枝・芍薬・甘草・葛根を桂枝湯のように服すとされる（要原本照合）\n- ツムラの医療用エキス剤はない。医療用は〔東洋〕桂枝加葛根湯エキス細粒（東洋薬行）の1品目で、1日量6.0g中に 桂枝4・芍薬4・大棗4・生姜（生ショウキョウ）4・甘草2・葛根6（g）の混合生薬の水製エキスを含む（PMDA 添付文書 2023年9月改訂 第1版で確認）", "構成": "桂枝・芍薬・大棗・生姜・甘草・葛根", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}]}</script>
<script>
var DATA = JSON.parse(document.getElementById("genten-data").textContent);

function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
/* 検索用：カタカナ→ひらがな、全角英数→半角、空白除去 */
function norm(s){
  return String(s||"").toLowerCase()

    .replace(/[！-～]/g, function(c){ return String.fromCharCode(c.charCodeAt(0)-0xfee0); })
    .replace(/\s+/g, "");
}
DATA.entries.forEach(function(e){
  e._idx = norm([e["名前"], e["読み"], e["ツムラ番号"], e["出典"], e["本文"]["構成"]].join(" "));

var TODO = '<span class="todo">要確認</span>';
var LOCAL = DATA.edition === "local";
/* 本文中の「要確認」「要原本照合」を目立たせる（エスケープ後の文字列に使う） */
/* 確認の段階：要確認・要原本照合（未確認・朱）→ 翻刻確認（金茶）→ 院長確認（松葉）。読み：社員案・訳：社員案（藍） */
var FLAG_RE = /（(要確認|要原本照合)）|(要確認|要原本照合)/g;
var MARK_RE = /（(要確認|要原本照合|翻刻確認|院長確認|読み：社員案|訳：社員案)）|(要確認|要原本照合|翻刻確認|院長確認|読み：社員案|訳：社員案)/g;
var MARK_CLASS = {"翻刻確認":" hon", "院長確認":" ok", "読み：社員案":" yomi", "訳：社員案":" yomi"};
function flagify(html){
  return html.replace(MARK_RE, function(_, a, b){ var t = a || b; return '<span class="flag' + (MARK_CLASS[t] || "") + '">' + t + '</span>'; });
}

/* 本文の Markdown を表示用に変換する（### 見出し・**太字**・表・箇条書き・段落のみ） */
function inline(s){ return flagify(esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")); }
function cells(line){ return line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(function(c){ return c.trim(); }); }
var TBL_SEP = /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/;
function md(text){
  var lines = text.split("\n"), out = [], i = 0, m, buf;
  var isBlock = function(l){ return !l.trim() || /^#{3,6}\s/.test(l) || /^\s*\|/.test(l) || /^\s*[-*]\s+/.test(l); };
  while (i < lines.length){
    var l = lines[i];
    if (!l.trim()){ i++; continue; }
    if ((m = l.match(/^#{3,6}\s+(.*)$/))){
      out.push("<h4>" + inline(m[1]) + "</h4>"); i++;
      /* 中身のない小見出し（資料にない項目）には「要確認」を出す */
      var j = i; while (j < lines.length && !lines[j].trim()) j++;
      if (j >= lines.length || /^#{3,6}\s/.test(lines[j])) out.push("<p>" + TODO + "</p>");
      continue;
    }
    if (/^\s*\|/.test(l)){
      buf = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) buf.push(lines[i++]);
      var head = buf.length > 1 && TBL_SEP.test(buf[1]) ? cells(buf[0]) : null;
      var rows = buf.filter(function(r, j){ return !(head && j < 2); });
      out.push('<div class="tbl"><table>' +
        (head ? "<thead><tr>" + head.map(function(c){ return "<th>" + inline(c) + "</th>"; }).join("") + "</tr></thead>" : "") +
        "<tbody>" + rows.map(function(r){ return "<tr>" + cells(r).map(function(c, j){
          /* data-label：カード表示のときに列名を出す。blank：中身が「—」だけの欄はカードでは隠す */
          return "<td" + (head && head[j] ? ' data-label="' + esc(head[j]) + '"' : "") + (/^[—-]?$/.test(c) ? ' class="blank"' : "") + ">" + inline(c) + "</td>";
        }).join("") + "</tr>"; }).join("") +
        "</tbody></table></div>");
      continue;
    }
    if (/^\s*[-*]\s+/.test(l)){
      buf = [];
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) buf.push("<li>" + inline(lines[i++].replace(/^\s*[-*]\s+/, "")) + "</li>");
      out.push("<ul>" + buf.join("") + "</ul>");
      continue;
    }
    buf = [];
    while (i < lines.length && !isBlock(lines[i])) buf.push(inline(lines[i++]));
    out.push("<p>" + buf.join("<br>") + "</p>");
  }
  return out.join("");
}
function countFlags(e){
  return DATA.sections.reduce(function(n, k){ return n + (e["本文"][k].match(FLAG_RE) || []).length; }, 0);
}

function renderList(){
  var q = norm($("#q").value);
  var hits = DATA.entries.filter(function(e){ return !q || e._idx.indexOf(q) !== -1; });
  if (!DATA.entries.length){
    $("#count").textContent = "";
    $("#list").innerHTML = '<div class="listempty"><div class="big">🌼</div>まだ方剤が登録されていません<br>entries/ に方剤を足して build.py を実行してください</div>';
    return;
  }
  $("#count").textContent = q ? "該当 " + hits.length + " 件" : "方剤 " + hits.length + " 件";
  if (!hits.length){
    $("#list").innerHTML = '<div class="listempty"><div class="big">🔍</div>見つかりません</div>';
    return;
  }
  $("#list").innerHTML = hits.map(function(e){
    var sub = [e["読み"], e["出典"]].filter(Boolean).join("　");
    return '<button class="al" data-f="' + esc(e.file) + '">' +
      '<span class="num">' + (e["ツムラ番号"] ? esc(e["ツムラ番号"]) : "—") + '</span>' +
      '<span class="am"><span class="an" style="display:block">' + esc(e["名前"]) + '</span>' +
      '<span class="ax" style="display:block">' + (sub ? esc(sub) : "読み・出典 要確認") + '</span></span></button>';
  }).join("");
}

function renderDetail(e){
  var h = '<button class="back" onclick="history.length>1?history.back():go(\'\')">‹ 一覧へ</button>';
  h += '<div class="dhead"><h2>' + esc(e["名前"]) + '</h2>' +
    '<div class="yomi">' + (e["読み"] ? esc(e["読み"]) : TODO) + '</div>' +
    '<div class="tags"><span class="pill num">ツムラ ' + (e["ツムラ番号"] ? esc(e["ツムラ番号"]) : "要確認") + '</span>' +
    '<span class="pill src">' + (e["出典"] ? esc(e["出典"]) : "出典 要確認") + '</span>' +
    (countFlags(e) ? '<span class="pill flagcount">要確認・要照合 ' + countFlags(e) + '</span>' : '') + '</div></div>';
  DATA.sections.forEach(function(k){
    var v = e["本文"][k], priv = e["非公開"].indexOf(k) !== -1;
    var body = v ? md(v) : (priv ? '<span class="privnote">手元版のみ</span>' : TODO);
    h += '<div class="sec' + (k === "条文" ? " jobun" : "") + (priv && LOCAL ? " priv" : "") + '"><h3>' + esc(k) +
      (priv && LOCAL ? '<span class="privbadge">非公開を含む</span>' : '') + '</h3>' +
      '<div class="body">' + body + '</div></div>';
  });
  $("#v-detail").innerHTML = h;
}

/* 画面の状態は URL ハッシュ（#<方剤ファイル名>）で表す */
function go(f){ location.hash = f ? encodeURIComponent(f) : ""; }
function route(){
  var f = decodeURIComponent(location.hash.slice(1));
  var e = DATA.entries.filter(function(x){ return x.file === f; })[0];
  $("#v-list").classList.toggle("on", !e);
  $("#v-detail").classList.toggle("on", !!e);
  if (e){ renderDetail(e); window.scrollTo(0, 0); }
}
$("#list").addEventListener("click", function(ev){
  var b = ev.target.closest(".al"); if (b) go(b.dataset.f);
});
$("#q").addEventListener("input", function(){ renderList(); if (location.hash) go(""); });
window.addEventListener("hashchange", route);
$("#built").textContent = "データ更新 " + DATA.built + (LOCAL ? "（手元版）" : "");
$("#edition").hidden = !LOCAL;
renderList(); route();
</script>
</body>
</html>

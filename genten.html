header{position:sticky;top:0;z-index:30;

.brand{display:flex;align-items:center;gap:11px}
.brand h1{font-size:18px;margin:0}
.brand .sub{font-size:11px;color:var(--sumi2);letter-spacing:.04em;margin-top:1px}
.tampopo{width:34px;height:34px;flex:0 0 auto}
.search{position:relative;margin-top:10px}
.search input{width:100%;padding:12px 14px 12px 40px;border:1px solid var(--line);border-radius:var(--r);
  font-size:16px;background:var(--card);color:var(--sumi);font-family:inherit;-webkit-appearance:none}
.search input::placeholder{color:var(--usu)}
.search input:focus{outline:none;border-color:var(--kin);box-shadow:0 0 0 3px rgba(192,138,34,.15)}

main{max-width:760px;margin:0 auto;padding:14px calc(14px + env(safe-area-inset-right)) 90px calc(14px + env(safe-area-inset-left))}
.view{display:none;animation:fade .25s ease}

@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  .tbl td[data-label]:not(:first-child)::before{content:attr(data-label);display:block;font-size:11px;font-weight:700;color:var(--usu);letter-spacing:.04em}
  .tbl td.blank{display:none}

.listempty{text-align:center;color:var(--sumi2);padding:40px 20px;font-size:14px}
.listempty .big{font-size:40px;margin-bottom:8px}

@media print{
  header,.back,.disc{display:none!important}

<script id="genten-data" type="application/json">{"built": "2026-10-22", "edition": "public", "sections": ["条文", "出典", "構成", "方意", "諸家の論", "院長メモ"], "entries": [{"file": "葛根湯", "名前": "葛根湯", "読み": "かっこんとう", "ツムラ番号": "1", "出典": "傷寒論（巻第三・弁太陽病脈証并治中第六）／金匱要略（痙湿暍病脈証并治第二）", "本文": {"条文": "### 『傷寒論』巻第三・弁太陽病脈証并治中第六\n\n**書き下し**（読み：社員案）（1条目：項背強）\n太陽病、項背強ばること几几、汗無く悪風するは、葛根湯之を主る。\n\n**原文**（翻刻確認）\n太陽病，項背強几几，無汗惡風，葛根湯主之。\n\n**現代語訳**（訳：社員案）\n太陽病で、うなじから背中が几几とこわばり、汗が出ず、風を嫌うものは、葛根湯が主治する。\n\n**書き下し**（読み：社員案）（2条目：合病の自下利。1条目の方の後に続く）\n太陽と陽明との合病の者は、必ず自下利す。葛根湯之を主る。\n\n**原文**（翻刻確認）\n太陽與陽明合病者，必自下利，葛根湯主之。\n\n**現代語訳**（訳：社員案）\n太陽と陽明の合病のものは、必ずひとりでに下痢する。葛根湯が主治する。\n\n### 『金匱要略』痙湿暍病脈証并治第二\n\n**書き下し**（読み：社員案）\n太陽病、汗無くして小便反って少なく、気胸に上衝し、口噤して語るを得ず、剛痙を作さんと欲するは、葛根湯之を主る。\n\n**原文**（翻刻確認）\n太陽病，無汗而小便反少，氣上衝胸，口噤不得語，欲作剛痙，葛根湯主之。\n\n**現代語訳**（訳：社員案）\n太陽病で、汗が出ないのに尿がかえって少なく、気が胸に突き上げ、口を食いしばってものが言えず、剛痙を起こしかけているものは、葛根湯が主治する。\n\n### 注記\n- 「几几」は資料のルビで「キキ」と読む\n- 『傷寒論』の2条はどちらも宋本の翻刻と、四庫全書本『傷寒論注釈』（成無己注）の翻刻で同じ句（翻刻確認）\n- 四庫全書本『傷寒論注釈』の翻刻は「強」を「强」、「麻黃」を「麻黄」の字形で書く（要原本照合）\n- 『金匱要略』の篇名は、資料の中で「痙湿暍病脈証第二」と「痙湿暍病脈証治第二」の2通りに書かれる。翻刻は「痙濕暍病脈證並治第二」（翻刻確認）\n- 『金匱要略』の巻数は資料に記載がない（要確認）\n- 葛根湯方の煎じ方で、麻黄・葛根を先に煮て減らす水の量は、宋本『傷寒論』の翻刻では「減六升」（要原本照合）。本文は、『金匱要略』の翻刻・四庫全書本『傷寒論注釈』と、宋本の翻刻のほかの方（桂枝加葛根湯・葛根加半夏湯など）の「減二升」を採った\n- 『金匱要略』と四庫全書本『傷寒論注釈』の葛根湯方には「㕮咀」と「不須啜粥、餘如桂枝湯法將息及禁忌」の句があり、宋本『傷寒論』の翻刻にはない（要原本照合）\n- 四庫全書本『傷寒論注釈』の翻刻は桂枝を「桂」と書く（要原本照合）", "出典": "### 原典の構成\n- 『傷寒論』（宋本）：葛根4両、麻黄3両（去節）、桂枝2両（去皮）、生姜3両（切）、甘草2両（炙）、芍薬2両、大棗12枚（擘）（翻刻確認）\n- 『金匱要略』：葛根4両、麻黄3両（去節）、桂枝2両（去皮）、芍薬2両、甘草2両（炙）、生姜3両（切）、大棗12枚（擘）（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』（宋本）：7味を水1斗で、まず麻黄・葛根を煮て2升減らし（宋本の翻刻の「6升」は注記）、白い泡を去る。残りの薬を入れて3升に煮つめ、滓を去って1升を温服する。衣をかけてわずかに汗ばむ程度の汗をとる（翻刻確認）\n- 『金匱要略』：7味を刻み、水1斗で、まず麻黄・葛根を煮て2升減らし、泡を去る。残りの薬を入れて3升に煮つめ、滓を去って1升を温服する。衣をかけてわずかに汗ばむ程度の汗をとる。粥をすする必要はなく、ほかは桂枝湯の法に従って養生と禁忌を守る（翻刻確認）\n\n### 処方の変遷\n- 桂枝湯（桂皮・生姜・甘草・芍薬・大棗）に葛根・麻黄を加えた処方\n- 『太平恵民和剤局方』巻之二・傷寒附中暑には、葛根・麻黄・黄芩・芍薬・甘草・肉桂を粗末とし、棗を入れて煎じる「葛根解肌湯」が載るとされる（要原本照合）\n- 『丹渓心法附余』巻之一・外感門上には、傷寒の項に原典どおり7味の葛根湯、温熱病の項に『和剤局方』の葛根解肌湯が載るとされる。おおむね黄芩の有無で傷寒の薬と温熱病の薬が分けられている（要原本照合）\n- 現行エキス剤（ツムラ1）は 葛根・大棗・麻黄・甘草・桂皮・芍薬・生姜 の7味（PMDA 添付文書 2026年8月改訂 第2版で確認）。原典の「桂枝」は、資料の組成欄では「桂皮」と書かれる", "構成": "葛根・大棗・麻黄・甘草・桂皮・芍薬・生姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論", "院長メモ"]}, {"file": "葛根湯加川芎辛夷", "名前": "葛根湯加川芎辛夷", "読み": "かっこんとうかせんきゅうしんい", "ツムラ番号": "2", "出典": "本朝経験方", "本文": {"条文": "", "出典": "### 原典の構成\n\n### 原典の服用法\n\n### 処方の変遷\n- 葛根湯に川芎・辛夷を加えた加味方で、資料の出典欄は「本朝経験方」（日本の経験方）。創製者は不明とされ、多紀元簡編の書『本朝経験方』を指すものではないとされる（要確認）\n- もとの葛根湯の出典は『傷寒論』巻第三・弁太陽病脈証并治中第六と『金匱要略』痙湿暍病脈証并治第二（条文は葛根湯の項を参照）\n- 吉益東洞『方機』の葛根湯の条には応鐘散（芎黄散：大黄・川芎）の兼用が示され、葛根湯に川芎・大黄を加えた形で処方されていたとされる（要原本照合）\n- 原南陽『叢桂亭医事小言』巻之四下には、葛根湯・五物解毒湯に辛夷を加える用い方が載るとされる（要原本照合）\n- 浅田宗伯『勿誤薬室方函口訣』巻之上の葛根湯の項には、川芎・大黄を加えて脳漏・眼耳痛を治すとあるとされる（要原本照合）\n- 現行エキス剤（ツムラ2）は 葛根・大棗・麻黄・甘草・桂皮・芍薬・辛夷・川芎・生姜 の9味（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "葛根・大棗・麻黄・甘草・桂皮・芍薬・辛夷・川芎・生姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["出典", "構成", "方意", "諸家の論"]}, {"file": "乙字湯", "名前": "乙字湯", "読み": "おつじとう", "ツムラ番号": "3", "出典": "叢桂亭医事小言（巻之七・叢桂亭蔵方）／浅田家方", "本文": {"条文": "### 『叢桂亭医事小言』巻之七・叢桂亭蔵方（原南陽）\n\n**書き下し**\n乙字湯　痔疾、脱肛痛楚、或いは下血腸風、或いは前陰痒痛する者を理する方。\n\n（方後）諸瘡疥、洗伝の薬を禁ず。下部の瘡疥、最も之を忌む。誤りて枯薬洗伝し、頓に愈えて後、上逆鬱冒す。気癖の如く繊憂細慮し、或いは心気不定の如き者、并びに之を主る。而して長強に灸す。傷風下血、久服して効無き者は理中湯に宜し。\n\n**原文**（要原本照合）\n資料に原文の記載がない（要確認）\n\n**現代語訳**（訳：社員案）\n乙字湯　痔疾、脱肛の痛み苦しみ、あるいは下血・腸風、あるいは前陰の痒みや痛みがある者を治める処方。\n\n（方後）諸々の瘡疥には、洗ったり塗ったりする薬を禁じる。下部の瘡疥ではとりわけこれを忌む。誤って枯らす薬で洗ったり塗ったりし、急に治った後に、上逆して鬱冒する。気癖のように細かなことを思い悩み、あるいは心気が定まらないような者も、併せてこれを主治する。そして長強に灸をする。傷風による下血で、長く服用しても効かない者には理中湯がよい。\n\n### 『勿誤薬室方函』巻上（浅田家方）\n\n浅田宗伯『勿誤薬室方函』巻上の乙字湯は出典を南陽とし、上の方後の文のうち「洗伝の薬を禁ず。下部の瘡疥、最も之を忌む」と「而して長強に灸す。傷風下血、久服して効無き者は理中湯に宜し」を除いて引く。構成は原方と異なり、内容は「出典」の見出しに記す（要原本照合）\n\n### 注記\n- 書き下しは資料（sources/２.pdf の本の83頁）に引かれたもの。原文は資料になく、維基文庫にも翻刻が見当たらない（要原本照合）\n- 「洗伝」の「伝」は資料の表記のまま（要原本照合）\n- 原方の薬味は、資料の『叢桂亭医事小言』の引用では柴胡・黄芩・升麻・大黄・甘草・大棗・生姜の7味だが、津田玄仙『療治経験筆記』巻之九の引用は「原南陽の乙字湯の六味」とされる（要原本照合）", "出典": "### 原典の構成\n- 『叢桂亭医事小言』（原南陽の原方）：柴胡・黄芩 各7分、升麻・大黄・大棗 各4分、甘草3分、生姜2分（要原本照合）\n- 『勿誤薬室方函』（浅田家方）：柴胡・大黄・升麻・黄芩・甘草・当帰（分量は資料に記載なし）（要原本照合）\n\n### 原典の服用法\n\n### 処方の変遷\n- 「乙字湯」の名は、原南陽の蔵方の五十八方を甲字湯（瘀血）・乙字湯（痔疾）・丙字湯（諸淋）・丁字湯（澼嚢）…と名付けたうちの2番目であることによる（要原本照合）\n- 『叢桂亭医事小言』の原方には当帰が入っていない（要原本照合）\n- 『勿誤薬室方函』巻上の乙字湯は、原方から大棗・生姜を去り当帰を加えた加減方である（要原本照合）\n- 現行エキス剤（ツムラ3）は 当帰・柴胡・黄芩・甘草・升麻・大黄 の6味で、浅田家方と同じ顔ぶれ。大棗・生姜は入っていない（添付文書 2023年12月改訂 第1版で確認）", "構成": "当帰・柴胡・黄芩・甘草・升麻・大黄", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["出典", "構成", "方意", "諸家の論"]}, {"file": "安中散", "名前": "安中散", "読み": "あんちゅうさん", "ツムラ番号": "5", "出典": "太平恵民和剤局方（巻三・一切気門）／原南陽方", "本文": {"条文": "### 『太平恵民和剤局方』巻三・一切気門\n\n**書き下し**（読み：社員案）\n遠年日近の脾疼・翻胃（反胃）、口に酸水を吐し、寒邪の気、内に留滞し、停積消えず、胸膈脹満し、腹脇を攻刺し、悪心嘔逆し、面黄ばみ肌痩せ、四肢倦怠するを治す。又、婦人の血気刺痛、小腹腰に連なり、攻疰重痛するを治す。並びに能く之を治す。\n\n**原文**（翻刻確認）\n治遠年日近脾疼翻胃、口吐酸水、寒邪之氣留滯於内、停積不消、胸膈脹滿、攻刺腹脇、惡心嘔逆、面黄肌痩、四肢倦怠。又治婦人血氣刺痛、小腹連腰、攻疰重痛、並能治之。\n\n**現代語訳**（訳：社員案）\n長年続くものも近ごろ起きたものも、胃の痛みや翻胃（反胃。食べたものを吐く）で、口から酸っぱい水を吐き、寒邪の気が体内に留まって滞り、停滞したものが消えず、胸や膈が張って膨れ、腹や脇腹を刺すように痛み、吐き気がして嘔吐し、顔色が黄ばんで痩せ、手足がだるいものを治す。また、婦人の血気による刺すような痛みで、下腹が腰に連なって、差し込むように重く痛むものを治す。いずれもよく治す。\n\n### 『証治摘要』巻上・嘔吐反胃膈噎（原南陽方）\n\n中川成章『証治摘要』に、縮砂を加えた8味の安中散が原南陽の方として引かれている。引かれているのは構成と用法で、内容は「出典」の見出しに記す（要原本照合）\n\n### 注記\n- 「翻胃」は、四庫全書本の『和剤局方』では「翻胃」（翻刻確認）、同じ主治を載せる『普済方』では「反胃」（翻刻確認）、資料の書き下しでは「飜胃」と書かれる。書き下しはどちらにも決めず「翻胃（反胃）」とした\n- 「遠年日近」は、四庫全書本の『和剤局方』では「逺年近日」と書かれる（要原本照合）。資料と別の翻刻本（「远年日近」）に合わせ、本文は「遠年日近」を採った\n- 「攻疰重痛」の「疰」は、別の翻刻本では「注」と書かれる（要原本照合）\n- 原南陽方の「縮砂」は、資料の引用では「宿砂」と書かれる（要原本照合）", "出典": "### 原典の構成\n- 『和剤局方』：延胡索（去皮）・良姜（炒）・乾姜（炮）・茴香（炒）・肉桂 各5両、牡蛎（煅）4両、甘草（炒）10両（翻刻確認）\n- 原南陽方（『証治摘要』の引用）：甘草10両、縮砂・延胡索・良姜・乾姜・茴香・桂枝 各5両、牡蛎4両（要原本照合）\n\n### 原典の服用法\n- 『和剤局方』：細末とし、1回2銭を熱酒で服す。婦人は淡醋湯（薄めた酢）で服す。酒を飲まない者は塩湯で服す。時を問わず服用（翻刻確認）\n- 原南陽方（『証治摘要』の引用）：末とし、1回2銭を熱酒で服す。縮砂を去り牡蛎を3倍にして水で煎じて服す法もある（要原本照合）\n\n### 処方の変遷\n- 安中散は『和剤局方』の宝慶年間（1225〜1227年）の増補（宝慶新増方）に属する（翻刻確認。四庫全書本には宝慶新増の印がない）\n- 『和剤局方』の安中散は乾姜を含み縮砂を含まない7味（翻刻確認）\n- 縮砂を加えた8味の安中散は、中川成章『証治摘要』に原南陽の方として引かれる。原南陽自身の著書には見当たらないとされる（要原本照合）\n- 原南陽『叢桂亭医事小言』巻之四上・噎膈反胃には、牡蛎を3倍にした安中散を癖嚢病に用いる記載があるとされる（要原本照合）\n- 浅田宗伯『勿誤薬室方函』巻上には局方の安中散から乾姜を去り縮砂を加えた方、巻下・散薬部には局方の方そのものが載るとされる（要原本照合）\n- 現行エキス剤（ツムラ5）は 桂皮・延胡索・牡蛎・茴香・縮砂・甘草・良姜 の7味で、乾姜は入っていない（PMDA 添付文書 2023年12月改訂で確認）。縮砂入りの8味から乾姜を去って7味にしたのは浅田宗伯とする説がある（要確認）", "構成": "桂皮・延胡索・牡蛎・茴香・縮砂・甘草・良姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "十味敗毒湯", "名前": "十味敗毒湯", "読み": "じゅうみはいどくとう", "ツムラ番号": "6", "出典": "勿誤薬室方函（巻上）／瘍科方筌（癰疽・疔瘡）", "本文": {"条文": "### 『勿誤薬室方函』巻上・十味敗毒湯\n\n**書き下し**（要原本照合）\n\n**原文**（要原本照合）\n\n**現代語訳**\n\n### 『瘍科方筌』癰疽・十味敗毒散\n\n**書き下し**（要原本照合）\n\n**原文**（要原本照合）\n\n**現代語訳**\n\n### 注記\n- 『勿誤薬室方函』巻上の十味敗毒湯は「青洲」の方とされ、癰疽や諸々の瘡腫の初期で、増寒・壮熱して痛むものを治すとする（要原本照合。資料の書き下しによる）\n- 『瘍科方筌』癰疽の十味敗毒散は「家方」とされ、癰疽や諸般の瘡腫の初起で、憎寒・壮熱して焮痛するものを治すとする（要原本照合。資料の書き下しによる）\n- 『瘍科方筌』疔瘡にも同じ薬味の十味敗毒散があり、諸々の疔で発熱・悪寒して頭痛し、焮腫・疼痛するものを治すとする（要原本照合。資料の書き下しによる）\n- 『勿誤薬室方函』『瘍科方筌』の原文の翻刻は維基文庫に見当たらない（2026-10-22 検索。要原本照合）\n- 資料の書き下しでは、『勿誤薬室方函』は「増寒」、『瘍科方筌』は「憎寒」と書かれる（要原本照合）\n- 『瘍科方筌』の「桜筎」を、資料は『勿誤薬室方函』の「桜皮」と同じものとして比べている（要確認）", "出典": "### 原典の構成\n- 『勿誤薬室方函』巻上：柴胡・独活・桔梗・川芎・甘草・荊芥・防風・桜皮・茯苓・生姜 の10味。今は樸樕で桜皮に代えるとする（分量は資料に記載なし）（要原本照合）\n- 『瘍科方筌』癰疽：柴胡・桔梗・羌活・川芎・荊芥・防風・茯苓・甘草・桜筎・生姜 の10味（分量は資料に記載なし）（要原本照合）\n\n### 原典の服用法\n- 『瘍科方筌』癰疽：10味を水で煎じて服す（要原本照合）\n\n### 処方の変遷\n- 本方は、もとは『万病回春』巻之八・癰疽の荊防敗毒散に由来するとされる。華岡青洲がこれから独活・羌活を羌活に、柴胡・前胡を柴胡にまとめ、薄荷・連翹・枳殻・金銀花を除き、桜皮を加えて十味敗毒散を創製したとされる（要原本照合）\n- 資料は、荊防敗毒散自体も先人の方を継承改変したものとする。『和剤局方』巻之二・傷寒附中暑の人参敗毒散（人参・茯苓・甘草・前胡・芎藭・羌活・独活・桔梗・柴胡・枳殻を細末とし、生姜・薄荷を調理として水煎）、『小児薬証直訣』巻下の敗毒散（同じ薬味と調理）、『医学正伝』巻之八・痘疹の荊防敗毒散（同じ薬味に荊芥・防風を加え、調理薬の指示なし）、『薛氏医案』巻十・口歯類要・附方并註の人参敗毒散（局方の10味を水煎服し、小字双行で防風・荊芥を加えて荊防敗毒散と名づくとする）、『摂生衆妙方』巻之八・諸瘡門の荊防敗毒散（人参を去る）を経て、『万病回春』の荊防敗毒散（人参を去ったまま最も多味で、生姜を調理とする）に至る（要原本照合）\n- 『一本堂医事説約』家方四剤の排毒剤は、茯苓・独活・桔梗・川芎・枳実・柴胡（升麻に代えることもある）・甘草・生姜の8味（要原本照合）。『徽癘新書』理徽・方剤の荊防排毒剤は、排毒剤に荊芥・防風を加えた方（要原本照合）\n- 資料は、十味敗毒散は荊防排毒剤から独活を去って羌活に代え、枳実を去って桜筎を加えた処方にあたり、荊防排毒剤から枳実を去り樸樕を加えると『勿誤薬室方函』の十味敗毒湯になるとする。『瘍科方筌』の成立年が不詳のため、荊防排毒剤と十味敗毒散の先後は不明だが、『一本堂医事説約』の影響は確実とする（要原本照合）\n- 浅田宗伯『雑病翼方』巻之五・瘡癰の本朝経験十味敗毒湯は、主治が『勿誤薬室方函』とほぼ同じで、薬味は『瘍科方筌』の方と同一。資料は、『雑病翼方』は『勿誤薬室方函』より早く成り、浅田宗伯も当初は『瘍科方筌』の方どおりに処方していたとする（要原本照合）\n- 『勿誤薬室方函』の方は、『瘍科方筌』の方の羌活を独活に、桜皮を樸樕に変えたもので、資料はこの改変を浅田宗伯の経験によるものとする（要原本照合）\n- 『瘍科方筌』癰疽には人参敗毒散（局）も載り、柴胡・羌活・独活・茯苓・川芎・前胡・人参・枳実・桔梗・薄荷・甘草を姜煎する。疔瘡には十味敗毒散に続いて荊防敗毒散が載り、荊芥・防風・柴胡・羌活・独活・茯苓・川芎・前胡・人参・桔梗・枳実・薄荷・甘草を姜煎し、一方は人参がなく連翹・金銀花があるとする（要原本照合）\n- 同名異方：有持桂里『校正方輿輗』巻之十四・癰疽の十一味敗毒湯（羌活・桔梗・芎藭・柴胡・荊芥・防風・甘草・連翹・茯苓・枳実・金銀花。生姜で水煎し、大便が通じなければ大黄・芒消を加える）が、『証治摘要』巻下・方輿所載後世方では同じ配合のまま十味敗毒湯の名で載る（要原本照合）\n- 現行エキス剤（ツムラ6）は7.5g中、桔梗・柴胡・川芎・茯苓・樸樕 各3.0g、独活・防風 各1.5g、甘草・荊芥・生姜 各1.0g の10味（PMDA 添付文書 2023年12月改訂 第1版で確認）。羌活ではなく独活、桜皮ではなく樸樕が入る。添付文書に出典の欄はない\n- 資料は、今日のエキス製剤はすべて独活で、桜皮か樸樕かはメーカーによって分かれ、樸樕を用いるメーカーは一社だけとする（要確認）", "構成": "桔梗・柴胡・川芎・茯苓・樸樕・独活・防風・甘草・荊芥・生姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "柴胡桂枝湯", "名前": "柴胡桂枝湯", "読み": "さいこけいしとう", "ツムラ番号": "10", "出典": "傷寒論（弁太陽病脈証并治下第七・弁発汗後病脈証并治第十七）、金匱要略（腹満寒疝宿食病脈証治第十。外台秘要方の引用）", "本文": {"条文": "### 『傷寒論』弁太陽病脈証并治下第七\n\n**書き下し**（読み：社員案）\n傷寒六七日、発熱し、微しく悪寒し、支節煩疼し、微しく嘔し、心下支結し、外証未だ去らざる者は、柴胡桂枝湯之を主る。\n\n**原文**（翻刻確認）\n傷寒六七日、發熱、微惡寒、支節煩疼、微嘔、心下支結、外證未去者、柴胡桂枝湯主之。\n\n**現代語訳**（訳：社員案）\n傷寒にかかって六、七日たち、発熱し、わずかに悪寒がし、四肢の関節がひどく痛み、わずかに吐き気があり、みぞおちがつかえて結ぼれ（心下支結）、表の証がまだ去っていない者は、柴胡桂枝湯がこれを主治する。\n\n### 『傷寒論』弁発汗後病脈証并治第十七\n\n**書き下し**（読み：社員案）\n発汗多く、亡陽し、譫語する者は、下すべからず。柴胡桂枝湯を与え、其の栄衛を和し、以て津液を通ずれば、後に自ら愈ゆ。\n\n**原文**（翻刻確認）\n發汗多亡陽、譫語者、不可下、與柴胡桂枝湯。和其榮衛、以通津液、後自愈。\n\n**現代語訳**（訳：社員案）\n発汗が多すぎて陽気を失い（亡陽）、うわごとを言う者は、下してはならない。柴胡桂枝湯を与えて営衛を調和させ、津液を通じさせれば、その後自然に治る。\n\n### 『金匱要略』腹満寒疝宿食病脈証治第十（附方）\n\n**書き下し**（読み：社員案）\n外台の柴胡桂枝湯方。心腹卒中して痛む者を治す。\n\n**原文**（翻刻確認）\n外臺柴胡桂枝湯方、治心腹卒中痛者。\n\n**現代語訳**（訳：社員案）\n『外台秘要方』の柴胡桂枝湯の処方。胸から腹にかけて急に起こった痛み（心腹の卒中痛）を治す。\n\n### 注記\n- 弁太陽病篇の条は、宋本の翻刻・『注解傷寒論』の四庫全書本（書名『傷寒論注釋』）巻四・『金匱玉函経』で字が同じ（翻刻確認）。『金匱玉函経』の可発汗の篇に重ねて載る同じ条は「微惡風」「屬柴胡桂枝湯證」と書かれる（要原本照合）\n- 弁発汗後病篇の条は、『金匱玉函経』では「亡陽狂語者」「可與柴胡桂枝湯」「和其營衛」と書かれる（要原本照合）。本文は宋本の字を採った\n- 『金匱要略』の方名は、四部叢刊本（明・俞橋刊本）の翻刻では「外䑓柴胡桂湯方」と「枝」の字がない（要原本照合）。維基文庫の『金匱要略』の翻刻には附方が載っておらず通行本の字を確かめられないため、本文は資料の方名「柴胡桂枝湯」を採った（要原本照合）。䑓／臺は字体の違い\n- 『金匱要略』の方は『外台秘要方』からの附方。『外台秘要方』の四庫全書本 巻七・寒疝腹痛方では、仲景傷寒論の方として「寒疝腹中痛む者を療す」柴胡桂枝湯方が載る（翻刻確認。下の処方の変遷を参照）", "出典": "### 原典の構成\n- 『傷寒論』：桂枝1両半（去皮）、芍薬1両半、黄芩1両半、人参1両半、甘草1両（炙）、半夏2合半（洗）、大棗6枚（擘）、生姜1両半（切）、柴胡4両（翻刻確認）\n- 『金匱要略』：柴胡4両、黄芩・人参・芍薬・桂枝・生姜 各1両半、甘草1両、半夏2合半、大棗6枚（翻刻確認。四部叢刊本の本文による。半夏は翻刻では2合で、『傷寒論』『外台秘要方』と一致する2合半を採った。2合は異同（要原本照合））\n\n### 原典の服用法\n- 『傷寒論』：9味を水7升で煮て3升を取り、滓を去り、1升を温服する（翻刻確認）。方後に「本云：人參湯，作如桂枝法，加半夏、柴胡、黃芩；復如柴胡法，今用人參，作半劑」とある（翻刻確認）\n- 『金匱要略』：9味を水6升で煮て3升を取り、1升を温服する。日に3回服す（翻刻確認。四部叢刊本の本文による）。水の量は『傷寒論』の7升、『外台秘要方』の8升と異なる（要原本照合）\n\n### 処方の変遷\n- 構成は小柴胡湯と桂枝湯を合わせた形で、柴胡・黄芩・人参・半夏（小柴胡湯）、桂枝・芍薬（桂枝湯）、甘草・生姜・大棗（両方に共通）の9味\n- 『外台秘要方』巻七・寒疝腹痛方では、仲景傷寒論の方として寒疝で腹中が痛む者に用いる。柴胡4両、大棗6枚、黄芩・人参 各1両半、甘草1両（炙）、半夏2合半、桂心・生姜 各1両半、芍薬1両半の9味を水8升で煮て3升を取り、1升を日に3回温服する（翻刻確認）\n- 『太平聖恵方』巻第八・傷寒三陰三陽応用湯散諸方では小柴胡桂枝湯の名で、柴胡・桂枝・黄芩・人参・半夏・赤芍薬・甘草を散とし、生姜・棗で煎服するとされる（要原本照合）\n- 『三因極一病証方論』巻之四・傷風証治では柴胡加桂湯の名で、少陽の傷風に柴胡・半夏・甘草・芍薬・黄芩・人参・桂を㕮咀し、姜棗で煎服するとされる（要原本照合）\n- 『仁斎直指附遺方論』巻十八・腎気では、柴胡桂枝湯を腎気の冷熱が調わない証に用い、柴胡・人参・桂枝・白芍薬・生姜・半夏・黄芩・甘草を棗で煎ずるとされる（要原本照合）\n- 『普済方』巻二百四十八・□疝門（□は資料の字が判読できない。要確認）・寒疝心腹痛では柴胡湯の名で、寒疝の心腹痛に柴胡・大棗・黄芩・人参・甘草・半夏・桂・芍薬を散とし、姜で煎ずるとされる（要原本照合）\n- 『医学綱目』（楼英編撰）巻之三十・傷寒部・太陽病、『傷寒論条弁』巻之二では柴胡加桂枝湯の名で載るとされる（要原本照合）\n- 現行エキス剤（ツムラ10）は 柴胡・半夏・黄芩・甘草・桂皮・芍薬・大棗・人参・生姜 の9味で、原典と同じ構成（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "柴胡・半夏・黄芩・甘草・桂皮・芍薬・大棗・人参・生姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "柴胡桂枝乾姜湯", "名前": "柴胡桂枝乾姜湯", "読み": "さいこけいしかんきょうとう", "ツムラ番号": "11", "出典": "傷寒論（弁太陽病脈証并治下第七）／金匱要略（瘧病脈証并治第四・外台秘要方の引用）", "本文": {"条文": "### 『傷寒論』弁太陽病脈証并治下第七\n\n**書き下し**（読み：社員案）\n傷寒五六日、已に汗を発して復た之を下し、胸脇満微結し、小便利せず、渇して嘔せず、但だ頭汗出で、往来寒熱し、心煩する者は、此れ未だ解せずと為すなり。柴胡桂枝乾姜湯之を主る。\n\n**原文**（翻刻確認）\n傷寒五六日、已發汗而復下之、胸脅滿微結、小便不利、渴而不嘔、但頭汗出、往來寒熱、心煩者、此為未解也、柴胡桂枝乾薑湯主之。\n\n**現代語訳**（訳：社員案）\n傷寒にかかって5〜6日、すでに発汗させ、さらにこれを下したところ、胸脇部が張って軽く結ぼれ、小便が出にくく、口が渇くが吐き気はなく、頭にだけ汗が出て、悪寒と発熱が交互に起こり、胸苦しくもだえる者は、まだ病が解けていない。柴胡桂枝乾姜湯がこれを主治する。\n\n### 『金匱要略』瘧病脈証并治第四・附方（『外台秘要方』柴胡桂姜湯）\n\n**書き下し**（読み：社員案）\n柴胡桂姜湯。瘧、寒多く微しく熱有り、或いは但だ寒して熱せざるを治す。一剤を服して神の如し。\n\n**原文**（翻刻確認）\n柴胡桂薑湯：治瘧寒多微有熱、或但寒不熱。服一劑如神。\n\n**現代語訳**（訳：社員案）\n柴胡桂姜湯。瘧で、寒けが多く熱はわずかなもの、あるいは寒けだけで熱が出ないものを治す。1剤を服用すると神のように効く。\n\n### 注記\n- 『金匱要略』では方名を「柴胡桂姜湯」とし、瘧病篇の末尾に『外台秘要方』の方として附されている（翻刻確認）\n- 『金匱要略』の「服一劑如神」は、資料によれば小字双行の注として書かれる（要原本照合）\n- 『傷寒論』の条は、『注解傷寒論』の四庫全書本（書名『傷寒論注釋』）巻四では「胷脇滿㣲結」と書かれる。字体だけの違いなので本文は新字体にした（翻刻確認）\n- 宋本『傷寒論』の翻刻では、構成の黄芩が「黃岑」と書かれる。『傷寒論注釋』・『金匱要略』の翻刻は「黄芩」で、薬名として通らないため、原典の構成は黄芩とした（要確認）\n- 『傷寒論注釋』では栝楼根が「括蔞根」と書かれる（要原本照合）\n- 『外台秘要方』第二巻に引く同じ条では「傷寒六七日」「胸脇満結」と書かれるとされる（要原本照合）", "出典": "### 原典の構成\n- 『傷寒論』：柴胡半斤、桂枝3両（皮を去る）、乾姜2両、栝楼根4両、黄芩3両、牡蛎2両（熬る）、甘草2両（炙る）（翻刻確認）\n- 『金匱要略』：柴胡半斤、桂枝3両（皮を去る）、乾姜2両、栝楼根4両、黄芩3両、牡蛎3両（熬る）、甘草3両（炙る）（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』：7味を水1斗2升で煮て6升を取り、滓を去り、再び煎じて3升を取る。1升を温服し、日に3回服す。初めて服すると微しく煩し、また服して汗が出れば治る（翻刻確認）\n- 『金匱要略』：『傷寒論』と同じ。水1斗2升で煮て6升を取り、滓を去り、再び煎じて3升を取り、1升を温服し、日に3回服す。初めて服すると微しく煩し、また服して汗が出れば治る（翻刻確認）\n\n### 処方の変遷\n- 『傷寒論』と『金匱要略』では、牡蛎と甘草の量が違う（『傷寒論』は各2両、『金匱要略』は各3両）（翻刻確認）\n- 『外台秘要方』第二巻・傷寒下・傷寒小便不利方には、仲景傷寒論の引用として「小柴胡桂姜湯」の名で載り、桂枝が桂心となるほかは原典と同じ薬味とされる（要原本照合）\n- 『鶏峰普済方』巻第十四・治瘧には「姜桂湯」の名で載り、柴胡桂枝乾姜湯と同じ方とされる（要原本照合）\n- 『金匱要略』瘧病篇の附方で本方の一つ前に載る柴胡去半夏加栝蔞湯（柴胡・人参・黄芩・甘草・栝蔞根・生姜・大棗）は、構成が比較的本方に近いとされる（構成は翻刻確認。評価は要原本照合）\n- 『導水瑣言』には本方に茯苓を加えた姜桂加茯苓湯が載り、方後に、脇下に上衝する者は呉茱萸を、脈が一層虚候を見わし心下の和し難い者は附子を加えるとされる（要原本照合）\n- 『勿誤薬室方函口訣』巻之上・緩中湯の条では、高階の緩痃湯は本方に鼈甲・芍薬を加えたものとされる（要原本照合）\n- 現行エキス剤（ツムラ11）は 柴胡・黄芩・栝楼根・桂皮・牡蛎・乾姜・甘草 の7味で、原典と同じ構成（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "柴胡・黄芩・栝楼根・桂皮・牡蛎・乾姜・甘草", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "柴胡加竜骨牡蛎湯", "名前": "柴胡加竜骨牡蛎湯", "読み": "さいこかりゅうこつぼれいとう", "ツムラ番号": "12", "出典": "傷寒論（弁太陽病脈証并治中第六）", "本文": {"条文": "### 『傷寒論』弁太陽病脈証并治中第六\n\n**書き下し**（読み：社員案）\n傷寒八九日、之を下し、胸満煩驚し、小便利せず、譫語し、一身尽く重く、転側すべからざる者は、柴胡加竜骨牡蛎湯之を主る。\n\n**原文**（翻刻確認）\n傷寒八九日、下之、胸滿煩驚、小便不利、譫語、一身盡重、不可轉側者、柴胡加龍骨牡蠣湯主之。\n\n**現代語訳**（訳：社員案）\n傷寒にかかって八、九日たち、これを下したところ、胸が張って煩わしく驚きやすくなり、小便の出が悪く、うわごとを言い、全身がことごとく重く、寝返りを打つことができないものは、柴胡加竜骨牡蛎湯がこれを主治する。\n\n### 注記\n- 『傷寒論注釋』（『注解傷寒論』）の四庫全書本 巻三では、条文の字は同じで、「胸」を「胷」、「譫語」を「讝語」と書く（翻刻確認。字体の違いのみ）\n- 『金匱玉函経』巻二・弁太陽病形証治第三では、「不可轉側者」が「不可轉側」と書かれる（「者」の字がない）（要原本照合）。同書巻六・弁発汗吐下後病形証治第十九にも「一身不可轉側、屬柴胡加龍骨牡蠣湯證」の形で重出し、「盡重」の句がない（要原本照合）\n- 資料は、宋本の方の後に「本云う、柴胡湯と。今、竜骨等を加う」の文があるとする。維基文庫の宋本の翻刻には見当たらない（要原本照合）\n- 「牡蠣」は書き下しでは新字体の「牡蛎」とした", "出典": "### 原典の構成\n- 『傷寒論』（宋本）：柴胡4両、竜骨・黄芩・生姜（切）・鉛丹・人参・桂枝（去皮）・茯苓 各1両半、半夏2合半（洗）、大黄2両、牡蛎1両半（熬）、大棗6枚（擘）の12味（翻刻確認）\n- 『傷寒論注釋』四庫全書本 巻三（成本）には黄芩がなく11味（翻刻確認）。半夏は2合と書かれる（要原本照合）\n- 『金匱玉函経』巻七は鉛丹を「黄丹」と書く（要原本照合）。ほかの味と分量は宋本と同じ\n\n### 原典の服用法\n- 『傷寒論』（宋本）：12味を水8升で煮て4升を取り、大黄を碁石のように切って入れ、さらに1、2沸させて滓を去り、1升を温服する（翻刻確認）\n- 『傷寒論注釋』四庫全書本は「十一味」「更煮一二沸」と書く（要原本照合）\n- 『金匱玉函経』は、4升を取ったあと大黄を入れてさらに煮て2升を取り、滓を去って1升を温服するとし、方後に「本方は柴胡湯の内に竜骨・牡蛎・黄丹・桂・茯苓・大黄を加う。今分かちて半剤と作す」とある（要原本照合）\n\n### 処方の変遷\n- 小柴胡湯から甘草を去り、竜骨・牡蛎・桂皮・茯苓・大黄を加えた構成（資料の解説）。原典にはさらに鉛丹が入るが、鉛中毒を恐れて現在は普通入れない（資料の論考①）\n- 成本（『注解傷寒論』）には黄芩がない。『傷寒論輯義』（多紀元簡）巻二は黄芩を記して「成本無し」と注し、『訂字標注傷寒論』（小原良直訂正）・『類聚方』・『校正方輿輗』・『勿誤薬室方函』巻上の本方にも黄芩がないとされる（要原本照合）\n- 『傷寒論集成』巻之三は、方名からすれば小柴胡湯に二物を加えるべきで、鉛丹・桂皮・茯苓・大黄の四味や、大黄を後から入れる煎法は仲景の本来のものではないとする（要原本照合）\n- 現行エキス剤（ツムラ12）は 柴胡5.0・半夏4.0・桂皮3.0・茯苓3.0・黄芩2.5・大棗2.5・人参2.5・牡蛎2.5・竜骨2.5・生姜1.0g（1日量7.5g中、乾燥エキス4.5g。PMDA 添付文書 2023年12月改訂 第1版で確認）。原典の鉛丹・大黄を含まず、桂枝が桂皮となる。添付文書に出典の欄はない\n- 資料は、エキス製剤は一社が大黄を入れないだけで、他社は宋本による同一組成とする（要確認）", "構成": "柴胡・半夏・桂皮・茯苓・黄芩・大棗・人参・牡蛎・竜骨・生姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "黄連解毒湯", "名前": "黄連解毒湯", "読み": "おうれんげどくとう", "ツムラ番号": "15", "出典": "肘後百一方（巻二・治傷寒時気温病方第十三）／外台秘要方（巻一・崔氏方の引用）", "本文": {"条文": "### 『肘後百一方』巻二・治傷寒時気温病方第十三\n\n**書き下し**（読み：社員案）\n若し已に六七日、熱極まり、心下煩悶し、狂言して鬼を見、起ちて走らんと欲す。……又方、黄連三両、黄檗・黄芩各二両、梔子十四枚、水六升もて煎じて二升を取り、分けて再服す。煩嘔して眠るを得ざるを治す。\n\n**原文**（翻刻確認）\n若已六七日、熱極、心下煩悶、狂言見鬼、欲起走。……又方、黄連三兩、黄檗・黄芩各二兩、梔子十四枚、水六升、煎取二升、分再服。治煩嘔不得眠。\n\n**現代語訳**（訳：社員案）\n発病してすでに6〜7日たち、熱が極まって、みぞおちが苦しく悶え、うわごとを言って幻を見、起き上がって走り出そうとするもの。……別の方として、黄連3両、黄檗・黄芩各2両、梔子14枚を水6升で煎じて2升を取り、2回に分けて服す。胸苦しくて吐き気があり、眠れないものを治す。\n\n### 『外台秘要方』巻一・崔氏方\n\n**書き下し**（読み：社員案）\n又、前軍督護劉車なる者、時疾を得て三日、已に汗して解す。飲酒に因りて復た劇しく、煩悶・乾嘔に苦しみ、口燥きて呻吟し、錯語して臥するを得ず。余思いて此の黄連解毒湯方を作る。\n\n一服して目明らかに、再服して粥を進め、此に於いて漸く差ゆ。余以て凡そ大熱盛んにして、煩嘔・呻吟し、錯語して眠るを得ざるを療するに、皆佳し。伝えて諸人に語り、之を用いて亦効あり。此れ直ちに熱毒を解し、酷熱を除く。必ずしも飲酒して劇しき者ならず、此の湯もて療すること五日中に神効あり。豬肉・冷水を忌む。\n\n**原文**（翻刻確認）\n又前軍督護劉車者、得時疾三日、已汗解、因飲酒復劇、苦煩悶乾嘔、口燥呻吟、錯語不得卧、余思作此黄連解毒湯方。\n\n一服目明、再服進粥、於此漸差。余以療凡大熱盛、煩嘔呻吟、錯語不得眠、皆佳。傳語諸人、用之亦效。此直解熱毒、除酷熱、不必飲酒劇者、此湯療五日中神效。忌豬肉冷水。\n\n**現代語訳**（訳：社員案）\n前軍督護の劉車という者が、流行病にかかって3日目に、発汗してすでに治っていたが、飲酒によって再びひどくなり、胸苦しい悶えと空えずきに苦しみ、口が乾いてうめき、うわごとを言って横になれなかった。そこで私はこの黄連解毒湯を考えて作った。1回服すと目がはっきりし、2回服すと粥が食べられるようになり、そこから次第に治った。私はこれを用いて、およそ高熱が盛んで、胸苦しく吐き気があってうめき、うわごとを言って眠れないものを治したが、いずれもよく効いた。人々に伝えたところ、用いた者にもやはり効いた。これは直ちに熱毒を解き、激しい熱を除く。飲酒でひどくなったものでなくても、この湯で治療すれば5日のうちに著しく効く。豚肉と冷水を避ける。\n\n### 注記\n- 『肘後百一方』では本方に方名がない。「若已六七日…欲起走」の条の下に並ぶ「又方」の一つとして載り、最後に「治煩嘔不得眠」とある（翻刻確認）\n- 方名「黄連解毒湯」は『外台秘要方』巻一の崔氏方に出る（翻刻確認）\n- 翻刻のページ名は『肘後備急方』（四庫全書本、晋・葛洪撰）。同書の提要に、陶弘景が補って『肘後百一方』とし、楊用道が附広したとある（翻刻確認）\n- 『外台秘要方』の「復劇」の「劇」は、四庫全書本の翻刻では外字のため確認できず、別の翻刻本では「劇」（要原本照合）\n- 『外台秘要方』の「乾嘔」は、別の翻刻本では「幹嘔」と書かれる（機械的な繁体化によるものとみられる。要原本照合）\n- 『外台秘要方』の「余」は、四庫全書本では「余」、別の翻刻本では「餘」（要原本照合）\n- 『外台秘要方』の構成の「黄柏」は、四庫全書本では「黄蘗」と書かれる（要原本照合）", "出典": "### 原典の構成\n- 『肘後百一方』：黄連3両、黄檗（黄柏）・黄芩 各2両、梔子14枚（翻刻確認）\n- 『外台秘要方』（崔氏方）：黄連3両、黄芩・黄柏 各2両、梔子14枚（擘く）（翻刻確認）\n\n### 原典の服用法\n- 『肘後百一方』：水6升で煎じて2升を取り、2回に分けて服す（翻刻確認）\n- 『外台秘要方』（崔氏方）：4味を刻み、水6升で煮て2升を取り、2回に分けて服す。猪肉・冷水を忌む（翻刻確認）\n\n### 処方の変遷\n- 『肘後百一方』に方名のない「又方」として4味が載り、『外台秘要方』巻一の崔氏方で「黄連解毒湯」の名が付く（翻刻確認）\n- 『傷寒活人書』巻十八にも同じ主治で収載される（要原本照合）\n- 劉完素『黄帝素問宣明論方』巻四・熱論では、黄連・黄柏・黄芩・大黄の大金花丸から大黄を去り梔子を加えたものを梔子金花丸とし、巻六・傷寒方では黄連解毒湯を茶と共に煎服する。腹満・嘔吐などに半夏・厚朴・茯苓を加え生姜で煎じる半夏黄連解毒湯の記載もある（要原本照合）\n- 劉完素『傷寒直格方』巻下では、細末にして水で丸じ温水で服す法を載せる（要原本照合）\n- 書によって梔子金花丸に大黄を含むものと含まないものがあり、方名は錯雑している（要原本照合）\n- 『万病回春』巻二・傷寒には柴胡・連翹を加えた6味の黄連解毒湯、同書の火証にはさらに芍薬を加えた方が載る。後者は後の一貫堂の四物黄連解毒湯のもとになったとされる（要原本照合）\n- 『外科正宗』巻二・疔瘡論では、連翹・甘草・牛蒡子を加えて灯心で煎服する（要原本照合）\n- 現行エキス剤（ツムラ15）は 黄芩3.0・黄連2.0・山梔子2.0・黄柏1.5g（7.5g中）の4味（PMDA 添付文書 2023年12月改訂で確認）。原典は黄連が最も多い", "構成": "黄芩・黄連・山梔子・黄柏", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "五苓散", "名前": "五苓散", "読み": "ごれいさん", "ツムラ番号": "17", "出典": "傷寒論（弁太陽病脈証并治中第六）／金匱要略（痰飲咳嗽病脈証并治第十二）", "本文": {"条文": "### 『傷寒論』弁太陽病脈証并治中第六\n\n**書き下し**（読み：社員案）\n太陽病、発汗の後、大いに汗出で、胃中乾き、煩躁して眠るを得ず、水を飲むを得んと欲する者は、少少与えて之を飲ましめ、胃気をして和せしむれば則ち愈ゆ。若し脈浮、小便利せず、微熱して消渇する者は、五苓散之を主る。\n\n**原文**（翻刻確認）\n太陽病、發汗後、大汗出、胃中乾、煩躁不得眠、欲得飲水者、少少與飲之、令胃氣和則愈。若脈浮、小便不利、微熱消渴者、五苓散主之。\n\n**現代語訳**（訳：社員案）\n太陽病で発汗させた後、大いに汗が出て、胃の中が乾き、煩躁して眠れず、水を飲みたがるものには、少しずつ与えて飲ませ、胃気を調和させれば治る。もし脈が浮で、尿の出が悪く、微熱があって消渇する（しきりに渇いて水を飲む）ものは、五苓散がこれを主治する。\n\n**書き下し**（読み：社員案）\n発汗し已りて、脈浮数、煩渇する者は、五苓散之を主る。\n\n**原文**（翻刻確認）\n發汗已、脈浮數、煩渴者、五苓散主之。\n\n**現代語訳**（訳：社員案）\n発汗し終えて、脈が浮数で、煩渇する（ひどく口が渇いて苦しむ）ものは、五苓散がこれを主治する。\n\n**書き下し**（読み：社員案）\n傷寒、汗出でて渇する者は、五苓散之を主る。渇せざる者は、茯苓甘草湯之を主る。\n\n**原文**（翻刻確認）\n傷寒汗出而渴者、五苓散主之。不渴者、茯苓甘草湯主之。\n\n**現代語訳**（訳：社員案）\n傷寒で、汗が出て口が渇くものは、五苓散がこれを主治する。渇かないものは、茯苓甘草湯がこれを主治する。\n\n**書き下し**（読み：社員案）\n中風発熱し、六七日解せずして煩し、表裏の証有り、渇して水を飲まんと欲し、水入れば則ち吐する者は、名づけて水逆と曰う。五苓散之を主る。\n\n**原文**（翻刻確認）\n中風發熱、六七日不解而煩、有表裏證、渴欲飲水、水入則吐者、名曰水逆、五苓散主之。\n\n**現代語訳**（訳：社員案）\n中風で発熱し、六、七日たっても解けずに煩躁し、表と裏の両方の証があり、口が渇いて水を飲みたがるが、水が入るとすぐに吐くものを、水逆という。五苓散がこれを主治する。\n\n### 『金匱要略』痰飲咳嗽病脈証并治第十二\n\n**書き下し**（読み：社員案）\n仮令えば瘦人、臍下に悸有り、涎沫を吐して癲眩するは、此れ水なり。五苓散之を主る。\n\n**原文**（翻刻確認）\n假令瘦人臍下有悸、吐涎沫而癲眩、此水也、五苓散主之。\n\n**現代語訳**（訳：社員案）\nたとえば痩せた人で、臍の下に動悸があり、泡のようなよだれを吐いて癲眩する（めまいがする）のは、水によるものである。五苓散がこれを主治する。\n\n### 関連条文（誤治の例）\n\n『傷寒論』弁太陽病脈証并治下第七。熱病に冷水を吹きかけ・注ぐ誤治の例として資料が挙げる条。\n\n**書き下し**（読み：社員案）\n病陽に在らば、応に汗を以て之を解すべし。反って冷水を以て之に潠ぎ、若しくは之に灌げば、其の熱劫かされて去るを得ず、彌いよ更に益ます煩し、肉上粟起し、意に水を飲まんと欲するも、反って渇せざる者は、文蛤散を服す。若し差えざる者は、五苓散を与う。\n\n**原文**（翻刻確認）\n病在陽、應以汗解之、反以冷水潠之、若灌之、其熱被劫、不得去、彌更益煩、肉上粟起、意欲飲水、反不渴者、服文蛤散。若不差者、與五苓散。\n\n**現代語訳**（訳：社員案）\n病が陽にあるときは、汗によって解すべきである。それなのにかえって冷水を吹きかけたり注いだりすると、その熱が抑え込まれて去ることができず、ますます煩躁し、皮膚に粟粒のようなものが立ち、気持ちでは水を飲みたいのにかえって渇かないものは、文蛤散を服す。もし治らないものには、五苓散を与える。\n\n### 注記\n- 資料は、宋本の最初の条（太陽病、発汗後…）の直後に小字双行で「即猪苓散是」（即ち猪苓散是なり）の注があるとする。維基文庫の宋本の翻刻には見当たらない（要原本照合）\n- 最初の条の「五苓散主之」は、『注解傷寒論』の四庫全書本（書名『傷寒論注釋』）巻三と『金匱玉函経』では「與五苓散主之」と書かれる（要原本照合）\n- 2番目の条の「發汗已、脈浮數」は、『金匱玉函経』では「發汗後、脈浮而數」と書かれる（要原本照合）\n- 4番目の条の「水入則吐者、名曰水逆」は、『金匱玉函経』では「水入即吐、此為水逆」と書かれる（要原本照合）\n- 「乾」は『金匱玉函経』の翻刻では「干」と書かれる（字体の違い）\n- 関連条文の宋本の条は、このあと「寒實結胸、無熱證者、與三物小陷胸湯、白散亦可服」と続く。五苓散に関わる部分までを載せた（翻刻確認）\n- 関連条文は、『金匱玉函経』では「反以水潠之」「皮上粟起」などと書かれる（要原本照合）。『傷寒論注釋』巻四は宋本と同じ（劫／刼の字体の差のみ。翻刻確認）\n- 宋本の方の茯苓は、維基文庫の翻刻では「株茯苓十八銖」と書かれる。『傷寒論注釋』巻三・『金匱玉函経』は「茯苓十八銖」で、原典の構成は茯苓とした（要原本照合）。沢瀉は『傷寒論注釋』巻三では「一兩六銖半」、桂枝は両書とも「桂」と書かれる（要原本照合）\n- 『金匱要略』の条の「瘦人」「癲眩」について、資料は『医宗金鑑』が「瘦」は「病」、「癲」は「巓」の伝写の誤りとすることを引く（要原本照合）\n- 宋本にはほかにも五苓散の条がある（弁太陽病脈証并治下第七、弁陽明病脈証并治第八、弁霍乱病脈証并治第十三。翻刻確認）。『金匱要略』では消渇小便不利淋病脈証并治第十三にも2条ある（翻刻確認）", "出典": "### 原典の構成\n- 『傷寒論』：猪苓18銖（去皮）、沢瀉1両6銖、白朮18銖、茯苓18銖、桂枝半両（去皮）（翻刻確認）\n- 『金匱要略』：痰飲咳嗽病の篇の方は、維基文庫の翻刻には見当たらない（要原本照合）\n\n### 原典の服用法\n- 『傷寒論』：5味を搗いて散とし、白飲（重湯）で方寸匕を和して服す。日に3回。暖かい水を多く飲み、汗が出れば愈える。法のとおりに養生する（翻刻確認）\n\n### 処方の変遷\n- 構成上は四苓湯（猪苓・沢瀉・白朮・茯苓）に桂皮を加えた方だが、歴史的には本方のほうが古い（資料の解説）\n- 『備急千金要方』巻第九・傷寒上・発汗散第四と巻第十・傷寒下・傷寒発黄第五に五苓散の名で載る。資料は、巻第十の方は各味の配合量が多いとする（要原本照合）\n- 『太平聖恵方』では巻第九・巻第十に猪苓散の名で同じ5味が載る。巻第十・治傷寒中風諸方には葛根を加えた6味の猪苓散、巻第十二・治傷寒霍乱諸方には沢瀉の代わりに甘草を入れた方があるとする（要原本照合）\n- 『傷寒直格方』巻下・諸証薬石分剤では、方後に滑石・阿膠を加える加減が書かれる。資料は五苓散加滑石・阿膠を五苓散合猪苓湯とする（要原本照合）\n- 現行の医療用エキス剤（ツムラ17）は 沢瀉4.0g、蒼朮・猪苓・茯苓 各3.0g、桂皮1.5g の5味。原典の白朮の代わりに蒼朮が入る（PMDA 添付文書 2023年12月改訂で確認）", "構成": "沢瀉・蒼朮・猪苓・茯苓・桂皮", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "桂枝加朮附湯", "名前": "桂枝加朮附湯", "読み": "けいしかじゅつぶとう", "ツムラ番号": "18", "出典": "方機（桂枝湯の条）", "本文": {"条文": "### 『方機』桂枝湯の条\n\n**書き下し**（要原本照合）\n\n**原文**（要原本照合）\n\n**現代語訳**\n\n### 注記\n- 『方機』の桂枝湯の条は、桂枝加朮附湯を湿家の骨節疼痛、半身不随・口眼喎斜、頭疼、身体麻痺、激しい頭痛などに挙げる（要原本照合。資料の論考②の引用による）\n- 資料は、この条で各症に応鐘散・七宝丸・南呂丸・紫円などを兼用するとする（要原本照合）\n- 『方機』の条は「朮」とだけ書き、蒼朮か白朮かを書かない（要原本照合）", "出典": "### 原典の構成\n- 『傷寒論』（宋本）桂枝加附子湯（もとの方）：桂枝3両（去皮）、芍薬3両、甘草2両（炙）、生姜3両（切）、大棗12枚（擘）、附子1枚（炮、去皮、破八片）（翻刻確認）\n- 『方機』：桂枝加附子湯に朮を加える。朮・附子の分量は資料に記載がない（要原本照合）\n\n### 原典の服用法\n- 『傷寒論』（宋本）桂枝加附子湯（もとの方）：6味を水7升で煮て3升を取り、滓を去って1升を温服する（翻刻確認）\n\n### 処方の変遷\n- 桂枝加附子湯に朮を加えた加味方。桂枝加附子湯の出典は『傷寒論』巻第二・弁太陽病脈証并治上第五で、太陽病で発汗して汗が漏れて止まらず、悪風し、小便が出にくく、四肢が軽くひきつって屈伸しにくいものを主治する（翻刻確認）\n- 資料の出典欄は『傷寒論』『方機』の2書を挙げる。桂枝加朮附湯の名が出るのは『方機』の桂枝湯の条（要原本照合）\n- 『方機』の著者・成立年は資料に記載がない（要確認）\n- 『類聚方広義』（上）の桂枝加附子湯にも、この方に朮を加えて桂枝加朮附子湯と名づけるとある（要原本照合）\n- 現行エキス剤（ツムラ）は 桂皮・芍薬・蒼朮・大棗・甘草・生姜・ブシ末 の7味で、朮は蒼朮、附子はブシ末（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "桂皮・芍薬・蒼朮・大棗・甘草・生姜・附子（ブシ末）", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "加味逍遙散", "名前": "加味逍遙散", "読み": "かみしょうようさん", "ツムラ番号": "24", "出典": "万病回春（巻之六・婦人科・虚労）／薛氏医案（内科摘要・巻下・各症方薬）／薛氏医案（女科撮要・附方并注）／薛氏医案（保嬰撮要・脇癰）", "本文": {"条文": "### 『万病回春』巻之六・婦人科・虚労（逍遙散の条）\n\n**書き下し**（読み：社員案）\n虚労にて熱嗽し汗有る者。逍遙散　肝脾の血虚して発熱し、或いは潮熱し、或いは自汗・盗汗し、或いは頭痛・目眩し、或いは怔忡して寧からず、煩赤して口乾き、或いは月経調わず、或いは肚腹痛みを作し、或いは小腹重墜して水道渋痛し、或いは腫痛して膿を出だし、内熱して渇を作すを治す。（方後に）牡丹皮・梔子（炒）を加え、加味逍遙散と名づく。\n\n**原文**（翻刻確認）\n虛勞熱嗽有汗者。逍遙散　治肝脾血虛發熱、或潮熱、或自汗盜汗、或頭痛目眩、或怔忡不寧、煩赤口乾、或月經不調、或肚腹作痛、或小腹重墜水道澀痛、或腫痛出膿、内熱作渴。（方後）加牡丹皮、梔子炒、名加味逍遙散。\n\n**現代語訳**（訳：社員案）\n虚労で熱があって咳をし、汗の出るもの。逍遙散は、肝脾の血虚で発熱し、あるいは潮熱し、あるいは自汗・盗汗し、あるいは頭痛・めまいがし、あるいは動悸がして落ち着かず、顔が赤く口が乾き、あるいは月経が整わず、あるいは腹が痛み、あるいは下腹が重く下がる感じがして尿の出が渋って痛み、あるいは腫れて痛み膿が出て、内に熱があって口が渇くものを治す。（方の後に）牡丹皮・山梔子（炒）を加えたものを加味逍遙散と名づける。\n\n### 『内科摘要』巻下・各症方薬（薛己）\n\n**書き下し**（読み：社員案）\n加味逍遙散　肝脾の血虚して発熱し、或いは潮熱・晡熱し、或いは自汗・盗汗し、或いは頭痛・目渋し、或いは怔忡して寧からず、或いは頬赤く口乾き、或いは月経調わず、肚腹痛みを作し、或いは小腹重墜して水道渋痛し、或いは腫痛して膿を出だし、内熱して渇を作す等の症を治す。\n\n**原文**（翻刻確認）\n加味逍遙散　治肝脾血虛發熱、或潮熱晡熱、或自汗盜汗、或頭痛目澀、或怔忡不寧、或頰赤口乾、或月經不調、肚腹作痛、或小腹重墜、水道澀痛、或腫痛出膿、内熱作渴等症。\n\n**現代語訳**（訳：社員案）\n加味逍遙散は、肝脾の血虚で発熱し、あるいは潮熱・夕方の発熱があり、あるいは自汗・盗汗し、あるいは頭痛がして目がしぶり、あるいは動悸がして落ち着かず、あるいは頬が赤く口が乾き、あるいは月経が整わず腹が痛み、あるいは下腹が重く下がる感じがして尿の出が渋って痛み、あるいは腫れて痛み膿が出て、内に熱があって口が渇くなどの症を治す。\n\n### 『女科撮要』附方并注（薛己）\n\n**書き下し**（読み：社員案）\n加味逍遙散　血虚して熱有り、遍身搔痒し、或いは口燥き咽乾き、発熱・盗汗し、食少なくして嗜臥し、小便渋滞する等の症を治す。\n\n**原文**（翻刻確認）\n加味逍遙散　治血虛有熱、遍身搔癢、或口燥咽乾、發熱盜汗、食少嗜臥、小便澀滯等症。\n\n**現代語訳**（訳：社員案）\n加味逍遙散は、血虚で熱があり、全身がかゆく、あるいは口や喉が乾き、発熱して盗汗し、食が少なく横になりたがり、尿の出が渋って滞るなどの症を治す。\n\n### 『保嬰撮要』脇癰（薛鎧）\n\n**書き下し**（読み：社員案）\n加味逍遙散　小児の肝脾血虚・内熱にて、脇腹痛みを作し、頭目昏黒し、怔忡・頬赤し、口燥き咽乾き、或いは発熱・盗汗し、食少なく寐ねず、或いは口舌に瘡を生じ、胸乳膨脹し、小便利せず、或いは女子前症を患いて、経候調わず、発熱・咳嗽し、寒熱往来する等の症を治す。（方は発熱不止に見ゆ）\n\n**原文**（翻刻確認）\n加味逍遙散　治小兒肝脾血虛内熱、脇腹作痛、頭目昏黑、怔忡頰赤、口燥咽乾、或發熱盜汗、食少不寐、或口舌生瘡、胸乳膨脹、小便不利、或女子患前症、經候不調、發熱咳嗽、寒熱往來等症。（方見發熱不止）\n\n**現代語訳**（訳：社員案）\n加味逍遙散は、小児の肝脾の血虚と内熱で、脇腹が痛み、頭がくらくらして目の前が暗くなり、動悸がして頬が赤く、口や喉が乾き、あるいは発熱して盗汗し、食が少なく眠れず、あるいは口や舌にできものができ、胸や乳が張り、尿の出が悪いもの、あるいは女子が前に挙げた症を患って月経が整わず、発熱して咳をし、寒気と熱が交互に来るなどの症を治す。（方は「発熱不止」の項に載る）\n\n### 注記\n- 『万病回春』の条は逍遙散の条で、加味逍遙散は方後の「牡丹皮・梔子（炒）を加え、加味逍遙散と名づく」の一句だけで示される。加味逍遙散だけの条はない（翻刻確認）\n- 『万病回春』の「煩赤口乾」は、『内科摘要』では「頰赤口乾」（要原本照合）\n- 『万病回春』の「目眩」は、『内科摘要』では「目澀」。『万病回春』の条には『内科摘要』の「晡熱」がない（翻刻確認）\n- 維基文庫の『萬病回春』『内科摘要』『女科撮要』『保嬰撮要』は簡体字の本で、原文は社員が繁体字に直した。字形（澀／渋、癢／痒など）は要原本照合\n- 『保嬰撮要』の脇癰は、維基文庫の本では巻十三にある。資料は巻十一とする（要原本照合）\n- 『保嬰撮要』の方は「発熱不止」の項の方を採った（柴胡7分）。同書の巻三・天釣内釣の項の方では柴胡が1銭（要原本照合）\n- 『女科撮要』の附方并注は、維基文庫の本では巻末の「附方并注」の先頭に加味逍遙散があり、続けて「逍遙散　即ち前方より丹皮・山梔を去る」とある（翻刻確認）", "出典": "### 原典の構成\n- 『万病回春』巻之六・虚労：逍遙散（当帰（酒洗）・白芍（酒炒）・白朮（土炒）・白茯苓・柴胡（酒炒） 各1銭、甘草（炙）5分）に牡丹皮・梔子（炒）を加える。加える量の記載はない（翻刻確認）\n- 『内科摘要』巻下・各症方薬：当帰・芍薬・茯苓・白朮（炒）・柴胡 各1銭、牡丹皮・山梔（炒）・甘草（炙） 各5分（翻刻確認）\n- 『女科撮要』附方并注：甘草（炙）・当帰（炒）・芍薬（酒炒）・茯苓・白朮（炒）・柴胡 各1銭、牡丹皮・山梔（炒） 各5分（翻刻確認）\n- 『保嬰撮要』発熱不止の方：当帰・甘草（炙）・芍薬（酒拌）・茯苓・白朮（炒） 各1銭、柴胡・牡丹皮・山梔（炒） 各7分（翻刻確認。柴胡の異同は条文の注記を参照）\n\n### 原典の服用法\n- 『万病回春』：1剤に刻み、煨姜1片・薄荷少々を入れて水で煎じて服す（翻刻確認）\n- 『内科摘要』：水で煎じて服す（翻刻確認）\n- 『女科撮要』：水で煎じて服す（翻刻確認）\n- 『保嬰撮要』発熱不止の方：4剤に分けて水で煎じて服す。乳母の肝脾血虚・内熱、あるいは寒熱・遍身瘙痒などの症にとくに宜しい（翻刻確認）\n\n### 処方の変遷\n- 原方は逍遙散。逍遙散の出典は『太平恵民和剤局方』巻之九・婦人諸疾（附産図）で、甘草・芍薬・当帰・茯苓・白朮・柴胡を粗末とし、煨生姜・薄荷で煎服する。資料は、『和剤局方』には加味逍遙散は載らず、逍遙散は原書五巻本に登載されるとする（要原本照合）\n- 資料の出典欄には『太平恵民和剤局方』『薛氏医案』『万病回春』が並ぶ。『和剤局方』は原方の逍遙散の出典にあたる\n- 『聖済総録』巻第百五十・婦人血風門には、逍遙飲が2方載る。婦人血風走注の方は柴胡・白茯苓・赤芍薬・白朮・当帰を粗く搗き、生姜・棗・甘草で煎服する。婦人血風身体骨節疼痛の方は白茯苓・柴胡・白朮・当帰・赤芍薬・甘草を粗く搗いて煎服する（要原本照合）\n- 『世医得効方』（危亦林編撰）巻第十五・産科兼婦人雑病科・癲狂には同名の加味逍遙散があり、局方の逍遙散の6味に姜・麦門冬を調理とし、遠志・桃仁・蘇木・紅花を加える（要原本照合）\n- 逍遙散に牡丹皮・山梔子を加えたのは薛己で、『内科摘要』各症方薬に載る（翻刻確認）。『内科摘要』『女科撮要』『保嬰撮要』の加味逍遙散には生姜・薄荷が入らない（翻刻確認）。資料は、『明医雑著』附方の加味逍遙散は「姜水煎服」で生姜はあるが薄荷はないとする（要原本照合）\n- 資料は、『薛氏医案』十六種のうち『保嬰粋要』『保嬰金鏡録』『銭氏小児直訣』『小児痘疹方論』にも加味逍遙散が載るとする（要原本照合）\n- 『万病回春』巻之六・婦人科・虚労の逍遙散は、煨姜・薄荷を入れて煎じ、牡丹皮・梔子を加えて加味逍遙散とする（翻刻確認）。資料は、ここで初めて十味の加味逍遙散が登載されたとする\n- 資料は、張三錫『医学六要』治法彙七巻・婦人門・経水の逍遙散の条に「丹皮・梔子加うるは更に佳し」とあるとする（要原本照合）\n- 現行エキス剤（ツムラ24）は 柴胡・芍薬・蒼朮・当帰・茯苓・山梔子・牡丹皮・甘草・生姜・薄荷 の10味で、朮は蒼朮（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "柴胡・芍薬・蒼朮・当帰・茯苓・山梔子・牡丹皮・甘草・生姜・薄荷", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "桂枝茯苓丸", "名前": "桂枝茯苓丸", "読み": "けいしぶくりょうがん", "ツムラ番号": "25", "出典": "金匱要略（婦人妊娠病脈証并治第二十）", "本文": {"条文": "### 『金匱要略』婦人妊娠病脈証并治第二十\n\n**書き下し**（読み：社員案）\n婦人宿より癥病有り、経断ちて未だ三月に及ばずして、漏下を得て止まず、胎動きて臍上に在る者は、癥痼の害と為す。妊娠六月にして動く者、前の三月経水利せし時ならば、胎なり。血を下す者、断ちて後の三月は衃なり。血止まざる所以の者は、其の癥去らざるが故なり。当に其の癥を下すべし。桂枝茯苓丸之を主る。\n\n**原文**（翻刻確認）\n婦人宿有癥病、經斷未及三月、而得漏下不止、胎動在臍上者、為癥痼害。妊娠六月動者、前三月經水利時、胎也。下血者、後斷三月衃也。所以血不止者、其癥不去故也、當下其癥、桂枝茯苓丸主之。\n\n**現代語訳**（訳：社員案）\n婦人にもとから癥病（腹中のしこり）があり、月経が止まってまだ3か月にならないのに不正出血が続いて止まらず、胎動が臍より上にあるものは、癥痼（古くからのしこり）の害である。妊娠6か月で胎動するものは、月経が止まる前の3か月の月経が順調であったなら、胎児である。出血するものは、月経が止まった後の3か月のものは衃（凝血）である。出血が止まらないのは、その癥が去らないためである。その癥を下すべきで、桂枝茯苓丸がこれを主治する。\n\n### 注記\n- 「後斷三月衃也」の「衃」は、維基文庫の『金匱要略』・四部叢刊本の2つの翻刻とも「衃」。資料は「不血也」とする（要原本照合）\n- 「胎也」は、四部叢刊本（明嘉靖俞橋刊本の影印）の翻刻では「胎」で「也」の字がない（要原本照合）\n- 四部叢刊本の翻刻は「宿」を異体字（画面のフォントにない字）、「妊娠」を「姙娠」、「為」を「爲」と書く。字体だけの違い（要原本照合）", "出典": "### 原典の構成\n- 『金匱要略』：桂枝、茯苓、牡丹（心を去る）、桃仁（皮・尖を去り、熬る）、芍薬 各等分（翻刻確認）\n\n### 原典の服用法\n- 『金匱要略』：5味を末とし、煉蜜で兎の糞の大きさの丸とする。毎日食前に1丸を服す。効かなければ3丸まで増やす（翻刻確認）\n- 四部叢刊本の翻刻は「煉和丸」で「蜜」の字がない。また「兎屎」と書く（要原本照合）\n\n### 処方の変遷\n- 『婦人大全良方』巻之十二・妊娠誤服毒薬傷動胎気方第十に、同じ方が奪命円の名で載る（要原本照合）\n- 『万病回春』巻之六・産育に、同じ方が催生湯の名で載る。『婦人大全良方』『万病回春』とも、芍薬は赤芍薬、桂枝は桂心または官桂とする（要原本照合）\n- 『松原一閑斎先生古医方則』湯液部の桂枝茯苓湯は、桂枝・茯苓・桃仁・芍薬・大黄で、桂枝茯苓丸料去牡丹皮加大黄にあたる（要原本照合）\n- 『産科発蒙』巻二・妊娠数堕胎第十四の大黄茯苓丸は、大黄・茯苓・桂枝・芍薬・桃仁・牡丹皮で、桂枝茯苓丸加大黄にあたる（要原本照合）\n- 『叢桂亭医事小言』巻之七・叢桂亭蔵方の冒頭の甲字湯は、桂枝茯苓丸に生姜・甘草を加えた方（要原本照合）\n- 現行エキス剤（ツムラ25）は 桂皮・芍薬・桃仁・茯苓・牡丹皮 の5味で各3.0g。原典の5味と同じ生薬を等量で配合する（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "桂皮・芍薬・桃仁・茯苓・牡丹皮", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "桂枝加竜骨牡蛎湯", "名前": "桂枝加竜骨牡蛎湯", "読み": "けいしかりゅうこつぼれいとう", "ツムラ番号": "26", "出典": "金匱要略（血痺虚労病脈証并治第六）", "本文": {"条文": "### 『金匱要略』血痺虚労病脈証并治第六\n\n**書き下し**（読み：社員案）\n夫れ失精家は、少腹弦急し、陰頭寒え、目眩し（一に目眶痛むに作る）、髪落つ。脈極めて虚芤遅なるは、清穀・亡血・失精と為す。脈諸の芤動微緊を得るは、男子は失精し、女子は夢交す。桂枝加竜骨牡蛎湯之を主る。\n\n**原文**（翻刻確認）\n夫失精家少腹弦急，陰頭寒，目眩（一作目眶痛），髮落，脈極虛芤遲，為清穀亡血，失精。脈得諸芤動微緊，男子失精，女子夢交，桂枝加龍骨牡蠣湯主之。\n\n**現代語訳**（訳：社員案）\nそもそも失精（精液が漏れ出る）が常となっている者は、下腹部がひきつって張り、陰茎の先が冷え、目がくらみ（一本では「眼窩が痛む」とする）、髪が抜ける。脈が極めて虚で芤・遅であるものは、清穀（不消化の下痢）・亡血・失精である。脈にもろもろの芤・動・微・緊が現れるものは、男子は失精し、女子は夢で交わる。桂枝加竜骨牡蛎湯がこれを主治する。\n\n### 注記\n- 四部叢刊本（明嘉靖俞橋刊本の影印）の翻刻では、「少腹」が「小腹」、方名が「桂枝龍骨牡蠣湯主之」（「加」の字がない）と書かれる（要原本照合）\n- 「脈極虛芤遲，為清穀亡血，失精。脈得諸芤動微緊」の句の切り方・読み方には諸説がある。書き下しは翻刻（通行本）の句読に従った\n- 「牡蠣」は書き下しでは新字体の「牡蛎」とした", "出典": "### 原典の構成\n- 『金匱要略』血痺虚労病第六：桂枝・芍薬・生姜 各3両、甘草2両、大棗12枚、竜骨・牡蛎 各3両（翻刻確認）\n- 四部叢刊本の翻刻では、竜骨・牡蛎に分量の記載がない（要原本照合）\n\n### 原典の服用法\n- 7味を水7升で煮て3升を取り、3回に分けて温服する（翻刻確認）\n\n### 処方の変遷\n- 桂枝・芍薬・生姜・甘草・大棗の分量は『傷寒論』（宋本）の桂枝湯方（桂枝3両・芍薬3両・甘草2両・生姜3両・大棗12枚）と同じで、これに竜骨・牡蛎各3両を加えた形（翻刻確認）\n- 方名の下の小字注に、『小品』では虚弱で浮熱があり汗が出る者には桂を除いて白薇・附子各3分を加え、これを二加竜骨湯というとある（翻刻確認。四部叢刊本の翻刻は「白薇」を「白㣲」と書く。要原本照合）\n- 『外台秘要方』第十六巻・虚労夢泄精方は、深師の桂心湯（桂心・牡蛎・芍薬・竜骨・甘草・大棗・生姜の7味）を載せ、四条後に小品の竜骨湯（同じく7味）と、桂を除いて白薇・附子を加える二加竜骨湯の記載がある。桂心湯と竜骨湯は薬味の量までは一致しない（要原本照合）\n- 『万病回春』巻之四・汗証の白竜湯は、本方から生姜を除いた処方で、男子の失精・女子の夢交・自汗・盗汗を治すとされる（要原本照合）\n- 現行エキス剤（ツムラ26）は 桂皮4.0・芍薬4.0・大棗4.0・牡蛎3.0・竜骨3.0・甘草2.0・生姜1.5g（1日量7.5g中、乾燥エキス3.25g。PMDA 添付文書 2023年12月改訂 第1版で確認）。原典の桂枝が桂皮となる。添付文書に出典の欄はない", "構成": "桂皮・芍薬・大棗・牡蛎・竜骨・甘草・生姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "越婢加朮湯", "名前": "越婢加朮湯", "読み": "えっぴかじゅつとう", "ツムラ番号": "28", "出典": "金匱要略（水気病脈証并治第十四）／金匱要略（中風歴節病脈証并治第五・千金方の引用）", "本文": {"条文": "### 『金匱要略』水気病脈証并治第十四（裏水の条）\n\n**書き下し**（読み：社員案）\n裏水なる者は、一身面目黄腫し、其の脈沈、小便不利す、故に水を病ましむ。仮如し小便自利すれば、此れ津液を亡う、故に渇せしむるなり。越婢加朮湯之を主る。（方は下に見ゆ）\n\n**原文**（翻刻確認）\n裏水者，一身面目黃腫，其脈沉，小便不利，故令病水。假如小便自利，此亡津液，故令渴也。越婢加朮湯主之。（方見下）\n\n**現代語訳**（訳：社員案）\n裏水とは、全身と顔・目が黄色く腫れ、脈は沈で、小便の出が悪いもので、そのために水の病となる。もし小便が自然によく出るなら、それは津液を失っているので、口が渇くようになる。越婢加朮湯がこれを主治する。\n\n### 『金匱要略』水気病脈証并治第十四（裏水の条・2か所目）\n\n**書き下し**（読み：社員案）\n裏水は、越婢加朮湯之を主る。甘草麻黄湯も亦之を主る。\n\n**原文**（翻刻確認）\n裏水，越婢加朮湯主之；甘草麻黃湯亦主之。\n\n**現代語訳**（訳：社員案）\n裏水には越婢加朮湯が主治する。甘草麻黄湯もまたこれを主治する。\n\n### 『金匱要略』中風歴節病脈証并治第五・附方（『千金方』越婢加朮湯）\n\n**書き下し**（読み：社員案）\n肉極にて、熱すれば則ち身体の津脱し、腠理開きて汗大いに泄れ、厲風の気あり、下焦の脚弱きを治す。\n\n**原文**（翻刻確認）\n治肉極，熱則身體津脫，腠理開，汗大泄，厲風氣，下焦腳弱。\n\n**現代語訳**（訳：社員案）\n肉極で、熱があると体の津液が抜け出し、腠理（皮膚のきめ）が開いて汗が大量に漏れ、厲風の気があり、下半身の脚が弱いものを治す。\n\n### 関連条文（越婢湯の条）\n\n**書き下し**（読み：社員案）\n風水、悪風し、一身悉く腫れ、脈浮にして渇せず、続いて自ずから汗出で、大熱無きは、越婢湯之を主る。\n\n**原文**（翻刻確認）\n風水惡風，一身悉腫，脈浮不渴，續自汗出，無大熱，越婢湯主之。（「惡風」は要原本照合）\n\n**現代語訳**（訳：社員案）\n風水で、風を嫌い、全身がことごとく腫れ、脈は浮で口は渇かず、汗が絶えず自然に出て、ひどい熱のないものは、越婢湯が主治する。\n\n### 注記\n- 「朮」は、四部叢刊本（明嘉靖俞橋刊本の影印）の翻刻では「术」と書かれる（要原本照合）\n- 千金方越婢加朮湯の「肉極」は、四部叢刊本の翻刻では「内極」と書かれる（要原本照合）\n- 越婢湯の条の「惡風」は、四部叢刊本の翻刻では「急風」と書かれる（要原本照合）\n- 千金方越婢加朮湯の生姜は、越婢湯本体と一致する3両（四部叢刊本の翻刻）を本文に採った。別の翻刻本では2両（要原本照合）\n- 千金方越婢加朮湯の煎じ方の「先煮麻黃去沫」は、四部叢刊本の翻刻では「去上沫」と書かれる（要原本照合）\n- 「一身面目黃腫」の「黃」は『脈経』では「洪」とされる（要原本照合。資料50頁の引用による）\n- 越婢湯の条は越婢加朮湯の元の方の条として載せた。越婢加朮湯の方はこの条の後ろの越婢湯の方に朮を加えたものとして示される（「出典」を参照）", "出典": "### 原典の構成\n- 『金匱要略』水気病第十四（越婢加朮湯）：越婢湯（麻黄6両、石膏半斤、生姜3両、大棗15枚、甘草2両）に白朮4両を加える（翻刻確認）\n- 『金匱要略』中風歴節病第五・附方（『千金方』越婢加朮湯）：麻黄6両、石膏半斤、生姜3両、甘草2両、白朮4両、大棗15枚（翻刻確認。生姜の異同は条文の注記を参照）\n\n### 原典の服用法\n- 『金匱要略』水気病第十四（越婢湯の方）：5味を水6升で、まず麻黄を煮て上の泡を去り、残りの薬を入れて3升に煮詰め、3回に分けて温服する。悪風する者は附子1枚（炮）を加える。風水には朮4両を加える（古今録験）（翻刻確認）\n- 越婢加朮湯は越婢湯の方の中に白朮4両を加えるとだけあり、別の煎じ方の記載はない（翻刻確認）\n- 『金匱要略』中風歴節病第五・附方（『千金方』越婢加朮湯）：6味を水6升で、まず麻黄を煮て上の泡を去り、残りの薬を入れて3升に煮詰め、3回に分けて温服する。悪風には附子1枚（炮）を加える（翻刻確認）\n\n### 処方の変遷\n- 水気病第十四の越婢加朮湯の条には「方は下に見ゆ」とあり、方は越婢湯の後ろに「越婢湯の中に白朮4両を加える。また脚気の中にも見える」という注で示される（翻刻確認）\n- 越婢湯の方後に、風水には朮4両を加えるという『古今録験』の注がある（翻刻確認）\n- 中風歴節病第五の附方に、『千金方』の越婢加朮湯として同じ6味が肉極の方として載る（翻刻確認）\n- 原典の朮は、越婢加朮湯の方後注と『千金方』の附方では「白朮」、越婢湯の方後の『古今録験』の注では「朮」とだけ書かれる（翻刻確認）\n- 現行エキス剤（ツムラ28）は 石膏・麻黄・蒼朮・大棗・甘草・生姜 の6味で、朮は蒼朮（PMDA 添付文書 2023年12月改訂で確認）", "構成": "石膏・麻黄・蒼朮・大棗・甘草・生姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "呉茱萸湯", "名前": "呉茱萸湯", "読み": "ごしゅゆとう", "ツムラ番号": "31", "出典": "傷寒論（弁陽明病脈証并治第八・弁少陰病脈証并治第十一・弁厥陰病脈証并治第十二）、金匱要略（嘔吐噦下利病脈証治第十七）", "本文": {"条文": "### 『傷寒論』弁陽明病脈証并治第八\n\n**書き下し**（読み：社員案）\n穀を食して嘔せんと欲するは、陽明に属するなり。呉茱萸湯之を主る。湯を得て反って劇しき者は、上焦に属するなり。\n\n**原文**（翻刻確認）\n食穀欲嘔、屬陽明也、吳茱萸湯主之。得湯反劇者、屬上焦也。\n\n**現代語訳**（訳：社員案）\n穀物を食べると吐きそうになるのは、陽明に属する。呉茱萸湯がこれを主治する。湯（呉茱萸湯）を飲んでかえって激しくなる者は、上焦に属する。\n\n### 『傷寒論』弁少陰病脈証并治第十一\n\n**書き下し**（読み：社員案）\n少陰病、吐利し、手足逆冷し、煩躁して死せんと欲する者は、呉茱萸湯之を主る。\n\n**原文**（翻刻確認）\n少陰病、吐利、手足逆冷、煩躁欲死者、吳茱萸湯主之。\n\n**現代語訳**（訳：社員案）\n少陰病で、吐いて下痢し、手足が冷え切り、もだえ苦しんで死にそうなほどの者は、呉茱萸湯がこれを主治する。\n\n### 『傷寒論』弁厥陰病脈証并治第十二\n\n**書き下し**（読み：社員案）\n乾嘔し、涎沫を吐し、頭痛する者は、呉茱萸湯之を主る。\n\n**原文**（翻刻確認）\n乾嘔、吐涎沫、頭痛者、吳茱萸湯主之。\n\n**現代語訳**（訳：社員案）\n物を吐かずにえずき、よだれや泡状のつばを吐き、頭痛する者は、呉茱萸湯がこれを主治する。\n\n### 『金匱要略』嘔吐噦下利病脈証治第十七\n\n**書き下し**（読み：社員案）\n嘔して胸満する者は、茱萸湯之を主る。\n乾嘔し、涎沫を吐し、頭痛する者は、茱萸湯之を主る。\n\n**原文**（翻刻確認）\n嘔而胸滿者、茱萸湯主之。\n乾嘔、吐涎沫、頭痛者、茱萸湯主之。（方見上）\n\n**現代語訳**（訳：社員案）\n嘔吐して胸が張って苦しい者は、茱萸湯がこれを主治する。\n物を吐かずにえずき、よだれや泡状のつばを吐き、頭痛する者は、茱萸湯がこれを主治する（処方は前の条に見える）。\n\n### 注記\n- 『金匱要略』では方名を「茱萸湯」とする（翻刻確認）。乾嘔・吐涎沫・頭痛の条は、『傷寒論』弁厥陰病篇の条と方名だけが違う\n- 陽明病篇の条は、『注解傷寒論』の四庫全書本（書名『傷寒論注釋』）巻五・『金匱玉函経』では「食穀欲嘔者」と「者」がある（要原本照合）。『金匱玉函経』は「属陽明」の後の「也」と、「属上焦」の後の「也」がない（要原本照合）。本文は宋本の字を採った\n- 少陰病篇の条は、『金匱玉函経』では「而手足逆冷」と「而」がある（要原本照合）\n- 厥陰病篇の条は、『金匱玉函経』では「乾嘔吐涎沫、而復頭痛」と書かれる（要原本照合）\n- 『金匱要略』の乾嘔の条は、『金匱要略論註』の四庫全書本では「涎沬」と書かれる（要原本照合）\n- 維基文庫の『金匱要略』の翻刻には茱萸湯の方（構成・服用法）が載っていない。原典の構成・服用法は『金匱要略論註』の四庫全書本の本文による", "出典": "### 原典の構成\n- 『傷寒論』：呉茱萸1升（洗）、人参3両、生姜6両（切）、大棗12枚（擘）（翻刻確認）\n- 『金匱要略』：呉茱萸1升、人参3両、生姜6両、大棗12枚（翻刻確認。『金匱要略論註』の四庫全書本の本文による）\n\n### 原典の服用法\n- 『傷寒論』：4味を水7升で煮て2升を取り、滓を去り、7合を温服する。日に3回服す（翻刻確認）\n- 『金匱要略』：4味を水5升で煮て3升を取り、7合を温服する。日に3回服す（翻刻確認。『金匱要略論註』の四庫全書本の本文による）\n\n### 処方の変遷\n- 『金匱要略』では方名を茱萸湯とする（翻刻確認）\n- 『肘後百一方』巻之四・治卒胃反嘔啘方第三十に、食後に酸っぱいものがこみ上げて胸が苦しいものを治す方として呉茱萸湯が挙がるとされる（要原本照合）\n- 『太平聖恵方』巻第十二・治傷寒厥逆諸方では、傷寒で手足が厥逆し、涎沫を嘔吐して頭痛するものに呉茱萸・人参を散とし、生姜・棗を入れて煎服する方が載り、方名は付かないとされる。同じ門の7つ前の呉茱萸湯方は、傷寒の吐利・手足逆冷・心煩悶絶に呉茱萸・棗・甘草・生姜・人参・厚朴を用いる（甘草・厚朴が加わる）とされる（要原本照合）\n- 『傷寒活人書』巻第十五では、人参・呉茱萸を姜棗で煎服するとされる（要原本照合）\n- 『太医院経験奇効良方大全』（董宿輯録・方賢続補）巻之二十・霍乱門には、同名の呉茱萸湯が2方載るとされる。1つは呉茱萸・木瓜・食塩を炒り焦がして煎服する霍乱吐瀉の方、もう1つは呉茱萸・当帰・桂心・芍薬・細辛・木通・甘草を生姜・紅棗で煎服する方（要原本照合）\n- 『医学正伝』巻之四・頭痛門では、厥陰の頭項強痛・痰沫を吐す・厥冷して脈浮緩のものに、呉茱萸・生姜・人参を棗で煎ずるとされる（要原本照合）\n- 『扶寿精方』傷寒では、少陰の頭疼・吐利の後、手足厥冷・煩躁して死せんと欲し、嘔して胸満するものに呉茱萸・生姜・人参を棗で煎ずるとされる（要原本照合）\n- 『医方考』（呉崑）巻之五・七疝門には、本方に附子を加えた呉茱萸加附子湯が載るとされる（要原本照合）\n- 現行エキス剤（ツムラ31）は 大棗・呉茱萸・人参・生姜 の4味で、原典と同じ構成（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "大棗・呉茱萸・人参・生姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "四逆散", "名前": "四逆散", "読み": "しぎゃくさん", "ツムラ番号": "35", "出典": "傷寒論（弁少陰病脈証并治第十一）", "本文": {"条文": "### 『傷寒論』弁少陰病脈証并治第十一\n\n**書き下し**（読み：社員案）\n少陰病、四逆し、其の人或いは咳し、或いは悸し、或いは小便利せず、或いは腹中痛み、或いは泄利下重する者は、四逆散之を主る。\n\n**原文**（翻刻確認）\n少陰病、四逆、其人或咳、或悸、或小便不利、或腹中痛、或泄利下重者、四逆散主之。\n\n**現代語訳**（訳：社員案）\n少陰病で手足が冷え（四逆）、その人はあるいは咳をし、あるいは動悸がし、あるいは小便の出が悪く、あるいは腹の中が痛み、あるいは下痢して後ろが重く渋る（泄利下重）者は、四逆散がこれを主治する。\n\n### 注記\n- 条文は宋本の翻刻と『金匱玉函経』の翻刻で字が同じ（翻刻確認）\n- 資料は「咳」を「欬」と書く。欬／咳は字体の違いで、本文は翻刻の「咳」を採った\n- 枳実の修治は、宋本の翻刻では「破，水漬，炙幹」と書かれる。「幹」は「乾」の字の誤りと見て、原典の構成では「炙って乾かす」とした（要原本照合）\n- 方後の加減は、『金匱玉函経』では咳の加減の「並主下利」が「並主久痢」、「腹中痛者，加附子一枚，炮令坼」が「腹痛者加附子一枚炮」と書かれ、作り方は「搗篩」がなく「上四味為散」とある（要原本照合）。本文は宋本の字を採った", "出典": "### 原典の構成\n- 『傷寒論』：甘草（炙）、枳実（破り、水に漬け、炙って乾かす）、柴胡、芍薬 各10分（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』：4味を各10分とり、搗いて篩い、白飲で方寸匕を和して服す。日に3回服す（翻刻確認）\n- 方後の加減：咳する者は五味子・乾姜 各5分を加え、あわせて下利を主る。悸する者は桂枝5分を加える。小便利せざる者は茯苓5分を加える。腹中痛む者は附子1枚を加え、炮じて坼かせる。泄利下重する者は、先に水5升で薤白3升を煮て3升を取り、滓を去り、散3方寸匕を湯の中に入れて煮て1升半を取り、分けて温めて2回に服す（翻刻確認）\n\n### 処方の変遷\n- 芍薬甘草湯（芍薬・甘草）に枳実・柴胡を加えた構成\n- 『千金翼方』巻第十・傷寒下・少陰病状第二にも、原典と同じ条が載る（要原本照合）\n- 原典は4味等量（各10分）。現行エキス剤（ツムラ35）は 柴胡5.0・芍薬4.0・枳実2.0・甘草1.5g（7.5g中。PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "柴胡・芍薬・枳実・甘草", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "桂枝湯", "名前": "桂枝湯", "読み": "けいしとう", "ツムラ番号": "45", "出典": "傷寒論（巻第二・弁太陽病脈証并治上第五）／金匱要略（婦人産後病脈証并治第二十一・婦人妊娠病脈証并治第二十）", "本文": {"条文": "### 『傷寒論』巻第二・弁太陽病脈証并治上第五\n\n**書き下し**（読み：社員案）（1条目：太陽中風）\n太陽の中風、陽浮にして陰弱、陽浮なる者は熱自ずから発し、陰弱なる者は汗自ずから出づ。嗇嗇として悪寒し、淅淅として悪風し、翕翕として発熱し、鼻鳴り乾嘔する者は、桂枝湯之を主る。\n\n**原文**（翻刻確認）\n太陽中風，陽浮而陰弱，陽浮者，熱自發，陰弱者，汗自出。嗇嗇惡寒，淅淅惡風，翕翕發熱，鼻鳴乾嘔者，桂枝湯主之。\n\n**現代語訳**（訳：社員案）\n太陽病の中風で、陽が浮き陰が弱い。陽が浮くものは熱がひとりでに出て、陰が弱いものは汗がひとりでに出る。嗇嗇と寒けがし、淅淅と風を嫌い、翕翕と熱が出て、鼻が鳴り、からえずきするものは、桂枝湯が主治する。\n\n**書き下し**（読み：社員案）（2条目：頭痛・発熱・汗出・悪風。1条目の方の後に続く）\n太陽病、頭痛、発熱、汗出で、悪風するは、桂枝湯之を主る。\n\n**原文**（翻刻確認）\n太陽病，頭痛，發熱，汗出，惡風，桂枝湯主之。\n\n**現代語訳**（訳：社員案）\n太陽病で、頭痛と発熱があり、汗が出て、風を嫌うものは、桂枝湯が主治する。\n\n### 『金匱要略』婦人産後病脈証并治第二十一（陽旦湯）\n\n**書き下し**（読み：社員案）\n産後の風、之に続くこと数十日解せず、頭微しく痛み、悪寒し、時時熱有り、心下悶え、乾嘔し、汗出づ。久しと雖も、陽旦の証続きて在るのみ。陽旦湯を与うべし。（即ち桂枝湯なり。方は下利の中に見ゆ）\n\n**原文**（翻刻確認）\n產後風，續之數十日不解，頭微痛，惡寒，時時有熱，心下悶，乾嘔，汗出，雖久，陽旦證續在耳，可與陽旦湯。（即桂枝湯，方見下利中。）\n\n**現代語訳**（訳：社員案）\n産後の風邪が数十日続いて治らず、頭が少し痛み、寒けがし、ときどき熱があり、みぞおちがもだえ苦しく、からえずきし、汗が出る。長引いていても、陽旦の証が続いているだけである。陽旦湯を与えてよい。（陽旦湯とは桂枝湯のことで、方は下利の篇に載る）\n\n### 『金匱要略』婦人妊娠病脈証并治第二十\n\n**書き下し**（読み：社員案）\n師曰く、婦人平脈を得、陰脈小弱、其の人渇して食すること能わず、寒熱無きは、妊娠と名づく。桂枝湯之を主る。（方は下利の中に見ゆ）\n\n**原文**（翻刻確認）\n師曰：婦人得平脈，陰脈小弱，其人渴，不能食，無寒熱，名妊娠，桂枝湯主之。（方見下利中）\n\n**現代語訳**（訳：社員案）\n師が言う。婦人の脈が平常で、陰の脈がやや弱く、その人がのどが渇いて食べられず、悪寒も発熱もないものは、妊娠という。桂枝湯が主治する。（方は下利の篇に載る）\n\n### 関連条文（禁忌）\n\n『傷寒論』巻第二・弁太陽病脈証并治上第五。桂枝湯を与えてはいけない例として、資料が『傷寒尚論篇』の引用で挙げる3条。\n\n**書き下し**（読み：社員案）（解肌の薬であること）\n桂枝は本解肌を為す。若し其の人脈浮緊、発熱して汗出でざる者は、之を与うべからざるなり。常に須らく此を識り、誤らしむること勿かるべし。\n\n**原文**（翻刻確認）\n桂枝本為解肌，若其人脈浮緊，發熱汗不出者，不可與之也，常須識此，勿令誤也。\n\n**現代語訳**（訳：社員案）\n桂枝湯はもともと肌を解く薬である。もしその人の脈が浮緊で、発熱して汗が出ないものには、与えてはならない。常にこのことを心得て、誤らせてはならない。\n\n**書き下し**（読み：社員案）（酒客）\n若し酒客病めば、桂枝湯を与うべからず。之を得れば則ち嘔す。酒客は甘きを喜ばざるを以っての故なり。\n\n**原文**（翻刻確認）\n若酒客病，不可與桂枝湯，得之則嘔，以酒客不喜甘故也。\n\n**現代語訳**（訳：社員案）\n酒飲みが病んだときは、桂枝湯を与えてはならない。飲めば吐く。酒飲みは甘いものを好まないからである。\n\n**書き下し**（読み：社員案）（服して吐く者）\n凡そ桂枝湯を服して吐する者は、其の後必ず膿血を吐するなり。\n\n**原文**（翻刻確認）\n凡服桂枝湯吐者，其後必吐膿血也。\n\n**現代語訳**（訳：社員案）\nおよそ桂枝湯を飲んで吐くものは、その後に必ず膿血を吐く。\n\n### 注記\n- 資料のルビ：淅淅は「セキセキ」、翕翕は「キュウキュウ」、漐漐は「チュウチュウ」。嗇嗇のルビは小さくて読めない（要確認）\n- 禁忌の1条目は、宋本の翻刻では「太陽病三日，已發汗，若吐、若下、若溫針，仍不解者，此為壞病，桂枝不中與之也。觀其脈證，知犯何逆，隨證治之。」に続く同じ条の後半（翻刻確認）\n- 宋本の翻刻の並びは、解肌の条 → 酒客の条 → 喘家の条 → 服して吐く者の条。資料が引く『傷寒尚論篇』は、解肌 → 服して吐く者 → 酒客の順で、字句にも多少の違いがあるとされる（要原本照合）\n- 1条目は、『備急千金要方』巻第九では「濇濇として悪風し、淅淅として悪寒し」と悪風・悪寒が逆になっているとされる（要原本照合）。また「陽浮」の上に「其脈」の2字があるとされる（要原本照合）\n- 婦人妊娠の条は、翻刻では「於法六十日當有此證；設有醫治逆者，卻一月加吐下者，則絕之。」と続く（翻刻確認）。資料は「桂枝湯之を主る」までを引く\n- 『金匱要略』の四部叢刊本の翻刻は、婦人産後の条の「雖久」を「雖又」、「名妊娠」を「名姙娠」と書き、婦人妊娠の条の小字注を「方見利中」と書く（要原本照合）。本文は通行本の翻刻の字を採った\n- 『金匱要略』の桂枝湯方は、嘔吐噦下利病脈証并治第十七の「下利腹脹滿，身體疼痛者，先溫其裏，乃攻其表。溫裏宜四逆湯，攻表宜桂枝湯。」の条に付く（翻刻確認）。維基文庫の通行本の翻刻には方の本文がなく、四部叢刊本の翻刻（巻中）で確かめた\n- 四部叢刊本『金匱要略』の翻刻では甘草が「三两炙」（要原本照合）。原典の構成は、『傷寒論』と添付文書の比率に合う2両を採った\n- 四部叢刊本『金匱要略』の服用法は、「右五味㕮咀」（宋本『傷寒論』は「㕮咀三味」）、「啜稀粥」（宋本は「啜熱稀粥」）、「如水淋漓」（宋本は「如水流漓」）と書かれ、漐漐は熱の異体字（U+24360）を重ねた字で書かれる。「一服汗出病差停後服」までで、その後の服し方と禁忌の句はない（要原本照合）", "出典": "### 原典の構成\n- 『傷寒論』（宋本）：桂枝3両（去皮）、芍薬3両、甘草2両（炙）、生姜3両（切）、大棗12枚（擘）（翻刻確認）\n- 『金匱要略』（嘔吐噦下利病篇）：桂枝3両（去皮）、芍薬3両、甘草2両（炙）、生姜3両、大棗12枚（要原本照合。四部叢刊本の翻刻では甘草3両。注記）\n\n### 原典の服用法\n- 『傷寒論』（宋本）：5味のうち3味を刻み、水7升で微火で煮て3升を取り、滓を去り、冷めすぎず熱すぎない温度で1升を服す。服し終えてしばらくして熱い薄粥を1升余りすすり、薬力を助ける。衣をかけて温め、2時間ほど全身がしっとりと微かに汗ばむようにするのがよく、水が流れ滴るほど汗をかかせてはならない（それでは病は除かれない）。1服で汗が出て病が治れば、残りは服さない。汗が出なければ同じ方法でまた服し、それでも出なければ間隔を少し詰めて、半日ほどで3服を飲み尽くす。病が重ければ昼夜通して服し、一昼夜様子を見て、1剤を飲み尽くしても病証が残れば、また作って服す。汗が出なければ2〜3剤まで服す。生もの・冷たいもの、粘りけやぬめりのあるもの、肉・麺、五辛、酒・乳製品、においの悪いものなどを禁ず（翻刻確認）\n- 『金匱要略』：5味を刻み、水7升で微火で煮て3升を取り、滓を去り、ほどよい温度で1升を服す。服し終えたら薄粥1升をすすって薬力を助ける。衣をかけて温め、2時間ほど全身がしっとりと微かに汗ばむようにするのがよく、水が滴るほど汗をかかせてはならない。1服で汗が出て病が治れば、残りは服さない（要原本照合。四部叢刊本の翻刻による。宋本『傷寒論』との違いは注記）\n\n### 処方の変遷\n- 『傷寒論』の最初に出てくる方剤で、太陽病中風の基本処方とされる。『傷寒論』では二十数か所に載る（資料の記載）\n- 『金匱要略』では陽旦湯ともいう。婦人産後病篇の陽旦湯の条の小字注に「即桂枝湯，方見下利中」とある（翻刻確認）\n- 『備急千金要方』巻第九 傷寒上・発汗湯第五には、桂枝湯（条文の悪風・悪寒が原典と逆）のほか、芍薬・甘草・乾姜・黄芩・桂心・大棗の陰旦湯と、桂枝湯と同じ主治の陽旦湯（自汗・渇・下利・心下悸・虚労裏急などの加減法つき）が載るとされる（要原本照合）\n- 『外台秘要方』第二巻 傷寒下・傷寒中風方では、『古今録験方』の陽旦湯として『千金方』の陽旦湯と同じ条文・加減法が載り、構成は大棗・桂枝・芍薬・生姜・甘草・黄芩（桂枝湯加黄芩）とされる。このため後世、陽旦湯は桂枝湯加黄芩とみなされることが多い（要原本照合）\n- 『太平聖恵方』巻第九・治傷寒一日候諸方の桂枝湯方は、桂枝・附子・乾姜・甘草・麻黄に葱白を入れて煎じる同名異方。同じ箇所に、桂心・赤芍薬・甘草に生姜・棗を入れて煎じる、名前のない事実上の桂枝湯も載るとされる（要原本照合）\n- 『太平恵民和剤局方』巻之二・傷寒附中暑の桂枝湯では、春の末から夏至の前までは黄芩半両を、夏至の後は知母半両・石膏2両、あるいは升麻半両を加えるとされる（要原本照合）\n- 現行エキス剤（ツムラ45）は 桂皮・芍薬・大棗・甘草・生姜 の5味（PMDA 添付文書 2023年12月改訂 第1版で確認）。原典の「桂枝」は、資料の組成欄では「桂皮」と書かれる", "構成": "桂皮・芍薬・大棗・甘草・生姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "七物降下湯", "名前": "七物降下湯", "読み": "しちもつこうかとう", "ツムラ番号": "46", "出典": "大塚敬節経験方", "本文": {"条文": "", "出典": "### 原典の構成\n\n### 原典の服用法\n\n### 処方の変遷\n- 四物湯に釣藤鈎・黄耆・黄柏を加えた方で、資料の出典欄は「『理傷続断方』、大塚敬節経験方」。もとの四物湯の出典は『理傷続断方』医治整理補接次第口訣（条文は四物湯の項を参照）\n- 大塚敬節『漢方診療の実際』（昭和29年改訂版）の高血圧症の項に「四物湯加黄柏・黄耆・釣藤」として載り、大塚はこの方を「七物降下湯」と命名している、とされる（要原本照合）\n- 大塚敬節「釣藤・黄耆の加味による高血圧症の治療」（『日本東洋医学会誌』第5巻3号）では、四物湯加釣藤・黄耆・黄柏などを用いたとするが、七物降下湯の命名には触れていないとされる（要原本照合）\n- 『漢方診療医典』の高血圧症の項に、15年前に大塚が創作した処方とあるとされ、資料はその15年前を昭和27年とする（要確認）\n- 本方に杜仲を加えた方を八物降下湯と称するとされる（『臨床応用漢方処方解説』。要原本照合）\n- 『一般用漢方処方の手引き』に収載される。昭和50年発行の旧版と平成21年発行の改訂版で効能・効果の記載が異なるとされる（要原本照合）\n- 現行エキス剤（ツムラ46）は7.5g中、芍薬・当帰 各4.0g、黄耆・地黄・川芎・釣藤鈎 各3.0g、黄柏 2.0g の7味（PMDA 添付文書 2023年12月改訂 第1版で確認）。添付文書に出典の欄はない", "構成": "芍薬・当帰・黄耆・地黄・川芎・釣藤鈎・黄柏", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["出典", "構成", "方意", "諸家の論"]}, {"file": "十全大補湯", "名前": "十全大補湯", "読み": "じゅうぜんたいほとう", "ツムラ番号": "48", "出典": "太平恵民和剤局方（巻之五・補虚損 附 骨蒸）", "本文": {"条文": "### 『太平恵民和剤局方』巻之五・補虚損 附 骨蒸（呉直閣増諸家名方）\n\n**書き下し**（読み：社員案）\n\n男子・婦人の諸虚不足、五労七傷、飲食進まず、久しく虚損を病み、時に潮熱を発し、気、骨脊を攻め、拘急疼痛し、夜夢に遺精し、面色萎黄、脚膝力無く、一切の病後に気旧の如からず、憂愁思慮して血気を傷動し、喘嗽中満し、脾腎の気弱く、五心煩悶するを治す。並びに皆之を治す。此の薬、性温にして熱ならず、平補にして効有り、気を養い神を育て、脾を醒まし渇を止め、正を順え邪を辟け、脾腎を温暖す。其の効、具さに述ぶべからず。\n\n**原文**（翻刻確認）\n\n治男子婦人諸虚不足、五労七傷、不進飲食、久病虚損、時発潮熱、気攻骨脊、拘急疼痛、夜夢遺精、面色萎黄、脚膝無力、一切病後気不如旧、憂愁思慮傷動血気、喘嗽中満、脾腎気弱、五心煩悶、並皆治之。此薬性温不熱、平補有効、養気育神、醒脾止渇、順正辟邪、温暖脾腎、其効不可具述。\n\n**現代語訳**（訳：社員案）\n\n男女のさまざまな虚弱・不足、五労七傷で、飲食が進まず、長く虚損を病み、時に潮熱を発し、気が背骨を攻めてひきつれるように痛み、夜に夢を見て遺精し、顔色が萎えて黄ばみ、脚や膝に力がなく、あらゆる病の後に気が元どおりに戻らず、憂い悩み思い煩って血気を損ない、喘いで咳き込み腹が張り、脾と腎の気が弱く、五心がほてって煩わしく苦しむものを治す。いずれもみなこれを治す。この薬は性質が温で熱ではなく、穏やかに補って効果があり、気を養い神を育て、脾を目覚めさせて渇きを止め、正気を順わせて邪を避け、脾腎を温める。その効能はつぶさに述べ尽くせない。\n\n### 関連条文（同巻の十全飲。続添諸局経験秘方）\n\n同じ巻之五に、同じ10味を十全飲の名で載せる条。資料は、巻之五には十全大補湯が2つ収載されているとして、この条も挙げる。\n\n**書き下し**（読み：社員案）\n\n諸虚百損、栄衛和せず、形体羸痩し、面色痿黄、脚膝酸疼し、腰背倦痛し、頭眩み耳重く、口苦く舌乾き、骨熱内煩し、心忪し汗多く、飲食進退し、寒熱往来し、喘嗽吐衄し、遺精失血し、婦人の崩漏、経候調わず、凡そ病後未だ旧に復せず、及び憂慮して血気を傷動するを治す。此の薬、平補にして効有り、最も宜しく之を服すべし。\n\n**原文**（翻刻確認）\n\n治諸虚百損、栄衛不和、形体羸痩、面色痿黄、脚膝酸疼、腰背倦痛、頭眩耳重、口苦舌乾、骨熱内煩、心忪多汗、飲食進退、寒熱往来、喘嗽吐衄、遺精失血、婦人崩漏、経候不調、凡病後未復旧、及憂慮傷動血気。此薬平補有効、最宜服之。\n\n**現代語訳**（訳：社員案）\n\nさまざまな虚と多くの損傷で、栄衛が調和せず、からだが痩せ衰え、顔色が萎えて黄ばみ、脚や膝がだるく痛み、腰や背中がだるく痛み、頭がくらんで耳が重く、口が苦く舌が乾き、骨が熱をもって内が煩わしく、胸がどきどきして汗が多く、食欲が進んだり退いたりし、寒気と熱が交互に起こり、喘いで咳き込み吐血・鼻血が出て、遺精や出血があるもの、婦人の崩漏、月経が順調でないもの、およそ病後にまだ元に戻らないもの、および憂い悩んで血気を損なったものを治す。この薬は穏やかに補って効果があり、これを服するのが最もよい。\n\n### 注記\n- 四庫全書本の翻刻は旧字体・異体字（虗・勞・發・靣・舊・飬・荣衞・衂 など）。本文は新字体にした\n- 十全飲の条の「頭眩」の「眩」、「喘嗽」の「嗽」は、四庫全書本の翻刻では外字（表示できない字）になっている。別の翻刻本（「頭眩耳」「喘嗽吐衄」）の字を置いた（要原本照合）\n- 十全大補湯の条の「面色萎黄」は翻刻の字。資料の書き下しは「面色痿黄」と書く（要原本照合）。十全飲の条は翻刻でも「痿黄」\n- 十全大補湯の条の「温暖脾腎」は翻刻の字（2つの翻刻本とも）。資料の書き下しは「脾胃を温煖す」と書く（要原本照合）\n- 十全大補湯の条の「一切病後気不如旧」以下の句は、別の翻刻本では行の途中が欠けている（「時发潮熱，氣」の次が「疼痛」など）。本文は四庫全書本に従った\n- 構成の「黄耆」は、四庫全書本の翻刻では2方とも「黄茋」と書かれる。字体の違いとして本文は「黄耆」にした\n- 十全大補湯の構成で、四庫全書本は「焙」を白朮にだけ付けるが、別の翻刻本は「茯苓（焙）白术（焙）」と茯苓にも付ける（要原本照合）。本文は四庫全書本に従った\n- 十全飲の構成の「肉桂」は、別の翻刻本では「桂」と書かれる（要原本照合）\n- 服用法の「棗子」の「棗」と、十全大補湯の「不拘時候温服」の「候」は、四庫全書本の翻刻では外字になっている。別の翻刻本（「枣子二个」「不拘時候温服」）の字を置いた（要原本照合）。十全大補湯の棗子の数え方は、四庫全書本では「二枚」、別の翻刻本では「二个」、十全飲は四庫全書本で「一箇」、別の翻刻本で「一枚」\n- 方の前の印：別の翻刻本では十全大補湯の前に「〔吴直阁增諸家名方〕」、十全飲の前に「〔續添諸局經驗秘方〕」がある（翻刻確認）。四庫全書本には印がない", "出典": "### 原典の構成\n- 『和剤局方』（十全大補湯）：人参・肉桂（粗皮を去り、火を見せない）・川芎・地黄（洗い、酒で蒸して焙る）・茯苓・白朮（焙る）・甘草（炙る）・黄耆（蘆を去る）・川当帰（洗い、蘆を去る）・白芍薬 各等分（翻刻確認）。資料は「白茯苓・白朮・人参・熟乾地黄・白芍薬・粉草・黄耆・肉桂・川当帰・川芎」と書く（要原本照合）\n- 『和剤局方』（十全飲）：熟乾地黄・白茯苓・人参・肉桂（粗皮を去り、火を見せない）・川当帰（蘆を去る）・白芍薬・川芎・白朮・黄耆（蘆を去る）・甘草（炙る）各1分（翻刻確認）\n\n### 原典の服用法\n- 『和剤局方』（十全大補湯）：10味を剉んで粗末とし、1回2大銭を、水1盞に生姜3片・棗子2枚を入れて同じく7分まで煎じ、時候に拘わらず温服する（翻刻確認）\n- 『和剤局方』（十全飲）：粗末とし、1回3銭を、水1盞半に生姜3片・棗子1箇を入れて7分まで煎じ、滓を去って温服する。時候に拘わらない（翻刻確認）\n\n### 処方の変遷\n- 資料の出典欄は「『金匱要略』、『備急千金要方』、『太平恵民和剤局方』」。本方の出典は一般に『和剤局方』巻之五・補虚損 附 骨蒸とされ、同巻には呉直閣増諸家名方の十全大補湯と、続添諸局経験秘方の十全飲の2つが収載されている（翻刻確認。別の翻刻本の印による）\n- 資料は、呉直閣増諸家名方は紹興年間（1131〜62年）に、続添諸局経験秘方は淳祐年間（1241〜52年）に増改されたとする（要確認）\n- 資料は、本方を四物湯合四君子湯加黄耆・桂皮、あるいは八珍湯合黄耆建中湯とみて、それぞれの出典を考える必要があるとする。黄耆建中湯の出典は『金匱要略』（要原本照合）\n- 資料によれば、『備急千金要方』には十全大補湯に近い方がいくつか載る。巻十 傷寒下・温瘧第六の大五補湯（十全大補湯加遠志・桔梗・竹葉・生枸杞根・半夏・麦門冬・大棗・生姜にあたる）、巻第三 婦人方中・虚損第一の内補黄耆湯（十全大補湯去川芎加半夏・遠志・麦門冬・五味子・沢瀉・乾姜・大棗にあたる）、同・悪露第五の乾地黄湯（十全大補湯去白朮加防風・細辛にあたる）、巻第十七 肺蔵・積気第五の又方（十全大補湯去白朮加地骨皮・大棗にあたる）。『千金方』の地黄はすべて乾地黄とする（要原本照合）\n- 資料は、『千金方』には十全大補湯と同じ処方は載っていないとする（要原本照合）\n- 資料によれば、『太平聖恵方』巻第八十・治産後蓐労諸方の白茯苓散は、白茯苓・当帰・白芍薬・芎藭・桂心・黄耆・人参・熟乾地黄を散とし、猪腎一対と姜棗で煎服する。この8味は十全大補湯去白朮・甘草にあたる（要原本照合）\n- 資料は、本方は『金匱要略』の黄耆建中湯に胚胎し、『千金方』に本方を含む方や極めて近い方が載り、『太平聖恵方』を経て、最終的に『和剤局方』で十全大補湯と十全飲の名で収載されたとする（要確認）\n- 資料によれば、『医門法律』巻之六の十全大補散の方後に、黄耆建中湯・四君子湯・四物湯を合わせて十味を得るとある。資料は、四君子湯の『和剤局方』への収載（続添諸局経験秘方）は十全大補湯（呉直閣増諸家名方）より百年以上後なので、これは歴史的な成り立ちではなく方意上の解釈とすべきとする（要原本照合）\n- 資料によれば、甲賀通元『医方紀原』は、十全大補湯の号は局方の呉直閣の方に出、十全飲はその古名かとし、また『張氏医通』の、古方の十全大補湯は黄耆・肉桂がなく沈香・木香が多いという説を引く（要原本照合）\n- 原典の地黄は、十全大補湯では「地黄（洗い、酒で蒸して焙る）」、十全飲では「熟乾地黄」（翻刻確認）\n- 現行エキス剤（ツムラ48）は7.5g中、黄耆・桂皮・地黄・芍薬・川芎・蒼朮・当帰・人参・茯苓 各3.0g、甘草1.5g の10味（PMDA 添付文書 2023年12月改訂 第1版で確認）。原典の白朮の代わりに蒼朮が入り、原典で煎じるときに加える生姜・大棗は入っていない。添付文書に出典の欄はない", "構成": "黄耆・桂皮・地黄・芍薬・川芎・蒼朮・当帰・人参・茯苓・甘草", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "荊芥連翹湯", "名前": "荊芥連翹湯", "読み": "けいがいれんぎょうとう", "ツムラ番号": "50", "出典": "万病回春（巻之五・耳病）／万病回春（巻之五・鼻病）／一貫堂方", "本文": {"条文": "### 『万病回春』巻之五・耳病\n\n**書き下し**（読み：社員案）\n両耳腫痛する者は、腎経に風熱有るなり。荊芥連翹湯。\n\n**原文**（翻刻確認）\n兩耳腫痛者、腎經有風熱也。荊芥連翹湯\n\n**現代語訳**（訳：社員案）\n両耳が腫れて痛むものは、腎経に風熱があるのである。荊芥連翹湯（を用いる）。\n\n### 『万病回春』巻之五・鼻病\n\n**書き下し**（読み：社員案）\n鼻淵の者は、胆、熱を脳に移すなり。荊芥連翹湯。\n\n**原文**（翻刻確認）\n鼻淵者、膽移熱於腦也。荊芥連翹湯\n\n**現代語訳**（訳：社員案）\n鼻淵は、胆が熱を脳に移したものである。荊芥連翹湯（を用いる）。\n\n### 注記\n- 『万病回春』の翻刻は簡体字の本で、原文は繁体字にそろえて書いた（两→兩、肿→腫、肾经→腎經、风热→風熱、胆→膽、热→熱、脑→腦、于→於 など）。字形の判断には使えない（要原本照合）\n- 同じ方名で、耳病と鼻病に構成の違う2方が載る。現行の荊芥連翹湯は一貫堂（森道伯）がこの2方を合わせ、黄連・黄柏を加えたものとされる（要原本照合）\n- 2方の順は、『万病回春』の掲載順（耳病が先）にした（要確認）", "出典": "### 原典の構成\n- 『万病回春』巻之五・耳病：荊芥・連翹・防風・当帰・川芎・白芍・柴胡・枳殻・黄芩・山梔・白芷・桔梗 各等分、甘草 減半（翻刻確認）\n- 『万病回春』巻之五・鼻病：荊芥・柴胡・川芎・当帰・生地黄・芍薬・白芷・防風・薄荷・山梔・黄芩・桔梗・連翹 各等分、甘草 減半（翻刻確認）\n\n### 原典の服用法\n- 『万病回春』巻之五・耳病：1剤に刻み、水で煎じて食後に服す（翻刻確認）\n- 『万病回春』巻之五・鼻病：刻んで散とし、水で煎じて食遠（食事から間をあけて）服す（翻刻確認）\n\n### 処方の変遷\n- 現行の荊芥連翹湯は一貫堂方。資料は『漢方一貫堂医学』により、『万病回春』巻之五の耳病・鼻病の同名方を基源とし、森道伯がこの2方を合方して黄連・黄柏を加え、一貫堂の青年期解毒証体質改善薬としたとする（要原本照合）\n- 耳病の方は現行方から地黄・黄連・黄柏・薄荷を去った形、鼻病の方は現行方から黄連・黄柏・枳殻を去った形（翻刻確認）\n- 資料は、一貫堂方としては四物湯に『万病回春』の黄連解毒湯（通常の黄連解毒湯加柴胡・連翹）を合方し甘草を加えた四物黄連解毒湯（温清飲加柴胡・連翹・甘草）に、ほかの薬味を配した方剤とする（要原本照合）\n- 四物湯の出典は『理傷続断方』、黄連解毒湯の出典は『肘後百一方』とされる。資料の出典欄にはこの2書も挙がる（要確認）\n- 一貫堂方では枳殻で処方されるが、医療用エキス剤では枳実で処方される\n- 現行エキス剤（ツムラ）は7.5g中、黄芩・黄柏・黄連・桔梗・枳実・荊芥・柴胡・山梔子・地黄・芍薬・川芎・当帰・薄荷・白芷・防風・連翹 各1.5g、甘草1.0g の17味（PMDA 添付文書 2023年12月改訂 第1版で確認）。添付文書に出典の欄はない", "構成": "黄芩・黄柏・黄連・桔梗・枳実・荊芥・柴胡・山梔子・地黄・芍薬・川芎・当帰・薄荷・白芷・防風・連翹・甘草", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "潤腸湯", "名前": "潤腸湯", "読み": "じゅんちょうとう", "ツムラ番号": "51", "出典": "万病回春（巻之四・大便閉）", "本文": {"条文": "### 『万病回春』巻之四・大便閉\n\n**書き下し**（読み：社員案）\n大便閉結して通ぜざるを治す。\n\n**原文**（翻刻確認）\n治大便閉結不通。\n\n**現代語訳**（訳：社員案）\n大便が閉じて固まり、通じないものを治す。\n\n### 注記\n- 『万病回春』の翻刻は簡体字の本で、原文は繁体字にそろえて書いた（闭→閉）。字形の判断には使えない（要原本照合）\n- 条の前に大便閉の門の総論があり、熱閉・虚閉・風閉、汗が多く出たあとの閉、老人の血気枯燥による閉、産婦や失血による血虚の閉を挙げたあと、「多食辛熱之物、大便不通者、實熱也（並宜後方）」で終わる（翻刻確認）\n- 構成の「厚朴」は、翻刻では「浓朴」と書かれる（要原本照合）。古典の体裁に合わないので、資料の「厚朴」を採った\n- 方後の加減の「瓜蔞」は、翻刻では「瓜萎」と書かれる（要原本照合）\n- 方後の「実熱燥閉」の句は、翻刻では「實熱燥閉，根据本方」と書かれる。「根据」は古典の体裁に合わない（要原本照合）。資料の書き下しは「本方に依る」", "出典": "### 原典の構成\n- 『万病回春』巻之四・大便閉：当帰・熟地黄・生地黄・麻仁（去殻）・桃仁（去皮）・杏仁（去皮）・枳殻・厚朴（去粗皮）・黄芩・大黄 各等分、甘草 減半（翻刻確認）\n\n### 原典の服用法\n- 『万病回春』巻之四・大便閉：1剤に刻み、水で煎じて空腹時に熱服する。大便が通じたら薬を止め、多く服してはならない（翻刻確認）\n- 潤腸丸に仕立てるときは、薬を加減してそれぞれ末とし、煉蜜で梧桐子大の丸とする。1回50丸を空腹時に白湯で呑み下す。辛熱の物を切に忌む（翻刻確認）\n- 方後の加減：実熱燥閉は本方のまま。発熱には柴胡、腹痛には木香、血虚枯燥には当帰・熟地黄・桃仁・紅花を加える。風燥の閉には郁李仁・皂角・羌活、気虚の閉には人参・郁李仁、気実の閉には檳榔・木香、痰火の閉には瓜蔞・竹瀝、汗や小便が多く出て津液が枯竭した閉には人参・麦門冬を加える。老人の気血枯燥の閉には人参・鎖陽・麦門冬・郁李仁を加え、当帰・熟地黄・生地黄を倍にし、桃仁を少なくする。産婦で出血が多く枯燥した閉には人参・紅花を加え、当帰・熟地黄を倍にし、黄芩・桃仁を去る（翻刻確認）\n- 方後の最後に「此方加檳榔、即通幽湯」（この方に檳榔を加えれば通幽湯）とある（翻刻確認）\n\n### 処方の変遷\n- 資料は、本方は龔廷賢が『万病回春』で創案した方であるとする。3年後刊の『雲林神彀』巻之三・大便閉には収載されるが、27年後刊の『寿世保元』、28年後刊の『済世全書』には収採されていないとする（要原本照合）\n- 資料は、李東垣『蘭室秘蔵』巻之四・大便結燥門に、大腸結燥して通じないものを治す潤腸湯（生地黄・生甘草・大黄・熟地黄・当帰梢・升麻・桃仁・麻仁・紅花）がすでに載り、これから升麻・紅花を去り、厚朴・黄芩・枳実を加えると今日の潤腸湯になるとする（要原本照合）\n- 資料は、本方の構成を理解するうえでは『丹渓心法』巻五・秘方一百の潤腸丸（麻子仁・当帰・桃仁・生地黄・枳殻。血燥・大便不通を潤す）を考えるのがよいとし、この方は『古今医鑑』巻之八・閉結にも老人の便秘の方として引かれるとする（要原本照合）\n- 資料は、『丹渓心法』の潤腸丸に、麻子仁丸（麻子仁・芍薬・枳実・大黄・厚朴・杏仁）を合わせて黄芩を加えると、ほぼ本方になるとし、違いは芍薬と甘草、枳実と枳殻だけであるとする（要原本照合）。麻子仁丸の出典は『傷寒論』弁陽明病脈証并治第八（資料による。要原本照合）\n- 現行エキス剤（ツムラ51）は7.5g中、地黄6.0g、当帰3.0g、黄芩・枳実・杏仁・厚朴・大黄・桃仁・麻子仁 各2.0g、甘草1.5g の10味（PMDA 添付文書 2023年12月改訂 第1版で確認）。原典の熟地黄・生地黄は地黄1品になり、枳殻は枳実になる。添付文書に出典の欄はない", "構成": "地黄・当帰・黄芩・枳実・杏仁・厚朴・大黄・桃仁・麻子仁・甘草", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "五淋散", "名前": "五淋散", "読み": "ごりんさん", "ツムラ番号": "56", "出典": "古今医鑑（巻之八・淋閉）／仁斎直指附遺方論（巻十六・諸淋・諸淋証治）", "本文": {"条文": "### 『古今医鑑』巻之八・淋閉\n\n**書き下し**（読み：社員案）\n\n五淋散　肺気不足し、膀胱に熱有り、水道通ぜず、淋瀝して出でず、或いは尿豆汁の如く、或いは砂石の如く、或いは冷淋にして膏の如く、或いは熱淋にして尿血するを治す。\n\n**原文**（翻刻確認）\n\n五淋散　治肺氣不足、膀胱有熱、水道不通、淋瀝不出、或尿如豆汁、或如砂石、或冷淋如膏、或熱淋尿血。\n\n**現代語訳**（訳：社員案）\n\n肺の気が不足し、膀胱に熱があって尿の通り道が通じず、尿がしたたるばかりで出きらないもの、あるいは尿が豆の煮汁のようなもの、砂や石のようなものが出るもの、冷えによる淋で尿が膏（あぶら）のようなもの、熱による淋で血尿が出るものを治す。\n\n### 『仁斎直指附遺方論』巻十六・諸淋・諸淋証治\n\n**書き下し**（読み：社員案）\n\n五淋散　諸淋を治す。\n\n**原文**（翻刻確認）\n\n五淋散　治諸淋。\n\n**現代語訳**（訳：社員案）\n\nいろいろな淋（尿がしたたって渋り痛む病）を治す。\n\n### 関連条文（『古今医鑑』巻之八・淋閉の総論の冒頭）\n\n**書き下し**（読み：社員案）\n\n夫れ淋は、小便淋瀝して渋痛し、去らんと欲して去らず、去らずして又来たる、淋と曰う。\n\n**原文**（翻刻確認）\n\n夫淋者、小便淋瀝澀痛、欲去不去、不去又來、曰淋。\n\n**現代語訳**（訳：社員案）\n\nそもそも淋とは、小便がしたたるように出て渋り痛み、出そうとしても出ず、出ないのにまた尿意が来るものをいう。\n\n### 注記\n- 『古今医鑑』の翻刻（維基文庫『古今醫鑒』）は簡体字が混じる本で、原文は繁体字にそろえて書いた（沥→瀝、泻→瀉、车→車、锉→剉、栀→梔 など）。字形の判断には使えない（要原本照合）\n- 『古今医鑑』の「砂石」は、『万病回春』巻之四・淋証の同じ条の翻刻では「沙石」（要原本照合）\n- 『万病回春』巻之四・淋証の同じ条は、末尾に「皆效」がある（翻刻確認）\n- 『仁斎直指附遺方論』の翻刻（四庫全書本）は「赤伏苓」と書く。本文は「赤茯苓」にした（要原本照合）\n- 2書の順は、現行エキス剤（ツムラ）の11味と一致する『古今医鑑』（6味＋一方の5味）を先にした", "出典": "### 原典の構成\n- 『古今医鑑』：赤茯苓1銭2分、赤芍薬2銭、山梔子2銭、当帰1銭、甘草5分、条黄芩6分 の6味。一方に生地黄・沢瀉・木通・滑石・車前子（各等分）を加える（翻刻確認）\n- 『仁斎直指附遺方論』：赤茯苓・赤芍薬・山梔仁・生甘草 各3分、当帰・黄芩 各2分 の6味（翻刻確認）\n\n### 原典の服用法\n- 『古今医鑑』：剉んで散とし、水で煎じ、空腹時に服す（翻刻確認）\n- 『仁斎直指附遺方論』：細末とし、1回2銭半を水1盞で8分まで煎じ、空腹時に服す。或いは五苓散と合わせ、「竹園尿門冬草蔥頭燈心」の煎湯で調えて服す（翻刻確認。この句の区切りと読みは要原本照合）\n\n### 処方の変遷\n- 資料によれば、本方はエキス製剤のメーカー間で組成の差が最も大きい処方の一つで、『仁斎直指附遺方論』の6味（少味剤）と、『古今医鑑』の一方の5味を加えた11味（多味剤）の差である（要確認）\n- 資料によれば、『和剤局方』巻之六・積熱 附 火証に五淋散が2方ある。宝慶新増方の少味剤（赤茯苓・当帰・甘草・山梔子仁・赤芍薬の5味。「腎気不足し、膀胱に熱有り…」の条）と、続添諸局経験秘方の多味剤（上の5味から当帰を去り、淡竹葉・山茵蔯・木通・滑石を加える。茯苓・炙甘草とする）。前者は宝慶年間（1225〜1227年）、後者は淳祐年間（1241〜1252年）の収載とされる（要原本照合）\n- 資料によれば、局方の少味剤より早く、『聖済総録』巻第一百五十六・妊娠門・妊娠子淋の当帰湯（当帰・芍薬・赤茯苓・甘草・梔子仁）、『鶏峰普済方』巻第十八の山梔子湯（当帰・赤い芍薬・赤い茯苓・甘草・山梔子）、『三因極一病証方論』巻之三・脚気惣治の木通散（当帰・梔子仁・赤芍薬・赤茯苓・甘草）に同じ組み合わせがある（要原本照合）\n- 資料によれば、董汲『脚気治法総要』巻下の木通散（当帰・梔子仁・芍薬・甘草・赤茯苓・木通）は局方の少味剤に木通を加えた方で、元豊〜元祐年間（1078〜1094年）の成書とされる（要原本照合）\n- 資料によれば、黄芩の加味は『備急千金要方』巻第二十一・淋閉第二の熱淋を治す方に「熱には黄芩一両を加う」とあることに拠る（要原本照合）\n- 『仁斎直指附遺方論』巻十六の五淋散は今日の少味剤と同じ6味。同じ巻の後半には、局方の多味剤の五淋散（山茵蔯・淡竹葉・木通・滑石・甘草・山梔仁・赤茯苓・赤芍薬）も載る（翻刻確認）\n- 『古今医鑑』巻之八・淋閉の条文と薬味は、『万病回春』巻之四・淋証に引き継がれている。『万病回春』は赤茯苓6両、赤芍10両、山梔10両、当帰5両、条芩3両、生甘草5両とし、「一方有生地、沢瀉、木通、滑石、車前子」とする（翻刻確認）\n- 現行エキス剤（ツムラ56）は7.5g中、茯苓6.0g、黄芩・滑石・甘草・地黄・車前子・沢瀉・当帰・木通 各3.0g、山梔子・芍薬 各2.0g の11味（PMDA 添付文書 2023年12月改訂 第1版で確認）。『古今医鑑』の6味に一方の5味を加えた構成と薬味が一致する。添付文書に出典の欄はない", "構成": "茯苓・黄芩・滑石・甘草・地黄・車前子・沢瀉・当帰・木通・山梔子・芍薬", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "桂枝加芍薬湯", "名前": "桂枝加芍薬湯", "読み": "けいしかしゃくやくとう", "ツムラ番号": "60", "出典": "傷寒論（巻第六・弁太陰病脈証并治第十）", "本文": {"条文": "### 『傷寒論』巻第六・弁太陰病脈証并治第十\n\n**書き下し**（読み：社員案）\n本太陽病、医反って之を下し、爾るに因りて腹満し時に痛む者は、太陰に属するなり。桂枝加芍薬湯之を主る。大いに実痛する者は、桂枝加大黄湯之を主る。\n\n**原文**（翻刻確認）\n本太陽病，醫反下之，因爾腹滿時痛者，屬太陰也，桂枝加芍藥湯主之；大實痛者，桂枝加大黃湯主之。\n\n**現代語訳**（訳：社員案）\nもとは太陽病であったのに、医師がかえって下したため、腹が張って時に痛むものは、太陰に属する。桂枝加芍薬湯が主治する。ひどく実して痛むものは、桂枝加大黄湯が主治する。\n\n### 注記\n- 条の後半（大いに実痛する者）は桂枝加大黄湯の条で、同じ条にまとめて書かれている（翻刻確認）\n- 『金匱玉函経』巻第四・弁太陰病形証治第七の翻刻では、同じ条が「太陽病，醫反下之，因爾腹滿時痛者，屬太陰也，桂枝加芍藥湯主之。大實痛者，桂枝加大黃湯主之。」で、冒頭の「本」がない（翻刻確認）\n- 『金匱玉函経』巻第六・弁発汗吐下後病形証治第十九の翻刻では「太陽病，醫反下之，因腹滿時痛，為屬太陰，屬桂枝加芍藥湯證，其大實痛，屬桂枝加大黃湯證。」と書かれ、「爾」がなく「為屬太陰」となる（要原本照合）\n- 宋本の巻第十・弁発汗吐下後脈証并治第二十二に再掲された方は「第二巻の桂枝湯方の内に、更に芍薬三両を加え、前に随いて共に六両、余は桂枝湯の法に依る」と書かれる（要原本照合）", "出典": "### 原典の構成\n- 『傷寒論』（宋本）：桂枝3両（去皮）、芍薬6両、甘草2両（炙）、生姜3両（切）、大棗12枚（擘）（翻刻確認）\n- 『金匱玉函経』巻第七・方薬炮製（桂枝倍加芍薬湯方第十二）：桂枝3両、芍薬6両、生姜3両、甘草2両（炙）、大棗12枚（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』（宋本）：5味を水7升で煮て3升を取り、滓を去って、温めて3回に分けて服す。もとは桂枝湯で、今芍薬を加えたもの、と添える（翻刻確認）\n- 『金匱玉函経』：5味を㕮咀し、水7升で煮て3升を取り、滓を去って1升を温服する。もとは桂枝湯で、今芍薬を加えて用いる、と添える（翻刻確認）\n\n### 処方の変遷\n- 桂枝湯と同じ構成で、芍薬を倍にしたもの（翻刻確認）\n- 『金匱玉函経』では桂枝倍加芍薬湯の名で載る（翻刻確認）\n- 『傷寒総病論』巻第一・太陰証では、条文は同じで方名が桂枝芍薬湯とされる（要原本照合）\n- 『三因極一病証方論』巻之四・傷風証治の桂枝芍薬湯は、桂心半両・白芍薬3両を姜棗で煎服する方で、甘草を含まない（要原本照合）\n- 現行エキス剤（ツムラ60）は 芍薬・桂皮・大棗・甘草・生姜 の5味で、1日量7.5g中 シャクヤク6.0・ケイヒ4.0・タイソウ4.0・カンゾウ2.0・ショウキョウ1.0（g）の混合生薬の乾燥エキスを含む（PMDA 添付文書 2023年12月改訂 第1版で確認）。原典の「桂枝」は、添付文書では「ケイヒ」と書かれる", "構成": "芍薬・桂皮・大棗・甘草・生姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "五積散", "名前": "五積散", "読み": "ごしゃくさん", "ツムラ番号": "63", "出典": "理傷続断方（医治整理補接次第口訣）／太平恵民和剤局方（巻之二・傷寒 附 中暑）", "本文": {"条文": "### 『理傷続断方』医治整理補接次第口訣\n\n**書き下し**（読み：社員案）\n\n五労七傷を治す。凡そ傷を被りて頭痛し、風に傷られて寒を発するには、姜にて二銭を煎じ、仍お葱白を入れ、食後に熱服す。\n\n**原文**（翻刻確認）\n\n治五勞七傷、凡被傷頭痛、傷風發寒、薑煎二錢、仍入葱白、食後熱服。\n\n**現代語訳**（訳：社員案）\n\n五労七傷を治す。およそ外傷を受けて頭痛し、風にあたって寒けがするものには、生姜とともに2銭を煎じ、さらに葱白を入れて、食後に熱いうちに服す。\n\n### 『太平恵民和剤局方』巻之二・傷寒 附 中暑\n\n**書き下し**（読み：社員案）\n\n中を調え気を順らし、風冷を除き、痰飲を化す。脾胃の宿冷、腹脇脹痛、胸膈の停痰、嘔逆悪心、或いは外は風寒に感じ、内は生冷に傷られ、心腹痞悶し、頭目昏痛し、肩背拘急し、肢体怠惰し、寒熱往来し、飲食進まざるを治す。及び婦人の血気調わず、心腹撮痛し、経候匀わず、或いは閉じて通ぜざるに、並びに宜しく之を服すべし。\n\n**原文**（翻刻確認）\n\n調中順氣、除風冷、化痰飲。治脾胃宿冷、腹脇脹痛、胸膈停痰、嘔逆惡心、或外感風寒、内傷生冷、心腹痞悶、頭目昏痛、肩背拘急、肢體怠惰、寒熱往來、飲食不進、及婦人血氣不調、心腹撮痛、經候不匀、或閉不通、並宜服之。\n\n**現代語訳**（訳：社員案）\n\n中焦（脾胃）を調え、気の巡りを順にし、風冷を除き、痰飲を除く。脾胃に長く冷えがあって腹や脇が張って痛む、胸膈に痰が停滞する、嘔逆・悪心がある、あるいは外から風寒に感じ、内には生もの・冷たいものに傷られて、心腹がつかえて苦しく、頭や目がくらんで痛み、肩や背がひきつり、手足や体がだるく、寒熱が往来し、飲食が進まないものを治す。また婦人の血気が調わず、心腹がひきつるように痛み、月経が不順であったり、閉じて通じないものにも、いずれもこれを服するのがよい。\n\n### 注記\n- 『理傷続断方』の翻刻（維基文庫『仙授理傷續斷秘方』）は簡体字の本で、原文は繁体字にそろえて書いた（伤→傷、发→發、姜→薑、钱→錢、后→後、热→熱 など）。字形の判断には使えない（要原本照合）\n- 『理傷続断方』の「五勞」は、翻刻では「五痨」（癆の簡体字）。資料は「五労」で、本文は資料の字にした（要原本照合）\n- 『理傷続断方』の条の「凡被傷頭痛」は、資料の引用では読みが異なり、「被」の字の有無を含めて要原本照合\n- 『和剤局方』の「經候」の「候」は、翻刻（四庫全書本）では外字（SKchar 1974）で示されている。資料の書き下しの「経候」の字を本文に置いた（要原本照合）\n- 2書の順は、資料の出典欄（『理傷続断方』）を先にした。どちらの書の構成も現行エキス剤（ツムラ）とは一致しない（要確認）", "出典": "### 原典の構成\n- 『理傷続断方』：蒼朮・桔梗 各20両、枳殻・陳皮 各6両、芍薬・白芷・川芎・当帰（川帰）・甘草・肉桂・茯苓…（翻刻確認。翻刻の行は「茯苓半？」で崩れていて、以下の薬味と芍薬以下の分量は読めない）。資料は、本書の方を標準の15味（蒼朮・桔梗・陳皮・白芷・甘草・当帰・川芎・芍薬・茯苓・半夏・麻黄・乾姜・枳殻・肉桂・厚朴）とし、大棗・白朮はないとする（要原本照合）\n- 『和剤局方』：陳橘皮（白を去る）・枳殻（瓤を去り麩炒）・麻黄（根節を去る）各6両、白芍薬・川芎・当帰（蘆を去り洗う）・甘草（炙り刻む）・茯苓（皮を去る）・半夏（湯で7回洗う）・肉桂（粗皮を去る）・白芷 各5両、厚朴（粗皮を去る）・乾姜（炮）各4両、桔梗（蘆を去る）12両、蒼朮（よく洗い皮を去る）24両 の15味（翻刻確認。「各5両」がどの薬味までにかかるかは要確認）\n\n### 原典の服用法\n- 『理傷続断方』：枳殻・桂の2味を除き、残りを細かく刻んで慢火で炒り、色が変わったら広げて冷まし、枳殻・桂を入れて均一にする。1回3銭を水1盞・生姜3片で半盞に煎じ、熱服する。条文には、姜で2銭を煎じ、さらに葱白を入れて食後に熱服するとある（翻刻確認）\n- 『和剤局方』：肉桂・枳殻を除く13味を粗末にし、慢火で色が変わるまで炒って広げて冷まし、次に肉桂・枳殻の末を入れて均一にする。1回3銭を水1盞半・生姜3片で1中盞に煎じ、滓を去ってやや熱いうちに服す。冷気が心脇に突き上げ臍腹が張って刺すように痛む、反胃嘔吐、泄痢清穀、痃癖癥瘕、膀胱・小腸の気痛には煨生姜3片・塩少許を入れて煎じる。傷寒時疫で頭痛・体痛・悪風・発熱・項背強痛には葱白3寸・豉7粒を入れて煎じる。悪寒だけを覚え、あるいは身はあまり熱くなく肢体拘急し、あるいは手足厥冷するには炒茱萸7粒・塩少許を入れて煎じる。寒熱が調わず咳嗽喘満するには棗を入れて煎じる。婦人の難産には酢1合を入れて煎じる。いずれも時を問わない（翻刻確認）\n- 『和剤局方』の翻刻（四庫全書本）は「別為麄木外」と書く（「末」の誤りとみられるが要原本照合）\n\n### 処方の変遷\n- 資料は、多くの書が本方の出典を『和剤局方』とするが、出典としては唐代の『理傷続断方』医治整理補接次第口訣まで遡るとする（要原本照合）。翻刻の『仙授理傷續斷秘方』は唐代・藺道人の書とされる\n- 資料によれば、『理傷続断方』の後、王袞『博済方』巻二・諸気（人参が入り、生姜・大棗・白朮はない）と、その約30年後の蘇軾・沈括『蘇沈良方』巻三にも五積散が載り、『和剤局方』は『蘇沈良方』から収録したと思われる（要原本照合）\n- 資料によれば、『和剤局方』の五積散は局方原書五巻本に属し、大観年間（1107〜1110年）に収載されていた（要確認）\n- 原典から『和剤局方』までの服用法は、一部の薬味を除いて慢火で炒る調剤法で、これを熟料五積散という。炒らずにそのまま煎じる今日の一般的な方法を生料五積散といい、生料を最初に処方したのは王碩『易簡方』とされる（要原本照合）\n- 資料の表8によれば、原典から『和剤局方』までは、最も少ない芍薬などに比べて蒼朮が6.7〜20倍、桔梗が4〜10倍と、蒼朮の配合量が際立って多い（要原本照合）\n- 現行エキス剤（ツムラ63）は7.5g中、蒼朮3.0g、陳皮・当帰・半夏・茯苓 各2.0g、甘草・桔梗・枳実・桂皮・厚朴・芍薬・生姜・川芎・大棗・白芷・麻黄 各1.0g の16味（PMDA 添付文書 2023年12月改訂 第1版で確認）。原典の枳殻が枳実に替わり、乾姜は入らず、原典の構成にない大棗が入る。添付文書に出典の欄はない", "構成": "蒼朮・陳皮・当帰・半夏・茯苓・甘草・桔梗・枳実・桂皮・厚朴・芍薬・生姜・川芎・大棗・白芷・麻黄", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "炙甘草湯", "名前": "炙甘草湯", "読み": "しゃかんぞうとう", "ツムラ番号": "64", "出典": "傷寒論（弁太陽病脈証并治下第七）、金匱要略（血痺虚労病脈証并治第六・肺痿肺癰咳嗽上気病脈証并治第七。附方、千金翼方・外台秘要方の引用）", "本文": {"条文": "### 『傷寒論』弁太陽病脈証并治下第七\n\n**書き下し**（読み：社員案）\n傷寒、脈結代し、心動悸するは、炙甘草湯之を主る。\n\n**原文**（翻刻確認）\n傷寒、脈結代、心動悸、炙甘草湯主之。\n\n**現代語訳**（訳：社員案）\n傷寒で、脈が結代し（拍動がときどき途切れ）、心臓が動悸するものは、炙甘草湯がこれを主治する。\n\n### 『金匱要略』血痺虚労病脈証并治第六・附方（『千金翼』炙甘草湯）\n\n**書き下し**（読み：社員案）\n『千金翼』炙甘草湯（一に復脈湯と云う）。虚労不足、汗出でて悶え、脈結して悸し、行動常の如くなるも、百日を出でず、危急なる者は十一日にして死するを治す。\n\n**原文**（翻刻確認）\n《千金翼》炙甘草湯（一云復脈湯）。治虛勞不足、汗出而悶、脈結悸、行動如常、不出百日、危急者十一日死。\n\n**現代語訳**（訳：社員案）\n『千金翼方』の炙甘草湯（復脈湯ともいう）。虚労で体力が足りず、汗が出て胸苦しく、脈が結して動悸がし、ふだんの動作はいつもどおりにできていても、百日もたたずに、危急なものは十一日で死ぬ。これを治す。\n\n### 『金匱要略』肺痿肺癰咳嗽上気病脈証并治第七・附方（『外台』炙甘草湯）\n\n**書き下し**（読み：社員案）\n『外台』炙甘草湯。肺痿、涎唾多く、心中温温液液たる者を治す。\n\n**原文**（翻刻確認）\n《外臺》炙甘草湯。治肺痿涎唾多、心中溫溫液液者。\n\n**現代語訳**（訳：社員案）\n『外台秘要方』の炙甘草湯。肺痿で、よだれやつばが多く、胸のうちが温温液液とする（解釈は注記を参照）ものを治す。\n\n### 注記\n- 『傷寒論』の条は、維基文庫の宋本の翻刻・『注解傷寒論』の四庫全書本（書名『傷寒論注釋』）巻四で字が同じ（翻刻確認。脈／脉の字体の差のみ）。宋本の翻刻の条番号は一七七\n- 『金匱玉函経』では「心動悸」が「心中驚悸」と書かれる（要原本照合）。本文は宋本の字を採った\n- 方名の別名：宋本の翻刻の方後は「一名複脈湯」と書くが、同じ翻刻は「若複服」「複取微似汗」など「復」にあたる字を広く「複」と書いている。『傷寒論注釋』巻四は「一名復脉湯」、『金匱要略』の附方は「一云復脈湯」と書くので、「復脈湯」を採った（要原本照合）\n- 『千金翼』炙甘草湯の条の「十一日」は、資料が引く『千金翼方』巻第十五・五蔵気虚第五の復脈湯の条では「二十一日」と書かれる（要原本照合）\n- 「温温液液」の解釈は注釈書によって分かれる。現代語訳では語を訳さずに残した\n- 『金匱要略』の外台炙甘草湯は、維基文庫の翻刻では主治の文だけで、構成・服用法の記載がない（翻刻確認）\n- 麦門冬の分量は、維基文庫の宋本の翻刻だけ「半斤」と書かれる。『傷寒論注釋』巻四・『金匱玉函経』・『金匱要略』の附方はいずれも「半升」で、原典の構成は半升とした（要原本照合）\n- 生地黄の「酒洗」は宋本の翻刻にだけあり、『傷寒論注釋』巻四・『金匱玉函経』にはない（翻刻確認）。麻仁は『傷寒論注釋』巻四・『金匱玉函経』では「麻子仁」と書かれる（要原本照合）\n- 服用法の「清酒」は、『金匱玉函経』と『金匱要略』の附方では「酒」と書かれる（要原本照合）", "出典": "### 原典の構成\n- 『傷寒論』：甘草4両（炙）、生姜3両（切）、人参2両、桂枝3両（去皮）、生地黄1斤（酒洗）、阿膠2両、麦門冬半升（去心）、麻仁半升、大棗30枚（擘）（翻刻確認。麦門冬の分量の異同は条文の注記を参照）\n- 『金匱要略』血痺虚労病第六・附方（『千金翼』炙甘草湯）：甘草4両（炙）、桂枝・生姜 各3両、麦門冬半升、麻仁半升、人参・阿膠 各2両、大棗30枚、生地黄1斤（翻刻確認）\n- 『金匱要略』肺痿肺癰咳嗽上気病第七・附方（『外台』炙甘草湯）：構成の記載なし（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』：9味を清酒7升・水8升で、まず阿膠を除く8味を煮て3升を取り、滓を去り、阿膠を入れて溶かし尽くし、1升を温服する。日に3回服す。一名を復脈湯という（翻刻確認）\n- 『金匱要略』血痺虚労病第六・附方（『千金翼』炙甘草湯）：9味を酒7升・水8升で、まず8味を煮て3升を取り、滓を去り、膠を入れて溶かし尽くし、1升を温服する。日に3回服す（翻刻確認）\n\n### 処方の変遷\n- 『傷寒論』では一名を復脈湯という。『金匱要略』では『千金翼方』『外台秘要方』から引いた附方として2か所に載る（翻刻確認）\n- 『千金翼方』巻第九・傷寒上・太陽病雑療法第七に、『傷寒論』と同じ条の炙甘草湯が載り、甘草・桂枝・生姜・麦門冬・麻子仁・人参・阿膠・大棗・生地黄を用い、日に3回服すとされる（要原本照合）\n- 『千金翼方』巻第十五・補益・五蔵気虚第五には復脈湯の名で、虚労不足の条（「二十一日にして死す」）とともに生地黄・生姜・麦門冬・麻子仁・阿膠・大棗・人参・桂心・甘草が載り、日に3回・夜に3回服す。脈が戻らなければ日を隔ててまた1剤を服し、脈が戻るのを目安とするとされる（要原本照合）\n- 『外台秘要方』第十巻・肺痿方には、仲景傷寒論を引く炙甘草湯方として甘草・生姜・人参・地黄・阿膠・大麻子人・大棗・麦門冬・桂心が載り、日に3回・夜に1回服すとされる（要原本照合）\n- 『千金翼方』巻第十五・補益・補五蔵第四の温液湯は、外台炙甘草湯と同じ肺痿の条に甘草3両の1味を用い、炙の指示がないとされる（要原本照合）\n- 現行エキス剤（ツムラ64）は 地黄・麦門冬・桂皮・炙甘草・大棗・人参・麻子仁・生姜・阿膠 の9味で、原典と同じ構成（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "地黄・麦門冬・桂皮・炙甘草・大棗・人参・麻子仁・生姜・阿膠", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "帰脾湯", "名前": "帰脾湯", "読み": "きひとう", "ツムラ番号": "65", "出典": "薛氏医案（内科摘要・巻上・各症方薬）／厳氏済生方（健忘論治）／玉機微義（巻之十七・血証門・補剤）", "本文": {"条文": "### 『内科摘要』巻上・各症方薬（薛己）\n\n**書き下し**（読み：社員案）\n帰脾湯　思慮、脾を傷り、血を摂すること能わず、血の妄行を致し、或いは健忘・怔忡・驚悸・盗汗し、或いは心脾痛みを作し、嗜臥して食少なく、大便調わず、或いは肢体重痛し、月経調わず、赤白帯下し、或いは思慮、脾を傷りて瘧・痢を患うを治す。\n\n**原文**（翻刻確認）\n歸脾湯　治思慮傷脾、不能攝血、致血妄行、或健忘、怔忡、驚悸、盜汗、或心脾作痛、嗜臥少食、大便不調、或肢體重痛、月經不調、赤白帶下、或思慮傷脾而患瘧、痢。\n\n**現代語訳**（訳：社員案）\n帰脾湯は、思い悩みが脾を傷り、血を統べ収めることができず、血がみだりに巡って出血するもの、あるいは物忘れ・動悸・驚きやすさ・寝汗があるもの、あるいは心窩部から胸が痛み、横になりたがって食が少なく、便通が整わないもの、あるいは手足や体が重く痛み、月経が整わず、赤白のおりものがあるもの、あるいは思い悩みで脾を傷って瘧（おこり）や痢（下痢）を患うものを治す。\n\n### 『厳氏済生方』健忘論治（厳用和）\n\n**書き下し**（読み：社員案）\n帰脾湯　思慮過度にして、心脾を労傷し、健忘・怔忡するを治す。\n\n**原文**（翻刻確認）\n歸脾湯　治思慮過度、勞傷心脾、健忘怔忡。\n\n**現代語訳**（訳：社員案）\n帰脾湯は、思い悩みが度を過ぎて心と脾を疲れ傷り、物忘れや動悸があるものを治す。\n\n### 『玉機微義』巻之十七・血証門・補剤（徐用誠原輯・劉純続増）\n\n**書き下し**（読み：社員案）\n帰脾湯　思慮、脾を傷り、心血を統摂すること能わず、此れを以て妄行を致し、或いは吐血・下血するを治す。\n\n**原文**（翻刻確認）\n歸脾湯　治思慮傷脾、不能統攝心血、以此致妄行、或吐血下血。\n\n**現代語訳**（訳：社員案）\n帰脾湯は、思い悩みが脾を傷り、心血を統べ収めることができず、そのために血がみだりに巡って出血し、あるいは吐血・下血するものを治す。\n\n### 注記\n- 条文の順：現行エキス剤と同じ構成（当帰・遠志を含み、茯苓を用いる）の『内科摘要』を先頭にし、当帰・遠志がなく茯神を用いる『厳氏済生方』『玉機微義』を後ろに置いた\n- 『厳氏済生方』の「思慮過度」は、資料の書き下しでは「思慮、制を過ぎ」（原文「過制」にあたる）。維基文庫の2つの翻刻はどちらも「過度」（要原本照合）\n- 『厳氏済生方』の巻：資料は巻之三・健忘論治とする。維基文庫の四庫全書本では卷四・健忘、もう一つの本（簡体字）では驚悸怔忡健忘門・健忘論治（要原本照合）\n- 『内科摘要』の帰脾湯は、維基文庫の本では卷上・十二、各症方薬にある。卷下・各症方薬にはない（翻刻確認）\n- 維基文庫の『内科摘要』と『濟生方』（四庫全書本でない方）は簡体字の本で、原文は社員が繁体字に直した。字形は要原本照合\n- 「黃耆」は、四庫全書本の『濟生方』『玉機微義』では「黄茋」。簡体字の『内科摘要』『濟生方』では「黄」の次の字が欠けている（要原本照合）", "出典": "### 原典の構成\n- 『内科摘要』巻上・各症方薬：人参・白朮・白茯苓・黄耆・竜眼肉・酸棗仁 各2銭、遠志1銭、木香・甘草（炙） 各5分、当帰1銭（翻刻確認）\n- 『厳氏済生方』健忘論治：白朮・茯神（木を去る）・黄耆（蘆を去る）・竜眼肉・酸棗仁（炒り、殻を去る） 各1両、人参・木香（火を見ず） 各半両、甘草（炙）2銭半（翻刻確認）\n- 『玉機微義』巻之十七・血証門・補剤：白朮・茯神・黄耆・竜眼肉・酸棗仁 各1両、人参・木香 各半両、甘草（炙）2銭半（翻刻確認）\n- 『厳氏済生方』の茯神は、四庫全書本の翻刻では「茯苓（去木）」（要原本照合）\n- 『玉機微義』の方に、資料は当帰を挙げる。維基文庫の四庫全書本には当帰がない（要原本照合）\n\n### 原典の服用法\n- 『内科摘要』：生姜・大棗を入れ、水で煎じて服す（翻刻確認）\n- 『厳氏済生方』：㕮咀し、1回4銭を、水1盞半に生姜5片・棗子1枚を入れて7分に煎じ、滓を去って温服する。時を問わない（翻刻確認）\n- 『玉機微義』：㕮咀し、1回4〜5銭を、棗・姜を入れて煎じる（翻刻確認）\n- 『厳氏済生方』の「棗子一枚」は、四庫全書本の翻刻では「棗一枚」（要原本照合）\n\n### 処方の変遷\n- 本方は四君子湯に黄耆・当帰・竜眼肉・酸棗仁・遠志・木香を加えた形の方。資料は、本方の出典はまず四君子湯の出典を考えに入れる必要があるとする。四君子湯の出典は資料のこの項に書かれていない（要確認）\n- 一般に本方の出典は『厳氏済生方』とされる。『厳氏済生方』の方には当帰・遠志がなく、茯苓ではなく茯神を用いる（翻刻確認）。資料は、『厳氏済生方』は現在の帰脾湯の原方の出典というにとどまるとする\n- 『玉機微義』巻之十七・血証門・補剤の帰脾湯は、主治に吐血・下血が入る（翻刻確認）。資料は『厳氏済生方』の方に当帰を加えたものとするが、維基文庫の四庫全書本では当帰がなく、『厳氏済生方』と同じ8味（要原本照合）\n- 『内科摘要』巻上・各症方薬の帰脾湯は、当帰・遠志を含み茯苓を用いる、今日の帰脾湯と同じ構成（翻刻確認）。資料は、同じ方が『薛氏医案』の各処に見られるとする\n- 資料は、『薛氏医案』十六種のうち加味帰脾湯の項で挙げた8種を除く8種について、帰脾湯が載るのは『保嬰金鏡録』『癘瘍機要』『小児痘疹方論』（茯神）と『外科枢要』（茯苓）で、『保嬰粋要』『原機啓微』『敖氏傷寒金鏡録』『外科精要』には載らないとする（要原本照合）\n- 資料の出典欄には『聖済総録』『厳氏済生方』『玉機微義』『薛氏医案』が並ぶ。『聖済総録』は資料の本文（論考）に出てこず、何の出典として挙げられているかが分からない（要確認）\n- 現行エキス剤（ツムラ65）は 黄耆・酸棗仁・人参・白朮・茯苓・竜眼肉・遠志・大棗・当帰・甘草・生姜・木香 の12味で、『内科摘要』の方と同じ生薬からなる（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "黄耆・酸棗仁・人参・白朮・茯苓・竜眼肉・遠志・大棗・当帰・甘草・生姜・木香", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "芍薬甘草湯", "名前": "芍薬甘草湯", "読み": "しゃくやくかんぞうとう", "ツムラ番号": "68", "出典": "傷寒論（弁太陽病脈証并治上第五）", "本文": {"条文": "### 『傷寒論』弁太陽病脈証并治上第五\n\n**書き下し**（読み：社員案）\n傷寒、脈浮、自汗出で、小便数、心煩し、微しく悪寒し、脚攣急するに、反って桂枝を与えて其の表を攻めんと欲するは、此れ誤りなり。之を得て便ち厥し、咽中乾き、煩躁吐逆する者は、甘草乾姜湯を作りて之を与え、以て其の陽を復す。若し厥愈え足温かなる者は、更に芍薬甘草湯を作りて之を与うれば、其の脚即ち伸ぶ。若し胃気和せず、譫語する者は、少しく調胃承気湯を与う。若し重ねて汗を発し、復た焼針を加うる者は、四逆湯之を主る。\n\n**原文**（翻刻確認）\n傷寒脈浮、自汗出、小便數、心煩、微惡寒、腳攣急、反與桂枝欲攻其表、此誤也。得之便厥、咽中乾、煩躁吐逆者、作甘草乾薑湯與之、以復其陽。若厥愈足溫者、更作芍藥甘草湯與之、其腳即伸。若胃氣不和、譫語者、少與調胃承氣湯。若重發汗、復加燒針者、四逆湯主之。\n\n**現代語訳**（訳：社員案）\n傷寒で脈が浮、自然に汗が出て、小便の回数が多く、胸苦しく、軽く悪寒がし、脚がひきつるものに、かえって桂枝（湯）を与えてその表を攻めようとするのは誤りである。これを服してすぐに手足が冷え（厥し）、咽の中が乾き、もだえ苦しんで吐き戻すものには、甘草乾姜湯を作って与え、その陽気を回復させる。もし厥が治って足が温かくなったものには、さらに芍薬甘草湯を作って与えると、その脚はすぐに伸びる。もし胃気が調和せず、うわごとを言うものには、調胃承気湯を少し与える。もし重ねて発汗させ、さらに焼針を加えたものは、四逆湯がこれを主治する。\n\n### 『傷寒論』弁太陽病脈証并治上第五（証は陽旦に象るの条）\n\n**書き下し**（読み：社員案）\n問うて曰く、証は陽旦に象る。法に按じて之を治するに増劇し、厥逆し、咽中乾き、両脛拘急して譫語す。師曰く、夜半に手足当に温まるべく、両脚当に伸ぶべしと言う。後、師の言の如し。何を以て此れを知るや。答えて曰く、寸口の脈浮にして大、浮は風と為し、大は虚と為す。風なれば則ち微熱を生じ、虚なれば則ち両脛攣す。病証桂枝に象る。因りて附子を加えて其の間に参え、桂を増して汗を出さしむ。附子は経を温む。亡陽するが故なり。厥逆し、咽中乾き、煩躁し、陽明内に結ぼれ、譫語煩乱するには、更に甘草乾姜湯を飲ましむ。夜半に陽気還り、両足当に熱すべし。脛尚お微しく拘急するには、重ねて芍薬甘草湯を与うれば、爾して乃ち脛伸ぶ。承気湯を以て微しく溏せしむれば、則ち其の譫語止む。故に病愈ゆべきを知る。\n\n**原文**（翻刻確認）\n問曰、證象陽旦、按法治之而增劇、厥逆、咽中乾、兩脛拘急而譫語。師曰、言夜半手足當溫、兩腳當伸。後如師言。何以知此。答曰、寸口脈浮而大、浮為風、大為虛、風則生微熱、虛則兩脛攣、病證象桂枝、因加附子參其間、增桂令汗出、附子溫經、亡陽故也。厥逆、咽中乾、煩躁、陽明內結、譫語煩亂、更飲甘草乾薑湯。夜半陽氣還、兩足當熱、脛尚微拘急、重與芍藥甘草湯、爾乃脛伸。以承氣湯微溏、則止其譫語、故知病可愈。\n\n**現代語訳**（訳：社員案）\n問う。証が陽旦（湯）の証に似ているので、法に従って治療したところかえって悪化し、手足が冷え、咽の中が乾き、両すねがひきつってうわごとを言うようになった。師は「夜半に手足が温まり、両脚が伸びるはずだ」と言い、後に師の言葉どおりになった。どうしてこれがわかったのか。答える。寸口の脈が浮で大であった。浮は風であり、大は虚である。風であれば微熱を生じ、虚であれば両すねがひきつる。病証が桂枝（湯）の証に似ていたので、附子を加えてその間に交え、桂を増して汗を出させた。附子は経を温めるものだが、（汗によって）陽を失ったためである。手足が冷え、咽の中が乾き、もだえ苦しみ、陽明が内に結ぼれ、うわごとを言って煩乱するものには、さらに甘草乾姜湯を飲ませる。夜半に陽気が戻り、両足は熱くなるはずである。すねにまだ軽いひきつりが残るものには、重ねて芍薬甘草湯を与えると、それですねが伸びる。承気湯で軽く便をゆるくすれば、そのうわごとは止む。それゆえ病が治りうるとわかったのである。\n\n### 注記\n- 2条とも維基文庫の宋本の翻刻で確かめた（翻刻確認。腳／脚、與／与などの字体の差は書き下しで新字体にした）\n- 『金匱玉函経』巻第二・弁太陽病形証治第三の第1条は「傷寒脈浮、自汗、小便數、頗微惡寒。論曰、心煩微惡寒、兩腳攣急、反與桂枝湯、欲攻其表、得之便厥、咽乾煩躁吐逆、當作甘草乾薑湯…」と字句が異なる（要原本照合）。巻第六・弁発汗吐下後病形証治第十九にも字句の異なる同じ条がある（要原本照合）。本文は宋本の字を採った\n- 『金匱玉函経』の陽旦の条は「重與芍藥甘草湯」が「與芍藥甘草湯」、「浮為風、大為虛」が「浮即為風、大即為虛」、「病證象桂枝」が「其形象桂枝」、「參其間」が「於其間」、「以承氣湯微溏、則止其譫語」が「與承氣湯微溏、止其譫語」などと書かれる（要原本照合）。本文は宋本の字を採った\n- 構成の芍薬は、宋本・『金匱玉函経』の翻刻とも「芍藥」と書く。資料は原典で「白芍薬・甘草炙」と指示されるとする（白芍薬の字は要原本照合）\n- 『金匱玉函経』巻第七の芍藥甘草湯方は、服用法に「㕮咀」の語が入る（要原本照合）。本文は宋本の書き方を採った", "出典": "### 原典の構成\n- 『傷寒論』：芍薬・甘草（炙）各4両（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』：2味を水3升で煮て1升5合を取り、滓を去り、2回に分けて温服する（翻刻確認）\n\n### 処方の変遷\n- 『傷寒論』では、桂枝湯の誤治で厥した者に、まず甘草乾姜湯で陽を回復させ、足が温まってから用いる方として載る（翻刻確認）\n- 『伝信適用方』巻上・治脚気の中岳湯は赤芍薬・甘草（炙）を水煎し、湿気で脚が赤く腫れて痛み、胸膈が痞満し、全身が痛むもの、また脚気に用いる（要原本照合）\n- 『魏氏家蔵方』巻第八・脚気の六半湯は白芍薬・甘草（炙）を煎じ、無灰酒を少し入れて数沸させて服し、熱湿脚気で歩けないものに用いる（要原本照合）\n- 『類編朱氏集験医方』巻之一・脚気の去杖湯は赤芍薬・甘草の2味を水煎し、脚が弱く力がなく歩行が難儀なものに用いる（要原本照合）\n- 『秘伝外科方』救解諸毒傷寒雑病一切等証の神効散は白芍薬・甘草（炙）を水煎し、消渇に用いる（要原本照合）\n- 『有林福田方』巻之九・小児諸病証論・瘡疹治方の芍薬甘草湯は『道済方』を引き、白芍薬・甘草を粗末にして煎服し、瘡疹に用いる（要原本照合）。資料は『道済方』を明代の書、『衛生方』を金代の書かとし、いずれも亡佚書とする（要確認）\n- 『古方括要』巻之上・雑病門・渇症の中焦湯は、本方に大棗25枚を加える（要原本照合）\n- 本方をもとにした処方として、資料は桂枝加芍薬湯・桂枝加芍薬大黄湯・小建中湯・黄耆建中湯・当帰建中湯・芍薬甘草附子湯・四逆散を挙げる\n- 医療用エキス剤は、ツムラ芍薬甘草湯エキス顆粒（医療用）（1日量7.5g中、日局カンゾウ6.0g・日局シャクヤク6.0g。識別コード ツムラ／68。PMDA 添付文書 2023年12月改訂 第1版で確認）。ほかにクラシエ・コタロー・本草製薬・東洋薬行・康和薬通の医療用製剤がある（KEGG MEDICUS、2026-10-22）", "構成": "甘草・芍薬", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "香蘇散", "名前": "香蘇散", "読み": "こうそさん", "ツムラ番号": "70", "出典": "太平恵民和剤局方（巻之二・傷寒 附 中暑）", "本文": {"条文": "### 『太平恵民和剤局方』巻之二・傷寒 附 中暑\n\n**書き下し**（要原本照合）\n\n**原文**（要原本照合）\n\n**現代語訳**\n\n### 注記\n- 資料（論考①）によれば、局方の主治は四季の瘟疫・傷寒を治すという短い一句だけで、構成は陳皮・香附子・紫蘇葉・甘草の4味（要原本照合）\n- 方後には、白髪の老人がこの方を富人の家に授け、大疫のとき城中の病者が皆癒えたという古伝が記される（要原本照合。資料の論考①による）\n- 方後の服用法には「一本には1銭に作る」という異本の注がある（要原本照合。資料の論考㉒による）", "出典": "### 原典の構成\n- 『和剤局方』：陳皮・香附子・紫蘇葉・甘草 の4味。生姜・葱白は含まない。各味の分量は資料に記載がない（要原本照合）\n\n### 原典の服用法\n- 『和剤局方』：粗末とし、1回3銭を水1盞で7分に煎じ、滓を去って熱服する。時を問わず1日3回服す。細末にした場合は1回2銭（一本には1銭）を、塩を入れて点じて服す（要原本照合）\n\n### 処方の変遷\n- 香蘇散は『和剤局方』の紹興続添方に属し、紹興年間（1131〜1162年）に増補された方とされる（要確認）\n- 『和剤局方』の香蘇散は陳皮・香附子・紫蘇葉・甘草の4味で、生姜・葱白は含まない（要原本照合）\n- 『証治準縄』巻四十一・傷寒・太陽病・発熱の加味香蘇散（抜粋）は、香附子・紫蘇梗・陳皮・甘草を剉散とし、生姜・連根葱白で煎服するとされる（要原本照合）\n- 『寿世保元』乙集巻之二・四時感冒でも生姜・葱白の配合が指示されるとされる（要原本照合）\n- 現行エキス剤（ツムラ70）は 香附子・蘇葉・陳皮・甘草・生姜 の5味で、生姜が入り葱白は入らない（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "香附子・蘇葉・陳皮・甘草・生姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "四物湯", "名前": "四物湯", "読み": "しもつとう", "ツムラ番号": "71", "出典": "理傷続断方（医治整理補接次第口訣）／太平恵民和剤局方（巻之九・婦人諸疾 附 産図）", "本文": {"条文": "### 『理傷続断方』医治整理補接次第口訣\n\n**書き下し**（読み：社員案）\n\n凡そ傷重く、腸内に瘀血有る者は此を用う。\n\n**原文**（翻刻確認）\n\n凡傷重、腸内有瘀血者用此。\n\n**現代語訳**（訳：社員案）\n\nおよそ外傷が重く、腸の内に瘀血があるものには、これを用いる。\n\n### 関連条文（『理傷続断方』医治整理補接次第口訣の総論の条）\n\n同じ章の総論にあたる箇所で、四物湯を散血の薬として挙げる2条。\n\n**書き下し**（読み：社員案）\n\n凡そ跌損し、腸肚の中に汚血あらば、且く散血の薬を服す、四物湯の類の如し。\n\n凡そ損じて、大小便通ぜざれば、未だ便ち損薬を服すべからず。蓋し損薬は酒を用うれば必ず熱す。且く四物湯を服し、更に如何を看る。\n\n**原文**（翻刻確認）\n\n凡跌損、腸肚中汚血、且服散血藥、如四物湯之類。\n\n凡損、大小便不通、未可便服損藥、蓋損藥用酒必熱。且服四物湯、更看如何。\n\n**現代語訳**（訳：社員案）\n\nおよそ転倒や打撲で損傷し、腹の中に汚血があるときは、まず散血の薬を服す。四物湯の類のようなものである。\n\nおよそ損傷して大小便が通じないときは、まだすぐに損薬を服してはならない。損薬は酒を用いるので必ず熱をもつからである。まず四物湯を服し、さらに様子を見る。\n\n### 『太平恵民和剤局方』巻之九・婦人諸疾 附 産図\n\n**書き下し**（読み：社員案）\n\n栄衛を調益し、気血を滋養す。衝任虚損し、月水調わず、臍腹㽲痛し、崩中漏下し、血瘕塊硬く、発歇して疼痛し、姙娠して冷を宿し、将理宜しきを失い、胎動きて安からず、血下りて止まず、及び産後虚に乗じて風寒内に摶ち、悪露下らず、結して瘕聚を生じ、少腹堅痛し、時に寒熱を作すを治す。\n\n**原文**（翻刻確認）\n\n調益榮衛、滋養氣血。治衝任虚損、月水不調、臍腹㽲痛、崩中漏下、血瘕塊硬、發歇疼痛、姙娠宿冷、將理失宜、胎動不安、血下不止、及産後乗虚、風寒内摶、惡露不下、結生瘕聚、少腹堅痛、時作寒熱。\n\n**現代語訳**（訳：社員案）\n\n栄衛（営気と衛気）を調え補い、気血を養う。衝脈・任脈が虚して損なわれ、月経が順調でなく、臍のあたりや腹がひきつれるように痛み、崩中・漏下（不正性器出血）があり、血瘕の塊が硬く、痛みが起こったり止んだりするもの、妊娠中にもともと冷えがあり、養生が適切でなく、胎動して落ち着かず、出血が止まらないもの、および産後の虚に乗じて風寒が内に入ってぶつかり合い、悪露が下らず、結して瘕聚（腹中の塊）を生じ、下腹が硬く痛み、時に寒熱が起こるものを治す。\n\n### 注記\n- 『理傷続断方』の翻刻（維基文庫『仙授理傷續斷秘方』）は簡体字の本で、原文は繁体字にそろえて書いた（伤→傷、肠→腸、药→藥、汤→湯、热→熱 など）。字形の判断には使えない（要原本照合）\n- 資料は『理傷続断方』の方後に「一方は只、当帰・大黄の二味を用う」とあるとするが、維基文庫の翻刻の四物湯の項にはこの句がない（要原本照合）\n- 『和剤局方』の「㽲痛」は翻刻（四庫全書本）の字。資料の書き下しは「疞痛」と書く（要原本照合）\n- 『和剤局方』の「風寒内摶」は翻刻の字。資料の書き下しは「風寒内に搏ち」と「搏」の字で書く（要原本照合）\n- 『和剤局方』の「滋養」は、翻刻では「滋飬」（養の異体字）。字体の違いとして本文は「養」にした\n- 2書の順は、資料の出典欄（華佗方？、『理傷続断方』）にある『理傷続断方』を先にした。2書とも構成は現行エキス剤（ツムラ）と同じ4味。添付文書に出典の欄はない（要確認）", "出典": "### 原典の構成\n- 『理傷続断方』：白芍薬・川当帰・熟地黄・川芎 各等分（翻刻確認）\n- 『和剤局方』：当帰（蘆を去り、酒に浸して炒る）・川芎・熟地（酒に浸して蒸す）・芍薬（白）各等分（翻刻確認）。資料は「熟乾地黄・白芍薬・当帰・川芎」と書く（要原本照合）\n\n### 原典の服用法\n- 『理傷続断方』：等分とし、1回3銭を水1盞半で7分に煎じ、空腹時に熱服する（翻刻確認）\n- 『和剤局方』：粗末とし、1回3銭を水1盞半で8分に煎じ、滓を去って熱服する。空腹時・食前に服す。妊娠して胎動不安・下血が止まらないものには艾10葉・阿膠1片を加えて同じく煎じる。血蔵が虚冷して崩中し出血が多いものにも膠・艾を加えて煎じる（翻刻確認）\n\n### 処方の変遷\n- 資料の出典欄は「華佗方？、『理傷続断方』」。『婦人大全良方』巻之二 衆疾門・通用方序論第五・加減四物湯が、四物湯はどの代から起こったか知らない、或る人は魏の華佗に始まるという、と記すことによる（要原本照合）\n- 資料は、従来は『和剤局方』巻之九が出典とされてきたが、本来の出典は『理傷続断方』医治整理補接次第口訣とする。同書は唐の藺道人の撰で会昌年間（841〜846年）の成書とし、四物湯は補養薬（損薬）ではなく散血薬（駆瘀血薬）として位置づけられているとする（要原本照合）。翻刻の『仙授理傷續斷秘方』は唐代・藺道人の書とされる\n- 資料は、『理傷続断方』は洪武版本（1395年刊）で初めて全貌が世に知られたとする（要確認）\n- 資料によれば、『理傷続断方』の方後の一方（当帰・大黄の2味）は『備急千金要方』巻第二十五 備急・被打第三に、高所から堕下して崩中する方として載る。『和剤局方』巻之八・瘡腫傷折では同じ2味が導滞散として収載される（要原本照合）\n- 資料によれば、董汲『旅舎備要方』婦人科に四物湯があり、当帰・白芍薬・川芎・熟乾地黄を散として生姜で煎服する。漏胎・崩中には炙阿膠・熟艾を、産後には童子小便を加える。資料は同書を元豊〜元祐年間（1078〜1094年）の著作とし、四物湯は『和剤局方』原書五巻本の大観年間（1107〜1110年）の収載より前に知られていたとする（要原本照合）\n- 資料によれば、『太平聖恵方』巻第八十一・治産後心腹痛諸方の定痛散方は当帰・赤芍薬・芎藭を散として熱生姜酒で服す。『聖済総録』巻第一百六十・産後門・産後悪露不可（資料の表記。引用の文は「悪露快からず」）の四物湯方は当帰・芎藭・熟乾地黄・芍薬を粗末として煎服する（要原本照合）\n- 資料によれば、昝殷『経効産宝』（大中年間 847〜860年の成書）には四物湯・四物散は載らず、宋代の続編に増減四物湯（当帰・芍薬・川芎・人参・乾姜・甘草）が載るのみ（要原本照合）\n- 『和剤局方』の方後の、艾葉・阿膠を加える法について、資料は甘草があればまさに芎帰膠艾湯そのものとする。一般に四物湯は芎帰膠艾湯から阿膠・艾葉・甘草を去ったものとされるが、資料は、華佗の創方なら芎帰膠艾湯が四物湯に加味した方である可能性もあるとする（要確認）\n- 地黄：資料は、原典では熟地黄、『和剤局方』でも熟乾地黄（熟地黄）と指示されるが、現在の多くのエキス製剤は日局地黄として乾地黄と熟地黄を区別せずに処方し（事実上は乾地黄）、熟地黄を処方しているメーカーもあるとする（要確認）\n- 現行エキス剤（ツムラ71）は7.5g中、地黄・芍薬・川芎・当帰 各3.0g の4味（PMDA 添付文書 2023年12月改訂 第1版で確認）。添付文書に出典の欄はない", "構成": "地黄・芍薬・川芎・当帰", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "甘麦大棗湯", "名前": "甘麦大棗湯", "読み": "かんばくたいそうとう", "ツムラ番号": "72", "出典": "金匱要略（婦人雑病脈証并治第二十二）", "本文": {"条文": "### 『金匱要略』婦人雑病脈証并治第二十二\n\n**書き下し**（読み：社員案）\n婦人の臓躁、喜く悲傷して哭せんと欲し、象神霊の作す所の如く、数欠伸するは、甘麦大棗湯之を主る。\n\n**原文**（翻刻確認）\n婦人臟躁，喜悲傷欲哭，象如神靈所作，數欠伸，甘麥大棗湯主之。\n\n**現代語訳**（訳：社員案）\n婦人の臓躁で、よく悲しみ傷んで泣きたがり、その様子は神霊の仕業のようであり、しばしばあくびをして伸びをするものは、甘麦大棗湯がこれを主治する。\n\n### 注記\n- 「臟躁」は、四部叢刊本（明嘉靖俞橋刊本の影印）の翻刻では「藏躁」と書かれる（要原本照合）\n- 「欲哭」の「欲」は、四部叢刊本の翻刻では異体字（Unicode U+238D4）で書かれる（字体の違い。要原本照合）\n- 「大棗」の「棗」は、四部叢刊本の翻刻では異体字（Unicode U+2C0F7）で書かれる（字体の違い。要原本照合）\n- 方の見出しは、四部叢刊本の翻刻では「甘草小麥大棗湯方」（棗は上の異体字）で、条の方名（甘麥大棗湯）と違う（翻刻確認）\n- 維基文庫の『金匱要略』の翻刻にはこの方の分量・服用法が載っておらず、「出典」の構成・服用法は四部叢刊本の翻刻だけで確かめた", "出典": "### 原典の構成\n甘草2両、小麦1升、大棗10枚（翻刻確認。四部叢刊本の翻刻だけで確かめた）\n\n### 原典の服用法\n3味を水6升で煮て3升を取り、温めて3回に分けて服す。また脾気を補う（翻刻確認）\n\n### 処方の変遷\n- 条では「甘麦大棗湯」、方の見出しでは「甘草小麦大棗湯」と書かれる（翻刻確認）\n- 『普済本事方』巻第十・婦人諸疾に、婦人の臓躁を治す「大棗湯」の名で載る（要原本照合）\n- 『婦人大全良方』巻之十五・妊娠臓躁悲傷方論第十三は許学士を引いて大棗湯を載せ、後に「専ら婦人を治する方」「甘草湯と名づく」と続ける（要原本照合）\n- 『袖珍方』巻之四・婦人方・調経衆疾は『大全良方』を引いて大棗湯として載せる（要原本照合）\n- 現行エキス剤（ツムラ72）は 大棗・甘草・小麦 の3味（PMDA 添付文書 2023年12月改訂 第1版で確認。小麦は「ショウバク」と書かれる）", "構成": "大棗・甘草・小麦", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "柴陥湯", "名前": "柴陥湯", "読み": "さいかんとう", "ツムラ番号": "73", "出典": "傷寒活人書（巻第十・七十五）／傷寒直格方（巻中・結胸）／傷寒標本心法類萃（巻上・結胸）", "本文": {"条文": "### 『傷寒活人書』巻第十・七十五\n\n**書き下し**（読み：社員案）\n心下緊満し、之を按じて石硬にして痛むを問う。……其の脈、寸口浮、関・尺皆沈、或いは沈緊なるを、名づけて結胸と曰う也。結胸を治するには、大率当に下すべし（仲景云う、之を下せば則ち和すと）。然れども脈浮と大とは皆下すべからず、之を下せば則ち死す。尚宜しく汗を発すべき也。仲景云う、結胸脈浮なる者は下すべからず、只小陥胸湯を用うべしと。大抵脈浮なるは、是れ尚表証有り。兼ねて小柴胡湯等を以て先ず表を発し、表証罷めば、方に結胸を下す薬を用いて便ち安し。\n\n**原文**（翻刻確認）\n問心下緊滿，按之石硬而痛。……其脉寸口浮，關尺皆沉，或沉緊，名曰結胸也。治結胸，大率當下（仲景云：下之則和）。然脉浮與大，皆不可下，下之則死，尚宜發汗也。仲景云：結胸脉浮者，不可下，只可用小陷胸湯。大抵脉浮，是尚有表證，兼以小柴胡湯等先發表，表證罷，方用下結胸藥便安。\n\n**現代語訳**（訳：社員案）\n心窩部が張りつめて満ち、押すと石のように硬く痛むものについて問う。……その脈が寸口で浮、関・尺はいずれも沈、あるいは沈緊であるものを結胸という。結胸の治療は、おおむね下すのがよい（仲景は、これを下せば和らぐという）。しかし脈が浮や大のものは、いずれも下してはならず、下せば死ぬ。やはり汗を発するのがよい。仲景は、結胸で脈が浮のものは下してはならず、ただ小陥胸湯を用いるべきだという。おおよそ脈が浮なのはまだ表証があるからで、小柴胡湯などを兼ねて用いてまず表を発し、表証が治まってから結胸を下す薬を用いれば落ち着く。\n\n### 『傷寒直格方』巻中・結胸\n\n**書き下し**（読み：社員案）\n……或いは脈浮なる者は、表未だ罷まざる也。之を下すべからず（之を下せば死す）。宜しく小陥胸湯及び小柴胡の類にて和解すべし。\n\n**原文**（翻刻確認）\n……或脉浮者，表未罷也，不可下之（下之死），宜小陷胸湯及小柴胡之類和解。\n\n**現代語訳**（訳：社員案）\n……あるいは脈が浮のものは、表証がまだ治まっていないのである。これを下してはならない（下せば死ぬ）。小陥胸湯や小柴胡湯の類で和解するのがよい。\n\n### 『傷寒標本心法類萃』巻上・結胸\n\n**書き下し**（読み：社員案）\n結胸の証に三つ有り。按ぜずして痛む者を大結胸と名づけ、之を按じて痛む者を小結胸と名づけ、心下怔忡し頭汗出づる者を水結胸と名づくる也。……或いは脈浮なる者は、表未だ罷まざる也。下すべからず、之を下せば則ち死す。宜しく小陥胸湯及び小柴胡湯の類にて之を和解すべし。……脈浮にして下すべからざる者は、小陥胸湯に小柴胡湯を合す。\n\n**原文**（翻刻確認）\n結胸之証有三：不按而痛者名大結胸，按之而痛者名小結胸，心下怔忡頭汗出者名水結胸也。……或脈浮者表未罷也，不可下，下之則死，宜小陷胸湯及小柴胡湯之類和解之。……脈浮不可下者，小陷胸湯合小柴胡湯。\n\n**現代語訳**（訳：社員案）\n結胸の証には三つある。押さなくても痛むものを大結胸、押すと痛むものを小結胸、心窩部で動悸がして頭に汗が出るものを水結胸という。……あるいは脈が浮のものは、表証がまだ治まっていない。下してはならず、下せば死ぬ。小陥胸湯や小柴胡湯の類でこれを和解するのがよい。……脈が浮で下してはならないものには、小陥胸湯に小柴胡湯を合わせる。\n\n### 注記\n- 3書とも「柴陥湯」の方名はなく、小柴胡湯と小陥胸湯をあわせて用いる記載である（翻刻確認）\n- 『傷寒活人書』の原文は、維基文庫の簡体字の本（書名『傷寒類證活人書』）を繁体字に直して載せた。字形の判断には使えない（要原本照合）。翻刻では小陥胸湯・小柴胡湯の後に「（正方四十）」「（正二十九）」の方の番号が入るが、原文では省いた。資料は後半の「仲景云う……」以下を夾注として括弧に入れるが、翻刻では括弧がない（要原本照合）\n- 『傷寒直格方』の「表未罷也」は、維基文庫の四庫全書本の翻刻では「表水罷也」と書かれる（要原本照合）。資料の書き下し（「表未だ罷らざる也」）と『傷寒標本心法類萃』の同じ句に合わせて「未」を採った\n- 『傷寒直格方』の「（下之死）」は、四庫全書本の翻刻で小字の注になっている（翻刻確認）。翻刻ではこの条の「和解」の後が「未罷者方可下之」と続き、『傷寒標本心法類萃』の「之表罷者方可下之」と異なる（要原本照合）\n- 『傷寒標本心法類萃』は、維基文庫では『傷寒直格方』（四庫全書本）の「標本心法類萃卷上」として収められる（翻刻確認）", "出典": "### 原典の構成\n- 『傷寒活人書』『傷寒直格方』『傷寒標本心法類萃』：合方としての分量の記載はない（翻刻確認）\n- 元の方（『傷寒論』）：小柴胡湯は柴胡半斤・黄芩3両・人参3両・半夏半升（洗）・甘草3両（炙）・生姜3両（切）・大棗12枚（擘）。小陥胸湯は黄連1両・半夏半升（洗）・栝楼実（大きいもの）1枚（翻刻確認）\n\n### 原典の服用法\n- 『傷寒活人書』『傷寒直格方』『傷寒標本心法類萃』：合方としての服用法の記載はない（翻刻確認）\n- 元の方（『傷寒論』）：小柴胡湯は7味を水1斗2升で煮て6升を取り、滓を去り、再び煎じて3升を取り、1升を温服する。日に3回。小陥胸湯は水6升でまず栝楼を煮て3升を取り、滓を去り、ほかの薬を入れて煮て2升を取り、滓を去り、3回に分けて温服する（翻刻確認）\n\n### 処方の変遷\n- 小柴胡湯と小陥胸湯の合方。小柴胡湯の出典は『傷寒論』（弁太陽病脈証并治中第六に方と加減法がある）、小陥胸湯の出典は『傷寒論』弁太陽病脈証并治下第七（翻刻確認）。資料の出典欄には『金匱要略』も挙がる\n- 『傷寒論』の小柴胡湯の方後の加減法に、胸中が煩して嘔しないものは半夏・人参を去り栝楼実1枚を加えるとある（翻刻確認）\n- 資料は、『傷寒活人書』（大観元年〔1107〕の自序がある）に小陥胸湯と小柴胡湯等を兼ねて用いる形がすでにあり、柴陥湯の出典はここまでさかのぼるべきとする\n- 資料は、明・陶華『傷寒六書』巻之六にも小柴胡湯と小陥胸湯の合方投与の記載があるが、柴陥湯の方名は見当たらないとする（要原本照合）\n- 資料は、『医学入門』三巻下・傷寒用薬賦に「柴陥湯、即ち小柴胡湯合小陥胸湯」とあり、ここで柴陥湯の方名が記されるとする（要原本照合）\n- 資料は、日本では従来、本方の出典は本朝経験方とされ『医方口訣集』に登載されているといわれてきたとする（要原本照合）\n- 原典の小陥胸湯は栝楼実を用いる（翻刻確認）。現行エキス剤（ツムラ73）は栝楼仁を用い、柴胡5.0・半夏5.0・黄芩3.0・大棗3.0・人参2.0・黄連1.5・甘草1.5・生姜1.0・栝楼仁3.0g の9味（PMDA 添付文書 2023年12月改訂 第1版で確認。栝楼仁は添付文書では「カロニン」と書かれる）", "構成": "柴胡・半夏・黄芩・大棗・人参・黄連・甘草・生姜・栝楼仁", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "四君子湯", "名前": "四君子湯", "読み": "しくんしとう", "ツムラ番号": "75", "出典": "聖済総録（巻第六十三・嘔吐門・乾嘔、順気湯）／太平恵民和剤局方（巻之三・一切気 附 脾胃・積聚）", "本文": {"条文": "### 『聖済総録』巻第六十三・嘔吐門・乾嘔（順気湯）\n\n**書き下し**（読み：社員案）\n胃中和せず、気逆して乾嘔し、飲食下らざるを治す、順気湯方。\n\n**原文**（翻刻確認）\n治胃中不和、気逆乾嘔、飲食不下、順気湯方。\n\n**現代語訳**（訳：社員案）\n胃の中が調和せず、気が逆上して乾嘔（吐こうとしても物が出ない）し、飲食が下っていかないものを治す、順気湯の処方。\n\n### 『太平恵民和剤局方』巻之三・一切気 附 脾胃・積聚\n\n**書き下し**（読み：社員案）\n栄衛の気虚し、臓腑怯弱にして、心腹脹満し、全く食を思わず、腸鳴泄瀉し、嘔噦吐逆するを治す。大いに宜しく之を服すべし。\n\n**原文**（翻刻確認）\n治栄衛気虚、臓腑怯弱、心腹脹満、全不思食、腸鳴泄瀉、嘔噦吐逆。大宜服之。\n\n**現代語訳**（訳：社員案）\n栄衛の気が虚し、臓腑が弱く、心窩部から腹が張って膨れ、まったく食べたいと思わず、腹が鳴って下痢し、えずいて吐き戻すものを治す。大いにこれを服するのがよい。\n\n### 注記\n- 方名は、『聖済総録』では「順気湯」、『和剤局方』では「四君子湯」。資料は、四味の構成が早く見えるのは『聖済総録』の順気湯であるとして、出典を『聖済総録』とする\n- 『聖済総録』の翻刻は簡体字の本（「治胃中不和，气逆干呕，饮食不下，顺气汤方」）。本文は新字体に直したもので、字形は要原本照合\n- 『聖済総録』の服用法の「㕮咀」は、翻刻では1字目が欠けている（「上四味、 咀如麻豆大」）。資料の字「㕮」を置いた（要原本照合）\n- 『和剤局方』の翻刻（四庫全書本）は旧字体（榮衞氣虚臟腑怯弱心腹脹滿…）。本文は新字体にした\n- 『和剤局方』の条の「臓腑」「脹満」は、資料の書き下しでは「蔵腑」「張満」と書かれる（要原本照合）。本文は翻刻の字を採った\n- 『和剤局方』の構成の「白朮」は、翻刻では「白术」と書かれる。本文は「白朮」にした", "出典": "### 原典の構成\n- 『聖済総録』（順気湯）：白朮2両、白茯苓（黒皮を去る）1両半、人参1両、甘草（微炙）3分（翻刻確認）\n- 『和剤局方』（四君子湯）：人参（蘆を去る）・甘草（炙）・茯苓（皮を去る）・白朮 各等分（翻刻確認）\n\n### 原典の服用法\n- 『聖済総録』（順気湯）：4味を㕮咀して麻豆の大きさにし、1回3銭匕を、水1盞に姜・棗を入れて7分まで煎じ、滓を去って温服する。時候に拘わらない（翻刻確認。「㕮」の字は要原本照合）\n- 『和剤局方』（四君子湯）：細末とし、1回2銭を水1盞で7分まで煎じ、通口に服す。時に拘わらない。塩少々を入れて白湯で点服してもよい。常に服すれば脾胃を温和し、飲食を進益し、寒邪・瘴霧の気を辟く（翻刻確認）\n\n### 処方の変遷\n- 資料は、本方の出典は従来『和剤局方』巻之三とされてきたが、それより早い『聖済総録』巻第六十三・嘔吐門・乾嘔の順気湯に、白朮・白茯苓・人参・甘草を㕮咀して姜棗で煎服する記載があるとする（順気湯の条は翻刻確認）\n- 資料は、四君子湯は『和剤局方』では続添諸局経験秘方に属し、『和剤局方』への収載は淳祐年間（1241〜51年）とする（要確認。四庫全書本の翻刻には続添の印がない）\n- 資料は、『聖済総録』は宋の政和年間（1111〜17年）に編録され、大定年間（1161〜89年）に重刊された全二百巻の書とする（要確認）\n- 『和剤局方』の四君子湯には生姜・大棗の指示がない（翻刻確認）\n- 『聖済総録』巻第八十・水腫門・水気遍身腫満の白朮湯は、白朮・赤茯苓・人参・甘草を等分にして粗く搗いて篩い、煎じて温服する。順気湯と比べて白茯苓が赤茯苓になり、姜・棗の指示がない（翻刻確認）\n- 資料は、『小児薬証直訣』巻下の異功散（四味に陳皮を加え、姜棗で煎服）は宣和年間（1119〜25年）の成書で、四君子湯の『和剤局方』への採録より百数十年前であり、異功散を四君子湯加陳皮とみるのは誤りとする（要原本照合）\n- 現行エキス剤（ツムラ75）は 蒼朮4.0・人参4.0・茯苓4.0・甘草1.0・生姜1.0・大棗1.0g（7.5g中。PMDA 添付文書 2023年12月改訂 第1版で確認）。原典の白朮の代わりに蒼朮が入り、生姜・大棗が加わる", "構成": "蒼朮・人参・茯苓・甘草・生姜・大棗", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "芎帰膠艾湯", "名前": "芎帰膠艾湯", "読み": "きゅうききょうがいとう", "ツムラ番号": "77", "出典": "金匱要略（婦人妊娠病脈証并治第二十）", "本文": {"条文": "### 『金匱要略』婦人妊娠病脈証并治第二十\n\n**書き下し**（読み：社員案）\n師曰く、婦人漏下する者有り、半産の後、因りて続けて下血し都て絶えざる者有り、妊娠下血する者有り。仮令えば妊娠して腹中痛むは、胞阻と為す。膠艾湯之を主る。\n\n**原文**（翻刻確認）\n師曰、婦人有漏下者、有半產後因續下血都不絕者、有妊娠下血者、假令妊娠腹中痛、為胞阻、膠艾湯主之。\n\n**現代語訳**（訳：社員案）\n師が言う。婦人には、不正出血（漏下）が続く者がおり、流産（半産）の後にそのまま出血が続いてまったく止まらない者がおり、妊娠中に出血する者がいる。もし妊娠して腹中が痛むなら、これを胞阻という。膠艾湯がこれを主治する。\n\n### 関連条文（膠姜湯の条）\n\n『金匱要略』婦人雑病脈証并治第二十二。林億らの注が、方のない膠姜湯を妊娠病篇の膠艾湯ではないかとする条。\n\n**書き下し**（読み：社員案）\n婦人陥経し、漏下黒くして解せざるは、膠姜湯之を主る。（臣億等、諸本を校するに膠姜湯の方無し。想うに是れ前の妊娠中の膠艾湯ならん。）\n\n**原文**（翻刻確認）\n婦人陷經、漏下黑不解、膠薑湯主之。（臣億等校諸本無膠薑湯方、想是前妊娠中膠艾湯。）\n\n**現代語訳**（訳：社員案）\n婦人が陥経となり、黒い不正出血が続いて治らないものは、膠姜湯がこれを主治する。（林億らが諸本を校合したところ膠姜湯の方はない。思うに、前の妊娠病の篇の膠艾湯であろう。）\n\n### 注記\n- 条文の方名は「膠艾湯」、方の見出しは「芎帰膠艾湯方」（翻刻確認）\n- 四部叢刊本（明嘉靖俞橋刊本の影印）の翻刻では、方の見出しの下に小字の注「一方加乾姜一两胡氏治婦人胞動無乾姜」がある。維基文庫の『金匱要略』の翻刻にはこの注がない（翻刻確認）\n- 四部叢刊本の翻刻は「姙娠」「半産」「不絶」と書く。字体だけの違い（要原本照合）\n- 膠姜湯の条の林億の注は、四部叢刊本の翻刻では「想是姙娠中膠艾湯」で「前」の字がない（要原本照合）。本文は維基文庫の『金匱要略』の字を採った。四部叢刊本は「黒」「姜」と書く（字体の違い）\n- 生薬の「芎窮」は、維基文庫の2つの翻刻ともこの字。資料は「芎藭」と書く（要原本照合）", "出典": "### 原典の構成\n- 『金匱要略』：芎窮・阿膠・甘草 各2両、艾葉・当帰 各3両、芍薬4両、乾地黄（分量の記載なし）（翻刻確認）\n- 乾地黄の分量は、維基文庫の『金匱要略』・四部叢刊本の2つの翻刻とも書かれていない。資料にも原典の分量の記載がない（要原本照合）\n\n### 原典の服用法\n- 『金匱要略』：7味を水5升・清酒5升を合わせて煮て3升を取り、滓を去り、膠を入れて溶かしきり、1升を温服する。日に3回服す。治らなければさらに作る（翻刻確認）\n\n### 処方の変遷\n- 処方の形は四物湯（地黄・芍薬・当帰・川芎）に阿膠・甘草・艾葉を加えたものだが、資料は歴史的には全く逆であるとする。四物湯の出典は資料のこの項に書かれていない（要確認）\n- 『備急千金要方』巻第二 婦人方上・妊娠諸病第四・胎動及数堕胎第一に、方名なしで艾葉・阿膠・芎藭・当帰・甘草の5味の方がある。同じ篇の下血第七には外傷・打撲による流産を防ぐ膠艾湯方がある（要原本照合）\n- 『医方類聚』巻之二百二十四 胎産救急方・漏胎では、この5味を孫真人方の芎帰膠艾湯として引く。同じく傷胎では『集験方』の膠艾湯（当帰・地黄・艾葉・阿膠・川芎。一方は地黄なく甘草を加える）を引き、結局5味と同じになる。資料は、一般に『千金方』の芎帰膠艾湯とされる5味の方は、本来『集験方』の膠艾湯の一方と称すべきとする（要原本照合）\n- 『外台秘要方』第三十三巻 婦人上・妊娠胎動方には、『小品方』からの引用として阿膠・艾葉の2味の膠艾湯が載る（要原本照合）\n- 藺道人『理傷続断方』又治傷損方論の膠艾湯は乾地黄・阿膠・川芎・艾葉（要原本照合）\n- 『太平聖恵方』巻第十・治傷寒鼻衄諸方の艾葉湯方は艾葉・生乾地黄・阿膠。巻第七十五・治妊娠胎動下血諸方の阿膠散方は阿膠・艾葉・芎藭・当帰・熟地黄を散とし、温酒で調下する（要原本照合）\n- 『聖済総録』巻第一百五十四 妊娠門・妊娠驚胎の当帰湯方は芎帰膠艾湯に人参を加えた方。妊娠胎動の膠艾湯方は芎帰膠艾湯の7味を水と酒で煎服し、小艾葉湯方は先の5味。巻第一百五十五 妊娠門・妊娠卒下血の膠艾湯方は原典の7味、芎藭湯方は先の5味（要原本照合）\n- 『三因極一病証方論』巻之十七 婦人論・漏阻例の膠艾湯は熟地黄・艾葉・当帰・甘草・芍薬・川芎・阿膠・黄耆を剉散として煎服する（芎帰膠艾湯加黄耆）。胸中逆冷には生姜5片・棗3枚を加える（要原本照合）\n- 『医塁元戎』巻十一 厥陰証・四物湯例の四物膠艾湯は四物湯加阿膠甘草艾（要原本照合）\n- 『千金方』巻第二十五 備急・被打第三の大膠艾湯は芎帰膠艾湯加乾姜。『千金翼方』第二十 雑病下・従高堕下第四にもほぼ同じ条がある（要原本照合）\n- 片倉鶴陵『産科発蒙』巻二・妊娠頓仆失踞胎動第四の大阿膠湯は当帰・芍薬・地黄・阿膠・艾葉・乾姜・川芎・甘草で、四部叢刊本の注の「一方加乾姜一两」の方にあたる（要原本照合）\n- 現行エキス剤（ツムラ77）は 地黄・芍薬・当帰・艾葉・甘草・川芎・阿膠 の7味で、原典と同じ生薬からなる（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "地黄・芍薬・当帰・艾葉・甘草・川芎・阿膠", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "柴胡清肝湯", "名前": "柴胡清肝湯", "読み": "さいこせいかんとう", "ツムラ番号": "80", "出典": "外科正宗（巻之二・鬢疽論）／一貫堂方", "本文": {"条文": "### 『外科正宗』巻之二・鬢疽論\n\n**書き下し**（読み：社員案）\n鬢疽の初起、未だ成らざる者を治す。陰陽・表裏を論ずる毋く、倶に之を服すべし。\n\n**原文**（翻刻確認）\n治鬢疽初起未成者、毋論陰陽・表裏、倶可服之。\n\n**現代語訳**（訳：社員案）\n鬢疽の初期で、まだ（疽が）できあがっていないものを治す。陰陽・表裏を問わず、いずれにも服用させてよい。\n\n### 注記\n- 『外科正宗』の翻刻は簡体字の混じる本で、原文は繁体字にそろえて書いた（表里→表裏、俱→倶 など）。字形の判断には使えない（要原本照合）\n- 論の番号：資料は「鬢疽論第二十五」、翻刻は「鬢疽論第二十」（翻刻では第二十五は巻三の流注論）。表題には巻と論名だけを書いた（要原本照合）\n- 方名の後に方歌「柴胡清肝芎芍歸、黃芩梔子地黃隨。防風牛子天花粉、甘草連翹一處宜。」が置かれる（翻刻確認）\n- 『外科正宗』の方は柴胡清肝「湯」。薛己系の書の同名方は柴胡清肝「散」で、構成も異なるため条文には上げず、処方の変遷に書いた", "出典": "### 原典の構成\n- 『外科正宗』巻之二・鬢疽論：川芎・当帰・白芍・生地黄・柴胡・黄芩・山梔・天花粉・防風・牛蒡子・連翹・甘草節 各1銭（翻刻確認）\n\n### 原典の服用法\n- 『外科正宗』巻之二・鬢疽論：水2鍾で煎じて8分とし、食遠（食事から間をあけて）服す（翻刻確認）\n\n### 処方の変遷\n- 現行の柴胡清肝湯は一貫堂方で、一貫堂では柴胡清肝散と呼ぶ。資料は、『森道伯先生伝』『漢方一貫堂医学』とも柴胡清肝散と命名し、荊芥連翹湯・竜胆瀉肝湯とともに解毒証体質の改善薬とする（要原本照合）\n- 同名の柴胡清肝散が薛己系の書に載る。『明医雑著』（薛己注本）巻之六の附方に2方：①柴胡・黄芩 各1銭、黄連・山梔 各7分、当帰1銭、川芎6分、生地黄・牡丹皮 各1銭、升麻8分、甘草3分（翻刻確認）、②柴胡・黄芩・人参 各3分、山梔・川芎 各5分、連翹・桔梗 各4分、甘草3分（翻刻確認）\n- 『外科枢要』（薛己）巻四・治瘡瘍各症附方の柴胡清肝散：柴胡1銭半、黄芩・人参・川芎 各1銭、山梔1銭半、連翹・桔梗 8分、甘草5分（翻刻確認。連翹の量は翻刻の区切りでは桔梗と同じ8分に読める）\n- 『保嬰撮要』（薛鎧）巻六・発熱の柴胡清肝散：柴胡1銭半、黄芩・人参・川芎 各1銭、山梔1銭半、連翹・甘草 各5分、桔梗8分（翻刻確認）。資料は、人参入りの方はこれが方源で、薛己の人参入りの方は父・薛鎧の創製方を引き継いだものであろうとする（要原本照合）\n- 資料は、『外科正宗』の方が最も一貫堂方に近く、森道伯がこれから防風を去り黄連・黄柏・桔梗・薄荷を加えて一貫堂方の柴胡清肝散としたとする（要原本照合）。『外科正宗』の12味から防風を去り4味を加えると、現行エキス剤の15味と一致する（翻刻確認）\n- 資料は、一貫堂方としては四物湯に『万病回春』の黄連解毒湯（通常の黄連解毒湯加柴胡・連翹）を合方し甘草を加えた四物黄連解毒湯に、桔梗・牛蒡子・栝楼根・薄荷を配した方剤とする（要原本照合）\n- 四物湯の出典は『理傷続断方』、黄連解毒湯の出典は『肘後百一方』とされる。資料の出典欄にはこの2書と『薛氏医案』も挙がる（要確認）\n- 方名：『外科正宗』で初めて柴胡清肝湯と記載されたが、これは一貫堂の方ではない。一貫堂方を柴胡清肝湯と呼ぶ記載は、資料によれば『漢方後世要方解説』（昭和29年初版）の「柴胡清肝湯　一貫堂経験方」が早く、『一般用漢方処方の手引き』（昭和50年初版）への掲載で柴胡清肝湯の名が定着した（要原本照合）\n- 現行エキス剤（ツムラ）は7.5g中、柴胡2.0g、黄芩・黄柏・黄連・栝楼根・甘草・桔梗・牛蒡子・山梔子・地黄・芍薬・川芎・当帰・薄荷・連翹 各1.5g の1

悸し、或いは小便利せず、或いは腹中痛み、或いは泄利下重する者は、四逆散之を主る。\n\n**原文**（翻刻確認）\n少陰病、四逆、其人或咳、或悸、或小便不利、或腹中痛、或泄利下重者、四逆散主之。\n\n**現代語訳**（訳：社員案）\n少陰病で手足が冷え（四逆）、その人はあるいは咳をし、あるいは動悸がし、あるいは小便の出が悪く、あるいは腹の中が痛み、あるいは下痢して後ろが重く渋る（泄利下重）者は、四逆散がこれを主治する。\n\n### 『金匱玉函経』巻第四・弁少陰病形証治第八\n\n**書き下し**（読み：社員案）\n少陰病、四逆し、其の人或いは咳し、或いは悸し、或いは小便利せず、或いは腹中痛み、或いは泄利下重する者は、四逆散之を主る。\n\n**原文**（翻刻確認）\n少陰病，四逆，其人或咳，或悸，或小便不利，或腹中痛，或泄利下重者，四逆散主之。\n\n**現代語訳**（訳：社員案）\n少陰病で手足が冷え（四逆）、その人はあるいは咳をし、あるいは動悸がし、あるいは小便の出が悪く、あるいは腹の中が痛み、あるいは下痢して後ろが重く渋る（泄利下重）者は、四逆散がこれを主治する。\n\n### 注記\n- 条文は宋本の翻刻と『金匱玉函経』の翻刻で字が同じ（翻刻確認）\n- 『金匱玉函経』の方（巻第八・方薬炮製の四逆散方第一百三）は宋本と同じ4味（翻刻確認）\n- 資料は「咳」を「欬」と書く。欬／咳は字体の違いで、本文は翻刻の「咳」を採った\n- 枳実の修治は、宋本の翻刻では「破，水漬，炙幹」と書かれる。「幹」は「乾」の字の誤りと見て、原典の構成では「炙って乾かす」とした（要原本照合）\n- 方後の加減は、『金匱玉函経』では咳の加減の「並主下利」が「並主久痢」、「腹中痛者，加附子一枚，炮令坼」が「腹痛者加附子一枚炮」と書かれ、作り方は「搗篩」がなく「上四味為散」とある（要原本照合）。本文は宋本の字を採った", "出典": "### 原典の構成\n- 『傷寒論』：甘草（炙）、枳実（破り、水に漬け、炙って乾かす）、柴胡、芍薬 各10分（翻刻確認）\n- 『金匱玉函経』巻第八・方薬炮製（四逆散方第一百三）：甘草（炙）、柴胡、芍薬、枳実（炙）各10分（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』：4味を各10分とり、搗いて篩い、白飲で方寸匕を和して服す。日に3回服す（翻刻確認）\n- 『金匱玉函経』：4味を散とし、白飲で方寸匕を服す。日に3回服す（翻刻確認）。方後の加減の字の違いは注記\n- 方後の加減：咳する者は五味子・乾姜 各5分を加え、あわせて下利を主る。悸する者は桂枝5分を加える。小便利せざる者は茯苓5分を加える。腹中痛む者は附子1枚を加え、炮じて坼かせる。泄利下重する者は、先に水5升で薤白3升を煮て3升を取り、滓を去り、散3方寸匕を湯の中に入れて煮て1升半を取り、分けて温めて2回に服す（翻刻確認）\n\n### 処方の変遷\n- 芍薬甘草湯（芍薬・甘草）に枳実・柴胡を加えた構成\n- 『千金翼方』巻第十・傷寒下・少陰病状第二にも、原典と同じ条が載る（要原本照合）\n- 原典は4味等量（各10分）。現行エキス剤（ツムラ35）は 柴胡5.0・芍薬4.0・枳実2.0・甘草1.5g（7.5g中。PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "柴胡・芍薬・枳実・甘草", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "木防已湯", "名前": "木防已湯", "読み": "もくぼういとう", "ツムラ番号": "36", "出典": "金匱要略（痰飲咳嗽病脈証并治第十二）", "別名": "", "本文": {"条文": "### 『金匱要略』痰飲咳嗽病脈証并治第十二（膈間支飲の条）\n\n**書き下し**（読み：社員案）\n膈間の支飲、其の人喘満し、心下痞堅し、面色黧黒にして、其の脈沈緊なり。之を得て数十日、医之を吐下して愈えざるは、木防己湯之を主る。虚する者は即ち愈ゆ。実する者は三日にして復た発す。後に与えて愈えざる者は、宜しく木防己湯去石膏加茯苓芒硝湯之を主るべし。\n\n**原文**（翻刻確認）\n膈間支飲，其人喘滿，心下痞堅，面色黧黑，其脈沉緊，得之數十日，醫吐下之不愈，木防己湯主之。虛者即愈，實者三日復發，後與不愈者，宜木防己湯去石膏加茯苓芒硝湯主之。\n\n**現代語訳**（訳：社員案）\n膈間に支飲があり、その人は喘いで胸が張り、心下がつかえて硬く、顔色は黒ずみ、脈は沈で緊である。発病して数十日、医者が吐法・下法を行っても治らないものは、木防己湯がこれを主治する。虚の者はすぐに治る。実の者は三日でまた再発する。その後に与えても治らない者には、木防己湯去石膏加茯苓芒硝湯で主治するのがよい。\n\n### 関連条文（支飲の定義・同篇の四飲の条）\n\n**書き下し**（読み：社員案）\n問うて曰く、四飲は何を以て異と為すや。師曰く、……咳逆倚息し、短気して臥すことを得ず、其の形腫るるが如きは、之を支飲と謂う。\n\n**原文**（翻刻確認）\n問曰：四飲何以為異？師曰：……咳逆倚息，短氣不得臥，其形如腫，謂之支飲。\n\n**現代語訳**（訳：社員案）\n問う。四つの飲はどのように違うのか。師が答える。……咳き込んで息が上がり、物に寄りかかって息をし、息切れして横になれず、体つきがむくんだように見えるものを、支飲という。\n\n### 注記\n- 方名・生薬名の「防己」は、維基文庫『金匱要略』の翻刻の字を本文に採った。四部叢刊本（明嘉靖俞橋刊本の影印）の翻刻では、条は「术防己湯」「术防巳湯去石膏加茯苓芒硝湯」、方は「术防巳湯方」「术防巳」と書かれる。簡体字の『金匱要略方論』の翻刻では条は「木防己」、方は「木防已」と書かれる（要原本照合）\n- 現行エキス剤の添付文書（ツムラ36）と資料は「木防已湯」「防已」と書く。方剤名と構成の生薬名は添付文書の字にそろえた\n- 「後與不愈者」は、四部叢刊本の翻刻では「復愈不愈者」、簡体字の『金匱要略方論』の翻刻では「复与不愈者」と書かれる（要原本照合）\n- 「醫吐下之」は、四部叢刊本の翻刻では「醫下之」（「吐」がない）と書かれる（要原本照合）\n- 「面色黧黑」は、四部叢刊本の翻刻では「面色墨黒」と書かれる（要原本照合）\n- 支飲の定義の条の「咳逆」「倚息」は、四部叢刊本の翻刻では「欬逆」「𠋣息」と書かれる（要原本照合）", "出典": "### 原典の構成\n木防己3両、石膏12枚（鶏子大）、桂枝2両、人参4両（翻刻確認。四部叢刊本と簡体字の『金匱要略方論』の翻刻による。維基文庫『金匱要略』の翻刻にはこの方が載らない）\n\n### 原典の服用法\n4味を水6升で煮て2升を取り、2回に分けて温服する（翻刻確認）\n\n### 処方の変遷\n- 同じ条の木防己湯去石膏加茯苓芒硝湯は、木防己2両、桂枝2両、人参4両、芒硝3合、茯苓4両の5味。水6升で煮て2升を取り、滓を去って芒硝を入れ、もう一度少し煎じて2回に分けて温服する。少し下痢すれば治る。四部叢刊本の翻刻では方名が「术防巳加茯苓芒硝湯方」と書かれ、「去石膏」の字がない（翻刻確認）\n- 『外台秘要方』巻二十には、同名異方の木防己湯が3首載る。風水方の深師の木防己湯（生姜・大棗・白朮・木防己・甘草・黄芪の6味。防已黄耆湯の項を参照）、水気方の「又」の木防己湯（木防己・甘草・桂心・茯苓・黄芪・生姜・白朮・芍薬の8味。腫患で水気を下し、四肢が腫れて聶聶と動くものを療す）、皮水方の深師の木防己湯（木防己・黄芪・桂心・茯苓・甘草の5味。皮水で水気が皮膚の中にあり、四肢が集集と動くものを療す）（翻刻確認。四庫全書本）\n- 現行エキス剤（ツムラ36）は7.5g中、石膏10.0g、防已4.0g、桂皮3.0g、人参3.0g の4味。原典の木防己は防已、桂枝は桂皮になっている（PMDA 添付文書 2023年12月改訂 第1版で確認）。添付文書に出典の欄はない", "構成": "石膏・防已・桂皮・人参", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "半夏白朮天麻湯", "名前": "半夏白朮天麻湯", "読み": "はんげびゃくじゅつてんまとう", "ツムラ番号": "37", "出典": "脾胃論（巻下・調理脾胃治験）", "別名": "", "本文": {"条文": "### 『脾胃論』巻下・調理脾胃治験\n\n**書き下し**（読み：社員案）\n范大諫の内、素より脾胃の証有り。時に煩躁を顕わし、胸中利せず、大便通ぜず。初冬に外に出でて晩に帰り、寒気の為に怫鬱し、悶乱大いに作る。火伸ぶるを得ざるが故なり。医、熱有るを疑い、治するに疎風丸を以てし、大便行けども病減ぜず。又、薬力の小なるを疑い、復た七八十丸を加え、下すこと両行、前証仍お減ぜず。復た吐逆を添え、食停むる能わず、痰唾稠粘、湧出して止まず、眼黒く頭旋り、悪心煩悶し、気短促して上喘し力無く、言うを欲せず。心神顛倒し、兀兀として止まず、目敢えて開かず、風雲の中に在るが如し。頭苦しみて裂くるが如く、身重きこと山の如く、四肢厥冷し、安臥するを得ず。余謂えらく、前証は乃ち胃気已に損じ、復た下すこと両次なれば、則ち重ねて其の胃を虚し、而して痰厥頭痛作る、と。半夏白朮天麻湯を製して之を主り、而して愈ゆ。\n\n**原文**（翻刻確認）\n范大諫之内、素有脾胃之證、時顯煩躁、胸中不利、大便不通。初冬出外而晩歸、為寒氣怫鬱、悶亂大作、火不得伸故也。醫疑有熱、治以疎風丸、大便行而病不減。又疑藥力小、復加七八十丸、下兩行、前證仍不減、復添吐逆、食不能停、痰唾稠粘、湧出不止、眼黑頭旋、惡心煩悶、氣短促上喘無力、不欲言、心神顛倒、兀兀不止、目不敢開、如在風雲中、頭苦如裂、身重如山、四肢厥冷、不得安臥。余謂前證乃胃氣已損、復下兩次、則重虛其胃、而痰厥頭痛作矣。製半夏白朮天麻湯主之而愈。\n\n**現代語訳**（訳：社員案）\n范大諫の妻は、もともと脾胃の病があった。ときに煩躁があらわれ、胸の中がすっきりせず、便が出なかった。初冬に外出して夜遅く帰り、寒気のために気がふさがって、もだえ苦しむことがひどくなった。体内の火がのびやかに発散できなかったためである。医者は熱があると疑って疎風丸で治療し、便は出たが病は軽くならなかった。さらに薬の力が弱いと疑って、また七八十丸を加えたところ、二度下したが、前の症状はなお軽くならなかった。そのうえ吐き気と嘔吐が加わって食べ物がおさまらず、痰や唾が粘って湧き出て止まらず、目の前が暗くなって頭がぐるぐる回り、むかむかしてもだえ、息が短くせわしく喘いで力がなく、話したがらなかった。心が乱れ、ぼうっとした状態がやまず、目をあけようとせず、風や雲の中にいるようであった。頭は裂けるように苦しく、体は山のように重く、手足は冷えきり、安らかに横になれなかった。私は、前の症状はすでに胃気が損なわれていたところへ二度も下したので、重ねて胃を虚させ、痰厥頭痛が起きたのだと考えた。半夏白朮天麻湯を作ってこれを治療し、治った。\n\n### 関連条文（同じ条の方後の文）\n\n**書き下し**（読み：社員案）\n此の頭痛苦しむこと甚だしきは、之を足の太陰の痰厥頭痛と謂う。半夏に非ざれば療すること能わず。眼黒く頭旋り、風虚内に作るは、天麻に非ざれば除くこと能わず。其の由（苗）を定風草と為す、独り風の為に動かされざればなり。黄耆は甘温、火を瀉し元気を補う。人参は甘温、火を瀉し中を補い気を益す。二朮は俱に甘苦温甘、湿を除き中を補い気を益す。沢・苓は小便を利し湿を□（導）く。橘皮は苦温、気を益し中を調え陽を升らす。麴は食を消し、胃中の滞気を苦（盪）かす。大麦糵麵は中を寛くし胃気を助く。乾姜は辛熱、以て中寒を滌う。黄蘖は苦大寒、酒洗して以て冬天の少火在泉の発躁を主るなり。\n\n**原文**（翻刻確認）\n此頭痛苦甚、謂之足太陰痰厥頭痛、非半夏不能療。眼黑頭旋、風虛内作、非天麻不能除。其由為定風草、獨不為風所動也。黄耆甘温、瀉火補元氣。人參甘温、瀉火補中益氣。二朮俱甘苦温甘、除濕補中益氣。澤苓利小便□濕。橘皮苦温、益氣調中升陽。麴消食、苦胃中滯氣。大麥糵麵寛中助胃氣。乾薑辛熱、以滌中寒。黄蘖苦大寒、酒洗以主冬天少火在泉發躁也。\n\n**現代語訳**（訳：社員案）\nこの頭痛がひどく苦しいものを、足の太陰の痰厥頭痛という。半夏でなければ治せない。目の前が暗くなって頭がぐるぐる回り、風虚が内に起こるものは、天麻でなければ除けない。その由（苗）は定風草といい、ただ一つ風に動かされないからである。黄耆は甘温で、火を瀉し元気を補う。人参は甘温で、火を瀉し中を補い気を益す。二朮（白朮・蒼朮）はともに甘苦温で、湿を除き中を補い気を益す。沢瀉・茯苓は小便を通じて湿を□（導）く。橘皮は苦温で、気を益し中を調え陽気を昇らせる。麴は食物を消化し、胃の中の滞った気を苦（盪）かす。大麦糵麵は中を寛げ胃の気を助ける。乾姜は辛熱で、中の寒えを洗い除く。黄蘖は苦大寒で、酒で洗って用い、冬に少火が在泉にあって躁を起こすものに対処する。\n\n### 注記\n- 本文は四庫全書本『脾胃論』巻下の翻刻の字を採った。別の翻刻（維基文庫「脾胃論/卷下」。句読点付きで、簡体字から機械的に直したとみられる字がある）とは、下の点で字が違う\n- 患者は、四庫全書本の翻刻では「范大諫之内」、別の翻刻では「范天之内」、資料の書き下しでは「范天騋の内」（要原本照合）\n- 「火不得伸」は、別の翻刻では「火不得升」。資料の書き下しは「火伸ぶるを得ざる」（要原本照合）\n- 「疎風丸」は、別の翻刻では「疏風丸」（要原本照合）\n- 「頭苦如裂」は、別の翻刻では「頭苦痛如裂」、資料の書き下しも「頭苦だ痛みて裂くるが如し」（要原本照合）\n- 「製半夏白朮天麻湯」の「製」は、別の翻刻では「制」（要原本照合）\n- 方後の文の「其由為定風草」の「由」は、別の翻刻では「苗」、資料の書き下しも「其の苗」（要原本照合）。書き下しは「由（苗）」とした\n- 方後の文の「二朮俱甘苦温甘」は、資料の書き下しでも「甘苦温甘」。別の翻刻では「二朮俱苦甘溫」（要原本照合）\n- 方後の文の「利小便□濕」の「□」は、四庫全書本の翻刻では表示できない字（外字）。別の翻刻では「導」、資料の書き下しでも「導く」（要原本照合）。書き下しは「□（導）」とした\n- 方後の文の「麴消食苦胃中滯氣」の「苦」は、別の翻刻では「盪」、資料の書き下しでも「盪かす」（要原本照合）。別の翻刻は「麴」を「曲」と書く\n- 方後の文の「大麥糵麵」は、別の翻刻では「大麥麵」（要原本照合）\n- 「黄蘖」は、別の翻刻では「黃櫱」（要原本照合）\n- 字体だけの違いは通行の字体に直した：四庫全書本の翻刻の「术」→「朮」、「胷」→「胸」、「卧」→「臥」、「㵼」→「瀉」、「隂」→「陰」", "出典": "### 原典の構成\n- 『脾胃論』：黄蘖 2分、乾姜 3分、天麻・蒼朮・白茯苓・黄耆・沢瀉・人参 各5分、白朮・炒麴 各1銭、半夏（湯で7回洗う）・大麦糵麵・橘皮 各1銭5分（翻刻確認）\n- 別の翻刻（維基文庫「脾胃論/卷下」）では、黄耆が「黃」の1字、大麦糵麵が「大麥麵」、炒麴が「炒曲」と書かれる。分量は同じ（要原本照合）\n\n### 原典の服用法\n- 『脾胃論』：㕮咀し、1回半両を水2盞で1盞まで煎じ、滓を去り、熱いうちに食前に服す（翻刻確認）\n\n### 処方の変遷\n- 『脾胃論』（李東垣）巻下の「調理脾胃治験」（治法用薬若不明升降浮沈差互反損論）の治験例の中に収載。13味を㕮咀して煎じる。原典には生姜は入っていない（翻刻確認）\n- 『東垣試効方』巻第五・頭痛門には、同じ治験の前に「丁未十月中」とあり、初めの治験の記載は淳祐七年（1247年）と分かるとされる。病名を「痰厥頭痛と曰う」と記し、最後に「再服して愈ゆ」とするとされる（要原本照合）\n- 『蘭室秘蔵』巻中・頭痛門には、『脾胃論』と同じ条文・薬味・方後の文で載り、最後に「食前の一服にして愈ゆ」とするとされる（要原本照合）\n- 『衛生宝鑑』巻九には半夏茯苓天麻湯の名で、原典と同じ薬味で載るとされる（要原本照合）\n- 『奇効良方』巻之二十五・眩暈門には、原典の13味から黄蘖を去り草果を加え、姜煎する方が載るとされる（要原本照合）\n- 『古今医鑑』巻之九・頭痛には白朮半夏天麻湯の名で、原典と同じ13味を生姜を入れて水煎する方が載るとされる（要原本照合）\n- 『医学心悟』巻三・頭痛の半夏白朮天麻湯は、半夏・白朮・天麻・陳皮・茯苓・甘草・生姜・大棗・蔓荊子の別の方とされる（要原本照合）\n- 現行エキス剤（ツムラ37）は 陳皮・半夏・白朮・茯苓・天麻・麦芽・黄耆・沢瀉・人参・黄柏・乾姜・生姜 の12味で、原典の蒼朮・炒麴は入らず、原典にない生姜が入る（PMDA 添付文書 2023年12月改訂 第1版で確認。出典の欄はない）", "構成": "陳皮・半夏・白朮・茯苓・天麻・麦芽・黄耆・沢瀉・人参・黄柏・乾姜・生姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "当帰四逆加呉茱萸生姜湯", "名前": "当帰四逆加呉茱萸生姜湯", "読み": "とうきしぎゃくかごしゅゆしょうきょうとう", "ツムラ番号": "38", "出典": "傷寒論（弁厥陰病脈証并治第十二）", "別名": "", "本文": {"条文": "### 『傷寒論』弁厥陰病脈証并治第十二\n\n**書き下し**（読み：社員案）\n若し其の人、内に久寒有る者は、当帰四逆加呉茱萸生姜湯に宜し。\n\n**原文**（翻刻確認）\n若其人內有久寒者、宜當歸四逆加吳茱萸生薑湯。\n\n**現代語訳**（訳：社員案）\nもしその人が、体の内に久しく続く寒（冷え）をもっている者には、当帰四逆加呉茱萸生姜湯がよい。\n\n### 関連条文（元の方の条）\n\n『傷寒論』弁厥陰病脈証并治第十二。本条の直前の当帰四逆湯の条で、本条はこれに続けて書かれる。\n\n**書き下し**（読み：社員案）\n手足厥寒し、脈細にして絶えんと欲する者は、当帰四逆湯之を主る。\n\n**原文**（翻刻確認）\n手足厥寒、脈細欲絕者、當歸四逆湯主之。\n\n**現代語訳**（訳：社員案）\n手足が冷え切り、脈が細くて絶えそうな者は、当帰四逆湯がこれを主治する。\n\n### 注記\n- 『金匱玉函経』では、当帰四逆湯の条は「脈為之細絕」、本条は「若其人內有久寒、當歸四逆加吳茱萸生薑湯主之」と書かれる（「者」がなく、「宜」ではなく「主之」）（要原本照合）。本文は宋本の字を採った\n- 原典の構成の大棗の注は、宋本の翻刻では「（孽）」と書かれる。同じ宋本の当帰四逆湯方は「（擘）」で、ほかの条の大棗もみな「擘」のため、原典の構成は「擘」とした（要原本照合）\n- 『金匱玉函経』では、甘草・通草が各3両、呉茱萸が2両で、9味を㕮咀して水4升・清酒4升で煮て3升を取り、1升を温服し日に3回とする（要原本照合）。宋本の方後の注「一方、水酒各四升」と水・酒の量が合う", "出典": "### 原典の構成\n- 『傷寒論』：当帰3両、芍薬3両、甘草2両（炙）、通草2両、大棗25枚（擘）、桂枝3両（去皮）、細辛3両、生姜半斤（切）、呉茱萸2升（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』：9味を水6升・清酒6升を合わせたもので煮て5升を取り、滓を去り、温めて5回に分けて服す（一方に、水・酒各4升）（翻刻確認）\n\n### 処方の変遷\n- 同じ篇の直前の当帰四逆湯（当帰・桂枝・芍薬・細辛・甘草・通草・大棗）に呉茱萸・生姜を加えた方（翻刻確認）。資料は、桂枝湯（桂皮・芍薬・甘草・生姜・大棗）に当帰・木通・細辛・呉茱萸を加えたものとも解釈できるとする\n- 当帰四逆湯は水8升で煮て3升を取り1升を日に3回服すが、本方は水6升・清酒6升で煮て5升を取り日に5回に分けて服す（翻刻確認）\n- 原典は木通ではなく通草。資料は『本草綱目』第十八巻下・草之七 蔓草類を引き、古の通草は今の木通で、今の通草は古の通脱木であり、五代の陳士良『食性本草』で改名されたとする（要原本照合）\n- 資料は『漢薬の臨床応用』を引き、木通はアケビ科・ウマノスズクサ科の木通などの木質茎、通草はウコギ科通脱木の茎の髄で、利尿作用は共通でも基源は全く異なるとする。ウマノスズクサ科木通（関木通、木通馬兜鈴）は日本では使用禁止とする（要確認）\n- 『備急千金要方』巻第二十 膀胱腑・霍乱第六の四逆湯（寒が多く手足厥冷して脈が絶えるものを主る方）は本方のことで、方後に、旧方は棗30枚を用いたが霍乱は多く痞するので除く、棗を退けたら葛根2両を入れる、霍乱して四逆すれば半夏1合・附子小1枚を加える、悪寒すれば大附子を与える、とあるとされる（要原本照合）\n- 『千金翼方』巻第十五 補益・五蔵気虚第五の当帰茱萸四逆湯方は、手足厥寒し脈が細絶し、その人に寒がある者を治し、原典の薬味・分量と比べて細辛が3両から2両になる以外は同じとされる（要原本照合）\n- 現行エキス剤（ツムラ38）は 大棗・桂皮・芍薬・当帰・木通・甘草・呉茱萸・細辛・生姜 の9味で、原典の通草に代わり木通が入る（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "大棗・桂皮・芍薬・当帰・木通・甘草・呉茱萸・細辛・生姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "苓桂朮甘湯", "名前": "苓桂朮甘湯", "読み": "りょうけいじゅつかんとう", "ツムラ番号": "39", "出典": "傷寒論（弁太陽病脈証并治中第六）／金匱要略（痰飲咳嗽病脈証并治第十二）", "別名": "", "本文": {"条文": "### 『傷寒論』弁太陽病脈証并治中第六\n\n**書き下し**（読み：社員案）\n傷寒、若しくは吐し、若しくは下して後、心下逆満し、気上りて胸を衝き、起くれば則ち頭眩し、脈沈緊なるに、汗を発すれば則ち経を動じ、身振振として揺るるを為す者は、茯苓桂枝白朮甘草湯之を主る。\n\n**原文**（翻刻確認）\n傷寒若吐若下後、心下逆滿、氣上衝胸、起則頭眩、脈沉緊、發汗則動經、身為振振搖者、茯苓桂枝白朮甘草湯主之。\n\n**現代語訳**（訳：社員案）\n傷寒で、吐かせたり下したりした後に、みぞおちがつかえて張り（心下逆満）、気が胸に突き上げ、起き上がるとめまいがし、脈が沈緊である。これに発汗させると経脈を動揺させ、身体がふらふらと揺れるようになる。このような者は、茯苓桂枝白朮甘草湯がこれを主治する。\n\n### 『金匱要略』痰飲咳嗽病脈証并治第十二\n\n**書き下し**（読み：社員案）\n心下に痰飲有り、胸脇支満し、目眩するは、苓桂朮甘湯之を主る。\n\n**原文**（翻刻確認）\n心下有痰飲、胸脅支滿、目眩。苓桂朮甘湯主之。\n\n**現代語訳**（訳：社員案）\nみぞおちに痰飲があり、胸から脇にかけてつかえて張り、目がくらむものは、苓桂朮甘湯がこれを主治する。\n\n**書き下し**（読み：社員案）\n夫れ短気して微飲有るは、当に小便より之を去るべし。苓桂朮甘湯之を主る（方は上に見ゆ）。腎気丸も亦た之を主る（方は脚気中に見ゆ）。\n\n**原文**（翻刻確認）\n夫短氣有微飲、當從小便去之、苓桂朮甘湯主之（方見上）。腎氣丸亦主之（方見腳氣中）。\n\n**現代語訳**（訳：社員案）\nそもそも息切れがして軽い水飲（微飲）があるものは、小便からこれを除くべきである。苓桂朮甘湯がこれを主治する（方は上の条に出ている）。腎気丸もまたこれを主治する（方は脚気の項に出ている）。\n\n### 注記\n- 条文の順：『傷寒論』『金匱要略』とも構成の生薬は茯苓・桂枝・白朮・甘草の4味で、現行エキス剤との一致・不一致で順を決められないため、資料の出典欄の順（『傷寒論』→『金匱要略』）に置いた（要確認）\n- 『傷寒論』の条は、宋本の翻刻と『注解傷寒論』の四庫全書本（書名『傷寒論注釋』）巻三で字が同じ（翻刻確認。脈／脉、沉／沈、胸／胷、朮／术 の字体の差のみ）。沉／沈は字体の違いで、書き下しは「沈」とした\n- 『傷寒論』の条は、『金匱玉函経』では「若吐、若下、若發汗後」と発汗後が加わり、「起即頭眩、其脈沉緊、發汗即動經、身為振振搖」と書かれて末尾の「者」がない（要原本照合）。本文は宋本の字を採った\n- 『金匱要略』の通行本の翻刻にはこの2条の方（構成・服用法）が載っていない（翻刻確認）。方は四部叢刊本『金匱要略方論』巻中と、維基文庫の『金匱要略方論』（簡体字の未校訂本）の翻刻による\n- 『金匱要略』1条目は、四部叢刊本の翻刻では「苓桂朮甘湯主之」が「用後方」で、続く方名が「茯桂甘白湯方」と書かれる（要原本照合）。本文は通行本の字を採った。脅／脇は字体の違い\n- 『金匱要略』2条目は、四部叢刊本の翻刻では「方見腳氣中」が「方見胸氣中」と書かれる（要原本照合）。本文は通行本の字を採った。微／㣲は字体の違い\n- 篇名は、資料では「弁太陽病脉証并治中第六」「痰飲欬嗽病脉証并治第十二」。翻刻は「辨太陽病脈證並治（中）第六」「痰飲咳嗽病脈證並治第十二」（翻刻確認）", "出典": "### 原典の構成\n- 『傷寒論』：茯苓4両、桂枝3両（皮を去る）、白朮2両、甘草2両（炙）（翻刻確認）\n- 『金匱要略方論』（四部叢刊本）：茯苓4両、桂枝3両、白朮3両、甘草2両（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』：4味を水6升で煮て3升を取り、滓を去り、3回に分けて温服する（翻刻確認）\n- 『金匱要略方論』（四部叢刊本）：4味を水6升で煮て3升を取り、3回に分けて温服する。方後に「小便則ち利す」とある（翻刻確認）\n\n### 処方の変遷\n- 『傷寒論』での方名は茯苓桂枝白朮甘草湯、『金匱要略』での方名は苓桂朮甘湯（翻刻確認）。資料は『金匱要略』では茯桂朮甘湯とも称するとする（要確認）\n- 白朮の分量は『傷寒論』が2両、『金匱要略』が3両で、分量で違うのはこの1点（翻刻確認）\n- 『金匱玉函経』の茯苓桂枝白朮甘草湯方は 茯苓4両、桂枝・白朮各3両、甘草2両で、方後に「小便即ち利す」とある（要原本照合）\n- 『備急千金要方』巻第九（傷寒上）発汗吐下後第九では茯苓湯の名で、発汗・吐下後の条に載り、巻第十八（大腸腑）痰飲第六では甘草湯の名で、心下の痰飲・胸脇支満・目眩の条に載る。いずれも茯苓4両・桂心・白朮各3両・甘草2両とされる（要原本照合）\n- 本方と四物湯の合方は連珠飲と呼ばれ、一般に『内科秘録』（本間棗軒）を出典とする（要原本照合）\n- 現行エキス剤（ツムラ39）は 茯苓6.0g・桂皮4.0g・蒼朮3.0g・甘草2.0g の4味（PMDA 添付文書 2023年12月改訂 第1版で確認）。原典の白朮に当たる生薬は蒼朮", "構成": "茯苓・桂皮・蒼朮・甘草", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "猪苓湯", "名前": "猪苓湯", "読み": "ちょれいとう", "ツムラ番号": "40", "出典": "傷寒論（弁陽明病脈証并治第八・弁少陰病脈証并治第十一）／金匱要略（消渇小便不利淋病脈証并治第十三）", "別名": "", "本文": {"条文": "### 『傷寒論』弁陽明病脈証并治第八\n\n**書き下し**（読み：社員案）\n若し脈浮、発熱し、渇して水を飲まんと欲し、小便利せざる者は、猪苓湯之を主る。\n\n**原文**（翻刻確認）\n若脈浮、發熱、渴欲飲水、小便不利者、猪苓湯主之。\n\n**現代語訳**（訳：社員案）\nもし脈が浮で、発熱し、口が渇いて水を飲みたがり、尿の出が悪いものは、猪苓湯がこれを主治する。\n\n### 『傷寒論』弁少陰病脈証并治第十一\n\n**書き下し**（読み：社員案）\n少陰病、下利すること六七日、咳して嘔渇し、心煩して眠るを得ざる者は、猪苓湯之を主る。\n\n**原文**（翻刻確認）\n少陰病、下利、六七日、咳而嘔渴、心煩不得眠者、猪苓湯主之。\n\n**現代語訳**（訳：社員案）\n少陰病で、下痢が六、七日続き、咳をして嘔吐し口が渇き、胸苦しくて眠れないものは、猪苓湯がこれを主治する。\n\n### 『金匱要略』消渇小便不利淋病脈証并治第十三\n\n**書き下し**（読み：社員案）\n脈浮、発熱し、渇して水を飲まんと欲し、小便利せざる者は、猪苓湯之を主る。\n\n**原文**（翻刻確認）\n脈浮發熱、渴欲飲水、小便不利者、猪苓湯主之。\n\n**現代語訳**（訳：社員案）\n脈が浮で、発熱し、口が渇いて水を飲みたがり、尿の出が悪いものは、猪苓湯がこれを主治する。\n\n### 関連条文（禁忌の例）\n\n『傷寒論』弁陽明病脈証并治第八。陽明病の出典の条の直後の条で、汗が多いときは猪苓湯を与えてはいけない例として資料が挙げる条。\n\n**書き下し**（読み：社員案）\n陽明病、汗出づること多くして渇する者は、猪苓湯を与うべからず。汗多くして胃中燥き、猪苓湯復た其の小便を利するを以ての故なり。\n\n**原文**（翻刻確認）\n陽明病、汗出多而渴者、不可與猪苓湯、以汗多胃中燥、猪苓湯復利其小便故也。\n\n**現代語訳**（訳：社員案）\n陽明病で、汗が多く出て口が渇くものには、猪苓湯を与えてはならない。汗が多くて胃の中が乾いているのに、猪苓湯がさらにその尿を出させるからである。\n\n### 注記\n- 「猪」は宋本・『金匱玉函経』の翻刻では「豬」と書かれる（字体の違い）。『金匱要略』の翻刻は条では「猪」、方名の行では「豬」\n- 陽明病の条は「若」で始まり、宋本では陽明病の梔子豉湯の条・白虎加人参湯の条に続く。『注解傷寒論』の四庫全書本（書名『傷寒論注釋』）巻五・『金匱玉函経』の字は宋本と同じ（翻刻確認）。『金匱玉函経』は弁発汗吐下後病の篇にも「若脈浮，發熱，渴欲飲水，小便不利，與豬苓湯」と重ねて載せる（要原本照合）\n- 少陰病の条は、『金匱玉函経』の字が宋本と同じ（翻刻確認）。『注解傷寒論』巻六とは照合していない（要原本照合）\n- 『金匱要略』の条は、宋本の陽明病の条と比べて冒頭の「若」がない（翻刻確認）\n- 『金匱要略』の篇名は、資料では「消渇小便利淋病脉証并治第十三」。維基文庫の翻刻の篇名「消渴小便不利淋病脈證並治第十三」を採った（要原本照合）\n- 禁忌の条の「復利」は、『金匱玉函経』の翻刻では「複利」と書かれる（要原本照合）。『傷寒論注釋』巻五は宋本と同じ（翻刻確認）\n- 『金匱要略』臓腑経絡先後病脈証第一にも「如渴者與豬苓湯」（渇する者には猪苓湯を与うるが如し）の句がある（翻刻確認）", "出典": "### 原典の構成\n- 『傷寒論』：猪苓（去皮）・茯苓・沢瀉・阿膠・滑石（砕）各1両（翻刻確認）\n- 『金匱要略』：猪苓（去皮）・茯苓・阿膠・滑石・沢瀉 各1両（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』：5味を水4升で、先に4味を煮て2升を取り、滓を去り、阿膠を入れて溶かし、7合を温服する。日に3回（翻刻確認）\n- 『金匱要略』：同じ（翻刻確認）。阿膠を溶かす字は、維基文庫の『金匱要略』の翻刻では「洋消」で意味が通らないため、宋本『傷寒論』の「烊消」を採った。翻刻の「洋」は誤りとみられる（要原本照合）\n\n### 処方の変遷\n- 『金匱要略』嘔吐噦下利病脈証并治第十七の猪苓散は猪苓・茯苓・白朮の3味で、本方とは別方。資料は、五苓散・四苓湯に近いとする。『傷寒論』に見える猪苓散の名は五苓散のこととする（要原本照合）\n- 『太平聖恵方』巻第十七・治熱病煩渇諸方の猪苓散は猪苓・赤茯苓・木通・滑石・沢瀉で、猪苓湯去阿膠加木通にあたる（要原本照合）\n- 『世医得効方』巻八・大方脈雑医科・諸淋・通治では、猪苓湯を五淋を治す方として原典の5味で載せる（要原本照合）\n- 『丹渓心法附余』巻之十一・火門・淋の葉氏治血淋方は阿膠・木猪苓・赤茯苓・滑石・沢瀉・車前子で、猪苓湯加車前子にあたる。『寿世保元』戊集巻之五・諸淋も補遺として血淋に猪苓湯加車前子を載せる（要原本照合）\n- 『温疫論』上巻・小便の猪苓湯は猪苓・沢瀉・滑石・甘草・木通・車前で、阿膠・茯苓を含まない別の構成（要原本照合）\n- 『証治摘要』巻上・淋は、恵美氏の方書の淋門にある猪苓湯加附子を冷淋に効くとして挙げる（要原本照合）\n- 現行の医療用エキス剤（ツムラ40）は 滑石・沢瀉・猪苓・茯苓・阿膠 各3.0g の5味で、原典と同じ生薬を等量で配合する（PMDA 添付文書 2023年12月改訂で確認）", "構成": "滑石・沢瀉・猪苓・茯苓・阿膠", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "補中益気湯", "名前": "補中益気湯", "読み": "ほちゅうえっきとう", "ツムラ番号": "41", "出典": "内外傷弁惑論（巻中・飲食労倦論）", "別名": "", "本文": {"条文": "### 『内外傷弁惑論』巻中・飲食労倦論\n\n**書き下し**（読み：社員案）\n古の至人は陰陽の造化を窮め、生死の際を究む。著す所の内経に悉く、人は胃気を以て本と為すと言う。蓋し人は水穀の気を受けて以て生く。所謂清気・栄気・衛気・春升の気は、皆胃気の別称なり。夫れ胃は水穀の海たり。飲食胃に入り、精気を游溢し、上りて脾に輸り、脾気精を散じ、上りて肺に帰し、水道を通調し、下りて膀胱に輸る。水精四もに布き、五経並び行き、四時・五臓の陰陽に合し、揆度して以て常と為すなり。苟も飲食節を失し、寒温適わざれば、則ち脾胃乃ち傷る。喜怒憂恐し、労役度に過ぐれば、元気を損耗す。既に脾胃虚衰し、元気不足すれば、心火独り盛んなり。心火は陰火なり。下焦に起こり、其の系は心に繋がる。心令を主らざれば、相火之に代わる。相火は下焦包絡の火にして、元気の賊なり。火と元気とは両立する能わず、一勝てば則ち一負く。脾胃既に虚すれば、則ち腎肝に下流し、陰火以て其の土位に乗ずるを得。故に脾胃の証、始めて之を得れば、則ち気高くして喘し、身熱して煩し、其の脈洪大にして頭痛し、或いは渇して止まず、皮膚風寒に任えずして寒熱を生ず。蓋し陰火上衝すれば、則ち気高くして喘し、身煩熱し、頭痛を為し、渇を為して、脈洪大なり。脾胃の気下流し、穀気をして升浮するを得ざらしむれば、是れ生長の令行われず、則ち陽の以て其の栄衛を護る無く、風寒に任えず、乃ち寒熱を生ず。皆脾胃の気の不足の致す所なり。然り而して外感風寒にて得る所の証と頗る同じくして理異なる。内に脾胃を傷るは乃ち其の気を傷り、外に風寒に感ずるは乃ち其の形を傷る。外を傷るを有余と為し、有余なる者は之を瀉す。内を傷るを不足と為し、不足なる者は之を補う。之を汗し、之を下し、之を吐し、之を剋するは、皆瀉なり。之を温め、之を和し、之を調え、之を養うは、皆補なり。内傷不足の病、苟も誤認して外感有余の病と作し、反って之を瀉せば、則ち其の虚を虚するなり。難経に云う、実を実し虚を虚し、不足を損じて有余を益す、此くの如くして死する者は、医之を殺すのみと。然らば則ち奈何せん。曰く、惟だ当に□（甘）温の剤を以て其の中を補い、其の陽を升らせ、□（甘）寒以て其の火を瀉すべし、則ち愈ゆ。内経に曰く、労する者は之を温め、損する者は之を温むと。蓋し温は能く大熱を除く。大いに苦寒の薬にて胃土を瀉するを忌むのみ。今、補中益気湯を立つ。\n\n**原文**（翻刻確認）\n古之至人窮陰陽之造化、究乎生死之際、所著内經悉言人以胃氣為本。蓋人受水穀之氣以生、所謂清氣・榮氣・衛氣・春升之氣、皆胃氣之別稱也。夫胃為水穀之海、飲食入胃、游溢精氣、上輸於脾、脾氣散精、上歸於肺、通調水道、下輸膀胱、水精四布、五經並行、合於四時五臟陰陽、揆度以為常也。苟飲食失節、寒温不適、則脾胃乃傷。喜怒憂恐、勞役過度、而損耗元氣。既脾胃虛衰、元氣不足、而心火獨盛。心火者陰火也、起於下焦、其系繫於心、心不主令、相火代之。相火下焦包絡之火、元氣之賊也。火與元氣不能兩立、一勝則一負。脾胃既虛、則下流於腎肝、陰火得以乘其土位。故脾胃之證、始得之則氣高而喘、身熱而煩、其脈洪大而頭痛、或渴不止、皮膚不任風寒而生寒熱。蓋陰火上衝、則氣高而喘、身煩熱、為頭痛、為渴、而脈洪大。脾胃之氣下流、使穀氣不得升浮、是生長之令不行、則無陽以護其榮衛、不任風寒、乃生寒熱、皆脾胃之氣不足所致也。然而與外感風寒所得之證頗同而理異。内傷脾胃乃傷其氣、外感風寒乃傷其形。傷外為有餘、有餘者瀉之、傷内為不足、不足者補之。汗之下之吐之剋之、皆瀉也。温之和之調之養之、皆補也。内傷不足之病、苟誤認作外感有餘之病而反瀉之、則虛其虛也。難經云、實實虛虛、損不足而益有餘、如此死者、醫殺之耳。然則奈何。曰、惟當以□温之劑補其中、升其陽、□寒以瀉其火則愈。内經曰、勞者温之、損者温之。蓋温能除大熱、大忌苦寒之藥瀉胃土耳。今立補中益氣湯。\n\n**現代語訳**（訳：社員案）\n昔の至人は陰陽の造化をきわめ、生と死の境を究めた。その著した内経には、人は胃気を根本とすると、ことごとく述べている。思うに人は水穀（飲食物）の気を受けて生きている。いわゆる清気・栄気・衛気・春に昇る気は、みな胃気の別名である。そもそも胃は水穀の海である。飲食物が胃に入ると、精気があふれ出て上って脾に送られ、脾気が精を散らして上って肺に帰り、水の通り道を整えて下って膀胱に送られる。水の精が四方にゆきわたり、五経がそろってめぐり、四季と五臓の陰陽に合い、これを推し量って常態とする。もし飲食の節度を失い、寒さ暖かさが体に合わなければ、脾胃は傷つく。喜び・怒り・憂い・恐れがあり、労役が度を越せば、元気をすり減らす。脾胃が虚して衰え、元気が足りなくなると、心火だけが盛んになる。心火は陰火である。下焦に起こり、その系統は心につながる。心が主導しなければ、相火がこれに代わる。相火は下焦の包絡の火で、元気をそこなう賊である。火と元気は両立できず、一方が勝てば他方が負ける。脾胃が虚すると、気は腎肝へ下に流れ、陰火がその土（脾胃）の位置に乗じることになる。そのため脾胃の病は、かかり始めには、気が上がって喘ぎ、体が熱して煩わしく、脈は洪大で頭痛がし、あるいは口の渇きが止まらず、皮膚が風や寒さに耐えられずに寒けと熱が出る。思うに陰火が上に突き上げると、気が上がって喘ぎ、体が熱っぽく煩わしく、頭痛を起こし、渇きを起こし、脈が洪大になる。脾胃の気が下に流れ、穀気が昇り浮かべないようにすると、生長の働きが行われず、陽気がその栄衛を守ることがなくなり、風や寒さに耐えられず、寒けと熱が出る。これらはみな脾胃の気の不足によるものである。しかし、外から風寒を受けて起こる病と症状はよく似ているが、道理は異なる。内に脾胃を傷るのはその気を傷るのであり、外から風寒を受けるのはその形を傷るのである。外を傷るのは有余であり、有余のものは瀉す。内を傷るのは不足であり、不足のものは補う。発汗させ、下し、吐かせ、攻めるのはみな瀉法である。温め、和らげ、調え、養うのはみな補法である。内傷による不足の病を、もし外感による有余の病と誤認して、かえって瀉すならば、虚しているものをさらに虚させることになる。難経に「実しているものをさらに実させ、虚しているものをさらに虚させ、不足しているものを損じて有余のものを益す。このようにして死ぬ者は、医者が殺したのである」とある。それではどうすればよいか。答えて、ただ□（甘）温の剤でその中（脾胃）を補い、その陽気を昇らせ、□（甘）寒の薬でその火を瀉すべきであり、そうすれば治る。内経に「疲労した者はこれを温め、損なわれた者はこれを温める」とある。思うに温はよく大熱を除く。苦寒の薬で胃土を瀉すことは大いに避けなければならない。そこで今、補中益気湯を立てる。\n\n### 注記\n- 本文は四庫全書本『内外傷寒辨惑論』（巻頭の題は「内外傷辯惑論」）巻中の翻刻の字を採った。別の翻刻（維基文庫「內外傷辨惑論/卷中」。句読点付きの未校訂本）とは、下の点で字が違う\n- 「窮陰陽之造化」は、別の翻刻では「窮於陰陽之化」（要原本照合）\n- 「下焦包絡之火」の「包絡」は、別の翻刻では「胞絡」（要原本照合）\n- 「脾胃既虛、則下流於腎肝」は、別の翻刻では「脾胃氣虛，則下流於腎」（要原本照合）\n- 「惟當以□温之劑」「□寒以瀉其火」の「□」は、四庫全書本の翻刻では表示できない字（外字）。同じ外字が「炙□草」のように甘草の「甘」の位置にも使われている。別の翻刻では「甘溫」「甘寒」（要原本照合）。書き下し・現代語訳は「□（甘）」とした\n- 字体だけの違いは通行の字体に直した：四庫全書本の翻刻の「隂」→「陰」、「盖」→「蓋」、「逰」→「游」、「臓」→「臟」、「茍」→「苟」、「髙」→「高」、「渇」→「渴」、「脉」→「脈」、「尅」→「剋」（別の翻刻では「克」）、「柰」→「奈」、「乗」→「乘」、「别」→「別」、「虚」→「虛」", "出典": "### 原典の構成\n- 『内外傷弁惑論』巻中：黄耆 5分（労役して病熱が甚だしい者は1銭）、甘草（炙）5分、人参（去蘆）・升麻・柴胡・橘皮・当帰身（酒洗）・白朮 各3分（翻刻確認）\n- 黄耆の「労役して病熱が甚だしい者」の量は、四庫全書本の翻刻では「二錢」（2銭）と書かれる（要原本照合）。本文は、別の翻刻（句読点付きの未校訂本）と『脾胃論』巻中の同じ方の記載に一致する1銭を採った\n\n### 原典の服用法\n- 『内外傷弁惑論』巻中：㕮咀し、すべて1服とし、水2盞で1盞まで煎じ、滓を去り、朝食の後に温服する。傷が重い者は2服で治る。軽重を量って治す（翻刻確認）\n\n### 処方の変遷\n- 『内外傷弁惑論』（元・李杲）巻中・飲食労倦論に、内傷の病を外感の病と誤って瀉すことを戒め、甘温の剤で中を補い陽を升らせるとして立てられた方（翻刻確認）\n- 方の後の「立方本指」に「胃中清氣在下、必加升麻柴胡以引之」とあり、升麻・柴胡で清気を引き上げるとする（翻刻確認）\n- 原典には生姜・大棗の指示はない（翻刻確認）\n- 同じ巻の「四時用藥加減法」に、時節や症状に応じた補中益気湯の加減法が続く（翻刻確認）\n- 『脾胃論』（李杲）巻中・飲食労倦所傷始為熱中論にも収載される。黄耆5分（病が甚だしく労役して熱する者は1銭）、甘草（炙）5分、人参3分（咳があれば去る）、当帰身3分、橘皮・升麻・柴胡 各2分または3分、白朮3分で、食から離れた時に少し熱くして服す（翻刻確認。書名・巻の欄のない句読点付きの翻刻による）\n- 『衛生宝鑑』補遺では、升麻・柴胡が各2分とされる（要原本照合）\n- 現行エキス剤（ツムラ41）は 黄耆・蒼朮・人参・当帰・柴胡・大棗・陳皮・甘草・升麻・生姜 の10味で、原典の白朮に代わって蒼朮が入り、原典にない大棗・生姜が入る（PMDA 添付文書 2023年12月改訂 第1版で確認。出典の欄はない）", "構成": "黄耆・蒼朮・人参・当帰・柴胡・大棗・陳皮・甘草・升麻・生姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "六君子湯", "名前": "六君子湯", "読み": "りっくんしとう", "ツムラ番号": "43", "出典": "永類鈐方（巻第九・和剤局集要方上・脾胃）／世医得効方（巻第五・大方脈雑医科・脾胃）", "別名": "", "本文": {"条文": "### 『永類鈐方』巻第九・和剤局集要方上・脾胃\n\n**書き下し**（要原本照合）\n\n**原文**（要原本照合）\n\n**現代語訳**\n\n### 『世医得効方』巻第五・大方脈雑医科・脾胃\n\n**書き下し**（読み：社員案）\n四君子湯、脾胃調わず、飲食を思わざるを治す。……一方に橘紅を加え、異功散と名づく。又方に陳皮・半夏を加え、六君子湯と名づく。\n\n**原文**（翻刻確認）\n四君子湯治脾胃不調不思飲食。……一方加橘紅名異功散。又方加陳皮半夏名六君子湯。\n\n**現代語訳**（訳：社員案）\n四君子湯は、脾胃の調子が整わず、飲食を欲しないものを治す。……ある方では橘紅を加えて異功散と名づける。また別の方では陳皮・半夏を加えて六君子湯と名づける。\n\n### 注記\n- 『永類鈐方』は維基文庫に翻刻が見当たらない（2026-10-23）。資料には書き下しの引用だけで原文（漢文）の引用がないので、原文・書き下し・現代語訳は翻刻待ち。資料は、条文は『世医得効方』と同じで、異なるのは『世医得効方』の「白茯苓」が「茯苓」である点だけとする（要原本照合）\n- 『世医得効方』の原文は四庫全書本の翻刻（旧字体・句読なし）。本文は新字体にし、句点を補った。「……」は四君子湯の構成と服用法の部分を略した箇所\n- 『世医得効方』の方後は、六君子湯の句の後に「嘔吐には藿香・縮砂を加え、泄瀉には木香・肉豆蔲を加う」と続く（翻刻確認）", "出典": "### 原典の構成\n- 『永類鈐方』（巻第九）：四君子湯（人参・甘草・茯苓・白朮 各等分）に陳皮・半夏を加える。陳皮・半夏の分量の記載は資料にない（要原本照合）\n- 『世医得効方』（巻第五）：四君子湯（人参（蘆を去る）・甘草（炙）・白茯苓（皮を去る）・白朮（蘆を去る）各等分）に陳皮・半夏を加える。陳皮・半夏の分量の記載はない（翻刻確認）\n\n### 原典の服用法\n- 『永類鈐方』（巻第九）：資料の記載は「㕮咀して水洗」（要原本照合）\n- 『世医得効方』（巻第五）：剉散とし、1回3銭を水1盞で7分まで煎じ、時に拘わらず服す。四君子湯の服用法で、六君子湯としての別の指示はない（翻刻確認）\n\n### 処方の変遷\n- 資料の出典欄は『聖済総録』、（『備全古今十便良方』）、『永類鈐方』。資料は、本方の出典は『和剤局方』『医学正伝』『校註婦人良方』『万病回春』などとよく誤記されるとする（要確認）\n- 資料は、『和剤局方』には巻之三に四君子湯、巻之四に二陳湯があるが、六君子湯は収載されておらず、『和剤局方指南総論』にもないとする（要確認）\n- 『聖済総録』巻第十九・諸痺門・脾痺の大半夏湯は、脾痺で四肢が怠惰し咳を発するものを治す。半夏5両、白朮・白茯苓・人参・甘草（炙）・附子（炮）・陳橘皮 各2両、桂3両の8味を剉み、1回5銭匕を水1盞半・生姜5片で煎じて温服する（翻刻確認）。資料はこれを六君子湯加附子・桂とする\n- 資料は、さらに遡って『外台秘要方』第十六巻・虚労上・肉極寒方に『删繁方』を引いた同名同方の大半夏湯（姜煎の指示なし）が、『小品方』第一巻に半夏橘皮湯（六君子湯加桂肉・細辛）があるとする（要原本照合）\n- 『楊氏家蔵方』巻之六・脾胃方（翻刻では「卷第六 脾胃方六十一道」）の六君子湯は、胸膈が痞塞し、脾が冷えて食を好まず、燥薬を服せない者を治す。枳殻（麩炒）・陳橘皮・人参・白朮・白茯苓・半夏 各等分を粗末とし、1回5銭を水2盞・生姜5片で煎じて温服する（翻刻確認）。同名だが甘草がなく枳殻が入り、現行エキス剤と構成が違う。資料は、これを『世医得効方』より前に文献上見える六君子湯の名とし（要確認）、『備全古今十便良方』巻第十四に同一の条文と薬味が載り、小字注に《楊氏方》とあるとする（要原本照合）\n- 『厳氏済生方』の六君子湯は、脾臓和せず、飲食進まず、上燥下寒で熱薬を服せない者を治し、人参・白朮・橘紅・半夏・枳殻・甘草を用いる（翻刻確認。資料は巻之七・脾胃虚実論治とし、六君子湯去茯苓加枳殻とする）\n- 資料は、『普済方』巻二十二・脾臓門・兼理脾胃の六君子湯（十便良方に出づと注し、甘草・陳橘皮・白朮・人参・白茯苓・半夏 各等分を粗末とし生姜で煎服）は、『十便良方』と枳殻・甘草の一味だけが違い、『十便良方』に由来するか朱橚による改変かは否定できないとする（要原本照合）\n- 資料は、『永類鈐方』巻第十一・諸名医雑病集験方・脾胃の六君子湯（人参・白朮・陳皮・半夏・枳殻・甘草を㕮咀し姜棗で水煎）は巻第九の六君子湯と同名異方とする（要原本照合）\n- 資料は、『世医得効方』は至元三年（1337）成書・至正五年（1345）刊行、『永類鈐方』は至順二年（1331）成書・刊行とする（要確認）\n- 現行エキス剤（ツムラ43）は 蒼朮4.0・人参4.0・半夏4.0・茯苓4.0・大棗2.0・陳皮2.0・甘草1.0・生姜0.5g（7.5g中。PMDA 添付文書 2023年12月改訂 第1版で確認）。原典の白朮の代わりに蒼朮が入り、大棗・生姜が加わる", "構成": "蒼朮・人参・半夏・茯苓・大棗・陳皮・甘草・生姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "桂枝湯", "名前": "桂枝湯", "読み": "けいしとう", "ツムラ番号": "45", "出典": "傷寒論（巻第二・弁太陽病脈証并治上第五）／金匱要略（婦人産後病脈証并治第二十一・婦人妊娠病脈証并治第二十）／備急千金要方（巻第九 傷寒上・発汗湯第五）／太平恵民和剤局方（巻之二・傷寒 附 中暑）", "別名": "", "本文": {"条文": "### 『傷寒論』巻第二・弁太陽病脈証并治上第五\n\n**書き下し**（読み：社員案）（1条目：太陽中風）\n太陽の中風、陽浮にして陰弱、陽浮なる者は熱自ずから発し、陰弱なる者は汗自ずから出づ。嗇嗇として悪寒し、淅淅として悪風し、翕翕として発熱し、鼻鳴り乾嘔する者は、桂枝湯之を主る。\n\n**原文**（翻刻確認）\n太陽中風，陽浮而陰弱，陽浮者，熱自發，陰弱者，汗自出。嗇嗇惡寒，淅淅惡風，翕翕發熱，鼻鳴乾嘔者，桂枝湯主之。\n\n**現代語訳**（訳：社員案）\n太陽病の中風で、陽が浮き陰が弱い。陽が浮くものは熱がひとりでに出て、陰が弱いものは汗がひとりでに出る。嗇嗇と寒けがし、淅淅と風を嫌い、翕翕と熱が出て、鼻が鳴り、からえずきするものは、桂枝湯が主治する。\n\n**書き下し**（読み：社員案）（2条目：頭痛・発熱・汗出・悪風。1条目の方の後に続く）\n太陽病、頭痛、発熱、汗出で、悪風するは、桂枝湯之を主る。\n\n**原文**（翻刻確認）\n太陽病，頭痛，發熱，汗出，惡風，桂枝湯主之。\n\n**現代語訳**（訳：社員案）\n太陽病で、頭痛と発熱があり、汗が出て、風を嫌うものは、桂枝湯が主治する。\n\n### 『金匱要略』婦人産後病脈証并治第二十一（陽旦湯）\n\n**書き下し**（読み：社員案）\n産後の風、之に続くこと数十日解せず、頭微しく痛み、悪寒し、時時熱有り、心下悶え、乾嘔し、汗出づ。久しと雖も、陽旦の証続きて在るのみ。陽旦湯を与うべし。（即ち桂枝湯なり。方は下利の中に見ゆ）\n\n**原文**（翻刻確認）\n產後風，續之數十日不解，頭微痛，惡寒，時時有熱，心下悶，乾嘔，汗出，雖久，陽旦證續在耳，可與陽旦湯。（即桂枝湯，方見下利中。）\n\n**現代語訳**（訳：社員案）\n産後の風邪が数十日続いて治らず、頭が少し痛み、寒けがし、ときどき熱があり、みぞおちがもだえ苦しく、からえずきし、汗が出る。長引いていても、陽旦の証が続いているだけである。陽旦湯を与えてよい。（陽旦湯とは桂枝湯のことで、方は下利の篇に載る）\n\n### 『金匱要略』婦人妊娠病脈証并治第二十\n\n**書き下し**（読み：社員案）\n師曰く、婦人平脈を得、陰脈小弱、其の人渇して食すること能わず、寒熱無きは、妊娠と名づく。桂枝湯之を主る。（方は下利の中に見ゆ）\n\n**原文**（翻刻確認）\n師曰：婦人得平脈，陰脈小弱，其人渴，不能食，無寒熱，名妊娠，桂枝湯主之。（方見下利中）\n\n**現代語訳**（訳：社員案）\n師が言う。婦人の脈が平常で、陰の脈がやや弱く、その人がのどが渇いて食べられず、悪寒も発熱もないものは、妊娠という。桂枝湯が主治する。（方は下利の篇に載る）\n\n### 『備急千金要方』巻第九 傷寒上・発汗湯第五\n\n**書き下し**（読み：社員案）\n中風、其の脈陽浮にして陰弱、陽浮なる者は熱自ずから発し、陰弱なる者は汗自ずから出づ。渋渋として悪風し、淅淅として悪寒し、翕翕として発熱し、鼻鳴り乾嘔するを治する方。\n\n**原文**（翻刻確認）\n治中風其脈陽浮而陰弱，陽浮者熱自發，陰弱者汗自出。澀澀惡風，淅淅惡寒，翕翕發熱，鼻鳴乾嘔方。\n\n**現代語訳**（訳：社員案）\n中風で、その脈が陽で浮き陰で弱く、陽が浮くものは熱がひとりでに出て、陰が弱いものは汗がひとりでに出る。渋渋と風を嫌い、淅淅と寒けがし、翕翕と熱が出て、鼻が鳴り、からえずきするものを治す方。\n\n### 『太平恵民和剤局方』巻之二・傷寒 附 中暑\n\n**書き下し**（読み：社員案）\n桂枝湯、太陽の中風、陽浮にして陰弱、陽浮なる者は熱自ずから発し、陰弱なる者は汗自ずから出で、嗇嗇として悪寒し、洒洒として悪風し、翕翕として発熱し、鼻塞がり乾嘔するを治す。\n\n**原文**（翻刻確認）\n桂枝湯治太陽中風陽浮而陰弱陽浮者熱自發陰弱者汗自出嗇嗇惡寒洒洒惡風翕翕發熱鼻塞乾嘔\n\n**現代語訳**（訳：社員案）\n桂枝湯は、太陽病の中風で、陽が浮き陰が弱く、陽が浮くものは熱がひとりでに出て、陰が弱いものは汗がひとりでに出て、嗇嗇と寒けがし、洒洒と風を嫌い、翕翕と熱が出て、鼻がつまり、からえずきするものを治す。\n\n### 関連条文（禁忌）\n\n『傷寒論』巻第二・弁太陽病脈証并治上第五。桂枝湯を与えてはいけない例として、資料が『傷寒尚論篇』の引用で挙げる3条。\n\n**書き下し**（読み：社員案）（解肌の薬であること）\n桂枝は本解肌を為す。若し其の人脈浮緊、発熱して汗出でざる者は、之を与うべからざるなり。常に須らく此を識り、誤らしむること勿かるべし。\n\n**原文**（翻刻確認）\n桂枝本為解肌，若其人脈浮緊，發熱汗不出者，不可與之也，常須識此，勿令誤也。\n\n**現代語訳**（訳：社員案）\n桂枝湯はもともと肌を解く薬である。もしその人の脈が浮緊で、発熱して汗が出ないものには、与えてはならない。常にこのことを心得て、誤らせてはならない。\n\n**書き下し**（読み：社員案）（酒客）\n若し酒客病めば、桂枝湯を与うべからず。之を得れば則ち嘔す。酒客は甘きを喜ばざるを以っての故なり。\n\n**原文**（翻刻確認）\n若酒客病，不可與桂枝湯，得之則嘔，以酒客不喜甘故也。\n\n**現代語訳**（訳：社員案）\n酒飲みが病んだときは、桂枝湯を与えてはならない。飲めば吐く。酒飲みは甘いものを好まないからである。\n\n**書き下し**（読み：社員案）（服して吐く者）\n凡そ桂枝湯を服して吐する者は、其の後必ず膿血を吐するなり。\n\n**原文**（翻刻確認）\n凡服桂枝湯吐者，其後必吐膿血也。\n\n**現代語訳**（訳：社員案）\nおよそ桂枝湯を飲んで吐くものは、その後に必ず膿血を吐く。\n\n### 注記\n- 資料のルビ：淅淅は「セキセキ」、翕翕は「キュウキュウ」、漐漐は「チュウチュウ」。嗇嗇のルビは小さくて読めない（要確認）\n- 禁忌の1条目は、宋本の翻刻では「太陽病三日，已發汗，若吐、若下、若溫針，仍不解者，此為壞病，桂枝不中與之也。觀其脈證，知犯何逆，隨證治之。」に続く同じ条の後半（翻刻確認）\n- 宋本の翻刻の並びは、解肌の条 → 酒客の条 → 喘家の条 → 服して吐く者の条。資料が引く『傷寒尚論篇』は、解肌 → 服して吐く者 → 酒客の順で、字句にも多少の違いがあるとされる（要原本照合）\n- 『備急千金要方』の条は、『傷寒論』1条目と比べて、冒頭に「太陽」がなく、「陽浮」の上に「其脈」の2字があり、悪風・悪寒が逆になっている（翻刻確認）\n- 『備急千金要方』の「澀澀」は、資料では「濇濇」と書かれる（要原本照合）。書き下しは新字体の「渋渋」にした\n- 『備急千金要方』の篇名は、翻刻では巻の題が「第九 傷寒方上」、篇の題が「發汗湯第五」。資料は「巻第九 傷寒上・発汗湯第五」と書く（翻刻確認）\n- 『備急千金要方』は資料の出典欄にないが、同名・同構成の方なので条文の欄に置いた（院長の基準、2026-10-23）\n- 『和剤局方』の翻刻（四庫全書本）は「陰」を「隂」と書く。字体だけの違い（要原本照合）\n- 『和剤局方』の条は、『傷寒論』1条目の「淅淅惡風」を「洒洒惡風」、「鼻鳴」を「鼻塞」と書く（翻刻確認）\n- 『和剤局方』の方は、挙がる生薬は甘草・桂枝・芍薬の3味で、生姜・棗は煎じるときに加えると書かれる。煎じるときに加える生薬も構成に数え、同名・同構成の方として条文の欄に置いた（取りまとめ側の当てはめ方、2026-10-23）。資料の出典欄にはない\n- 婦人妊娠の条は、翻刻では「於法六十日當有此證；設有醫治逆者，卻一月加吐下者，則絕之。」と続く（翻刻確認）。資料は「桂枝湯之を主る」までを引く\n- 『金匱要略』の四部叢刊本の翻刻は、婦人産後の条の「雖久」を「雖又」、「名妊娠」を「名姙娠」と書き、婦人妊娠の条の小字注を「方見利中」と書く（要原本照合）。本文は通行本の翻刻の字を採った\n- 『金匱要略』の桂枝湯方は、嘔吐噦下利病脈証并治第十七の「下利腹脹滿，身體疼痛者，先溫其裏，乃攻其表。溫裏宜四逆湯，攻表宜桂枝湯。」の条に付く（翻刻確認）。維基文庫の通行本の翻刻には方の本文がなく、四部叢刊本の翻刻（巻中）で確かめた\n- 四部叢刊本『金匱要略』の翻刻では甘草が「三两炙」（要原本照合）。原典の構成は、『傷寒論』と添付文書の比率に合う2両を採った\n- 四部叢刊本『金匱要略』の服用法は、「右五味㕮咀」（宋本『傷寒論』は「㕮咀三味」）、「啜稀粥」（宋本は「啜熱稀粥」）、「如水淋漓」（宋本は「如水流漓」）と書かれ、漐漐は熱の異体字（U+24360）を重ねた字で書かれる。「一服汗出病差停後服」までで、その後の服し方と禁忌の句はない（要原本照合）", "出典": "### 原典の構成\n- 『傷寒論』（宋本）：桂枝3両（去皮）、芍薬3両、甘草2両（炙）、生姜3両（切）、大棗12枚（擘）（翻刻確認）\n- 『金匱要略』（嘔吐噦下利病篇）：桂枝3両（去皮）、芍薬3両、甘草2両（炙）、生姜3両、大棗12枚（要原本照合。四部叢刊本の翻刻では甘草3両。注記）\n- 『備急千金要方』：桂枝・芍薬・生姜 各3両、甘草2両、大棗12枚（翻刻確認）\n- 『和剤局方』：甘草1両、桂枝（去皮）・芍薬 各3両。煎じるときに生姜3片・棗3枚を加える（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』（宋本）：5味のうち3味を刻み、水7升で微火で煮て3升を取り、滓を去り、冷めすぎず熱すぎない温度で1升を服す。服し終えてしばらくして熱い薄粥を1升余りすすり、薬力を助ける。衣をかけて温め、2時間ほど全身がしっとりと微かに汗ばむようにするのがよく、水が流れ滴るほど汗をかかせてはならない（それでは病は除かれない）。1服で汗が出て病が治れば、残りは服さない。汗が出なければ同じ方法でまた服し、それでも出なければ間隔を少し詰めて、半日ほどで3服を飲み尽くす。病が重ければ昼夜通して服し、一昼夜様子を見て、1剤を飲み尽くしても病証が残れば、また作って服す。汗が出なければ2〜3剤まで服す。生もの・冷たいもの、粘りけやぬめりのあるもの、肉・麺、五辛、酒・乳製品、においの悪いものなどを禁ず（翻刻確認）\n- 『金匱要略』：5味を刻み、水7升で微火で煮て3升を取り、滓を去り、ほどよい温度で1升を服す。服し終えたら薄粥1升をすすって薬力を助ける。衣をかけて温め、2時間ほど全身がしっとりと微かに汗ばむようにするのがよく、水が滴るほど汗をかかせてはならない。1服で汗が出て病が治れば、残りは服さない（要原本照合。四部叢刊本の翻刻による。宋本『傷寒論』との違いは注記）\n- 『備急千金要方』：5味のうち3味を刻み、生姜を切り、棗を擘く。水7升で棗を煮て爛れさせ、滓を去り、諸薬を入れ、水が少なければ足して微かに沸かし、3升を得て滓を去る。1升を服し、日に3回。小児は加減する。初めの服で多く汗が出れば間隔を少しあけ、汗が出なければ間隔を少し詰めて薬の勢いを続かせ、汗を出させる。法のとおりに養生し、とくに風を避ける。病が重ければ夜も服す。1剤で治らず病証が変わらなければまた服す。汗が出にくい者は2〜3剤を服して治る。服して食事ほどの間に熱粥を飲み、薬力を助ける（翻刻確認。「刻み」に当たる字は翻刻では「咀」の1字で、前の1字が欠ける。要原本照合）\n- 『和剤局方』：粗末とし、1回2銭を水1盞に生姜3片・棗3枚（擘き破る）と同じく煎じて7分を取り、滓を去って温服する。時を問わない。春の初めにだけ行うべきで、春の末から夏至の前までは黄芩半両を、夏至の後は知母半両・石膏2両、あるいは升麻半両を加えてよい。病人がもともと虚寒であれば加減しない。汗がなければ服すのをやめる（原文「無汗休服」）（翻刻確認）\n\n### 処方の変遷\n- 『傷寒論』の最初に出てくる方剤で、太陽病中風の基本処方とされる。『傷寒論』では二十数か所に載る（資料の記載）\n- 『金匱要略』では陽旦湯ともいう。婦人産後病篇の陽旦湯の条の小字注に「即桂枝湯，方見下利中」とある（翻刻確認）\n- 『備急千金要方』巻第九 傷寒上・発汗湯第五には、桂枝湯（条文の欄）の後に、芍薬・甘草・乾姜・黄芩・桂心・大棗の陰旦湯と、桂枝湯と同じ主治の陽旦湯（自汗・渇・下利・心下悸・虚労裏急などの加減法つき）が載る（翻刻確認）\n- 『外台秘要方』第二巻 傷寒下・傷寒中風方では、『古今録験方』の陽旦湯として『千金方』の陽旦湯と同じ条文・加減法が載り、構成は大棗・桂枝・芍薬・生姜・甘草・黄芩（桂枝湯加黄芩）とされる。このため後世、陽旦湯は桂枝湯加黄芩とみなされることが多い（要原本照合）\n- 『太平聖恵方』巻第九・治傷寒一日候諸方の桂枝湯方は、桂枝・附子・乾姜・甘草・麻黄に葱白を入れて煎じる同名異方。同じ箇所に、桂心・赤芍薬・甘草に生姜・棗を入れて煎じる、名前のない事実上の桂枝湯も載るとされる（要原本照合）\n- 『太平恵民和剤局方』巻之二・傷寒 附 中暑の桂枝湯（条文の欄）では、春の末から夏至の前までは黄芩半両を、夏至の後は知母半両・石膏2両、あるいは升麻半両を加える（翻刻確認）\n- 現行エキス剤（ツムラ45）は 桂皮・芍薬・大棗・甘草・生姜 の5味（PMDA 添付文書 2023年12月改訂 第1版で確認）。原典の「桂枝」は、資料の組成欄では「桂皮」と書かれる", "構成": "桂皮・芍薬・大棗・甘草・生姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "七物降下湯", "名前": "七物降下湯", "読み": "しちもつこうかとう", "ツムラ番号": "46", "出典": "大塚敬節経験方", "別名": "", "本文": {"条文": "", "出典": "### 原典の構成\n\n### 原典の服用法\n\n### 処方の変遷\n- 四物湯に釣藤鈎・黄耆・黄柏を加えた方で、資料の出典欄は「『理傷続断方』、大塚敬節経験方」。もとの四物湯の出典は『理傷続断方』医治整理補接次第口訣（条文は四物湯の項を参照）\n- 大塚敬節『漢方診療の実際』（昭和29年改訂版）の高血圧症の項に「四物湯加黄柏・黄耆・釣藤」として載り、大塚はこの方を「七物降下湯」と命名している、とされる（要原本照合）\n- 大塚敬節「釣藤・黄耆の加味による高血圧症の治療」（『日本東洋医学会誌』第5巻3号）では、四物湯加釣藤・黄耆・黄柏などを用いたとするが、七物降下湯の命名には触れていないとされる（要原本照合）\n- 『漢方診療医典』の高血圧症の項に、15年前に大塚が創作した処方とあるとされ、資料はその15年前を昭和27年とする（要確認）\n- 本方に杜仲を加えた方を八物降下湯と称するとされる（『臨床応用漢方処方解説』。要原本照合）\n- 『一般用漢方処方の手引き』に収載される。昭和50年発行の旧版と平成21年発行の改訂版で効能・効果の記載が異なるとされる（要原本照合）\n- 現行エキス剤（ツムラ46）は7.5g中、芍薬・当帰 各4.0g、黄耆・地黄・川芎・釣藤鈎 各3.0g、黄柏 2.0g の7味（PMDA 添付文書 2023年12月改訂 第1版で確認）。添付文書に出典の欄はない", "構成": "芍薬・当帰・黄耆・地黄・川芎・釣藤鈎・黄柏", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["出典", "構成", "方意", "諸家の論"]}, {"file": "釣藤散", "名前": "釣藤散", "読み": "ちょうとうさん", "ツムラ番号": "47", "出典": "普済本事方（巻二・頭痛頭暈方）", "別名": "鉤藤散", "本文": {"条文": "### 『普済本事方』巻二・頭痛頭暈方\n\n**書き下し**（読み：社員案）\n肝厥の頭暈を治し、頭目を清す。\n\n**原文**（翻刻確認）\n治肝厥頭暈、清頭目。鉤藤散。\n\n**現代語訳**（訳：社員案）\n肝厥による頭暈（めまい）を治し、頭と目をすっきりさせる。\n\n### 関連条文（同じ巻・肝厥の頭暈と腎厥の頭痛の区別）\n\n『普済本事方』巻二。釣藤散の次に載る玉真円（腎厥の頭痛の方）の後ろの論。資料が、肝厥の頭暈（釣藤散）と腎厥の頭痛を分けた文として挙げる条。\n\n**書き下し**（読み：社員案）\n素問に云う、頭痛顛疾は、下虚し上実す、過は足の少陰・巨陽に在り、甚だしければ則ち腎に入る。徇蒙招揺、目瞑耳聾は、下実し上虚す、過は足の少陽・厥陰に在り、甚だしければ則ち肝に在り、と。下虚とは腎虚なり、故に腎厥すれば則ち頭痛す。上虚とは肝虚なり、故に肝虚すれば則ち頭暈す。徇蒙とは物を以て其の首を蒙うが如し。招揺して定まらず、目眩耳聾、皆暈の状なり。故に肝虚の頭暈と腎厥の顛痛と、同じからざること此くの如し。肝厥を治するは、鉤藤散、前に在り。\n\n**原文**（翻刻確認）\n素問云、頭痛顛疾、下虚上實、過在足少陰巨陽、甚則入腎。徇蒙招揺、目瞑耳聾、下實上虚、過在足少陽厥陰、甚則在肝。下虚者腎虚也、故腎厥則頭痛。上虚者肝虚也、故肝虚則頭暈。徇蒙者如以物蒙其首、招揺不定、目眩耳聾、皆暈之状也。故肝虚頭暈、腎厥顛痛、不同如此。治肝厥、鉤藤散在前。\n\n**現代語訳**（訳：社員案）\n『素問』に「頭痛や頭頂の病は、下が虚して上が実したもので、誤りは足の少陰・太陽にあり、ひどければ腎に入る。頭を覆われたようにぼんやりし体が揺れ、目がくらみ耳が聞こえないのは、下が実して上が虚したもので、誤りは足の少陽・厥陰にあり、ひどければ肝にある」という。下虚とは腎虚のことで、だから腎厥すると頭痛がする。上虚とは肝虚のことで、だから肝虚すると頭暈がする。徇蒙とは物で頭を覆われたような状態である。体が揺れて定まらず、目がくらみ耳が聞こえないのは、いずれも暈の状態である。したがって肝虚の頭暈と腎厥の頭頂の痛みは、このように異なる。肝厥を治すのは、前に載せた鉤藤散である。\n\n### 注記\n- 本文は四庫全書本（『類証普済本事方』）の翻刻の字を採った。別の翻刻（簡体字の『普済本事方』）とは、下の点で字が違う\n- 方名の「鉤藤」は、四庫全書本の翻刻では「鈎藤」、別の翻刻では「钩藤」と書かれる。本文は新字体の「鉤」にした。資料・現行エキス剤の方名は「釣藤」で、見出しは販売名の「釣藤散」、原典の「鉤藤散」は別名に入れた（要原本照合）\n- 字体だけの違いは通行の字体に直した：四庫全書本の翻刻の「狥」→「徇」、「䝉」→「蒙」、「隂」→「陰」、「虗」→「虚」、「麥」→「麦」、「參」→「参」、「兩」→「両」\n- 後ろの論の「目眩」の「眩」は、四庫全書本の翻刻では表示できない字（外字）。文が通らないので、別の翻刻と資料の「眩」を本文に採った（要原本照合）\n- 後ろの論の「下虚上實」は、四庫全書本の翻刻では「下虚攻實」。後ろの「下實上虚」と対にならず文が通らないので、別の翻刻と資料の「上」を本文に採った（要原本照合）\n- 後ろの論の「甚則在肝」は、別の翻刻では「甚则入肝」、資料では「肝に入る」（要原本照合）\n- 後ろの論の「故肝虚則頭暈」は別の翻刻では「故肝厥则头晕」、「故肝虚頭暈」は別の翻刻では「故肝厥头晕」と書かれる（要原本照合）\n- 後ろの論の前に、四庫全書本の翻刻には「良方中黄丸子亦佳」、別の翻刻には「良方中硫黄丸亦佳」の句があり、別の翻刻ではその後に硫黄丸の方と治験が入ってから論が続く（要原本照合）\n- 「頭痛顛疾〜甚則在肝」は『素問』五蔵生成篇第十からの引用とされる（要原本照合）", "出典": "### 原典の構成\n- 『普済本事方』：鉤藤・陳皮・半夏・麦門冬・茯苓・茯神・人参・甘菊花・防風 各半両、甘草 1分、石膏 1両（翻刻確認）\n\n### 原典の服用法\n- 『普済本事方』：粗末とし、1回4銭を、水1盞半に生姜7片を入れて8分まで煎じ、滓を去って温服する（翻刻確認）\n- 別の翻刻（簡体字の『普済本事方』）には各生薬の修治の注がある：陳皮（白を去る）、半夏（湯に浸して7回洗い、薄く切って焙り乾かす）、麦門冬（心を去る。前の1字が欠ける）、茯苓（皮を去る）、茯神（木を去る）、人参（芦を去る）、甘菊花（萼・梗を去る）、防風（釵股を去る）、甘草（炙る）、石膏（生）。四庫全書本の翻刻にはこれらの注がない（要原本照合）\n\n### 処方の変遷\n- 『普済本事方』（南宋・許叔微）巻二・頭痛頭暈方に収載。茯神を含む11味を粗末にし、煎じるときに生姜を加える（翻刻確認）\n- 同じ巻で、釣藤散の次に玉真円を置く。玉真円は、腎気が不足して気が逆上し、耐えられない頭痛がするもの（腎厥。脈は軽く取ると弦、押さえると石のように堅いとされる）に用いる方（翻刻確認。脈の「弦」は四庫全書本の翻刻では外字で、別の翻刻と資料による。要原本照合）。その後ろの論（条文の欄の関連条文）で、肝厥の頭暈には前の釣藤散を用いると分けている（翻刻確認）\n- 『婦人大全良方』巻之四・婦人虚風頭目眩暈及心眩方論第四に、同じ条文と薬味で釣藤散が載り、上の論が小字双行で引かれるとされる（要原本照合）\n- 『普済方』巻四十七・頭門・風頭眩に「出本事方」として、原典と同じ順の薬味で載るとされる（要原本照合）\n- 『永類鈐方』巻之十一・頭痛にも条文と薬味が『普済本事方』のまま引き継がれるとされる（要原本照合）\n- 現行エキス剤（ツムラ47）は 石膏・釣藤鈎・陳皮・麦門冬・半夏・茯苓・菊花・人参・防風・甘草・生姜 の11味で、原典の茯神は入っていない（PMDA 添付文書 2023年12月改訂 第1版で確認。出典の欄はない）", "構成": "石膏・釣藤鈎・陳皮・麦門冬・半夏・茯苓・菊花・人参・防風・甘草・生姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "十全大補湯", "名前": "十全大補湯", "読み": "じゅうぜんたいほとう", "ツムラ番号": "48", "出典": "太平恵民和剤局方（巻之五・補虚損 附 骨蒸）", "別名": "", "本文": {"条文": "### 『太平恵民和剤局方』巻之五・補虚損 附 骨蒸（呉直閣増諸家名方）\n\n**書き下し**（読み：社員案）\n\n男子・婦人の諸虚不足、五労七傷、飲食進まず、久しく虚損を病み、時に潮熱を発し、気、骨脊を攻め、拘急疼痛し、夜夢に遺精し、面色萎黄、脚膝力無く、一切の病後に気旧の如からず、憂愁思慮して血気を傷動し、喘嗽中満し、脾腎の気弱く、五心煩悶するを治す。並びに皆之を治す。此の薬、性温にして熱ならず、平補にして効有り、気を養い神を育て、脾を醒まし渇を止め、正を順え邪を辟け、脾腎を温暖す。其の効、具さに述ぶべからず。\n\n**原文**（翻刻確認）\n\n治男子婦人諸虚不足、五労七傷、不進飲食、久病虚損、時発潮熱、気攻骨脊、拘急疼痛、夜夢遺精、面色萎黄、脚膝無力、一切病後気不如旧、憂愁思慮傷動血気、喘嗽中満、脾腎気弱、五心煩悶、並皆治之。此薬性温不熱、平補有効、養気育神、醒脾止渇、順正辟邪、温暖脾腎、其効不可具述。\n\n**現代語訳**（訳：社員案）\n\n男女のさまざまな虚弱・不足、五労七傷で、飲食が進まず、長く虚損を病み、時に潮熱を発し、気が背骨を攻めてひきつれるように痛み、夜に夢を見て遺精し、顔色が萎えて黄ばみ、脚や膝に力がなく、あらゆる病の後に気が元どおりに戻らず、憂い悩み思い煩って血気を損ない、喘いで咳き込み腹が張り、脾と腎の気が弱く、五心がほてって煩わしく苦しむものを治す。いずれもみなこれを治す。この薬は性質が温で熱ではなく、穏やかに補って効果があり、気を養い神を育て、脾を目覚めさせて渇きを止め、正気を順わせて邪を避け、脾腎を温める。その効能はつぶさに述べ尽くせない。\n\n### 注記\n- 四庫全書本の翻刻は旧字体・異体字（虗・勞・發・靣・舊・飬 など）。本文は新字体にした\n- 十全大補湯の条の「面色萎黄」は翻刻の字。資料の書き下しは「面色痿黄」と書く（要原本照合）\n- 十全大補湯の条の「温暖脾腎」は翻刻の字（2つの翻刻本とも）。資料の書き下しは「脾胃を温煖す」と書く（要原本照合）\n- 十全大補湯の条の「一切病後気不如旧」以下の句は、別の翻刻本では行の途中が欠けている（「時发潮熱，氣」の次が「疼痛」など）。本文は四庫全書本に従った\n- 構成の「黄耆」は、四庫全書本の翻刻では「黄茋」と書かれる。字体の違いとして本文は「黄耆」にした\n- 十全大補湯の構成で、四庫全書本は「焙」を白朮にだけ付けるが、別の翻刻本は「茯苓（焙）白术（焙）」と茯苓にも付ける（要原本照合）。本文は四庫全書本に従った\n- 服用法の「棗子」の「棗」と「不拘時候温服」の「候」は、四庫全書本の翻刻では外字になっている。別の翻刻本（「枣子二个」「不拘時候温服」）の字を置いた（要原本照合）。棗子の数え方は、四庫全書本では「二枚」、別の翻刻本では「二个」\n- 方の前の印：別の翻刻本では十全大補湯の前に「〔吴直阁增諸家名方〕」がある（翻刻確認）。四庫全書本には印がない", "出典": "### 原典の構成\n- 『和剤局方』：人参・肉桂（粗皮を去り、火を見せない）・川芎・地黄（洗い、酒で蒸して焙る）・茯苓・白朮（焙る）・甘草（炙る）・黄耆（蘆を去る）・川当帰（洗い、蘆を去る）・白芍薬 各等分（翻刻確認）。資料は「白茯苓・白朮・人参・熟乾地黄・白芍薬・粉草・黄耆・肉桂・川当帰・川芎」と書く（要原本照合）\n\n### 原典の服用法\n- 『和剤局方』：10味を剉んで粗末とし、1回2大銭を、水1盞に生姜3片・棗子2枚を入れて同じく7分まで煎じ、時候に拘わらず温服する（翻刻確認）\n\n### 処方の変遷\n- 資料の出典欄は「『金匱要略』、『備急千金要方』、『太平恵民和剤局方』」。本方の出典は一般に『和剤局方』巻之五・補虚損 附 骨蒸とされ、同巻には呉直閣増諸家名方の十全大補湯と、続添諸局経験秘方の十全飲の2つが収載されている（翻刻確認。別の翻刻本の印による）\n- 『和剤局方』巻之五の十全飲（続添諸局経験秘方）は、十全大補湯と同じ10味（熟乾地黄・白茯苓・人参・肉桂・川当帰・白芍薬・川芎・白朮・黄耆・甘草 各1分）を粗末とし、1回3銭を水1盞半に生姜3片・棗子1箇を入れて7分まで煎じて温服する方で、諸虚百損・栄衛不和・形体羸痩・面色痿黄・寒熱往来・喘嗽吐衄・遺精失血・婦人の崩漏や経候不調・病後の未回復・憂慮による血気の傷動を治すとする（翻刻確認）。方名が違うので条文の欄には置かない\n- 資料は、呉直閣増諸家名方は紹興年間（1131〜62年）に、続添諸局経験秘方は淳祐年間（1241〜52年）に増改されたとする（要確認）\n- 資料は、本方を四物湯合四君子湯加黄耆・桂皮、あるいは八珍湯合黄耆建中湯とみて、それぞれの出典を考える必要があるとする。黄耆建中湯の出典は『金匱要略』（要原本照合）\n- 資料によれば、『備急千金要方』には十全大補湯に近い方がいくつか載る。巻十 傷寒下・温瘧第六の大五補湯（十全大補湯加遠志・桔梗・竹葉・生枸杞根・半夏・麦門冬・大棗・生姜にあたる）、巻第三 婦人方中・虚損第一の内補黄耆湯（十全大補湯去川芎加半夏・遠志・麦門冬・五味子・沢瀉・乾姜・大棗にあたる）、同・悪露第五の乾地黄湯（十全大補湯去白朮加防風・細辛にあたる）、巻第十七 肺蔵・積気第五の又方（十全大補湯去白朮加地骨皮・大棗にあたる）。『千金方』の地黄はすべて乾地黄とする（要原本照合）\n- 資料は、『千金方』には十全大補湯と同じ処方は載っていないとする（要原本照合）\n- 資料によれば、『太平聖恵方』巻第八十・治産後蓐労諸方の白茯苓散は、白茯苓・当帰・白芍薬・芎藭・桂心・黄耆・人参・熟乾地黄を散とし、猪腎一対と姜棗で煎服する。この8味は十全大補湯去白朮・甘草にあたる（要原本照合）\n- 資料は、本方は『金匱要略』の黄耆建中湯に胚胎し、『千金方』に本方を含む方や極めて近い方が載り、『太平聖恵方』を経て、最終的に『和剤局方』で十全大補湯と十全飲の名で収載されたとする（要確認）\n- 資料によれば、『医門法律』巻之六の十全大補散の方後に、黄耆建中湯・四君子湯・四物湯を合わせて十味を得るとある。資料は、四君子湯の『和剤局方』への収載（続添諸局経験秘方）は十全大補湯（呉直閣増諸家名方）より百年以上後なので、これは歴史的な成り立ちではなく方意上の解釈とすべきとする（要原本照合）\n- 資料によれば、甲賀通元『医方紀原』は、十全大補湯の号は局方の呉直閣の方に出、十全飲はその古名かとし、また『張氏医通』の、古方の十全大補湯は黄耆・肉桂がなく沈香・木香が多いという説を引く（要原本照合）\n- 地黄は、十全大補湯では「地黄（洗い、酒で蒸して焙る）」、十全飲では「熟乾地黄」（翻刻確認）\n- 現行エキス剤（ツムラ48）は7.5g中、黄耆・桂皮・地黄・芍薬・川芎・蒼朮・当帰・人参・茯苓 各3.0g、甘草1.5g の10味（PMDA 添付文書 2023年12月改訂 第1版で確認）。原典の白朮の代わりに蒼朮が入り、原典で煎じるときに加える生姜・大棗は入っていない。添付文書に出典の欄はない", "構成": "黄耆・桂皮・地黄・芍薬・川芎・蒼朮・当帰・人参・茯苓・甘草", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "荊芥連翹湯", "名前": "荊芥連翹湯", "読み": "けいがいれんぎょうとう", "ツムラ番号": "50", "出典": "万病回春（巻之五・耳病）／万病回春（巻之五・鼻病）／一貫堂方", "別名": "", "本文": {"条文": "### 『万病回春』巻之五・耳病\n\n**書き下し**（読み：社員案）\n両耳腫痛する者は、腎経に風熱有るなり。荊芥連翹湯。\n\n**原文**（翻刻確認）\n兩耳腫痛者、腎經有風熱也。荊芥連翹湯\n\n**現代語訳**（訳：社員案）\n両耳が腫れて痛むものは、腎経に風熱があるのである。荊芥連翹湯（を用いる）。\n\n### 『万病回春』巻之五・鼻病\n\n**書き下し**（読み：社員案）\n鼻淵の者は、胆、熱を脳に移すなり。荊芥連翹湯。\n\n**原文**（翻刻確認）\n鼻淵者、膽移熱於腦也。荊芥連翹湯\n\n**現代語訳**（訳：社員案）\n鼻淵は、胆が熱を脳に移したものである。荊芥連翹湯（を用いる）。\n\n### 注記\n- 『万病回春』の翻刻は簡体字の本で、原文は繁体字にそろえて書いた（两→兩、肿→腫、肾经→腎經、风热→風熱、胆→膽、热→熱、脑→腦、于→於 など）。字形の判断には使えない（要原本照合）\n- 同じ方名で、耳病と鼻病に構成の違う2方が載る。現行の荊芥連翹湯は一貫堂（森道伯）がこの2方を合わせ、黄連・黄柏を加えたものとされる（要原本照合）\n- 2方の順は、『万病回春』の掲載順（耳病が先）にした（要確認）", "出典": "### 原典の構成\n- 『万病回春』巻之五・耳病：荊芥・連翹・防風・当帰・川芎・白芍・柴胡・枳殻・黄芩・山梔・白芷・桔梗 各等分、甘草 減半（翻刻確認）\n- 『万病回春』巻之五・鼻病：荊芥・柴胡・川芎・当帰・生地黄・芍薬・白芷・防風・薄荷・山梔・黄芩・桔梗・連翹 各等分、甘草 減半（翻刻確認）\n\n### 原典の服用法\n- 『万病回春』巻之五・耳病：1剤に刻み、水で煎じて食後に服す（翻刻確認）\n- 『万病回春』巻之五・鼻病：刻んで散とし、水で煎じて食遠（食事から間をあけて）服す（翻刻確認）\n\n### 処方の変遷\n- 現行の荊芥連翹湯は一貫堂方。資料は『漢方一貫堂医学』により、『万病回春』巻之五の耳病・鼻病の同名方を基源とし、森道伯がこの2方を合方して黄連・黄柏を加え、一貫堂の青年期解毒証体質改善薬としたとする（要原本照合）\n- 耳病の方は現行方から地黄・黄連・黄柏・薄荷を去った形、鼻病の方は現行方から黄連・黄柏・枳殻を去った形（翻刻確認）\n- 資料は、一貫堂方としては四物湯に『万病回春』の黄連解毒湯（通常の黄連解毒湯加柴胡・連翹）を合方し甘草を加えた四物黄連解毒湯（温清飲加柴胡・連翹・甘草）に、ほかの薬味を配した方剤とする（要原本照合）\n- 四物湯の出典は『理傷続断方』、黄連解毒湯の出典は『肘後百一方』とされる。資料の出典欄にはこの2書も挙がる（要確認）\n- 一貫堂方では枳殻で処方されるが、医療用エキス剤では枳実で処方される\n- 現行エキス剤（ツムラ）は7.5g中、黄芩・黄柏・黄連・桔梗・枳実・荊芥・柴胡・山梔子・地黄・芍薬・川芎・当帰・薄荷・白芷・防風・連翹 各1.5g、甘草1.0g の17味（PMDA 添付文書 2023年12月改訂 第1版で確認）。添付文書に出典の欄はない", "構成": "黄芩・黄柏・黄連・桔梗・枳実・荊芥・柴胡・山梔子・地黄・芍薬・川芎・当帰・薄荷・白芷・防風・連翹・甘草", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "潤腸湯", "名前": "潤腸湯", "読み": "じゅんちょうとう", "ツムラ番号": "51", "出典": "万病回春（巻之四・大便閉）", "別名": "", "本文": {"条文": "### 『万病回春』巻之四・大便閉\n\n**書き下し**（読み：社員案）\n大便閉結して通ぜざるを治す。\n\n**原文**（翻刻確認）\n治大便閉結不通。\n\n**現代語訳**（訳：社員案）\n大便が閉じて固まり、通じないものを治す。\n\n### 注記\n- 『万病回春』の翻刻は簡体字の本で、原文は繁体字にそろえて書いた（闭→閉）。字形の判断には使えない（要原本照合）\n- 条の前に大便閉の門の総論があり、熱閉・虚閉・風閉、汗が多く出たあとの閉、老人の血気枯燥による閉、産婦や失血による血虚の閉を挙げたあと、「多食辛熱之物、大便不通者、實熱也（並宜後方）」で終わる（翻刻確認）\n- 構成の「厚朴」は、翻刻では「浓朴」と書かれる（要原本照合）。古典の体裁に合わないので、資料の「厚朴」を採った\n- 方後の加減の「瓜蔞」は、翻刻では「瓜萎」と書かれる（要原本照合）\n- 方後の「実熱燥閉」の句は、翻刻では「實熱燥閉，根据本方」と書かれる。「根据」は古典の体裁に合わない（要原本照合）。資料の書き下しは「本方に依る」", "出典": "### 原典の構成\n- 『万病回春』巻之四・大便閉：当帰・熟地黄・生地黄・麻仁（去殻）・桃仁（去皮）・杏仁（去皮）・枳殻・厚朴（去粗皮）・黄芩・大黄 各等分、甘草 減半（翻刻確認）\n\n### 原典の服用法\n- 『万病回春』巻之四・大便閉：1剤に刻み、水で煎じて空腹時に熱服する。大便が通じたら薬を止め、多く服してはならない（翻刻確認）\n- 潤腸丸に仕立てるときは、薬を加減してそれぞれ末とし、煉蜜で梧桐子大の丸とする。1回50丸を空腹時に白湯で呑み下す。辛熱の物を切に忌む（翻刻確認）\n- 方後の加減：実熱燥閉は本方のまま。発熱には柴胡、腹痛には木香、血虚枯燥には当帰・熟地黄・桃仁・紅花を加える。風燥の閉には郁李仁・皂角・羌活、気虚の閉には人参・郁李仁、気実の閉には檳榔・木香、痰火の閉には瓜蔞・竹瀝、汗や小便が多く出て津液が枯竭した閉には人参・麦門冬を加える。老人の気血枯燥の閉には人参・鎖陽・麦門冬・郁李仁を加え、当帰・熟地黄・生地黄を倍にし、桃仁を少なくする。産婦で出血が多く枯燥した閉には人参・紅花を加え、当帰・熟地黄を倍にし、黄芩・桃仁を去る（翻刻確認）\n- 方後の最後に「此方加檳榔、即通幽湯」（この方に檳榔を加えれば通幽湯）とある（翻刻確認）\n\n### 処方の変遷\n- 資料は、本方は龔廷賢が『万病回春』で創案した方であるとする。3年後刊の『雲林神彀』巻之三・大便閉には収載されるが、27年後刊の『寿世保元』、28年後刊の『済世全書』には収採されていないとする（要原本照合）\n- 資料は、李東垣『蘭室秘蔵』巻之四・大便結燥門に、大腸結燥して通じないものを治す潤腸湯（生地黄・生甘草・大黄・熟地黄・当帰梢・升麻・桃仁・麻仁・紅花）がすでに載り、これから升麻・紅花を去り、厚朴・黄芩・枳実を加えると今日の潤腸湯になるとする（要原本照合）\n- 資料は、本方の構成を理解するうえでは『丹渓心法』巻五・秘方一百の潤腸丸（麻子仁・当帰・桃仁・生地黄・枳殻。血燥・大便不通を潤す）を考えるのがよいとし、この方は『古今医鑑』巻之八・閉結にも老人の便秘の方として引かれるとする（要原本照合）\n- 資料は、『丹渓心法』の潤腸丸に、麻子仁丸（麻子仁・芍薬・枳実・大黄・厚朴・杏仁）を合わせて黄芩を加えると、ほぼ本方になるとし、違いは芍薬と甘草、枳実と枳殻だけであるとする（要原本照合）。麻子仁丸の出典は『傷寒論』弁陽明病脈証并治第八（資料による。要原本照合）\n- 現行エキス剤（ツムラ51）は7.5g中、地黄6.0g、当帰3.0g、黄芩・枳実・杏仁・厚朴・大黄・桃仁・麻子仁 各2.0g、甘草1.5g の10味（PMDA 添付文書 2023年12月改訂 第1版で確認）。原典の熟地黄・生地黄は地黄1品になり、枳殻は枳実になる。添付文書に出典の欄はない", "構成": "地黄・当帰・黄芩・枳実・杏仁・厚朴・大黄・桃仁・麻子仁・甘草", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "薏苡仁湯", "名前": "薏苡仁湯", "読み": "よくいにんとう", "ツムラ番号": "52", "出典": "明医指掌（巻七・痹証六・寒痹）／太医院経験奇効良方大全（巻之二・風門）", "別名": "", "本文": {"条文": "### 『明医指掌』巻七・痹証六・寒痹\n\n**書き下し**（読み：社員案）\n身体煩疼し、項背拘急し、或いは重く或いは痛み、体を挙ぐること艱難にして、手足冷痹し、腰腿沈重にして力無き者は、蠲痹湯。痛痹にて、四肢拘倦し、浮腫して痛み著く、故に寒気盛んなる者は痛痹と為す、川芎茯苓湯（方は前の湿痹に見ゆ）。骨節疼痛し、皮膚不仁し、肌肉重著し、及び四肢緩縦して不仁なる者は、附子湯。寒湿の痹痛は、薏苡仁湯。\n\n**原文**（翻刻確認）\n身體煩疼，項背拘急，或重或痛，舉體艱難，手足冷痹，腰腿沉重無力者，蠲痹湯。痛痹，四肢拘倦，浮腫痛著，故寒氣盛者為痛痹，川芎茯苓湯。（方見前濕痹。）骨節疼痛，皮膚不仁，肌肉重著及四肢緩縱不仁者，附子湯。寒濕痹痛，薏苡仁湯。\n\n**現代語訳**（訳：社員案）\n体がわずらわしく痛み、うなじと背中がひきつり、重かったり痛かったりして、体を動かすのが難しく、手足が冷えてしびれ、腰と脚が沈むように重く力のないものは、蠲痹湯。痛痹で、四肢がひきつってだるく、むくんで痛みが一か所にとどまるもの、すなわち寒の気が盛んなものを痛痹とする。これには川芎茯苓湯（方は前の湿痹の項に見える）。骨や関節が痛み、皮膚の感覚が鈍く、筋肉が重く、さらに四肢がゆるんで感覚のないものは、附子湯。寒湿による痹の痛みには、薏苡仁湯。\n\n### 『太医院経験奇効良方大全』巻之二・風門\n\n**書き下し**（要原本照合）\n\n**原文**（要原本照合）\n\n**現代語訳**\n\n### 注記\n- 『明医指掌』の翻刻は簡体字の本（天啓二年の邵達の訂補本。未校訂）で、原文は繁体字にそろえて書いた（身体→身體、举→舉、艰难→艱難、湿→濕、着→著 など）。字形の判断には使えない（要原本照合）\n- 寒痹の条は、蠲痹湯・川芎茯苓湯・附子湯・薏苡仁湯の4方を並べる。薏苡仁湯に当たる句は最後の「寒濕痹痛，薏苡仁湯」だけ。同じ痹証六には五痹・風痹・湿痹・寒痹の項が並ぶ（翻刻確認）\n- 「川芎茯苓湯」は、前の湿痹の項では「茯苓川芎湯」の名で方が載る（翻刻確認）\n- 『太医院経験奇効良方大全』の原文の翻刻は維基文庫で取れなかった（2026-10-23。要原本照合）。資料の書き下しでは、中風で手足に流注して疼痛・麻痺不仁し、屈伸しにくいものを治すとされる（要原本照合）", "出典": "### 原典の構成\n- 『明医指掌』巻七：当帰（1両）・芍薬（炒、1両）・薏苡仁（1両）・麻黄（1両）・肉桂（1両）・甘草（炙、1両）・蒼朮（米泔に浸し炒る、4両）の7味（翻刻確認）\n- 『太医院経験奇効良方大全』巻之二：薏苡仁・当帰・芍薬・麻黄・官桂・甘草・蒼朮の7味（分量は資料に記載なし）（要原本照合）\n\n### 原典の服用法\n- 『明医指掌』巻七：刻み、1回7銭を生姜3片と煎じて服す。自汗には麻黄を減じ、熱には桂を減ずる（翻刻確認）\n- 『太医院経験奇効良方大全』巻之二：生姜を入れて水で煎じて服す。方後に、自汗があれば麻黄を減じ、熱があれば官桂を減ずる（要原本照合。資料の書き下しによる）\n\n### 処方の変遷\n- 資料は、本方の出典は皇甫中撰『明医指掌』とされてきたが、さらに遡って『太医院経験奇効良方大全』（『奇効良方』）巻之二・風門に同じ7味・同じ方後の文で載り、『明医指掌』はこれを引いたものとする。もとは風の薬として作られたとする（要確認）\n- 資料は、『奇効良方』は太医院の董宿が輯録し、方賢が続補して楊文翰が正統十四年（1449）に校正刊行し、成化七年（1471）に校注本が太医院から刊行されたとする（要確認）\n- 資料は、『明医指掌』は天啓二年（1622）に王肯堂の訂補、邵達の参補による訂補本が通行しているとする（要確認）。維基文庫の翻刻は邵達の天啓二年の序を持つ本（翻刻確認）\n- 資料は、本方は『金匱要略』痙湿暍病脈証第二の麻黄杏仁薏苡甘草湯（麻杏薏甘湯）に胚胎し、麻杏薏甘湯去杏仁加当帰・芍薬・桂皮・蒼朮・生姜にあたるとする（要確認）。資料の出典欄には『金匱要略』が挙がる\n- 現行エキス剤（ツムラ52）は7.5g中、薏苡仁8.0g、蒼朮・当帰・麻黄 各4.0g、桂皮・芍薬 各3.0g、甘草2.0g の7味（PMDA 添付文書 2023年12月改訂 第1版で確認）。原典の煎じ方の生姜は入っていない。添付文書に出典の欄はない", "構成": "薏苡仁・蒼朮・当帰・麻黄・桂皮・芍薬・甘草", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "疎経活血湯", "名前": "疎経活血湯", "読み": "そけいかっけつとう", "ツムラ番号": "53", "出典": "万病回春（巻之五・痛風）", "別名": "踈経活血湯", "本文": {"条文": "### 『万病回春』巻之五・痛風\n\n**書き下し**（読み：社員案）\n遍身走痛して刺すが如く、左足の痛み尤も甚だしきを治す。左は血に属す。多くは酒色の損傷に因り、筋脈虚空にして、風寒湿熱を被りて内に感じ、熱、寒に包まるれば則ち痛み、筋絡を傷る。是を以て昼軽く夜重し。宜しく以て経を疏し血を活かし湿を行らすべし。此れ白虎歴節風に非ざるなり。\n\n**原文**（翻刻確認）\n治遍身走痛如刺、左足痛尤甚。左屬血、多因酒色損傷、筋脈虛空、被風寒濕熱感於內、熱包於寒、則痛傷筋絡、是以晝輕夜重。宜以疏經活血行濕。此非白虎歷節風也。\n\n**現代語訳**（訳：社員案）\n全身を走るように痛み、刺すようで、左足の痛みがとりわけ甚だしいものを治す。左は血に属する。多くは酒色による損傷のために筋脈が虚して空になり、風寒湿熱を受けて内に感じ、熱が寒に包まれると痛み、筋絡を傷る。そのため昼は軽く夜は重い。経を疏通し、血を活かし、湿をめぐらせるのがよい。これは白虎歴節風ではない。\n\n### 注記\n- 『万病回春』の翻刻は簡体字の本で、原文は繁体字にそろえて書いた（属→屬、湿→濕、于→於、昼轻夜重→晝輕夜重 など）。字形の判断には使えない（要原本照合）。『古今医鑑』の翻刻は簡体字から機械的に繁体化した本で、処方の変遷に引いた句も字形の判断には使えない（要原本照合）\n- 方名：資料は、原典では「踈」の字を使っており（踈経活血湯）、これは「疏」の訛字で、本来は「疏」であるべきとする（要原本照合）。見出しは添付文書の販売名の「疎経活血湯」、別名に原典の「踈経活血湯」を置いた。翻刻の方名「硫经活血汤」の「硫」は方名として通らないので採らない（要原本照合）。条文の中は翻刻・資料とも「疏经」「疏（踈）し」\n- 条の前に、痛風の門の見出しの句「遍身走痛、日輕夜重者、是血虛也」が置かれる（翻刻確認）\n- 同じ巻の腰痛の門には「日輕夜重者、瘀血也」とある（翻刻確認）\n- 「熱包於寒、則痛傷筋絡」の句読は翻刻の校訂者のもの。資料は「熱、寒に包まるるときは、痛み、筋絡を傷る」と読む", "出典": "### 原典の構成\n- 『万病回春』巻之五・痛風：当帰（酒洗）1銭2分、白芍（酒炒）1銭半、生地黄（酒洗）・蒼朮（米泔浸）・牛膝（去芦、酒洗）・陳皮（去白）・桃仁（去皮、炒）・威霊仙（酒洗） 各1銭、川芎6分、漢防己（酒洗）・羌活・防風（去芦）・白芷 各6分、竜胆草6分、茯苓（去皮）7分、甘草4分（翻刻確認）\n- 翻刻では川芎は「川芎草（六分）」、桃仁の修治は「去皮，煎炒」と書かれる（要原本照合）\n\n### 原典の服用法\n- 『万病回春』巻之五・痛風：1剤に刻み、生姜3片を入れて水で煎じ、空腹時に温服する。生冷・湿物を忌む（翻刻確認）\n- 方後の加減：痰があれば南星・半夏 各1銭を加える。身上および臂が痛めば薄桂3分を加える。下体および足が痛めば木瓜・木通・塩炒黄柏・薏苡仁 各1銭を加える。気虚には人参・白朮・亀板 各7分を加える。血虚には四物湯を倍にし、姜汁・酒に浸して炒り、紅花1銭を用いる（翻刻確認）\n\n### 処方の変遷\n- 資料は、本方の出典は従来『万病回春』とされるが、方後の加減（血虚には四物湯を倍にする）から本方は四物湯を祖剤とし、四物湯の出典をまず念頭に置くべきとする（要原本照合）。資料の出典欄には『理傷続断方』が挙がる。四物湯の出典は『理傷続断方』・『和剤局方』（このアプリの四物湯の項）\n- 『古今医鑑』巻之十・痹痛に「疏筋活血湯（雲林製）」があり、主治は『万病回春』とほぼ同じで、「傷經絡則夜重、宜以疏筋活血行濕」と書かれる（翻刻確認）。構成は『万病回春』と同じ16味で、川芎6分、当帰（酒洗）1銭2分、白芍（酒洗）2銭半、生地黄（酒洗）1銭半、羌活6分、白茯苓（去皮）7分、蒼朮（米泔浸炒）1銭、桃仁（炒）1銭、牛膝（酒炒）2銭、漢防己6分、陳皮（去苗）1銭、白芷6分、竜胆草（酒洗）8分、威霊仙（酒洗）1銭、防風6分、甘草（炙）4分（翻刻確認）。煎じ方・生姜の記載はなく、方後に『万病回春』とほぼ同じ加減が続く（翻刻確認）\n- 資料は、元の方名は疏筋活血湯で、方名に「雲林製」と小字で注されているので龔廷賢の創製とする（要原本照合）\n- 『古今医鑑』の同じ門の冒頭近くに、痹痛の大法として「用蒼朮、南星、川芎、白芷、當歸、黄芩、酒、在上者屬風、加羌活、桂枝、桔梗、威靈仙、下者屬濕、加木通、牛膝、防己、黄柏」とある（翻刻確認）\n- 資料は、この大法は「風に属し」「桔梗」「湿に属し」を除けば『丹渓心法』巻四・痛風六十三 附肢節痛からの引用であり、同じ箇所には上中下の疼痛を治す丸方と、酒の湿痰の痛風を治す煎方も載るとする（要原本照合）\n- 資料は、『医学正伝』巻之四・痛風の加味四物湯（白虎歴節風の症を治す）が、本方から蒼朮・威霊仙・防已・羌活・防風・生姜を去った構成で、加減に「痛み上に在る者は風に属す」「下に在る者は湿に属す」が加わっているとする（要原本照合）\n- 資料は、本方は『雲林神彀』『魯府禁方』『寿世保元』『済世全書』には収載されていないとする（要原本照合）\n- 現行エキス剤（ツムラ53）は7.5g中、芍薬2.5g、地黄・川芎・蒼朮・当帰・桃仁・茯苓 各2.0g、威霊仙・羌活・牛膝・陳皮・防已・防風・竜胆 各1.5g、甘草・白芷 各1.0g、生姜0.5g の17味（PMDA 添付文書 2023年12月改訂 第1版で確認）。添付文書に出典の欄はない", "構成": "芍薬・地黄・川芎・蒼朮・当帰・桃仁・茯苓・威霊仙・羌活・牛膝・陳皮・防已・防風・竜胆・甘草・白芷・生姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "抑肝散", "名前": "抑肝散", "読み": "よくかんさん", "ツムラ番号": "54", "出典": "薛氏医案（巻六・保嬰金鏡録＝過秦新録）／薛氏医案（巻五十四・保嬰撮要一・肝臓）", "別名": "", "本文": {"条文": "### 『保嬰金鏡録』（薛氏医案 巻六・薛己撰）\n\n**書き下し**（読み：社員案）\n肝経の虚熱にて搐を発し、或いは発熱して咬牙し、或いは驚悸して寒熱し、或いは木、土に乗じて痰涎を嘔吐し、腹脹りて食少なく、睡臥安からざるを治す。（愚製）\n\n**原文**（翻刻確認）\n治肝經虚熱發搐、或發熱咬牙、或驚悸寒熱、或木乗土而嘔吐痰涎、腹脹少食、睡臥不安。（愚製）\n\n**現代語訳**（訳：社員案）\n肝経の虚熱でひきつけ（搐）を起こすもの、あるいは発熱して歯をくいしばるもの、あるいは驚いて動悸し寒気と熱が出るもの、あるいは木（肝）が土（脾）に乗じて痰やよだれを吐き、腹が張って食が少なく、眠りが安らかでないものを治す。（私が作った方である）\n\n### 『保嬰撮要』一・肝臓（薛氏医案 巻五十四・薛鎧撰・薛己訂）\n\n**書き下し**（読み：社員案）\n肝経の虚熱にて搐を発し、或いは発熱して咬牙し、或いは驚悸して寒熱し、或いは木、土に乗じて痰涎を嘔吐し、腹脹りて食少なく、睡臥安からざるを治す。\n\n**原文**（翻刻確認）\n治肝經虚熱發搐、或發熱咬牙、或驚悸寒熱、或木乘土而嘔吐痰涎、腹脹少食、睡臥不安。\n\n**現代語訳**（訳：社員案）\n肝経の虚熱でひきつけ（搐）を起こすもの、あるいは発熱して歯をくいしばるもの、あるいは驚いて動悸し寒気と熱が出るもの、あるいは木（肝）が土（脾）に乗じて痰やよだれを吐き、腹が張って食が少なく、眠りが安らかでないものを治す。\n\n### 関連条文（『保嬰撮要』一・肝臓、抑肝散の直前の瀉青丸の按文）\n\n**書き下し**（読み：社員案）\n愚按ずるに、前方は足厥陰経の肌表を解散し、内熱を疎通するの薬なり。若し大便秘結し、煩渇して冷を飲み、飲食常の如き者は、形病倶に実に属す、宜しく此れを用いて以て之を瀉すべし。若し大便調和し、煩渇して冷を飲み、目の色淡青なるは、病気実して形気虚するに属す、宜しく抑肝散を用いて之を平らぐべし。若し大便実せず、渇を作して湯を飲み、飲食思うこと少なく、肢体倦怠する者は、形病倶に虚に属す、宜しく地黄丸を用いて之を補うべし。\n\n**原文**（翻刻確認）\n愚按前方足厥陰經解散肌表疏通内熱之藥也。若大便秘結、煩渴飲冷、飲食如常者、屬形病俱實、宜用此以瀉之。若大便調和、煩渴飲冷、目淡青色、屬病氣實而形氣虚、宜用抑肝散平之。若大便不實、作渴飲湯、飲食少思、肢體倦怠者、屬形病俱虚、宜用地黄丸補之。\n\n**現代語訳**（訳：社員案）\n私が考えるに、前の方（瀉青丸）は足厥陰経の肌表の邪を発散させ、内の熱を通じさせる薬である。もし大便が秘結し、ひどく喉が渇いて冷たいものを飲み、飲食がふだんどおりの者は、形（体）も病も共に実なので、これを用いて瀉すのがよい。もし大便が整っていて、ひどく喉が渇いて冷たいものを飲み、目が淡い青色の者は、病の気は実だが体の気は虚なので、抑肝散を用いてこれを平らげるのがよい。もし大便が固まらず、喉が渇いて湯を飲み、食欲が少なく、手足や体がだるい者は、形も病も共に虚なので、地黄丸を用いてこれを補うのがよい。\n\n### 注記\n- 2書の主治の文は字が同じ（翻刻確認）。字体の違いとして、『保嬰金鏡録』の翻刻は「乗」、『保嬰撮要』の翻刻は「乘」と書く。2書とも翻刻の「卧」は本文を「臥」に、関連条文の「隂」は「陰」にした\n- 「愚製」（私が作った方）の小字注は『保嬰金鏡録』にあり、『保嬰撮要』の肝臓の項にはない（翻刻確認）\n- 簡体字の『保嬰撮要』の翻刻（維基文庫）では、肝臓の項の主治が「或痰热切牙」、巻六・発熱の項に再び載る主治が「或发热切牙…睡眠不安」と書かれる（要原本照合）\n- 『保嬰金鏡録』にも瀉青丸の後に同じ趣旨の按文があるが、「目淡青色」の句がない（翻刻確認）\n- 条文の順：2書とも現行エキス剤と同じ7味（朮の種類だけが違う）なので、資料の出典欄の順に『保嬰金鏡録』を先にした（要確認）", "出典": "### 原典の構成\n- 『保嬰金鏡録』：軟柴胡・甘草 各5分、川芎8分、当帰・白朮（炒）・茯苓・鈎藤鈎 各1銭（翻刻確認）\n- 『保嬰撮要』一・肝臓：軟柴胡・甘草 各5分、川芎8分、当帰・白朮（炒）・茯苓・鈎藤鈎 各1銭（翻刻確認）\n\n### 原典の服用法\n- 『保嬰金鏡録』：水で煎じ、子と母が同じく服す（翻刻確認）\n- 『保嬰撮要』一・肝臓：水で煎じ、子と母が同じく服す。蜜で丸にすれば抑青丸と名づける（翻刻確認）\n\n### 処方の変遷\n- 『薛氏医案』巻六・保嬰金鏡録（薛己撰）の抑肝散には、主治の後に小字で「愚製」と注され、薛己が自ら作った方と示される。同じ箇所の九味竜胆瀉肝湯・梔子清肝散・柴胡清肝散にも「愚製」の注がある（翻刻確認）\n- 『薛氏医案』巻五十四・保嬰撮要一（薛己訂）の肝臓の項にも、同じ主治・構成で載る（翻刻確認）。従来は『保嬰撮要』が本方の出典とされてきた（要原本照合）\n- 資料は、『保嬰金鏡録』は嘉靖庚戌（二十九年、1550年）春三月の自序をもつ『過秦新録』を薛氏十六種に収めるときに改題したもので、『保嬰撮要』（嘉靖三十四年、1555年成書）より早いとする（要原本照合）\n- 資料は、『薛氏医案』巻七十七・小児痘疹方論・附方にも同じ条文が「愚製」と注されて載るとする（要原本照合）\n- 一部の書は出典を『銭氏小児薬証直訣』とするが、資料は、薛己が注した『銭氏小児直訣』（『薛氏医案』巻五十三）に収載されているだけとする（要原本照合）\n- 『仁斎直指小児附遺方論』を出典とする説もあるが、資料は、同書には夜啼の釣藤散（釣藤・茯神・茯苓・川芎・当帰・木香・甘草）が載るだけで抑肝散は載らないとする（要原本照合）\n- 現行エキス剤（ツムラ54）は 蒼朮・茯苓・川芎・釣藤鈎・当帰・柴胡・甘草 の7味で、原典の白朮が蒼朮になっている（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "蒼朮・茯苓・川芎・釣藤鈎・当帰・柴胡・甘草", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "麻杏甘石湯", "名前": "麻杏甘石湯", "読み": "まきょうかんせきとう", "ツムラ番号": "55", "出典": "傷寒論（巻第三・弁太陽病脈証并治中第六／巻第四・弁太陽病脈証并治下第七）", "別名": "", "本文": {"条文": "### 『傷寒論』巻第三・弁太陽病脈証并治中第六\n\n**書き下し**（読み：社員案）\n\n発汗して後、更に桂枝湯を行るべからず。汗出でて喘し、大熱無き者は、麻黄杏仁甘草石膏湯を与うべし。\n\n**原文**（翻刻確認）\n\n發汗後，不可更行桂枝湯，汗出而喘，無大熱者，可與麻黃杏仁甘草石膏湯。\n\n**現代語訳**（訳：社員案）\n\n発汗させた後は、さらに桂枝湯を用いてはならない。汗が出て喘し（息が苦しくぜいぜいし）、大熱のないものには、麻黄杏仁甘草石膏湯を与えるのがよい。\n\n### 『傷寒論』巻第四・弁太陽病脈証并治下第七\n\n**書き下し**（読み：社員案）\n\n下して後、更に桂枝湯を行るべからず。若し汗出でて喘し、大熱無き者は、麻黄杏子甘草石膏湯を与うべし。\n\n**原文**（翻刻確認）\n\n下後，不可更行桂枝湯，若汗出而喘，無大熱者，可與麻黃杏子甘草石膏湯。\n\n**現代語訳**（訳：社員案）\n\n下した後は、さらに桂枝湯を用いてはならない。もし汗が出て喘し、大熱のないものには、麻黄杏子甘草石膏湯を与えるのがよい。\n\n### 関連条文（『金匱要略』水気病脈証并治第十四の杏子湯）\n\n資料が、本方は『金匱要略』にも載っているとして挙げる条。杏子湯は方名だけで構成の記載がなく、林億の注「未見恐是麻黄杏仁甘草石膏湯」（この方はまだ見ていない。おそらく麻黄杏仁甘草石膏湯であろう）がある（翻刻確認）。資料の著者は断定はできないとする。\n\n**書き下し**（読み：社員案）\n\n水の病為る、其の脈沈小なるは、少陰に属す。浮なる者は風と為す。水無く虚脹する者は気と為す。水は其の汗を発すれば即ち已ゆ。脈沈なる者は麻黄附子湯に宜し。浮なる者は杏子湯に宜し。\n\n**原文**（翻刻確認）\n\n水之為病，其脈沉小，屬少陰；浮者為風，無水虛脹者，為氣。水，發其汗即已。脈沉者宜麻黃附子湯；浮者宜杏子湯。\n\n**現代語訳**（訳：社員案）\n\n水の病で、脈が沈んで小さいものは少陰に属する。脈が浮くものは風であり、水がなくて虚ろに脹れるものは気である。水の病は発汗させればすぐに治る。脈が沈むものには麻黄附子湯がよく、浮くものには杏子湯がよい。\n\n### 注記\n- 方名は、発汗後の条では「麻黄杏仁甘草石膏湯」、下後の条では「麻黄杏子甘草石膏湯」（翻刻確認）。資料（論考❶）も原典の方名をこの2つとする\n- 下後の条は、宋本の翻刻では頭に「一六二、」の番号が付く。翻刻で付けられた条の番号とみて、本文には採らなかった（要確認）\n- 資料（論考❷）は、同じ条が弁発汗後病脈証并治第十七（方名は麻黄杏子甘草石膏湯）と弁発汗吐下後病脈証并治第二十二（「若」の字がなく、「与える」でなく「属する」の形）にも載るとする。維基文庫の宋本の翻刻はこの2篇とも見出しと1行の説明だけで本文がなく、照合できない（要原本照合）\n- 『金匱玉函経』の翻刻では、発汗後の条の方名が「麻黃杏子甘草石膏湯」、下後の条が「大下以後」で始まり方名が「麻黃杏仁甘草石膏湯」。後ろの篇には「屬麻黃杏子石膏甘草湯證」「屬麻黃杏仁石膏甘草湯證」の形の条もある（要原本照合）\n- 資料（論考⓭）は、発汗後の条の方後の最後に「本云黄耳杯」の一文があり、下後の条の側では「黄耳杯」と書かれる（資料の著者は誤写とみる）とする。維基文庫の宋本の翻刻の方後にはこの句がない（要原本照合）\n- 『金匱要略』の条は、四部叢刊本の翻刻では「属小隂」「水其汗即已」（「發」の字がない）と書かれる（要原本照合）。本文は維基文庫の通行本の字を採った。林億の注は四部叢刊本の翻刻で確かめた（翻刻確認。通行本の翻刻には注がない）", "出典": "### 原典の構成\n- 『傷寒論』（宋本）：麻黄4両（去節）、杏仁50箇（去皮尖）、甘草2両（炙）、石膏半斤（砕き、綿で裹む）（翻刻確認）\n- 『金匱玉函経』では甘草1両（炙）、杏子50枚と書かれる（要原本照合）\n\n### 原典の服用法\n- 『傷寒論』（宋本）：4味を水7升で、まず麻黄を煮て2升減らし、上の泡を去る。残りの薬を入れて2升に煮つめ、滓を去って1升を温服する（翻刻確認）\n\n### 処方の変遷\n- 麻黄湯から桂枝を去り石膏を加えた方で、越婢湯から生姜・大棗を去り杏仁を加えた方でもある（資料の記載）\n- 『備急千金要方』巻第九 傷寒上・発汗吐下後第九：維基文庫の翻刻では方名が「四物甘草湯」で、「治傷寒發汗出而喘，無大熱，與此方。」、甘草2両・麻黄4両・石膏半斤・杏仁50枚の4味を刻み、水7升でまず麻黄を煮て泡を去り2升減らし、残りの薬を入れて3升に煎じ、3回に分けて服す（翻刻確認）。資料は方名を「麻黄杏人石膏甘草湯方」とする（要原本照合）\n- 『千金翼方』巻第十 傷寒下・発汗吐下後病状第五には、発汗後の条が「麻黄杏子石膏甘草湯」の方名で載るとされる（要原本照合）\n- 『傷寒補亡論』巻第九・汗後四十四条には、発汗後に水を多く飲めば必ず喘するという条の後に、常氏の説として喘を治すには麻黄杏子石膏湯がよいとあるとされる。『赤水玄珠』巻二十六・哮喘門・明治哮では、麻黄杏子草膏湯の名で原典の2条をまとめて載せるとされる（要原本照合）\n- 『張氏医通』巻十六・祖方に「麻杏甘石湯」の名で載り、資料の著者はこれを麻杏甘石湯という方名の初出とみる（要原本照合）。『医宗金鑑』巻五十九・編輯痘疹心法要訣・疹門・喘急では「麻杏石甘湯」の名で、生甘草を用い、生姜を入れて水で煎服するとされる（要原本照合）\n- 『張氏医通』の同じ篇の杏子湯（風水で虚脹し脈浮のものを治す）は麻黄湯去桂枝で、資料は『金匱要略』雑療方第二十三の還魂湯に当たるとする（要原本照合）\n- 五虎湯は本方に桑白皮を加えた方。資料は、『仁斎直指附遺方論』巻八・喘嗽・附諸方の五虎湯（本方に細茶を加えた方）を、細茶を加えた最初とする（五虎湯の項を参照）\n- 現行エキス剤（ツムラ55）は7.5g中、石膏10.0g・杏仁4.0g・麻黄4.0g・甘草2.0g の4味（PMDA 添付文書 2023年12月改訂 第1版で確認）。添付文書に出典の欄はない", "構成": "石膏・杏仁・麻黄・甘草", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "五淋散", "名前": "五淋散", "読み": "ごりんさん", "ツムラ番号": "56", "出典": "古今医鑑（巻之八・淋閉）／万病回春（巻之四・淋証）", "別名": "", "本文": {"条文": "### 『古今医鑑』巻之八・淋閉\n\n**書き下し**（読み：社員案）\n\n五淋散　肺気不足し、膀胱に熱有り、水道通ぜず、淋瀝して出でず、或いは尿豆汁の如く、或いは砂石の如く、或いは冷淋にして膏の如く、或いは熱淋にして尿血するを治す。\n\n**原文**（翻刻確認）\n\n五淋散　治肺氣不足、膀胱有熱、水道不通、淋瀝不出、或尿如豆汁、或如砂石、或冷淋如膏、或熱淋尿血。\n\n**現代語訳**（訳：社員案）\n\n肺の気が不足し、膀胱に熱があって尿の通り道が通じず、尿がしたたるばかりで出きらないもの、あるいは尿が豆の煮汁のようなもの、砂や石のようなものが出るもの、冷えによる淋で尿が膏（あぶら）のようなもの、熱による淋で血尿が出るものを治す。\n\n### 『万病回春』巻之四・淋証\n\n**書き下し**（読み：社員案）\n\n五淋散　肺気不足し、膀胱に熱有り、水道通ぜず、淋瀝して出でず、或いは尿豆汁の如く、或いは沙石の如く、或いは冷淋にして膏の如く、或いは熱淋にして尿血するを治す。皆効あり。\n\n**原文**（翻刻確認）\n\n五淋散　治肺氣不足、膀胱有熱、水道不通、淋瀝不出、或尿如豆汁、或如沙石、或冷淋如膏、或熱淋尿血、皆效。\n\n**現代語訳**（訳：社員案）\n\n肺の気が不足し、膀胱に熱があって尿の通り道が通じず、尿がしたたるばかりで出きらないもの、あるいは尿が豆の煮汁のようなもの、砂や石のようなものが出るもの、冷えによる淋で尿が膏（あぶら）のようなもの、熱による淋で血尿が出るものを治す。いずれにも効く。\n\n### 関連条文（『古今医鑑』巻之八・淋閉の総論の冒頭）\n\n**書き下し**（読み：社員案）\n\n夫れ淋は、小便淋瀝して渋痛し、去らんと欲して去らず、去らずして又来たる、淋と曰う。\n\n**原文**（翻刻確認）\n\n夫淋者、小便淋瀝澀痛、欲去不去、不去又來、曰淋。\n\n**現代語訳**（訳：社員案）\n\nそもそも淋とは、小便がしたたるように出て渋り痛み、出そうとしても出ず、出ないのにまた尿意が来るものをいう。\n\n### 注記\n- 『古今医鑑』の翻刻（維基文庫『古今醫鑒』）は簡体字が混じる本、『万病回春』の翻刻は簡体字の本で、原文は繁体字にそろえて書いた（沥→瀝、泻→瀉、车→車、锉→剉、栀→梔、气→氣、热→熱 など）。字形の判断には使えない（要原本照合）\n- 『古今医鑑』は「砂石」、『万病回春』は「沙石」と書く（要原本照合）\n- 『万病回春』の条は、末尾に「皆效」がある（翻刻確認）\n- 2書はどちらも、6味に「一方」として生地黄（生地）・沢瀉・木通・滑石・車前子を加える記載があり、加えた11味が現行エキス剤（ツムラ）と一致する。2書の順は、資料が本方の出典に挙げる『古今医鑑』を先にした（要確認）", "出典": "### 原典の構成\n- 『古今医鑑』：赤茯苓1銭2分、赤芍薬2銭、山梔子2銭、当帰1銭、甘草5分、条黄芩6分 の6味。一方に生地黄・沢瀉・木通・滑石・車前子（各等分）を加える（翻刻確認）\n- 『万病回春』：赤茯苓6両、赤芍10両、山梔10両、当帰（去芦）5両、条芩3両、生甘草5両 の6味。一方に生地・沢瀉・木通・滑石・車前子が有る（翻刻確認）\n\n### 原典の服用法\n- 『古今医鑑』：剉んで散とし、水で煎じ、空腹時に服す（翻刻確認）\n- 『万病回春』：剉み、水で煎じ、空腹時に服す（翻刻確認）\n\n### 処方の変遷\n- 資料によれば、本方はエキス製剤のメーカー間で組成の差が最も大きい処方の一つで、『仁斎直指附遺方論』の6味（少味剤）と、『古今医鑑』の一方の5味を加えた11味（多味剤）の差である（要確認）\n- 資料によれば、『和剤局方』巻之六・積熱 附 火証に五淋散が2方ある。宝慶新増方の少味剤（赤茯苓・当帰・甘草・山梔子仁・赤芍薬の5味。「腎気不足し、膀胱に熱有り…」の条）と、続添諸局経験秘方の多味剤（上の5味から当帰を去り、淡竹葉・山茵蔯・木通・滑石を加える。茯苓・炙甘草とする）。前者は宝慶年間（1225〜1227年）、後者は淳祐年間（1241〜1252年）の収載とされる（要原本照合）\n- 資料によれば、局方の少味剤より早く、『聖済総録』巻第一百五十六・妊娠門・妊娠子淋の当帰湯（当帰・芍薬・赤茯苓・甘草・梔子仁）、『鶏峰普済方』巻第十八の山梔子湯（当帰・赤い芍薬・赤い茯苓・甘草・山梔子）、『三因極一病証方論』巻之三・脚気惣治の木通散（当帰・梔子仁・赤芍薬・赤茯苓・甘草）に同じ組み合わせがある（要原本照合）\n- 資料によれば、董汲『脚気治法総要』巻下の木通散（当帰・梔子仁・芍薬・甘草・赤茯苓・木通）は局方の少味剤に木通を加えた方で、元豊〜元祐年間（1078〜1094年）の成書とされる（要原本照合）\n- 資料によれば、黄芩の加味は『備急千金要方』巻第二十一・淋閉第二の熱淋を治す方に「熱には黄芩一両を加う」とあることに拠る（要原本照合）\n- 『仁斎直指附遺方論』巻十六・諸淋・諸淋証治の五淋散は「諸淋を治す」とし、赤茯苓（翻刻は「赤伏苓」）・赤芍薬・山梔仁・生甘草 各3分、当帰・黄芩 各2分 の6味で、今日の少味剤と同じ。細末とし1回2銭半を水で煎じて空腹時に服し、或いは五苓散と合わせて服すとする（翻刻確認）。同じ巻の後半には、局方の多味剤の五淋散（山茵蔯・淡竹葉・木通・滑石・甘草・山梔仁・赤茯苓・赤芍薬）も載る（翻刻確認）。資料は本書を本方の出典に挙げる\n- 資料によれば、『古今医鑑』巻之八・淋閉の条文と薬味は、『万病回春』巻之四・淋証に引き継がれている。翻刻では、『万病回春』は分量を両で書き、赤芍・山梔の比率が『古今医鑑』より多い（翻刻確認）\n- 現行エキス剤（ツムラ56）は7.5g中、茯苓6.0g、黄芩・滑石・甘草・地黄・車前子・沢瀉・当帰・木通 各3.0g、山梔子・芍薬 各2.0g の11味（PMDA 添付文書 2023年12月改訂 第1版で確認）。『古今医鑑』『万病回春』の6味に一方の5味を加えた構成と薬味が一致する。添付文書に出典の欄はない", "構成": "茯苓・黄芩・滑石・甘草・地黄・車前子・沢瀉・当帰・木通・山梔子・芍薬", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "清上防風湯", "名前": "清上防風湯", "読み": "せいじょうぼうふうとう", "ツムラ番号": "58", "出典": "古今医鑑（巻之九・面病）／万病回春（巻之五・面病）／寿世保元（巻六・面病）", "別名": "", "本文": {"条文": "### 『古今医鑑』巻之九・面病\n\n**書き下し**（読み：社員案）\n清上防風湯。上焦の火を清し、頭面の瘡癤、風熱の毒を治す。\n\n**原文**（翻刻確認）\n清上防風湯　清上焦火、治頭面瘡癤、風熱毒。\n\n**現代語訳**（訳：社員案）\n清上防風湯は、上焦の火（熱）を冷まし、頭や顔のできもの（瘡癤）、風熱の毒を治す。\n\n### 『万病回春』巻之五・面病\n\n**書き下し**（読み：社員案）\n面に瘡を生ずる者は、上焦の火なり。清上防風湯。上焦の火を清し、頭面に瘡癤を生ずる、風熱の毒を治す。\n\n**原文**（翻刻確認）\n面生瘡者、上焦火也。清上防風湯　清上焦火、治頭面生瘡癤、風熱之毒。\n\n**現代語訳**（訳：社員案）\n顔にできものができるのは、上焦の火（熱）によるものである。清上防風湯は、上焦の火を冷まし、頭や顔にできもの（瘡癤）ができる風熱の毒を治す。\n\n### 『寿世保元』巻六・面病\n\n**書き下し**（読み：社員案）\n一に論ず、面上の瘡なる者は、上焦の火なり。清上防風湯。\n\n**原文**（翻刻確認）\n一論面上瘡者、上焦火也。清上防風湯\n\n**現代語訳**（訳：社員案）\n一つ論じる。顔のできものは、上焦の火（熱）によるものである。清上防風湯（を用いる）。\n\n### 注記\n- 『古今医鑑』の翻刻は簡体字の本を機械的に繁体字にしたもの（繁体化）、『万病回春』の翻刻は簡体字の本で、原文は繁体字にそろえて書いた（疮→瘡、疖→癤、风热→風熱、头→頭 など）。字形の判断には使えない（要原本照合）\n- 『寿世保元』の翻刻は簡体字と繁体字が混ざる未校訂の本で、原文は繁体字にそろえて書いた（疮→瘡、防风→防風 など。要原本照合）。資料は所在を「巳集巻之六・面病」とする。翻刻は巻六・面病で、主治の文はなく病因の句と方名だけ（翻刻確認）\n- 『古今医鑑』『万病回春』の主治の文はほぼ同じで、『万病回春』は前に「面生瘡者、上焦火也」の句があり、「頭面生瘡癤」「風熱之毒」と「生」「之」の字が多い（翻刻確認）\n- 3書とも構成は同じ（甘草の量だけ違う）。順は、資料の出典欄（『古今医鑑』）に合わせて『古今医鑑』を先にし、資料の論考の順で『万病回春』『寿世保元』を続けた。添付文書に出典の欄はない（要確認）", "出典": "### 原典の構成\n- 『古今医鑑』巻之九・面病：防風1銭、荊芥5分、連翹8分、梔子5分、黄連5分、黄芩（酒炒）7分、薄荷5分、川芎7分、白芷8分、桔梗8分、枳殻5分、甘草3分（翻刻確認）\n- 『万病回春』巻之五・面病：防風1銭、荊芥5分、連翹8分、梔子5分、黄連5分、黄芩（酒炒）7分、薄荷5分、川芎7分、白芷8分、桔梗8分、枳殻5分、甘草2分（翻刻確認）\n- 『寿世保元』巻六・面病：防風1銭、荊芥5分、連翹8分、山梔5分、黄連5分、黄芩（酒炒）7分、薄荷5分、川芎7分、白芷8分、桔梗8分、枳殻5分、甘草3分（翻刻確認）\n- 甘草の量は書で異なる（『古今医鑑』『寿世保元』3分、『万病回春』2分。翻刻確認）\n\n### 原典の服用法\n- 『古今医鑑』巻之九・面病：刻んで1剤とし、水で煎じて食後に服す。竹瀝を加えるといっそう効く（翻刻確認）\n- 『万病回春』巻之五・面病：刻んで1剤とし、水で煎じて食後に服す。竹瀝1小盅を入れるといっそう効く（翻刻確認）\n- 『寿世保元』巻六・面病：刻んで1剤とし、水で煎じ、竹瀝を入れて同じく服す（翻刻確認）\n\n### 処方の変遷\n- 資料は、本方の出典は従来『万病回春』とされるが、『古今医鑑』巻之九・面病に処方内容・記載順・方後の指示も同じ方が載り、『万病回春』より早い収載であるとする（要原本照合）。翻刻では、構成の順は2書で同じで、甘草の量（3分／2分）と竹瀝の指示の書き方が異なる（翻刻確認）\n- 資料は、『寿世保元』巳集巻之六・面病、『済世全書』巻之五巽集・面病にも同名の方が竹瀝の指示とともに載るとする（要原本照合）。『寿世保元』は翻刻で同じ構成を確かめたので条文の欄に置いた。『済世全書』は翻刻を確かめていない\n- 同名異方として、資料は『御薬院方』巻之九・治咽喉口歯門の清上防風散（防風・細辛・薄荷葉・川芎・独活・荊芥穂・天麻・甘草・白檀・白芷・片脳子）を挙げ、『丹渓心法附余』巻之十二・風熱門・牙歯にも同じ方が上清防風散の名で載るとする（要原本照合）\n- 資料は、本方が防風通聖散に由来するとの考えは『増広医方口訣集』によるとし、『黄帝素問宣明論方』巻之三・風論の防風通聖散から当帰・芍薬・大黄・麻黄・芒硝・石膏・滑石・白朮・生姜を去り、黄連・枳殻・白芷を加えると本方になるとする（要原本照合）\n- 資料は、本方は一貫堂方の荊芥連翹湯から当帰・芍薬・地黄・黄柏・柴胡を去った形になるが、歴史的には逆で、2方の間に直接の関連はないとする\n- 原典の枳殻は、現行エキス剤では枳実。原典の防風は、ツムラのエキス剤では浜防風（ハマボウフウ）\n- 現行エキス剤（ツムラ）は7.5g中、黄芩・桔梗・山梔子・川芎・浜防風・白芷・連翹 各2.5g、黄連・甘草・枳実・荊芥・薄荷 各1.0g の12味（PMDA 添付文書 2023年12月改訂 第1版で確認）。添付文書に出典の欄はない", "構成": "黄芩・桔梗・山梔子・川芎・浜防風・白芷・連翹・黄連・甘草・枳実・荊芥・薄荷", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "治頭瘡一方", "名前": "治頭瘡一方", "読み": "ぢづそういっぽう", "ツムラ番号": "59", "出典": "勿誤薬室方函（巻上）／勿誤薬室方函口訣（巻之上）", "別名": "", "本文": {"条文": "### 『勿誤薬室方函』巻上・治頭瘡一方\n\n**書き下し**（要原本照合）\n\n**原文**（要原本照合）\n\n**現代語訳**\n\n### 『勿誤薬室方函口訣』巻之上・治頭瘡一方\n\n**書き下し**（要原本照合）\n\n**原文**（要原本照合）\n\n**現代語訳**\n\n### 注記\n- 『勿誤薬室方函』巻上の治頭瘡一方は「一名大芎黄湯」とされ、主治の文はなく、9味の薬味と福井家方との違いが記される（要原本照合。資料の書き下しによる）\n- 『勿誤薬室方函口訣』巻之上では、本方は頭瘡だけでなく上部・頭面の発瘡に広く用い、清上防風湯が清熱を主とするのに対し本方は解毒を主とするとされる（要原本照合。資料の書き下しによる）\n- 『勿誤薬室方函』『勿誤薬室方函口訣』の原文の翻刻は維基文庫に見当たらない（2026-10-22 検索。要原本照合）。資料には両書とも書き下しの引用だけで原文（漢文）の引用がないので、書き下し・原文・現代語訳は翻刻待ち", "出典": "### 原典の構成\n- 『勿誤薬室方函』巻上：忍冬・紅花・連翹・蒼朮・荊芥・防風・川芎・大黄・甘草 の9味（分量は資料に記載なし）。福井家方には黄芩があり、紅花・蒼朮がないとする（要原本照合）\n\n### 原典の服用法\n\n### 処方の変遷\n- 資料の出典欄は「本朝経験方」。資料は本方の出典を不詳とし、浅田宗伯が大芎黄湯として某書に収載されていた方を採り、治頭瘡一方と改名したとする（要確認）\n- 『漢方の臨牀』第10巻第2号「先哲経験実用処方選集」（石原明）は、治頭瘡一方（本朝経験）を連翹3.5・川芎・蒼朮 各3・防風・忍冬 各2・荊芥1.5・紅花・甘草・大黄 各0.5 の9味とし、一名大芎黄湯、福井楓亭は紅花と蒼朮を去り黄芩を加えるとする（要原本照合）\n- 『方読弁解』上部・頭の頭瘡験方（和方家方）は、荊芥・忍冬・連翹・黄芩・防風・川芎・大黄・甘草 の8味で、膿の多い者には蒼朮を加えるとする。資料は、本方去蒼朮・紅花加黄芩にあたるとする（要原本照合）\n- 『日本歴代名医秘方』（劉国正主編）六・皮膚科類・頭瘡は、大芎黄湯（忍冬・紅花・連翹・蒼朮・荊芥・防風・川芎・大黄・甘草。出処は竹中氏伝）と、治頭瘡一方（忍冬・黄芩・連翹・荊芥・防風・川芎・大黄・甘草。出処は福井家方）を載せる（要原本照合）\n- 同名異方：『医方類聚』巻之二十三・諸風門・抜粋方・破傷風証の大芎黄湯は川芎・羌活・黄芩・大黄の4味で、資料は宗伯の云う大芎黄湯とは同名異方とする。『仁斎直指附遺方論』『張氏医通』『日記中揀方』『牛山方考』『療治経験筆記』の大芎黄湯も破傷風の方（要原本照合）\n- 資料は、竹中家の医書（『古今養性録』『済美堂方函』『済美堂常用法方録』『済春園方函口訣』など）にも大芎黄湯は見当たらず、宗伯の云う大芎黄湯の出処は不明のままとする（要確認）\n- 現行エキス剤（ツムラ59）は7.5g中、川芎・蒼朮・連翹 各3.0g、忍冬・防風 各2.0g、甘草・荊芥・紅花 各1.0g、大黄0.5g の9味（PMDA 添付文書 2023年12月改訂 第1版で確認）。『勿誤薬室方函』の9味と同じ薬味。添付文書に出典の欄はない", "構成": "川芎・蒼朮・連翹・忍冬・防風・甘草・荊芥・紅花・大黄", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "桂枝加芍薬湯", "名前": "桂枝加芍薬湯", "読み": "けいしかしゃくやくとう", "ツムラ番号": "60", "出典": "傷寒論（巻第六・弁太陰病脈証并治第十）", "別名": "", "本文": {"条文": "### 『傷寒論』巻第六・弁太陰病脈証并治第十\n\n**書き下し**（読み：社員案）\n本太陽病、医反って之を下し、爾るに因りて腹満し時に痛む者は、太陰に属するなり。桂枝加芍薬湯之を主る。大いに実痛する者は、桂枝加大黄湯之を主る。\n\n**原文**（翻刻確認）\n本太陽病，醫反下之，因爾腹滿時痛者，屬太陰也，桂枝加芍藥湯主之；大實痛者，桂枝加大黃湯主之。\n\n**現代語訳**（訳：社員案）\nもとは太陽病であったのに、医師がかえって下したため、腹が張って時に痛むものは、太陰に属する。桂枝加芍薬湯が主治する。ひどく実して痛むものは、桂枝加大黄湯が主治する。\n\n### 注記\n- 条の後半（大いに実痛する者）は桂枝加大黄湯の条で、同じ条にまとめて書かれている（翻刻確認）\n- 『金匱玉函経』巻第四・弁太陰病形証治第七の翻刻では、同じ条が「太陽病，醫反下之，因爾腹滿時痛者，屬太陰也，桂枝加芍藥湯主之。大實痛者，桂枝加大黃湯主之。」で、冒頭の「本」がない（翻刻確認）\n- 『金匱玉函経』巻第六・弁発汗吐下後病形証治第十九の翻刻では「太陽病，醫反下之，因腹滿時痛，為屬太陰，屬桂枝加芍藥湯證，其大實痛，屬桂枝加大黃湯證。」と書かれ、「爾」がなく「為屬太陰」となる（要原本照合）\n- 宋本の巻第十・弁発汗吐下後脈証并治第二十二に再掲された方は「第二巻の桂枝湯方の内に、更に芍薬三両を加え、前に随いて共に六両、余は桂枝湯の法に依る」と書かれる（要原本照合）", "出典": "### 原典の構成\n- 『傷寒論』（宋本）：桂枝3両（去皮）、芍薬6両、甘草2両（炙）、生姜3両（切）、大棗12枚（擘）（翻刻確認）\n- 『金匱玉函経』巻第七・方薬炮製（桂枝倍加芍薬湯方第十二）：桂枝3両、芍薬6両、生姜3両、甘草2両（炙）、大棗12枚（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』（宋本）：5味を水7升で煮て3升を取り、滓を去って、温めて3回に分けて服す。もとは桂枝湯で、今芍薬を加えたもの、と添える（翻刻確認）\n- 『金匱玉函経』：5味を㕮咀し、水7升で煮て3升を取り、滓を去って1升を温服する。もとは桂枝湯で、今芍薬を加えて用いる、と添える（翻刻確認）\n\n### 処方の変遷\n- 桂枝湯と同じ構成で、芍薬を倍にしたもの（翻刻確認）\n- 『金匱玉函経』では桂枝倍加芍薬湯の名で載る（翻刻確認）\n- 『傷寒総病論』巻第一・太陰証では、条文は同じで方名が桂枝芍薬湯とされる（要原本照合）\n- 『三因極一病証方論』巻之四・傷風証治の桂枝芍薬湯は、桂心半両・白芍薬3両を姜棗で煎服する方で、甘草を含まない（要原本照合）\n- 現行エキス剤（ツムラ60）は 芍薬・桂皮・大棗・甘草・生姜 の5味で、1日量7.5g中 シャクヤク6.0・ケイヒ4.0・タイソウ4.0・カンゾウ2.0・ショウキョウ1.0（g）の混合生薬の乾燥エキスを含む（PMDA 添付文書 2023年12月改訂 第1版で確認）。原典の「桂枝」は、添付文書では「ケイヒ」と書かれる", "構成": "芍薬・桂皮・大棗・甘草・生姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "桃核承気湯", "名前": "桃核承気湯", "読み": "とうかくじょうきとう", "ツムラ番号": "61", "出典": "傷寒論（弁太陽病脈証并治中第六）", "別名": "", "本文": {"条文": "### 『傷寒論』弁太陽病脈証并治中第六\n\n**書き下し**（読み：社員案）\n太陽病解せず、熱膀胱に結し、其の人狂の如し。血自ら下る、下る者は愈ゆ。其の外解せざる者は、尚未だ攻むべからず。当に先ず其の外を解すべし。外解し已りて、但だ少腹急結する者は、乃ち之を攻むべし。桃核承気湯に宜し。\n\n**原文**（翻刻確認）\n太陽病不解、熱結膀胱、其人如狂、血自下、下者愈。其外不解者、尚未可攻、當先解其外。外解已、但少腹急結者、乃可攻之、宜桃核承氣湯。\n\n**現代語訳**（訳：社員案）\n太陽病が解けず、熱が膀胱に結ぼれると、その人は狂ったようになる。血が自然に下ることがあり、下った者は治る。その外（表の証）がまだ解けていない者は、まだ攻めてはならない。まず外を解くべきである。外が解けたのち、ただ下腹部がひきつれて結ぼれる（少腹急結）者は、そこで初めてこれを攻めてよい。桃核承気湯がよい。\n\n### 注記\n- 資料は、条の後に小字の注「後に云く、外を解するは桂枝湯に宜し」を引く。維基文庫の宋本の翻刻にはこの注が載っていない（要原本照合）\n- 資料は原典の方の生薬を「芒消」と書く。翻刻は「芒硝」。本文は翻刻の字を採った（要原本照合）\n- 資料は、方後の文の最後に「当に微しく利すべし」とあるとする。翻刻の方後の文の「當微利」と一致する\n- 篇名は、維基文庫の翻刻では「辨太陽病脈證並治（中）第六」", "出典": "### 原典の構成\n- 『傷寒論』：桃仁50箇（皮尖を去る）、大黄4両、桂枝2両（皮を去る）、甘草2両（炙）、芒硝2両（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』：5味を水7升で煮て2升半を取り、滓を去る。芒硝を入れ、さらに火にかけて微かに沸かし、火から下ろす。食前に5合を温服し、1日3回服す。微かに下痢するはずである（翻刻確認）\n\n### 処方の変遷\n- 本方は調胃承気湯に桃仁・桂皮を加えた方とされる。また大黄牡丹皮湯から牡丹皮・冬瓜子を去り、桂皮・甘草を加えた方でもあるとされる（要原本照合）\n- 後世の書では「桃仁承気湯」「桃人承気湯」の名でも載るとされる。『太平聖恵方』巻第十一・治傷寒心狂熱諸方の桃人承気湯は、桃人・川大黄・桂心・甘草・川芒硝を生姜を入れて煎じる方とされる（要原本照合）\n- 『傷寒総病論』巻第二・可下証（血証附）の桃仁承気湯には、産後に悪露が下らず喘脹して死にそうなものを治すとあり、産後の薬としても用いられたとされる（要原本照合）\n- 『聖済総録』巻第一百五十一・婦人血気門・婦人月水不利の桃仁湯（桃仁・乾姜・芍薬・当帰・芒硝・呉茱萸・大黄・甘草・桂）は、本方の5味をすべて含むとされる（要原本照合）\n- 『外科発揮』巻八・杖瘡には、桃仁承気湯に蘇木・紅花を加えた用い方が載るとされる（要原本照合）\n- 『温疫論』上巻・畜血の桃仁承気湯は、大黄・芒硝・桃仁・当帰・芍薬・丹皮の方で、本方とは名が同じで構成が異なるとされる（要原本照合）\n- 『腹証奇覧』下冊・上冊分量考の桃軍円は、大黄・桃仁・桂枝・甘草・芒硝・蕎麦を末とし練蜜で丹とした方で、傷寒論の桃仁承気湯であるとされる（要原本照合）\n- 医療用エキス剤は、ツムラ桃核承気湯エキス顆粒（医療用）（1日量7.5g中、日局トウニン5.0g・日局ケイヒ4.0g・日局ダイオウ3.0g・日局カンゾウ1.5g・日局無水ボウショウ0.9g。識別コード ツムラ／61。PMDA 添付文書 2023年12月改訂 第1版で確認）。原典の桂枝は添付文書では桂皮（ケイヒ）、芒硝は無水芒硝（無水ボウショウ）", "構成": "桃仁・桂皮・大黄・甘草・無水芒硝", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "防風通聖散", "名前": "防風通聖散", "読み": "ぼうふうつうしょうさん", "ツムラ番号": "62", "出典": "黄帝素問宣明論方（巻三・風論）", "別名": "", "本文": {"条文": "### 『黄帝素問宣明論方』巻三・風論\n\n**書き下し**（読み：社員案）\n又曰く、風寒熱は諸疾の始めて生ずるなり。人の藏府に皆風の起こるは、火熱を謂う、陽の本なり。曲直動揺を謂うは、風の用なり。眩運・嘔吐は、風熱の甚だしきを謂うなり。夫れ風熱拂鬱は、風大いに熱より生じ、熱を以て本と為して風を標と為す。風の風と言うは、即ち風熱の病なり。気壅滞し、筋脈拘倦し、肢体焦痿し、頭目昏眩し、腰脊強痛し、耳鳴り鼻塞がり、口苦く舌乾き、咽嗌利せず、胸膈痞悶し、咳嘔喘満し、涕唾稠粘し、腸胃燥熱して結し、便溺淋閉し、或いは夜臥して寝汗し、咬牙睡語し、筋惕驚悸し、或いは腸胃拂鬱して結し、水夜（水液）周身に浸潤すること能わずして、但だ小便多く出づるを為す者、或いは湿熱内に鬱して時に汗洩るること有る者、或いは液を亡うに因りて燥を成し淋閉する者、或いは腸胃燥鬱するに因りて水液外に宣行すること能わず、反って停湿を以て泄し、或いは燥湿往来して時に結し時に泄する者、或いは表の陽如（陽和）し、正気（衛気是れなり）邪熱と相合して裏に并入し、陽極まりて陰に似て戦して煩渇する者（熱、寒に間わる故に戦し、裏熱甚だしければ則ち渇す）、或いは虚気久しく已まざる者（経に言う、邪熱、衛気と并びて裏に入れば則ち寒戦し、并びて之を表に出づれば則ち発熱す。大（合）すれば則ち病作り、離るれば則ち病已む）、或いは風熱走注して疼痛・麻痺する者、或いは腎水の真陰衰虚し、心火の邪熱暴かに甚だしくして僵仆し、或いは卒中して久しく語らず、或いは一切の暴瘖にして語らず、語りて声を出ださず、或いは暗風癇の者、或いは洗頭風、或いは破傷、或いは中風の諸潮搐、并びに小児の諸疳の積熱、或いは驚風積熱、傷寒疫癘にして能く辨ずる者、或いは熱甚だしく怫結して反って出づること快からざる者、或いは熱して黒陥し将に死せんとするもの、或いは大人小児の風熱瘡疥、及び久しく愈えざる者、或いは頭に屑を生じ、徧身黒黧・紫白の斑駁、或いは面鼻に紫赤の風刺・癮疹を生じ、俗に呼びて肺風と為す者、或いは風癘を成し、世に伝えて大風疾と為す者、或いは腸風痔漏、并びに酒過の熱毒を解し、兼ねて諸邪に傷らるる所を解利し、及び傷寒未だ発汗せず頭項身体疼痛する者を調理し、并びに両感の諸証、兼ねて産後の血液損虚し、以て陰気衰残し、陽気鬱すること甚だしきを致して諸熱証を為し、腹満渋痛、煩渇喘悶、譫妄驚狂し、或いは熱極まりて風を生じて熱燥鬱し、舌強ばり口噤み、筋惕肉瞤し、一切の風熱燥証、鬱して悪物下らず、腹満樶痛（撮痛）して昏する者を治す（悪物過多にして吐せざる者は、之を服するに宜しからず）。兼ねて大小の瘡及び悪毒を消除し、兼ねて堕馬・打撲の傷損痛疼、或いは因りて熱結し大小便渋滞して通ぜず、或いは腰腹急痛し、腹満喘悶する者を治す。\n\n**原文**（翻刻確認）\n又曰、風寒熱諸疾之始生也。人之藏府皆風之起、謂火熱陽之本也。謂曲直動揺風之用也。眩運嘔吐謂風熱之甚也。夫風熱拂鬱、風大生於熱、以熱為本而風為標、風言風者即風熱病也。気壅滞、筋脈拘倦、肢体焦痿、頭目昏眩、腰脊強痛、耳鳴鼻塞、口苦舌乾、咽嗌不利、胸膈痞悶、咳嘔喘満、涕唾稠粘、腸胃燥熱結、便溺淋閉、或夜臥寝汗、咬牙睡語、筋惕驚悸、或腸胃拂鬱結、水夜不能浸潤於周身、而但為小便多出者、或湿熱内鬱而時有汗洩者、或因亡液而成燥淋閉者、或因腸胃燥鬱、水液不能宣行於外、反以停湿而泄、或燥湿往来而時結時泄者、或表之陽如正気（衛気是也）与邪熱相合、并入於裏、陽極似陰而戦煩渇者（熱間寒故戦、裏熱甚則渇）、或虚気久不已者（経言邪熱与衛気并入於裏則寒戦也、并出之於表則発熱、大則病作、離則病已）、或風熱走注疼痛麻痺者、或腎水真陰衰虚、心火邪熱暴甚而僵仆、或卒中久不語、或一切暴瘖而不語、語不出声、或暗風癇者、或洗頭風、或破傷、或中風諸潮搐、并小児諸疳積熱、或驚風積熱、傷寒疫癘而能辨者、或熱甚怫結而反出不快者、或熱黒陥将死、或大人小児風熱瘡疥及久不愈者、或頭生屑、徧身黒黧紫白斑駁、或面鼻生紫赤風刺癮疹、俗呼為肺風者、或成風癘、世伝為大風疾者、或腸風痔漏、并解酒過熱毒、兼解利諸邪所傷、及調理傷寒未発汗、頭項身体疼痛者、并両感諸証、兼治産後血液損虚、以致陰気衰残、陽気鬱甚、為諸熱証、腹満渋痛、煩渇喘悶、譫妄驚狂、或熱極生風而熱燥鬱、舌強口噤、筋惕肉瞤、一切風熱燥証、鬱而悪物不下、腹満樶痛而昏者（悪物過多而不吐者不宜服之）、兼消除大小瘡及悪毒、兼治堕馬打撲傷損痛疼、或因而熱結、大小便渋滞不通、或腰腹急痛、腹満喘悶者。\n\n**現代語訳**（訳：社員案）\nまた（経に）いう。風・寒・熱は、もろもろの病が初めて生じるもとである。人の臓腑にみな風が起こるのは火熱のことで、陽の本である。曲がったり伸びたり動き揺れたりするのは、風のはたらきである。めまいや嘔吐は、風熱が甚だしいことをいう。そもそも風熱が鬱して滞るのは、風が大いに熱から生じるもので、熱を本とし風を標とする。風を風というのは、すなわち風熱の病である。気が塞がって滞り、筋脈がひきつって疲れ、手足や体がやせ衰え、頭や目がくらんでめまいがし、腰や背骨がこわばって痛み、耳鳴りがして鼻が詰まり、口が苦く舌が乾き、のどの通りが悪く、胸がつかえて苦しく、咳・嘔吐・喘鳴・膨満があり、鼻水や唾が粘り、腸胃が乾いて熱をもち便が固まり、大小便が出にくく、あるいは夜寝て寝汗をかき、歯ぎしりや寝言があり、筋がぴくつき驚いて動悸がするもの。あるいは腸胃が鬱して便が固まり、水液が全身を潤せず、ただ小便が多く出るもの。あるいは湿熱が内にこもって時に汗が漏れるもの。あるいは津液を失って乾燥し、小便が出にくいもの。あるいは腸胃が乾いて鬱し、水液が外へめぐらず、かえって湿が停まって下痢し、あるいは乾燥と湿が行き来して便が固まったり下痢したりするもの。あるいは表の陽気がやわらぎ、正気（衛気のこと）が邪熱と合わさって裏に入り、陽が極まって陰に似て震え、煩わしく口が渇くもの（熱に寒が混じるので震え、裏の熱が甚だしいと渇く）。あるいは虚した気が長く治まらないもの（経に、邪熱と衛気がともに裏に入ると寒けがして震え、ともに表に出ると発熱するという。合わされば病が起こり、離れれば病はやむ）。あるいは風熱があちこちに流れて痛みやしびれがあるもの。あるいは腎水の真陰が衰え、心火の邪熱が急に甚だしくなって倒れるもの、あるいは卒中して長く言葉が出ないもの、あるいはあらゆる急な失声で話せず、話しても声が出ないもの、あるいは暗風癇のもの、あるいは洗頭風、あるいは破傷風、あるいは中風のひきつけ、ならびに小児の疳による積熱、あるいは驚風の積熱、傷寒や疫病で見分けのつくもの、あるいは熱が甚だしく鬱結して（発疹が）かえって出きらないもの、あるいは熱で（発疹が）黒く陥没して死にそうなもの、あるいは大人・小児の風熱による瘡や疥で長く治らないもの、あるいは頭にふけが出て、全身に黒ずみや紫・白のまだらがあるもの、あるいは顔や鼻に紫赤色の吹き出物や発疹ができ、俗に肺風と呼ぶもの、あるいは癘風となり、世に大風疾と伝えるもの、あるいは腸風・痔漏。あわせて飲酒過多の熱毒を解し、もろもろの邪に傷られたものを解して通じ、傷寒でまだ発汗しておらず頭・うなじ・体が痛むものを整え、両感の諸証も治す。また、産後に血液が損なわれて虚し、陰気が衰え陽気が甚だしく鬱して諸熱証となり、腹が張って渋るように痛み、煩わしく渇き、喘いで苦しみ、うわごとを言って驚き狂うもの、あるいは熱が極まって風を生じ、熱と乾燥が鬱して、舌がこわばり口を噛みしめ、筋がぴくつき肉がひきつるもの、あらゆる風熱燥の証で、鬱して悪露が下りず、腹が張ってつまむように痛み意識がもうろうとするものを治す（悪露が多すぎて吐かないものは服用すべきでない）。また、大小の瘡や悪毒を消し去り、落馬や打撲による損傷の痛み、あるいはそれによって熱が結し大小便が滞って出ないもの、あるいは腰や腹が急に痛み、腹が張って喘いで苦しむものを治す。\n\n### 注記\n- 原文は四庫全書本『宣明方論』巻三（金・劉完素撰）の翻刻による。句読点は社員が付けた。字体は新字体にした（隂→陰、强→強、澁→渋、觔→筋、氣→気、滿→満、證→証など）。簡体字の翻刻（『黄帝素問宣明論方』）とも照合した\n- 「眩運」「頭目昏眩」の「眩」、「筋惕驚悸」の「惕」は、四庫全書本の翻刻では外字（表示できない字）で書かれる。簡体字の翻刻と資料の書き下しにより「眩」「惕」とした（要原本照合）\n- 「水夜」は、簡体字の翻刻では「水液」と書かれ、資料の書き下しも「水液」（要原本照合）\n- 「表之陽如正気」の「如」は、簡体字の翻刻では「和」と書かれ、資料の書き下しも「陽和して」（要原本照合）\n- 「大則病作」の「大」は、簡体字の翻刻では「合」と書かれる（要原本照合）\n- 「熱間寒故戦」は、簡体字の翻刻では「表気寒故戦」と書かれる（要原本照合）\n- 「腹満樶痛」の「樶」は、簡体字の翻刻では「撮」と書かれ、資料の書き下しも「撮痛」（要原本照合）\n- 「拂鬱」は、簡体字の翻刻と資料の書き下しでは「怫鬱」と書かれる（要原本照合）\n- 「傷損痛疼」は、簡体字の翻刻と資料の書き下しでは「疼痛」と書かれる（要原本照合）\n- 「或熱黒陥将死」の「熱」は、簡体字の翻刻では「痘」と書かれる（要原本照合）。資料の書き下しは「熱にて」\n- 「舌強口噤」の「噤」は、簡体字の翻刻では「禁」と書かれる（要原本照合）\n- 「咬牙」は、簡体字の翻刻では「切牙」と書かれる（要原本照合）\n- 「人之藏府」は、簡体字の翻刻では「人之腑腑」と書かれる（要原本照合）\n- 小字の注「衛気是也」「熱間寒故戦…」「経言…」「悪物過多…」は資料の書き下しにはない（翻刻確認）\n- 資料の引用は、この条の前の「経曰、風者百病之首也。其変化乃為他病無常、皆風気所発也」から「……」で略して始まる。この句は四庫全書本の翻刻では「其變乃乃為他病」と書かれ、簡体字の翻刻では「其变化，乃为他病」（要原本照合）\n- 『宣明論方』では、この主治の文の後に方名と方が置かれる（翻刻確認）", "出典": "### 原典の構成\n- 『黄帝素問宣明論方』巻三・風論：防風・川芎・当帰・芍薬・大黄・薄荷葉・麻黄・連翹・芒硝 各半両、石膏・黄芩・桔梗 各1両、滑石3両、甘草2両、荊芥・白朮・梔子 各1分（翻刻確認）\n- 芒硝の下の小字の注は、四庫全書本の翻刻では「已上各半兩兩朴朴者」、簡体字の翻刻では「朴硝是者。以上各半两」と書かれる（要原本照合）\n- 「白朮」の「朮」は、両方の翻刻とも簡体字と同じ字形の「术」（くさかんむりのない字）で書かれる（要原本照合）\n\n### 原典の服用法\n- 『黄帝素問宣明論方』巻三・風論：末とし、1回2銭を、水1大盞に生姜3片を入れて6分に煎じ、温服する。涎嗽には半夏半両（姜製）を加える（翻刻確認）\n\n### 処方の変遷\n- 原典では本方に続いて、賈同知通聖散（芒硝なし・縮砂なし）、崔宣武通聖散（麻黄・芒硝なし、縮砂あり）、劉庭瑞通聖散（「此の方は縮砂有りて芒硝無し、其の余は皆同じ」）の3つの通聖散が載る（翻刻確認）\n- 「賈同知通聖散」は、簡体字の翻刻では「曹同知通聖散」と書かれ、黄芩がない。四庫全書本の翻刻では「黄苓」と書かれる（要原本照合）\n- 本方は調胃承気湯（大黄・甘草・芒硝）と桔梗石膏をそのまま含むとされる。調胃承気湯の出典は『傷寒論』、涼膈散の出典は『太平恵民和剤局方』巻之六・積熱 附 火証とされる（要原本照合）\n- 『玉機微義』巻之九・熱門には、調胃承気湯に連翹・梔子・薄荷・黄芩を加えたものが涼膈散で、劉完素（河間）がさらに涼膈散に防風・川芎・当帰・芍薬・麻黄・石膏・桔梗・滑石・荊芥・白朮を加えて防風通聖散としたとする記載があるとされる（要原本照合）\n- 『傷寒直格方』巻下・汗後には、防風通聖散に益元散（滑石・甘草）を合わせた双解散が載るとされる（要原本照合）\n- 現行エキス剤（ツムラ62）は 滑石・黄芩・甘草・桔梗・石膏・白朮・大黄・荊芥・山梔子・芍薬・川芎・当帰・薄荷・防風・麻黄・連翹・無水芒硝・生姜 の18味で、原典の17味に煎じるときの生姜を加えた構成。原典の芒硝は、添付文書では無水芒硝（無水ボウショウ）（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "滑石・黄芩・甘草・桔梗・石膏・白朮・大黄・荊芥・山梔子・芍薬・川芎・当帰・薄荷・防風・麻黄・連翹・無水芒硝・生姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "五積散", "名前": "五積散", "読み": "ごしゃくさん", "ツムラ番号": "63", "出典": "理傷続断方（医治整理補接次第口訣）／太平恵民和剤局方（巻之二・傷寒 附 中暑）", "別名": "", "本文": {"条文": "### 『理傷続断方』医治整理補接次第口訣\n\n**書き下し**（読み：社員案）\n\n五労七傷を治す。凡そ傷を被りて頭痛し、風に傷られて寒を発するには、姜にて二銭を煎じ、仍お葱白を入れ、食後に熱服す。\n\n**原文**（翻刻確認）\n\n治五勞七傷、凡被傷頭痛、傷風發寒、薑煎二錢、仍入葱白、食後熱服。\n\n**現代語訳**（訳：社員案）\n\n五労七傷を治す。およそ外傷を受けて頭痛し、風にあたって寒けがするものには、生姜とともに2銭を煎じ、さらに葱白を入れて、食後に熱いうちに服す。\n\n### 『太平恵民和剤局方』巻之二・傷寒 附 中暑\n\n**書き下し**（読み：社員案）\n\n中を調え気を順らし、風冷を除き、痰飲を化す。脾胃の宿冷、腹脇脹痛、胸膈の停痰、嘔逆悪心、或いは外は風寒に感じ、内は生冷に傷られ、心腹痞悶し、頭目昏痛し、肩背拘急し、肢体怠惰し、寒熱往来し、飲食進まざるを治す。及び婦人の血気調わず、心腹撮痛し、経候匀わず、或いは閉じて通ぜざるに、並びに宜しく之を服すべし。\n\n**原文**（翻刻確認）\n\n調中順氣、除風冷、化痰飲。治脾胃宿冷、腹脇脹痛、胸膈停痰、嘔逆惡心、或外感風寒、内傷生冷、心腹痞悶、頭目昏痛、肩背拘急、肢體怠惰、寒熱往來、飲食不進、及婦人血氣不調、心腹撮痛、經候不匀、或閉不通、並宜服之。\n\n**現代語訳**（訳：社員案）\n\n中焦（脾胃）を調え、気の巡りを順にし、風冷を除き、痰飲を除く。脾胃に長く冷えがあって腹や脇が張って痛む、胸膈に痰が停滞する、嘔逆・悪心がある、あるいは外から風寒に感じ、内には生もの・冷たいものに傷られて、心腹がつかえて苦しく、頭や目がくらんで痛み、肩や背がひきつり、手足や体がだるく、寒熱が往来し、飲食が進まないものを治す。また婦人の血気が調わず、心腹がひきつるように痛み、月経が不順であったり、閉じて通じないものにも、いずれもこれを服するのがよい。\n\n### 注記\n- 『理傷続断方』の翻刻（維基文庫『仙授理傷續斷秘方』）は簡体字の本で、原文は繁体字にそろえて書いた（伤→傷、发→發、姜→薑、钱→錢、后→後、热→熱 など）。字形の判断には使えない（要原本照合）\n- 『理傷続断方』の「五勞」は、翻刻では「五痨」（癆の簡体字）。資料は「五労」で、本文は資料の字にした（要原本照合）\n- 『理傷続断方』の条の「凡被傷頭痛」は、資料の引用では読みが異なり、「被」の字の有無を含めて要原本照合\n- 『和剤局方』の「經候」の「候」は、翻刻（四庫全書本）では外字（SKchar 1974）で示されている。資料の書き下しの「経候」の字を本文に置いた（要原本照合）\n- 2書の順は、資料の出典欄（『理傷続断方』）を先にした。どちらの書の構成も現行エキス剤（ツムラ）とは一致しない（要確認）", "出典": "### 原典の構成\n- 『理傷続断方』：蒼朮・桔梗 各20両、枳殻・陳皮 各6両、芍薬・白芷・川芎・当帰（川帰）・甘草・肉桂・茯苓…（翻刻確認。翻刻の行は「茯苓半？」で崩れていて、以下の薬味と芍薬以下の分量は読めない）。資料は、本書の方を標準の15味（蒼朮・桔梗・陳皮・白芷・甘草・当帰・川芎・芍薬・茯苓・半夏・麻黄・乾姜・枳殻・肉桂・厚朴）とし、大棗・白朮はないとする（要原本照合）\n- 『和剤局方』：陳橘皮（白を去る）・枳殻（瓤を去り麩炒）・麻黄（根節を去る）各6両、白芍薬・川芎・当帰（蘆を去り洗う）・甘草（炙り刻む）・茯苓（皮を去る）・半夏（湯で7回洗う）・肉桂（粗皮を去る）・白芷 各5両、厚朴（粗皮を去る）・乾姜（炮）各4両、桔梗（蘆を去る）12両、蒼朮（よく洗い皮を去る）24両 の15味（翻刻確認。「各5両」がどの薬味までにかかるかは要確認）\n\n### 原典の服用法\n- 『理傷続断方』：枳殻・桂の2味を除き、残りを細かく刻んで慢火で炒り、色が変わったら広げて冷まし、枳殻・桂を入れて均一にする。1回3銭を水1盞・生姜3片で半盞に煎じ、熱服する。条文には、姜で2銭を煎じ、さらに葱白を入れて食後に熱服するとある（翻刻確認）\n- 『和剤局方』：肉桂・枳殻を除く13味を粗末にし、慢火で色が変わるまで炒って広げて冷まし、次に肉桂・枳殻の末を入れて均一にする。1回3銭を水1盞半・生姜3片で1中盞に煎じ、滓を去ってやや熱いうちに服す。冷気が心脇に突き上げ臍腹が張って刺すように痛む、反胃嘔吐、泄痢清穀、痃癖癥瘕、膀胱・小腸の気痛には煨生姜3片・塩少許を入れて煎じる。傷寒時疫で頭痛・体痛・悪風・発熱・項背強痛には葱白3寸・豉7粒を入れて煎じる。悪寒だけを覚え、あるいは身はあまり熱くなく肢体拘急し、あるいは手足厥冷するには炒茱萸7粒・塩少許を入れて煎じる。寒熱が調わず咳嗽喘満するには棗を入れて煎じる。婦人の難産には酢1合を入れて煎じる。いずれも時を問わない（翻刻確認）\n- 『和剤局方』の翻刻（四庫全書本）は「別為麄木外」と書く（「末」の誤りとみられるが要原本照合）\n\n### 処方の変遷\n- 資料は、多くの書が本方の出典を『和剤局方』とするが、出典としては唐代の『理傷続断方』医治整理補接次第口訣まで遡るとする（要原本照合）。翻刻の『仙授理傷續斷秘方』は唐代・藺道人の書とされる\n- 資料によれば、『理傷続断方』の後、王袞『博済方』巻二・諸気（人参が入り、生姜・大棗・白朮はない）と、その約30年後の蘇軾・沈括『蘇沈良方』巻三にも五積散が載り、『和剤局方』は『蘇沈良方』から収録したと思われる（要原本照合）\n- 資料によれば、『和剤局方』の五積散は局方原書五巻本に属し、大観年間（1107〜1110年）に収載されていた（要確認）\n- 原典から『和剤局方』までの服用法は、一部の薬味を除いて慢火で炒る調剤法で、これを熟料五積散という。炒らずにそのまま煎じる今日の一般的な方法を生料五積散といい、生料を最初に処方したのは王碩『易簡方』とされる（要原本照合）\n- 資料の表8によれば、原典から『和剤局方』までは、最も少ない芍薬などに比べて蒼朮が6.7〜20倍、桔梗が4〜10倍と、蒼朮の配合量が際立って多い（要原本照合）\n- 現行エキス剤（ツムラ63）は7.5g中、蒼朮3.0g、陳皮・当帰・半夏・茯苓 各2.0g、甘草・桔梗・枳実・桂皮・厚朴・芍薬・生姜・川芎・大棗・白芷・麻黄 各1.0g の16味（PMDA 添付文書 2023年12月改訂 第1版で確認）。原典の枳殻が枳実に替わり、乾姜は入らず、原典の構成にない大棗が入る。添付文書に出典の欄はない", "構成": "蒼朮・陳皮・当帰・半夏・茯苓・甘草・桔梗・枳実・桂皮・厚朴・芍薬・生姜・川芎・大棗・白芷・麻黄", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "炙甘草湯", "名前": "炙甘草湯", "読み": "しゃかんぞうとう", "ツムラ番号": "64", "出典": "傷寒論（弁太陽病脈証并治下第七）、金匱要略（血痺虚労病脈証并治第六・肺痿肺癰咳嗽上気病脈証并治第七。附方、千金翼方・外台秘要方の引用）", "別名": "", "本文": {"条文": "### 『傷寒論』弁太陽病脈証并治下第七\n\n**書き下し**（読み：社員案）\n傷寒、脈結代し、心動悸するは、炙甘草湯之を主る。\n\n**原文**（翻刻確認）\n傷寒、脈結代、心動悸、炙甘草湯主之。\n\n**現代語訳**（訳：社員案）\n傷寒で、脈が結代し（拍動がときどき途切れ）、心臓が動悸するものは、炙甘草湯がこれを主治する。\n\n### 『金匱要略』血痺虚労病脈証并治第六・附方（『千金翼』炙甘草湯）\n\n**書き下し**（読み：社員案）\n『千金翼』炙甘草湯（一に復脈湯と云う）。虚労不足、汗出でて悶え、脈結して悸し、行動常の如くなるも、百日を出でず、危急なる者は十一日にして死するを治す。\n\n**原文**（翻刻確認）\n《千金翼》炙甘草湯（一云復脈湯）。治虛勞不足、汗出而悶、脈結悸、行動如常、不出百日、危急者十一日死。\n\n**現代語訳**（訳：社員案）\n『千金翼方』の炙甘草湯（復脈湯ともいう）。虚労で体力が足りず、汗が出て胸苦しく、脈が結して動悸がし、ふだんの動作はいつもどおりにできていても、百日もたたずに、危急なものは十一日で死ぬ。これを治す。\n\n### 『金匱要略』肺痿肺癰咳嗽上気病脈証并治第七・附方（『外台』炙甘草湯）\n\n**書き下し**（読み：社員案）\n『外台』炙甘草湯。肺痿、涎唾多く、心中温温液液たる者を治す。\n\n**原文**（翻刻確認）\n《外臺》炙甘草湯。治肺痿涎唾多、心中溫溫液液者。\n\n**現代語訳**（訳：社員案）\n『外台秘要方』の炙甘草湯。肺痿で、よだれやつばが多く、胸のうちが温温液液とする（解釈は注記を参照）ものを治す。\n\n### 注記\n- 『傷寒論』の条は、維基文庫の宋本の翻刻・『注解傷寒論』の四庫全書本（書名『傷寒論注釋』）巻四で字が同じ（翻刻確認。脈／脉の字体の差のみ）。宋本の翻刻の条番号は一七七\n- 『金匱玉函経』では「心動悸」が「心中驚悸」と書かれる（要原本照合）。本文は宋本の字を採った\n- 方名の別名：宋本の翻刻の方後は「一名複脈湯」と書くが、同じ翻刻は「若複服」「複取微似汗」など「復」にあたる字を広く「複」と書いている。『傷寒論注釋』巻四は「一名復脉湯」、『金匱要略』の附方は「一云復脈湯」と書くので、「復脈湯」を採った（要原本照合）\n- 『千金翼』炙甘草湯の条の「十一日」は、資料が引く『千金翼方』巻第十五・五蔵気虚第五の復脈湯の条では「二十一日」と書かれる（要原本照合）\n- 「温温液液」の解釈は注釈書によって分かれる。現代語訳では語を訳さずに残した\n- 『金匱要略』の外台炙甘草湯は、維基文庫の翻刻では主治の文だけで、構成・服用法の記載がない（翻刻確認）\n- 麦門冬の分量は、維基文庫の宋本の翻刻だけ「半斤」と書かれる。『傷寒論注釋』巻四・『金匱玉函経』・『金匱要略』の附方はいずれも「半升」で、原典の構成は半升とした（要原本照合）\n- 生地黄の「酒洗」は宋本の翻刻にだけあり、『傷寒論注釋』巻四・『金匱玉函経』にはない（翻刻確認）。麻仁は『傷寒論注釋』巻四・『金匱玉函経』では「麻子仁」と書かれる（要原本照合）\n- 服用法の「清酒」は、『金匱玉函経』と『金匱要略』の附方では「酒」と書かれる（要原本照合）", "出典": "### 原典の構成\n- 『傷寒論』：甘草4両（炙）、生姜3両（切）、人参2両、桂枝3両（去皮）、生地黄1斤（酒洗）、阿膠2両、麦門冬半升（去心）、麻仁半升、大棗30枚（擘）（翻刻確認。麦門冬の分量の異同は条文の注記を参照）\n- 『金匱要略』血痺虚労病第六・附方（『千金翼』炙甘草湯）：甘草4両（炙）、桂枝・生姜 各3両、麦門冬半升、麻仁半升、人参・阿膠 各2両、大棗30枚、生地黄1斤（翻刻確認）\n- 『金匱要略』肺痿肺癰咳嗽上気病第七・附方（『外台』炙甘草湯）：構成の記載なし（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』：9味を清酒7升・水8升で、まず阿膠を除く8味を煮て3升を取り、滓を去り、阿膠を入れて溶かし尽くし、1升を温服する。日に3回服す。一名を復脈湯という（翻刻確認）\n- 『金匱要略』血痺虚労病第六・附方（『千金翼』炙甘草湯）：9味を酒7升・水8升で、まず8味を煮て3升を取り、滓を去り、膠を入れて溶かし尽くし、1升を温服する。日に3回服す（翻刻確認）\n\n### 処方の変遷\n- 『傷寒論』では一名を復脈湯という。『金匱要略』では『千金翼方』『外台秘要方』から引いた附方として2か所に載る（翻刻確認）\n- 『千金翼方』巻第九・傷寒上・太陽病雑療法第七に、『傷寒論』と同じ条の炙甘草湯が載り、甘草・桂枝・生姜・麦門冬・麻子仁・人参・阿膠・大棗・生地黄を用い、日に3回服すとされる（要原本照合）\n- 『千金翼方』巻第十五・補益・五蔵気虚第五には復脈湯の名で、虚労不足の条（「二十一日にして死す」）とともに生地黄・生姜・麦門冬・麻子仁・阿膠・大棗・人参・桂心・甘草が載り、日に3回・夜に3回服す。脈が戻らなければ日を隔ててまた1剤を服し、脈が戻るのを目安とするとされる（要原本照合）\n- 『外台秘要方』第十巻・肺痿方には、仲景傷寒論を引く炙甘草湯方として甘草・生姜・人参・地黄・阿膠・大麻子人・大棗・麦門冬・桂心が載り、日に3回・夜に1回服すとされる（要原本照合）\n- 『千金翼方』巻第十五・補益・補五蔵第四の温液湯は、外台炙甘草湯と同じ肺痿の条に甘草3両の1味を用い、炙の指示がないとされる（要原本照合）\n- 現行エキス剤（ツムラ64）は 地黄・麦門冬・桂皮・炙甘草・大棗・人参・麻子仁・生姜・阿膠 の9味で、原典と同じ構成（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "地黄・麦門冬・桂皮・炙甘草・大棗・人参・麻子仁・生姜・阿膠", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "帰脾湯", "名前": "帰脾湯", "読み": "きひとう", "ツムラ番号": "65", "出典": "薛氏医案（内科摘要・巻上・各症方薬）", "別名": "", "本文": {"条文": "### 『内科摘要』巻上・各症方薬（薛己）\n\n**書き下し**（読み：社員案）\n帰脾湯　思慮、脾を傷り、血を摂すること能わず、血の妄行を致し、或いは健忘・怔忡・驚悸・盗汗し、或いは心脾痛みを作し、嗜臥して食少なく、大便調わず、或いは肢体重痛し、月経調わず、赤白帯下し、或いは思慮、脾を傷りて瘧・痢を患うを治す。\n\n**原文**（翻刻確認）\n歸脾湯　治思慮傷脾、不能攝血、致血妄行、或健忘、怔忡、驚悸、盜汗、或心脾作痛、嗜臥少食、大便不調、或肢體重痛、月經不調、赤白帶下、或思慮傷脾而患瘧、痢。\n\n**現代語訳**（訳：社員案）\n帰脾湯は、思い悩みが脾を傷り、血を統べ収めることができず、血がみだりに巡って出血するもの、あるいは物忘れ・動悸・驚きやすさ・寝汗があるもの、あるいは心窩部から胸が痛み、横になりたがって食が少なく、便通が整わないもの、あるいは手足や体が重く痛み、月経が整わず、赤白のおりものがあるもの、あるいは思い悩みで脾を傷って瘧（おこり）や痢（下痢）を患うものを治す。\n\n### 注記\n- 『内科摘要』の帰脾湯は、維基文庫の本では卷上・十二、各症方薬にある。卷下・各症方薬にはない（翻刻確認）\n- 維基文庫の『内科摘要』は簡体字の本で、原文は社員が繁体字に直した。字形は要原本照合\n- 「黃耆」は、簡体字の『内科摘要』では「黄」の次の字が欠けている（要原本照合）", "出典": "### 原典の構成\n- 『内科摘要』巻上・各症方薬：人参・白朮・白茯苓・黄耆・竜眼肉・酸棗仁 各2銭、遠志1銭、木香・甘草（炙） 各5分、当帰1銭（翻刻確認）\n\n### 原典の服用法\n- 『内科摘要』：生姜・大棗を入れ、水で煎じて服す（翻刻確認）\n\n### 処方の変遷\n- 本方は四君子湯に黄耆・当帰・竜眼肉・酸棗仁・遠志・木香を加えた形の方。資料は、本方の出典はまず四君子湯の出典を考えに入れる必要があるとする。四君子湯の出典は資料のこの項に書かれていない（要確認）\n- 一般に本方の出典は『厳氏済生方』とされる。『厳氏済生方』健忘論治（四庫全書本の翻刻では卷四・健忘）の帰脾湯は、思慮が度を過ぎて心脾を労傷し、健忘・怔忡するものを治す。白朮・茯神・黄耆・竜眼肉・酸棗仁 各1両、人参・木香 各半両、甘草（炙）2銭半の8味で、当帰・遠志がなく、茯苓ではなく茯神を用いる。㕮咀し、1回4銭を生姜5片・棗1枚とともに煎じて温服する（翻刻確認）。資料は、『厳氏済生方』は現在の帰脾湯の原方の出典というにとどまるとする\n- 『玉機微義』巻之十七・血証門・補剤（徐用誠原輯・劉純続増）の帰脾湯は、思慮が脾を傷り、心血を統摂できずに血が妄行し、あるいは吐血・下血するものを治す。白朮・茯神・黄耆・竜眼肉・酸棗仁 各1両、人参・木香 各半両、甘草（炙）2銭半で、棗・姜を入れて煎じる（翻刻確認）。資料は『厳氏済生方』の方に当帰を加えたものとするが、維基文庫の四庫全書本では当帰がなく、『厳氏済生方』と同じ8味（要原本照合）\n- 『内科摘要』巻上・各症方薬の帰脾湯は、当帰・遠志を含み茯苓を用いる、今日の帰脾湯と同じ構成（翻刻確認）。資料は、同じ方が『薛氏医案』の各処に見られるとする\n- 資料は、『薛氏医案』十六種のうち加味帰脾湯の項で挙げた8種を除く8種について、帰脾湯が載るのは『保嬰金鏡録』『癘瘍機要』『小児痘疹方論』（茯神）と『外科枢要』（茯苓）で、『保嬰粋要』『原機啓微』『敖氏傷寒金鏡録』『外科精要』には載らないとする（要原本照合）\n- 資料の出典欄には『聖済総録』『厳氏済生方』『玉機微義』『薛氏医案』が並ぶ。『聖済総録』は資料の本文（論考）に出てこず、何の出典として挙げられているかが分からない（要確認）\n- 現行エキス剤（ツムラ65）は 黄耆・酸棗仁・人参・白朮・茯苓・竜眼肉・遠志・大棗・当帰・甘草・生姜・木香 の12味で、『内科摘要』の方と同じ生薬からなる（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "黄耆・酸棗仁・人参・白朮・茯苓・竜眼肉・遠志・大棗・当帰・甘草・生姜・木香", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "参蘇飲", "名前": "参蘇飲", "読み": "じんそいん", "ツムラ番号": "66", "出典": "三因極一病証方論（巻之十三・痰飲治法）／太平恵民和剤局方（巻之二・傷寒 附 中暑）", "別名": "", "本文": {"条文": "### 『三因極一病証方論』巻之十三・痰飲治法\n\n**書き下し**（読み：社員案）\n\n痰飲、胸中・中脘に停まり、痰涎を嘔吐し、眩暈・嘈雑・忪悸・噦逆し、及び痰気人に中りて関節に停留し、手足軃曳し、口眼喎斜し、半身不遂し、食し已りて即ち吐し、頭痛発熱して、状傷寒の如きを治す。\n\n**原文**（翻刻確認）\n\n治痰飲停胸中中脘、嘔吐痰涎、眩暈、嘈雜、忪悸、噦逆、及痰氣中人、停留關節、手足軃曳、口眼喎斜、半身不遂、食已即吐、頭痛發熱、狀如傷寒。\n\n**現代語訳**（訳：社員案）\n\n痰飲が胸中や中脘（みぞおち）に停滞して、痰涎を吐き、めまい・嘈雑（胸やけのようなむかつき）・動悸・しゃっくりがあるもの、また痰気が人にあたって関節に停留し、手足が垂れて引きずるようになり、口や目がゆがみ、半身不随となり、食べ終わるとすぐに吐き、頭痛・発熱して、その様子が傷寒のようであるものを治す。\n\n### 『太平恵民和剤局方』巻之二・傷寒 附 中暑\n\n**書き下し**（読み：社員案）\n\n感冒の発熱・頭疼を治す。或いは痰飲凝結し、兼ねて以て熱を為すに因るも、並びに宜しく之を服すべし。若し感冒の発熱に因らば、亦た養胃湯を服する法の如く、被を以て蓋いて臥し、連りに数服を進むれば、微汗して即ち愈ゆ。尚お余熱有らば、更に宜しく徐徐に之を服すべし、自然に平治す。痰飲の発熱に因らば、但だ連日頻りに此の薬を進め、熱退くを以て期と為し、預め止むべからず。前胡・乾葛有りと雖も、但だ能く肌を解するのみ。既に枳殻・橘紅の輩有れば、自ら能く中を寛げ膈を快くし、脾を傷るを致さず。兼ねて大いに中脘の痞満、嘔逆悪心を治し、胃を開き食を進むること、以て此れに踰ゆる無し。性涼なるを以て疑いを為すこと毋かれ。一切の発熱、皆能く効を取り、必ずしも其の所因に拘らざるなり。小児・室女も亦た宜しく之を服すべし。\n\n**原文**（翻刻確認）\n\n治感冒發熱頭疼、或因痰飲凝結、兼以為熱、並宜服之。若因感冒發熱、亦如服養胃湯法、以被蓋卧、連進數服、微汗即愈。尚有餘熱、更宜徐徐服之、自然平治。因痰飲發熱、但連日頻進此藥、以熱退為期、不可預止。雖有前胡乾葛、但能解肌耳。既有枳殻橘紅輩、自能寛中快膈、不致傷脾。兼大治中脘痞滿、嘔逆惡心、開胃進食、無以踰此。毋以性涼為疑。一切發熱、皆能取效、不必拘其所因也。小兒室女亦宜服之。\n\n**現代語訳**（訳：社員案）\n\n感冒による発熱・頭痛を治す。あるいは痰飲が凝り固まり、それに伴って熱を生じたものにも、いずれもこれを服するのがよい。感冒による発熱であれば、養胃湯を服する方法と同じように、夜具をかけて横になり、続けて数服を進めると、軽く汗が出てすぐに治る。なお余熱が残れば、さらにゆっくりとこれを服するのがよく、自然に治まる。痰飲による発熱であれば、ただ連日しきりにこの薬を進め、熱が退くのを目安とし、前もってやめてはならない。前胡・乾葛が入っているが、ただ肌を解する（軽く表を解く）だけである。枳殻・橘紅の類が入っているので、自ずと中焦を寛げ胸膈をすっきりさせ、脾を傷ることはない。あわせて中脘の痞満・嘔逆・悪心を大いに治し、胃の働きを開いて食を進めることでは、これにまさるものはない。性が涼であることを疑ってはならない。あらゆる発熱に皆効果があり、必ずしもその原因にこだわらない。小児や未婚の女性も、これを服するのがよい。\n\n### 注記\n- 『三因方』の条の「眩」は、翻刻（四庫全書本）では外字（SKchar 3392）で示されている。資料の書き下しの「眩暈」の字を本文に置いた（要原本照合）\n- 『三因方』の条は、資料では「停積」「中脘」の後の「閉」の句・「嘈煩」「手脚」「即嘔」「頭疼」とあり、翻刻の「停」「（閉の句なし）」「嘈雜」「手足」「即吐」「頭痛」と字・句が違う（要原本照合）\n- 『三因方』の原文の「關」「曳」は、翻刻では異体の「闗」「曵」で書かれる（字体の違い。要原本照合）\n- 『三因方』巻之十三・痰飲証論には、内因の痰飲を治す方として「参苓苓术八味参蘇」を挙げる句がある（翻刻確認）\n- 『和剤局方』の「痰飲凝結」は、資料の書き下しでは「痰飲凝節」（要原本照合）\n- 『和剤局方』の原文の「冒」「蓋」「涼」は、翻刻では異体の「冐」「葢」「凉」で書かれる（字体の違い。要原本照合）\n- 2書の順は、資料の出典欄（『三因方』）を先にした。どちらの書の構成も現行エキス剤（ツムラ）とは一致しない（要確認）", "出典": "### 原典の構成\n- 『三因方』：人参・紫蘇・前胡・茯苓・桔梗・半夏・枳殻・陳皮・木香・甘草 の10味。葛根は入らない。各味の分量は記載がない（翻刻確認）\n- 『和剤局方』：陳皮（白を去る）・枳殻（瓤を去り麩炒）・桔梗（蘆を去る）・甘草（炙る）・木香 各半両、半夏・紫蘇（葉を用いる）・乾葛（洗う）・前胡（苗を去る）・人参（蘆を去る）・茯苓（皮を去る）各3分 の11味（翻刻確認。「各半両」「各3分」がどの薬味までにかかるかは要確認）\n\n### 原典の服用法\n- 『三因方』：剉散とし、1回4銭に生姜7片・棗1枚を加えて7分に煎じて服す。嘔する者には乾葛を加え、腹痛には白芍を加える（翻刻確認。「棗」は翻刻では外字 SKchar 3138 で、資料の「姜棗煎服」による）\n- 『和剤局方』：㕮咀し、1回4銭を水1盞半・生姜7片・棗1個で6分に煎じ、滓を去ってやや温かいうちに服す。時を問わない。方後に「易簡方は木香を用いず只だ十味」とある（翻刻確認）\n\n### 処方の変遷\n- 資料は本方の出典を『三因方』巻之十三・痰飲治法とする。主方に葛根はなく、方後に嘔する者には乾葛を加えるとあるので、葛根はもとは加味の一つだった（翻刻確認）\n- 資料によれば、王碩『易簡方』増損飲子治法三十首の参蘇飲は、主方にすでに葛根が入り、木香を去った方で、気盛・気虚の人の痰気上壅などには木香半両を加えるとする（要原本照合）。資料は、王碩は陳無択の門人で、『易簡方』の参蘇飲は『三因方』からの引用とする（要確認）\n- 一般には本方の出典は『和剤局方』とされる（資料による）。『和剤局方』巻二の参蘇飲には葛根が初めから入り、方後に「易簡方不用木香只十味」とある（翻刻確認）。資料はこれを本方が淳祐新添方（1241〜1252年）に属する根拠とし、歴史的には『三因方』が70年前後古いとする（要確認）\n- 『古今医鑑』巻之四・咳嗽と『万病回春』巻之二・咳嗽の参蘇飲は、木香を含む11味で、人参は実熱（回春は熱咳）の者には去り、木香は気盛の者には去るとする（翻刻確認）。資料は、わが国では専ら『万病回春』の条文が引用されるとする\n- 『万病回春』の参蘇飲の方後には、吐血・痰嗽には四物湯を加えて茯苓補心湯と名づけるとある（翻刻確認）。資料によれば、茯苓補心湯の名は『三因方』巻之八にもある（要原本照合）\n- 現行エキス剤（ツムラ66）は7.5g中、半夏・茯苓 各3.0g、葛根・桔梗・前胡・陳皮 各2.0g、大棗・人参 各1.5g、甘草・枳実・蘇葉 各1.0g、生姜0.5g の12味（PMDA 添付文書 2023年12月改訂 第1版で確認）。木香は入らず、原典の枳殻が枳実に替わる。添付文書に出典の欄はない", "構成": "半夏・茯苓・葛根・桔梗・前胡・陳皮・大棗・人参・甘草・枳実・蘇葉・生姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "女神散", "名前": "女神散", "読み": "にょしんさん", "ツムラ番号": "67", "出典": "勿誤薬室方函（巻上。浅田家方）／勿誤薬室方函口訣（巻之上）", "別名": "", "本文": {"条文": "### 『勿誤薬室方函』巻上・女神散\n\n**書き下し**（要原本照合）\n\n**原文**（要原本照合）\n\n**現代語訳**\n\n### 『勿誤薬室方函口訣』巻之上・女神散\n\n**書き下し**（要原本照合）\n\n**原文**（要原本照合）\n\n**現代語訳**\n\n### 注記\n- 『勿誤薬室方函』巻上の女神散は家方（浅田家の方）とされ、血症で上衝して眩暈するものを治し、産前後の通治の剤とされる。13味の後に、白朮・莎草を去り萍蓬根・芍薬・地黄・沈香・細辛を加えたものを清心湯と名づけるとする方後の文がある（要原本照合。資料の書き下しによる）\n- 『勿誤薬室方函口訣』巻之上では、本方はもと安栄湯と名づけて軍中七気を治した方で、浅田家で婦人の血症に用いて特に験があったので今の名にしたとし、世にいう実母散・婦王湯・清心湯はみな同類の薬とされる（要原本照合。資料の書き下しによる）\n- 『勿誤薬室方函』『勿誤薬室方函口訣』の原文の翻刻は維基文庫に見当たらない（2026-10-23 検索。要原本照合）", "出典": "### 原典の構成\n- 『勿誤薬室方函』巻上：当帰・川芎・桂枝・白朮・木香・黄芩・黄連・人参・甘草・莎草・大黄・檳榔・丁香 の13味（分量は資料に記載なし）（要原本照合）\n\n### 原典の服用法\n\n### 処方の変遷\n- 資料の出典欄は「山田定怡方（山田の振薬）、浅田家方」。資料は、女神散の原方は安栄湯ではなく山田の振薬（山田定怡の方）であり、浅田宗伯独自の家方ではないとする（要確認）\n- 安栄湯：『換骨抄』（吉益半咲斎）に振薬安栄湯として人参・当帰・肉桂・川芎・桂心・黄芩・黄連・白朮・木香・川骨・国老（甘草）の11味が載る（要原本照合）\n- 山田の振薬：『長井流金瘡撲損療治』に収める『山田流金瘡之事』に、方名のない「内薬ふり薬」として安栄湯と同じ11味が載り、その後の加減法に、筋が切れたものには檳榔子・丁子を加え、大便が結するものには大黄・巴豆を加えるとある（要原本照合）\n- 資料は、山田の振薬の原方に加減法のうち巴豆を除いた3味（檳榔子・丁子・大黄）と『換骨抄』別本の香附子を加え、川骨を去ると女神散になるとする（要確認）\n- 資料は、山田の振薬の立方を室町時代の1500年前後と推考する（要確認）\n- 現行エキス剤（ツムラ67）は7.5g中、香附子・川芎・蒼朮・当帰 各3.0g、黄芩・桂皮・人参・檳榔子 各2.0g、黄連・甘草・丁子・木香 各1.0g の12味（PMDA 添付文書 2023年12月改訂 第1版で確認）。『勿誤薬室方函』の13味から大黄を除き、白朮が蒼朮になっている。添付文書に出典の欄はない\n- 原典の桂枝は桂皮、莎草は香附子、檳榔は檳榔子、丁香は丁子にあたる（要確認）", "構成": "香附子・川芎・蒼朮・当帰・黄芩・桂皮・人参・檳榔子・黄連・甘草・丁子・木香", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "芍薬甘草湯", "名前": "芍薬甘草湯", "読み": "しゃくやくかんぞうとう", "ツムラ番号": "68", "出典": "傷寒論（弁太陽病脈証并治上第五）", "別名": "", "本文": {"条文": "### 『傷寒論』弁太陽病脈証并治上第五\n\n**書き下し**（読み：社員案）\n傷寒、脈浮、自汗出で、小便数、心煩し、微しく悪寒し、脚攣急するに、反って桂枝を与えて其の表を攻めんと欲するは、此れ誤りなり。之を得て便ち厥し、咽中乾き、煩躁吐逆する者は、甘草乾姜湯を作りて之を与え、以て其の陽を復す。若し厥愈え足温かなる者は、更に芍薬甘草湯を作りて之を与うれば、其の脚即ち伸ぶ。若し胃気和せず、譫語する者は、少しく調胃承気湯を与う。若し重ねて汗を発し、復た焼針を加うる者は、四逆湯之を主る。\n\n**原文**（翻刻確認）\n傷寒脈浮、自汗出、小便數、心煩、微惡寒、腳攣急、反與桂枝欲攻其表、此誤也。得之便厥、咽中乾、煩躁吐逆者、作甘草乾薑湯與之、以復其陽。若厥愈足溫者、更作芍藥甘草湯與之、其腳即伸。若胃氣不和、譫語者、少與調胃承氣湯。若重發汗、復加燒針者、四逆湯主之。\n\n**現代語訳**（訳：社員案）\n傷寒で脈が浮、自然に汗が出て、小便の回数が多く、胸苦しく、軽く悪寒がし、脚がひきつるものに、かえって桂枝（湯）を与えてその表を攻めようとするのは誤りである。これを服してすぐに手足が冷え（厥し）、咽の中が乾き、もだえ苦しんで吐き戻すものには、甘草乾姜湯を作って与え、その陽気を回復させる。もし厥が治って足が温かくなったものには、さらに芍薬甘草湯を作って与えると、その脚はすぐに伸びる。もし胃気が調和せず、うわごとを言うものには、調胃承気湯を少し与える。もし重ねて発汗させ、さらに焼針を加えたものは、四逆湯がこれを主治する。\n\n### 『傷寒論』弁太陽病脈証并治上第五（証は陽旦に象るの条）\n\n**書き下し**（読み：社員案）\n問うて曰く、証は陽旦に象る。法に按じて之を治するに増劇し、厥逆し、咽中乾き、両脛拘急して譫語す。師曰く、夜半に手足当に温まるべく、両脚当に伸ぶべしと言う。後、師の言の如し。何を以て此れを知るや。答えて曰く、寸口の脈浮にして大、浮は風と為し、大は虚と為す。風なれば則ち微熱を生じ、虚なれば則ち両脛攣す。病証桂枝に象る。因りて附子を加えて其の間に参え、桂を増して汗を出さしむ。附子は経を温む。亡陽するが故なり。厥逆し、咽中乾き、煩躁し、陽明内に結ぼれ、譫語煩乱するには、更に甘草乾姜湯を飲ましむ。夜半に陽気還り、両足当に熱すべし。脛尚お微しく拘急するには、重ねて芍薬甘草湯を与うれば、爾して乃ち脛伸ぶ。承気湯を以て微しく溏せしむれば、則ち其の譫語止む。故に病愈ゆべきを知る。\n\n**原文**（翻刻確認）\n問曰、證象陽旦、按法治之而增劇、厥逆、咽中乾、兩脛拘急而譫語。師曰、言夜半手足當溫、兩腳當伸。後如師言。何以知此。答曰、寸口脈浮而大、浮為風、大為虛、風則生微熱、虛則兩脛攣、病證象桂枝、因加附子參其間、增桂令汗出、附子溫經、亡陽故也。厥逆、咽中乾、煩躁、陽明內結、譫語煩亂、更飲甘草乾薑湯。夜半陽氣還、兩足當熱、脛尚微拘急、重與芍藥甘草湯、爾乃脛伸。以承氣湯微溏、則止其譫語、故知病可愈。\n\n**現代語訳**（訳：社員案）\n問う。証が陽旦（湯）の証に似ているので、法に従って治療したところかえって悪化し、手足が冷え、咽の中が乾き、両すねがひきつってうわごとを言うようになった。師は「夜半に手足が温まり、両脚が伸びるはずだ」と言い、後に師の言葉どおりになった。どうしてこれがわかったのか。答える。寸口の脈が浮で大であった。浮は風であり、大は虚である。風であれば微熱を生じ、虚であれば両すねがひきつる。病証が桂枝（湯）の証に似ていたので、附子を加えてその間に交え、桂を増して汗を出させた。附子は経を温めるものだが、（汗によって）陽を失ったためである。手足が冷え、咽の中が乾き、もだえ苦しみ、陽明が内に結ぼれ、うわごとを言って煩乱するものには、さらに甘草乾姜湯を飲ませる。夜半に陽気が戻り、両足は熱くなるはずである。すねにまだ軽いひきつりが残るものには、重ねて芍薬甘草湯を与えると、それですねが伸びる。承気湯で軽く便をゆるくすれば、そのうわごとは止む。それゆえ病が治りうるとわかったのである。\n\n### 注記\n- 2条とも維基文庫の宋本の翻刻で確かめた（翻刻確認。腳／脚、與／与などの字体の差は書き下しで新字体にした）\n- 『金匱玉函経』巻第二・弁太陽病形証治第三の第1条は「傷寒脈浮、自汗、小便數、頗微惡寒。論曰、心煩微惡寒、兩腳攣急、反與桂枝湯、欲攻其表、得之便厥、咽乾煩躁吐逆、當作甘草乾薑湯…」と字句が異なる（要原本照合）。巻第六・弁発汗吐下後病形証治第十九にも字句の異なる同じ条がある（要原本照合）。本文は宋本の字を採った\n- 『金匱玉函経』の陽旦の条は「重與芍藥甘草湯」が「與芍藥甘草湯」、「浮為風、大為虛」が「浮即為風、大即為虛」、「病證象桂枝」が「其形象桂枝」、「參其間」が「於其間」、「以承氣湯微溏、則止其譫語」が「與承氣湯微溏、止其譫語」などと書かれる（要原本照合）。本文は宋本の字を採った\n- 構成の芍薬は、宋本・『金匱玉函経』の翻刻とも「芍藥」と書く。資料は原典で「白芍薬・甘草炙」と指示されるとする（白芍薬の字は要原本照合）\n- 『金匱玉函経』巻第七の芍藥甘草湯方は、服用法に「㕮咀」の語が入る（要原本照合）。本文は宋本の書き方を採った", "出典": "### 原典の構成\n- 『傷寒論』：芍薬・甘草（炙）各4両（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』：2味を水3升で煮て1升5合を取り、滓を去り、2回に分けて温服する（翻刻確認）\n\n### 処方の変遷\n- 『傷寒論』では、桂枝湯の誤治で厥した者に、まず甘草乾姜湯で陽を回復させ、足が温まってから用いる方として載る（翻刻確認）\n- 『伝信適用方』巻上・治脚気の中岳湯は赤芍薬・甘草（炙）を水煎し、湿気で脚が赤く腫れて痛み、胸膈が痞満し、全身が痛むもの、また脚気に用いる（要原本照合）\n- 『魏氏家蔵方』巻第八・脚気の六半湯は白芍薬・甘草（炙）を煎じ、無灰酒を少し入れて数沸させて服し、熱湿脚気で歩けないものに用いる（要原本照合）\n- 『類編朱氏集験医方』巻之一・脚気の去杖湯は赤芍薬・甘草の2味を水煎し、脚が弱く力がなく歩行が難儀なものに用いる（要原本照合）\n- 『秘伝外科方』救解諸毒傷寒雑病一切等証の神効散は白芍薬・甘草（炙）を水煎し、消渇に用いる（要原本照合）\n- 『有林福田方』巻之九・小児諸病証論・瘡疹治方の芍薬甘草湯は『道済方』を引き、白芍薬・甘草を粗末にして煎服し、瘡疹に用いる（要原本照合）。資料は『道済方』を明代の書、『衛生方』を金代の書かとし、いずれも亡佚書とする（要確認）\n- 『古方括要』巻之上・雑病門・渇症の中焦湯は、本方に大棗25枚を加える（要原本照合）\n- 本方をもとにした処方として、資料は桂枝加芍薬湯・桂枝加芍薬大黄湯・小建中湯・黄耆建中湯・当帰建中湯・芍薬甘草附子湯・四逆散を挙げる\n- 医療用エキス剤は、ツムラ芍薬甘草湯エキス顆粒（医療用）（1日量7.5g中、日局カンゾウ6.0g・日局シャクヤク6.0g。識別コード ツムラ／68。PMDA 添付文書 2023年12月改訂 第1版で確認）。ほかにクラシエ・コタロー・本草製薬・東洋薬行・康和薬通の医療用製剤がある（KEGG MEDICUS、2026-10-22）", "構成": "甘草・芍薬", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "茯苓飲", "名前": "茯苓飲", "読み": "ぶくりょういん", "ツムラ番号": "69", "出典": "金匱要略（痰飲咳嗽病脈証并治第十二。附方、外台秘要方の引用）", "別名": "", "本文": {"条文": "### 『金匱要略』痰飲咳嗽病脈証并治第十二（附方）\n\n**書き下し**（読み：社員案）\n外台の茯苓飲。心胸の中に停痰・宿水有りて、自ら吐して水を出だして後、心胸の間、虚気満ちて、食すること能わざるを治す。痰気を消して、能く食せしむ。\n\n**原文**（翻刻確認）\n外臺茯苓飲、治心胸中有停痰宿水、自吐出水後、心胸間虚氣滿、不能食。消痰氣、令能食。\n\n**現代語訳**（訳：社員案）\n『外台秘要方』の茯苓飲。胸からみぞおちのあたりに停まった痰と宿った水（停痰・宿水）があって、自然に水を吐いた後、胸の間に虚気が満ちて、食べることができないものを治す。痰気を消して、食べられるようにする。\n\n### 注記\n- 維基文庫の『金匱要略』の翻刻は、痰飲咳嗽病篇の「【附方】」の見出しの下に茯苓飲の条がなく、通行本の字を確かめられない。原文は四部叢刊本（明・俞橋刊本）の翻刻の字を採った（翻刻確認）\n- 「自吐出水後」の「吐」は、四部叢刊本の翻刻にはなく「自出水後」と書かれる。維基文庫の『金匱要略方論』（簡体字の本）の翻刻と資料の書き下しには「吐」があるので、本文は資料の字を採った（要原本照合）\n- 字体：四部叢刊本の翻刻は「外䑓」「茯苓飮」と書き、「宿水」の「宿」も異体字（画面で表示できない字）で書く。本文は臺・飲・宿にした\n- 「心胸間虚氣滿」は、維基文庫の『金匱要略方論』（簡体字の本）では「心胸间虚，气满」と句を切る（心胸の間虚し、気満ちて）。書き下しは資料の論考にならって「虚気満ちて」と読んだ（要原本照合）\n- 『外台秘要方』巻八・痰飲食不消及嘔逆不下食方では延年の茯苓飲として載り、「心胷中有停痰宿水自吐水出後」と「吐水出」の語順で、主治の文の後に「酢物・桃李・雀肉等を忌む」とある（翻刻確認）", "出典": "### 原典の構成\n- 『金匱要略』：茯苓・人参・白朮 各3両、枳実2両、橘皮2両半、生姜4両（翻刻確認。四部叢刊本の翻刻による。維基文庫の『金匱要略方論』（簡体字の本）の翻刻も同じ量）\n\n### 原典の服用法\n- 『金匱要略』：6味を水6升で煮て1升8合を取り、3回に分けて温服する。人が8〜9里を行くほどの間をおいて次を進める（翻刻確認。四部叢刊本の翻刻による）\n\n### 処方の変遷\n- 『金匱要略』では『外台秘要方』から引いた附方として、痰飲咳嗽病篇の末に載る（翻刻確認）\n- 『外台秘要方』巻八・痰飲食不消及嘔逆不下食方の延年茯苓飲：茯苓3両、人参2両、白朮3両、生姜4両、枳実2両（炙）、橘皮1両半の6味を水6升で煮て1升8合を取り、滓を去り、3回に分けて温服し、人が8〜9里を行くほどの間をおいて次を進める。酢物・桃李・雀肉等を忌む。小字注に「仲景傷寒論同じ。第十七巻中に出づ」（翻刻確認。四庫全書本）\n- 同じ巻の風痰方には、茯苓湯（風痰の気が発して嘔吐し、欠呿し、煩悶して安からず、あるいは痰水を吐く者。茯苓3両、人参・生姜・橘皮・白朮 各2両の5味で、本方から枳実を去った形）と、茯苓飲（風痰の気で水を吐嘔する者。枳実1両（炙）、茯苓・白朮・人参 各2両

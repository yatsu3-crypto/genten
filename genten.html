header{position:sticky;top:0;z-index:30;

.brand{display:flex;align-items:center;gap:11px}
.brand h1{font-size:18px;margin:0}
.brand .sub{font-size:11px;color:var(--sumi2);letter-spacing:.04em;margin-top:1px}
.tampopo{width:34px;height:34px;flex:0 0 auto}
.search{position:relative;margin-top:10px}
.search input{width:100%;padding:12px 14px 12px 40px;border:1px solid var(--line);border-radius:var(--r);
  font-size:16px;background:var(--card);color:var(--sumi);font-family:inherit;-webkit-appearance:none}
.search input::placeholder{color:var(--usu)}
.search input:focus{outline:none;border-color:var(--kin);box-shadow:0 0 0 3px rgba(192,138,34,.15)}

main{max-width:760px;margin:0 auto;padding:14px calc(14px + env(safe-area-inset-right)) 90px calc(14px + env(safe-area-inset-left))}
.view{display:none;animation:fade .25s ease}

@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  .tbl td[data-label]:not(:first-child)::before{content:attr(data-label);display:block;font-size:11px;font-weight:700;color:var(--usu);letter-spacing:.04em}
  .tbl td.blank{display:none}

.listempty{text-align:center;color:var(--sumi2);padding:40px 20px;font-size:14px}
.listempty .big{font-size:40px;margin-bottom:8px}

@media print{
  header,.back,.disc{display:none!important}

<script id="genten-data" type="application/json">{"built": "2026-10-22", "edition": "public", "sections": ["条文", "出典", "構成", "方意", "諸家の論", "院長メモ"], "entries": [{"file": "葛根湯", "名前": "葛根湯", "読み": "かっこんとう", "ツムラ番号": "1", "出典": "傷寒論（巻第三・弁太陽病脈証并治中第六）／金匱要略（痙湿暍病脈証并治第二）", "本文": {"条文": "### 『傷寒論』巻第三・弁太陽病脈証并治中第六\n\n**書き下し**（読み：社員案）（1条目：項背強）\n太陽病、項背強ばること几几、汗無く悪風するは、葛根湯之を主る。\n\n**原文**（翻刻確認）\n太陽病，項背強几几，無汗惡風，葛根湯主之。\n\n**現代語訳**（訳：社員案）\n太陽病で、うなじから背中が几几とこわばり、汗が出ず、風を嫌うものは、葛根湯が主治する。\n\n**書き下し**（読み：社員案）（2条目：合病の自下利。1条目の方の後に続く）\n太陽と陽明との合病の者は、必ず自下利す。葛根湯之を主る。\n\n**原文**（翻刻確認）\n太陽與陽明合病者，必自下利，葛根湯主之。\n\n**現代語訳**（訳：社員案）\n太陽と陽明の合病のものは、必ずひとりでに下痢する。葛根湯が主治する。\n\n### 『金匱要略』痙湿暍病脈証并治第二\n\n**書き下し**（読み：社員案）\n太陽病、汗無くして小便反って少なく、気胸に上衝し、口噤して語るを得ず、剛痙を作さんと欲するは、葛根湯之を主る。\n\n**原文**（翻刻確認）\n太陽病，無汗而小便反少，氣上衝胸，口噤不得語，欲作剛痙，葛根湯主之。\n\n**現代語訳**（訳：社員案）\n太陽病で、汗が出ないのに尿がかえって少なく、気が胸に突き上げ、口を食いしばってものが言えず、剛痙を起こしかけているものは、葛根湯が主治する。\n\n### 注記\n- 「几几」は資料のルビで「キキ」と読む\n- 『傷寒論』の2条はどちらも宋本の翻刻と、四庫全書本『傷寒論注釈』（成無己注）の翻刻で同じ句（翻刻確認）\n- 四庫全書本『傷寒論注釈』の翻刻は「強」を「强」、「麻黃」を「麻黄」の字形で書く（要原本照合）\n- 『金匱要略』の篇名は、資料の中で「痙湿暍病脈証第二」と「痙湿暍病脈証治第二」の2通りに書かれる。翻刻は「痙濕暍病脈證並治第二」（翻刻確認）\n- 『金匱要略』の巻数は資料に記載がない（要確認）\n- 葛根湯方の煎じ方で、麻黄・葛根を先に煮て減らす水の量は、宋本『傷寒論』の翻刻では「減六升」（要原本照合）。本文は、『金匱要略』の翻刻・四庫全書本『傷寒論注釈』と、宋本の翻刻のほかの方（桂枝加葛根湯・葛根加半夏湯など）の「減二升」を採った\n- 『金匱要略』と四庫全書本『傷寒論注釈』の葛根湯方には「㕮咀」と「不須啜粥、餘如桂枝湯法將息及禁忌」の句があり、宋本『傷寒論』の翻刻にはない（要原本照合）\n- 四庫全書本『傷寒論注釈』の翻刻は桂枝を「桂」と書く（要原本照合）", "出典": "### 原典の構成\n- 『傷寒論』（宋本）：葛根4両、麻黄3両（去節）、桂枝2両（去皮）、生姜3両（切）、甘草2両（炙）、芍薬2両、大棗12枚（擘）（翻刻確認）\n- 『金匱要略』：葛根4両、麻黄3両（去節）、桂枝2両（去皮）、芍薬2両、甘草2両（炙）、生姜3両（切）、大棗12枚（擘）（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』（宋本）：7味を水1斗で、まず麻黄・葛根を煮て2升減らし（宋本の翻刻の「6升」は注記）、白い泡を去る。残りの薬を入れて3升に煮つめ、滓を去って1升を温服する。衣をかけてわずかに汗ばむ程度の汗をとる（翻刻確認）\n- 『金匱要略』：7味を刻み、水1斗で、まず麻黄・葛根を煮て2升減らし、泡を去る。残りの薬を入れて3升に煮つめ、滓を去って1升を温服する。衣をかけてわずかに汗ばむ程度の汗をとる。粥をすする必要はなく、ほかは桂枝湯の法に従って養生と禁忌を守る（翻刻確認）\n\n### 処方の変遷\n- 桂枝湯（桂皮・生姜・甘草・芍薬・大棗）に葛根・麻黄を加えた処方\n- 『太平恵民和剤局方』巻之二・傷寒附中暑には、葛根・麻黄・黄芩・芍薬・甘草・肉桂を粗末とし、棗を入れて煎じる「葛根解肌湯」が載るとされる（要原本照合）\n- 『丹渓心法附余』巻之一・外感門上には、傷寒の項に原典どおり7味の葛根湯、温熱病の項に『和剤局方』の葛根解肌湯が載るとされる。おおむね黄芩の有無で傷寒の薬と温熱病の薬が分けられている（要原本照合）\n- 現行エキス剤（ツムラ1）は 葛根・大棗・麻黄・甘草・桂皮・芍薬・生姜 の7味（PMDA 添付文書 2026年8月改訂 第2版で確認）。原典の「桂枝」は、資料の組成欄では「桂皮」と書かれる", "構成": "葛根・大棗・麻黄・甘草・桂皮・芍薬・生姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論", "院長メモ"]}, {"file": "乙字湯", "名前": "乙字湯", "読み": "おつじとう", "ツムラ番号": "3", "出典": "叢桂亭医事小言（巻之七・叢桂亭蔵方）／浅田家方", "本文": {"条文": "### 『叢桂亭医事小言』巻之七・叢桂亭蔵方（原南陽）\n\n**書き下し**\n乙字湯　痔疾、脱肛痛楚、或いは下血腸風、或いは前陰痒痛する者を理する方。\n\n（方後）諸瘡疥、洗伝の薬を禁ず。下部の瘡疥、最も之を忌む。誤りて枯薬洗伝し、頓に愈えて後、上逆鬱冒す。気癖の如く繊憂細慮し、或いは心気不定の如き者、并びに之を主る。而して長強に灸す。傷風下血、久服して効無き者は理中湯に宜し。\n\n**原文**（要原本照合）\n資料に原文の記載がない（要確認）\n\n**現代語訳**（訳：社員案）\n乙字湯　痔疾、脱肛の痛み苦しみ、あるいは下血・腸風、あるいは前陰の痒みや痛みがある者を治める処方。\n\n（方後）諸々の瘡疥には、洗ったり塗ったりする薬を禁じる。下部の瘡疥ではとりわけこれを忌む。誤って枯らす薬で洗ったり塗ったりし、急に治った後に、上逆して鬱冒する。気癖のように細かなことを思い悩み、あるいは心気が定まらないような者も、併せてこれを主治する。そして長強に灸をする。傷風による下血で、長く服用しても効かない者には理中湯がよい。\n\n### 『勿誤薬室方函』巻上（浅田家方）\n\n浅田宗伯『勿誤薬室方函』巻上の乙字湯は出典を南陽とし、上の方後の文のうち「洗伝の薬を禁ず。下部の瘡疥、最も之を忌む」と「而して長強に灸す。傷風下血、久服して効無き者は理中湯に宜し」を除いて引く。構成は原方と異なり、内容は「出典」の見出しに記す（要原本照合）\n\n### 注記\n- 書き下しは資料（sources/２.pdf の本の83頁）に引かれたもの。原文は資料になく、維基文庫にも翻刻が見当たらない（要原本照合）\n- 「洗伝」の「伝」は資料の表記のまま（要原本照合）\n- 原方の薬味は、資料の『叢桂亭医事小言』の引用では柴胡・黄芩・升麻・大黄・甘草・大棗・生姜の7味だが、津田玄仙『療治経験筆記』巻之九の引用は「原南陽の乙字湯の六味」とされる（要原本照合）", "出典": "### 原典の構成\n- 『叢桂亭医事小言』（原南陽の原方）：柴胡・黄芩 各7分、升麻・大黄・大棗 各4分、甘草3分、生姜2分（要原本照合）\n- 『勿誤薬室方函』（浅田家方）：柴胡・大黄・升麻・黄芩・甘草・当帰（分量は資料に記載なし）（要原本照合）\n\n### 原典の服用法\n\n### 処方の変遷\n- 「乙字湯」の名は、原南陽の蔵方の五十八方を甲字湯（瘀血）・乙字湯（痔疾）・丙字湯（諸淋）・丁字湯（澼嚢）…と名付けたうちの2番目であることによる（要原本照合）\n- 『叢桂亭医事小言』の原方には当帰が入っていない（要原本照合）\n- 『勿誤薬室方函』巻上の乙字湯は、原方から大棗・生姜を去り当帰を加えた加減方である（要原本照合）\n- 現行エキス剤（ツムラ3）は 当帰・柴胡・黄芩・甘草・升麻・大黄 の6味で、浅田家方と同じ顔ぶれ。大棗・生姜は入っていない（添付文書 2023年12月改訂 第1版で確認）", "構成": "当帰・柴胡・黄芩・甘草・升麻・大黄", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["出典", "構成", "方意", "諸家の論"]}, {"file": "安中散", "名前": "安中散", "読み": "あんちゅうさん", "ツムラ番号": "5", "出典": "太平恵民和剤局方（巻三・一切気門）／原南陽方", "本文": {"条文": "### 『太平恵民和剤局方』巻三・一切気門\n\n**書き下し**（読み：社員案）\n遠年日近の脾疼・翻胃（反胃）、口に酸水を吐し、寒邪の気、内に留滞し、停積消えず、胸膈脹満し、腹脇を攻刺し、悪心嘔逆し、面黄ばみ肌痩せ、四肢倦怠するを治す。又、婦人の血気刺痛、小腹腰に連なり、攻疰重痛するを治す。並びに能く之を治す。\n\n**原文**（翻刻確認）\n治遠年日近脾疼翻胃、口吐酸水、寒邪之氣留滯於内、停積不消、胸膈脹滿、攻刺腹脇、惡心嘔逆、面黄肌痩、四肢倦怠。又治婦人血氣刺痛、小腹連腰、攻疰重痛、並能治之。\n\n**現代語訳**（訳：社員案）\n長年続くものも近ごろ起きたものも、胃の痛みや翻胃（反胃。食べたものを吐く）で、口から酸っぱい水を吐き、寒邪の気が体内に留まって滞り、停滞したものが消えず、胸や膈が張って膨れ、腹や脇腹を刺すように痛み、吐き気がして嘔吐し、顔色が黄ばんで痩せ、手足がだるいものを治す。また、婦人の血気による刺すような痛みで、下腹が腰に連なって、差し込むように重く痛むものを治す。いずれもよく治す。\n\n### 『証治摘要』巻上・嘔吐反胃膈噎（原南陽方）\n\n中川成章『証治摘要』に、縮砂を加えた8味の安中散が原南陽の方として引かれている。引かれているのは構成と用法で、内容は「出典」の見出しに記す（要原本照合）\n\n### 注記\n- 「翻胃」は、四庫全書本の『和剤局方』では「翻胃」（翻刻確認）、同じ主治を載せる『普済方』では「反胃」（翻刻確認）、資料の書き下しでは「飜胃」と書かれる。書き下しはどちらにも決めず「翻胃（反胃）」とした\n- 「遠年日近」は、四庫全書本の『和剤局方』では「逺年近日」と書かれる（要原本照合）。資料と別の翻刻本（「远年日近」）に合わせ、本文は「遠年日近」を採った\n- 「攻疰重痛」の「疰」は、別の翻刻本では「注」と書かれる（要原本照合）\n- 原南陽方の「縮砂」は、資料の引用では「宿砂」と書かれる（要原本照合）", "出典": "### 原典の構成\n- 『和剤局方』：延胡索（去皮）・良姜（炒）・乾姜（炮）・茴香（炒）・肉桂 各5両、牡蛎（煅）4両、甘草（炒）10両（翻刻確認）\n- 原南陽方（『証治摘要』の引用）：甘草10両、縮砂・延胡索・良姜・乾姜・茴香・桂枝 各5両、牡蛎4両（要原本照合）\n\n### 原典の服用法\n- 『和剤局方』：細末とし、1回2銭を熱酒で服す。婦人は淡醋湯（薄めた酢）で服す。酒を飲まない者は塩湯で服す。時を問わず服用（翻刻確認）\n- 原南陽方（『証治摘要』の引用）：末とし、1回2銭を熱酒で服す。縮砂を去り牡蛎を3倍にして水で煎じて服す法もある（要原本照合）\n\n### 処方の変遷\n- 安中散は『和剤局方』の宝慶年間（1225〜1227年）の増補（宝慶新増方）に属する（翻刻確認。四庫全書本には宝慶新増の印がない）\n- 『和剤局方』の安中散は乾姜を含み縮砂を含まない7味（翻刻確認）\n- 縮砂を加えた8味の安中散は、中川成章『証治摘要』に原南陽の方として引かれる。原南陽自身の著書には見当たらないとされる（要原本照合）\n- 原南陽『叢桂亭医事小言』巻之四上・噎膈反胃には、牡蛎を3倍にした安中散を癖嚢病に用いる記載があるとされる（要原本照合）\n- 浅田宗伯『勿誤薬室方函』巻上には局方の安中散から乾姜を去り縮砂を加えた方、巻下・散薬部には局方の方そのものが載るとされる（要原本照合）\n- 現行エキス剤（ツムラ5）は 桂皮・延胡索・牡蛎・茴香・縮砂・甘草・良姜 の7味で、乾姜は入っていない（PMDA 添付文書 2023年12月改訂で確認）。縮砂入りの8味から乾姜を去って7味にしたのは浅田宗伯とする説がある（要確認）", "構成": "桂皮・延胡索・牡蛎・茴香・縮砂・甘草・良姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "黄連解毒湯", "名前": "黄連解毒湯", "読み": "おうれんげどくとう", "ツムラ番号": "15", "出典": "肘後百一方（巻二・治傷寒時気温病方第十三）／外台秘要方（巻一・崔氏方の引用）", "本文": {"条文": "### 『肘後百一方』巻二・治傷寒時気温病方第十三\n\n**書き下し**（読み：社員案）\n若し已に六七日、熱極まり、心下煩悶し、狂言して鬼を見、起ちて走らんと欲す。……又方、黄連三両、黄檗・黄芩各二両、梔子十四枚、水六升もて煎じて二升を取り、分けて再服す。煩嘔して眠るを得ざるを治す。\n\n**原文**（翻刻確認）\n若已六七日、熱極、心下煩悶、狂言見鬼、欲起走。……又方、黄連三兩、黄檗・黄芩各二兩、梔子十四枚、水六升、煎取二升、分再服。治煩嘔不得眠。\n\n**現代語訳**（訳：社員案）\n発病してすでに6〜7日たち、熱が極まって、みぞおちが苦しく悶え、うわごとを言って幻を見、起き上がって走り出そうとするもの。……別の方として、黄連3両、黄檗・黄芩各2両、梔子14枚を水6升で煎じて2升を取り、2回に分けて服す。胸苦しくて吐き気があり、眠れないものを治す。\n\n### 『外台秘要方』巻一・崔氏方\n\n**書き下し**（読み：社員案）\n又、前軍督護劉車なる者、時疾を得て三日、已に汗して解す。飲酒に因りて復た劇しく、煩悶・乾嘔に苦しみ、口燥きて呻吟し、錯語して臥するを得ず。余思いて此の黄連解毒湯方を作る。\n\n一服して目明らかに、再服して粥を進め、此に於いて漸く差ゆ。余以て凡そ大熱盛んにして、煩嘔・呻吟し、錯語して眠るを得ざるを療するに、皆佳し。伝えて諸人に語り、之を用いて亦効あり。此れ直ちに熱毒を解し、酷熱を除く。必ずしも飲酒して劇しき者ならず、此の湯もて療すること五日中に神効あり。豬肉・冷水を忌む。\n\n**原文**（翻刻確認）\n又前軍督護劉車者、得時疾三日、已汗解、因飲酒復劇、苦煩悶乾嘔、口燥呻吟、錯語不得卧、余思作此黄連解毒湯方。\n\n一服目明、再服進粥、於此漸差。余以療凡大熱盛、煩嘔呻吟、錯語不得眠、皆佳。傳語諸人、用之亦效。此直解熱毒、除酷熱、不必飲酒劇者、此湯療五日中神效。忌豬肉冷水。\n\n**現代語訳**（訳：社員案）\n前軍督護の劉車という者が、流行病にかかって3日目に、発汗してすでに治っていたが、飲酒によって再びひどくなり、胸苦しい悶えと空えずきに苦しみ、口が乾いてうめき、うわごとを言って横になれなかった。そこで私はこの黄連解毒湯を考えて作った。1回服すと目がはっきりし、2回服すと粥が食べられるようになり、そこから次第に治った。私はこれを用いて、およそ高熱が盛んで、胸苦しく吐き気があってうめき、うわごとを言って眠れないものを治したが、いずれもよく効いた。人々に伝えたところ、用いた者にもやはり効いた。これは直ちに熱毒を解き、激しい熱を除く。飲酒でひどくなったものでなくても、この湯で治療すれば5日のうちに著しく効く。豚肉と冷水を避ける。\n\n### 注記\n- 『肘後百一方』では本方に方名がない。「若已六七日…欲起走」の条の下に並ぶ「又方」の一つとして載り、最後に「治煩嘔不得眠」とある（翻刻確認）\n- 方名「黄連解毒湯」は『外台秘要方』巻一の崔氏方に出る（翻刻確認）\n- 翻刻のページ名は『肘後備急方』（四庫全書本、晋・葛洪撰）。同書の提要に、陶弘景が補って『肘後百一方』とし、楊用道が附広したとある（翻刻確認）\n- 『外台秘要方』の「復劇」の「劇」は、四庫全書本の翻刻では外字のため確認できず、別の翻刻本では「劇」（要原本照合）\n- 『外台秘要方』の「乾嘔」は、別の翻刻本では「幹嘔」と書かれる（機械的な繁体化によるものとみられる。要原本照合）\n- 『外台秘要方』の「余」は、四庫全書本では「余」、別の翻刻本では「餘」（要原本照合）\n- 『外台秘要方』の構成の「黄柏」は、四庫全書本では「黄蘗」と書かれる（要原本照合）", "出典": "### 原典の構成\n- 『肘後百一方』：黄連3両、黄檗（黄柏）・黄芩 各2両、梔子14枚（翻刻確認）\n- 『外台秘要方』（崔氏方）：黄連3両、黄芩・黄柏 各2両、梔子14枚（擘く）（翻刻確認）\n\n### 原典の服用法\n- 『肘後百一方』：水6升で煎じて2升を取り、2回に分けて服す（翻刻確認）\n- 『外台秘要方』（崔氏方）：4味を刻み、水6升で煮て2升を取り、2回に分けて服す。猪肉・冷水を忌む（翻刻確認）\n\n### 処方の変遷\n- 『肘後百一方』に方名のない「又方」として4味が載り、『外台秘要方』巻一の崔氏方で「黄連解毒湯」の名が付く（翻刻確認）\n- 『傷寒活人書』巻十八にも同じ主治で収載される（要原本照合）\n- 劉完素『黄帝素問宣明論方』巻四・熱論では、黄連・黄柏・黄芩・大黄の大金花丸から大黄を去り梔子を加えたものを梔子金花丸とし、巻六・傷寒方では黄連解毒湯を茶と共に煎服する。腹満・嘔吐などに半夏・厚朴・茯苓を加え生姜で煎じる半夏黄連解毒湯の記載もある（要原本照合）\n- 劉完素『傷寒直格方』巻下では、細末にして水で丸じ温水で服す法を載せる（要原本照合）\n- 書によって梔子金花丸に大黄を含むものと含まないものがあり、方名は錯雑している（要原本照合）\n- 『万病回春』巻二・傷寒には柴胡・連翹を加えた6味の黄連解毒湯、同書の火証にはさらに芍薬を加えた方が載る。後者は後の一貫堂の四物黄連解毒湯のもとになったとされる（要原本照合）\n- 『外科正宗』巻二・疔瘡論では、連翹・甘草・牛蒡子を加えて灯心で煎服する（要原本照合）\n- 現行エキス剤（ツムラ15）は 黄芩3.0・黄連2.0・山梔子2.0・黄柏1.5g（7.5g中）の4味（PMDA 添付文書 2023年12月改訂で確認）。原典は黄連が最も多い", "構成": "黄芩・黄連・山梔子・黄柏", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "越婢加朮湯", "名前": "越婢加朮湯", "読み": "えっぴかじゅつとう", "ツムラ番号": "28", "出典": "金匱要略（水気病脈証并治第十四）／金匱要略（中風歴節病脈証并治第五・千金方の引用）", "本文": {"条文": "### 『金匱要略』水気病脈証并治第十四（裏水の条）\n\n**書き下し**（読み：社員案）\n裏水なる者は、一身面目黄腫し、其の脈沈、小便不利す、故に水を病ましむ。仮如し小便自利すれば、此れ津液を亡う、故に渇せしむるなり。越婢加朮湯之を主る。（方は下に見ゆ）\n\n**原文**（翻刻確認）\n裏水者，一身面目黃腫，其脈沉，小便不利，故令病水。假如小便自利，此亡津液，故令渴也。越婢加朮湯主之。（方見下）\n\n**現代語訳**（訳：社員案）\n裏水とは、全身と顔・目が黄色く腫れ、脈は沈で、小便の出が悪いもので、そのために水の病となる。もし小便が自然によく出るなら、それは津液を失っているので、口が渇くようになる。越婢加朮湯がこれを主治する。\n\n### 『金匱要略』水気病脈証并治第十四（裏水の条・2か所目）\n\n**書き下し**（読み：社員案）\n裏水は、越婢加朮湯之を主る。甘草麻黄湯も亦之を主る。\n\n**原文**（翻刻確認）\n裏水，越婢加朮湯主之；甘草麻黃湯亦主之。\n\n**現代語訳**（訳：社員案）\n裏水には越婢加朮湯が主治する。甘草麻黄湯もまたこれを主治する。\n\n### 『金匱要略』中風歴節病脈証并治第五・附方（『千金方』越婢加朮湯）\n\n**書き下し**（読み：社員案）\n肉極にて、熱すれば則ち身体の津脱し、腠理開きて汗大いに泄れ、厲風の気あり、下焦の脚弱きを治す。\n\n**原文**（翻刻確認）\n治肉極，熱則身體津脫，腠理開，汗大泄，厲風氣，下焦腳弱。\n\n**現代語訳**（訳：社員案）\n肉極で、熱があると体の津液が抜け出し、腠理（皮膚のきめ）が開いて汗が大量に漏れ、厲風の気があり、下半身の脚が弱いものを治す。\n\n### 関連条文（越婢湯の条）\n\n**書き下し**（読み：社員案）\n風水、悪風し、一身悉く腫れ、脈浮にして渇せず、続いて自ずから汗出で、大熱無きは、越婢湯之を主る。\n\n**原文**（翻刻確認）\n風水惡風，一身悉腫，脈浮不渴，續自汗出，無大熱，越婢湯主之。（「惡風」は要原本照合）\n\n**現代語訳**（訳：社員案）\n風水で、風を嫌い、全身がことごとく腫れ、脈は浮で口は渇かず、汗が絶えず自然に出て、ひどい熱のないものは、越婢湯が主治する。\n\n### 注記\n- 「朮」は、四部叢刊本（明嘉靖俞橋刊本の影印）の翻刻では「术」と書かれる（要原本照合）\n- 千金方越婢加朮湯の「肉極」は、四部叢刊本の翻刻では「内極」と書かれる（要原本照合）\n- 越婢湯の条の「惡風」は、四部叢刊本の翻刻では「急風」と書かれる（要原本照合）\n- 千金方越婢加朮湯の生姜は、越婢湯本体と一致する3両（四部叢刊本の翻刻）を本文に採った。別の翻刻本では2両（要原本照合）\n- 千金方越婢加朮湯の煎じ方の「先煮麻黃去沫」は、四部叢刊本の翻刻では「去上沫」と書かれる（要原本照合）\n- 「一身面目黃腫」の「黃」は『脈経』では「洪」とされる（要原本照合。資料50頁の引用による）\n- 越婢湯の条は越婢加朮湯の元の方の条として載せた。越婢加朮湯の方はこの条の後ろの越婢湯の方に朮を加えたものとして示される（「出典」を参照）", "出典": "### 原典の構成\n- 『金匱要略』水気病第十四（越婢加朮湯）：越婢湯（麻黄6両、石膏半斤、生姜3両、大棗15枚、甘草2両）に白朮4両を加える（翻刻確認）\n- 『金匱要略』中風歴節病第五・附方（『千金方』越婢加朮湯）：麻黄6両、石膏半斤、生姜3両、甘草2両、白朮4両、大棗15枚（翻刻確認。生姜の異同は条文の注記を参照）\n\n### 原典の服用法\n- 『金匱要略』水気病第十四（越婢湯の方）：5味を水6升で、まず麻黄を煮て上の泡を去り、残りの薬を入れて3升に煮詰め、3回に分けて温服する。悪風する者は附子1枚（炮）を加える。風水には朮4両を加える（古今録験）（翻刻確認）\n- 越婢加朮湯は越婢湯の方の中に白朮4両を加えるとだけあり、別の煎じ方の記載はない（翻刻確認）\n- 『金匱要略』中風歴節病第五・附方（『千金方』越婢加朮湯）：6味を水6升で、まず麻黄を煮て上の泡を去り、残りの薬を入れて3升に煮詰め、3回に分けて温服する。悪風には附子1枚（炮）を加える（翻刻確認）\n\n### 処方の変遷\n- 水気病第十四の越婢加朮湯の条には「方は下に見ゆ」とあり、方は越婢湯の後ろに「越婢湯の中に白朮4両を加える。また脚気の中にも見える」という注で示される（翻刻確認）\n- 越婢湯の方後に、風水には朮4両を加えるという『古今録験』の注がある（翻刻確認）\n- 中風歴節病第五の附方に、『千金方』の越婢加朮湯として同じ6味が肉極の方として載る（翻刻確認）\n- 原典の朮は、越婢加朮湯の方後注と『千金方』の附方では「白朮」、越婢湯の方後の『古今録験』の注では「朮」とだけ書かれる（翻刻確認）\n- 現行エキス剤（ツムラ28）は 石膏・麻黄・蒼朮・大棗・甘草・生姜 の6味で、朮は蒼朮（PMDA 添付文書 2023年12月改訂で確認）", "構成": "石膏・麻黄・蒼朮・大棗・甘草・生姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "黄耆建中湯", "名前": "黄耆建中湯", "読み": "おうぎけんちゅうとう", "ツムラ番号": "98", "出典": "金匱要略（血痺虚労病脈証并治第六）", "本文": {"条文": "### 『金匱要略』血痺虚労病脈証并治第六\n\n**書き下し**（読み：社員案）\n虚労、裏急、諸の不足は、黄耆建中湯之を主る。\n\n（原注）小建中湯の内に於いて黄耆一両半を加え、余は上法に依る。気短、胸満する者は生姜を加え、腹満する者は棗を去り茯苓一両半を加う。及び肺の虚損不足を療し、気を補うには半夏三両を加う。\n\n**原文**（翻刻確認）\n虛勞裏急、諸不足、黃耆建中湯主之。\n\n（原注）於小建中湯內加黃耆一兩半、餘依上法。氣短胸滿者加生薑、腹滿者去棗加茯苓一兩半、及療肺虛損不足、補氣加半夏三兩。\n\n**現代語訳**（訳：社員案）\n虚労で、裏急（腹がひきつれる）があり、もろもろの不足があるものは、黄耆建中湯が主治する\n\n（原注）小建中湯に黄耆1両半を加え、ほかは前の小建中湯の法に従う。息切れして胸が張るものには生姜を加え、腹が張るものには大棗を去って茯苓1両半を加える。肺の虚損・不足を治して気を補うには半夏3両を加える\n\n### 注記\n- 原注は条文に続く小字双行の注（資料の記載）\n- 原典の構成の小建中湯の甘草は、『金匱要略』の小建中湯方では3両（翻刻確認）、『傷寒論』（宋本）の小建中湯方では2両（要原本照合）。本文は『金匱要略』の値をとった", "出典": "### 原典の構成\n- 小建中湯（桂枝3両（去皮）・甘草3両（炙）・大棗12枚・芍薬6両・生姜3両・膠飴1升）に黄耆1両半を加える（翻刻確認）\n- 加減：気短・胸満には生姜を加える。腹満には大棗を去り茯苓1両半を加える。肺の虚損・不足を治し気を補うには半夏3両を加える（翻刻確認）\n\n### 原典の服用法\n- 小建中湯の法に依る：水7升で煮て3升を取り、滓を去り、膠飴を入れて再び弱火にかけて溶かし、1升を温服、日に3回（翻刻確認）\n- 小建中湯の条の注に、嘔家には甘いため建中湯を用いてはならないとある（翻刻確認）\n\n### 処方の変遷\n- 原典の注のとおり、小建中湯に黄耆を加えた方（翻刻確認）\n- 『備急千金要方』第十九・腎蔵・補腎第八の黄耆建中湯方には、嘔には生姜を倍にし、腹満には大棗を去り茯苓4両を加える加減法が付く（要原本照合）\n- 『太平恵民和剤局方』巻之五・補虚損（附 骨蒸）の黄耆建中湯は、白芍薬・肉桂・黄耆・甘草を生姜・大棗で煎じ、餳を少し入れて再び煎じる（要原本照合）\n- 『仁斎直指附遺方論』巻三・湿・中湿証治の黄耆建中湯は、黄耆・辣桂・甘草・白芍薬で、膠飴を用いない（要原本照合）\n- 『万安方』（梶原性全）巻第十四上・虚労門上・諸虚労通薬の黄耆建中湯（良験方）は、白芍薬・黄耆・桂心・甘草を生姜・大棗で煎じ、飴を少し入れて溶かす（要原本照合）\n- 『万安方』巻十四下の黄耆建中湯（必用方）は、乾大棗・生姜・黄耆・甘草・官桂・白芍薬・人参・半夏で、膠飴または糯米餳を入れる（要原本照合）\n- 『衆方規矩』（曲直瀬道三原著・曲直瀬玄朔増補）巻之中・自汗盗汗の黄耆建中湯は膠飴を用いない（要原本照合）\n- 『療治経験筆記』（津田玄仙）巻之五・六・汗門の黄耆建中湯は、黄耆・桂・芍薬・生姜・大棗・膠飴で甘草を用いない（要原本照合）\n- 『普済本事方』（許叔微）巻第八・傷寒時疫上に、建中湯に当帰・黄耆を加えた黄耆建中加当帰湯がある（要原本照合）\n- 『千金要方』に引かれる『古今録験方』の加減（乾姜を生姜に代え当帰4両を加える）は、実際上は華岡青洲の帰耆建中湯にあたると資料はする（要確認）\n- 現行エキス剤（ツムラ98）は 芍薬・黄耆・桂皮・大棗・甘草・生姜 の混合生薬の乾燥エキスに膠飴（日局コウイ）を加えたもの。1日量は芍薬6.0・黄耆4.0・桂皮4.0・大棗4.0・甘草2.0・生姜1.0g、コウイ10.0g（PMDA 添付文書 2023年12月改訂で確認）", "構成": "芍薬・黄耆・桂皮・大棗・甘草・生姜・膠飴", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "胃苓湯", "名前": "胃苓湯", "読み": "いれいとう", "ツムラ番号": "115", "出典": "医塁元戎（巻四・陽明証）／古今医鑑（巻五・泄瀉）／万病回春（巻三・泄瀉）", "本文": {"条文": "### 『医塁元戎』巻四・陽明証\n\n**書き下し**（読み：社員案）\n五苓・平胃各半の散、生薑にて調服し、心下の水を治す。五苓に石膏・寒水石・甘草を加えて甘露飲と為す。亦た心下の水、並びに飲酒して水瀉する者を治す。生薑にて三五銭を調え、清濁立ちどころに分かる。\n\n**原文**（翻刻確認）\n五苓平胃各半散、生薑調服、治心下水。五苓加石膏寒水石甘草、為甘露飲、亦治心下水並飲酒水瀉者、生薑調三五錢、清濁立分。\n\n**現代語訳**（訳：社員案）\n五苓散と平胃散を半分ずつ合わせた散を、生姜で溶いて服用し、心下の水を治す。五苓散に石膏・寒水石・甘草を加えると甘露飲となり、これも心下の水と、飲酒して水様の下痢をするものを治す。生姜で3〜5銭を溶いて服すと、清濁がたちまち分かれる。\n\n### 『古今医鑑』巻五・泄瀉\n\n**書き下し**（読み：社員案）\n暑に中り湿に傷られ、飲を停め食を夾み、脾胃和せず、腹痛泄瀉し、渇を作し、小便利せず、水穀化せず、陰陽分かれざるを治す。\n\n**原文**（翻刻確認）\n治中暑傷濕、停飲夾食、脾胃不和、腹痛泄瀉、作渴、小便不利、水穀不化、陰陽不分。\n\n**現代語訳**（訳：社員案）\n暑さに当たり湿に傷られ、水飲が停滞したうえに飲食の停滞も挟まり、脾胃が調和せず、腹痛して下痢し、口が渇き、尿の出が悪く、飲食物が消化されず、陰陽が分かれないものを治す。\n\n### 『万病回春』巻三・泄瀉\n\n**書き下し**（読み：社員案）\n泄瀉、清濁分かれざる者は、湿多くして五瀉を成すなり。胃苓湯　脾胃和せず、腹痛泄瀉し、水穀化せず、陰陽分かれざるを治す。\n\n**原文**（翻刻確認）\n泄瀉清濁不分者、濕多成五瀉也。胃苓湯　治脾胃不和、腹痛泄瀉、水穀不化、陰陽不分。\n\n**現代語訳**（訳：社員案）\n泄瀉で清濁が分かれないものは、湿が多くて五種の下痢となったものである。胃苓湯は、脾胃が調和せず、腹痛して下痢し、飲食物が消化されず、陰陽が分かれないものを治す。\n\n### 注記\n- 『医塁元戎』の条には「胃苓湯」の方名がない（翻刻確認）\n- 『医塁元戎』の「瀉」は、維基文庫の本（12巻本・四庫全書本とも）では「㵼」と書かれる（字体の違い）\n- 『医塁元戎』の「生薑調三五錢、清濁立分」が甘露飲だけにかかるのか、五苓平胃各半散にもかかるのかは、原文からは決めにくい（要原本照合）\n- 『万病回春』の胃苓湯の条には、『古今医鑑』の「中暑傷湿、停飲夾食」「作渇、小便不利」の句がない（翻刻確認）\n- 『万病回春』の「泄瀉清濁不分者、湿多成五瀉也」は、泄瀉の門の中で胃苓湯の前に置かれた見出しの句（翻刻確認）\n- 「停飲夾食」の「夾」は、書によって「挾」とも書かれる（要原本照合）。『醫方集解』（清・汪昂）は「停飲夾食」と書く（翻刻確認）\n- 『古今医鑑』の「泄瀉」は、資料の書き下しでは「洩瀉」と書かれる（要原本照合）\n- 『古今医鑑』の巻数は、維基文庫の本では本文が巻之五・泄瀉、冒頭の目次では巻三に洩瀉とある（翻刻確認）。資料は巻之五・泄瀉とする\n- 『古今医鑑』は龔信の撰で、序に「家君暨廷賢所編輯」とあり、子の龔廷賢も編纂に関わる（翻刻確認）。『万病回春』は龔廷賢（明）の著（翻刻確認）", "出典": "### 原典の構成\n- 『医塁元戎』：五苓散・平胃散 各半（翻刻確認）\n- 『古今医鑑』：蒼朮（米泔浸）・厚朴（姜汁炒）・陳皮・猪苓・沢瀉・白朮（炒）・白茯苓・白芍（炒） 各1銭、肉桂・甘草（炙） 各3分（翻刻確認）\n- 『万病回春』：蒼朮（米泔制）・厚朴（姜汁炒）・陳皮・猪苓・沢瀉・白朮（去芦）・茯苓（去皮）・白芍（煨） 各1銭、肉桂・甘草（炙） 各2分（翻刻確認）\n\n### 原典の服用法\n- 『医塁元戎』：散とし、生姜で調服する（翻刻確認）\n- 『古今医鑑』：1剤に刻み、生姜・棗を入れて水で煎じ、温服する（翻刻確認）\n- 『万病回春』：1剤に刻み、生姜・棗を入れて煎じ、空腹時に温服する（翻刻確認）\n\n### 処方の変遷\n- 平胃散と五苓散の合方。資料は、本方の出典は平胃散・五苓散の出典の上に成り立ち、そのうえで芍薬を含むかどうかで二つに分かれるとする\n- 五苓散の出典は『傷寒論』『金匱要略』（翻刻確認）。平胃散の出典は『博済方』『簡要済衆方』（要原本照合）。どちらも資料の出典欄に胃苓湯の出典と並べて挙げられている\n- 芍薬を含まない系統：『医塁元戎』（王好古・元）巻四・陽明証に「五苓平胃各半散」がある。胃苓湯の方名はない（翻刻確認）\n- 資料は、『医塁元戎』の原序に丁酉（1237年）、跋に辛卯（1231年）に成書したが元藁を盗まれて丁酉春に再編したとあり、現在の12巻本は顧遂が嘉靖22年（1543）に刊行し、万暦21年（1593）に屠本畯が重刊したものとする\n- 資料は、『医塁元戎』の一巻本・巻第八・太陰証・平胃散加減例に、平胃散を五苓散と半分ずつ合わせたものを対金飲子とする記載があるとする（要原本照合。維基文庫の四庫全書本12巻には見当たらない）\n- 資料は、羅天益『衛生宝鑑』巻十六・泄痢門・濡泄の対金飲子を、平胃散5銭・五苓散2銭半・草豆蔲5銭を姜・棗で煎服する方とする（要原本照合）\n- 『婦人大全良方』（陳自明）巻八に胃苓散があり、「治夏秋之間脾胃傷冷水穀不分泄瀉不止」「五苓散　平胃散」「右合和薑棗煎空心服妙陳日華方」とある（翻刻確認）。資料はこれを、胃苓湯がもとは胃苓散という方名だった根拠とする\n- 『世医得効方』巻五に「胃苓湯」の名で五苓散と平胃散を合わせて用いる記載がある（翻刻確認）。同書の著者・時代は要確認。分量の「二銭合和」の読み（各2銭か合わせて2銭か）は要原本照合\n- 『丹渓心法』（朱震亨）にも「胃苓湯」の名で五苓散と平胃散を合わせる記載がある（翻刻確認）\n- 資料は、朱佐『類編朱氏集験医方』巻之四・脾胃門の虚腫に、胃苓丸を腫れに用い、木通湯で呑み下す記載があるとする（要原本照合）\n- 『薛氏医案』巻六十では胃苓散とも呼び、末にして蜜丸にしたものを胃苓膏とする（翻刻確認）。資料は、ここの薬味は白朮・茯苓・沢瀉・厚朴・猪苓・陳皮・甘草・桂で、蒼朮を含まないとする（要原本照合）\n- 芍薬を含む系統：『古今医鑑』巻五・『万病回春』巻三の胃苓湯には白芍が入る（翻刻確認）。資料は、芍薬を含む胃苓湯の出典は従来『万病回春』とされてきたが、薬味は両書で同じで、『古今医鑑』の刊行は『万病回春』より11年早いとする\n- 資料は、呉尚黙訂『丹渓手鏡』巻之中・泄瀉二十六の平胃五苓散（平胃散・五苓散・白朮・芍薬・甘草）にも芍薬が入るとし、同書は明の天啓元年（1621）の撰とする（要原本照合）\n- 現行の医療用エキス剤（ツムラ115）は 蒼朮・厚朴・陳皮・猪苓・沢瀉・白朮・茯苓 各2.5g、桂皮2.0g、生姜・大棗 各1.5g、甘草1.0g の11味で、芍薬は入っていない（PMDA 添付文書 2023年12月改訂で確認）\n- 資料の組成欄は、芍薬を括弧で囲んで示し、本方を「五苓散合平胃散（加芍薬）」と説明する。そのうえで、現在は芍薬を配合した医療用エキス製剤はないとする\n- 資料は、かつては芍薬を含まない胃苓湯と含む胃苓湯の両方が医療用エキス製剤として薬価収載されていたが、芍薬を含む製剤は平成24年（2012）3月31日に経過措置期間が終わって薬価削除になった（そのメーカーは一般用漢方製剤として芍薬を含む胃苓湯を販売している）とする。このため資料は、現在の医療用エキス製剤胃苓湯の最終的な出典を『医塁元戎』とする", "構成": "蒼朮・厚朴・陳皮・猪苓・沢瀉・白朮・茯苓・桂皮・生姜・大棗・甘草", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "黄連湯", "名前": "黄連湯", "読み": "おうれんとう", "ツムラ番号": "120", "出典": "傷寒論（弁太陽病脈証并治下第七）", "本文": {"条文": "### 『傷寒論』弁太陽病脈証并治下第七\n\n**書き下し**（読み：社員案）\n傷寒、胸中に熱有り、胃中に邪気有り、腹中痛み、嘔吐せんと欲する者は、黄連湯之を主る。\n\n**原文**（翻刻確認）\n傷寒、胸中有熱、胃中有邪氣、腹中痛、欲嘔吐者、黄連湯主之。\n\n**現代語訳**（訳：社員案）\n傷寒で、胸の中に熱があり、胃の中に邪気があって、腹が痛み、吐きそうになる者は、黄連湯が主治する。\n\n### 注記\n- 宋本の翻刻では、方の服用法の後に林億らの「疑うらくは仲景の方に非ず」の注は見当たらない。資料は原典の後条文の最後にこの注があるとする（要原本照合）\n- 成無己『注解傷寒論』巻第四ではこの注がない（翻刻確認）。資料も同じ指摘をしている\n- 「胸中」は通行本（宋本）の字を採った。四庫全書本の成無己注本では「胷中」と書かれる（要原本照合）\n- 服用法は宋本の「温服、昼三、夜二」を採った。成無己注本では「温服一升、日に三服、夜に二服」と1回量が書かれる（要原本照合）", "出典": "### 原典の構成\n- 『傷寒論』：黄連3両、甘草（炙）3両、乾姜3両、桂枝（去皮）3両、人参2両、半夏（洗）半升、大棗（擘）12枚（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』：7味を水1斗で煮て6升を取り、滓を去って温服する。昼に3回、夜に2回（翻刻確認）\n\n### 処方の変遷\n- 『傷寒論』の半夏瀉心湯（黄連1両・黄芩3両）から黄芩を去り桂枝を加え、黄連を3両に増やした形。徐大椿『傷寒類方』瀉心湯類は「半夏瀉心湯去黄芩加桂枝」とする（半夏瀉心湯の構成は翻刻確認。『傷寒類方』は要原本照合）\n- 『祖剤』巻之一は、伊尹甘草瀉心湯を祖とし、黄連湯を半夏瀉心湯に黄連2両・桂枝3両を加え人参1両を減じた方として載せる。黄芩を去ることには触れない（要原本照合）\n- 東洞は、林億の「仲景の方に非ず」の注にかかわらず『類聚方』に本方を採っている。東洞がこの注のない成無己本を拠りどころにしていたためとされる（要原本照合）\n- 現行エキス剤（ツムラ120）は 半夏・黄連・乾姜・甘草・桂皮・大棗・人参 の7味。半夏6.0g、他の6味は各3.0g（PMDA 添付文書 2023年12月改訂 第1版で確認）。原典の桂枝は桂皮、人参は原典の2両に対し他の薬と同量になっている", "構成": "半夏・黄連・乾姜・甘草・桂皮・大棗・人参", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "加味帰脾湯", "名前": "加味帰脾湯", "読み": "かみきひとう", "ツムラ番号": "137", "出典": "薛氏医案（内科摘要・各症方薬）／薛氏医案（口歯類要・附方并注）／薛氏医案（明医雑著・附方）／薛氏医案（保嬰撮要・巻三・天釣内釣）", "本文": {"条文": "### 『内科摘要』各症方薬（薛己）\n\n**書き下し**（要原本照合）\n\n**原文**（要原本照合）\n資料に原文の記載がない（要確認）\n\n**現代語訳**\n\n### 『口歯類要』附方并注（薛己）\n\n**書き下し**（要原本照合）\n\n**原文**（要原本照合）\n資料に原文の記載がない（要確認）\n\n**現代語訳**\n\n### 『明医雑著』附方（王綸撰・薛己訂）\n\n**書き下し**（要原本照合）\n\n**原文**（要原本照合）\n資料に原文の記載がない（要確認）\n\n**現代語訳**\n\n### 『保嬰撮要』巻三・天釣内釣（薛氏医案）\n\n**書き下し**（要原本照合）\n\n**原文**（要原本照合）\n資料に原文の記載がない（要確認）\n\n**現代語訳**\n\n### 注記\n- 4書とも、資料（sources/３.pdf の本の111〜112頁）には書き下しの引用だけがあり、原文はない。翻刻で原文を確かめられなかったため、公開側の書き下し・現代語訳は空欄にした。資料の書き下しは手元版に置く（要原本照合）\n- 4書とも、加味帰脾湯は帰脾湯（「前方」）の後に項を改めて載り、帰脾湯に薬を加えたものとして示される（要原本照合）\n- 『保嬰撮要』の方は、茯苓ではなく茯神を用いる（要原本照合）", "出典": "### 原典の構成\n- 『内科摘要』各症方薬：前方（帰脾湯）に柴胡・山梔を加える（分量の記載は資料にない）（要原本照合）\n- 『口歯類要』附方并注：前方（帰脾湯）に柴胡・丹皮・山梔を加える（分量の記載は資料にない）（要原本照合）\n- 『明医雑著』附方：前方（帰脾湯）に牡丹皮・山梔 各1銭を加える（要原本照合）\n- 『保嬰撮要』巻三・天釣内釣：加味薬は牡丹皮・山梔子で、茯苓ではなく茯神を用いる（分量の記載は資料にない）（要原本照合）\n\n### 原典の服用法\n\n### 処方の変遷\n- 加味帰脾湯は、帰脾湯に諸薬を加えた方（要原本照合）\n- 資料の出典欄には『聖済総録』『厳氏済生方』『玉機微義』『薛氏医案』が並ぶ。帰脾湯そのものの出典は、帰脾湯を登録するときに帰脾湯の側に載せる（要確認）\n- 『薛氏医案』には3通りの加味帰脾湯がある。柴胡・山梔子を加えるもの（『内科摘要』『女科撮要』『正体類要』『婦人良方』『銭氏小児直訣』）、柴胡・牡丹皮・山梔子を加えるもの（『口歯類要』）、牡丹皮・山梔子を加えるもの（『明医雑著』『保嬰撮要』）。このうち『銭氏小児直訣』と『保嬰撮要』は茯苓でなく茯神を用いる（要原本照合）\n- 一部の書は本方の出典を『済世全書』とするが、『薛氏医案』の諸書にすでに収載されている（要確認）\n- 『古今医鑑』巻之十一・婦人科虚労の「加味帰脾湯」は、薬味が帰脾湯と同じで加味薬がない（要原本照合）\n- 『医宗必読』巻之八・心腹諸痛の「加味帰脾湯」は、帰脾湯に煨姜・菖蒲・桂心を加えたもので、柴胡・山梔を加える者もあると注される（要原本照合）\n- 現行エキス剤（ツムラ137）は 黄耆・柴胡・酸棗仁・蒼朮・人参・茯苓・竜眼肉・遠志・山梔子・大棗・当帰・甘草・生姜・木香 の14味で、柴胡・山梔子を加える系統。牡丹皮は入らず、朮は蒼朮（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "黄耆・柴胡・酸棗仁・蒼朮・人参・茯苓・竜眼肉・遠志・山梔子・大棗・当帰・甘草・生姜・木香", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "黄芩湯", "名前": "黄芩湯", "読み": "おうごんとう", "ツムラ番号": "", "出典": "傷寒論（弁太陽病脈証并治下第七）", "本文": {"条文": "### 『傷寒論』弁太陽病脈証并治下第七\n\n**書き下し**（読み：社員案）\n太陽と少陽との合病、自下利する者は、黄芩湯を与う。若し嘔する者は、黄芩加半夏生姜湯之を主る。\n\n**原文**（翻刻確認）\n太陽與少陽合病、自下利者、與黃芩湯。若嘔者、黃芩加半夏生薑湯主之。\n\n**現代語訳**（訳：社員案）\n太陽と少陽の合病で、自然に下痢するものには黄芩湯を与える。もし嘔吐するものは、黄芩加半夏生姜湯がこれを主治する。\n\n### 関連条文（誤治の例）\n\n『傷寒論』弁厥陰病脈証并治第十二。黄芩湯で解熱させてはいけない例として資料が挙げる条。\n\n**書き下し**（読み：社員案）\n傷寒、脈遅なること六七日、而るに反って黄芩湯を与えて其の熱を徹す。脈遅は寒と為す。今黄芩湯を与えて復た其の熱を除けば、腹中応に冷ゆべく、当に食すること能わざるべし。今反って能く食す。此れを除中と名づく。必ず死す。\n\n**原文**（翻刻確認）\n傷寒脈遲、六七日、而反與黃芩湯徹其熱。脈遲為寒、今與黃芩湯復除其熱、腹中應冷、當不能食。今反能食、此名除中、必死。\n\n**現代語訳**（訳：社員案）\n傷寒で脈が遅のまま六、七日たっているのに、かえって黄芩湯を与えてその熱を取り去った。脈遅は寒である。いま黄芩湯を与えてさらにその熱を除けば、腹中は冷えるはずで、食べられなくなるはずである。ところがかえって食べられる。これを除中といい、必ず死ぬ。\n\n### 注記\n- 太陽少陽合病の条は、宋本の翻刻・『注解傷寒論』の四庫全書本（書名『傷寒論注釋』）巻四・『金匱玉函経』で字が同じ（翻刻確認。黄／黃の字形の差のみ）\n- 大棗の枚数は、維基文庫の宋本の翻刻では「二十枚」と書かれる。同じ条の黄芩加半夏生姜湯（宋本）、『注解傷寒論』の四庫全書本、『金匱玉函経』ではいずれも「十二枚」で、原典の構成は12枚とした（要原本照合）\n- 除中の条は、『金匱玉函経』では「今與黃芩湯」が「而與黃芩湯」、「此名除中」が「此為除中」と書かれる（要原本照合）。本文は宋本の字を採った", "出典": "### 原典の構成\n- 『傷寒論』：黄芩3両、芍薬2両、甘草2両（炙）、大棗12枚（擘）（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』：4味を水1斗で煮て3升を取り、滓を去り、1升を温服する。日に2回、夜に1回服す（翻刻確認）\n\n### 処方の変遷\n- 芍薬甘草湯（芍薬・甘草）に黄芩・大棗を加えた構成。主薬は黄芩\n- 『太平聖恵方』（王懐隠等）巻第八・傷寒三陰三陽応用湯散諸方の黄芩湯方は黄芩・赤芍薬・甘草の3味で大棗を含まず、散として煎服する（要原本照合）\n- 『小児衛生総微論方』（撰者不詳）巻第七・傷寒論の黄芩湯も黄芩・赤芍薬・甘草の3味を㕮咀して煎服し、傷寒の口舌の諸病（舌黄・舌黒・舌腫・舌裂・芒刺・舌上出血）と鼻衄に用いる（要原本照合）\n- 『扶寿精方』（呉旻）傷寒では、4味はそのままで黄芩芍薬湯と名を変え、姜を入れて煎じる（要原本照合）\n- 曲直瀬道三口授『師語録』巻下一の芍薬黄芩湯は黄芩・芍薬・茯苓・甘草で、黄芩湯から大棗を去り茯苓を加えた方（要原本照合）\n- 『金匱要略』に載る黄芩湯は『外台秘要方』の黄芩湯で、本方とは別方（六物黄芩湯とも呼ばれる）（要原本照合）\n- 医療用エキス剤は見当たらない（KEGG MEDICUS の医療用医薬品で該当0件、2026-10-21。PMDA 添付文書は未確認）。資料の組成は黄芩4・芍薬3・甘草3・大棗4（単位の記載なし。要確認）", "構成": "黄芩・芍薬・甘草・大棗（要確認）", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "葛根加朮附湯", "名前": "葛根加朮附湯", "読み": "かっこんかじゅつぶとう", "ツムラ番号": "", "出典": "方機（葛根湯の条）", "本文": {"条文": "### 『方機』葛根湯の条\n\n**書き下し**（要原本照合）\n\n**原文**（要原本照合）\n\n**現代語訳**\n\n### 注記\n- 『方機』の葛根湯の条は「朮」とだけ書き、蒼朮か白朮かを書かない（要原本照合。資料の論考②による）\n- 『方機』の条は、葛根湯の方の中に朮・附子を加えるとし、「加朮附湯」の名で腫脹・疼痛・頑腫悪腫・丹毒の類などに挙げ、紫円の兼用を添える（要原本照合。資料の引用は途中を省いている）", "出典": "### 原典の構成\n- 『方機』：葛根湯の方の中に朮・附子 各4分を加える（要原本照合）\n\n### 原典の服用法\n\n### 処方の変遷\n- 葛根湯に朮・附子を加えた加味方。葛根湯の出典は『傷寒論』巻第三・弁太陽病脈証并治中第六と『金匱要略』痙湿暍病脈証并治第二で、葛根湯の条文は葛根湯の項に載せる\n- 資料の出典欄は『傷寒論』『金匱要略』『方機』の3書を挙げる。葛根加朮附湯の名が出るのは『方機』の葛根湯の条（要原本照合）\n- 『方機』の著者・成立年は資料に記載がない（要確認）\n- 『類聚方広義』（上）の葛根湯の頭注にも、本方に朮附を加えて葛根加朮附湯と名づけるとある（要原本照合）\n- 構成は、桂枝加朮附湯（桂皮・芍薬・甘草・生姜・大棗・蒼朮・附子）に葛根・麻黄を加えたものと同じになる\n- 医療用エキス剤はツムラにはなく、三和生薬の「三和葛根加朮附湯エキス細粒」がある（KEGG MEDICUS と PMDA で 2026-10-22 確認）\n- 三和葛根加朮附湯エキス細粒は 葛根・麻黄・桂皮・甘草・芍薬・大棗・生姜・蒼朮・加工ブシ の9味で、朮は蒼朮、附子は加工ブシ（PMDA 添付文書 2025年10月改訂 第2版で確認）", "構成": "葛根・麻黄・桂皮・甘草・芍薬・大棗・生姜・蒼朮・附子（加工ブシ）", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "甘草湯", "名前": "甘草湯", "読み": "かんぞうとう", "ツムラ番号": "", "出典": "傷寒論（弁少陰病脈証并治第十一）／金匱要略（肺痿肺癰咳嗽上気病脈証并治第七・附方、千金方の引用）", "本文": {"条文": "### 『傷寒論』弁少陰病脈証并治第十一\n\n**書き下し**（読み：社員案）\n少陰病、二三日、咽痛む者は、甘草湯を与うべし。差えざる者は、桔梗湯を与う。\n\n**原文**（翻刻確認）\n少陰病、二三日、咽痛者、可與甘草湯。不差者、與桔梗湯。\n\n**現代語訳**（訳：社員案）\n少陰病で二、三日たち、咽が痛むものには、甘草湯を与えてよい。治らないものには、桔梗湯を与える。\n\n### 『金匱要略』肺痿肺癰咳嗽上気病脈証并治第七・附方\n\n**書き下し**（読み：社員案）\n『千金』甘草湯。\n\n**原文**（翻刻確認）\n《千金》甘草湯。\n\n**現代語訳**（訳：社員案）\n『千金方』の甘草湯。\n\n### 注記\n- 『傷寒論』の条は、維基文庫の宋本の翻刻で確かめた（翻刻確認。與／与の字体の差のみ）。翻刻の条番号は三一一\n- 『金匱要略』の千金甘草湯は、維基文庫の翻刻では方名の後に主治の文がなく、すぐに構成・服用法が続く（翻刻確認）。主治の文がある本があるかは確かめていない（要原本照合）\n- 『金匱要略』の篇名は、資料では「肺痿肺癰欬嗽上気病脉証治第七」、翻刻では「肺痿肺癰咳嗽上氣病脈證並治第七」と書かれる。本文は翻刻の篇名を新字体にして採った（要原本照合）", "出典": "### 原典の構成\n- 『傷寒論』：甘草2両（炙の指示なし）（翻刻確認）\n- 『金匱要略』（千金甘草湯）：甘草（分量の記載なし）（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』：1味を水3升で煮て1升半を取り、滓を去り、7合を温服する。日に2回服す（翻刻確認）\n- 『金匱要略』（千金甘草湯）：1味を水3升で煮て半分に減らし、3回に分けて温服する（翻刻確認）\n\n### 処方の変遷\n- 甘草1味の方。『傷寒論』の甘草湯方の甘草には「炙」の指示がない（翻刻確認）\n- 『備急千金要方』巻第十七・肺臓・肺痿第六に甘草湯方がある（要原本照合）\n- 『千金翼方』（孫思邈）巻第十五・補益・補五蔵第四では温液湯の名で載り、甘草は3両。『千金方』では2両（要原本照合）\n- 『外台秘要方』第十巻・肺痿方は『千金』を引いて甘草湯方を載せ、甘草は炙と指示される（要原本照合）\n- 『三因極一病証方論』（陳無択）巻之十三・肺痿証治にも温液湯の名で載り、甘草は炙と指示される（要原本照合）\n- 医療用エキス剤は、クラシエ甘草湯エキス細粒（1日量6.0g中、日局カンゾウ8.0g。PMDA 添付文書 2023年10月改訂 第1版で確認）。ツムラの医療用製剤は見当たらない（KEGG MEDICUS、2026-10-22）", "構成": "甘草", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}]}</script>
<script>
var DATA = JSON.parse(document.getElementById("genten-data").textContent);
var $ = function(s){ return document.querySelector(s); };

function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
/* 検索用：カタカナ→ひらがな、全角英数→半角、空白除去 */
function norm(s){
  return String(s||"").toLowerCase()
    .replace(/[ァ-ヶ]/g, function(c){ return String.fromCharCode(c.charCodeAt(0)-0x60); })
    .replace(/[！-～]/g, function(c){ return String.fromCharCode(c.charCodeAt(0)-0xfee0); })
    .replace(/\s+/g, "");
}
DATA.entries.forEach(function(e){
  e._idx = norm([e["名前"], e["読み"], e["ツムラ番号"], e["出典"], e["本文"]["構成"]].join(" "));
});
var TODO = '<span class="todo">要確認</span>';
var LOCAL = DATA.edition === "local";
/* 本文中の「要確認」「要原本照合」を目立たせる（エスケープ後の文字列に使う） */
/* 確認の段階：要確認・要原本照合（未確認・朱）→ 翻刻確認（金茶）→ 院長確認（松葉）。読み：社員案・訳：社員案（藍） */
var FLAG_RE = /（(要確認|要原本照合)）|(要確認|要原本照合)/g;
var MARK_RE = /（(要確認|要原本照合|翻刻確認|院長確認|読み：社員案|訳：社員案)）|(要確認|要原本照合|翻刻確認|院長確認|読み：社員案|訳：社員案)/g;
var MARK_CLASS = {"翻刻確認":" hon", "院長確認":" ok", "読み：社員案":" yomi", "訳：社員案":" yomi"};
function flagify(html){
  return html.replace(MARK_RE, function(_, a, b){ var t = a || b; return '<span class="flag' + (MARK_CLASS[t] || "") + '">' + t + '</span>'; });
}

/* 本文の Markdown を表示用に変換する（### 見出し・**太字**・表・箇条書き・段落のみ） */
function inline(s){ return flagify(esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")); }
function cells(line){ return line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(function(c){ return c.trim(); }); }
var TBL_SEP = /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/;
function md(text){
  var lines = text.split("\n"), out = [], i = 0, m, buf;
  var isBlock = function(l){ return !l.trim() || /^#{3,6}\s/.test(l) || /^\s*\|/.test(l) || /^\s*[-*]\s+/.test(l); };
  while (i < lines.length){
    var l = lines[i];
    if (!l.trim()){ i++; continue; }
    if ((m = l.match(/^#{3,6}\s+(.*)$/))){
      out.push("<h4>" + inline(m[1]) + "</h4>"); i++;
      /* 中身のない小見出し（資料にない項目）には「要確認」を出す */
      var j = i; while (j < lines.length && !lines[j].trim()) j++;
      if (j >= lines.length || /^#{3,6}\s/.test(lines[j])) out.push("<p>" + TODO + "</p>");
      continue;
    }
    if (/^\s*\|/.test(l)){
      buf = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) buf.push(lines[i++]);
      var head = buf.length > 1 && TBL_SEP.test(buf[1]) ? cells(buf[0]) : null;
      var rows = buf.filter(function(r, j){ return !(head && j < 2); });
      out.push('<div class="tbl"><table>' +
        (head ? "<thead><tr>" + head.map(function(c){ return "<th>" + inline(c) + "</th>"; }).join("") + "</tr></thead>" : "") +
        "<tbody>" + rows.map(function(r){ return "<tr>" + cells(r).map(function(c, j){
          /* data-label：カード表示のときに列名を出す。blank：中身が「—」だけの欄はカードでは隠す */
          return "<td" + (head && head[j] ? ' data-label="' + esc(head[j]) + '"' : "") + (/^[—-]?$/.test(c) ? ' class="blank"' : "") + ">" + inline(c) + "</td>";
        }).join("") + "</tr>"; }).join("") +
        "</tbody></table></div>");
      continue;
    }
    if (/^\s*[-*]\s+/.test(l)){
      buf = [];
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) buf.push("<li>" + inline(lines[i++].replace(/^\s*[-*]\s+/, "")) + "</li>");
      out.push("<ul>" + buf.join("") + "</ul>");
      continue;
    }
    buf = [];
    while (i < lines.length && !isBlock(lines[i])) buf.push(inline(lines[i++]));
    out.push("<p>" + buf.join("<br>") + "</p>");
  }
  return out.join("");
}
function countFlags(e){
  return DATA.sections.reduce(function(n, k){ return n + (e["本文"][k].match(FLAG_RE) || []).length; }, 0);
}

function renderList(){
  var q = norm($("#q").value);
  var hits = DATA.entries.filter(function(e){ return !q || e._idx.indexOf(q) !== -1; });
  if (!DATA.entries.length){
    $("#count").textContent = "";
    $("#list").innerHTML = '<div class="listempty"><div class="big">🌼</div>まだ方剤が登録されていません<br>entries/ に方剤を足して build.py を実行してください</div>';
    return;
  }
  $("#count").textContent = q ? "該当 " + hits.length + " 件" : "方剤 " + hits.length + " 件";
  if (!hits.length){
    $("#list").innerHTML = '<div class="listempty"><div class="big">🔍</div>見つかりません</div>';
    return;
  }
  $("#list").innerHTML = hits.map(function(e){
    var sub = [e["読み"], e["出典"]].filter(Boolean).join("　");
    return '<button class="al" data-f="' + esc(e.file) + '">' +
      '<span class="num">' + (e["ツムラ番号"] ? esc(e["ツムラ番号"]) : "—") + '</span>' +
      '<span class="am"><span class="an" style="display:block">' + esc(e["名前"]) + '</span>' +
      '<span class="ax" style="display:block">' + (sub ? esc(sub) : "読み・出典 要確認") + '</span></span></button>';
  }).join("");
}

function renderDetail(e){
  var h = '<button class="back" onclick="history.length>1?history.back():go(\'\')">‹ 一覧へ</button>';
  h += '<div class="dhead"><h2>' + esc(e["名前"]) + '</h2>' +
    '<div class="yomi">' + (e["読み"] ? esc(e["読み"]) : TODO) + '</div>' +
    '<div class="tags"><span class="pill num">ツムラ ' + (e["ツムラ番号"] ? esc(e["ツムラ番号"]) : "要確認") + '</span>' +
    '<span class="pill src">' + (e["出典"] ? esc(e["出典"]) : "出典 要確認") + '</span>' +
    (countFlags(e) ? '<span class="pill flagcount">要確認・要照合 ' + countFlags(e) + '</span>' : '') + '</div></div>';
  DATA.sections.forEach(function(k){
    var v = e["本文"][k], priv = e["非公開"].indexOf(k) !== -1;
    var body = v ? md(v) : (priv ? '<span class="privnote">手元版のみ</span>' : TODO);
    h += '<div class="sec' + (k === "条文" ? " jobun" : "") + (priv && LOCAL ? " priv" : "") + '"><h3>' + esc(k) +
      (priv && LOCAL ? '<span class="privbadge">非公開を含む</span>' : '') + '</h3>' +
      '<div class="body">' + body + '</div></div>';
  });
  $("#v-detail").innerHTML = h;
}

/* 画面の状態は URL ハッシュ（#<方剤ファイル名>）で表す */
function go(f){ location.hash = f ? encodeURIComponent(f) : ""; }
function route(){
  var f = decodeURIComponent(location.hash.slice(1));
  var e = DATA.entries.filter(function(x){ return x.file === f; })[0];
  $("#v-list").classList.toggle("on", !e);
  $("#v-detail").classList.toggle("on", !!e);
  if (e){ renderDetail(e); window.scrollTo(0, 0); }
}
$("#list").addEventListener("click", function(ev){
  var b = ev.target.closest(".al"); if (b) go(b.dataset.f);
});
$("#q").addEventListener("input", function(){ renderList(); if (location.hash) go(""); });
window.addEventListener("hashchange", route);
$("#built").textContent = "データ更新 " + DATA.built + (LOCAL ? "（手元版）" : "");
$("#edition").hidden = !LOCAL;
renderList(); route();
</script>
</body>
</html>

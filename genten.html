は7.5g中、枳実・大黄・当帰 各3.0g、甘草・紅花・厚朴・蘇木・陳皮・木通 各2.0g、無水芒硝1.8g の10味（PMDA 添付文書 2023年12月改訂 第1版で確認）。原典の枳殻が枳実に替わる。資料は、エキス製剤では全て枳実として配合されるとする。添付文書に出典の欄はない", "構成": "枳実・大黄・当帰・甘草・紅花・厚朴・蘇木・陳皮・木通・無水芒硝", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "温経湯", "名前": "温経湯", "読み": "うんけいとう", "ツムラ番号": "106", "出典": "金匱要略（婦人雑病脈証并治第二十二）／備急千金要方（巻第四 婦人方下・赤白帯下崩中漏下）／外台秘要方（巻第三十四 婦人下・崩中去血方・千金の引用）／和剤局方（巻之九・治婦人諸疾）／婦人大全良方（巻之一 調経門・崩中漏下生死脈方論第十七・千金の引用）", "別名": "", "本文": {"条文": "### 『金匱要略』婦人雑病脈証并治第二十二\n\n**書き下し**（読み：社員案）\n婦人年五十所、下利を病みて数十日止まず、暮には即ち発熱し、少腹裏急し、腹満し、手掌煩熱し、唇口乾燥するは、何ぞや。師曰く、此の病は帯下に属す。何を以ての故ぞ。曾て半産を経て、瘀血少腹に在りて去らず。何を以て之を知る。其の証、唇口乾燥す、故に之を知る。当に温経湯を以て之を主るべし。\n\n**原文**（翻刻確認）\n婦人年五十所，病下利數十日不止，暮即發熱，少腹裏急，腹滿，手掌煩熱，唇口乾燥，何也？師曰：此病屬帶下，何以故？曾經半產，瘀血在少腹不去。何以知之？其證唇口乾燥，故知之。當以溫經湯主之。\n\n**現代語訳**（訳：社員案）\n婦人で年が五十ほどの者が、下痢を病んで数十日止まらず、夕暮れになるとすぐに発熱し、下腹部がひきつれ、腹が張り、手のひらがほてって煩わしく、唇と口が乾燥するのは、どういうことか。師が言う。この病は帯下（婦人の病）に属する。なぜか。以前に流産（半産）を経験し、瘀血が下腹部にとどまって去らないからである。どうしてそれがわかるのか。その証として唇と口が乾燥するので、それとわかる。温経湯でこれを主治すべきである。\n\n### 『金匱要略』婦人雑病脈証并治第二十二（温経湯の方後の文）\n\n**書き下し**（読み：社員案）\n亦た婦人の少腹寒え、久しく胎を受けざるを主る。兼ねて崩中去血、或いは月水来ること過多、及び期に至りて来らざるを取る。\n\n**原文**（翻刻確認）\n亦主婦人少腹寒，乆不受胎，兼取崩中去血，或月水来過多，及至期不来。\n\n**現代語訳**（訳：社員案）\nまた、婦人の下腹部が冷えて、長く妊娠しないものを主治する。あわせて、崩中（大量の不正出血）で出血するもの、あるいは月経の量が多すぎるもの、および時期になっても月経が来ないものにも用いる。\n\n### 『備急千金要方』巻第四 婦人方下・赤白帯下崩中漏下（方名なし）\n\n**書き下し**（読み：社員案）\n崩中下血して、出血一斛なるを治す。之を服すれば即ち断つ。或いは月経来ること過多、及び期を過ぎて来らざる者も、之を服して亦た佳き方。\n\n**原文**（翻刻確認）\n治崩中下血出血一斛，服之即斷，或月經來過多，及過期不來者，服之亦佳方。\n\n**現代語訳**（訳：社員案）\n崩中で下血し、出血が一斛にも及ぶものを治す。これを服すればすぐに止まる。あるいは月経の量が多すぎるもの、および時期を過ぎても月経が来ないものも、これを服するとまたよい方。\n\n### 『外台秘要方』巻第三十四 婦人下・崩中去血方（『千金』の引用）\n\n**書き下し**（読み：社員案）\n又た温経湯は、崩中去血一斗なるを療す。之を服すれば即ち断つ。月水期を過ぎて来らざる者も、之を服して亦た佳き方。\n\n**原文**（翻刻確認）\n又温經湯，療崩中去血一斗，服之即斷，月水過期不來者，服之亦佳方。\n\n**現代語訳**（訳：社員案）\nまた、温経湯は、崩中で出血が一斗にも及ぶものを治療する。これを服すればすぐに止まる。月経が時期を過ぎても来ないものも、これを服するとまたよい方。\n\n### 『和剤局方』巻之九・治婦人諸疾\n\n**書き下し**（読み：社員案）\n衝任虚損し、月候調わず、或いは来ること多くして断たず、或いは期を過ぎて来らず、或いは崩中去血過多にして止まざるを治す。又た曾て損娠を経て瘀血停留し、少腹急痛し、発熱下利し、手掌煩熱し、唇乾き口燥くを治す。及び少腹に寒有りて久しく胎を受けざるを治す。\n\n**原文**（翻刻確認）\n温經湯治衝任虚損，月候不調，或來多不斷，或過期不來，或崩中去血過多不止，又治曾經損娠，瘀血停留，少腹急痛，發熱下利，手掌煩熱，唇乾口燥，及治少腹有寒，乆不受胎。\n\n**現代語訳**（訳：社員案）\n衝脈・任脈が虚損して月経が整わず、あるいは量が多くて止まらず、あるいは時期を過ぎても来ず、あるいは崩中で出血が多すぎて止まらないものを治す。また、以前に流産（損娠）を経て瘀血がとどまり、下腹部が急に痛み、発熱と下痢があり、手のひらがほてって煩わしく、唇が乾き口が燥くものを治す。および、下腹部に冷えがあって長く妊娠しないものを治す。\n\n### 『婦人大全良方』巻之一 調経門・崩中漏下生死脈方論第十七（『千金』の引用）\n\n**書き下し**（読み：社員案）\n《千金》温経湯。女人曾て小産を経、或いは帯下三十六病にて、腹脹り、唇口乾き、日暮に発熱し、小腹急痛し、手足煩熱し、大腑調わず、時時泄利し、経脈調わず、久しく懐孕せざるを治す。\n\n**原文**（翻刻確認）\n《千金》溫經湯　治女人曾經小產，或帶下三十六病，腹脹、唇口乾，日暮發熱，小腹急痛，手足煩熱，大腑不調，時時泄利，經脈不調，久不懷孕。\n\n**現代語訳**（訳：社員案）\n『千金』の温経湯。女性で以前に流産（小産）を経験したもの、あるいは帯下の三十六病で、腹が張り、唇と口が乾き、日暮れに発熱し、下腹部が急に痛み、手足がほてって煩わしく、大便が整わず、しばしば下痢し、月経が整わず、長く妊娠しないものを治す。\n\n### 注記\n- 『金匱要略』の条の頭に、四部叢刊本（明嘉靖俞橋刊本の影印）と『金匱要略論註』（四庫全書本）の翻刻、資料の書き下しでは「問曰」（問いて曰く）がある。本文に採った維基文庫の『金匱要略』の翻刻にはない（要原本照合）\n- 四部叢刊本の翻刻は「曽」「半産」「属」「温經湯」と書く。字体だけの違い（要原本照合）\n- 簡体字の『金匱要略方論』の翻刻は「妇人年五十，所病下利数十日不止」と句を切る。句読だけの違いで、字は同じ\n- 方後の文は四部叢刊本の翻刻から取った（維基文庫の『金匱要略』の翻刻には方と方後の文がない）。句読は社員が付けた。「乆」「来」は翻刻の字のまま（要原本照合）\n- 『千金要方』の方は方名がない。資料は「本方が方名なく」載るとし、『外台秘要方』が「又（千金）温経湯」と引くのは『千金方』に温経湯の名で載っているかのような記載だが、『千金方』には方名は載っていないとする（要原本照合）\n- 『千金要方』の篇名は、維基文庫の翻刻では通し番号で「赤白帶下崩中漏下第二十」、資料は「赤白帯下崩中漏下第三」とする（要原本照合）\n- 出血の量は、『千金要方』の翻刻では「一斛」、『外台秘要方』の翻刻では「一斗」（要原本照合）\n- 『外台秘要方』の条は四庫全書本の翻刻から取った。句読は社員が付けた。方後に「並出第四巻中」の小字注がある（翻刻確認）\n- 『和剤局方』の「月候」の「候」は、四庫全書本の翻刻では表示できない外字（SKchar 1974）になっている。資料の書き下しと、別の『和剤局方』の翻刻（維基文庫の全巻ページ）は「月候」で、その字を本文に採った（要原本照合）。句読は社員が付けた\n- 『婦人大全良方』の翻刻は簡体字の本で、原文は繁体字にそろえて書いた（妇→婦、经→經、产→產、带→帶、胀→脹、干→乾、热→熱、烦→煩、时→時、经脉→經脈、怀→懷 など）。字形の判断には使えない（要原本照合）", "出典": "### 原典の構成\n- 『金匱要略』（四部叢刊本の翻刻）：呉茱萸3両、当帰・芎藭・芍薬 各2両、人参・桂枝・阿膠・牡丹皮・生姜・甘草 各2両、半夏半升、麦門冬1升（去心）（翻刻確認）\n- 『備急千金要方』：呉茱萸・当帰 各3両、川芎・人参・芍薬・牡丹・桂心・阿膠・生姜・甘草 各2両、半夏8両、麦門冬1升（翻刻確認）\n- 『外台秘要方』：呉茱萸3両、麦門冬1升（去心）、半夏8両、当帰・芎藭・人参・芍薬・牡丹・桂心・阿膠（炙）・生姜・甘草（炙） 各2両（翻刻確認）\n- 『和剤局方』：阿膠（蛤粉で炒る）・当帰（去蘆）・芎藭・人参・肉桂（去粗皮）・牡丹皮・芍薬・甘草 各2両、半夏3両、麦門冬（去心）5両半、呉茱萸（湯で7回洗い、焙って炒る）3両。生姜は服用法で加える（翻刻確認）\n- 『婦人大全良方』：呉茱萸3両、白芍薬・当帰・芎（次の字は翻刻で欠ける） 各2両、麦門冬（去心）・半夏 各2両半、人参・阿膠（粉炒）・牡丹皮（去心）・甘草・桂心 各1両。生姜は服用法で加える（翻刻確認。芎の字は要原本照合）\n- 『金匱要略』の分量の異同：半夏は、四部叢刊本の翻刻では「半升」、簡体字の『金匱要略方論』の翻刻では「半斤」（『千金要方』『外台秘要方』の8両と同じ量）。簡体字の翻刻は当帰も各2両とし、牡丹皮に「去心」と注する（要原本照合）\n- 『和剤局方』の翻刻では、半夏の小字注が呉茱萸と同じ「湯洗七次焙炒三兩」になっている（要原本照合）\n\n### 原典の服用法\n- 『金匱要略』：12味を水1斗で煮て3升を取り、3回に分けて温服する（翻刻確認）\n- 『備急千金要方』：12味を刻み、水1斗で煮て3升を取り、3回に分けて服す（翻刻確認）\n- 『外台秘要方』：12味を切り、水1斗で煮て3升を取り、分けて服す。忌むことは常法の如し（翻刻確認）\n- 『和剤局方』：粗末とし、1回3銭を水1盞半に生姜5片を入れて8分に煎じ、滓を去って熱服する。空腹時・食前に服す（翻刻確認）\n- 『婦人大全良方』：粗末とし、1回3銭を水1盞に生姜5片を入れて7分に煎じ、滓を去って空腹時・食前に温服する。生冷・羊肉・生葱・海藻・菘菜などを忌む。小字注に「《千金方》同」（翻刻確認）\n\n### 処方の変遷\n- 『備急千金要方』の同じ篇に、帯下で漏血が止まらないものを治す芎藭湯がある。芎藭・乾地黄・黄耆・芍薬・呉茱萸・甘草 各2両、当帰・乾姜 各3両の8味で、資料は温経湯の類方とする（翻刻確認。翻刻の方名は「芎湯」で「藭」の字が欠ける）\n- 資料は、『聖済総録』巻第一百五十三 婦人血気門・婦人瘀血に、婦人の経水が通じたり止んだり、産後に寒が凝って血積・瘀となるものを治す順経散があり、呉茱萸・麦門冬・半夏・当帰・芎藭・人参・芍薬・牡丹皮・桂・阿膠・甘草を粗散とし生姜で煎服させ、温経湯が順経散と名を変えて載っているとする（要原本照合）\n- 資料は、『和剤局方』の条は『金匱要略』の本条と方後の文を、別々の二つのことを述べたものと解釈しているとする（要原本照合）\n- 資料は、吉益東洞『類聚方』、六角重任『古方便覧』（吉益東洞校閲）、『類聚方広義』、湯本求真『皇漢医学』などには温経湯が載らず、吉益南涯『類聚方解』にも載らないが、吉益北洲『金匱要略精義』巻二十・婦人雑病には載るとする（要原本照合）\n- 現行エキス剤（ツムラ106）は7.5g中、麦門冬・半夏 各4.0g、当帰3.0g、甘草・桂皮・芍薬・川芎・人参・牡丹皮・阿膠 各2.0g、呉茱萸・生姜 各1.0g の12味（PMDA 添付文書 2023年12月改訂 第1版で確認）。添付文書に出典の欄はない", "構成": "麦門冬・半夏・当帰・甘草・桂皮・芍薬・川芎・人参・牡丹皮・呉茱萸・生姜・阿膠", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "牛車腎気丸", "名前": "牛車腎気丸", "読み": "ごしゃじんきがん", "ツムラ番号": "107", "出典": "厳氏済生方（水腫論治）", "別名": "", "本文": {"条文": "### 『厳氏済生方』水腫論治（厳用和）\n\n**書き下し**（読み：社員案）\n\n加味腎気丸　腎虚して腰重く脚腫れ、小便利せざるを治す。\n\n右、細末と為し、煉蜜にて丸と為すこと桐子大の如くし、毎服七十丸、空心に米飲にて下す。\n\n**原文**（翻刻確認）\n\n加味腎氣丸　治腎虛腰重脚腫、小便不利。\n\n右為細末、煉蜜為丸如桐子大、每服七十丸、空心米飲下。\n\n**現代語訳**（訳：社員案）\n\n加味腎気丸は、腎が虚して腰が重く、脚がむくみ、小便の出が悪いものを治す。\n\n（服用法）以上を細かい末とし、練った蜂蜜で桐の実ほどの大きさの丸剤とし、1回70丸を空腹時に米の重湯で服す。\n\n### 注記\n- 方名：資料は「加味腎気円」とする。維基文庫の2つの翻刻（四庫全書本と簡体字の本）はどちらも「加味腎気丸」（要原本照合）\n- 「脚腫」：簡体字の本では「脚重」（要原本照合）\n- 「桐子大」：簡体字の本では「梧桐子大」（要原本照合）\n- 『厳氏済生方』の巻：資料は巻之五・水腫論治とする。維基文庫の四庫全書本では卷四・水腫、簡体字の本では水腫門・水腫論治（要原本照合）\n- 原文は四庫全書本の翻刻による。句読点は社員が付けた", "出典": "### 原典の構成\n- 『厳氏済生方』水腫論治：附子（炮）2両、白茯苓・沢瀉・山茱萸（肉を取る）・山薬（炒る）・車前子（酒で蒸す）・牡丹皮（木を去る） 各1両、官桂（火を見ず）・川牛膝（蘆を去り、酒に浸す）・熟地黄 各半両（翻刻確認）\n- 附子の量は簡体字の本の「炮，二两」による。四庫全書本の翻刻では「炮二箇」（要原本照合）\n- 白茯苓の「去皮」の注は簡体字の本にだけあり、四庫全書本にはない（翻刻確認）\n\n### 原典の服用法\n- 『厳氏済生方』：細末とし、煉蜜で桐子大の丸剤とし、1回70丸を空腹時に米飲（重湯）で服す（翻刻確認）\n\n### 処方の変遷\n- 本方は『金匱要略』の腎気丸（八味地黄丸）に牛膝・車前子を加えた方。『金匱要略』では中風歴節病脈証并治第五に崔氏八味丸、血痺虚労病脈証并治第六に八味腎気丸、婦人雑病脈証并治第二十二に腎気丸として載り、いずれも同じ方（翻刻確認）\n- 『金匱要略』の腎気丸は 乾地黄・山薬・山茱萸・沢瀉・牡丹皮・茯苓・桂枝・附子（炮） の8味（翻刻確認）\n- 『厳氏済生方』では「加味腎気丸」の名で、腎虚の腰重・脚腫・小便不利を治す10味の方として載る（翻刻確認）\n- 本方には別名が多く、資料は加味腎気円・加味腎気丸・済生腎気丸・加減済生腎気丸・加味八味丸・金匱腎気丸・加減金匱腎気丸などを挙げる。「牛車腎気丸」の名がどの書に始まるかは資料に記載がない（要確認）\n- 明代の『薛氏医案』（薛己）では加減済生腎気丸・加減金匱腎気丸の名で載り、主治に脾腎の虚、肚腹の腫脹、四肢の浮腫、喘急・痰盛、水症・蠱症が加わるとされる（要原本照合）。『万病回春』巻之四・補益の加減金匱腎気丸も同じ系統とされる（要原本照合）\n- 資料は、『厳氏済生方』の方と『薛氏医案』の方とでは、概ね前者は附子が多く後者は熟地黄・白茯苓が多く、エキス製剤は後者に近いとする（要原本照合）\n- 現行エキス剤（ツムラ107）は 地黄・牛膝・山茱萸・山薬・車前子・沢瀉・茯苓・牡丹皮・桂皮・附子（ブシ末） の10味（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "地黄・牛膝・山茱萸・山薬・車前子・沢瀉・茯苓・牡丹皮・桂皮・附子（ブシ末）", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "人参養栄湯", "名前": "人参養栄湯", "読み": "にんじんようえいとう", "ツムラ番号": "108", "出典": "太平恵民和剤局方（巻之五・治痼冷 附 消渇）", "別名": "", "本文": {"条文": "### 『太平恵民和剤局方』巻之五・治痼冷 附 消渇（淳祐新添方）\n\n**書き下し**（読み：社員案）\n\n積労虚損、四肢骨肉酸疼し、吸吸として少気し、行動すれば喘啜し、小腹拘急し、腰背強痛し、心虚して驚悸し、咽乾き唇燥き、飲食味無く、陰陽衰弱し、悲憂惨戚し、多く臥して少しく起き、久しき者は積年、急なる者は百日にして、漸く瘦消に至り、五蔵の気竭きて振復すべきこと難きを治す。又、肺と大腸と倶に虚し、咳嗽下利し、喘乏少気し、嘔吐痰涎するを治す。\n\n**原文**（翻刻確認）\n\n治積労虚損、四肢骨肉酸疼、吸吸少気、行動喘啜、小腹拘急、腰背強痛、心虚驚悸、咽乾唇燥、飲食無味、陰陽衰弱、悲憂惨戚、多臥少起、久者積年、急者百日、漸至瘦消、五蔵気竭、難可振復。又治肺与大腸倶虚、咳嗽下利、喘乏少気、嘔吐痰涎。\n\n**現代語訳**（訳：社員案）\n\n疲労が積み重なって虚損し、手足の骨や肉がだるく痛み、呼吸が浅く弱くて気が少なく、動くと喘ぎ、下腹がひきつれ、腰や背中がこわばって痛み、心が虚して驚きやすく動悸がし、喉が乾き唇が乾燥し、飲食に味がなく、陰陽ともに衰え弱り、悲しみ憂えて心をいため、横になっていることが多く起きていることが少なく、長いものは何年にもわたり、急なものは百日ほどで、しだいに痩せ衰え、五臓の気が尽きて回復させがたいものを治す。また、肺と大腸がともに虚して、咳き込んで下痢し、喘いで息が切れ気が少なく、嘔吐して痰やよだれを出すものを治す。\n\n### 注記\n- 本文は四庫全書本の翻刻に従い、新字体にした（虗・乆・隂・卧・强・與 など）。局方の方名は四庫全書本の翻刻では「人参飬榮湯」\n- 局方の条で、四庫全書本の翻刻は「四肢骨肉酸疼」。別の翻刻本と資料の書き下しは「四肢沈滞、骨肉酸疼」と「沈滞」の句がある（要原本照合）\n- 局方の条の「咳嗽」の「嗽」は、四庫全書本の翻刻では外字。別の翻刻本の字（「咳嗽下痢」）を置いた（要原本照合）。別の翻刻本は「下痢」、四庫全書本と資料は「下利」\n- 局方の条の「漸至瘦消」は四庫全書本の翻刻の字。別の翻刻本は「瘦削」、資料の書き下しは「痩削」（要原本照合）\n- 局方の条の「陰陽衰弱」は2つの翻刻本とも「陰陽」。資料の書き下しは「陽陰衰弱」と書き、三因方で「陽陰」が「陰陽」になったとする（要原本照合）\n- 局方の方の前の印：別の翻刻本では「〔淳新添方〕」（「祐」の字がない）。資料は「淳祐新添方」。四庫全書本には印がない", "出典": "### 原典の構成\n- 『和剤局方』：白芍薬3両、当帰・陳皮・黄耆・桂心（粗皮を去る）・人参・白朮（煨す）・甘草（炙る）各1両、熟地黄（製す）・五味子・茯苓 各7銭半、遠志（炒って心を去る）半両（翻刻確認）\n\n### 原典の服用法\n- 『和剤局方』：剉散とし、1回4銭を、水1盞半に生姜1片・棗子2個を入れて7分まで煎じ、滓を去って温服する。便精遺泄には竜骨1両を加え、咳嗽には阿膠を加えると甚だ妙（翻刻確認）。別の翻刻本は「生薑三片，枣子二枚」（要原本照合）\n\n### 処方の変遷\n- 資料の出典欄は「『金匱要略』、『備急千金要方』、『聖済総録』、『三因極一病証方論』」。資料は、本方の出典は一般には『和剤局方』巻之五・治痼冷 附 消渇とされ、局方での収載は淳祐新添方に属するとする（局方の巻・門は翻刻確認）\n- 資料は、淳祐年間は1241〜52年で局方の原書五巻本には含まれておらず、歴史的には『三因方』の方が約70年早いとする（要確認）\n- 前身の方：『三因極一病証方論』巻之十三・虚損証治の方。資料は方名を「養栄湯」とし、局方とほぼ同じ条文（違いは「小腹→小便」「陽陰→陰陽」）で、黄耆を含む12味を姜棗で煎服し、方後も同じとする（要原本照合）。四庫全書本の翻刻では方名は「人参養榮湯」、条文は局方と「積癆」「四肢沈滞」「喘咳」「小便拘急」「痩削」「喘促乏気」の字・句が違い、構成は人参・当帰・桂心・甘草・陳皮・白朮 各1両、白芍・熟地・五味・茯苓 各3分、遠志5銭で黄耆がない。㕮咀し、1回4銭に薑・［外字］を加えて7分まで煎じて服し、遺精には竜骨1両、咳［外字］には阿膠1両を加える（翻刻確認）\n- 資料によれば、『三因方』巻之十三・虚損証治の19方のうち11方が局方巻之五と共通で、『三因方』が局方から採ったのは2方（菟絲子円・大山蕷円）だけ、ほかの9方（養栄湯を含む）は局方が『三因方』から採った。資料は、元々の養栄湯を人参養栄湯と改名し、治痼冷 附 消渇に収めて方意を変えたのは局方の編撰者とする（要確認）\n- 資料によれば、『備急千金要方』巻第三 婦人方中・虚損第一の内補黄耆湯（黄耆・当帰・芍薬・乾地黄・半夏・茯苓・人参・桂心・遠志・麦門冬・甘草・五味子・白朮・沢瀉・乾姜・大棗を㕮咀して煎服）は、方後の調理を含めると養栄湯去陳皮・生姜加半夏・麦門冬・沢瀉・乾姜にあたり、12味が共通する（要原本照合）\n- 資料によれば、『聖済総録』巻第九十二・虚労門・虚労小便余瀝の平補湯（黄耆・芍薬・甘草・人参・桂・当帰を姜棗で煎服）は、人参養栄湯にも十全大補湯にも展開しうる祖剤的な処方（要原本照合）\n- 資料によれば、同書巻第九十三・骨蒸伝尸門・伝尸骨蒸の補五蔵茯神湯（茯神・人参・遠志・甘草・当帰・陳橘皮・竜歯・熟乾地黄・五味子・麦門冬・桂・黄耆を姜棗で煎服）は、茯苓と茯神を同じとみれば養栄湯去白朮・芍薬加竜歯・麦門冬にあたる類方。資料は、これが肺結核を適応とすることから、養栄湯も元々は肺結核の治療薬だったとする（要原本照合）\n- 黄耆建中湯の出典は『金匱要略』血痺虚労病脈証并治第六（要原本照合）。資料は、黄耆建中湯が『千金方』で多面的な虚損の適応となり、『聖済総録』で伝尸骨蒸にも適応を広げ、『三因方』で養栄湯として呼吸器疾患を主とした多彩な虚損に用いられるようになったとする（要確認）\n- 資料によれば、『易簡方』増損飲子治法三十首・逍遙散の項では、下血過多で寒熱を発するものに当帰・地黄の類を用いる処方の一つとして養栄湯が載るだけ（要原本照合）\n- 資料は、本方は十全大補湯去川芎加陳皮・五味子・遠志にあたるが、歴史的には十全大補湯とは無関係に成立したとする（要確認）\n- 現行エキス剤（ツムラ108）は9.0g中、地黄・当帰・白朮・茯苓 各4.0g、人参3.0g、桂皮2.5g、遠志・芍薬・陳皮 各2.0g、黄耆1.5g、甘草・五味子 各1.0g の12味（PMDA 添付文書 2023年12月改訂 第1版で確認）。『和剤局方』の12味と同じ生薬で、原典で煎じるときに加える生姜・大棗は入っていない。添付文書に出典の欄はない", "構成": "地黄・当帰・白朮・茯苓・人参・桂皮・遠志・芍薬・陳皮・黄耆・甘草・五味子", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "小柴胡湯加桔梗石膏", "名前": "小柴胡湯加桔梗石膏", "読み": "しょうさいことうかききょうせっこう", "ツムラ番号": "109", "出典": "華岡青洲経験方", "別名": "", "本文": {"条文": "", "出典": "### 原典の構成\n\n### 原典の服用法\n\n### 処方の変遷\n- 小柴胡湯に桔梗石膏（桔梗・石膏）を加えた加味方。資料の出典欄は『傷寒論』『金匱要略』『一本堂医事説約』・華岡青洲経験方を挙げる\n- もとの小柴胡湯の出典は『傷寒論』『金匱要略』（条文は小柴胡湯の項を参照）。桔梗石膏の出典は『一本堂医事説約』（桔梗石膏の項を参照）\n- 小柴胡湯に桔梗や石膏を加える加減は、『衆方規矩』巻之上・傷寒門・小柴胡湯（心中が満つるものに枳殻・桔梗を加える）、『重訂古今方彙』傷寒・小柴胡湯（心中飽満に桔梗・枳殻、渇に知母・石膏を加える）、『古方節義』巻之中・小柴胡湯（熱が退かず咽渇・口燥するものに石膏を加える）に見られるとされる（要原本照合）\n- 浅田宗伯『先哲医話』巻上・和田東郭の条に、拙軒の言として小柴胡加桔梗石膏もよく効き、青洲翁がかつてこれを用いたとあるとされる（要原本照合）\n- 『瘍科方筌』には小柴胡湯加石膏・葛根湯加桔梗石膏が載るとされる（要原本照合）\n- 『方彙続貂』感冒に、小柴胡加桔石湯（春林軒）として、時毒頭風を治し小柴胡湯に桔梗・石膏を加えるとあるとされる（要原本照合）\n- 『皇漢医学』第弐巻に、小柴胡加桔梗石膏湯方として、小柴胡加石膏湯と小柴胡加桔梗湯を合方し、煎法・用法は前に同じとあるとされる（要原本照合）\n- 現行エキス剤（ツムラ109）は 石膏・柴胡・半夏・黄芩・桔梗・大棗・人参・甘草・生姜 の9味（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "石膏・柴胡・半夏・黄芩・桔梗・大棗・人参・甘草・生姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["出典", "構成", "方意", "諸家の論"]}, {"file": "立効散", "名前": "立効散", "読み": "りっこうさん", "ツムラ番号": "110", "出典": "蘭室秘蔵（口歯咽喉門）", "別名": "", "本文": {"条文": "### 『蘭室秘蔵』口歯咽喉門\n\n**書き下し**（読み：社員案）\n牙歯痛みて忍ぶべからず、頭脳・項背に及び、微かに寒飲を悪み、大いに熱飲を悪むを治す。其の脈、上中下の三部、陽虚し陰盛んなり。是れ五臓内に盛んにして、六腑陽道の脈微小、小便滑数なり。\n\n**原文**（翻刻確認）\n治牙齒痛不可忍及頭腦項背微惡寒飲大惡熱飲其脈上中下三部陽虚陰盛是五臟内盛六腑陽道脈微小小便滑數\n\n**現代語訳**（訳：社員案）\n歯が痛んで我慢できず、それが頭やうなじ・背中にも及び、冷たい飲み物を少し嫌い、熱い飲み物をひどく嫌うものを治す。その脈は上・中・下の三部とも、陽が虚して陰が盛んである。これは五臓が内に盛んで、六腑の陽の道の脈が微小であり、小便が滑らかで回数が多いものである。\n\n### 注記\n- 本文は四庫全書本（卷中・口齒咽喉門）の翻刻の字による。四庫全書本は上・中・下の3巻で、資料は「巻之三・口歯咽喉門」とする（巻の分け方の違い。要原本照合）\n- 維基文庫の別の翻刻（「蘭室秘藏」の1ページ本。簡体字が混じる）では、方名がなく、「頭脑项背痛微惡寒飲」と「痛」の字があり、「六腑陽道微脈微小」と「微」の字が多い（要原本照合）\n- 四庫全書本の翻刻の「隂」は字体だけの違いとして「陰」にそろえた", "出典": "### 原典の構成\n- 『蘭室秘蔵』口歯咽喉門：細辛2分、炙甘草3分、升麻10分、防風1銭、草竜胆（酒洗）4銭（翻刻確認。升麻・草竜胆の分量は異同あり。下の処方の変遷を参照）\n\n### 原典の服用法\n- 『蘭室秘蔵』口歯咽喉門：㕮咀してすべて1服とし、水1盞で7分まで煎じ、滓を去り、匙ですくって口の内に入れ、痛む所を煠し（原文「以匙抄在口内煠痛處」）、しばらく待てば止む（翻刻確認）\n- 加減：熱飲を悪むことが多ければ、さらに草竜胆1銭を加える。この法は定まったものではなく、寒熱の多少に随って、その時に臨んで加減する。さらに悪風して痛むときは草豆蔲・黄連 各5分を加え、草竜胆は加えない（翻刻確認）\n\n### 処方の変遷\n- 原典の分量の異同：四庫全書本の翻刻は升麻「十分」・草竜胆「酒洗四錢」、維基文庫の別の翻刻は升麻「七分」・草竜胆「酒洗四錢」、資料の書き下しは升麻「七分」・草竜胆「四分」とする（要原本照合）\n- 資料は、同じ条文・同じ5味が『東垣試効方』巻第六・牙歯門、『仁斎直指附遺方論』巻二十一・歯病証治・附諸方、『医学正伝』巻之五・歯病、『扶寿精方』牙歯門、『衆方規矩』巻之下・牙歯門にも載るとする（要確認）\n- 資料は、『蘭室秘蔵』の羅天益の序は至元十三年（1276）とする（要確認）。四庫全書本の提要は、羅天益の序は李杲の没後25年とする（翻刻確認）\n- 同じ『蘭室秘蔵』の婦人門に、血崩を治す同名異方の立効散（当帰・蓮花心・白綿子・紅花・茅花を焼いて灰にする）がある（翻刻確認）\n- 現行エキス剤（ツムラ110）は 細辛・升麻・防風・甘草・竜胆 の5味で、7.5g中 細辛・升麻・防風 各2.0g、甘草1.5g、竜胆1.0g（PMDA 添付文書 2023年12月改訂 第1版で確認）。原典の炙甘草は甘草、草竜胆は竜胆と書かれる", "構成": "細辛・升麻・防風・甘草・竜胆", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "清心蓮子飲", "名前": "清心蓮子飲", "読み": "せいしんれんしいん", "ツムラ番号": "111", "出典": "太平恵民和剤局方（巻之五・治痼冷 附 消渇）", "別名": "", "本文": {"条文": "### 『太平恵民和剤局方』巻之五・治痼冷 附 消渇（宝慶新増方）\n\n**書き下し**（読み：社員案）\n\n心中蓄積し、時常に煩躁し、因りて思慮労力し、憂愁抑鬱して、是れ小便白濁を致し、或いは沙膜有り、夜夢に走泄し、遺瀝渋痛し、便赤くして血の如く、或いは酒色過度に因りて、上盛んに下虚し、心火炎上して、肺金剋を受け、口舌乾燥し、漸く消渇を成し、睡臥安からず、四肢倦怠し、男子の五淋、婦人の帯下赤白、及び病後に気収斂せず、陽外に浮き、五心煩熱するを治す。薬性温平にして、冷ならず熱ならず、常に服すれば心を清くし神を養い、精を秘し虚を補い、腸胃を滋潤し、血気を調順す。\n\n**原文**（翻刻確認）\n\n治心中蓄積、時常煩躁、因而思慮労力、憂愁抑鬱、是致小便白濁、或有沙膜、夜夢走泄、遺瀝渋痛、便赤如血、或因酒色過度、上盛下虚、心火炎上、肺金受剋、口舌乾燥、漸成消渇、睡臥不安、四肢倦怠、男子五淋、婦人帯下赤白、及病後気不収斂、陽浮於外、五心煩熱。薬性温平、不冷不熱、常服清心養神、秘精補虚、滋潤腸胃、調順血気。\n\n**現代語訳**（訳：社員案）\n\n胸の内に積もるものがあって、いつも煩わしくいらだち、そのために思い悩み心身を労し、憂い悲しんで気がふさぎ、その結果、小便が白く濁り、あるいは沙膜があり、夜に夢を見て精をもらし、小便がしたたり残って渋り痛み、便が赤く血のようであるもの、あるいは酒と色欲の度を過ごしたために、上が盛んで下が虚し、心火が燃え上がって肺金が損なわれ、口や舌が乾き、しだいに消渇となり、眠っても安らかでなく、手足がだるいもの、男子の五淋、婦人の赤白の帯下、および病後に気が収まらず、陽が外に浮いて、五心がほてって煩わしいものを治す。薬性は温平で、冷でも熱でもなく、常に服すれば心を清め神を養い、精をもらさず保って虚を補い、腸胃を潤し、血気を整え順わせる。\n\n### 関連条文（巻之八・治雑病）\n\n同じ『和剤局方』の巻之八・治雑病にも清心蓮子飲の名があり、主治と方は巻之五に譲っている。\n\n**書き下し**（読み：社員案）\n\n清心蓮子飲、治証并びに方は痼冷類に見ゆ。\n\n**原文**（翻刻確認）\n\n清心蓮子飲治証并方見痼冷類。\n\n**現代語訳**（訳：社員案）\n\n清心蓮子飲。主治と処方は痼冷の類（巻之五・治痼冷）に見える。\n\n### 注記\n- 四庫全書本の翻刻は旧字体・異体字（虗・飬・卧・澁・茋 など）。本文は新字体にした\n- 「酒色過度」の「過」は、四庫全書本の翻刻では外字（表示できない字）になっている。別の翻刻本（「酒色過度」）と資料の書き下しの字を置いた（要原本照合）\n- 「肺金受剋」の「剋」は、別の翻刻本では「克」と書かれる（要原本照合）\n- 別の翻刻本は行の途中の欠けが多い（「或有」の次が「泄」、「受克」の次が「成消渇」、「病后氣不收敛」の次が「心煩熱」など）。本文は四庫全書本に従った\n- 結びの「調順血気」は翻刻の字順。資料の書き下しは「気血を調順す」と書く（要原本照合）\n- 方の前の印：別の翻刻本では巻之五の清心蓮子飲の前に「〔寶庆新增方〕」、巻之八の清心蓮子飲の前に「〔绍興續添方〕」がある（翻刻確認）。四庫全書本には印がない", "出典": "### 原典の構成\n- 『和剤局方』：黄芩・麦門冬（心を去る）・地骨皮・車前子・甘草（炙る）各半両、石蓮肉（心を去る）・白茯苓・黄耆（蜜炙）・人参 各7銭半 の9味（翻刻確認）。別の翻刻本は白茯苓までで行が切れている\n\n### 原典の服用法\n- 『和剤局方』：剉散とし、1回3銭に麦門冬10粒を加え、水1盞半で8分に煎じ取り、滓を去って水中に沈めて冷やし、空腹時・食前に服す。発熱するときは柴胡・薄荷を加えて煎じる（翻刻確認）\n\n### 処方の変遷\n- 本方は『和剤局方』巻之五・治痼冷 附 消渇に収載され、別の翻刻本では宝慶新増方の印の下にある（翻刻確認）。資料は宝慶新増方を1225〜27年とする（要確認）\n- 同じ『和剤局方』の巻之八・治雑病にも清心蓮子飲の名があり、治証と方は痼冷類に見えるとだけ記す（翻刻確認）。別の翻刻本では紹興続添方の印の下にある（翻刻確認）。資料は紹興続添方を1131〜62年とし、巻之八の収載の方が早いとする（要確認）\n- 資料によれば、方後の「発熱には柴胡・薄荷を加える」に由来する清心蓮子飲加柴胡が、『丹渓心法』巻三・消渇四十六、『玉機微義』巻之九・熱門、『医方集解』瀉火之剤（蓮子清心飲の名）に載る（要原本照合）\n- 資料によれば、『仁斎直指附遺方論』巻十・漏濁、『明医雑著』巻之六・附方（薛注本）、『医便』巻三、『外科正宗』巻之三・下疳論には、清心蓮子飲の名で構成の違う方（同名異方・類方）が載る（要原本照合）\n- 現行エキス剤（ツムラ111）は7.5g中、麦門冬・茯苓・蓮肉 各4.0g、黄芩・車前子・人参 各3.0g、黄耆・地骨皮 各2.0g、甘草1.5g の9味（PMDA 添付文書 2023年12月改訂 第1版で確認）。原典の石蓮肉・白茯苓は蓮肉・茯苓として入る。添付文書に出典の欄はない", "構成": "麦門冬・茯苓・蓮肉・黄芩・車前子・人参・黄耆・地骨皮・甘草", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "猪苓湯合四物湯", "名前": "猪苓湯合四物湯", "読み": "ちょれいとうごうしもつとう", "ツムラ番号": "112", "出典": "内科秘録（巻之十・白濁、尿血）", "別名": "猪苓四物合方", "本文": {"条文": "### 『内科秘録』巻之十・白濁\n\n**書き下し**（要原本照合）\n\n**原文**（要原本照合）\n\n**現代語訳**\n\n### 『内科秘録』巻之十・尿血\n\n**書き下し**（要原本照合）\n\n**原文**（要原本照合）\n\n**現代語訳**\n\n### 注記\n- 『内科秘録』巻之十・白濁（資料は副題に漩濁・漏濁・便濁を添える）では、白濁の治法の中で、しばしば血を交えて下すものには猪苓四物合方を与えるとする（要原本照合。資料の引用による）\n- 同巻・尿血（資料は副題に溲尿・漩尿を添える）では、尿血は猪苓四物の合方でいったんは治るが全治するものは少ないとし、鮮血が多く出て止まらないときは芎帰膠艾湯、凝血がしばしば出るものは犀角地黄湯がよいとする（要原本照合。資料の引用による）\n- 『内科秘録』の原文の翻刻は維基文庫に見当たらない（2026-10-23 検索。要原本照合）", "出典": "### 原典の構成\n- 『内科秘録』：「猪苓四物合方」「猪苓四物の合方」とあるのみで、資料の引用には生薬・分量の記載がない（要原本照合）\n\n### 原典の服用法\n\n### 処方の変遷\n- 猪苓湯と四物湯の合方。資料の出典欄は『傷寒論』『金匱要略』『理傷続断方』『内科秘録』\n- 猪苓湯の出典は『傷寒論』弁陽明病脈証并治第八・弁少陰病脈証并治第十一、『金匱要略』消渇小便不利淋病脈証并治第十三（翻刻確認）。四物湯の出典は、資料の出典欄では『理傷続断方』\n- 『太平恵民和剤局方指南総論』巻下・論婦人諸疾に、産後に煩渇して冷たいものを飲みたがるものに四物湯に烏梅を加えて煎じ、渇が止まなければ五苓散を与えるとあるとされる（要原本照合）\n- 『金匱鉤玄』巻第二・小便不禁に、熱には五苓散加解毒散、虚には五苓散加四物湯とあるとされる（要原本照合）\n- 『丹渓心法』巻二・溺血二十三に、溺血にはまず生料五苓散加四物湯を与え、効かず虚に属するものは五苓散和膠艾湯がよいとあるとされる（要原本照合）\n- 『証治要訣』巻四・小便血に、尿血にはまず生料五苓散を四物湯に和し、効かず虚証に属するものは五苓散に膠艾湯を和して鹿茸円を呑むとあるとされる。同書巻十二・婦人門・赤白帯には、四物湯・五苓飲を各半貼で和して煎じるとあるとされる（要原本照合）\n- 武之望撰・汪淇箋釈『済陰綱目』巻之一・調経門・調経通用諸方の四物湯の加減法に、妊娠中の傷寒で小便が出ず太陽の本病には茯苓六合（四物湯4両・茯苓・沢瀉各半両）がよいとあり、頭注に「合四苓」とあるとされる（要原本照合）\n- 『衆方規矩』巻之下・補益通用・四物湯の方後の加減法に、溺血には五苓散を合すとあるとされる（要原本照合）\n- 『観聚方要補』巻五・吐衄二便血に、『証治準縄』を出処として五苓散合四物湯が溲血を治すとあり、さらに膠・艾を加えるとあるとされる（要原本照合）\n- 『内科秘録』巻之十の白濁・尿血に「猪苓四物合方」が出る（要原本照合）。資料はこの書を出典の一つに挙げる\n- 現行エキス剤（ツムラ112）は7.5g中、滑石・地黄・芍薬・川芎・沢瀉・猪苓・当帰・茯苓・阿膠 各3.0g の9味（PMDA 添付文書 2023年12月改訂 第1版で確認）。添付文書に出典の欄はない", "構成": "滑石・地黄・芍薬・川芎・沢瀉・猪苓・当帰・茯苓・阿膠", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "三黄瀉心湯", "名前": "三黄瀉心湯", "読み": "さんおうしゃしんとう", "ツムラ番号": "113", "出典": "金匱要略（驚悸吐衄下血胸満瘀血病脈証并治第十六・婦人雑病脈証并治第二十二）", "別名": "", "本文": {"条文": "### 『金匱要略』驚悸吐衄下血胸満瘀血病脈証并治第十六\n\n**書き下し**（読み：社員案）\n心気不足し、吐血・衄血するは、瀉心湯之を主る。\n\n**原文**（翻刻確認）\n心氣不足、吐血、衄血、瀉心湯主之。\n\n**現代語訳**（訳：社員案）\n心気が不足して、吐血や鼻出血をする者は、瀉心湯がこれを主治する。\n\n### 『金匱要略』婦人雑病脈証并治第二十二\n\n**書き下し**（読み：社員案）\n婦人、涎沫を吐す。医反って之を下し、心下即ち痞す。当に先ず其の涎沫を吐するを治すべし。小青竜湯之を主る。涎沫止みて、乃ち痞を治す。瀉心湯之を主る。\n\n**原文**（翻刻確認）\n婦人吐涎沫、醫反下之、心下即痞、當先治其吐涎沫、小青龍湯主之。涎沫止、乃治痞、瀉心湯主之。\n\n**現代語訳**（訳：社員案）\n婦人がよだれや泡状のつばを吐いているのに、医者がかえってこれを下したため、すぐにみぞおちがつかえた。まずその涎沫を吐くのを治すべきで、小青竜湯がこれを主治する。涎沫が止んでから、つかえを治す。瀉心湯がこれを主治する。\n\n### 注記\n- 原典の方名は瀉心湯（翻刻確認）。三黄瀉心湯は後の呼び名\n- 第十六篇の条について、資料は方の後に小字双行で「亦霍乱を治す」とあるとする。維基文庫の『金匱要略』の翻刻にはこの注がない（要原本照合）\n- 第十六篇の「心気不足」は、『備急千金要方』巻第十三の瀉心湯では「心気不定」と書かれるとされる（要原本照合）", "出典": "### 原典の構成\n- 『金匱要略』：大黄2両、黄連1両、黄芩1両（翻刻確認）\n\n### 原典の服用法\n- 『金匱要略』：3味を水3升で煮て1升を取り、頓服する（翻刻確認）\n\n### 処方の変遷\n- 資料の出典欄は「伊尹湯液論、『金匱要略』」。資料は、仲景の方は伊尹の湯液に基づくとする諸書の説を引く（要確認）\n- 『傷寒論』弁太陽病脈証并治下第七の大黄黄連瀉心湯は、大黄2両・黄連1両の2味で、麻沸湯2升に漬けて須臾にして絞り、滓を去って分けて温めて2回に服す（翻刻確認）。資料は、宋本ではこの方の後に林億等の注があり、諸本はみな2味だが、次の附子瀉心湯が大黄・黄連・黄芩・附子を用いるので前の方にも黄芩があったのだろうとする、と引く。維基文庫の宋本の翻刻にはこの注がない（要原本照合）。附子瀉心湯の構成に黄芩1両があることは翻刻で確かめた（翻刻確認）\n- 『備急千金要方』巻第十三・心虚実第二の瀉心湯は、心気不定で吐血・衄血するものを治すとされる。同書巻第十・傷寒発黄第五の三黄散は、黄疸で身体と顔が黄色いものに3味を散または丸として用いるとされる（要原本照合）\n- 『肘後百一方』巻之五・治腸癰肺癰方第三十七では、30年治らない悪瘡に大黄・黄芩・黄連各1両を散とし、瘡を洗って振りかける外用の方が載り、黄柏を等分加えてもよいとされる（要原本照合）\n- 『千金方』巻第二十一・消渇第一の三黄丸は、男子の五労七傷・消渇、婦人の帯下などに用い、季節で分量を変えるとされる。春は黄芩4両・大黄3両・黄連4両、夏は黄芩6両・大黄1両・黄連7両、秋は黄芩6両・大黄2両・黄連3両、冬は黄芩3両・大黄5両・黄連2両（要原本照合）\n- 『傷寒総病論』巻第三・心下痞証、『傷寒活人書』巻第十・巻第十四では、大黄黄連瀉心湯（大黄黄連黄芩瀉心湯）として大黄・黄連・黄芩の3味が示されるとされる（要原本照合）\n- 『太平恵民和剤局方』巻之六・積熱の三黄円は、三焦の積熱（上焦は目の赤い腫れ・口舌の瘡、中焦は胸のもだえ・食欲不振、下焦は尿の赤渋・便秘）や痔疾・鮮血の下血を治すとされる（要原本照合）\n- 『御薬院方』巻之七・治積熱門の三黄丸は、吐血・黄疸・熱病を治すとされる。同書巻之十・治眼目門の消毒散は黄芩・黄柏・大黄で、別の構成（要原本照合）\n- 『医塁元戎』巻三・陽明証では、大黄2両・黄連1両に黄芩を加えて伊尹三黄湯とするとされる（要原本照合）\n- 『衛生宝鑑』巻十三・心下痞では大黄黄連瀉心湯として3味を示し、伊尹湯液論の大黄黄連黄芩湯は3味で、監本に黄芩がないのは脱落とする注があるとされる。同書巻十四・黄疸論の黄連散は大黄・黄連・甘草・黄芩で、本方に甘草を加えた構成（要原本照合）\n- 『張氏医通』巻十六・祖方の伊尹三黄湯は、倉公は火斉湯、『金匱要略』は瀉心湯と名づけるとし、三焦の実熱で煩躁・便秘するものを治すとされる（要原本照合）\n- 賀川玄迪『産論翼』では第二和剤湯と名づけられ、辰砂を加えて用いるとされる（要原本照合）\n- 片倉鶴陵『産科発蒙』巻二・子癇第二の鉄砂三黄湯は、本方に鉄砂を加えた方とされる（要原本照合）\n- 現行エキス剤（ツムラ113）は 黄芩・黄連・大黄 各3.0g の3味で、原典と同じ3味。原典は大黄が黄連・黄芩の倍量で、エキス剤は等量（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "黄芩・黄連・大黄", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "柴苓湯", "名前": "柴苓湯", "読み": "さいれいとう", "ツムラ番号": "114", "出典": "世医得効方（巻二・痎瘧）／太平恵民和剤局方指南総論（巻中・論傷寒証候）", "別名": "", "本文": {"条文": "### 『世医得効方』巻二・痎瘧\n\n**書き下し**（読み：社員案）\n小柴胡湯と五苓散とを合和し、柴苓湯と名づく。傷風・傷暑、瘧を治して大いに効あり。毎服、薑三片、麦門冬二十粒（心を去る）、地骨皮少許にて煎じ、温服す。（方は傷寒熱証類に見ゆ。五苓散の方は傷暑類。）\n\n**原文**（翻刻確認）\n小柴胡湯與五苓散合和、名柴苓湯。治傷風傷暑瘧大效。毎服薑三片、麥門冬二十粒（去心）、地骨皮少許、煎温服。（方見傷寒熱證類、五苓散方傷暑類）\n\n**現代語訳**（訳：社員案）\n小柴胡湯と五苓散を合わせたものを柴苓湯という。傷風・傷暑や瘧を治すのに大いに効がある。1回分ごとに生姜3片、麦門冬20粒（芯を除く）、地骨皮少量を加えて煎じ、温かくして服す。（小柴胡湯の方は傷寒熱証類に、五苓散の方は傷暑類に載る。）\n\n### 『太平恵民和剤局方』指南総論巻中・論傷寒証候\n\n**書き下し**（読み：社員案）\n和解の証候を論ず。傷寒・傷風、往来寒熱し、胸脇の間痛み、乾嘔し及び大便秘する者は、小柴胡湯一貼を用うべし。病重き者は并せて半貼を服して方に効あり。或いは渇を言う者、或いは小便渋るは、兼ねて五苓散を服す。\n\n**原文**（翻刻確認）\n論和解證候。傷寒傷風、往來寒熱、胸脇間痛、乾嘔及大便秘者、可用小柴胡湯一貼。病重者并服半貼方效。或言渇者、或小便澀、兼服五苓散。\n\n**現代語訳**（訳：社員案）\n和解の証候について論じる。傷寒・傷風で、寒熱が往来し、胸脇のあたりが痛み、からえずきがあり、また大便が秘結するものには、小柴胡湯1貼を用いるとよい。病が重いものは、さらに半貼をあわせて服すと効く。あるいは口の渇きを訴えるもの、あるいは尿の出が渋るものは、あわせて五苓散を服す。\n\n### 注記\n- 『世医得効方』の条は、同じ段の藿香正気散の加減の後に続けて書かれる。小柴胡湯・五苓散の分量は書かれず、それぞれ傷寒熱証類・傷暑類の方を見るよう注がある（翻刻確認）。翻刻では小柴胡湯は巻一の傷寒・陽証、五苓散は巻二の傷暑にある\n- 『世医得効方』の門：資料は巻第二・痎瘧・久瘧とする。翻刻では痎瘧の見出しの下で、久瘧の方（丁香煑散など）の後に「通治瘧疾…」の句があり、その後に柴苓湯の条が置かれる（要原本照合）\n- 『世医得効方』の「治傷風傷暑瘧大效」は、傷風・傷暑・瘧を並べて読むか、傷風・傷暑による瘧と読むかを原文からは決めにくい（要確認）。条は痎瘧の門にある（翻刻確認）\n- 『世医得効方』の「毎服」の分量（合和した散を1回に何銭用いるか）は書かれない（翻刻確認）\n- 『太平恵民和剤局方』指南総論の見出しは、維基文庫の四庫全書本の翻刻では「論解和證候」と書かれる（要原本照合）。同じ段の末尾に「乃和解證也」とあり、資料の書き下しも「和解の証候」とするので、「和解」を本文に採った\n- 「證候」の「候」は、翻刻では外字で表されている（要原本照合）\n- 「并服半貼」は、資料の書き下しでは「再び半貼を服して」と読まれる（要原本照合）。「可用小柴胡湯一貼」は、資料の書き下しでは「小柴胡湯一貼を与うべし」と読まれる（要原本照合）\n- 「往」「胸」は、翻刻ではそれぞれ「徃」「胷」と書かれる（字体の違い）\n- 『太平恵民和剤局方』指南総論の条には「柴苓湯」の方名はなく、小柴胡湯に五苓散を兼ねて服す記載である（翻刻確認）\n- 条文の順：『世医得効方』は柴苓湯の方名の出典で、構成は小柴胡湯と五苓散の合和（麦門冬・地骨皮は煎じるときに加える）。『太平恵民和剤局方』指南総論は兼用の記載で、成立は『世医得効方』より早い（資料）。『世医得効方』を先頭にした（要確認）", "出典": "### 原典の構成\n- 『世医得効方』：小柴胡湯と五苓散を合和する。合和の割合は書かれない（翻刻確認）\n- 元の方（『世医得効方』）：小柴胡湯（巻一・傷寒・陽証）は柴胡2両（去蘆）、半夏6銭（湯洗七次）、黄芩・人参（去蘆）・粉草 各3銭。五苓散（巻二・傷暑）は沢瀉2両半、桂心1両、猪苓（去皮）・赤茯苓（去皮）・白朮（去蘆） 各1両半（翻刻確認）\n- 『太平恵民和剤局方』指南総論：小柴胡湯1貼（病が重ければ半貼を併せて服す）と五苓散の兼用。分量の記載はない（翻刻確認）\n\n### 原典の服用法\n- 『世医得効方』：毎服、生姜3片・麦門冬20粒（去心）・地骨皮少許を入れて煎じ、温服する（翻刻確認）\n- 元の方（『世医得効方』）：小柴胡湯は剉散とし、毎5銭を水1盞半に生姜5片・棗1枚を入れて6分まで煎じ、食前に服す。五苓散は末とし、毎服2銭を沸湯で調下し、時を拘らない（翻刻確認）\n\n### 処方の変遷\n- 小柴胡湯と五苓散の合方。資料は、小柴胡湯・五苓散はともに『傷寒論』『金匱要略』を出典とするが、それらの原典には合方投与は記載されていないとする。小柴胡湯・五苓散の条と方は『傷寒論』弁太陽病脈証并治中第六にある（翻刻確認）\n- 『傷寒論』弁太陽病脈証并治中第六の小柴胡湯の方後の加減に「若心下悸、小便不利者、去黄芩、加茯苓四兩」とある（翻刻確認）\n- 資料は、『太平聖恵方』巻第十七・治熱病二日諸方に、熱病二日で頭痛・口苦があり発汗を経ても解さないものに柴胡散（柴胡・人参・甘草・黄芩・赤茯苓・半夏を散とし、葱白・生姜で煎服）を服すとあるとする（要原本照合）\n- 資料は、『三因極一病証方論』巻之四・傷寒証治・小柴胡湯の加減に、心下悸し小便利せざるには茯苓1両を加えるとあり、黄芩の減去の記載はないとする（要原本照合）\n- 資料は、『仁斎直指附遺方論』巻八・声音・声音証治に、小柴胡湯に茯苓を加えて煎じる方があるとし、いずれも五苓散合方の一端をうかがわせるとする（要原本照合）\n- 『太平恵民和剤局方』指南総論巻中に、小柴胡湯を用い、渇や小便が渋るものには五苓散を兼ねて服す記載がある（翻刻確認）。資料は、指南総論は『世医得効方』より約130年早く世に出ており、柴苓湯の先駆的用法とする\n- 『世医得効方』（元・危亦林撰。翻刻確認）巻二で、小柴胡湯と五苓散を合和して柴苓湯と名づける。煎じるときに麦門冬・地骨皮を加える（翻刻確認）。資料は、我が国では通常は麦門冬・地骨皮を加えずに用いているとする\n- 現行の医療用エキス剤（ツムラ114）は 柴胡7.0g、沢瀉・半夏 各5.0g、黄芩・蒼朮・大棗・猪苓・人参・茯苓 各3.0g、甘草・桂皮 各2.0g、生姜1.0g の12味（PMDA 添付文書 2023年12月改訂 第1版で確認）。原典の五苓散の白朮の代わりに蒼朮が入る", "構成": "柴胡・沢瀉・半夏・黄芩・蒼朮・大棗・猪苓・人参・茯苓・甘草・桂皮・生姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "胃苓湯", "名前": "胃苓湯", "読み": "いれいとう", "ツムラ番号": "115", "出典": "医塁元戎（巻四・陽明証）／古今医鑑（巻五・泄瀉）／万病回春（巻三・泄瀉）", "別名": "", "本文": {"条文": "### 『医塁元戎』巻四・陽明証\n\n**書き下し**（読み：社員案）\n五苓・平胃各半の散、生薑にて調服し、心下の水を治す。五苓に石膏・寒水石・甘草を加えて甘露飲と為す。亦た心下の水、並びに飲酒して水瀉する者を治す。生薑にて三五銭を調え、清濁立ちどころに分かる。\n\n**原文**（翻刻確認）\n五苓平胃各半散、生薑調服、治心下水。五苓加石膏寒水石甘草、為甘露飲、亦治心下水並飲酒水瀉者、生薑調三五錢、清濁立分。\n\n**現代語訳**（訳：社員案）\n五苓散と平胃散を半分ずつ合わせた散を、生姜で溶いて服用し、心下の水を治す。五苓散に石膏・寒水石・甘草を加えると甘露飲となり、これも心下の水と、飲酒して水様の下痢をするものを治す。生姜で3〜5銭を溶いて服すと、清濁がたちまち分かれる。\n\n### 『古今医鑑』巻五・泄瀉\n\n**書き下し**（読み：社員案）\n暑に中り湿に傷られ、飲を停め食を夾み、脾胃和せず、腹痛泄瀉し、渇を作し、小便利せず、水穀化せず、陰陽分かれざるを治す。\n\n**原文**（翻刻確認）\n治中暑傷濕、停飲夾食、脾胃不和、腹痛泄瀉、作渴、小便不利、水穀不化、陰陽不分。\n\n**現代語訳**（訳：社員案）\n暑さに当たり湿に傷られ、水飲が停滞したうえに飲食の停滞も挟まり、脾胃が調和せず、腹痛して下痢し、口が渇き、尿の出が悪く、飲食物が消化されず、陰陽が分かれないものを治す。\n\n### 『万病回春』巻三・泄瀉\n\n**書き下し**（読み：社員案）\n泄瀉、清濁分かれざる者は、湿多くして五瀉を成すなり。胃苓湯　脾胃和せず、腹痛泄瀉し、水穀化せず、陰陽分かれざるを治す。\n\n**原文**（翻刻確認）\n泄瀉清濁不分者、濕多成五瀉也。胃苓湯　治脾胃不和、腹痛泄瀉、水穀不化、陰陽不分。\n\n**現代語訳**（訳：社員案）\n泄瀉で清濁が分かれないものは、湿が多くて五種の下痢となったものである。胃苓湯は、脾胃が調和せず、腹痛して下痢し、飲食物が消化されず、陰陽が分かれないものを治す。\n\n### 注記\n- 『医塁元戎』の条には「胃苓湯」の方名がない（翻刻確認）\n- 『医塁元戎』の「瀉」は、維基文庫の本（12巻本・四庫全書本とも）では「㵼」と書かれる（字体の違い）\n- 『医塁元戎』の「生薑調三五錢、清濁立分」が甘露飲だけにかかるのか、五苓平胃各半散にもかかるのかは、原文からは決めにくい（要原本照合）\n- 『万病回春』の胃苓湯の条には、『古今医鑑』の「中暑傷湿、停飲夾食」「作渇、小便不利」の句がない（翻刻確認）\n- 『万病回春』の「泄瀉清濁不分者、湿多成五瀉也」は、泄瀉の門の中で胃苓湯の前に置かれた見出しの句（翻刻確認）\n- 「停飲夾食」の「夾」は、書によって「挾」とも書かれる（要原本照合）。『醫方集解』（清・汪昂）は「停飲夾食」と書く（翻刻確認）\n- 『古今医鑑』の「泄瀉」は、資料の書き下しでは「洩瀉」と書かれる（要原本照合）\n- 『古今医鑑』の巻数は、維基文庫の本では本文が巻之五・泄瀉、冒頭の目次では巻三に洩瀉とある（翻刻確認）。資料は巻之五・泄瀉とする\n- 『古今医鑑』は龔信の撰で、序に「家君暨廷賢所編輯」とあり、子の龔廷賢も編纂に関わる（翻刻確認）。『万病回春』は龔廷賢（明）の著（翻刻確認）", "出典": "### 原典の構成\n- 『医塁元戎』：五苓散・平胃散 各半（翻刻確認）\n- 『古今医鑑』：蒼朮（米泔浸）・厚朴（姜汁炒）・陳皮・猪苓・沢瀉・白朮（炒）・白茯苓・白芍（炒） 各1銭、肉桂・甘草（炙） 各3分（翻刻確認）\n- 『万病回春』：蒼朮（米泔制）・厚朴（姜汁炒）・陳皮・猪苓・沢瀉・白朮（去芦）・茯苓（去皮）・白芍（煨） 各1銭、肉桂・甘草（炙） 各2分（翻刻確認）\n\n### 原典の服用法\n- 『医塁元戎』：散とし、生姜で調服する（翻刻確認）\n- 『古今医鑑』：1剤に刻み、生姜・棗を入れて水で煎じ、温服する（翻刻確認）\n- 『万病回春』：1剤に刻み、生姜・棗を入れて煎じ、空腹時に温服する（翻刻確認）\n\n### 処方の変遷\n- 平胃散と五苓散の合方。資料は、本方の出典は平胃散・五苓散の出典の上に成り立ち、そのうえで芍薬を含むかどうかで二つに分かれるとする\n- 五苓散の出典は『傷寒論』『金匱要略』（翻刻確認）。平胃散の出典は『博済方』『簡要済衆方』（要原本照合）。どちらも資料の出典欄に胃苓湯の出典と並べて挙げられている\n- 芍薬を含まない系統：『医塁元戎』（王好古・元）巻四・陽明証に「五苓平胃各半散」がある。胃苓湯の方名はない（翻刻確認）\n- 資料は、『医塁元戎』の原序に丁酉（1237年）、跋に辛卯（1231年）に成書したが元藁を盗まれて丁酉春に再編したとあり、現在の12巻本は顧遂が嘉靖22年（1543）に刊行し、万暦21年（1593）に屠本畯が重刊したものとする\n- 資料は、『医塁元戎』の一巻本・巻第八・太陰証・平胃散加減例に、平胃散を五苓散と半分ずつ合わせたものを対金飲子とする記載があるとする（要原本照合。維基文庫の四庫全書本12巻には見当たらない）\n- 資料は、羅天益『衛生宝鑑』巻十六・泄痢門・濡泄の対金飲子を、平胃散5銭・五苓散2銭半・草豆蔲5銭を姜・棗で煎服する方とする（要原本照合）\n- 『婦人大全良方』（陳自明）巻八に胃苓散があり、「治夏秋之間脾胃傷冷水穀不分泄瀉不止」「五苓散　平胃散」「右合和薑棗煎空心服妙陳日華方」とある（翻刻確認）。資料はこれを、胃苓湯がもとは胃苓散という方名だった根拠とする\n- 『世医得効方』巻五に「胃苓湯」の名で五苓散と平胃散を合わせて用いる記載がある（翻刻確認）。同書の著者・時代は要確認。分量の「二銭合和」の読み（各2銭か合わせて2銭か）は要原本照合\n- 『丹渓心法』（朱震亨）にも「胃苓湯」の名で五苓散と平胃散を合わせる記載がある（翻刻確認）\n- 資料は、朱佐『類編朱氏集験医方』巻之四・脾胃門の虚腫に、胃苓丸を腫れに用い、木通湯で呑み下す記載があるとする（要原本照合）\n- 『薛氏医案』巻六十では胃苓散とも呼び、末にして蜜丸にしたものを胃苓膏とする（翻刻確認）。資料は、ここの薬味は白朮・茯苓・沢瀉・厚朴・猪苓・陳皮・甘草・桂で、蒼朮を含まないとする（要原本照合）\n- 芍薬を含む系統：『古今医鑑』巻五・『万病回春』巻三の胃苓湯には白芍が入る（翻刻確認）。資料は、芍薬を含む胃苓湯の出典は従来『万病回春』とされてきたが、薬味は両書で同じで、『古今医鑑』の刊行は『万病回春』より11年早いとする\n- 資料は、呉尚黙訂『丹渓手鏡』巻之中・泄瀉二十六の平胃五苓散（平胃散・五苓散・白朮・芍薬・甘草）にも芍薬が入るとし、同書は明の天啓元年（1621）の撰とする（要原本照合）\n- 現行の医療用エキス剤（ツムラ115）は 厚朴・蒼朮・沢瀉・猪苓・陳皮・白朮・茯苓 各2.5g、桂皮2.0g、生姜・大棗 各1.5g、甘草1.0g の11味で、芍薬は入っていない（PMDA 添付文書 2023年12月改訂で確認）\n- 資料の組成欄は、芍薬を括弧で囲んで示し、本方を「五苓散合平胃散（加芍薬）」と説明する。そのうえで、現在は芍薬を配合した医療用エキス製剤はないとする\n- 資料は、かつては芍薬を含まない胃苓湯と含む胃苓湯の両方が医療用エキス製剤として薬価収載されていたが、芍薬を含む製剤は平成24年（2012）3月31日に経過措置期間が終わって薬価削除になった（そのメーカーは一般用漢方製剤として芍薬を含む胃苓湯を販売している）とする。このため資料は、現在の医療用エキス製剤胃苓湯の最終的な出典を『医塁元戎』とする", "構成": "厚朴・蒼朮・沢瀉・猪苓・陳皮・白朮・茯苓・桂皮・生姜・大棗・甘草", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "茯苓飲合半夏厚朴湯", "名前": "茯苓飲合半夏厚朴湯", "読み": "ぶくりょういんごうはんげこうぼくとう", "ツムラ番号": "116", "出典": "本朝経験方", "別名": "", "本文": {"条文": "", "出典": "### 原典の構成\n\n### 原典の服用法\n\n### 処方の変遷\n- 茯苓飲と半夏厚朴湯の合方で、資料の出典欄は「本朝経験方」（日本の経験方）。資料は本方の出典を不詳とする\n- 茯苓飲の出典は『外台秘要方』巻八（「延年茯苓飲」として茯苓・人参・白朮・生姜・枳実・橘皮の6味。方後の注に「仲景傷寒論同」）、半夏厚朴湯の出典は『金匱要略』婦人雑病脈証并治第二十二（翻刻確認）\n- 『聖済総録』に茯苓飲加五味子・半夏・大棗にあたる方が載るとされる（要原本照合）\n- 亀井南溟『病因備考』嘔吐噦に「茯苓加半夏湯」、『類聚方広義』（下）茯苓飲の条に茯苓飲加半夏、『証治摘要』黄胖に茯苓飲加厚朴湯が見えるとされる（要原本照合）\n- 『皇漢医学』第弐巻・茯苓飲方に、茯苓飲に半夏を加えるのがよいとする記載があるとされる（要原本照合）\n- 資料が挙げる合方の最も古い文献は、大塚敬節「半夏厚朴湯に就て」（『漢方と漢薬』第五巻第六号、昭和13年）で、半夏厚朴湯合茯苓飲として投薬した症例が載るとされる（要原本照合）\n- 『漢方診療の実際』処方集篇（昭和16年初版・昭和29年改訂版）に「茯苓飲合半夏厚朴湯」の名で載るとされる（要原本照合）\n- 現行エキス剤（ツムラ116）は 半夏6.0・茯苓5.0・蒼朮4.0・厚朴3.0・陳皮3.0・人参3.0・蘇葉2.0・枳実1.5・生姜1.0g の9味（PMDA 添付文書 2023年12月改訂 第1版で確認）。茯苓飲の原典の白朮は、エキス剤では蒼朮", "構成": "半夏・茯苓・蒼朮・厚朴・陳皮・人参・蘇葉・枳実・生姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["出典", "構成", "方意", "諸家の論"]}, {"file": "苓姜朮甘湯", "名前": "苓姜朮甘湯", "読み": "りょうきょうじゅつかんとう", "ツムラ番号": "118", "出典": "金匱要略（五臓風寒積聚病脈証并治第十一）", "別名": "", "本文": {"条文": "### 『金匱要略』五臓風寒積聚病脈証并治第十一\n\n**書き下し**（読み：社員案）\n腎著の病は、其の人身体重く、腰中冷え、水中に坐するが如く、形は水状の如くなるも、反って渇せず、小便自利し、飲食故の如し。病は下焦に属す。身労して汗出で、衣（一に表に作る）裏冷湿し、久久にして之を得。腰以下冷痛し、腹重きこと五千銭を帯ぶるが如し。甘姜苓朮湯之を主る。\n\n**原文**（翻刻確認）\n腎著之病，其人身體重，腰中冷，如坐水中，形如水狀，反不渴，小便自利，飲食如故，病屬下焦，身勞汗出，衣（一作表）裏冷濕，久久得之，腰以下冷痛，腹重如帶五千錢，甘薑苓朮湯主之。\n\n**現代語訳**（訳：社員案）\n腎著の病では、その人は体が重く、腰の中が冷え、水の中に座っているようで、外見は水腫のようであるのに、かえって口は渇かず、尿は自然によく出て、飲食はふだんどおりである。病は下焦に属する。体を使って働き汗をかき、衣服の内側（一本では「表」）が冷えて湿った状態が長く続いて、この病を得る。腰から下が冷えて痛み、腹が重いことは五千銭を身に帯びているようである。甘姜苓朮湯がこれを主治する。\n\n### 注記\n- 本文は維基文庫の『金匱要略』の通行本の翻刻の字を採った。「（一作表）」は翻刻で本文に続けて書かれた小注で、括弧は社員が付けた。この翻刻には方（構成・服用法）が載っていない（翻刻確認）\n- 条文の中の方名は「甘薑苓朮湯」。方の名は『金匱要略方論』の翻刻で「甘草乾姜茯苓白朮湯」（新字体で記す）（翻刻確認）\n- 四部叢刊本『金匱要略方論』の翻刻では、条文の方名が「乾姜苓术湯」と書かれる（要原本照合）\n- 四部叢刊本の翻刻では「腎著」が「腎着」、「屬」が「属」、「勞」が「劳」、「久久」が「乆乆」（字体の違い）\n- 「腹重如帶五千錢」の「腹」は、資料の書き下しでは「腰重きこと」とされる。翻刻は通行本・四部叢刊本・簡体字本とも「腹」（「腰」は要原本照合）", "出典": "### 原典の構成\n- 『金匱要略方論』：甘草2両、白朮2両、乾姜4両、茯苓4両（翻刻確認）\n\n### 原典の服用法\n- 『金匱要略方論』：4味を水5升で煮て3升を取り、3回に分けて温服する。腰の中がすぐに温まる（翻刻確認）\n\n### 処方の変遷\n- 原典の方名は甘草乾姜茯苓白朮湯で、条文の中では甘姜苓朮湯と呼ばれる（翻刻確認）\n- 苓姜朮甘湯の名は日本だけの呼び名で、吉益東洞が名付けたものとされる（資料の記載。要確認）\n- 後世の書では腎著湯の名でも載り、『備急千金要方』では甘草2両・乾姜3両・茯苓・白朮各4両とされる（資料の記載。要原本照合）\n- 現行エキス剤（ツムラ118）は 茯苓6.0g・乾姜3.0g・白朮3.0g・甘草2.0g の4味（PMDA 添付文書 2023年12月改訂 第1版で確認）。原典（甘草2・白朮2・乾姜4・茯苓4両）とは分量の比が異なる", "構成": "茯苓・乾姜・白朮・甘草", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "苓甘姜味辛夏仁湯", "名前": "苓甘姜味辛夏仁湯", "読み": "りょうかんきょうみしんげにんとう", "ツムラ番号": "119", "出典": "金匱要略（痰飲咳嗽病脈証并治第十二）", "別名": "", "本文": {"条文": "### 『金匱要略』痰飲咳嗽病脈証并治第十二\n\n**書き下し**（読み：社員案）\n水去り嘔止み、其の人形腫るる者は、杏仁を加えて之を主る。其の証は応に麻黄を内るべきも、其の人遂に痹するを以ての故に之を内れず。若し逆して之を内るる者は必ず厥す。然る所以の者は、其の人血虚し、麻黄其の陽を発するを以ての故なり。\n\n**原文**（翻刻確認）\n水去嘔止，其人形腫者，加杏仁主之。其證應內麻黃，以其人遂痹，故不內之。若逆而內之者，必厥，所以然者，以其人血虛，麻黃發其陽故也。\n\n**現代語訳**（訳：社員案）\n水が去って嘔吐が止んだが、その人の体がむくむものは、杏仁を加えてこれを主治する。その証には本来麻黄を入れるべきだが、その人がしびれを起こしているので入れない。もし道理に逆らって入れれば、必ず厥（手足の冷え）を起こす。そうなるわけは、その人が血虚で、麻黄がその陽を発散させるからである。\n\n### 関連条文（本方に至る一連の条）\n\n『金匱要略』痰飲咳嗽病脈証并治第十二。本方の条の前に続く3条。青竜湯を服したあとの変化に応じて方を加減していき、本方の条に至る。\n\n**書き下し**（読み：社員案）（1条目：茯苓桂枝五味甘草湯）\n青竜湯下し已りて、多唾し口燥き、寸脈沈、尺脈微、手足厥逆し、気小腹より胸咽に上衝し、手足痹れ、其の面翕熱して酔える状の如く、因りて復た陰股に下流し、小便難く、時に復た冒する者は、茯苓桂枝五味甘草湯を与えて、其の気衝を治す。\n\n**原文**（翻刻確認）\n青龍湯下已，多唾口燥，寸脈沉，尺脈微，手足厥逆，氣從小腹上衝胸咽，手足痹，其面翕熱如醉狀，因復下流陰股，小便難，時復冒者，與茯苓桂枝五味甘草湯，治其氣衝。\n\n**現代語訳**（訳：社員案）\n青竜湯を服し終えたあと、唾が多く口が乾き、寸脈は沈、尺脈は微で、手足が冷え、気が下腹から胸やのどへ突き上げ、手足がしびれ、顔がほてって酒に酔ったようになり、そのあと（気が）また内股へ下って流れ、尿が出にくく、ときにまた頭がぼうっとする（冒）ものには、茯苓桂枝五味甘草湯を与えて、その気の突き上げを治す。\n\n**書き下し**（読み：社員案）（2条目：苓甘五味姜辛湯）\n衝気即ち低くして、反って更に咳し、胸満する者は、桂苓五味甘草湯去桂加乾姜細辛を用いて、以て其の咳満を治す。\n\n**原文**（翻刻確認）\n衝氣即低，而反更咳、胸滿者，用桂苓五味甘草湯去桂加乾薑、細辛，以治其咳滿。\n\n**現代語訳**（訳：社員案）\n突き上げる気はすぐに下がったが、かえってまた咳が出て胸が張るものは、桂苓五味甘草湯から桂枝を去り乾姜・細辛を加えたものを用いて、その咳と胸満を治す。\n\n**書き下し**（読み：社員案）（3条目：半夏を加える）\n咳満即ち止みて、更に復た渇し、衝気復た発する者は、細辛・乾姜の熱薬為るを以てなり。之を服すれば当に遂に渇すべし。而るに渇反って止む者は、支飲為るなり。支飲の者は法として当に冒すべし。冒する者は必ず嘔す。嘔する者は復た半夏を内れて以て其の水を去る。\n\n**原文**（翻刻確認）\n咳滿即止，而更復渴，衝氣復發者，以細辛、乾薑為熱藥也，服之當遂渴，而渴反止者，為支飲也。支飲者法當冒，冒者必嘔，嘔者復內半夏以去其水。\n\n**現代語訳**（訳：社員案）\n咳と胸満はすぐに止んだが、また口が渇き、突き上げる気が再び起こるのは、細辛・乾姜が熱薬だからである。これを服せば口が渇くはずなのに、かえって渇きが止むものは支飲である。支飲では決まって頭がぼうっとする（冒）はずで、冒するものは必ず嘔吐する。嘔吐するものには、さらに半夏を入れてその水を去る。\n\n### 注記\n- 本文（4条とも）は維基文庫の『金匱要略』の通行本の翻刻の字を採った。この翻刻にはこの一連の条の方（構成・服用法）が載っていない（翻刻確認）。方は四部叢刊本『金匱要略方論』巻中の翻刻による\n- 本方の条：四部叢刊本の翻刻には「逆而内之者」の前の「若」がない（要原本照合）。資料の書き下しは「若し逆して之を内るる者」で通行本と同じ。また同書の翻刻では「痹」が「痺」（字体の違い）\n- 1条目：四部叢刊本の翻刻では「其面翕熱」が「其面翕然熱」（要原本照合）\n- 2条目：四部叢刊本の翻刻では「去桂加乾薑、細辛」が「去桂加生姜細辛」（要原本照合）。同書でもこの条の後の苓甘五味姜辛湯方の構成は「乾姜」\n- 3条目：四部叢刊本の翻刻では「服之當遂渴」が「服之當遂滿」（要原本照合）\n- 四部叢刊本の翻刻では「咳」がいずれも「欬」（要原本照合）\n- 四部叢刊本の翻刻の方名は「苓芍姜味辛夏仁湯」で、構成に芍薬は入っていない（要原本照合）。続く大黄を加えた方は「茯甘姜味辛夏仁黄湯」と書かれる\n- 篇名は、資料では「痰飲欬嗽病脉証并治第十二」。通行本の翻刻は「痰飲咳嗽病脈證並治第十二」（翻刻確認）", "出典": "### 原典の構成\n- 『金匱要略方論』（四部叢刊本）：茯苓4両、甘草3両、五味（五味子）半升、乾姜3両、細辛3両、半夏半升、杏仁半升（皮尖を去る）（翻刻確認）\n\n### 原典の服用法\n- 『金匱要略方論』（四部叢刊本）：7味を水1斗で煮て3升を取り、滓を去り、半升を温服する。日に3回服す（翻刻確認）\n\n### 処方の変遷\n- 資料は、本方を小青竜湯の加減方（小青竜湯去麻黄・芍薬・桂皮加茯苓・杏仁）とする\n- 『金匱要略』痰飲咳嗽病脈証并治第十二では、青竜湯を服したあとの変化に応じて、茯苓桂枝五味甘草湯 → 苓甘五味姜辛湯（桂枝を去り乾姜・細辛を加える）→ 半夏を加える → 本方（杏仁を加える）と続き、本方の条の次に「若面熱如醉，此為胃熱上衝熏其面，加大黃以利之。」として大黄を加える条が置かれる（翻刻確認）\n- 方名について、資料は「原典での方名は茯苓甘草五味姜辛湯」とし、『金匱要略論註』では苓甘五味加姜辛半夏杏仁湯と呼ばれ、苓甘姜味辛夏仁湯の名は『類聚方』に拠るとする（要確認）\n- 現行エキス剤（ツムラ119）は 杏仁4.0g・半夏4.0g・茯苓4.0g・五味子3.0g・乾姜2.0g・甘草2.0g・細辛2.0g の7味（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "杏仁・半夏・茯苓・五味子・乾姜・甘草・細辛", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "黄連湯", "名前": "黄連湯", "読み": "おうれんとう", "ツムラ番号": "120", "出典": "傷寒論（弁太陽病脈証并治下第七）", "別名": "", "本文": {"条文": "### 『傷寒論』弁太陽病脈証并治下第七\n\n**書き下し**（読み：社員案）\n傷寒、胸中に熱有り、胃中に邪気有り、腹中痛み、嘔吐せんと欲する者は、黄連湯之を主る。\n\n**原文**（翻刻確認）\n傷寒、胸中有熱、胃中有邪氣、腹中痛、欲嘔吐者、黄連湯主之。\n\n**現代語訳**（訳：社員案）\n傷寒で、胸の中に熱があり、胃の中に邪気があって、腹が痛み、吐きそうになる者は、黄連湯が主治する。\n\n### 注記\n- 宋本の翻刻では、方の服用法の後に林億らの「疑うらくは仲景の方に非ず」の注は見当たらない。資料は原典の後条文の最後にこの注があるとする（要原本照合）\n- 成無己『注解傷寒論』巻第四ではこの注がない（翻刻確認）。資料も同じ指摘をしている\n- 「胸中」は通行本（宋本）の字を採った。四庫全書本の成無己注本では「胷中」と書かれる（要原本照合）\n- 服用法は宋本の「温服、昼三、夜二」を採った。成無己注本では「温服一升、日に三服、夜に二服」と1回量が書かれる（要原本照合）", "出典": "### 原典の構成\n- 『傷寒論』：黄連3両、甘草（炙）3両、乾姜3両、桂枝（去皮）3両、人参2両、半夏（洗）半升、大棗（擘）12枚（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』：7味を水1斗で煮て6升を取り、滓を去って温服する。昼に3回、夜に2回（翻刻確認）\n\n### 処方の変遷\n- 『傷寒論』の半夏瀉心湯（黄連1両・黄芩3両）から黄芩を去り桂枝を加え、黄連を3両に増やした形。徐大椿『傷寒類方』瀉心湯類は「半夏瀉心湯去黄芩加桂枝」とする（半夏瀉心湯の構成は翻刻確認。『傷寒類方』は要原本照合）\n- 『祖剤』巻之一は、伊尹甘草瀉心湯を祖とし、黄連湯を半夏瀉心湯に黄連2両・桂枝3両を加え人参1両を減じた方として載せる。黄芩を去ることには触れない（要原本照合）\n- 東洞は、林億の「仲景の方に非ず」の注にかかわらず『類聚方』に本方を採っている。東洞がこの注のない成無己本を拠りどころにしていたためとされる（要原本照合）\n- 現行エキス剤（ツムラ120）は 半夏・黄連・乾姜・甘草・桂皮・大棗・人参 の7味。半夏6.0g、他の6味は各3.0g（PMDA 添付文書 2023年12月改訂 第1版で確認）。原典の桂枝は桂皮、人参は原典の2両に対し他の薬と同量になっている", "構成": "半夏・黄連・乾姜・甘草・桂皮・大棗・人参", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "三物黄芩湯", "名前": "三物黄芩湯", "読み": "さんもつおうごんとう", "ツムラ番号": "121", "出典": "金匱要略（婦人産後病脈証并治第二十一・千金方の引用）／肘後百一方（巻之二・治傷寒時気温病方第十三）", "別名": "", "本文": {"条文": "### 『金匱要略』婦人産後病脈証并治第二十一・附方（『千金』三物黄芩湯）\n\n**書き下し**（読み：社員案）\n千金三物黄芩湯、婦人草蓐に在りて、自ら発露して風を得、四肢苦だ煩熱するを治す。頭痛する者には小柴胡湯を与え、頭痛まず但だ煩する者は、此の湯之を主る。\n\n**原文**（翻刻確認）\n千金三物黄芩湯、治婦人在草蓐、自發露得風、四肢苦煩熱、頭痛者與小柴胡湯、頭不痛但煩者、此湯主之。\n\n**現代語訳**（訳：社員案）\n『千金』の三物黄芩湯。婦人が産褥にあって、自分から身をさらして風に当たり、手足がひどく煩わしくほてるものを治す。頭痛するものには小柴胡湯を与え、頭痛がなくただ煩わしいものは、この湯が主治する。\n\n### 『肘後百一方』巻之二・治傷寒時気温病方第十三（方名なし。「又方」）\n\n**書き下し**（読み：社員案）\n若し已に五六日以上なる者は、……又方、苦参二両、黄芩二両、生地黄半斤、水八升もて煮て一升を取り、分かちて再服す。或いは毒を吐下すれば則ち愈ゆ。\n\n**原文**（翻刻確認）\n若已五六日以上者、……又方苦參二兩、黄芩二兩、生地黄半斤、水八升煑取一升、分再服。或吐下毒則愈。\n\n**現代語訳**（訳：社員案）\n（傷寒・時気・温病で）すでに5〜6日以上たった者には、……別の方として、苦参2両・黄芩2両・生地黄半斤を水8升で煮て1升を取り、2回に分けて服す。毒を吐いたり下したりすれば治る。\n\n### 注記\n- 『金匱要略』の附方に『千金』の方として引かれる（翻刻確認）\n- 維基文庫の『金匱要略』（通行本）の翻刻には婦人産後病篇の附方が載っておらず、条文・構成・服用法は四部叢刊本（明嘉靖俞橋刊本の影印）の翻刻で確かめた。維基文庫の簡体字の本『金匱要略方論』（未校訂）にも同じ附方が同じ字・分量で載る（翻刻確認）\n- 「發」「熱」は、四部叢刊本の翻刻では異体字で書かれる（字体の違い。要原本照合）\n- 方後の「蟲」は、四部叢刊本の翻刻では「䖝」と書かれ、「吐」は異体字の画像で示される（字体の違い。要原本照合）\n- 句読点は社員が付けた。「頭痛者與小柴胡湯」を前の句に続けて読むか、新しい句として読むかで書き下しが変わる。社員案は新しい句として読んだ（要確認）\n- 『肘後百一方』の条は、維基文庫の四庫全書本『肘後備急方』巻二の翻刻による。「若已五六日以上者」の小見出しのもとに、青竹瀝の方、大黄・黄連・黄檗・梔子の方に続いて3つ目の「又方」として載る。「……」はその間の2方を略した印（翻刻確認）\n- 『肘後百一方』の方は方名がないので構成だけで比べ、苦参・黄芩・地黄の3味で現行エキス剤（ツムラ）と同じとみて条文の欄に置いた（取りまとめ側の基準。生地黄／乾地黄の修治の違いは問わない）。産褥とは関係のない条\n- 2書の順は、どちらも現行エキス剤と構成が一致し基準では決まらないので、資料の出典欄の『金匱要略』を先にした（要確認）", "出典": "### 原典の構成\n- 『金匱要略』：黄芩1両、苦参2両、乾地黄4両（翻刻確認。四部叢刊本の翻刻だけで確かめた）\n- 『肘後百一方』：苦参2両、黄芩2両、生地黄半斤（翻刻確認）\n\n### 原典の服用法\n- 『金匱要略』：3味を水8升で煮て2升を取り、1升を温服する。多くは虫を吐下する（翻刻確認）\n- 『肘後百一方』：水8升で煮て1升を取り、2回に分けて服す。毒を吐下すれば愈える（翻刻確認）\n\n### 処方の変遷\n- 『金匱要略』では婦人産後病脈証并治第二十一の附方に「千金三物黄芩湯」として載る（翻刻確認）\n- 『備急千金要方』巻第三・婦人方中・中風第三に、同じ主治で黄芩・苦参各2両、乾地黄4両として載り、条文の後に「多くは虫を吐下す」とある（要原本照合）\n- 『肘後百一方』巻之二・治傷寒時気温病方第十三に、傷寒で5〜6日以上たった者に苦参2両・黄芩2両・生地黄半斤の方が方名なしで載る。産褥とは関係のない条（条文の欄に載せた。翻刻確認）\n- 『備急千金要方』巻第十・傷寒下・傷寒雑治第一の苦参湯は、熱病5〜6日以上を治し、苦参3両・黄芩2両・生地黄8両（要原本照合）\n- 『太平聖恵方』巻第十七・治熱病三日諸方の苦参散は、苦参・黄芩・甘草を煎じて生地黄汁を入れて服す（要原本照合）\n- 『外台秘要方』第三巻・天行病発汗等方に、三物黄芩湯が苦参湯の名で載る（要原本照合）\n- 『婦人大全良方』巻之二十二・産後傷寒方論第一に、原典とほぼ同じ条文で載るが、虫に関する記載はない（要原本照合）\n- 現行エキス剤（ツムラ121）は 地黄・黄芩・苦参 の3味（PMDA 添付文書 2023年12月改訂 第1版で確認。販売名は「三物黄ごん湯」と書かれる）", "構成": "地黄・黄芩・苦参", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "排膿散及湯", "名前": "排膿散及湯", "読み": "はいのうさんきゅうとう", "ツムラ番号": "122", "出典": "東洞先生投剤証録", "別名": "", "本文": {"条文": "### 『東洞先生投剤証録』\n\n**書き下し**（要原本照合）\n\n**原文**（要原本照合）\n\n**現代語訳**\n\n### 注記\n- 『東洞先生投剤証録』には「排膿散及湯合方」とあり、応鐘散を兼用して、20余歳で前年に右耳下が腫れ、春になって潰れて膿が出て少し軽くなったがまだ治らないという症例に処方されている（要原本照合。資料の書き下しによる）\n- 『東洞先生投剤証録』の原文の翻刻は維基文庫に見当たらない（2026-10-23 検索。要原本照合）\n- 元の方の排膿散の桔梗は、維基文庫の『金匱要略』と四部叢刊本の『金匱要略方論』では1分、『金匱要畧論註』（四庫全書本）では2分と書かれる（要原本照合）。本文は前者の1分を採った\n- 元の方の排膿散の服用法は、維基文庫の『金匱要略』では「揉和」で終わり、『金匱要畧論註』では「令相得飲和服之日一服」と続き、四部叢刊本では「煎如薄粥温服一升差即止」と続く（要原本照合）。四部叢刊本の翻刻では、排膿散の後に排膿湯と浸淫瘡の条がなく、そのまま「蚘厥者……」の条に続く（要原本照合）\n- 元の方の排膿湯は、維基文庫の『金匱要略』と四部叢刊本の翻刻には載っておらず、『金匱要畧論註』（四庫全書本）でだけ確かめた（翻刻確認）", "出典": "### 原典の構成\n- 『東洞先生投剤証録』：合方としての分量は資料に記載がない（要原本照合）\n- 元の方の排膿散（『金匱要略』瘡癰腸癰浸淫病脈証并治第十八）：枳実16枚・芍薬6分・桔梗1分（翻刻確認）\n- 元の方の排膿湯（『金匱要畧論註』巻十八・瘡癰腸癰浸淫病脈証并治）：甘草2両・桔梗3両・生姜1両・大棗10枚（翻刻確認）\n\n### 原典の服用法\n- 『東洞先生投剤証録』：合方としての服用法は資料に記載がない（要原本照合）\n- 元の方の排膿散（『金匱要略』）：3味を杵いて散とし、鶏子黄1枚を取り、薬の散を鶏子黄と同じ量にして揉み合わせる（翻刻確認）\n- 元の方の排膿散（『金匱要畧論註』）：同じく揉み合わせてよく混ぜ、飲で混ぜて服す。日に1回（翻刻確認）\n- 元の方の排膿湯（『金匱要畧論註』）：4味を水3升で煮て1升を取り、5合を温服する。日に2回（翻刻確認）\n\n### 処方の変遷\n- 排膿散と排膿湯の合方。排膿散・排膿湯の出典はともに『金匱要略』瘡癰腸癰浸淫病脈証并治第十八で、排膿散に続いて排膿湯が載る。どちらにも主治の条文はなく、方だけが載る（翻刻確認）\n- 共通の薬味は桔梗。排膿湯の甘草・桔梗は桔梗湯と同じ2味で、資料は本方を桔梗湯に枳実・芍薬・生姜・大棗を加えたものとみてもよいとする\n- 元の排膿散は鶏子黄を用いる（翻刻確認）。資料は、本来は排膿散及湯でも鶏子黄を含むが、省略されることが多いとする\n- 資料は、『東洞先生投剤証録』の「排膿散及湯合方」の症例を今日の排膿散及湯の処方例のはじまりとし、わざわざ合方と書いているので、排膿散及湯はもともと排膿散と排膿湯を略して続けて書いたものとする（要原本照合）\n- 資料は、『薬徴』の弁誤に「排膿湯及散は金匱の腸癰部に載在す」とあるのも両方を略して書いただけで合方の意味はなく、東洞が排膿散及湯という一つの処方として名づけたのではないとする（要原本照合）\n- 資料は、尾台榕堂『類聚方広義』（下）・排膿湯に、東洞先生が排膿湯と排膿散を合わせて排膿散及湯と名づけたとあることから、名づけ親はむしろ尾台榕堂であるとする（要原本照合）\n- 現行エキス剤（ツムラ122）は7.5g中 桔梗4.0・甘草3.0・枳実3.0・芍薬3.0・大棗3.0・生姜1.0g の6味で、鶏子黄は入っていない（PMDA 添付文書 2023年12月改訂 第1版で確認）。添付文書に出典の欄はない", "構成": "桔梗・甘草・枳実・芍薬・大棗・生姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "当帰建中湯", "名前": "当帰建中湯", "読み": "とうきけんちゅうとう", "ツムラ番号": "123", "出典": "金匱要略（婦人産後病脈証并治第二十一・千金方の引用）", "別名": "内補当帰建中湯", "本文": {"条文": "### 『金匱要略』婦人産後病脈証并治第二十一・附方（『千金』内補当帰建中湯）\n\n**書き下し**（読み：社員案）\n千金内補当帰建中湯、婦人産後の虚羸不足、腹中刺痛して止まず、吸吸として少気し、或いは少腹中急なるに苦しみ、摩痛して腰背に引き、食飲すること能わざるを治す。産後一月、日に四五剤を服するを得るを善しと為し、人をして強壮ならしむるに宜し。\n\n**原文**（翻刻確認）\n千金内補當歸建中湯，治婦人産後虚羸不足，腹中刺痛不止，吸吸少氣，或苦少腹中急，摩痛引腰背，不能食飲。産後一月，日得服四五劑爲善，令人强壮，宜。\n\n**現代語訳**（訳：社員案）\n『千金』の内補当帰建中湯。婦人が産後にやせ衰えて不足し、腹の中が刺すように痛んで止まらず、息が浅く弱々しく、あるいは下腹部がひきつれるのに苦しみ、摩痛（要確認）して腰や背中に響き、飲食ができないものを治す。産後1か月の間、1日に4〜5剤を服用できるのがよく、人を丈夫にするのに適する。\n\n### 注記\n- 『金匱要略』の附方に『千金』の方として引かれる。原典での方名は内補当帰建中湯（翻刻確認）。見出しは販売名の「当帰建中湯」、原典の「内補当帰建中湯」は別名に入れた\n- 維基文庫の『金匱要略』（通行本）の翻刻には婦人産後病篇の附方が載っていない。本文は『金匱要略論註』（徐彬註。四庫全書本）巻二十一に引かれる本文の翻刻の字を採った。資料の書き下しの字とも一致する（本文にどの本を採るかは要確認）\n- 『金匱要略方論』の四部叢刊本（明嘉靖俞橋刊本の影印）の翻刻にも同じ附方があり、「引腰背」が「引腰皆」と書かれる（要原本照合）\n- 「宜」は、翻刻では異体字の「冝」で書かれる（字体の違い。要原本照合）\n- 句読点は社員が付けた。末尾の「令人强壮，宜。」の切り方で書き下しが変わる（要確認）\n- 「摩痛」の意味は確かめられていない。訳は語をそのまま残した（要確認）", "出典": "### 原典の構成\n- 『金匱要略』：当帰4両、桂枝3両、芍薬6両、生姜3両、甘草2両、大棗12枚（翻刻確認。『金匱要略論註』と四部叢刊本の翻刻で分量は同じ）\n\n### 原典の服用法\n- 『金匱要略』：6味を水1斗で煮て3升を取り、3回に分けて温服し、1日で飲み尽くす。大虚には飴糖6両を加え、湯ができてから入れ、火にかけて温めて飴を溶かす。出血が多すぎて崩傷・内衄が止まらなければ、地黄6両・阿膠2両を加えて8味とし、湯ができてから阿膠を入れる。当帰がなければ芎藭で代え、生姜がなければ乾姜で代える（翻刻確認）\n\n### 処方の変遷\n- 『傷寒論』（宋本）の桂枝加芍薬湯（桂枝3両・芍薬6両・甘草2両・生姜3両・大棗12枚）に当帰4両を加えた構成にあたる。大虚のときは飴糖6両を加える（小建中湯の膠飴は1升）（翻刻確認）\n- 『金匱要略』では婦人産後病脈証并治第二十一の附方に「千金内補当帰建中湯」として載る（翻刻確認）\n- 『備急千金要方』巻第三・婦人方中・心腹痛第四に、内補当帰建中湯として原典とほぼ同じ条文・薬味の量・方後の文が載り、直後に内補芎藭湯（芎藭・乾地黄・芍薬・桂心・甘草・乾姜・大棗）が続くとされる（要原本照合）\n- 『千金翼方』巻第六・婦人二・虚損第七では、内補当帰建中湯ではなく当帰建中湯の名で載り、条文の最後が「人をして強壮、内補せしむる方」となっているとされる（要原本照合）\n- 『永類鈐方』巻第十五・済陰門・月候不調の当帰建中湯は、婦人の一切の血気不足・虚損羸乏を治し、当帰・肉桂・甘草・白芍を㕮咀して姜・棗とともに煎服するとされる（要原本照合）\n- 『世医得効方』巻第三・大方脉雑医科・腹痛の当帰建中湯は、当帰・桂心・揚芍薬・黄耆で、甘草がなく黄耆が加わるとされる（要原本照合）\n- 『薛氏医案』巻四十三・婦人良方・産後虚極生風方論第五・附治験の当帰建中湯は、当帰・桂心・白芍薬・甘草を姜・棗とともに水煎し、飴糖を入れて服すとされる（要原本照合）\n- 盧之頤『痎瘧論疏』附方・腎瘧二方の桂枝加当帰芍薬湯は、桂枝6銭・芍薬1両・甘草4銭・生姜6銭・大棗4枚・当帰1両で、本方が別名で腎瘧に用いられたものとされる（要原本照合）\n- 徐大椿『女科指要』には、巻之五・産後門の当帰建中湯（当帰・桂枝・白芍・炙草・大棗・生姜）のほか、巻之一・経候門・鼻衄の建中湯、巻之五・産後門の内補建中湯（当帰・赤芍・肉桂・炙草・砂糖）など、類方・同名異方が多く載るとされる（要原本照合）\n- 現行エキス剤（ツムラ123）は 芍薬・桂皮・大棗・当帰・甘草・生姜 の6味で、膠飴は有効成分に含まれない（添加剤にアメ粉）。1日量7.5g中、シャクヤク5.0・ケイヒ4.0・タイソウ4.0・トウキ4.0・カンゾウ2.0・ショウキョウ1.0g の混合生薬の乾燥エキス3.75gを含む（PMDA 添付文書 2023年12月改訂 第1版で確認）。原典の「桂枝」は、添付文書では「ケイヒ」と書かれる", "構成": "芍薬・桂皮・大棗・当帰・甘草・生姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "川芎茶調散", "名前": "川芎茶調散", "読み": "せんきゅうちゃちょうさん", "ツムラ番号": "124", "出典": "万病回春（巻之五・頭痛）／太平恵民和剤局方（巻之二・傷寒 附 中暑）", "別名": "", "本文": {"条文": "### 『万病回春』巻之五・頭痛\n\n**書き下し**（読み：社員案）\n\n偏正頭痛する者は、風気上攻するなり。\n\n川芎茶調散。諸風上攻し、頭目昏沉し、偏正頭痛し、鼻塞がり声重く、傷風壮熱し、肢体酸疼し、肌肉蠕動し、膈熱し痰盛んに、婦人の血気攻疰し、太陽穴痛むを治す。倶に是れ外より風気に感ずるもの、並びに効あり。\n\n**原文**（翻刻確認）\n\n偏正頭痛者、風氣上攻也。\n\n川芎茶調散　治諸風上攻、頭目昏沉、偏正頭痛、鼻塞聲重、傷風壯熱、肢體酸疼、肌肉蠕動、膈熱痰盛、婦人血氣攻疰、太陽穴痛、俱是外感風氣、並效。\n\n**現代語訳**（訳：社員案）\n\n頭の片側または全体が痛むのは、風気が上に攻め上がるためである。\n\n川芎茶調散は、諸々の風邪が上に攻め上がって、頭や目がぼんやりと重く、頭の片側または全体が痛み、鼻が詰まって声が重く、風にあたって高く発熱し、手足や体がだるく痛み、筋肉がぴくぴく動き、膈に熱があって痰が多く、婦人では血気が攻め上がって、こめかみ（太陽穴）が痛むものを治す。いずれも外から風気に感じたもので、どれにも効く。\n\n### 『太平恵民和剤局方』巻之二・傷寒 附 中暑\n\n**書き下し**（読み：社員案）\n\n丈夫・婦人の諸風上攻し、頭目昏重し、偏正頭疼し、鼻塞がり声重く、傷風壮熱し、肢体煩疼し、肌肉蠕動し、膈熱し痰盛んに、婦人の血風攻注し、太陽穴疼むを治す。但だ是れ風気に感ずれば、悉く皆之を治す。\n\n**原文**（翻刻確認）\n\n治丈夫婦人諸風上攻、頭目昏重、偏正頭疼、鼻塞聲重、傷風壯熱、肢體煩疼、肌肉蠕動、膈熱痰盛、婦人血風攻注、太陽穴疼。但是感風氣、悉皆治之。\n\n**現代語訳**（訳：社員案）\n\n男性・女性の、諸々の風邪が上に攻め上がって、頭や目がくらんで重く、頭の片側または全体が痛み、鼻が詰まって声が重く、風にあたって高く発熱し、手足や体がわずらわしく痛み、筋肉がぴくぴく動き、膈に熱があって痰が多く、婦人では血風が攻め上がって、こめかみ（太陽穴）が痛むものを治す。およそ風気に感じたものであれば、すべてこれを治す。\n\n### 注記\n- 条文の順：現行エキス剤（香附子入り・細辛なし）と構成が一致する『万病回春』を先にした。『和剤局方』は本文にした四庫全書本の翻刻が細辛入りで、現行エキス剤と合わない（香附子入りの版もある。出典の欄を参照）\n- 『万病回春』の翻刻は簡体字の本で、原文は繁体字にそろえて書いた（诸→諸、头→頭、声→聲、并→並 など）。字形の判断には使えない（要原本照合）。方の前の「偏正頭痛者、風氣上攻也」の句は、頭痛の門で本方を指す見出しの句なので条文に含めた（翻刻確認）\n- 局方の「攻注」は、資料の書き下しでは「攻疰」と書かれる（要原本照合）。本文は翻刻（四庫全書本・別の翻刻本とも「攻注」）の字を採った。『万病回春』の翻刻は「攻疰」\n- 局方の原文と構成は四庫全書本の翻刻による。別の翻刻本（ctext 由来）では条文の行が途中で欠けている", "出典": "### 原典の構成\n- 『万病回春』：川芎・荊芥穂 各2両、薄荷・香附 各4両、羌活・白芷・甘草（炙）各1両、防風7銭半 の8味（翻刻確認）\n- 『和剤局方』：白芷・甘草（爁）・羌活 各1両、荊芥（梗を去る）・川芎 各4両、細辛（蘆を去る）1両、防風 1両半、薄荷葉（火を見せず）8両 の8味（翻刻確認。四庫全書本。「各1両」が白芷・甘草・羌活の3味にかかる読みは要確認）\n- 局方の別の翻刻本（ctext 由来）では、細辛の代わりに香附子（炒）8両が入り、「別本は細辛…に作る」の注が付く。行が途中で欠けていて全体は読めない（要原本照合）\n\n### 原典の服用法\n- 『万病回春』：細末とし、1回2銭を食後に茶清で調下する。生姜・葱の煎じ湯で服してもよい（翻刻確認）\n- 『和剤局方』：細末とし、1回2銭を食後に茶清で調えて服す。常に服すれば頭目を清す（翻刻確認）\n\n### 処方の変遷\n- 『和剤局方』巻之一・諸風 附 脚気にも方名だけが載り、「方は傷寒類を見よ」と注される（翻刻確認。別の翻刻本で「（方見傷寒類）」）\n- 本方は『和剤局方』の呉直閣増諸家名方に属する（翻刻確認。別の翻刻本で方名の前に「〔吴直阁增諸家名方〕」）。呉直閣増諸家名方は1131〜1162年の増補とされる（要確認）\n- 『和剤局方』の版によって、細辛を配するものと香附子を配するものがある（四庫全書本は細辛、別の翻刻本は香附子。翻刻確認）\n- 『万病回春』の川芎茶調散は細辛がなく香附子を配する（翻刻確認）。同じ条の方後に、一方に菊花・細辛・僵蚕・蝉退を加えたものを菊花茶調散とする（翻刻確認）\n- 現行エキス剤（ツムラ124）は7.5g中、香附子4.0g、川芎3.0g、羌活・荊芥・薄荷・白芷・防風 各2.0g、甘草・茶葉 各1.5g の9味で、細辛は入らない（PMDA 添付文書 2023年12月改訂 第1版で確認）。資料によれば、茶清で調下する代わりに細茶（茶葉）を薬味として配合している（要確認）", "構成": "香附子・川芎・羌活・荊芥・薄荷・白芷・防風・甘草・茶葉", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "桂枝茯苓丸加薏苡仁", "名前": "桂枝茯苓丸加薏苡仁", "読み": "けいしぶくりょうがんかよくいにん", "ツムラ番号": "125", "出典": "叢桂亭医事小言（巻之七・叢桂亭蔵方・甲字湯の方後）", "別名": "", "本文": {"条文": "### 『叢桂亭医事小言』巻之七・叢桂亭蔵方・甲字湯（方後）\n\n**書き下し**（要原本照合）\n\n**原文**（要原本照合）\n\n**現代語訳**\n\n### 注記\n- 『叢桂亭医事小言』の原文の翻刻は、維基文庫の検索（2026-10-22）では見当たらなかった。資料には書き下しだけがある（要原本照合）\n- 甲字湯は瘀血を治める方とされ、その方後に諸病への加減が並ぶ。その中の、腸癰には薏苡仁を加え、膿がすでにできた者にはさらに大黄を加えるという加減が本方にあたる（要原本照合。資料の論考⑧による）", "出典": "### 原典の構成\n- 『叢桂亭医事小言』：甲字湯に薏苡仁を加える。甲字湯は桂枝茯苓丸に甘草・生姜を加えたもの（要原本照合。資料の論考⑧による。各生薬の分量は資料に記載がない）\n\n### 原典の服用法\n\n### 処方の変遷\n- 資料の出典欄は『金匱要略』『叢桂亭医事小言』の2書を挙げる。桂枝茯苓丸加薏苡仁にあたる方が出るのは『叢桂亭医事小言』で、原南陽の家蔵方の甲字湯の方後に腸癰の加減として載る（要原本照合）\n- 桂枝茯苓丸の出典は『金匱要略』婦人妊娠病脈証并治第二十（翻刻確認）\n- 原典の甲字湯には甘草・生姜が入るとされる（要原本照合。資料の論考⑧による）。現行エキス剤には甘草・生姜は入らない（PMDA 添付文書で確認）\n- 『叢桂亭医事小言』巻之四上・腸癰に、甲字湯に大黄・薏苡仁を加えて与えた症例が載る（要原本照合）\n- 『臨床漢方医典』盲腸炎には甲字湯加薏苡仁が「甲字湯」の名で載る（要原本照合）\n- 厚生労働省医薬食品局の公定の処方名は「桂枝茯苓丸料加薏苡仁」（要確認。資料の論考①による。KEGG DRUG D06950 の名称も桂枝茯苓丸料加薏苡仁）\n- 現行エキス剤（ツムラ125）は 薏苡仁・桃仁・桂皮・茯苓・芍薬・牡丹皮 の6味で、桂枝茯苓丸の5味に薏苡仁を加えたもの（PMDA 添付文書 2023年12月改訂で確認）", "構成": "薏苡仁・桃仁・桂皮・茯苓・芍薬・牡丹皮", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "麻子仁丸", "名前": "麻子仁丸", "読み": "ましにんがん", "ツムラ番号": "126", "出典": "傷寒論（弁陽明病脈証并治第八）、金匱要略（五臓風寒積聚病脈証并治第十一）", "別名": "", "本文": {"条文": "### 『傷寒論』弁陽明病脈証并治第八\n\n**書き下し**（読み：社員案）\n趺陽の脈浮にして渋、浮なれば則ち胃気強く、渋なれば則ち小便数なり。浮渋相搏てば、大便則ち鞕く、其の脾約を為す。麻子仁丸之を主る。\n\n**原文**（翻刻確認）\n趺陽脈浮而澀、浮則胃氣強、澀則小便數、浮澀相搏、大便則鞕、其脾為約、麻子仁丸主之。\n\n**現代語訳**（訳：社員案）\n趺陽の脈が浮で渋のとき、浮は胃気が強いことを、渋は小便の回数が多いことを表す。浮と渋が互いにせめぎ合うと、大便が硬くなり、その脾は約（脾約）となる。麻子仁丸がこれを主治する。\n\n### 『金匱要略』五臓風寒積聚病脈証并治第十一\n\n**書き下し**（読み：社員案）\n趺陽の脈浮にして渋、浮なれば則ち胃気強く、渋なれば則ち小便数なり。浮渋相搏てば、大便則ち堅く、其の脾約を為す。麻子仁丸之を主る。\n\n**原文**（翻刻確認）\n趺陽脈浮而澀、浮則胃氣強、澀則小便數、浮澀相搏、大便則堅、其脾為約、麻子仁丸主之。\n\n**現代語訳**（訳：社員案）\n趺陽の脈が浮で渋のとき、浮は胃気が強いことを、渋は小便の回数が多いことを表す。浮と渋が互いにせめぎ合うと、大便が堅くなり、その脾は約（脾約）となる。麻子仁丸がこれを主治する。\n\n### 注記\n- 『傷寒論』の条は「大便則鞕」、『金匱要略』の条は「大便則堅」（どちらも翻刻確認）。資料も、『金匱要略』では「鞕」を「堅」の字に作るとする\n- 『金匱要略』での方名は、資料では「麻子人丸」とされる（要原本照合）。維基文庫の『金匱要略』の翻刻では「麻子仁丸」\n- 「澀」は、資料の書き下しでは「濇」と書かれる（要原本照合）。書き下しは新字体の「渋」にした\n- 維基文庫の『金匱要略』の翻刻には、この条の後に麻子仁丸の方（構成・服用法）の行がない\n- 篇名は、維基文庫の翻刻では「辨陽明病脈證並治第八」「五臟風寒積聚病脈證並治第十一」", "出典": "### 原典の構成\n- 『傷寒論』：麻子仁2升、芍薬半斤、枳実半斤（炙る）、大黄1斤（皮を去る）、厚朴1尺（炙る、皮を去る）、杏仁1升（皮尖を去り、熬り、別に脂と作す）（翻刻確認）\n- 『金匱要略』：翻刻に方の行がない（要原本照合）\n\n### 原典の服用法\n- 『傷寒論』：6味を蜜で和して梧桐子大の丸とし、10丸を飲服する。1日3回服し、次第に量を増やし、効き目が現れる（知る）のを限度とする（翻刻確認）\n\n### 処方の変遷\n- 本方は小承気湯（大黄・厚朴・枳実）を含む。小承気湯は『傷寒論』で大黄4両（酒洗）・厚朴2両（炙、皮を去る）・枳実3枚（大者、炙）（翻刻確認）\n- 『和剤局方』巻之六・瀉痢 附 秘渋には脾約麻仁円として載り、服用法は大便が通じるのを限度とし、通じなければ再服するとされる（要原本照合）\n- 『傷寒活人書』巻第十八の脾約丸は、枳実の代わりに枳殻を用いた大黄・厚朴・枳殻・白芍薬・麻子仁・杏仁の方とされる（要原本照合）\n- 『衛生宝鑑』巻十七・名方類集・大便門には脾約麻仁丸、『医方考』巻之二・秘結門第十三には潤腸丸、『祖剤』巻二には仲景麻仁丸（一名脾約丸、一名潤腸丸）の方名で載るとされる（要原本照合）\n- 本方を加減して潤腸湯が成立したとされる（要原本照合）\n- 現行エキス剤（ツムラ126）は 麻子仁5.0・大黄4.0・枳実2.0・杏仁2.0・厚朴2.0・芍薬2.0g の6味で、原典と同じ構成（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "麻子仁・大黄・枳実・杏仁・厚朴・芍薬", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "麻黄附子細辛湯", "名前": "麻黄附子細辛湯", "読み": "まおうぶしさいしんとう", "ツムラ番号": "127", "出典": "傷寒論（弁少陰病脈証并治第十一）", "別名": "", "本文": {"条文": "### 『傷寒論』弁少陰病脈証并治第十一\n\n**書き下し**（読み：社員案）\n少陰病、始めて之を得て、反って発熱し、脈沈なる者は、麻黄細辛附子湯之を主る。\n\n**原文**（翻刻確認）\n少陰病、始得之、反發熱、脈沉者、麻黃細辛附子湯主之。\n\n**現代語訳**（訳：社員案）\n少陰病にかかったばかりで、（本来は熱がないはずなのに）かえって発熱し、脈が沈である者は、麻黄細辛附子湯がこれを主治する。\n\n### 関連条文（少陰病の提綱）\n\n『傷寒論』弁少陰病脈証并治第十一。少陰病の大綱として資料が挙げる条。\n\n**書き下し**（読み：社員案）\n少陰の病為る、脈微細にして、但だ寐ねんと欲するなり。\n\n**原文**（翻刻確認）\n少陰之為病、脈微細、但欲寐也。\n\n**現代語訳**（訳：社員案）\n少陰病というものは、脈が微かで細く、ただ眠っていたがる（横になっていたがる）ものである。\n\n### 注記\n- 宋本の翻刻の方名は「麻黃細辛附子湯」。『金匱玉函経』の翻刻では条文・方とも「麻黃附子細辛湯」で、条文の字は宋本と同じ（句読のみ異なる）（翻刻確認）\n- 『金匱玉函経』の方では、麻黄に「去節」がなく、服用法に「日三服」がない（翻刻確認）。生薬の順が麻黄・附子・細辛で、附子の注が「一枚，去皮，破作八片，炮」、煮方が「內諸藥煮」と書かれる（要原本照合）。本文は宋本の字を採った\n- 沉／沈は字体の違いで、書き下しは「沈」とした", "出典": "### 原典の構成\n- 『傷寒論』：麻黄2両（節を去る）、細辛2両、附子1枚（炮じ、皮を去り、8片に破る）（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』：3味を水1斗で、まず麻黄を煮て2升を減じ、上の沫を去り、諸薬を入れて煮て3升を取り、滓を去り、1升を温服する。日に3回服す（翻刻確認）\n\n### 処方の変遷\n- 宋本『傷寒論』の方名は麻黄細辛附子湯、『金匱玉函経』では麻黄附子細辛湯（翻刻確認）。資料によれば、韓祇和撰『傷寒微旨論』巻下・温中篇が麻黄附子細辛湯の名で載せて以後、この名で呼ばれることが多いという（要原本照合）\n- 『三因極一病証方論』巻之四・傷寒証治は附子細辛湯の名で載せ、少陰の傷寒で口中和して背に悪寒し、反って発熱・倦怠し、自汗して渇し、脈が尺寸ともに沈にして緊の者を治すとする（要原本照合）\n- 『魏氏家蔵方』巻第一・頭風頭痛の附子細辛湯は、細辛・川芎・附子・麻黄を粗末とし、姜水で煎服する。『三因方』の方名を継ぐが薬味が増えている（要原本照合）\n- 『素問病機気宜保命集』巻中・解利傷寒論第十三は、肝・心・脾・肺・腎の脈証ごとに本方に加える薬（肝経は羌活・防風、心経は黄芩・石膏、脾経は白朮・防已、肺経は生姜・桂、腎経は附子・生姜、各3銭）を載せる（要原本照合）\n- 『医学心悟』巻二・諸方補遺の麻黄附子細辛湯は、麻黄・附子・細辛・生姜を水煎する（本方に生姜を加えたもの）（要原本照合）\n- 現行エキス剤（ツムラ127）は 麻黄4.0・細辛3.0・ブシ末1.0g（7.5g中。PMDA 添付文書 2023年12月改訂 第1版で確認）。原典の附子（炮）がブシ末になっている", "構成": "麻黄・細辛・附子（ブシ末）", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "啓脾湯", "名前": "啓脾湯", "読み": "けいひとう", "ツムラ番号": "128", "出典": "聖済総録／内経拾遺方論（巻之一・二陽病第六）／古今医鑑（巻之十三・傷食）／万病回春（巻之七・泄瀉）", "別名": "", "本文": {"条文": "### 『内経拾遺方論』巻之一・二陽病第六 主肺脾\n\n**書き下し**（要原本照合）\n\n**原文**（要原本照合）\n\n**現代語訳**\n\n### 『古今医鑑』巻之十三・傷食\n\n**書き下し**（読み：社員案）\n啓脾丸　食を消し、泄を止め、吐を止め、疳を消し、黄を消し、脹を消し、腹痛を定め、元気を益し、脾胃を健やかにす。\n\n**原文**（翻刻確認）\n啓脾丸　消食、止泄、止吐、消疳、消黄、消脹、定腹痛、益元気、健脾胃。\n\n**現代語訳**（訳：社員案）\n啓脾丸は、食べたものを消化させ、下痢を止め、嘔吐を止め、疳を消し、黄を消し、腹の張りを消し、腹痛を鎮め、元気を益し、脾胃を丈夫にする。\n\n### 『万病回春』巻之七・小児科・泄瀉\n\n**書き下し**（読み：社員案）\n啓脾丸　食を消し瀉を止め、吐を止め疳を消し、黄を消し脹を消し、腹痛を定め、脾を益し胃を健やかにす。\n\n**原文**（翻刻確認）\n啓脾丸　消食止瀉、止吐消疳、消黄消脹、定腹痛、益脾健胃。\n\n**現代語訳**（訳：社員案）\n啓脾丸は、食べたものを消化させて下痢を止め、嘔吐を止めて疳を消し、黄を消して腹の張りを消し、腹痛を鎮め、脾を益して胃を丈夫にする。\n\n### 注記\n- 『内経拾遺方論』の原文の翻刻は、維基文庫の検索（2026-10-22）では見当たらなかった。資料には啓脾丸の条の書き下しと薬味・用法の要約だけがあり、分量の記載はない（要原本照合）\n- 『内経拾遺方論』の啓脾丸の条には、出所として『経験良方』（資料の引用では《経験良法》）が記される（要原本照合）\n- 『古今医鑑』は「止泄」「益元気、健脾胃」、『万病回春』は「止瀉」「益脾健胃」と書く（翻刻確認）\n- 『万病回春』の維基文庫の本は簡体字で、『古今医鑑』の維基文庫の本は「繁体化」の表示がある。どちらも字形の判断には使えない。本文は新字体にした\n- 『古今医鑑』は龔信の撰、『万病回春』は龔廷賢（明）の著（翻刻確認）", "出典": "### 原典の構成\n- 『内経拾遺方論』：人参・白朮・白茯（苓）・乾山薬・蓮肉・山楂・甘草・陳皮・沢瀉（要原本照合。資料の論考⑥による。各生薬の分量は資料に記載がない）\n- 『古今医鑑』：人参1両、白朮（去芦）1両、山楂（去核取肉、炙）5銭、陳皮（炙）5銭、沢瀉（炙）5銭、甘草（炙）5銭、白茯苓（去皮）1両、乾山薬1両、蓮肉（去心皮）1両（翻刻確認）\n- 『万病回春』：人参・白朮（去芦、炒）・白茯苓・山薬（炒）・蓮肉（去心） 各1両、山楂肉・陳皮・沢瀉・甘草（炙） 各5銭（翻刻確認）\n\n### 原典の服用法\n- 『内経拾遺方論』：細末とし、荷葉を煮た湯で炊いた飯で丸とする（要原本照合。資料の論考⑥による）\n- 『古今医鑑』：細末とし、煉蜜で緑豆大の丸とする。1回30〜40丸を空腹時に米湯で服す。餅にして米飲で研いて溶かして服してもよい。小児が常に食傷の諸疾を患うときに服すとたちまち治る（翻刻確認）\n- 『万病回春』：末とし、煉蜜で梧桐子大の丸とする。1回20〜30丸を空腹時に米湯で服す。米湯で研いて服してもよい。小児が常に傷食を患うときに服すとたちまち治る（翻刻確認）\n- 『万病回春』の「或米湯研下服亦可」の「研下」は、資料の書き下しでは「研化」と書かれる（要原本照合）。『古今医鑑』は「以米飲研化服」（翻刻確認）\n\n### 処方の変遷\n- 資料は、本方を四君子湯に山薬・蓮肉・山楂子・陳皮・沢瀉を加えた処方とする。四君子湯の出典は資料に記載がない（要確認）\n- 資料の出典欄は『聖済総録』『内経拾遺方論』の2書を挙げる。論考（本の294〜300頁）には『聖済総録』の啓脾丸についての記載がない（要確認）\n- 原典はいずれも啓脾丸（丸剤）として載る（翻刻確認。『内経拾遺方論』は要原本照合）\n- 資料は、本方の出典は従来『万病回春』巻之七・泄瀉とされてきたが、『古今医鑑』巻之十三・傷食に同じ条文と薬味があり、その薬味の後に『万病回春』の方後の文とほぼ同じ指示があるとする（翻刻で両書の条を確認）\n- 資料は、『医学入門』巻六・雑病用薬賦・泄瀉の啓脾丸を、人参・白朮・茯苓・山薬・蓮肉 各1両、陳皮・沢瀉・山査・甘草 各5銭を末とし、蜜で弾子大の丸とし、1丸を空腹時に米飲で溶かして服す方とし、『医学入門』の刊年は『古今医鑑』の刊年（1577）の2年前とする（要原本照合）\n- 資料は、張時徹『摂生衆妙方』巻之十・小児門の小児啓脾丸に、『古今医鑑』『医学入門』と同じ薬味が載り、『古今医鑑』はこの書から引いたものとする（要原本照合）\n- 資料は、『扶寿精方』小児門の啓脾丸も同じ薬味で、米湯で溶かして服すとし、同書は嘉靖九年（1530）初刊で『摂生衆妙方』より20年早いとする（要原本照合）\n- 資料は、駱竜吉『内経拾遺方論』巻之一・二陽病第六 主肺脾に啓脾丸があり、点校説明によれば巻之一は駱氏の原著にあたるので、従来の『万病回春』から308年、『摂生衆妙方』から271年さかのぼるとする（要原本照合）\n- 資料は、『済世全書』巻之二・坎集・泄瀉に同じ方が参朮健脾丸の名で載るとし、『万病回春』巻之三・泄瀉の参朮健脾丸は処方内容が異なるとする（要原本照合）\n- 資料は、王璆『是斎百一選方』巻之二・第三門の啓脾元（人参・白朮・青皮・神麹・麦糵・陳皮・厚朴・縮砂仁・乾姜・甘草）を、『内経拾遺方論』の方とは同名異方とする（要原本照合）\n- 現行エキス剤（ツムラ128）は 蒼朮・茯苓 各4.0g、山薬・人参・蓮肉 各3.0g、山査子・沢瀉・陳皮 各2.0g、甘草1.0g の9味で、原典の白朮の代わりに蒼朮が入り、生姜・大棗は入らない（PMDA 添付文書 2023年12月改訂で確認）", "構成": "蒼朮・茯苓・山薬・人参・蓮肉・山査子・沢瀉・陳皮・甘草", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "大承気湯", "名前": "大承気湯", "読み": "だいじょうきとう", "ツムラ番号": "133", "出典": "傷寒論（弁陽明病脈証并治第八・弁少陰病脈証并治第十一）、金匱要略（腹満寒疝宿食病脈証并治第十）", "別名": "", "本文": {"条文": "### 『傷寒論』弁陽明病脈証并治第八\n\n**書き下し**（読み：社員案）\n陽明病、脈遅、汗出づと雖も悪寒せざる者は、其の身必ず重く、短気し、腹満して喘す。潮熱有る者は、此れ外解せんと欲す、裏を攻むべきなり。手足濈然として汗出づる者は、此れ大便已に鞕きなり、大承気湯之を主る。若し汗多く、微しく発熱悪寒する者は、外未だ解せざるなり。其の熱潮せざれば、未だ承気湯を与うべからず。若し腹大いに満ちて通ぜざる者は、小承気湯を与えて、微しく胃気を和すべし。大いに泄下を致さしむること勿かれ。\n\n陽明病、譫語し、潮熱有り、反って食すること能わざる者は、胃中に必ず燥屎五六枚有るなり。若し能く食する者は、但だ鞕きのみ。宜しく大承気湯にて之を下すべし。\n\n二陽の併病、太陽の証罷み、但だ潮熱を発し、手足漐漐として汗出で、大便難くして譫語する者は、之を下せば則ち愈ゆ。大承気湯に宜し。\n\n傷寒六七日、目中了了たらず、睛和せず、表裏の証無く、大便難く、身微熱する者は、此れ実と為すなり。急ぎ之を下せ。大承気湯に宜し。\n\n汗を発して解せず、腹満痛する者は、急ぎ之を下せ。大承気湯に宜し。\n\n**原文**（翻刻確認）\n陽明病、脈遲、雖汗出不惡寒者、其身必重、短氣、腹滿而喘、有潮熱者、此外欲解、可攻裏也。手足濈然汗出者、此大便已鞕也、大承氣湯主之。若汗多、微發熱惡寒者、外未解也、其熱不潮、未可與承氣湯。若腹大滿不通者、可與小承氣湯、微和胃氣、勿令致大泄下。\n\n陽明病、譫語、有潮熱、反不能食者、胃中必有燥屎五六枚也。若能食者、但鞕耳。宜大承氣湯下之。\n\n二陽并病、太陽證罷、但發潮熱、手足漐漐汗出、大便難而譫語者、下之則愈、宜大承氣湯。\n\n傷寒六七日、目中不了了、睛不和、無表裏證、大便難、身微熱者、此為實也。急下之、宜大承氣湯。\n\n發汗不解、腹滿痛者、急下之、宜大承氣湯。\n\n**現代語訳**（訳：社員案）\n陽明病で、脈が遅く、汗が出ていても悪寒しない者は、体が必ず重く、息切れし、腹が張って喘ぐ。潮熱（決まった時刻に高まる熱）がある者は、外（表）の邪は解けかかっているので、裏を攻めてよい。手足からじっとりと汗が出る者は、大便がすでに硬くなっている。大承気湯がこれを主治する。もし汗が多く、わずかに発熱して悪寒する者は、外がまだ解けていない。熱が潮熱でなければ、まだ承気湯を与えてはならない。もし腹がひどく張って通じない者は、小承気湯を与えて胃気を少し和らげるのがよい。激しく下痢させてはならない。\n\n陽明病で、うわごとを言い、潮熱があり、かえって食べられない者は、胃の中に必ず乾いた便が五、六個ある。もし食べられる者は、便が硬いだけである。大承気湯でこれを下すのがよい。\n\n二陽の併病で、太陽の証がなくなり、ただ潮熱が出て、手足からじっとりと汗が出て、大便が出にくくうわごとを言う者は、これを下せば治る。大承気湯がよい。\n\n傷寒にかかって六、七日、目がはっきり見えず、眼球の動きが調わず、表証も裏証もなく、大便が出にくく、体に微熱がある者は、実である。急いでこれを下せ。大承気湯がよい。\n\n発汗させても解けず、腹が張って痛む者は、急いでこれを下せ。大承気湯がよい。\n\n### 『傷寒論』弁少陰病脈証并治第十一\n\n**書き下し**（読み：社員案）\n少陰病、之を得て二三日、口燥き咽乾く者は、急ぎ之を下せ。大承気湯に宜し。\n\n少陰病、六七日、腹脹り、大便せざる者は、急ぎ之を下せ。大承気湯に宜し。\n\n**原文**（翻刻確認）\n少陰病、得之二三日、口燥、咽乾者、急下之、宜大承氣湯。\n\n少陰病、六七日、腹脹、不大便者、急下之、宜大承氣湯。\n\n**現代語訳**（訳：社員案）\n少陰病にかかって二、三日で、口が乾き喉が乾く者は、急いでこれを下せ。大承気湯がよい。\n\n少陰病で六、七日たち、腹が張って大便が出ない者は、急いでこれを下せ。大承気湯がよい。\n\n### 『金匱要略』腹満寒疝宿食病脈証并治第十\n\n**書き下し**（読み：社員案）\n腹満減ぜず、減ずるも言うに足らざるは、当に須く之を下すべし。大承気湯に宜し。\n\n脈数にして滑なる者は、実なり。此れ宿食有り。之を下せば愈ゆ。大承気湯に宜し。\n\n下利して食を欲せざる者は、宿食有るなり。当に之を下すべし。大承気湯に宜し。\n\n**原文**（翻刻確認）\n腹滿不減、減不足言、當須下之、宜大承氣湯。\n\n脈數而滑者、實也、此有宿食、下之愈、宜大承氣湯。\n\n下利不欲食者、有宿食也、當下之、宜大承氣湯。\n\n**現代語訳**（訳：社員案）\n腹の張りが減らない、あるいは減っても言うほどではないときは、必ずこれを下すべきである。大承気湯がよい。\n\n脈が数で滑の者は、実である。宿食（胃腸に停滞した飲食物）がある。これを下せば治る。大承気湯がよい。\n\n下痢して食べたがらない者は、宿食がある。これを下すべきである。大承気湯がよい。\n\n### 注記\n- 資料は、本方が『傷寒論』『金匱要略』の四十箇所ばかりに載り、このほか『傷寒論』の少陰病篇・発汗後病篇・不可下病篇・可下病篇・発汗吐下後病篇、『金匱要略』の痙湿暍病篇・嘔吐噦下利病篇・婦人産後病篇にも載るとする。ここには資料が条文を挙げる条だけを置いた\n- 『金匱要略』の下利の条は、資料では「下利して飲食せざる者」（下利不飲食）とされる（要原本照合）。本文は翻刻の「不欲食」を採った。宋本『傷寒論』の可下病篇の同じ趣旨の条も「下利、不欲食者」（翻刻確認）\n- 『金匱要略』の腹満の条は「當須下之」、宋本『傷寒論』陽明病篇の同じ条は「當下之」で「須」がない（翻刻確認）\n- 二陽の併病の条の「并」は「併」と同じ字。書き下しは「併」にした\n- 篇名は、維基文庫の翻刻では「辨陽明病脈證並治第八」「辨少陰病脈證並治第十一」「腹滿寒疝宿食病脈證並治第十」", "出典": "### 原典の構成\n- 『傷寒論』：大黄4両（酒洗）、厚朴半斤（炙、皮を去る）、枳実5枚（炙）、芒硝3合（翻刻確認）\n- 『金匱要略』：大黄4両（酒洗）、厚朴半斤（炙、皮を去る）、枳実5枚、芒硝3合（翻刻確認。痙湿暍病脈証并治第二の大承気湯方による）\n\n### 原典の服用法\n- 『傷寒論』：4味を水1斗で、先に2物を煮て5升を取り、滓を去る。大黄を入れてさらに煮て2升を取り、滓を去る。芒硝を入れ、さらに微火にかけて1、2回沸かし、2回に分けて温服する。下れば残りは服さない（翻刻確認）\n- 『金匱要略』：4味を水1斗で、先に枳実・厚朴を煮て5升を取り、滓を去る。大黄を入れて煮て2升を取り、滓を去る。芒硝を入れ、さらに微火にかけて1、2回沸かし、2回に分けて温服する。下れば服用を止める（翻刻確認）\n\n### 処方の変遷\n- 本方は配合量を除けば小承気湯に芒硝を加えた方とされる。小承気湯は『傷寒論』で大黄4両（酒洗）・厚朴2両（炙、皮を去る）・枳実3枚（大者、炙）（翻刻確認）。資料は、配合量では本方は小承気湯よりも厚朴三物湯に芒硝3合を加えたものに近いとする（要原本照合）\n- 『太平聖恵方』巻第八・傷寒三陰三陽応用湯散諸方に、大承気湯方として川大黄・厚朴・枳実・川芒消を散とし水煎服する方が載るとされる。同書巻第十三・治傷寒大便不通諸方には、傷寒が解けず煩熱・口乾し腹中に結燥があって通じないものに、川大黄・枳実・川芒消・甘草・厚朴の大黄散方が載るとされる（要原本照合）\n- 『黄帝素問宣明論方』巻之六・傷寒門の三一承気湯（三乙承気湯）は、大黄・芒硝・厚朴・枳実・甘草を姜煎する方とされる。三一承気湯は劉完素の方として知られるが、資料は『太平聖恵方』にすでに見えるとする（要原本照合）\n- 『理傷続断方』医治整理補接次第口訣には、本方が小承気湯の方名で載るとされる。同書の大成湯（一名大承気湯）は通導散のこととされる（要原本照合）\n- 『扶寿精方』傷寒では、大承気湯として4味を姜煎する方が載り、速く下したいときは大黄・芒硝を残しておき、ほかの薬が煮えてから2味を入れて5〜7沸させるとされる（要原本照合）\n- 『摂生衆妙方』巻之七・大小便不通門には、大便不通方として大黄・皮硝・厚朴・枳実の大承気湯が載るとされる（要原本照合）\n- 『証治準縄』巻四十一・傷寒・太陽病・解表雑方には、大承気湯証・調胃承気湯証・小承気湯証をあわせて治す三一承気湯として、大黄・芒硝・厚朴・枳実・甘草を㕮咀して生姜で煎服する方が載るとされる（要原本照合）\n- 現行エキス剤（ツムラ133）は 厚朴5.0・枳実3.0・大黄2.0・無水芒硝1.3g の4味で、原典と同じ構成（PMDA 添付文書 2023年12月改訂 第1版で確認）。原典の芒硝は、添付文書では無水芒硝（無水ボウショウ）", "構成": "厚朴・枳実・大黄・無水芒硝", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "桂枝加芍薬大黄湯", "名前": "桂枝加芍薬大黄湯", "読み": "けいしかしゃくやくだいおうとう", "ツムラ番号": "134", "出典": "傷寒論（巻第六・弁太陰病脈証并治第十）", "別名": "桂枝加大黄湯", "本文": {"条文": "### 『傷寒論』巻第六・弁太陰病脈証并治第十\n\n**書き下し**（読み：社員案）\n本太陽病、医反って之を下し、爾るに因りて腹満し時に痛む者は、太陰に属するなり。桂枝加芍薬湯之を主る。大いに実痛する者は、桂枝加大黄湯之を主る。\n\n**原文**（翻刻確認）\n本太陽病，醫反下之，因爾腹滿時痛者，屬太陰也，桂枝加芍藥湯主之；大實痛者，桂枝加大黃湯主之。\n\n**現代語訳**（訳：社員案）\nもとは太陽病であったのに、医師がかえって下したため、腹が張って時に痛むものは、太陰に属する。桂枝加芍薬湯が主治する。ひどく実して痛むものは、桂枝加大黄湯が主治する。\n\n### 関連条文（続く条）\n\n**書き下し**（読み：社員案）\n太陰の病為る、脈弱く、其の人続いて自ら便利す。設し当に大黄・芍薬を行るべき者は、宜しく之を減ずべし。其の人胃気弱く、動じ易きを以ての故なり。\n\n**原文**（翻刻確認）\n太陰為病，脈弱，其人續自便利，設當行大黃、芍藥者，宜減之，以其人胃氣弱，易動故也。\n\n**現代語訳**（訳：社員案）\n太陰の病で、脈が弱く、その人がひき続き自然に下痢しているとき、もし大黄・芍薬を用いるべき場合でも、量を減らすのがよい。その人は胃気が弱く、動揺しやすいからである。\n\n### 注記\n- 本方は条の後半（大いに実痛する者）に当たる。条の前半は桂枝加芍薬湯の条で、同じ条にまとめて書かれている（翻刻確認）\n- 原典の方名は桂枝加大黄湯（翻刻確認）\n- 『金匱玉函経』巻第四・弁太陰病形証治第七の翻刻では、同じ条が「太陽病，醫反下之，因爾腹滿時痛者，屬太陰也，桂枝加芍藥湯主之。大實痛者，桂枝加大黃湯主之。」で、冒頭の「本」がない（翻刻確認）\n- 『金匱玉函経』巻第六・弁発汗吐下後病形証治第十九の翻刻では「太陽病，醫反下之，因腹滿時痛，為屬太陰，屬桂枝加芍藥湯證，其大實痛，屬桂枝加大黃湯證。」と書かれ、「爾」がなく「為屬太陰」となる（要原本照合）\n- 関連条文は、『金匱玉函経』巻第四の翻刻では「以」がなく「其人胃氣弱易動故也」とし、条の後に小字で「下利，先煎芍藥三沸。」の注がある（翻刻確認）", "出典": "### 原典の構成\n- 『傷寒論』（宋本）巻第六：桂枝3両（去皮）、大黄2両、芍薬6両、甘草2両（炙）、生姜3両（切）、大棗12枚（擘）（翻刻確認）\n- 『金匱玉函経』巻第七・方薬炮製（桂枝加大黄湯方第十三）：桂枝3両、芍薬6両、生姜3両、甘草2両（炙）、大棗12枚、大黄3両（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』（宋本）：6味を水7升で煮て3升を取り、滓を去って1升を温服し、1日3回服す（翻刻確認）\n- 『金匱玉函経』：6味を㕮咀し、水7升で煮て3升を取り、滓を去って1升を温服する（翻刻確認）\n\n### 処方の変遷\n- 桂枝加芍薬湯（桂枝湯の芍薬を倍にしたもの）に大黄を加えた構成（翻刻確認）\n- 大黄の量は、宋本巻第六では2両、宋本巻第十・弁発汗吐下後脈証并治第二十二の再掲では1両、『金匱玉函経』では3両と、書と巻で異なる。本文は現行エキス剤の比（芍薬6：大黄2）と一致する巻第六の2両を採った（巻第十の1両は要原本照合）\n- 原典の方名は桂枝加大黄湯で、『類聚方』では桂枝加芍薬大黄湯の名で載る（要原本照合）\n- 『傷寒活人書』巻第十二の桂枝加大黄湯は、桂枝6分・芍薬3両・甘草1両・大黄2両で、大実痛には大黄を1両半加え、羸者には減ずるとする（要原本照合）\n- 『景岳全書』巻之五十六・散陣の桂枝加大黄湯は、桂枝湯に大黄1両を加えたもので、芍薬を倍にしていない（要原本照合）\n- 現行エキス剤（ツムラ134）は 芍薬・桂皮・大棗・甘草・大黄・生姜 の6味で、1日量7.5g中 シャクヤク6.0・ケイヒ4.0・タイソウ4.0・カンゾウ2.0・ダイオウ2.0・ショウキョウ1.0（g）の混合生薬の乾燥エキスを含む（PMDA 添付文書 2023年12月改訂 第1版で確認）。原典の「桂枝」は、添付文書では「ケイヒ」と書かれる", "構成": "芍薬・桂皮・大棗・甘草・大黄・生姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "清暑益気湯", "名前": "清暑益気湯", "読み": "せいしょえっきとう", "ツムラ番号": "136", "出典": "医学六要（治法彙四巻・暑門・暑風卒倒）", "別名": "", "本文": {"条文": "### 『医学六要』治法彙四巻・暑門・暑風卒倒（張三錫）\n\n**書き下し**（要原本照合）\n\n**原文**（要原本照合）\n\n**現代語訳**\n\n### 注記\n- 『医学六要』の原文の翻刻は、維基文庫の検索（2026-10-22、「醫學六要」）では見当たらなかった。資料には書き下しだけがあり、原文（漢文）の引用はない（要原本照合）\n- 『医学六要』では本方は「近製清暑益気湯」の名で載り、『内外傷弁惑論』の方は「古方清暑益気湯」と呼ばれる（要原本照合。資料の論考①②による）", "出典": "### 原典の構成\n- 『医学六要』（近製清暑益気湯）：人参・白朮・麦門冬・五味子・陳皮・甘草・黄柏・黄耆・当帰身。分量は資料に記載がない（要原本照合）\n\n### 原典の服用法\n- 『医学六要』：人に随って生姜・大棗を加減して煎じる（要原本照合）\n\n### 処方の変遷\n- 同名で構成の違う方：『内外傷弁惑論』（李杲〈東垣〉）巻中・暑傷胃気論の清暑益気湯。長夏の湿熱に感じて、四肢困倦・精神短少・胸満気促・肢節の疼痛・喘・身熱して煩・心下膨痞・小便黄少・大便溏頻・痢・自汗体重などを呈するものに、清燥の剤として用いる（翻刻確認）。構成は黄耆・蒼朮 各1銭5分、升麻1銭、人参・白朮・橘皮・神麹・沢瀉 各5分、甘草・黄柏・当帰身・麦門冬・青皮・葛根 各3分、五味子9個の15味で、㕮咀して1服とし水2盞で煎じて1盞とし、熱服する（翻刻確認）。方後に汗の多い者・脚膝の痿弱する者・大便の渋る者の加減がある（翻刻確認）。黄耆の注（「洗五分」／「減五分」）、「熱服」／「稍熱服」、大便の加減の薬味は翻刻の本で違う（要原本照合）\n- 資料は『内外傷弁惑論』の所在を「巻之一・暑傷胃気論」とする。維基文庫の翻刻（上・中・下の3巻）では巻中（要原本照合）\n- 『内外傷弁惑論』の同じ論の後段で、人参・麦門冬・五味子の3味を生脈散と名づける（翻刻確認）\n- 『医学六要』（張三錫）治法彙四巻・暑門・暑風卒倒は、『内外傷弁惑論』の方を「古方清暑益気湯」と呼び、長夏の湿熱に感じて病む者のための方で二朮・沢瀉・黄柏で滲湿清熱するとしたうえで、夏月は生脈散に黄耆・朮・陳皮・黄柏を加えて補うのがよいとし、9味の「近製清暑益気湯」を載せる（要原本照合）\n- 同書の同じ記載の二丁後には「東垣清暑益気湯」として『内外傷弁惑論』の方も載る（要原本照合）\n- 近製清暑益気湯は、東垣の方から蒼朮・升麻・神麹・沢瀉・葛根・青皮を除いた構成になる（要原本照合。近製方の構成は資料の書き下しによる）\n- 『明医雑著』暑証の解暑補気湯（黄耆・人参・甘草・五味子・麦門冬・陳皮・白朮。生姜・大棗で煎服）は、近製清暑益気湯から黄柏・当帰を除いた構成。資料は、年代的には解暑補気湯に黄柏・当帰を加えて近製清暑益気湯になったとする（要原本照合）\n- 現行エキス剤（ツムラ136）は 蒼朮・人参・麦門冬・黄耆・陳皮・当帰・黄柏・甘草・五味子 の9味で、近製清暑益気湯の白朮が蒼朮になっている（PMDA 添付文書 2023年12月改訂 第1版で確認）。添付文書に出典の欄はない", "構成": "蒼朮・人参・麦門冬・黄耆・陳皮・当帰・黄柏・甘草・五味子", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "加味帰脾湯", "名前": "加味帰脾湯", "読み": "かみきひとう", "ツムラ番号": "137", "出典": "薛氏医案（内科摘要・巻上・各症方薬）", "別名": "", "本文": {"条文": "### 『内科摘要』巻上・各症方薬（薛己）\n\n**書き下し**（読み：社員案）\n加味帰脾湯　即ち前方に柴胡・山梔を加う。\n\n**原文**（翻刻確認）\n加味歸脾湯　即前方加柴胡、山梔。\n\n**現代語訳**（訳：社員案）\n加味帰脾湯は、前の方（帰脾湯）に柴胡・山梔子を加えたものである。\n\n### 注記\n- 「前方」は、同じ巻上・各症方薬で直前に載る帰脾湯（翻刻確認）\n- 維基文庫の『内科摘要』は簡体字の本で、原文は社員が繁体字に直した。字形は要原本照合", "出典": "### 原典の構成\n- 『内科摘要』巻上・各症方薬：前方（帰脾湯：人参・白朮・白茯苓・黄耆・竜眼肉・酸棗仁 各2銭、遠志1銭、木香・甘草（炙） 各5分、当帰1銭）に柴胡・山梔を加える。加味薬の分量の記載はない（翻刻確認）\n\n### 原典の服用法\n- 『内科摘要』：加味帰脾湯の条に服用法の記載はない。前方（帰脾湯）は、生姜・大棗を入れ、水で煎じて服す（翻刻確認）\n\n### 処方の変遷\n- 加味帰脾湯は、帰脾湯に諸薬を加えた方（要原本照合）\n- 資料の出典欄には『聖済総録』『厳氏済生方』『玉機微義』『薛氏医案』が並ぶ。帰脾湯そのものの出典は、帰脾湯の側に載せる（要確認）\n- 『薛氏医案』には3通りの加味帰脾湯がある。柴胡・山梔子を加えるもの（『内科摘要』『女科撮要』『正体類要』『婦人良方』『銭氏小児直訣』）、柴胡・牡丹皮・山梔子を加えるもの（『口歯類要』）、牡丹皮・山梔子を加えるもの（『明医雑著』『保嬰撮要』）。このうち『銭氏小児直訣』と『保嬰撮要』は茯苓でなく茯神を用いる（要原本照合）\n- 『口歯類要』附方并注の加味帰脾湯は、前方（帰脾湯）に柴胡・丹皮・山梔を加え、思慮が脾火を動かし、元気が損傷し、体がだるく、発熱し、食欲がなく、失血し、歯が痛むなどの症を治す（分量の記載は資料にない）（要原本照合）\n- 『明医雑著』附方（王綸撰・薛己訂）の加味帰脾湯は、前方（帰脾湯）に牡丹皮・山梔 各1銭を加え、脾経の血虚・発熱などの症を治す（要原本照合）\n- 『保嬰撮要』巻三・天釣内釣の加味帰脾湯は、加味薬が牡丹皮・山梔子で、茯苓ではなく茯神を用いる。乳母が憂思して脾を傷ったための血虚・発熱などの症は子の病のもとになるとして、母子ともに服させる（分量の記載は資料にない）（要原本照合）\n- 一部の書は本方の出典を『済世全書』とするが、『薛氏医案』の諸書にすでに収載されている（要確認）\n- 『古今医鑑』巻之十一・婦人科虚労の「加味帰脾湯」は、薬味が帰脾湯と同じで加味薬がない（要原本照合）\n- 『医宗必読』巻之八・心腹諸痛の「加味帰脾湯」は、帰脾湯に煨姜・菖蒲・桂心を加えたもので、柴胡・山梔を加える者もあると注される（要原本照合）\n- 現行エキス剤（ツムラ137）は 黄耆・柴胡・酸棗仁・蒼朮・人参・茯苓・竜眼肉・遠志・山梔子・大棗・当帰・甘草・生姜・木香 の14味で、柴胡・山梔子を加える系統。牡丹皮は入らず、朮は蒼朮（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "黄耆・柴胡・酸棗仁・蒼朮・人参・茯苓・竜眼肉・遠志・山梔子・大棗・当帰・甘草・生姜・木香", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "桔梗湯", "名前": "桔梗湯", "読み": "ききょうとう", "ツムラ番号": "138", "出典": "傷寒論（弁少陰病脈証并治第十一）／金匱要略（肺痿肺癰咳嗽上気病脈証并治第七）／外台秘要方（巻一・千金翼方の引用、巻十・肺癰方・集験方の引用）", "別名": "", "本文": {"条文": "### 『傷寒論』弁少陰病脈証并治第十一\n\n**書き下し**（読み：社員案）\n少陰病、二三日、咽痛む者は、甘草湯を与うべし。差えざる者は、桔梗湯を与う。\n\n**原文**（翻刻確認）\n少陰病、二三日、咽痛者、可与甘草湯。不差者、与桔梗湯。\n\n**現代語訳**（訳：社員案）\n少陰病で二、三日たち、咽が痛むものには、甘草湯を与えてよい。治らないものには、桔梗湯を与える。\n\n### 『金匱要略』肺痿肺癰咳嗽上気病脈証并治第七\n\n**書き下し**（読み：社員案）\n咳して胸満し、振寒して脈数、咽乾きて渇せず、時に濁唾腥臭を出だし、久久にして膿を吐くこと米粥の如き者は、肺癰と為す。桔梗湯之を主る。\n\n**原文**（翻刻確認）\n咳而胸満、振寒脈数、咽乾不渇、時出濁唾腥臭、久久吐膿如米粥者、為肺癰、桔梗湯主之。\n\n**現代語訳**（訳：社員案）\n咳をして胸が張って苦しく、寒気がして震え、脈は速く、咽は乾くが渇きはなく、ときどき濁った生臭い痰を出し、長く続いて米の粥のような膿を吐くものは、肺癰である。桔梗湯がこれを主治する。\n\n### 『外台秘要方』巻一・千金翼方（『千金翼方』の引用）\n\n**書き下し**（読み：社員案）\n又、少陰病、二三日、咽痛む者は、甘草湯を与うべし、差えざれば、桔梗湯を与うべきを療する方。\n\n**原文**（翻刻確認）\n又療少陰病二三日咽痛者、可与甘草湯、不差、可与桔梗湯方。\n\n**現代語訳**（訳：社員案）\nまた、少陰病で二、三日たち、咽が痛むものには甘草湯を与えてよく、治らなければ桔梗湯を与えてよい、それを治療する方。\n\n### 『外台秘要方』巻十・肺癰方（『集験方』の引用）\n\n**書き下し**（読み：社員案）\n集験、胸中満ちて振寒し、脈数、咽燥きて渇せず、時時濁唾腥臭を出だし、久久にして膿を吐くこと粳米粥の如きは、是れ肺癰と為すを療する桔梗湯方。\n\n**原文**（翻刻確認）\n集験療胸中満而振寒脈数、咽燥而不渇、時時出濁唾腥臭、久久吐膿如粳米粥、是為肺癰、桔梗湯方。\n\n**現代語訳**（訳：社員案）\n『集験方』の、胸の中が張って寒気で震え、脈が速く、咽は乾くが渇きはなく、ときどき濁った生臭い痰を出し、長く続いて粳米の粥のような膿を吐くもの、これは肺癰であるが、それを治療する桔梗湯の方。\n\n### 注記\n- 『傷寒論』の条は、維基文庫の宋本の翻刻で確かめた（翻刻確認）。翻刻の字は「與」で、本文は新字体にした。翻刻の条番号は三一一。甘草湯の条と同じ条\n- 『金匱要略』の条は、維基文庫の「金匱要略」の翻刻で確かめた（翻刻確認）。翻刻の字は「咳而胸滿，振寒脈數，咽乾不渴」などで、本文は新字体にした\n- 四部叢刊本『金匱要略方論』（明・兪橋刊本）の翻刻では、この条が「欬而胸滿振脉寒數…桔便湯主之」となっている。「振脉寒數」（振寒脈数）と「桔便湯」（桔梗湯）は異同として残す（要原本照合）。欬／咳は字体の差\n- 四部叢刊本の翻刻では、方名の下に小字で「亦治血痺」（亦た血痺を治す）とある（翻刻確認）。維基文庫の「金匱要略」の翻刻には、桔梗湯方の構成・服用法そのものが載っていない\n- 『外台秘要方』の2条は、維基文庫の四庫全書本の翻刻で確かめた（翻刻確認）。翻刻の字は「少隂」「與」「胷」「脉」「數」「渇」「乆乆」「集驗」「滿」で、本文は新字体にした\n- 『外台秘要方』巻十の集験の方の後ろには、小字で「張文仲・千金・備急・古今録験・范汪もこれに同じ。本は仲景傷寒論の方。第四巻に出る」という意味の注がある（翻刻確認）\n- 条文の順は、資料の出典欄の順（『傷寒論』が先）に仮に置き、『外台秘要方』の引く2方をその後ろに置いた。添付文書に出典の欄がなく、4条とも構成が同じため、基準では決められない（要確認）", "出典": "### 原典の構成\n- 『傷寒論』：桔梗1両、甘草2両（炙の指示なし）（翻刻確認）\n- 『金匱要略』：桔梗1両、甘草2両（炙の指示なし）（翻刻確認。四部叢刊本）\n- 『外台秘要方』巻一（千金翼方の引用）：大桔梗1両、甘草（炙）3両（翻刻確認）\n- 『外台秘要方』巻十（集験方の引用）：桔梗2両（小字注に、千金・古今方は1両を用いるとある）、甘草（炙）2両（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』：2味を水3升で煮て1升を取り、滓を去り、2回に分けて温服する（翻刻確認）\n- 『金匱要略』：2味を水3升で煮て1升を取り、2回に分けて温服する（翻刻確認。四部叢刊本）。続けて、服すと膿血を吐くとある（要原本照合。翻刻は「則吐膿血色」で末字が通らない）\n- 『外台秘要方』巻一：2味を切り、水3升で煮て1升を取り、2回に分けて服す。膿血を吐けば差える。猪肉・海藻・菘菜を忌む（翻刻確認）\n- 『外台秘要方』巻十：2味を切り、水3升で煮て1升を取り、朝と暮の2回に分けて服す。膿血を吐けば差える（翻刻確認）\n\n### 処方の変遷\n- 甘草湯に桔梗を加えた方。『傷寒論』では、甘草湯で治らない咽痛に与える方として甘草湯の条に続いて載る（翻刻確認）\n- 『外台秘要方』巻一は『千金翼方』を、巻十は『集験方』を引いて、同名・同構成の桔梗湯方を載せる（条文の欄。翻刻確認）。資料は、『千金翼方』巻第十・傷寒下・少陰病状第二の桔梗湯方には炙の字がないとする（要原本照合）\n- 『外台秘要方』巻十には、『古今録験』の同名の桔梗湯方（桔梗・白朮・当帰・地黄・甘草・敗醤・薏苡仁・桑白皮）もある。構成が違う（要原本照合）\n- 『太平聖恵方』巻第八では甘草桔梗湯の名で甘草（炙）1両・桔梗1両、巻第十では桔梗散の名で桔梗1両・甘草（生用）2両・苦参半両とする（要原本照合）\n- 『和剤局方』巻之七・咽喉口歯の如聖湯は桔梗湯にあたり、甘草は炒とされる（要原本照合）\n- 『鶏峰普済方』巻第十一では国老湯の名で載る（要原本照合）\n- 医療用エキス剤は、ツムラ桔梗湯エキス顆粒（医療用）（ツムラ番号138。1日量7.5g中、日局カンゾウ3.0g・日局キキョウ2.0g。PMDA 添付文書 2023年12月改訂 第1版で確認）。添付文書に出典の欄はない。原典の桔梗1両・甘草2両とは比が異なる", "構成": "甘草・桔梗", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "黄芩湯", "名前": "黄芩湯", "読み": "おうごんとう", "ツムラ番号": "", "出典": "傷寒論（弁太陽病脈証并治下第七）", "別名": "", "本文": {"条文": "### 『傷寒論』弁太陽病脈証并治下第七\n\n**書き下し**（読み：社員案）\n太陽と少陽との合病、自下利する者は、黄芩湯を与う。若し嘔する者は、黄芩加半夏生姜湯之を主る。\n\n**原文**（翻刻確認）\n太陽與少陽合病、自下利者、與黃芩湯。若嘔者、黃芩加半夏生薑湯主之。\n\n**現代語訳**（訳：社員案）\n太陽と少陽の合病で、自然に下痢するものには黄芩湯を与える。もし嘔吐するものは、黄芩加半夏生姜湯がこれを主治する。\n\n### 関連条文（誤治の例）\n\n『傷寒論』弁厥陰病脈証并治第十二。黄芩湯で解熱させてはいけない例として資料が挙げる条。\n\n**書き下し**（読み：社員案）\n傷寒、脈遅なること六七日、而るに反って黄芩湯を与えて其の熱を徹す。脈遅は寒と為す。今黄芩湯を与えて復た其の熱を除けば、腹中応に冷ゆべく、当に食すること能わざるべし。今反って能く食す。此れを除中と名づく。必ず死す。\n\n**原文**（翻刻確認）\n傷寒脈遲、六七日、而反與黃芩湯徹其熱。脈遲為寒、今與黃芩湯復除其熱、腹中應冷、當不能食。今反能食、此名除中、必死。\n\n**現代語訳**（訳：社員案）\n傷寒で脈が遅のまま六、七日たっているのに、かえって黄芩湯を与えてその熱を取り去った。脈遅は寒である。いま黄芩湯を与えてさらにその熱を除けば、腹中は冷えるはずで、食べられなくなるはずである。ところがかえって食べられる。これを除中といい、必ず死ぬ。\n\n### 注記\n- 太陽少陽合病の条は、宋本の翻刻・『注解傷寒論』の四庫全書本（書名『傷寒論注釋』）巻四・『金匱玉函経』で字が同じ（翻刻確認。黄／黃の字形の差のみ）\n- 大棗の枚数は、維基文庫の宋本の翻刻では「二十枚」と書かれる。同じ条の黄芩加半夏生姜湯（宋本）、『注解傷寒論』の四庫全書本、『金匱玉函経』ではいずれも「十二枚」で、原典の構成は12枚とした（要原本照合）\n- 除中の条は、『金匱玉函経』では「今與黃芩湯」が「而與黃芩湯」、「此名除中」が「此為除中」と書かれる（要原本照合）。本文は宋本の字を採った", "出典": "### 原典の構成\n- 『傷寒論』：黄芩3両、芍薬2両、甘草2両（炙）、大棗12枚（擘）（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』：4味を水1斗で煮て3升を取り、滓を去り、1升を温服する。日に2回、夜に1回服す（翻刻確認）\n\n### 処方の変遷\n- 芍薬甘草湯（芍薬・甘草）に黄芩・大棗を加えた構成。主薬は黄芩\n- 『太平聖恵方』（王懐隠等）巻第八・傷寒三陰三陽応用湯散諸方の黄芩湯方は黄芩・赤芍薬・甘草の3味で大棗を含まず、散として煎服する（要原本照合）\n- 『小児衛生総微論方』（撰者不詳）巻第七・傷寒論の黄芩湯も黄芩・赤芍薬・甘草の3味を㕮咀して煎服し、傷寒の口舌の諸病（舌黄・舌黒・舌腫・舌裂・芒刺・舌上出血）と鼻衄に用いる（要原本照合）\n- 『扶寿精方』（呉旻）傷寒では、4味はそのままで黄芩芍薬湯と名を変え、姜を入れて煎じる（要原本照合）\n- 曲直瀬道三口授『師語録』巻下一の芍薬黄芩湯は黄芩・芍薬・茯苓・甘草で、黄芩湯から大棗を去り茯苓を加えた方（要原本照合）\n- 『金匱要略』に載る黄芩湯は『外台秘要方』の黄芩湯で、本方とは別方（六物黄芩湯とも呼ばれる）（要原本照合）\n- 医療用エキス剤は見当たらない（KEGG MEDICUS の医療用医薬品で該当0件、2026-10-21。PMDA 添付文書は未確認）。資料の組成は黄芩4・芍薬3・甘草3・大棗4（単位の記載なし。要確認）", "構成": "黄芩・芍薬・甘草・大棗（要確認）", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "葛根加朮附湯", "名前": "葛根加朮附湯", "読み": "かっこんかじゅつぶとう", "ツムラ番号": "", "出典": "方機（葛根湯の条）", "別名": "", "本文": {"条文": "### 『方機』葛根湯の条\n\n**書き下し**（要原本照合）\n\n**原文**（要原本照合）\n\n**現代語訳**\n\n### 注記\n- 『方機』の葛根湯の条は「朮」とだけ書き、蒼朮か白朮かを書かない（要原本照合。資料の論考②による）\n- 『方機』の条は、葛根湯の方の中に朮・附子を加えるとし、「加朮附湯」の名で腫脹・疼痛・頑腫悪腫・丹毒の類などに挙げ、紫円の兼用を添える（要原本照合。資料の引用は途中を省いている）", "出典": "### 原典の構成\n- 『方機』：葛根湯の方の中に朮・附子 各4分を加える（要原本照合）\n\n### 原典の服用法\n\n### 処方の変遷\n- 葛根湯に朮・附子を加えた加味方。葛根湯の出典は『傷寒論』巻第三・弁太陽病脈証并治中第六と『金匱要略』痙湿暍病脈証并治第二で、葛根湯の条文は葛根湯の項に載せる\n- 資料の出典欄は『傷寒論』『金匱要略』『方機』の3書を挙げる。葛根加朮附湯の名が出るのは『方機』の葛根湯の条（要原本照合）\n- 『方機』の著者・成立年は資料に記載がない（要確認）\n- 『類聚方広義』（上）の葛根湯の頭注にも、本方に朮附を加えて葛根加朮附湯と名づけるとある（要原本照合）\n- 構成は、桂枝加朮附湯（桂皮・芍薬・甘草・生姜・大棗・蒼朮・附子）に葛根・麻黄を加えたものと同じになる\n- 医療用エキス剤はツムラにはなく、三和生薬の「三和葛根加朮附湯エキス細粒」がある（KEGG MEDICUS と PMDA で 2026-10-22 確認）\n- 三和葛根加朮附湯エキス細粒は 葛根・麻黄・桂皮・甘草・芍薬・大棗・生姜・蒼朮・加工ブシ の9味で、朮は蒼朮、附子は加工ブシ（PMDA 添付文書 2025年10月改訂 第2版で確認）", "構成": "葛根・麻黄・桂皮・甘草・芍薬・大棗・生姜・蒼朮・附子（加工ブシ）", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "甘草湯", "名前": "甘草湯", "読み": "かんぞうとう", "ツムラ番号": "", "出典": "傷寒論（弁少陰病脈証并治第十一）／金匱要略（肺痿肺癰咳嗽上気病脈証并治第七・附方、千金方の引用）／備急千金要方（第十七・肺臓方・肺痿第六）／外台秘要方（巻十・肺痿方、千金方の引用）", "別名": "", "本文": {"条文": "### 『傷寒論』弁少陰病脈証并治第十一\n\n**書き下し**（読み：社員案）\n少陰病、二三日、咽痛む者は、甘草湯を与うべし。差えざる者は、桔梗湯を与う。\n\n**原文**（翻刻確認）\n少陰病、二三日、咽痛者、可與甘草湯。不差者、與桔梗湯。\n\n**現代語訳**（訳：社員案）\n少陰病で二、三日たち、咽が痛むものには、甘草湯を与えてよい。治らないものには、桔梗湯を与える。\n\n### 『金匱要略』肺痿肺癰咳嗽上気病脈証并治第七・附方\n\n**書き下し**（読み：社員案）\n『千金』甘草湯。\n\n**原文**（翻刻確認）\n《千金》甘草湯。\n\n**現代語訳**（訳：社員案）\n『千金方』の甘草湯。\n\n### 『備急千金要方』第十七・肺臓方・肺痿第六（孫思邈）\n\n**書き下し**（読み：社員案）\n甘草湯　肺痿、涎唾多く、出血し、心中温温液液たるを治する方。\n\n**原文**（翻刻確認）\n甘草湯　治肺痿、涎唾多、出血、心中溫溫液液方。\n\n**現代語訳**（訳：社員案）\n甘草湯は、肺痿で、よだれや唾が多く、出血し、心中が温温液液とするものを治す方。\n\n### 『外台秘要方』巻十・肺痿方（王燾。千金方の引用）\n\n**書き下し**（読み：社員案）\n千金、肺痿、涎唾多く出で、心中温温液液たるを療する甘草湯方。\n\n**原文**（翻刻確認）\n千金療肺痿、涎唾多出、心中温温液液、甘草湯方。\n\n**現代語訳**（訳：社員案）\n『千金方』の、肺痿で、よだれや唾が多く出て、心中が温温液液とするものを治療する甘草湯の方。\n\n### 注記\n- 『傷寒論』の条は、維基文庫の宋本の翻刻で確かめた（翻刻確認。與／与の字体の差のみ）。翻刻の条番号は三一一\n- 『金匱要略』の千金甘草湯は、維基文庫の翻刻では方名の後に主治の文がなく、すぐに構成・服用法が続く（翻刻確認）。主治の文がある本があるかは確かめていない（要原本照合）\n- 『金匱要略』の篇名は、資料では「肺痿肺癰欬嗽上気病脉証治第七」、翻刻では「肺痿肺癰咳嗽上氣病脈證並治第七」と書かれる。本文は翻刻の篇名を新字体にして採った（要原本照合）\n- 条文の順：4書とも甘草1味で構成が同じため、前からの順（『傷寒論』『金匱要略』）の後に、『備急千金要方』『外台秘要方』を置いた（要確認）\n- 『備急千金要方』の条の後には小字の注「《翼方》名溫液湯」（『千金翼方』では温液湯と名づける）がある（翻刻確認）。翻刻は維基文庫の『備急千金要方』（繁体字の本）\n- 『外台秘要方』の条には『備急千金要方』の「出血」の語がない（翻刻確認）。翻刻は維基文庫の四庫全書本で、句読点は社員が付けた\n- 「温温液液」は語のまま残し、訳さなかった（要確認）", "出典": "### 原典の構成\n- 『傷寒論』：甘草2両（炙の指示なし）（翻刻確認）\n- 『金匱要略』（千金甘草湯）：甘草（分量の記載なし）（翻刻確認）\n- 『備急千金要方』：甘草2両（㕮咀）（翻刻確認）\n- 『外台秘要方』：甘草2両（炙）（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』：1味を水3升で煮て1升半を取り、滓を去り、7合を温服する。日に2回服す（翻刻確認）\n- 『金匱要略』（千金甘草湯）：1味を水3升で煮て半分に減らし、3回に分けて温服する（翻刻確認）\n- 『備急千金要方』：水3升で煮て1升半を取り、滓を去り、3回に分けて服す（翻刻確認）\n- 『外台秘要方』：1味を刻み、水3升で煮て1升半を取り、3回に分けて温服する。海藻・菘菜を忌む。范汪も同じとする（翻刻確認）\n\n### 処方の変遷\n- 甘草1味の方。『傷寒論』の甘草湯方の甘草には「炙」の指示がない（翻刻確認）\n- 『千金翼方』（孫思邈）巻第十五・補益・補五蔵第四では温液湯の名で載り、甘草は3両。『千金方』では2両（要原本照合）\n- 『三因極一病証方論』（陳無択）巻之十三・肺痿証治にも温液湯の名で載り、甘草は炙と指示される（要原本照合）\n- 医療用エキス剤は、クラシエ甘草湯エキス細粒（1日量6.0g中、日局カンゾウ8.0g。PMDA 添付文書 2023年10月改訂 第1版で確認）。ツムラの医療用製剤は見当たらない（KEGG MEDICUS、2026-10-22）", "構成": "甘草", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "桔梗石膏", "名前": "桔梗石膏", "読み": "ききょうせっこう", "ツムラ番号": "", "出典": "一本堂医事説約（小児科・口瘡重舌）", "別名": "", "本文": {"条文": "### 『一本堂医事説約』小児科・口瘡重舌（香川修庵）\n\n**書き下し**（要原本照合）\n\n**原文**（要原本照合）\n\n**現代語訳**\n\n### 注記\n- 『一本堂医事説約』小児科・口瘡重舌の条は、小児の夜啼きと重舌を述べ、その後に方名のない「一方」として石膏・桔梗・甘草を挙げる（要原本照合。資料の書き下しによる）\n- 原文の翻刻は維基文庫に見当たらない（2026-10-22 検索。要原本照合）", "出典": "### 原典の構成\n- 『一本堂医事説約』：石膏・桔梗・甘草（分量は資料に記載なし）（要原本照合）\n\n### 原典の服用法\n\n### 処方の変遷\n- 原方は方名のない「一方」で、石膏・桔梗・甘草の3味。現行エキス剤の桔梗・石膏の2味とは甘草の有無が異なる（要原本照合）\n- 和田東郭『蕉窓方意解』巻之下・駆風解毒湯は、駆風解毒湯に石膏（大）・桔梗（中）を加えて纏喉風（咽喉の腫痛）に用いたとする（要原本照合）\n- 『勿誤薬室方函口訣』巻之上・駆風解毒湯は、葛根湯加桔石、駆風解毒湯加桔石の用法を挙げ、後者を東郭の工夫として引く（要原本照合）\n- 以後、葛根湯・小柴胡湯・駆風解毒湯・黄連解毒湯・当帰芍薬散などに加える加味方として用いられた例が多い（要確認。資料の論考による）\n- 医療用エキス剤はツムラにはなく、小太郎漢方製薬の「コタロー桔梗石膏エキス細粒」がある（識別コード N324。1日量6.0g中、日局キキョウ3.0g・日局セッコウ10.0g。PMDA 添付文書 2023年1月改訂 第1版で確認）。添付文書に出典の欄はない\n- ツムラには加味方の「ツムラ小柴胡湯加桔梗石膏エキス顆粒（医療用）」がある（KEGG MEDICUS で 2026-10-22 確認）", "構成": "桔梗・石膏", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "芎帰調血飲", "名前": "芎帰調血飲", "読み": "きゅうきちょうけついん", "ツムラ番号": "", "出典": "古今医鑑（巻之十二・産後）／万病回春（巻之六・産後）", "別名": "", "本文": {"条文": "### 『古今医鑑』巻之十二・産後\n\n**書き下し**（読み：社員案）\n芎帰調血飲（西園公の方）　産後の一切の諸病、気血虚損し、脾胃怯弱し、或いは悪露行らず、或いは血を去ること過多、或いは飲食節を失い、或いは怒気相冲き、以て発熱悪寒、自汗口乾、心煩喘急、心腹疼痛、脇肋脹満、頭暈眼花、耳鳴、口噤して語らず、昏憒等の証を致すを治す。\n\n**原文**（翻刻確認）\n芎歸調血飲（西園公方）　治產後一切諸病、氣血虛損、脾胃怯弱、或惡露不行、或去血過多、或飲食失節、或怒氣相冲、以致發熱惡寒、自汗口乾、心煩喘急、心腹疼痛、脅肋脹滿、頭暈眼花、耳鳴、口噤不語、昏憒等證。\n\n**現代語訳**（訳：社員案）\n芎帰調血飲（西園公の方）。産後のあらゆる病で、気血が虚して損なわれ、脾胃が弱く、あるいは悪露が下りず、あるいは出血が多すぎ、あるいは飲食の節度を失い、あるいは怒りの気が突き上げて、そのために発熱・悪寒、自汗・口の渇き、胸苦しさ・喘ぎ、胸腹部の痛み、脇の張り、めまい・目のかすみ、耳鳴り、口を食いしばって話さない、意識がぼんやりする、などの症状を来すものを治す。\n\n### 『万病回春』巻之六・産後\n\n**書き下し**（読み：社員案）\n芎帰補血湯　産後の一切の諸病、気血虚損し、脾胃怯弱し、或いは悪露行らず、或いは血を去ること過多、或いは飲食節を失い、或いは怒気相冲き、以て発熱悪寒、自汗口乾、心煩喘急、心腹疼痛、脇肋脹満、頭暈眼花、耳鳴、口噤して語らず、昏憒等の症を致すを治す。\n\n**原文**（翻刻確認）\n芎歸補血湯　治產後一切諸病、氣血虛損、脾胃怯弱、或惡露不行、或去血過多、或飲食失節、或怒氣相冲、以致發熱惡寒、自汗口乾、心煩喘急、心腹疼痛、脅肋脹滿、頭暈眼花、耳鳴、口噤不語、昏憒等症。\n\n**現代語訳**（訳：社員案）\n芎帰補血湯。産後のあらゆる病で、気血が虚して損なわれ、脾胃が弱く、あるいは悪露が下りず、あるいは出血が多すぎ、あるいは飲食の節度を失い、あるいは怒りの気が突き上げて、そのために発熱・悪寒、自汗・口の渇き、胸苦しさ・喘ぎ、胸腹部の痛み、脇の張り、めまい・目のかすみ、耳鳴り、口を食いしばって話さない、意識がぼんやりする、などの症状を来すものを治す。\n\n### 注記\n- 『万病回春』の方名は、維基文庫の翻刻では「芎歸補血湯」（芎归补血汤）。資料は同じ箇所を「芎帰調血飲」とし、方名の傍註に「西園公伝」があるとするが、翻刻には傍註がない（要原本照合）\n- 二書の条文は、末尾の「等證」（『古今医鑑』）と「等症」（『万病回春』）のほかは同じ字（翻刻確認）\n- 『古今医鑑』の翻刻は簡体字から繁体字に直した本で、字形の判断には使えない。「相冲」は翻刻の字のまま置いた（衝の字の異同は要原本照合）\n- 『古今医鑑』は龔信（明）の撰、『万病回春』は龔廷賢（明）の著（翻刻確認）。方名の下の「西園公方」の西園は、『万病回春』の序に龔廷賢の父「西園君」、巻末の志行紀に「父西園公」として出る（翻刻確認）\n- 二書の順は、刊行の早い『古今医鑑』を先にした（要確認）", "出典": "### 原典の構成\n- 『古今医鑑』：当帰・川芎・白朮・白茯苓・熟地・陳皮・香附（童便炒）・烏薬・乾姜（炒黒）・益母草・甘草・牡丹皮。分量の記載なし（翻刻確認）\n- 『万病回春』：当帰・川芎・白朮（去芦）・白茯苓（去皮）・熟地黄・陳皮・烏薬・香附（童便炒）・乾姜（炒黒）・益母草・牡丹皮・甘草。分量の記載なし（翻刻確認）\n\n### 原典の服用法\n- 『古今医鑑』：刻んで、生姜・棗を入れて煎じて服す。悪露が下りなければ益母草・牡丹皮を倍にし、童便・黄酒を加えて同服する。出血が多すぎれば川芎・当帰・乾姜を倍にする。ほかに飲食停滞・気悩・口噤・両脇痛・小腹陣痛・有汗・口乾苦の加味がある。産後はすぐに童便と熱酒を合わせて随意に飲めば百病を生じない、とも記す（翻刻確認）\n- 『万病回春』：1剤に刻み、生姜1片・棗1枚を入れて水で煎じ温服する。病をみて後に記す加減を行う（翻刻確認）\n\n### 処方の変遷\n- 資料は出典に『理傷続断方』『聖済総録』『扶寿精方』『古今医鑑』（龔信方）を挙げる。前の3書は、本方に至る流れの表に挙げられた四物湯・順気湯（四君子湯）・滋陽百補丸の書（要原本照合）\n- 本方は従来『万病回春』巻之六・産後が出典とされてきたが、それより前の『古今医鑑』巻之十二・産後に同じ条文で載り、方名の下に「西園公方」とある（翻刻確認）。資料はこれを龔信の創方の根拠とする\n- 『扶寿精方』婦人門の滋陽百補丸は、香附子・益母草・当帰・川芎・赤茯苓・白朮・白芍薬・人参・甘草・生地黄を煉蜜丸とし、白湯か酒で下す。資料は、四物湯合四君子湯（八珍湯）加香附子・益母草にあたり、嘉靖版は『古今医鑑』初刊の43年前の書とする（要原本照合）\n- 龔廷賢『寿世保元』庚集七巻・産後の帰朮保産湯は、当帰・川芎・白芍・熟地黄・白朮・白茯苓・陳皮・香附米・乾姜・甘草を姜棗で水煎する。本方から烏薬・益母草・牡丹皮を去り白芍を加えた形（要原本照合）\n- 『済世全書』巻之六離集・産後の芎帰調血飲は、当帰身・川芎・白芍・懐生地黄・白朮・白茯苓・陳皮・香附・甘草を姜棗で水煎する。『古今医鑑』の本方から烏薬・乾姜・益母草・牡丹皮を去り白芍を加えた形。資料は、元々は龔廷賢『種杏仙方』巻之三・産後に方名なしで記載されていたとする（要原本照合。方を指すのか、方後の注記を指すのかは資料の文から決めにくい。要確認）\n- 『医便』巻四・済陰類の済陰百補丸は、滋陽百補丸に玄胡索・木香を加えた形（要原本照合）\n- 『万病回春』の加減のうち、3番目（産後悪露不尽、胸腹飽悶疼痛、或いは腹中に塊有り、悪寒発熱）は本方に桃仁・紅花・肉桂・牛膝・枳殻・木香・玄胡索・童便・姜汁少許を加え熟地黄を去り、5番目（産後悪露不尽、瘀血上冲、昏迷して醒めず、腹満硬痛）は桃仁・紅花・肉桂・玄胡索・牛膝・童便・姜汁少許を加える（翻刻確認）。『古今医鑑』の本方の加減にはこの2方はない（翻刻確認）\n- 一貫堂の芎帰調血飲第一加減は、本方から熟地黄を去り、芍薬・乾地黄・桃仁・紅花・肉桂・牛膝・枳殻・木香・延胡索を加えたもの。資料は『万病回春』の3番目の加減より乾地黄・芍薬が多いとする（要原本照合）\n- 医療用エキス剤はツムラにはなく、太虎精堂製薬の「太虎堂のきゅう帰調血飲エキス顆粒」がある。1日量6.0g中、当帰・川芎・地黄・白朮・茯苓・陳皮・香附子・牡丹皮・烏薬 各2.0g、大棗・益母草 各1.5g、生姜・甘草 各1.0g の13味。原典の乾姜はなく、煎じるときの生姜・大棗が入る（PMDA 添付文書 2024年2月改訂 第1版・2023年10月改訂 第1版で確認）。添付文書に出典の欄はない", "構成": "当帰・川芎・地黄・白朮・茯苓・陳皮・香附子・牡丹皮・大棗・生姜・甘草・烏薬・益母草", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "九味檳榔湯", "名前": "九味檳榔湯", "読み": "くみびんろうとう", "ツムラ番号": "", "出典": "勿誤薬室方函（巻上）", "別名": "", "本文": {"条文": "### 『勿誤薬室方函』巻上・九味檳榔湯\n\n**書き下し**（要原本照合）\n\n**原文**（要原本照合）\n\n**現代語訳**\n\n### 注記\n- 『勿誤薬室方函』巻上の九味檳榔湯は「家方」とされ、脚気で腫満・短気するもの、および心腹が痞積して気血が凝滞するものを治すとする（要原本照合。資料の書き下しによる）\n- 方後に、大黄を去って呉茱萸・茯苓を加える加減を記す（要原本照合。資料の書き下しによる）。資料は、エキス製剤の呉茱萸・茯苓の配合はこの方後の指示によるとされてきたとする\n- 『勿誤薬室方函』の原文の翻刻は維基文庫に見当たらない（2026-10-22 検索。要原本照合）", "出典": "### 原典の構成\n- 『勿誤薬室方函』巻上：檳榔・大黄・厚朴・桂枝・橘皮・木香・蘇葉・甘草・生姜（分量は資料に記載なし）（要原本照合）\n\n### 原典の服用法\n\n### 処方の変遷\n- 前身の方は『外台秘要方』巻七・腹内諸気及脹不下食方の檳榔湯。心頭が冷えて硬く結ぼれて痛むのを治し気を下す方で、檳榔10顆、生姜・青木香 各3両、橘皮・枳実（炙）・甘草（炙）・大黄 各2両の7味を水6升で煮て2升半を取り、3回に分けて温服し、軽い下痢を得るのを目安とする（翻刻確認）。資料は青木香を「木香」とする（要原本照合）\n- この檳榔湯に、山脇東洋が桂枝・紫蘇を加えて九味の方としたのが始まりとされる（要確認）。原南陽口授『復坐録』、『校正方輿輗』巻之十・脚気、今村了庵『脚気鉤要』巻上・併病がこの加味を伝える（要原本照合）\n- 『復坐録』『脚気鉤要』は元の方を「千金方」の七味檳榔湯とするため、本方の原方は『備急千金要方』出典と見なされてきた（要原本照合）\n- 山脇東洋『傷寒門温胆』は「檳榔湯　外台秘要」として檳榔・枳実・紫蘇・桂枝・陳皮・大黄・木香・甘草・生姜を、『方読弁解』中部中之一・心腹胸痛は外台の檳榔湯（7味）を載せる（要原本照合）\n- 山脇東門『東門先生方函』は東洋の方から甘草を去った8味とし、方名は九味檳榔湯のままとした（要原本照合）\n- 原南陽は東門の8味に厚朴を加えて再び9味とした（檳榔・橘皮・桂枝・木香・大黄・紫蘇・厚朴・枳実・生姜）。『復坐録』と『叢桂亭医事小言』巻之三・脚気に載り、『叢桂亭医事小言』は脚気で気血が凝滞するものを理すとする（要原本照合）\n- この南陽の方から枳実を去り甘草を加えた9味（檳榔・大黄・厚朴・桂枝・甘草・木香・陳皮・紫蘇・生姜）が今日の九味檳榔湯にあたる。『東洋方函南門先生蔵方』、『療治経験筆記』巻之八・巻之九の脚気腫満短気に載る（巻之八は寛政七年〈1795〉の記録とされる）（要原本照合）\n- 『勿誤薬室方函』巻上はこの9味を「家方」として載せ、従来はこれが本方の出典とされてきた。方後に、大黄を去って呉茱萸・茯苓を加える加減を記す（要原本照合）\n- 『橘窓書影』巻之一には、九味檳榔湯去将加呉茱萸茯苓と九味檳榔湯加呉茱萸茯苓の治験があり、大黄の有無の2通りで用いられた（要原本照合。「去将」を大黄を去るとするのは資料の読み）。呉茱萸・茯苓の加味は和田東郭『蕉窓方意解』巻之上・柴胡桂枝乾姜湯の加味にならったものとされる（要確認）\n- 医療用エキス剤はツムラにはなく、小太郎漢方製薬の「コタロー九味檳榔湯エキス細粒」がある（識別コード N311。1日量6.0g中、ビンロウジ4.0・コウボク3.0・ケイヒ3.0・キッピ3.0・ソヨウ1.5・カンゾウ1.0・ダイオウ1.0・ショウキョウ1.0・モッコウ1.0・ゴシュユ1.0・ブクリョウ3.0g。PMDA 添付文書 2023年1月改訂 第1版で確認）。9味に呉茱萸・茯苓を加えた11味で、大黄も含む。添付文書に出典の欄はない", "構成": "檳榔子・厚朴・桂皮・橘皮・蘇葉・甘草・大黄・生姜・木香・呉茱萸・茯苓", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "桂枝加黄耆湯", "名前": "桂枝加黄耆湯", "読み": "けいしかおうぎとう", "ツムラ番号": "", "出典": "金匱要略（水気病脈証并治第十四）／金匱要略（黄疸病脈証并治第十五）", "別名": "", "本文": {"条文": "### 『金匱要略』水気病脈証并治第十四（黄汗の条）\n\n**書き下し**（読み：社員案）\n黄汗の病、両脛自ずから冷ゆ。仮令発熱するは、此れ歴節に属す。食し已りて汗出で、又身常に暮に盗汗出づる者は、此れ労気なり。若し汗出で已りて反って発熱する者は、久久にして其の身必ず甲錯す。発熱止まざる者は、必ず悪瘡を生ず。若し身重く、汗出で已りて輒ち軽き者は、久久にして必ず身瞤し、瞤すれば即ち胸中痛む。又腰より以上必ず汗出で、下に汗無く、腰髖弛痛し、物の皮中に在る有るが如き状あり。劇しき者は食する能わず、身疼重し、煩躁し、小便不利す。此れを黄汗と為す。桂枝加黄耆湯之を主る。\n\n**原文**（翻刻確認）\n黃汗之病，兩脛自冷；假令發熱，此屬歷節。食已汗出，又身常暮盜汗出者，此勞氣也。若汗出已反發熱者，久久其身必甲錯；發熱不止者，必生惡瘡。若身重，汗出已輒輕者，久久必身瞤，瞤即胸中痛，又從腰以上必汗出，下無汗，腰髖弛痛，如有物在皮中狀，劇者不能食，身疼重，煩躁，小便不利，此為黃汗，桂枝加黃耆湯主之。\n\n**現代語訳**（訳：社員案）\n黄汗の病では、両すねが自然に冷える。もし発熱するなら、それは歴節に属する。食べ終わると汗が出て、また体にいつも夕暮れに寝汗が出るものは、労気である。もし汗が出終わってかえって発熱するものは、長引くとその体は必ず甲錯する（皮膚が荒れてざらつく）。発熱が止まないものは、必ず悪瘡（たちの悪いできもの）を生じる。もし体が重く、汗が出終わるとすぐに軽くなるものは、長引くと必ず体がぴくぴくと動き、動くとすぐに胸の中が痛む。また腰から上には必ず汗が出て、下には汗がなく、腰と股関節がゆるむように痛み、皮膚の中に何か物があるような様子で、ひどいものは食べられず、体が痛んで重く、煩躁し、小便の出が悪い。これを黄汗とする。桂枝加黄耆湯がこれを主治する。\n\n### 『金匱要略』黄疸病脈証并治第十五\n\n**書き下し**（読み：社員案）\n諸病の黄家は、但其の小便を利す。仮令脈浮なれば、当に汗を以て之を解すべし。宜しく桂枝加黄耆湯之を主るべし。（方は水気病中に見ゆ）\n\n**原文**（翻刻確認）\n諸病黃家，但利其小便；假令脈浮，當以汗解之，宜桂枝加黃耆湯主之。（方見水氣病中。）\n\n**現代語訳**（訳：社員案）\nもろもろの病で黄を発する者は、ただその小便を通じさせる。もし脈が浮であれば、汗によってこれを解すべきである。桂枝加黄耆湯でこれを主治するのがよい。（方は水気病の中に見える）\n\n### 注記\n- 黄汗の条は、四部叢刊本（明嘉靖俞橋刊本の影印）の翻刻では、「若汗出已反發熱者」「若身重」の「若」がなく、「下無汗」が「不無汗」、「必身瞤，瞤即胸中痛」が「必身瞤即胸中痛」、「此為黃汗」が「為黃汗」、「煩躁」が「煩燥」と書かれる（要原本照合）\n- 黄汗の条の「此勞氣也」は、『金匱要略心典』の引用では「此榮氣也」とされる（要原本照合。資料205頁による）\n- 黄疸病の条の小字注「方見水氣病中」は、四部叢刊本の翻刻では「方見水病中」と書かれる（要原本照合）\n- 「黃耆」の「耆」は、四部叢刊本の翻刻では「𦒿」の字形で書かれる（要原本照合）\n- 方（構成・服用法）は、通行本の翻刻（維基文庫『金匱要略』）には載っておらず、四部叢刊本の翻刻だけから取った。方後の「湏飲𤍠稀粥」の「湏」は、資料の書き下しでは「須臾に」と読まれる（要原本照合）", "出典": "### 原典の構成\n- 『金匱要略』水気病第十四（四部叢刊本）：桂枝・芍薬 各3両、甘草2両、生姜3両、大棗12枚、黄耆2両（翻刻確認）\n- 『金匱要略』黄疸病第十五：方は水気病の中に見えるとあり、同じ方を用いる（翻刻確認）\n\n### 原典の服用法\n- 6味を水8升で煮て3升を取り、1升を温服する。熱い稀粥1升余りを飲んで薬力を助け、温服して微汗を取る。汗が出なければさらに服す（翻刻確認。「湏」の読みは条文の注記を参照）\n\n### 処方の変遷\n- 桂枝・芍薬・甘草・生姜・大棗の分量は『傷寒論』（宋本）の桂枝湯方（桂枝3両・芍薬3両・甘草2両・生姜3両・大棗12枚）と同じで、これに黄耆2両を加えた形（翻刻確認）\n- 方後の熱い稀粥で薬力を助ける法は、宋本の桂枝湯方の方後と同じ趣旨。桂枝湯方の方後にある「温覆」の語は、桂枝加黄耆湯の方後にはない（翻刻確認）\n- 同じ『金匱要略』水気病脈証并治第十四の、本方の一つ前の黄耆芍薬桂枝苦酒湯の条も黄汗を述べる。資料は、こちらのほうが黄汗の解説としてより明らかとする（要原本照合）\n- 『金匱要略』血痺虚労病脈証并治第六の黄耆桂枝五物湯は、血痺を治す方で、資料は本方去甘草にあたるとする（要原本照合）\n- 『備急千金要方』巻第十・傷寒発黄第五は、黄汗を五種の黄の一つに挙げ、諸病の黄疸に桂枝加黄耆湯を宜しとする条を載せる（要原本照合）\n- 『外台秘要方』第四巻・温病及黄疸・黄汗方は、水気病の黄汗の条と同じ条を載せ、方名を「桂枝湯加黄耆五両」とし、薬味を桂心・芍薬・甘草・生姜・大棗・黄耆とする。方後に原典にない「覆いて微汗を取る」がある（要原本照合）\n- 現行エキス剤：ツムラの製剤はない（KEGG MEDICUS・PMDA で確認）。〔東洋〕桂枝加黄耆湯エキス細粒（東洋薬行、識別コード TY-026）は、1日量6.0g中にケイシ4.0・シャクヤク4.0・タイソウ4.0・生ショウキョウ4.0・カンゾウ2.0・オウギ2.0gの混合生薬の水製エキス3.6gを含む（PMDA 添付文書 2023年9月改訂 第1版で確認）。桂皮ではなくケイシ（局外生規）、ショウキョウではなく生ショウキョウを用いる", "構成": "桂枝・芍薬・大棗・生姜・甘草・黄耆", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "桂枝加葛根湯", "名前": "桂枝加葛根湯", "読み": "けいしかかっこんとう", "ツムラ番号": "", "出典": "傷寒論（巻第二・弁太陽病脈証并治上第五）／金匱玉函経（巻第五・弁可発汗病形証治第十四／巻第七・方薬炮製）", "別名": "", "本文": {"条文": "### 『傷寒論』巻第二・弁太陽病脈証并治上第五\n\n**書き下し**（読み：社員案）\n太陽病、項背強ばること几几、反って汗出で悪風する者は、桂枝加葛根湯之を主る。\n\n**原文**（翻刻確認）\n太陽病，項背強几几，反汗出惡風者，桂枝加葛根湯主之。\n\n**現代語訳**（訳：社員案）\n太陽病で、うなじから背中が几几とこわばり、かえって汗が出て風を嫌うものは、桂枝加葛根湯が主治する。\n\n### 『金匱玉函経』巻第五・弁可発汗病形証治第十四\n\n**書き下し**（読み：社員案）\n太陽病、項背強ばること𠘧𠘧、反って汗出で悪風する者は、桂枝加葛根湯に属す。\n\n**原文**（翻刻確認）\n太陽病，項背強𠘧𠘧，反汗出惡風者，屬桂枝加葛根湯。\n\n**現代語訳**（訳：社員案）\n太陽病で、うなじから背中が𠘧𠘧とこわばり、かえって汗が出て風を嫌うものは、桂枝加葛根湯の証に属する。\n\n### 注記\n- 宋本の翻刻と、四庫全書本『傷寒論注釈』（成無己注）巻二の翻刻で同じ句（翻刻確認。強／强の字形の差のみ）\n- 『金匱玉函経』は「几几」を「𠘧𠘧」に作る（要原本照合）。同書の巻第二・弁太陽病形証治第三では、同じ条が「太陽病，項背強𠘧𠘧，而反汗出惡風，桂枝湯主之。《論》云：桂枝加葛根湯主之。」と書かれ、方名が桂枝湯で「而反」となる（要原本照合）\n- 『金匱玉函経』の方（巻第七・方薬炮製の第十七）は麻黄を含まない6味で、現行エキス剤と生薬の種類が同じ（翻刻確認）\n- 宋本の方の後には林億らの注があり、太陽中風の自汗には桂枝、傷寒の無汗には麻黄を用いるのに、証は汗出・悪風で方中に麻黄がある、と指摘すると資料はいう。維基文庫の宋本の翻刻にはこの注が載っていない（要原本照合）\n- 宋本の巻第七・弁可発汗病脈証并治第十六にも本方が載り、服用法の後半に「薬力を助く」の句が加わると資料はいう。維基文庫の宋本の翻刻ではこの篇が省略されていて確かめられない（要原本照合）\n- 宋本の翻刻では、服用法の最後に「諸湯皆彷此」の句が続く（要原本照合）。宋本の巻第十に再掲された方は、甘草に「炙」がなく、服用法が「餘如桂枝法」で終わる（要原本照合）", "出典": "### 原典の構成\n- 『傷寒論』（宋本）：葛根4両、麻黄3両（去節）、芍薬2両、生姜3両（切）、甘草2両（炙）、大棗12枚（擘）、桂枝2両（去皮）（翻刻確認）\n- 『金匱玉函経』巻第七・方薬炮製（桂枝加葛根湯方第十七）：桂枝3両、芍薬2両、甘草2両（炙）、生姜3両、大棗12枚、葛根4両（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』（宋本）：7味を水1斗で、まず麻黄・葛根を煮て2升減らし、上の泡を去る。残りの薬を入れて3升に煮つめ、滓を去って1升を温服する。衣をかけてわずかに汗ばむ程度の汗をとる。粥をすする必要はない。ほかは桂枝湯の法に従って養生と禁忌を守る（翻刻確認）\n- 『金匱玉函経』：6味を水9升で、まず葛根を煮て2升減らし、上の泡を去る。残りの薬を入れて3升に煮つめ、滓を去って1升を温服する。衣をかけてわずかに汗ばむ程度の汗をとる。粥をすする必要はなく、ほかは桂枝湯の法に従う（翻刻確認）\n\n### 処方の変遷\n- 桂枝湯に葛根を加えたもの、あるいは葛根湯から麻黄を除いたもの\n- 宋本『傷寒論』の方には麻黄が入るが、条文（汗出・悪風）と合わないため、古くから麻黄は誤りとして除いて解釈されてきた（要原本照合）。『金匱玉函経』の方は麻黄を含まない6味（翻刻確認）\n- 『太平聖恵方』巻第十・治傷寒中風諸方には、桂心・甘草・赤芍薬・葛根に生姜・棗を入れて煎じる方が載り、事実上の桂枝加葛根湯とされる（要原本照合）\n- 『傷寒活人書』巻第十二の桂枝加葛根湯は桂枝・甘草・芍薬・葛根・麻黄を姜棗で煎服する。注に「伊尹湯液論」では桂枝湯に葛根を加えるだけで、監本が麻黄を用いるのは誤りとある（要原本照合）\n- 『傷寒直格方』巻中では桂枝湯加葛根湯の名で載り、巻下・諸証薬石分剤では桂枝・芍薬・甘草・葛根を桂枝湯のように服すとされる（要原本照合）\n- ツムラの医療用エキス剤はない。医療用は〔東洋〕桂枝加葛根湯エキス細粒（東洋薬行）の1品目で、1日量6.0g中に 桂枝4・芍薬4・大棗4・生姜（生ショウキョウ）4・甘草2・葛根6（g）の混合生薬の水製エキスを含む（PMDA 添付文書 2023年9月改訂 第1版で確認）", "構成": "桂枝・芍薬・大棗・生姜・甘草・葛根", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "桂枝加厚朴杏仁湯", "名前": "桂枝加厚朴杏仁湯", "読み": "けいしかこうぼくきょうにんとう", "ツムラ番号": "", "出典": "傷寒論（巻第二・弁太陽病脈証并治上第五、巻第三・弁太陽病脈証并治中第六）", "別名": "桂枝加厚朴杏子湯", "本文": {"条文": "### 『傷寒論』巻第二・弁太陽病脈証并治上第五\n\n**書き下し**（読み：社員案）\n喘家は、桂枝湯を作りて厚朴・杏子を加うれば佳なり。\n\n**原文**（翻刻確認）\n喘家作，桂枝湯加厚朴、杏子佳。\n\n**現代語訳**（訳：社員案）\nもともと喘のある人には、桂枝湯を作るときに厚朴・杏子（杏仁）を加えるとよい。\n\n### 『傷寒論』巻第三・弁太陽病脈証并治中第六\n\n**書き下し**（読み：社員案）\n太陽病、之を下して微しく喘する者は、表未だ解せざるが故なり。桂枝加厚朴杏子湯之を主る。\n\n**原文**（翻刻確認）\n太陽病，下之微喘者，表未解故也，桂枝加厚朴杏子湯主之。\n\n**現代語訳**（訳：社員案）\n太陽病を下したあと、軽く喘するものは、表がまだ解けていないためである。桂枝加厚朴杏子湯が主治する。\n\n### 注記\n- 原典の方名は桂枝加厚朴杏子湯（宋本の翻刻で確認。翻刻確認）\n- 宋本の翻刻は1つ目の条を「喘家作，」と「作」の後で句を切る。句読点は校訂者のもので、書き下しは「作」を「桂枝湯を作る」に掛けて読んだ（要原本照合）\n- 『金匱玉函経』の翻刻では、2条とも「杏子」が「杏仁」で、方名は「桂枝加厚朴杏仁湯」。1つ目の条は「喘家，作桂枝湯加厚朴杏仁佳。」（要原本照合）\n- 『金匱玉函経』の翻刻の別の篇では、2つ目の条が「宜麻黃湯。又云：桂枝加厚朴杏子湯。」、また「屬桂枝湯證。（一云：麻黃湯證。）」となっている（要原本照合）\n- 四庫全書本『傷寒論注釈』（成無己注）巻二の翻刻では、1つ目の条が「喘家作桂枝湯加厚朴杏子仁」（要原本照合）\n- 宋本の巻第十に再掲された方は「桂枝湯方の内に厚朴二両、杏仁五十箇（去皮尖）を加え、余は前法に依る」で、杏仁の数を「枚」でなく「箇」とする（要原本照合）", "出典": "### 原典の構成\n- 『傷寒論』（宋本）巻第三：桂枝3両（去皮）、甘草2両（炙）、生姜3両（切）、芍薬3両、大棗12枚（擘）、厚朴2両（炙、去皮）、杏仁50枚（去皮尖）（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』（宋本）巻第三：7味を水7升で、とろ火で3升に煮つめ、滓を去って1升を温服する。衣をかけてわずかに汗ばむ程度の汗をとる（翻刻確認）\n\n### 処方の変遷\n- 桂枝湯に厚朴・杏仁を加えたもの\n- 『金匱玉函経』の翻刻では、方薬炮製の篇に本方の方が見当たらない（翻刻確認）\n- ツムラの医療用エキス剤はない。医療用は〔東洋〕桂枝加厚朴杏仁湯エキス細粒（東洋薬行）の1品目で、1日量7.5g中に 桂枝4・芍薬4・大棗4・生姜（生ショウキョウ）4・甘草2・厚朴4・杏仁4（g）の混合生薬の水製エキスを含む（PMDA 添付文書 2023年10月改訂 第1版で確認）", "構成": "桂枝・芍薬・大棗・生姜・甘草・厚朴・杏仁", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "桂枝加苓朮附湯", "名前": "桂枝加苓朮附湯", "読み": "けいしかりょうじゅつぶとう", "ツムラ番号": "", "出典": "方機（桂枝加朮附湯の条に続く条）／古方括要（巻之上・雑病門・麻木）", "別名": "", "本文": {"条文": "### 『方機』桂枝加朮附湯の条に続く条\n\n**書き下し**（要原本照合）\n\n**原文**（要原本照合）\n\n**現代語訳**\n\n### 『古方括要』巻之上・雑病門・麻木\n\n**書き下し**（要原本照合）\n\n**原文**（要原本照合）\n\n**現代語訳**\n\n### 注記\n- 『方機』の原文の翻刻は、維基文庫の検索（2026-10-22）では見当たらなかった。資料には書き下しだけがある（要原本照合）\n- 『方機』の条は、眼目が明らかでない者に応鐘散あるいは紫円、あるいは七宝丸の兼用を指示する（要原本照合。資料の論考①による）\n- 『古方括要』は、桂枝湯の方中に茯苓・白朮・附子を加える方として桂枝加苓朮附湯を載せ、手足の麻木・拘攣に用いるとする（資料の論考⑥による。要原本照合）。原文の翻刻は見つかっておらず、資料に漢文の原文の引用もない", "出典": "### 原典の構成\n- 『方機』：桂枝と芍薬は等量で各6分（要原本照合。資料の論考⑩による。ほかの生薬の分量は資料に記載がない）\n- 『古方括要』：桂枝湯の方中に茯苓・白朮・附子を加える（要原本照合。資料の論考⑥による。分量の記載はない）\n\n### 原典の服用法\n\n### 処方の変遷\n- 資料の出典欄は『傷寒論』『方機』の2書を挙げる。桂枝加苓朮附湯の名が出るのは『方機』で、桂枝加朮附湯の条に続く条（要原本照合）\n- 桂枝湯と桂枝加附子湯の出典は『傷寒論』巻第二・弁太陽病脈証并治上第五（翻刻確認）\n- 構成は桂枝加朮附湯（桂皮・芍薬・甘草・生姜・大棗・蒼朮・附子）に茯苓を加えたものと同じになる\n- 『方機』の著者・成立年は資料に記載がない（要確認）\n- 『類聚方広義』（上）の桂枝加附子湯の頭注は、心悸・目眩・身瞤動する者に茯苓を加えて桂枝加茯苓朮附子湯と名づけるとする（要原本照合）\n- 『証治摘要』巻上・中風には桂枝加朮苓附湯の名で載る（要原本照合）\n- 『臨床漢方医典』脚気は、桂枝3分・芍薬5分とする（要原本照合）\n- 医療用エキス剤はツムラにはなく、クラシエ（クラシエ桂枝加苓朮附湯エキス細粒、識別コード KB-18・EK-18。ほかにエキス錠）と大杉製薬（オースギ桂枝加苓朮附湯エキスG、識別コード SG-18R）がある（KEGG MEDICUS と PMDA で 2026-10-22 確認）\n- クラシエのエキス細粒は1日量7.5g中にケイヒ4.0・シャクヤク4.0・タイソウ4.0・ショウキョウ1.0・カンゾウ2.0・ビャクジュツ4.0・ブクリョウ4.0・ブシ末0.5g（PMDA 添付文書 2023年10月改訂 第1版で確認）\n- オースギのエキスGは1日量9.0g中にケイヒ4・ショウキョウ1・タイソウ4・シャクヤク4・カンゾウ2・ブクリョウ4・ソウジュツ4・ブシ末1g（PMDA 添付文書 2022年1月改訂 第1版で確認）\n- 朮はクラシエが白朮、オースギが蒼朮。附子はどちらもブシ末で、1日量はクラシエ0.5g、オースギ1g", "構成": "桂皮・芍薬・甘草・生姜・大棗・蒼朮（白朮）・茯苓・附子（ブシ末）", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "桂芍知母湯", "名前": "桂芍知母湯", "読み": "けいしゃくちもとう", "ツムラ番号": "", "出典": "金匱要略（中風歴節病脈証并治第五）", "別名": "桂枝芍薬知母湯", "本文": {"条文": "### 『金匱要略』中風歴節病脈証并治第五\n\n**書き下し**（読み：社員案）\n諸の肢節疼痛し、身体魁羸し、脚腫れて脱するが如く、頭眩し短気し、温温として吐せんと欲するは、桂枝芍薬知母湯之を主る。\n\n**原文**（翻刻確認）\n諸肢節疼痛，身體魁羸，腳腫如脫，頭眩短氣，溫溫欲吐，桂枝芍藥知母湯主之。\n\n**現代語訳**（訳：社員案）\n多くの関節が痛み、体がやせ衰え（魁羸。語の解釈には諸説がある）、脚が腫れて抜け落ちそうなようで、めまいがして息切れし、むかむかと吐き気がするものは、桂枝芍薬知母湯がこれを主治する。\n\n### 注記\n- 「魁羸」は、四部叢刊本（明嘉靖俞橋刊本の影印）の翻刻では「尫羸」と書かれる（要原本照合）\n- 「欲吐」の「欲」は、四部叢刊本の翻刻では「𣣔」と書かれる（字体の違い。要原本照合）\n- 附子の分量は、通行本の翻刻の「2枚（炮）」を本文に採った。四部叢刊本の翻刻では「2両（炮）」（要原本照合）\n- 四部叢刊本の翻刻では、この条は前の「盛人脈澀小……此皆飲酒汗出當風所致」の条（太った人の歴節の条）と改行なしに続いて書かれる（翻刻確認）\n- 現行の方名の桂芍知母湯は、原典では桂枝芍薬知母湯と書かれる（翻刻確認）", "出典": "### 原典の構成\n- 『金匱要略』中風歴節病第五（桂枝芍薬知母湯）：桂枝4両、芍薬3両、甘草2両、麻黄2両、生姜5両、白朮5両、知母4両、防風4両、附子2枚（炮）（翻刻確認。附子の分量の異同は条文の注記を参照）\n\n### 原典の服用法\n- 『金匱要略』中風歴節病第五：9味を水7升で煮て2升に煮詰め、7合を温服し、1日3回服用する（翻刻確認）\n\n### 処方の変遷\n- 原典の方名は桂枝芍薬知母湯（翻刻確認）\n- 『三因極一病証方論』巻之三・歴節治法では芍薬知母湯の名で載り、8味を姜煎するとしたあと、一法に白朮・川芎・杏仁・半夏があるとする（要原本照合）\n- 『傷寒活人書』には桂枝芍薬知母湯は収載されていない（要原本照合）\n- 構成は、桂枝加朮附湯（桂皮・芍薬・甘草・生姜・大棗・朮・附子）から大棗を去り、麻黄・知母・防風を加えたものにあたる\n- 医療用エキス剤はツムラにはなく、三和生薬の三和桂芍知母湯エキス細粒（識別コード S-10）がある（KEGG MEDICUS と添付文書で 2026-10-22 確認）\n- 三和のエキス細粒は1日量9g中にケイヒ3.0・チモ3.0・ハマボウフウ3.0・ショウキョウ1.0・シャクヤク3.0・マオウ3.0・ビャクジュツ4.0・カンゾウ1.5・加工ブシ1.0g（添付文書 2025年10月改訂 第2版で確認）\n- 原典の防風は、エキス剤では浜防風（ハマボウフウ）、附子は加工ブシ。朮は原典・エキス剤とも白朮", "構成": "桂皮・芍薬・甘草・麻黄・白朮・知母・浜防風・附子（加工ブシ）・生姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "桂麻各半湯", "名前": "桂麻各半湯", "読み": "けいまかくはんとう", "ツムラ番号": "", "出典": "傷寒論（巻第二・弁太陽病脈証并治上第五）／金匱玉函経（巻第二・弁太陽病形証治第三）", "別名": "桂枝麻黄各半湯", "本文": {"条文": "### 『傷寒論』巻第二・弁太陽病脈証并治上第五\n\n**書き下し**（読み：社員案）\n太陽病、之を得て八九日、瘧状の如く、発熱悪寒し、熱多く寒少なく、其の人嘔せず、清便自ずから可ならんと欲し、一日に二三度発す。脈微緩なる者は、愈えんと欲すと為すなり。脈微にして悪寒する者は、此れ陰陽倶に虚す。更に汗を発し、更に下し、更に吐すべからざるなり。面色反って熱色有る者は、未だ解せんと欲せざるなり。其の小汗出づるを得ること能わざるを以て、身必ず痒し。桂枝麻黄各半湯に宜し。\n\n**原文**（翻刻確認）\n太陽病，得之八九日，如瘧狀，發熱惡寒，熱多寒少，其人不嘔，清便欲自可，一日二三度發。脈微緩者，為欲愈也；脈微而惡寒者，此陰陽俱虛，不可更發汗更下

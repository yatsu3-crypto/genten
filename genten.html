、生姜4両、橘皮1両半。水5升で煮て1升半を取り3回に分服。小字注に「張文仲の処。並びに第六巻中に出づ」）が載る（翻刻確認。四庫全書本）\n- 『聖済総録』巻第二十五・傷寒門・傷寒嘔噦の茯苓湯は、傷寒の後に胸膈に気が満ち、嘔噦して飲食が納まらないものに、白茯苓・陳橘皮・枳実・人参・白朮・五味子・半夏を粗末とし、姜棗で煎服するとされる（要原本照合）\n- 『鶏峰普済方』巻第十八・痰飲には延年茯苓飲子の名で載り、条文の字句が少し異なり、橘皮を黄橘皮とするとされる（要原本照合）\n- 『叢桂亭医事小言』巻之七・叢桂亭蔵方の丁字湯は、本方に牡蛎・呉茱萸・甘草を加えた方とされる（要原本照合）\n- 現行エキス剤（ツムラ69）は 茯苓・蒼朮・陳皮・人参・枳実・生姜 の6味。原典の白朮に当たる生薬は蒼朮、橘皮に当たる生薬は陳皮の名で入る（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "茯苓・蒼朮・陳皮・人参・枳実・生姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "香蘇散", "名前": "香蘇散", "読み": "こうそさん", "ツムラ番号": "70", "出典": "太平恵民和剤局方（巻之二・傷寒 附 中暑）／寿世保元（巻二・四時感冒）", "別名": "", "本文": {"条文": "### 『太平恵民和剤局方』巻之二・傷寒 附 中暑\n\n**書き下し**（読み：社員案）\n\n香蘇散　四時の瘟疫・傷寒を治す。\n\n**原文**（翻刻確認）\n\n香蘇散　治四時瘟疫傷寒。\n\n**現代語訳**（訳：社員案）\n\n四季を通じて起こる流行病（瘟疫）と傷寒を治す。\n\n### 『寿世保元』巻二・四時感冒\n\n**書き下し**（読み：社員案）\n\n一に論ず、四時の傷寒・瘟疫、頭疼、寒熱往来、及び内外両感の症を治す。春月に病を得れば、宜しく此の方を用うべし。香蘇散。\n\n**原文**（翻刻確認）\n\n一論四時傷寒瘟疫、頭疼、寒熱往來、及治內外兩感之症。春月得病、宜用此方。香蘇散\n\n**現代語訳**（訳：社員案）\n\n四季を通じての傷寒・瘟疫、頭痛、悪寒と発熱が交互に来るもの、および内外両感（表と裏が同時に病む）の症を治す。春に病を得たときは、この方を用いるのがよい。香蘇散。\n\n### 注記\n- 『寿世保元』の翻刻（維基文庫『壽世保元』）は「未校訂」の表示がある簡体字まじりの本で、原文は繁体字にそろえて書いた（时→時、伤→傷、头→頭、热→熱、两→兩 など）。字形の判断には使えない（要原本照合）\n- 『寿世保元』の方は紫蘇葉・香附・陳皮・甘草の4味を姜・棗で煎じる。生姜・大棗の有無は構成の違いに数えない（取りまとめ側の基準）ので、同構成として条文の欄に置いた。資料は本書で「生姜・葱白の配合が指示される」とするが、翻刻では「姜、棗」（要原本照合）\n- 2書の順は、どちらも現行エキス剤（ツムラ）と構成が一致し基準では決まらないので、資料の出典欄の『和剤局方』を先にした（要確認）\n- 方後に小字の注として、白髪の老人がこの方を一人の富人の家に授け、その家が調合して施したところ、大疫のとき城中の病者が皆癒えたという古伝がある：「嘗有白髪老人授此方與一富人家、其家合施、當大疫、城中病者皆愈。其後疫鬼問富人、富人以實告。鬼曰、此老教三人矣。稽顙而退」（翻刻確認）\n- 翻刻（四庫全書本）では甘草の分量が「炙兩」の小字の後に「一」と崩れて書かれる。別の翻刻本（維基文庫『太平惠民和劑局方』、簡体字まじりの本）の「甘草（炙，一兩）」に従い1両とした（要原本照合）\n- 別の翻刻本では、陳皮に「不去白」（白を去らず）の注があり、香附子は「炒香，去毛」、服用法は「不拘時候」と書かれる（要原本照合）\n- 資料（論考㉒）は、服用法の「只服二錢」に「一本には一銭に作る」という異本の注があるとする。2つの翻刻本にはこの注は見当たらない（要原本照合）\n- 別の翻刻本では、本方の前に「〔紹興續添方〕」とある（翻刻確認）", "出典": "### 原典の構成\n- 『和剤局方』：陳皮2両、香附子（炒って毛を去る）・紫蘇葉 各4両、甘草（炙る）1両 の4味。生姜・葱白は含まない（翻刻確認。甘草の分量は注記のとおり）\n- 『寿世保元』：紫蘇葉2銭、香附3銭、陳皮3銭、甘草5分 の4味（翻刻確認）\n\n### 原典の服用法\n- 『和剤局方』：麄末とし、1回3銭を水1盞で7分まで煎じ、滓を去って熱服する。時を問わず、日に3回服す。細末とする場合は、ただ2銭を服し、塩を入れて点じて服す（翻刻確認）\n- 『寿世保元』：剉み、姜・棗で煎じて熱服する。方後に、頭疼には川芎・白芷・細辛を加えるなど多くの加味が続く（翻刻確認）\n\n### 処方の変遷\n- 香蘇散は『和剤局方』の紹興続添方に属し、紹興年間（1131〜1162年）に増補された方とされる（要確認。紹興続添方に属することは別の翻刻本で翻刻確認）\n- 『和剤局方』の香蘇散は陳皮・香附子・紫蘇葉・甘草の4味で、生姜・葱白は含まない（翻刻確認）\n- 『証治準縄』巻四十一・傷寒・太陽病・発熱の加味香蘇散（抜粋）は、香附子・紫蘇梗・陳皮・甘草を剉散とし、生姜・連根葱白で煎服するとされる（要原本照合）\n- 資料によれば、『寿世保元』乙集巻之二・四時感冒でも生姜・葱白の配合が指示され、その後に16条の加味方が続く（要原本照合）。翻刻では「姜、棗」で煎じる（条文の欄に載せた）\n- 現行エキス剤（ツムラ70）は 香附子・蘇葉・陳皮・甘草・生姜 の5味で、生姜が入り葱白は入らない（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "香附子・蘇葉・陳皮・甘草・生姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "四物湯", "名前": "四物湯", "読み": "しもつとう", "ツムラ番号": "71", "出典": "理傷続断方（医治整理補接次第口訣）／太平恵民和剤局方（巻之九・婦人諸疾 附 産図）", "別名": "", "本文": {"条文": "### 『理傷続断方』医治整理補接次第口訣\n\n**書き下し**（読み：社員案）\n\n凡そ傷重く、腸内に瘀血有る者は此を用う。\n\n**原文**（翻刻確認）\n\n凡傷重、腸内有瘀血者用此。\n\n**現代語訳**（訳：社員案）\n\nおよそ外傷が重く、腸の内に瘀血があるものには、これを用いる。\n\n### 関連条文（『理傷続断方』医治整理補接次第口訣の総論の条）\n\n同じ章の総論にあたる箇所で、四物湯を散血の薬として挙げる2条。\n\n**書き下し**（読み：社員案）\n\n凡そ跌損し、腸肚の中に汚血あらば、且く散血の薬を服す、四物湯の類の如し。\n\n凡そ損じて、大小便通ぜざれば、未だ便ち損薬を服すべからず。蓋し損薬は酒を用うれば必ず熱す。且く四物湯を服し、更に如何を看る。\n\n**原文**（翻刻確認）\n\n凡跌損、腸肚中汚血、且服散血藥、如四物湯之類。\n\n凡損、大小便不通、未可便服損藥、蓋損藥用酒必熱。且服四物湯、更看如何。\n\n**現代語訳**（訳：社員案）\n\nおよそ転倒や打撲で損傷し、腹の中に汚血があるときは、まず散血の薬を服す。四物湯の類のようなものである。\n\nおよそ損傷して大小便が通じないときは、まだすぐに損薬を服してはならない。損薬は酒を用いるので必ず熱をもつからである。まず四物湯を服し、さらに様子を見る。\n\n### 『太平恵民和剤局方』巻之九・婦人諸疾 附 産図\n\n**書き下し**（読み：社員案）\n\n栄衛を調益し、気血を滋養す。衝任虚損し、月水調わず、臍腹㽲痛し、崩中漏下し、血瘕塊硬く、発歇して疼痛し、姙娠して冷を宿し、将理宜しきを失い、胎動きて安からず、血下りて止まず、及び産後虚に乗じて風寒内に摶ち、悪露下らず、結して瘕聚を生じ、少腹堅痛し、時に寒熱を作すを治す。\n\n**原文**（翻刻確認）\n\n調益榮衛、滋養氣血。治衝任虚損、月水不調、臍腹㽲痛、崩中漏下、血瘕塊硬、發歇疼痛、姙娠宿冷、將理失宜、胎動不安、血下不止、及産後乗虚、風寒内摶、惡露不下、結生瘕聚、少腹堅痛、時作寒熱。\n\n**現代語訳**（訳：社員案）\n\n栄衛（営気と衛気）を調え補い、気血を養う。衝脈・任脈が虚して損なわれ、月経が順調でなく、臍のあたりや腹がひきつれるように痛み、崩中・漏下（不正性器出血）があり、血瘕の塊が硬く、痛みが起こったり止んだりするもの、妊娠中にもともと冷えがあり、養生が適切でなく、胎動して落ち着かず、出血が止まらないもの、および産後の虚に乗じて風寒が内に入ってぶつかり合い、悪露が下らず、結して瘕聚（腹中の塊）を生じ、下腹が硬く痛み、時に寒熱が起こるものを治す。\n\n### 注記\n- 『理傷続断方』の翻刻（維基文庫『仙授理傷續斷秘方』）は簡体字の本で、原文は繁体字にそろえて書いた（伤→傷、肠→腸、药→藥、汤→湯、热→熱 など）。字形の判断には使えない（要原本照合）\n- 資料は『理傷続断方』の方後に「一方は只、当帰・大黄の二味を用う」とあるとするが、維基文庫の翻刻の四物湯の項にはこの句がない（要原本照合）\n- 『和剤局方』の「㽲痛」は翻刻（四庫全書本）の字。資料の書き下しは「疞痛」と書く（要原本照合）\n- 『和剤局方』の「風寒内摶」は翻刻の字。資料の書き下しは「風寒内に搏ち」と「搏」の字で書く（要原本照合）\n- 『和剤局方』の「滋養」は、翻刻では「滋飬」（養の異体字）。字体の違いとして本文は「養」にした\n- 2書の順は、資料の出典欄（華佗方？、『理傷続断方』）にある『理傷続断方』を先にした。2書とも構成は現行エキス剤（ツムラ）と同じ4味。添付文書に出典の欄はない（要確認）", "出典": "### 原典の構成\n- 『理傷続断方』：白芍薬・川当帰・熟地黄・川芎 各等分（翻刻確認）\n- 『和剤局方』：当帰（蘆を去り、酒に浸して炒る）・川芎・熟地（酒に浸して蒸す）・芍薬（白）各等分（翻刻確認）。資料は「熟乾地黄・白芍薬・当帰・川芎」と書く（要原本照合）\n\n### 原典の服用法\n- 『理傷続断方』：等分とし、1回3銭を水1盞半で7分に煎じ、空腹時に熱服する（翻刻確認）\n- 『和剤局方』：粗末とし、1回3銭を水1盞半で8分に煎じ、滓を去って熱服する。空腹時・食前に服す。妊娠して胎動不安・下血が止まらないものには艾10葉・阿膠1片を加えて同じく煎じる。血蔵が虚冷して崩中し出血が多いものにも膠・艾を加えて煎じる（翻刻確認）\n\n### 処方の変遷\n- 資料の出典欄は「華佗方？、『理傷続断方』」。『婦人大全良方』巻之二 衆疾門・通用方序論第五・加減四物湯が、四物湯はどの代から起こったか知らない、或る人は魏の華佗に始まるという、と記すことによる（要原本照合）\n- 資料は、従来は『和剤局方』巻之九が出典とされてきたが、本来の出典は『理傷続断方』医治整理補接次第口訣とする。同書は唐の藺道人の撰で会昌年間（841〜846年）の成書とし、四物湯は補養薬（損薬）ではなく散血薬（駆瘀血薬）として位置づけられているとする（要原本照合）。翻刻の『仙授理傷續斷秘方』は唐代・藺道人の書とされる\n- 資料は、『理傷続断方』は洪武版本（1395年刊）で初めて全貌が世に知られたとする（要確認）\n- 資料によれば、『理傷続断方』の方後の一方（当帰・大黄の2味）は『備急千金要方』巻第二十五 備急・被打第三に、高所から堕下して崩中する方として載る。『和剤局方』巻之八・瘡腫傷折では同じ2味が導滞散として収載される（要原本照合）\n- 資料によれば、董汲『旅舎備要方』婦人科に四物湯があり、当帰・白芍薬・川芎・熟乾地黄を散として生姜で煎服する。漏胎・崩中には炙阿膠・熟艾を、産後には童子小便を加える。資料は同書を元豊〜元祐年間（1078〜1094年）の著作とし、四物湯は『和剤局方』原書五巻本の大観年間（1107〜1110年）の収載より前に知られていたとする（要原本照合）\n- 資料によれば、『太平聖恵方』巻第八十一・治産後心腹痛諸方の定痛散方は当帰・赤芍薬・芎藭を散として熱生姜酒で服す。『聖済総録』巻第一百六十・産後門・産後悪露不可（資料の表記。引用の文は「悪露快からず」）の四物湯方は当帰・芎藭・熟乾地黄・芍薬を粗末として煎服する（要原本照合）\n- 資料によれば、昝殷『経効産宝』（大中年間 847〜860年の成書）には四物湯・四物散は載らず、宋代の続編に増減四物湯（当帰・芍薬・川芎・人参・乾姜・甘草）が載るのみ（要原本照合）\n- 『和剤局方』の方後の、艾葉・阿膠を加える法について、資料は甘草があればまさに芎帰膠艾湯そのものとする。一般に四物湯は芎帰膠艾湯から阿膠・艾葉・甘草を去ったものとされるが、資料は、華佗の創方なら芎帰膠艾湯が四物湯に加味した方である可能性もあるとする（要確認）\n- 地黄：資料は、原典では熟地黄、『和剤局方』でも熟乾地黄（熟地黄）と指示されるが、現在の多くのエキス製剤は日局地黄として乾地黄と熟地黄を区別せずに処方し（事実上は乾地黄）、熟地黄を処方しているメーカーもあるとする（要確認）\n- 現行エキス剤（ツムラ71）は7.5g中、地黄・芍薬・川芎・当帰 各3.0g の4味（PMDA 添付文書 2023年12月改訂 第1版で確認）。添付文書に出典の欄はない", "構成": "地黄・芍薬・川芎・当帰", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "甘麦大棗湯", "名前": "甘麦大棗湯", "読み": "かんばくたいそうとう", "ツムラ番号": "72", "出典": "金匱要略（婦人雑病脈証并治第二十二）", "別名": "甘草小麦大棗湯", "本文": {"条文": "### 『金匱要略』婦人雑病脈証并治第二十二\n\n**書き下し**（読み：社員案）\n婦人の臓躁、喜く悲傷して哭せんと欲し、象神霊の作す所の如く、数欠伸するは、甘麦大棗湯之を主る。\n\n**原文**（翻刻確認）\n婦人臟躁，喜悲傷欲哭，象如神靈所作，數欠伸，甘麥大棗湯主之。\n\n**現代語訳**（訳：社員案）\n婦人の臓躁で、よく悲しみ傷んで泣きたがり、その様子は神霊の仕業のようであり、しばしばあくびをして伸びをするものは、甘麦大棗湯がこれを主治する。\n\n### 注記\n- 「臟躁」は、四部叢刊本（明嘉靖俞橋刊本の影印）の翻刻では「藏躁」と書かれる（要原本照合）\n- 「欲哭」の「欲」は、四部叢刊本の翻刻では異体字（Unicode U+238D4）で書かれる（字体の違い。要原本照合）\n- 「大棗」の「棗」は、四部叢刊本の翻刻では異体字（Unicode U+2C0F7）で書かれる（字体の違い。要原本照合）\n- 方の見出しは、四部叢刊本の翻刻では「甘草小麥大棗湯方」（棗は上の異体字）で、条の方名（甘麥大棗湯）と違う（翻刻確認）\n- 維基文庫の『金匱要略』の翻刻にはこの方の分量・服用法が載っておらず、「出典」の構成・服用法は四部叢刊本の翻刻だけで確かめた", "出典": "### 原典の構成\n甘草2両、小麦1升、大棗10枚（翻刻確認。四部叢刊本の翻刻だけで確かめた）\n\n### 原典の服用法\n3味を水6升で煮て3升を取り、温めて3回に分けて服す。また脾気を補う（翻刻確認）\n\n### 処方の変遷\n- 条では「甘麦大棗湯」、方の見出しでは「甘草小麦大棗湯」と書かれる（翻刻確認）\n- 『普済本事方』巻第十・婦人諸疾に、婦人の臓躁を治す「大棗湯」の名で載る（要原本照合）\n- 『婦人大全良方』巻之十五・妊娠臓躁悲傷方論第十三は許学士を引いて大棗湯を載せ、後に「専ら婦人を治する方」「甘草湯と名づく」と続ける（要原本照合）\n- 『袖珍方』巻之四・婦人方・調経衆疾は『大全良方』を引いて大棗湯として載せる（要原本照合）\n- 現行エキス剤（ツムラ72）は 大棗・甘草・小麦 の3味（PMDA 添付文書 2023年12月改訂 第1版で確認。小麦は「ショウバク」と書かれる）", "構成": "大棗・甘草・小麦", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "柴陥湯", "名前": "柴陥湯", "読み": "さいかんとう", "ツムラ番号": "73", "出典": "傷寒活人書（巻第十・七十五）／傷寒直格方（巻中・結胸）／傷寒標本心法類萃（巻上・結胸）", "別名": "", "本文": {"条文": "### 『傷寒活人書』巻第十・七十五\n\n**書き下し**（読み：社員案）\n心下緊満し、之を按じて石硬にして痛むを問う。……其の脈、寸口浮、関・尺皆沈、或いは沈緊なるを、名づけて結胸と曰う也。結胸を治するには、大率当に下すべし（仲景云う、之を下せば則ち和すと）。然れども脈浮と大とは皆下すべからず、之を下せば則ち死す。尚宜しく汗を発すべき也。仲景云う、結胸脈浮なる者は下すべからず、只小陥胸湯を用うべしと。大抵脈浮なるは、是れ尚表証有り。兼ねて小柴胡湯等を以て先ず表を発し、表証罷めば、方に結胸を下す薬を用いて便ち安し。\n\n**原文**（翻刻確認）\n問心下緊滿，按之石硬而痛。……其脉寸口浮，關尺皆沉，或沉緊，名曰結胸也。治結胸，大率當下（仲景云：下之則和）。然脉浮與大，皆不可下，下之則死，尚宜發汗也。仲景云：結胸脉浮者，不可下，只可用小陷胸湯。大抵脉浮，是尚有表證，兼以小柴胡湯等先發表，表證罷，方用下結胸藥便安。\n\n**現代語訳**（訳：社員案）\n心窩部が張りつめて満ち、押すと石のように硬く痛むものについて問う。……その脈が寸口で浮、関・尺はいずれも沈、あるいは沈緊であるものを結胸という。結胸の治療は、おおむね下すのがよい（仲景は、これを下せば和らぐという）。しかし脈が浮や大のものは、いずれも下してはならず、下せば死ぬ。やはり汗を発するのがよい。仲景は、結胸で脈が浮のものは下してはならず、ただ小陥胸湯を用いるべきだという。おおよそ脈が浮なのはまだ表証があるからで、小柴胡湯などを兼ねて用いてまず表を発し、表証が治まってから結胸を下す薬を用いれば落ち着く。\n\n### 『傷寒直格方』巻中・結胸\n\n**書き下し**（読み：社員案）\n……或いは脈浮なる者は、表未だ罷まざる也。之を下すべからず（之を下せば死す）。宜しく小陥胸湯及び小柴胡の類にて和解すべし。\n\n**原文**（翻刻確認）\n……或脉浮者，表未罷也，不可下之（下之死），宜小陷胸湯及小柴胡之類和解。\n\n**現代語訳**（訳：社員案）\n……あるいは脈が浮のものは、表証がまだ治まっていないのである。これを下してはならない（下せば死ぬ）。小陥胸湯や小柴胡湯の類で和解するのがよい。\n\n### 『傷寒標本心法類萃』巻上・結胸\n\n**書き下し**（読み：社員案）\n結胸の証に三つ有り。按ぜずして痛む者を大結胸と名づけ、之を按じて痛む者を小結胸と名づけ、心下怔忡し頭汗出づる者を水結胸と名づくる也。……或いは脈浮なる者は、表未だ罷まざる也。下すべからず、之を下せば則ち死す。宜しく小陥胸湯及び小柴胡湯の類にて之を和解すべし。……脈浮にして下すべからざる者は、小陥胸湯に小柴胡湯を合す。\n\n**原文**（翻刻確認）\n結胸之証有三：不按而痛者名大結胸，按之而痛者名小結胸，心下怔忡頭汗出者名水結胸也。……或脈浮者表未罷也，不可下，下之則死，宜小陷胸湯及小柴胡湯之類和解之。……脈浮不可下者，小陷胸湯合小柴胡湯。\n\n**現代語訳**（訳：社員案）\n結胸の証には三つある。押さなくても痛むものを大結胸、押すと痛むものを小結胸、心窩部で動悸がして頭に汗が出るものを水結胸という。……あるいは脈が浮のものは、表証がまだ治まっていない。下してはならず、下せば死ぬ。小陥胸湯や小柴胡湯の類でこれを和解するのがよい。……脈が浮で下してはならないものには、小陥胸湯に小柴胡湯を合わせる。\n\n### 注記\n- 3書とも「柴陥湯」の方名はなく、小柴胡湯と小陥胸湯をあわせて用いる記載である（翻刻確認）\n- 『傷寒活人書』の原文は、維基文庫の簡体字の本（書名『傷寒類證活人書』）を繁体字に直して載せた。字形の判断には使えない（要原本照合）。翻刻では小陥胸湯・小柴胡湯の後に「（正方四十）」「（正二十九）」の方の番号が入るが、原文では省いた。資料は後半の「仲景云う……」以下を夾注として括弧に入れるが、翻刻では括弧がない（要原本照合）\n- 『傷寒直格方』の「表未罷也」は、維基文庫の四庫全書本の翻刻では「表水罷也」と書かれる（要原本照合）。資料の書き下し（「表未だ罷らざる也」）と『傷寒標本心法類萃』の同じ句に合わせて「未」を採った\n- 『傷寒直格方』の「（下之死）」は、四庫全書本の翻刻で小字の注になっている（翻刻確認）。翻刻ではこの条の「和解」の後が「未罷者方可下之」と続き、『傷寒標本心法類萃』の「之表罷者方可下之」と異なる（要原本照合）\n- 『傷寒標本心法類萃』は、維基文庫では『傷寒直格方』（四庫全書本）の「標本心法類萃卷上」として収められる（翻刻確認）", "出典": "### 原典の構成\n- 『傷寒活人書』『傷寒直格方』『傷寒標本心法類萃』：合方としての分量の記載はない（翻刻確認）\n- 元の方（『傷寒論』）：小柴胡湯は柴胡半斤・黄芩3両・人参3両・半夏半升（洗）・甘草3両（炙）・生姜3両（切）・大棗12枚（擘）。小陥胸湯は黄連1両・半夏半升（洗）・栝楼実（大きいもの）1枚（翻刻確認）\n\n### 原典の服用法\n- 『傷寒活人書』『傷寒直格方』『傷寒標本心法類萃』：合方としての服用法の記載はない（翻刻確認）\n- 元の方（『傷寒論』）：小柴胡湯は7味を水1斗2升で煮て6升を取り、滓を去り、再び煎じて3升を取り、1升を温服する。日に3回。小陥胸湯は水6升でまず栝楼を煮て3升を取り、滓を去り、ほかの薬を入れて煮て2升を取り、滓を去り、3回に分けて温服する（翻刻確認）\n\n### 処方の変遷\n- 小柴胡湯と小陥胸湯の合方。小柴胡湯の出典は『傷寒論』（弁太陽病脈証并治中第六に方と加減法がある）、小陥胸湯の出典は『傷寒論』弁太陽病脈証并治下第七（翻刻確認）。資料の出典欄には『金匱要略』も挙がる\n- 『傷寒論』の小柴胡湯の方後の加減法に、胸中が煩して嘔しないものは半夏・人参を去り栝楼実1枚を加えるとある（翻刻確認）\n- 資料は、『傷寒活人書』（大観元年〔1107〕の自序がある）に小陥胸湯と小柴胡湯等を兼ねて用いる形がすでにあり、柴陥湯の出典はここまでさかのぼるべきとする\n- 資料は、明・陶華『傷寒六書』巻之六にも小柴胡湯と小陥胸湯の合方投与の記載があるが、柴陥湯の方名は見当たらないとする（要原本照合）\n- 資料は、『医学入門』三巻下・傷寒用薬賦に「柴陥湯、即ち小柴胡湯合小陥胸湯」とあり、ここで柴陥湯の方名が記されるとする（要原本照合）\n- 資料は、日本では従来、本方の出典は本朝経験方とされ『医方口訣集』に登載されているといわれてきたとする（要原本照合）\n- 原典の小陥胸湯は栝楼実を用いる（翻刻確認）。現行エキス剤（ツムラ73）は栝楼仁を用い、柴胡5.0・半夏5.0・黄芩3.0・大棗3.0・人参2.0・黄連1.5・甘草1.5・生姜1.0・栝楼仁3.0g の9味（PMDA 添付文書 2023年12月改訂 第1版で確認。栝楼仁は添付文書では「カロニン」と書かれる）", "構成": "柴胡・半夏・黄芩・大棗・人参・黄連・甘草・生姜・栝楼仁", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "調胃承気湯", "名前": "調胃承気湯", "読み": "ちょういじょうきとう", "ツムラ番号": "74", "出典": "傷寒論（弁太陽病脈証并治上第五・弁太陽病脈証并治中第六・弁陽明病脈証并治第八）", "別名": "", "本文": {"条文": "### 『傷寒論』弁太陽病脈証并治上第五\n\n**書き下し**（読み：社員案）\n傷寒、脈浮、自汗出で、小便数、心煩し、微しく悪寒し、脚攣急するに、反って桂枝を与えて其の表を攻めんと欲するは、此れ誤りなり。之を得て便ち厥し、咽中乾き、煩躁吐逆する者は、甘草乾姜湯を作りて之を与え、以て其の陽を復す。若し厥愈え足温かなる者は、更に芍薬甘草湯を作りて之を与うれば、其の脚即ち伸ぶ。若し胃気和せず、譫語する者は、少しく調胃承気湯を与う。若し重ねて汗を発し、復た焼針を加うる者は、四逆湯之を主る。\n\n**原文**（翻刻確認）\n傷寒脈浮、自汗出、小便數、心煩、微惡寒、腳攣急、反與桂枝欲攻其表、此誤也。得之便厥、咽中乾、煩躁吐逆者、作甘草乾薑湯與之、以復其陽。若厥愈足溫者、更作芍藥甘草湯與之、其腳即伸。若胃氣不和、譫語者、少與調胃承氣湯。若重發汗、復加燒針者、四逆湯主之。\n\n**現代語訳**（訳：社員案）\n傷寒で脈が浮、自然に汗が出て、小便の回数が多く、胸苦しく、軽く悪寒がし、脚がひきつるものに、かえって桂枝（湯）を与えてその表を攻めようとするのは誤りである。これを服してすぐに手足が冷え（厥し）、咽の中が乾き、もだえ苦しんで吐き戻すものには、甘草乾姜湯を作って与え、その陽気を回復させる。もし厥が治って足が温かくなったものには、さらに芍薬甘草湯を作って与えると、その脚はすぐに伸びる。もし胃気が調和せず、うわごとを言うものには、調胃承気湯を少し与える。もし重ねて発汗させ、さらに焼針を加えたものは、四逆湯がこれを主治する。\n\n### 『傷寒論』弁太陽病脈証并治中第六\n\n**書き下し**（読み：社員案）\n汗を発して後、悪寒する者は、虚するが故なり。悪寒せず但だ熱する者は、実なり。当に胃気を和すべし。調胃承気湯を与う。\n\n傷寒十三日、経を過ぎて譫語する者は、熱有るを以てなり。当に湯を以て之を下すべし。若し小便利する者は、大便当に鞕かるべし。而るに反って下利し、脈調和する者は、医、丸薬を以て之を下すを知る。其の治に非ざるなり。若し自ら下利する者は、脈当に微にして厥すべし。今反って和する者は、此れ内実と為すなり。調胃承気湯之を主る。\n\n**原文**（翻刻確認）\n發汗後惡寒者、虛故也。不惡寒但熱者、實也。當和胃氣、與調胃承氣湯。\n\n傷寒十三日、過經、譫語者、以有熱也、當以湯下之。若小便利者、大便當鞕、而反下利、脈調和者、知醫以丸藥下之、非其治也。若自下利者、脈當微厥、今反和者、此為內實也、調胃承氣湯主之。\n\n**現代語訳**（訳：社員案）\n発汗させた後に悪寒する者は、虚しているためである。悪寒せずただ熱がある者は、実である。胃気を調和させるべきである。調胃承気湯を与える。\n\n傷寒にかかって十三日、（病が）経を過ぎてうわごとを言う者は、熱があるためである。湯液でこれを下すべきである。もし小便がよく出る者は、大便は硬くなるはずである。それなのにかえって下痢し、脈が調和している者は、医者が丸薬でこれを下したのだとわかる。それは適切な治療ではない。もし自然に下痢する者であれば、脈は微で手足が冷えるはずである。いまかえって脈が調和している者は、内が実しているのである。調胃承気湯がこれを主治する。\n\n### 『傷寒論』弁陽明病脈証并治第八\n\n**書き下し**（読み：社員案）\n陽明病、吐せず下せず、心煩する者は、調胃承気湯を与うべし。\n\n太陽病三日、汗を発して解せず、蒸蒸として発熱する者は、胃に属するなり。調胃承気湯之を主る。\n\n**原文**（翻刻確認）\n陽明病、不吐不下、心煩者、可與調胃承氣湯。\n\n太陽病三日、發汗不解、蒸蒸發熱者、屬胃也、調胃承氣湯主之。\n\n**現代語訳**（訳：社員案）\n陽明病で、吐かせても下させてもいないのに、胸苦しい者は、調胃承気湯を与えてよい。\n\n太陽病にかかって三日、発汗させても解けず、蒸し上げるように（内から）熱が出る者は、胃に属する病である。調胃承気湯がこれを主治する。\n\n### 注記\n- 資料は、本方が『傷寒論』の二十箇所ほどに載るとする。ここには資料が条文を挙げる条だけを置いた。弁太陽病脈証并治上第五の条は、資料では「若し胃気和せず、譫語する者、少し調胃承気湯を与う」の部分だけが引かれる（前後は芍薬甘草湯の条として引くとする）\n- 資料の書き下しは「譫語」を「讝語」と書く。字体の違いとして、本文は翻刻の「譫語」を採った\n- 資料は、弁太陽病脈証并治上第五の方を「大黄・甘草・芒消」、弁太陽病脈証并治中第六の発汗後の条の方を「芒消・甘草・大黄」とする。翻刻は「芒硝」と書く（「消」の字は要原本照合）。翻刻では、発汗後の条の後ろに方の行はない（翻刻確認）\n- 資料は、本方は原典の二つ目の後条文にいうように本来は頓服用であるとする。翻刻の調胃承気湯方（弁太陽病脈証并治上第五）の服用法は「少少溫服之」で、翻刻の弁陽明病脈証并治第八には調胃承気湯の方の行がなく、頓服の記載は確かめられなかった（要原本照合）\n- 篇名は、維基文庫の翻刻では「辨太陽病脈證並治（上）第五」「辨太陽病脈證並治（中）第六」「辨陽明病脈證並治第八」", "出典": "### 原典の構成\n- 『傷寒論』：大黄4両（皮を去り、清酒で洗う）、甘草2両（炙）、芒硝半升（翻刻確認。弁太陽病脈証并治上第五の調胃承気湯方による）\n\n### 原典の服用法\n- 『傷寒論』：3味を水3升で煮て1升を取り、滓を去る。芒硝を入れ、さらに火にかけて微かに煮て沸かし、少しずつ温服する（翻刻確認。弁太陽病脈証并治上第五の調胃承気湯方による）\n\n### 処方の変遷\n- 本方は大黄甘草湯に芒硝を加えた方とも解釈できるとされる。大承気湯・小承気湯との違いは、甘草があり枳実・厚朴がないことだけとされる（要原本照合）\n- 『太平聖恵方』巻第十一・治陽毒傷寒諸方には、陽毒の傷寒で煩熱し大便が通じないものに、川大黄・川芒硝を搗いて水煎服する方が載るとされる。甘草を去った方（要原本照合）\n- 『素問病機気宜保命集』巻中・熱論第十四には、本方に当帰を加えて姜棗水煎する当帰承気湯が載るとされる（要原本照合）\n- 『衛生宝鑑』巻十三・名方類集・瘡腫門には、本方の3味を丸剤とした破棺丹が瘡腫・一切の風熱に用いる方として載るとされる。大黄は半生半熟。『玉機微義』巻之十五・瘡瘍門・辛涼攻裏之剤、『奇効良方』巻之五十四・瘡瘍門・附論・瘡科通治方、『医学綱目』巻之十九・心小腸部・癰疽所発部分名状不同・疔瘡にも、同じ破棺丹が載るとされる（要原本照合）\n- 『丹渓心法』巻五・帯下九十の戴人玉燭散は、当帰・芍薬・川芎・熟地黄・芒硝・大黄・甘草を姜煎する方で、四物湯合調胃承気湯にあたるとされる。『医方考』巻之六・疥瘡門第六十七の玉燭散は、熟地黄を生地黄に、芍薬を赤芍薬に、芒硝を朴硝に替えた方とされる（要原本照合）\n- 医療用エキス剤は、ツムラ調胃承気湯エキス顆粒（医療用）（1日量7.5g中、日局ダイオウ2.0g・日局カンゾウ1.0g・日局無水ボウショウ0.5g。識別コード ツムラ／74。PMDA 添付文書 2023年12月改訂 第1版で確認）。原典の芒硝は、添付文書では無水芒硝（無水ボウショウ）", "構成": "大黄・甘草・無水芒硝", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "四君子湯", "名前": "四君子湯", "読み": "しくんしとう", "ツムラ番号": "75", "出典": "太平恵民和剤局方（巻之三・一切気 附 脾胃・積聚）", "別名": "", "本文": {"条文": "### 『太平恵民和剤局方』巻之三・一切気 附 脾胃・積聚\n\n**書き下し**（読み：社員案）\n栄衛の気虚し、臓腑怯弱にして、心腹脹満し、全く食を思わず、腸鳴泄瀉し、嘔噦吐逆するを治す。大いに宜しく之を服すべし。\n\n**原文**（翻刻確認）\n治栄衛気虚、臓腑怯弱、心腹脹満、全不思食、腸鳴泄瀉、嘔噦吐逆。大宜服之。\n\n**現代語訳**（訳：社員案）\n栄衛の気が虚し、臓腑が弱く、心窩部から腹が張って膨れ、まったく食べたいと思わず、腹が鳴って下痢し、えずいて吐き戻すものを治す。大いにこれを服するのがよい。\n\n### 注記\n- 『和剤局方』の翻刻（四庫全書本）は旧字体（榮衞氣虚臟腑怯弱心腹脹滿…）。本文は新字体にした\n- 『和剤局方』の条の「臓腑」「脹満」は、資料の書き下しでは「蔵腑」「張満」と書かれる（要原本照合）。本文は翻刻の字を採った\n- 『和剤局方』の構成の「白朮」は、翻刻では「白术」と書かれる。本文は「白朮」にした", "出典": "### 原典の構成\n- 『和剤局方』（四君子湯）：人参（蘆を去る）・甘草（炙）・茯苓（皮を去る）・白朮 各等分（翻刻確認）\n\n### 原典の服用法\n- 『和剤局方』（四君子湯）：細末とし、1回2銭を水1盞で7分まで煎じ、通口に服す。時に拘わらない。塩少々を入れて白湯で点服してもよい。常に服すれば脾胃を温和し、飲食を進益し、寒邪・瘴霧の気を辟く（翻刻確認）\n\n### 処方の変遷\n- 資料の出典欄は『聖済総録』。資料は、本方の出典は従来『和剤局方』巻之三とされてきたが、それより早い『聖済総録』巻第六十三・嘔吐門・乾嘔の順気湯に、白朮・白茯苓・人参・甘草を㕮咀して姜棗で煎服する記載があるとする\n- 『聖済総録』巻第六十三・嘔吐門・乾嘔の順気湯（前身の方。方名が違う）は、胃中が和せず、気が逆して乾嘔し、飲食が下らないものを治す。白朮2両、白茯苓（黒皮を去る）1両半、人参1両、甘草（微炙）3分の4味を㕮咀して麻豆の大きさにし、1回3銭匕を水1盞に姜・棗を入れて7分まで煎じ、滓を去って温服する（翻刻確認。翻刻は簡体字の本で、「㕮咀」の1字目が欠けているので資料の字「㕮」を補った。字形は要原本照合）\n- 資料は、四君子湯は『和剤局方』では続添諸局経験秘方に属し、『和剤局方』への収載は淳祐年間（1241〜51年）とする（要確認。四庫全書本の翻刻には続添の印がない）\n- 資料は、『聖済総録』は宋の政和年間（1111〜17年）に編録され、大定年間（1161〜89年）に重刊された全二百巻の書とする（要確認）\n- 『和剤局方』の四君子湯には生姜・大棗の指示がない（翻刻確認）\n- 『聖済総録』巻第八十・水腫門・水気遍身腫満の白朮湯は、白朮・赤茯苓・人参・甘草を等分にして粗く搗いて篩い、煎じて温服する。順気湯と比べて白茯苓が赤茯苓になり、姜・棗の指示がない（翻刻確認）\n- 資料は、『小児薬証直訣』巻下の異功散（四味に陳皮を加え、姜棗で煎服）は宣和年間（1119〜25年）の成書で、四君子湯の『和剤局方』への採録より百数十年前であり、異功散を四君子湯加陳皮とみるのは誤りとする（要原本照合）\n- 現行エキス剤（ツムラ75）は 蒼朮4.0・人参4.0・茯苓4.0・甘草1.0・生姜1.0・大棗1.0g（7.5g中。PMDA 添付文書 2023年12月改訂 第1版で確認）。原典の白朮の代わりに蒼朮が入り、生姜・大棗が加わる", "構成": "蒼朮・人参・茯苓・甘草・生姜・大棗", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "竜胆瀉肝湯", "名前": "竜胆瀉肝湯", "読み": "りゅうたんしゃかんとう", "ツムラ番号": "76", "出典": "女科撮要（薛氏医案・巻上・附方并注）／蘭室秘蔵（巻下・陰痿陰汗門）／外科正宗（巻之三・下疳論）／一貫堂方", "別名": "", "本文": {"条文": "### 『女科撮要』巻上・附方并注（『薛氏医案』）\n\n**書き下し**（読み：社員案）\n肝経の湿熱、下部腫焮して痛みを作し、小便渋滞し、陰挺菌の如く、或いは物を出だすこと虫の如き等の症を治す。\n\n**原文**（翻刻確認）\n治肝經濕熱、下部腫焮作痛、小便澀滯、陰挺如菌、或出物如蟲等症。（「焮」は要原本照合）\n\n**現代語訳**（訳：社員案）\n肝経の湿熱で、陰部が腫れて熱をもち痛み、小便が渋って滞り、陰挺（陰中から突き出るもの）が菌（きのこ）のようになり、あるいは虫のような物が出るなどの症を治す。\n\n### 『蘭室秘蔵』巻下・陰痿陰汗門\n\n**書き下し**（読み：社員案）\n陰部時に復た熱して痒く、及び臊臭するを治す。\n\n**原文**（翻刻確認）\n治陰部時復熱痒及臊臭。\n\n**現代語訳**（訳：社員案）\n陰部がときおりまた熱をもって痒くなり、また臊臭（なまぐさいにおい）があるものを治す。\n\n### 『外科正宗』巻之三・下疳論\n\n**書き下し**（読み：社員案）\n肝経の湿熱、玉茎に瘡を患い、或いは便毒・懸癰、小便赤渋し、或いは久しく潰爛して愈えざるを治す。又陰囊腫痛し、紅熱甚だしき者を治す。並びに効あり。\n\n**原文**（翻刻確認）\n治肝經濕熱、玉莖患瘡、或便毒・懸癰、小便赤澀、或久潰爛不愈。又治陰囊腫痛、紅熱甚者並效。\n\n**現代語訳**（訳：社員案）\n肝経の湿熱で、陰茎に瘡ができ、あるいは便毒・懸癰ができ、小便が赤く渋り、あるいは長く潰れただれて治らないものを治す。また陰嚢が腫れて痛み、赤みと熱がひどいものを治す。いずれにも効がある。\n\n### 注記\n- 『女科撮要』の翻刻は簡体字の本で、原文は繁体字にそろえて書いた（肝经湿热→肝經濕熱、涩滞→澀滯、阴→陰、虫→蟲 など）。字形の判断には使えない（要原本照合）\n- 『女科撮要』の「腫焮作痛」の「焮」は、翻刻ではこの字の所が空白になっていて確かめられない。資料の書き下しの字（腫焮）を本文に置いた（要原本照合）\n- 『蘭室秘蔵』の巻は、四庫全書本（3巻本）の翻刻では巻下、資料では巻之五（要原本照合）\n- 『蘭室秘蔵』の「陰」は、四庫全書本の翻刻では「隂」と書かれる（要原本照合）\n- 『外科正宗』の論の番号は、資料では「下疳論第三十六」、翻刻では「下疳論第三十一」（巻三下部癰毒門の中）。表題には巻と論名だけを書いた（要原本照合）\n- 『外科正宗』の翻刻は繁体字と簡体字の混じる本で、原文は繁体字にそろえて書いた（字形は要原本照合）\n- 『外科正宗』では方名の後に方歌「龍膽瀉肝湯地黃、車前澤瀉麥冬當、黃芩梔子甘草等、濕用黃連秘大黃」が置かれる。方歌に「麥冬」とあるが、構成の生薬には麦門冬がない（翻刻確認。句の切り方は社員による）\n- 条文の順は、現行エキス剤（ツムラ76）と構成が一致する『女科撮要』を先頭にし、構成の違う『蘭室秘蔵』『外科正宗』を資料の出典欄の順で後ろに置いた", "出典": "### 原典の構成\n- 『女科撮要』巻上・附方并注：竜胆草（酒拌、炒黄）・沢瀉 各1銭、車前子（炒）・木通・生地黄（酒拌）・当帰尾（酒拌）・山梔（炒）・黄芩・生甘草 各5分（翻刻確認）\n- 『蘭室秘蔵』巻下・陰痿陰汗門：柴胡梢・沢瀉 各1銭、車前子・木通 各5分、生地黄・当帰梢・草竜胆 各3分（翻刻確認）\n- 『外科正宗』巻之三・下疳論：竜胆草・連翹・生地黄・沢瀉 各1銭、車前子・木通・帰尾・山梔・甘草・黄連・黄芩 各5分、大黄2銭（便秘に加える）（翻刻確認）\n\n### 原典の服用法\n- 『女科撮要』巻上・附方并注：水で煎じて服す（翻刻確認）\n- 『蘭室秘蔵』巻下・陰痿陰汗門：麻豆大に刻み、全部を1服とし、水3盞で煎じて1盞とし、滓を去って空腹時にやや熱くして服す。服したあとすぐに美膳（よい食事）で圧える（翻刻確認）\n- 『外科正宗』巻之三・下疳論：水2鍾で煎じて8分とし、食前に服す（翻刻確認）\n\n### 処方の変遷\n- 『蘭室秘蔵』（李杲・金）の竜胆瀉肝湯は柴胡梢を含み、黄芩・山梔・甘草を含まない7味（翻刻確認）。資料は、これが歴史的には基源で、『薛氏医案』の方は柴胡を去り黄芩・山梔子・甘草を加えた形にあたるとする（要原本照合）\n- 『蘭室秘蔵』の方後には、柴胡は肝に入って引経となり、沢瀉・車前子・木通の淡滲の味で小便を利し、生地黄・草竜胆の苦寒で酒の湿熱を瀉し、当帰で肝中の血の不足を滋すという薬能の注がある（翻刻確認）\n- 『薛氏医案』（薛己）の『女科撮要』巻上・附方并注の竜胆瀉肝湯は9味（翻刻確認）。資料は、本方の『薛氏医案』方はこれによるとし、多味剤の五淋散の加減方で、『古今医鑑』の五淋散の一方から茯苓・芍薬・滑石を去り竜胆を加えた形にあたるとする（要原本照合）\n- 『万病回春』巻之八・便毒にも竜胆瀉肝湯が載る（翻刻確認）。資料は『薛氏医案』方と同処方とするが、翻刻では甘草が見当たらず、分量は竜胆草・沢瀉の各1銭半しか書かれていない（要原本照合）\n- 『外科正宗』の方は『薛氏医案』方に連翹・黄連を加え、便秘には大黄を加える（翻刻確認）\n- 一貫堂方の竜胆瀉肝湯は、資料の組成では 竜胆・沢瀉 各2、当帰・地黄・黄芩・山梔子・木通・車前子・甘草・川芎・芍薬・黄連・黄柏・連翹・薄荷・浜防風 各1.5 の16味。資料は、浜防風はわが国で防風の代用品として処方されてきたもので、一貫堂方としては防風で指示されているとする（要原本照合）\n- 資料は、一貫堂方を四物湯と『万病回春』の黄連解毒湯（通常の黄連解毒湯加柴胡・連翹）を合方し甘草を加えた四物黄連解毒湯から柴胡を去り、『薛氏医案』方を合方して薄荷・防風を加えた方剤とし、『外科正宗』方から大黄を去り川芎・芍薬・黄柏・薄荷・防風を加えた方剤と表現すれば充分とする（要原本照合）\n- 資料は、『薛氏医案』方と一貫堂方は同名異方で、エキス製剤メーカーの間でも、『薛氏医案』方を出典として製剤するメーカーと一貫堂方を出典として製剤するメーカーがあるとする（各社の製品の構成は要確認）\n- 現行エキス剤（ツムラ76）は7.5g中、地黄・当帰・木通 各5.0g、黄芩・車前子・沢瀉 各3.0g、甘草・山梔子・竜胆 各1.0g の9味で、『薛氏医案』方と同じ構成（PMDA 添付文書 2023年12月改訂 第1版で確認）。添付文書に出典の欄はない", "構成": "地黄・当帰・木通・黄芩・車前子・沢瀉・甘草・山梔子・竜胆", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "芎帰膠艾湯", "名前": "芎帰膠艾湯", "読み": "きゅうききょうがいとう", "ツムラ番号": "77", "出典": "金匱要略（婦人妊娠病脈証并治第二十）", "別名": "", "本文": {"条文": "### 『金匱要略』婦人妊娠病脈証并治第二十\n\n**書き下し**（読み：社員案）\n師曰く、婦人漏下する者有り、半産の後、因りて続けて下血し都て絶えざる者有り、妊娠下血する者有り。仮令えば妊娠して腹中痛むは、胞阻と為す。膠艾湯之を主る。\n\n**原文**（翻刻確認）\n師曰、婦人有漏下者、有半產後因續下血都不絕者、有妊娠下血者、假令妊娠腹中痛、為胞阻、膠艾湯主之。\n\n**現代語訳**（訳：社員案）\n師が言う。婦人には、不正出血（漏下）が続く者がおり、流産（半産）の後にそのまま出血が続いてまったく止まらない者がおり、妊娠中に出血する者がいる。もし妊娠して腹中が痛むなら、これを胞阻という。膠艾湯がこれを主治する。\n\n### 注記\n- 条文の方名は「膠艾湯」、方の見出しは「芎帰膠艾湯方」（翻刻確認）\n- 四部叢刊本（明嘉靖俞橋刊本の影印）の翻刻では、方の見出しの下に小字の注「一方加乾姜一两胡氏治婦人胞動無乾姜」がある。維基文庫の『金匱要略』の翻刻にはこの注がない（翻刻確認）\n- 四部叢刊本の翻刻は「姙娠」「半産」「不絶」と書く。字体だけの違い（要原本照合）\n- 生薬の「芎窮」は、維基文庫の2つの翻刻ともこの字。資料は「芎藭」と書く（要原本照合）", "出典": "### 原典の構成\n- 『金匱要略』：芎窮・阿膠・甘草 各2両、艾葉・当帰 各3両、芍薬4両、乾地黄（分量の記載なし）（翻刻確認）\n- 乾地黄の分量は、維基文庫の『金匱要略』・四部叢刊本の2つの翻刻とも書かれていない。資料にも原典の分量の記載がない（要原本照合）\n\n### 原典の服用法\n- 『金匱要略』：7味を水5升・清酒5升を合わせて煮て3升を取り、滓を去り、膠を入れて溶かしきり、1升を温服する。日に3回服す。治らなければさらに作る（翻刻確認）\n\n### 処方の変遷\n- 処方の形は四物湯（地黄・芍薬・当帰・川芎）に阿膠・甘草・艾葉を加えたものだが、資料は歴史的には全く逆であるとする。四物湯の出典は資料のこの項に書かれていない（要確認）\n- 『金匱要略』婦人雑病脈証并治第二十二に、婦人の陥経で漏下が黒く治らないものに膠姜湯が主る、という方のない条がある。林億らの注は、諸本に膠姜湯の方がなく、前の妊娠病篇の膠艾湯であろうとする（翻刻確認）。四部叢刊本の翻刻の注には「前」の字がない（要原本照合）\n- 『備急千金要方』巻第二 婦人方上・妊娠諸病第四・胎動及数堕胎第一に、方名なしで艾葉・阿膠・芎藭・当帰・甘草の5味の方がある。同じ篇の下血第七には外傷・打撲による流産を防ぐ膠艾湯方がある（要原本照合）\n- 『医方類聚』巻之二百二十四 胎産救急方・漏胎では、この5味を孫真人方の芎帰膠艾湯として引く。同じく傷胎では『集験方』の膠艾湯（当帰・地黄・艾葉・阿膠・川芎。一方は地黄なく甘草を加える）を引き、結局5味と同じになる。資料は、一般に『千金方』の芎帰膠艾湯とされる5味の方は、本来『集験方』の膠艾湯の一方と称すべきとする（要原本照合）\n- 『外台秘要方』第三十三巻 婦人上・妊娠胎動方には、『小品方』からの引用として阿膠・艾葉の2味の膠艾湯が載る（要原本照合）\n- 藺道人『理傷続断方』又治傷損方論の膠艾湯は乾地黄・阿膠・川芎・艾葉（要原本照合）\n- 『太平聖恵方』巻第十・治傷寒鼻衄諸方の艾葉湯方は艾葉・生乾地黄・阿膠。巻第七十五・治妊娠胎動下血諸方の阿膠散方は阿膠・艾葉・芎藭・当帰・熟地黄を散とし、温酒で調下する（要原本照合）\n- 『聖済総録』巻第一百五十四 妊娠門・妊娠驚胎の当帰湯方は芎帰膠艾湯に人参を加えた方。妊娠胎動の膠艾湯方は芎帰膠艾湯の7味を水と酒で煎服し、小艾葉湯方は先の5味。巻第一百五十五 妊娠門・妊娠卒下血の膠艾湯方は原典の7味、芎藭湯方は先の5味（要原本照合）\n- 『三因極一病証方論』巻之十七 婦人論・漏阻例の膠艾湯は熟地黄・艾葉・当帰・甘草・芍薬・川芎・阿膠・黄耆を剉散として煎服する（芎帰膠艾湯加黄耆）。胸中逆冷には生姜5片・棗3枚を加える（要原本照合）\n- 『医塁元戎』巻十一 厥陰証・四物湯例の四物膠艾湯は四物湯加阿膠甘草艾（要原本照合）\n- 『千金方』巻第二十五 備急・被打第三の大膠艾湯は芎帰膠艾湯加乾姜。『千金翼方』第二十 雑病下・従高堕下第四にもほぼ同じ条がある（要原本照合）\n- 片倉鶴陵『産科発蒙』巻二・妊娠頓仆失踞胎動第四の大阿膠湯は当帰・芍薬・地黄・阿膠・艾葉・乾姜・川芎・甘草で、四部叢刊本の注の「一方加乾姜一两」の方にあたる（要原本照合）\n- 現行エキス剤（ツムラ77）は 地黄・芍薬・当帰・艾葉・甘草・川芎・阿膠 の7味で、原典と同じ生薬からなる（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "地黄・芍薬・当帰・艾葉・甘草・川芎・阿膠", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "麻杏薏甘湯", "名前": "麻杏薏甘湯", "読み": "まきょうよくかんとう", "ツムラ番号": "78", "出典": "金匱要略（痙湿暍病脈証并治第二）", "別名": "", "本文": {"条文": "### 『金匱要略』痙湿暍病脈証并治第二（風湿の条）\n\n**書き下し**（読み：社員案）\n病者、一身尽く疼み、発熱し、日晡所劇しき者は、風湿と名づく。此の病は汗出でて風に当たるに傷られ、或いは久しく冷を取るに傷られて致す所なり。麻黄杏仁薏苡甘草湯を与うべし。\n\n**原文**（翻刻確認）\n病者一身盡疼，發熱，日晡所劇者，名風濕。此病傷於汗出當風，或久傷取冷所致也。可與麻黃杏仁薏苡甘草湯。\n\n**現代語訳**（訳：社員案）\n病人が全身くまなく痛み、発熱して、夕方（日晡）のころにひどくなるものを風湿という。この病は、汗が出ているときに風に当たって傷られたり、あるいは長いあいだ冷えにさらされて傷られたりして起こるものである。麻黄杏仁薏苡甘草湯を与えるとよい。\n\n### 注記\n- 篇名は維基文庫『金匱要略』の翻刻の「痙濕暍病脈證並治第二」を採った。四部叢刊本の翻刻では「痓濕暍病脉證治第二」と書かれる（要原本照合）\n- 四部叢刊本（明嘉靖俞橋刊本の影印）の翻刻では「久」は「乆」、「熱」は「𤍠」と書かれる（字体の違い。要原本照合）\n- 四部叢刊本の翻刻では杏仁の注が「十箇去皮火炒」と書かれる（維基文庫『金匱要略』の翻刻は「十個（去皮尖，炒）」）（要原本照合）\n- 四部叢刊本の翻刻では服用法の「每服四錢匕」が「毎服四錢七」と書かれる（要原本照合）", "出典": "### 原典の構成\n- 『金匱要略』痙湿暍病第二：麻黄半両（去節・湯泡）、甘草1両（炙）、薏苡仁半両、杏仁10個（去皮尖・炒）（翻刻確認）\n\n### 原典の服用法\n- 『金匱要略』痙湿暍病第二：麻豆大に刻み、1回4銭匕を水1盞半で8分に煮て、滓を去って温服する。微汗があれば風を避ける（翻刻確認）\n\n### 処方の変遷\n- 原典での方名は麻黄杏仁薏苡甘草湯（翻刻確認）。『金匱要略』痙湿暍病第二では麻黄加朮湯の条の次に載る（翻刻確認）\n- 『外台秘要方』巻十九・風湿方には、「又」の方として、湿家の病の始めに与える「薏苡麻黄湯」が載る（資料はこれを『古今録験』の方とする。要原本照合）。薏苡半升、麻黄4両（去節）、甘草2両（炙）、杏仁2両の4味を㕮咀し、水5升で2升に煮て2回に分けて服す。汗が出ればすぐ治る。湿家で煩疼するものは甘草麻黄湯で発汗させ、治らなければ更に合し（原文「不差更合」）、飲家には白朮4両を加えて白朮麻黄湯と名づける。海藻・菘菜・桃・李・雀肉などを忌み、小字注に「此れ本は仲景方、分両小しく異なる」とある（翻刻確認。四庫全書本）\n- 本方の4味は『傷寒総病論』巻第三では杏仁薏苡仁湯、『全生指迷方』巻二・風湿と『衛生宝鑑』巻十五では薏苡仁湯の名で載るとされる（要原本照合）\n- 『医学入門』巻三下・傷寒用薬賦に、麻黄・薏苡仁各2銭、杏仁・甘草各1銭を水煎する麻杏薏甘湯の名で載るとされる。資料はここで初めて麻杏薏甘湯と呼ばれたとする（要原本照合）\n- 現行エキス剤（ツムラ78）は7.5g中、薏苡仁10.0・麻黄4.0・杏仁3.0・甘草2.0g の4味（PMDA 添付文書 2023年12月改訂 第1版で確認）。添付文書に出典の欄はない", "構成": "薏苡仁・麻黄・杏仁・甘草", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "平胃散", "名前": "平胃散", "読み": "へいいさん", "ツムラ番号": "79", "出典": "簡要済衆方（医方類聚 巻之十・五蔵門七の引用）／太平恵民和剤局方（巻三・一切気門）／博済方（巻二・五蔵証治）", "別名": "", "本文": {"条文": "### 『簡要済衆方』（『医方類聚』巻之十・五蔵門七・論脾蔵病候の引用）\n\n**書き下し**（要原本照合）\n\n**原文**（要原本照合）\n\n**現代語訳**\n\n### 『太平恵民和剤局方』巻三・一切気門\n\n**書き下し**（読み：社員案）\n\n脾胃和せず、飲食を思わず、心腹・脇肋脹満して刺痛し、口苦く味無く、胸満ちて短気し、嘔噦・悪心し、噫気・呑酸し、面色萎黄、肌体痩弱、怠惰嗜臥し、体重く節痛むを治す。常に多く自利し、或いは霍乱を発し、及び五噎八痞・膈気・及胃（反胃）には、並びに宜しく之を服すべし。\n\n**原文**（翻刻確認）\n\n治脾胃不和、不思飲食、心腹脇肋脹滿刺痛、口苦無味、胸滿短氣、嘔噦惡心、噫氣吞酸、面色萎黄、肌體瘦弱、怠惰嗜臥、體重節痛、常多自利、或發霍亂、及五噎八痞、膈氣及胃、並宜服之。\n\n**現代語訳**（訳：社員案）\n\n脾胃が調和せず、食欲がなく、みぞおちから腹、脇腹が張って刺すように痛み、口が苦くて味がわからず、胸がつかえて息切れし、からえずきや吐き気があり、げっぷや呑酸があり、顔色が黄ばみ、体が痩せ衰え、だるくて横になりたがり、体が重く関節が痛むものを治す。いつも下痢しがちなもの、霍乱を起こしたもの、また五噎八痞・膈気・反胃（要確認）には、いずれもこれを服用するのがよい。\n\n### 『博済方』巻二・五蔵証治\n\n**書き下し**（読み：社員案）\n\n脾胃の気和せず、飲食を思わざるを治す。\n\n**原文**（翻刻確認）\n\n治脾胃氣不和、不思飲食。\n\n**現代語訳**（訳：社員案）\n\n脾胃の気が調和せず、食欲がないものを治す。\n\n### 注記\n- 『簡要済衆方』は維基文庫に翻刻が見つからず（『医方類聚』巻十のページもない）、原文・書き下し・現代語訳は空欄（要原本照合）。資料（論考⑤）によれば、主治は胃気の不和を治し気を調え食を進めるという短い一句で、構成は蒼朮・厚朴・陳橘皮・甘草の4味\n- 『和剤局方』の「膈氣及胃」は四庫全書本の字（翻刻確認）。同じ巻の棗肉平胃散の同じ主治では「胷氣反胃」、別の翻刻本では「…反胃」（前の字は行の欠けで見えない）、資料の書き下しでは「膈気飜胃」と書かれる（要原本照合）。本文は四庫全書本の字のままとし、書き下しは「及胃（反胃）」とした（要確認）\n- 『和剤局方』の四庫全書本の「靣色」「㦯發」「嗜卧」は、本文を「面色」「或發」「嗜臥」とした（字体の違い）\n- 『博済方』の条は方名の下の一句だけで、後の服用法の文（丸剤の平胃丸、湯剤の白朮湯、人参・茯苓の2味はもとはなかったとする文）は「出典」の見出しに記す（翻刻確認）\n- 3書の順は、現行エキス剤（ツムラ）と構成が一致する『簡要済衆方』『和剤局方』を先にし、人参・茯苓を含む『博済方』を後ろにした。資料の出典欄は『博済方』『簡要済衆方』で、『和剤局方』は論考で「一般に出典とされる」と挙げられる（要確認）", "出典": "### 原典の構成\n- 『簡要済衆方』（『医方類聚』の引用）：蒼朮・厚朴・陳橘皮・甘草 の4味。分量は資料に記載がない（要原本照合）\n- 『和剤局方』：蒼朮（粗皮を去り米泔に2日浸す）5斤、厚朴（粗皮を去り姜汁で製し香ばしく炒る）・陳皮（白を去る）各3斤2両、甘草（炒る）30両 の4味（翻刻確認）\n- 『博済方』：厚朴（粗皮を去り姜汁を塗って香ばしく炙る）2両半、甘草（炙る）1両半、陳橘皮（瓤を去る）2両半、人参（蘆を去る）1両、蒼朮（米泔水に2日浸し皮を削る）4両、茯苓（皮を去る）1両 の6味（翻刻確認）\n\n### 原典の服用法\n- 『簡要済衆方』（『医方類聚』の引用）：散とし、生姜・棗を入れて食前に煎服する（要原本照合）\n- 『和剤局方』：細末とし、1回2銭を水1盞に生姜2片・乾棗2枚を入れて同じく7分に煎じ、姜・棗を去って熱いうちに空腹時・食前に服す。塩ひとつまみを入れ沸湯で点服してもよい。常に服すれば気を調え胃を暖め、宿食を化し、痰飲を消し、風寒冷温（別の翻刻本は「冷湿」。要原本照合）・四時非節の気を辟ける（翻刻確認）\n- 『博済方』：6味を杵いて末とし、1回1大銭を水1盞に生姜・棗子を入れて同じく7分に煎じ、滓を去って温服する。空腹時に服す。或いは細末を白蜜で梧桐子大の丸とし、1回10丸を塩湯で嚼み下す（平胃丸）。湯として塩を入れて点服するものは白朮湯とも曰う（翻刻確認）\n\n### 処方の変遷\n- 資料は、本方の出典は一般に『和剤局方』巻之三・一切気 附 脾胃積聚とされ、平胃散は原書五巻本に属し、大観年間（1107〜10年）の刊行とする（要確認）\n- 『博済方』の平胃散の方後には、この薬はもと人参・茯苓の2味がなく、好事の君子が加えたとある（翻刻確認）。資料は、元の湯剤を白朮湯と称したことから蒼朮の代わりに白朮が配されていたのではないか、白朮を蒼朮に変えたのは王袞であろうとする（要確認）\n- 資料は、『博済方』は原書の伝本がなく、『永楽大典』に載る文から輯めて編次したものとする（四庫全書提要の引用。要原本照合）\n- 資料は、現在の処方と同一構成で記載されたのは周応編『簡要済衆方』で、『医方類聚』巻之十・五蔵門七・簡要済衆方・論脾蔵病候に引かれるとする（要原本照合）。『医籍考』巻四十五・方論二十三には、平胃散は世に局方から出たとされるがこの書に本づくとの注があるとする（要原本照合）\n- 『和剤局方』巻二・傷寒（附 中暑）の対金飲子は、陳皮（半斤）・蒼朮・厚朴・甘草（各2両）を粗末とし生姜2片で煎じる方で、平胃散と同じ4味で分量と煎じ方が異なる（翻刻確認）。資料は、平胃散とは方後の調理で大棗の有無の差だけとし、呉直閣増諸家名方（1131〜62年）に属するとする（要確認）\n- 『和剤局方』巻三の棗肉平胃散は、平胃散と同じ主治で、陳橘皮・厚朴 各3斤2両、甘草・生姜・紅棗 各2斤、蒼朮5斤を水で煮て乾かし細末とし、塩湯で点服する（翻刻確認）。資料は、続添諸局経験秘方（1241〜52年）に属するとする（要確認）\n- 資料は、『勿誤薬室方函』巻下・平胃散は出典を『簡要済衆方』とし、条文・薬味は同書と同じで、調理の生姜・棗の指示はないとする（要原本照合）\n- 資料によれば、本方と五苓散の合方は芍薬を含まない胃苓湯、小柴胡湯との合方は柴平湯。五積散には本方がそっくり含まれる\n- 現行エキス剤（ツムラ79）は7.5g中、蒼朮4.0g・厚朴3.0g・陳皮3.0g・大棗2.0g・甘草1.0g・生姜0.5g の6味（PMDA 添付文書 2023年12月改訂 第1版で確認）。原典の煎じるときに加える生姜・大棗が構成に入る。添付文書に出典の欄はない", "構成": "蒼朮・厚朴・陳皮・大棗・甘草・生姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "柴胡清肝湯", "名前": "柴胡清肝湯", "読み": "さいこせいかんとう", "ツムラ番号": "80", "出典": "外科正宗（巻之二・鬢疽論）／一貫堂方", "別名": "", "本文": {"条文": "### 『外科正宗』巻之二・鬢疽論\n\n**書き下し**（読み：社員案）\n鬢疽の初起、未だ成らざる者を治す。陰陽・表裏を論ずる毋く、倶に之を服すべし。\n\n**原文**（翻刻確認）\n治鬢疽初起未成者、毋論陰陽・表裏、倶可服之。\n\n**現代語訳**（訳：社員案）\n鬢疽の初期で、まだ（疽が）できあがっていないものを治す。陰陽・表裏を問わず、いずれにも服用させてよい。\n\n### 注記\n- 『外科正宗』の翻刻は簡体字の混じる本で、原文は繁体字にそろえて書いた（表里→表裏、俱→倶 など）。字形の判断には使えない（要原本照合）\n- 論の番号：資料は「鬢疽論第二十五」、翻刻は「鬢疽論第二十」（翻刻では第二十五は巻三の流注論）。表題には巻と論名だけを書いた（要原本照合）\n- 方名の後に方歌「柴胡清肝芎芍歸、黃芩梔子地黃隨。防風牛子天花粉、甘草連翹一處宜。」が置かれる（翻刻確認）\n- 『外科正宗』の方は柴胡清肝「湯」。薛己系の書の同名方は柴胡清肝「散」で、構成も異なるため条文には上げず、処方の変遷に書いた", "出典": "### 原典の構成\n- 『外科正宗』巻之二・鬢疽論：川芎・当帰・白芍・生地黄・柴胡・黄芩・山梔・天花粉・防風・牛蒡子・連翹・甘草節 各1銭（翻刻確認）\n\n### 原典の服用法\n- 『外科正宗』巻之二・鬢疽論：水2鍾で煎じて8分とし、食遠（食事から間をあけて）服す（翻刻確認）\n\n### 処方の変遷\n- 現行の柴胡清肝湯は一貫堂方で、一貫堂では柴胡清肝散と呼ぶ。資料は、『森道伯先生伝』『漢方一貫堂医学』とも柴胡清肝散と命名し、荊芥連翹湯・竜胆瀉肝湯とともに解毒証体質の改善薬とする（要原本照合）\n- 同名の柴胡清肝散が薛己系の書に載る。『明医雑著』（薛己注本）巻之六の附方に2方：①柴胡・黄芩 各1銭、黄連・山梔 各7分、当帰1銭、川芎6分、生地黄・牡丹皮 各1銭、升麻8分、甘草3分（翻刻確認）、②柴胡・黄芩・人参 各3分、山梔・川芎 各5分、連翹・桔梗 各4分、甘草3分（翻刻確認）\n- 『外科枢要』（薛己）巻四・治瘡瘍各症附方の柴胡清肝散：柴胡1銭半、黄芩・人参・川芎 各1銭、山梔1銭半、連翹・桔梗 8分、甘草5分（翻刻確認。連翹の量は翻刻の区切りでは桔梗と同じ8分に読める）\n- 『保嬰撮要』（薛鎧）巻六・発熱の柴胡清肝散：柴胡1銭半、黄芩・人参・川芎 各1銭、山梔1銭半、連翹・甘草 各5分、桔梗8分（翻刻確認）。資料は、人参入りの方はこれが方源で、薛己の人参入りの方は父・薛鎧の創製方を引き継いだものであろうとする（要原本照合）\n- 資料は、『外科正宗』の方が最も一貫堂方に近く、森道伯がこれから防風を去り黄連・黄柏・桔梗・薄荷を加えて一貫堂方の柴胡清肝散としたとする（要原本照合）。『外科正宗』の12味から防風を去り4味を加えると、現行エキス剤の15味と一致する（翻刻確認）\n- 資料は、一貫堂方としては四物湯に『万病回春』の黄連解毒湯（通常の黄連解毒湯加柴胡・連翹）を合方し甘草を加えた四物黄連解毒湯に、桔梗・牛蒡子・栝楼根・薄荷を配した方剤とする（要原本照合）\n- 四物湯の出典は『理傷続断方』、黄連解毒湯の出典は『肘後百一方』とされる。資料の出典欄にはこの2書と『薛氏医案』も挙がる（要確認）\n- 方名：『外科正宗』で初めて柴胡清肝湯と記載されたが、これは一貫堂の方ではない。一貫堂方を柴胡清肝湯と呼ぶ記載は、資料によれば『漢方後世要方解説』（昭和29年初版）の「柴胡清肝湯　一貫堂経験方」が早く、『一般用漢方処方の手引き』（昭和50年初版）への掲載で柴胡清肝湯の名が定着した（要原本照合）\n- 現行エキス剤（ツムラ）は7.5g中、柴胡2.0g、黄芩・黄柏・黄連・栝楼根・甘草・桔梗・牛蒡子・山梔子・地黄・芍薬・川芎・当帰・薄荷・連翹 各1.5g の15味（PMDA 添付文書 2023年12月改訂 第1版で確認）。添付文書に出典の欄はない", "構成": "柴胡・黄芩・黄柏・黄連・栝楼根・甘草・桔梗・牛蒡子・山梔子・地黄・芍薬・川芎・当帰・薄荷・連翹", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "二陳湯", "名前": "二陳湯", "読み": "にちんとう", "ツムラ番号": "81", "出典": "万病回春（巻之二・痰飲）／太平恵民和剤局方（巻之四・痰飲 附 欬嗽）", "別名": "", "本文": {"条文": "### 『万病回春』巻之二・痰飲\n\n**書き下し**（読み：社員案）\n\n痰は湿に属し、乃ち津液の化する所なり。二陳湯　一切の痰飲、化して百病と為るを治す。此の薬之を主る。\n\n**原文**（翻刻確認）\n\n痰者屬濕、乃津液所化也。二陳湯　治一切痰飲化為百病、此藥主之。\n\n**現代語訳**（訳：社員案）\n\n痰は湿に属し、すなわち津液が変化してできたものである。二陳湯は、あらゆる痰飲が変化してさまざまな病となったものを治す。この薬がこれを主治する。\n\n### 『太平恵民和剤局方』巻之四・痰飲 附 欬嗽\n\n**書き下し**（読み：社員案）\n\n痰飲患を為し、或いは嘔吐悪心し、或いは頭眩心悸し、或いは中脘快からず、或いは発して寒熱を為し、或いは生冷を食するに因りて脾胃和せざるを治す。\n\n**原文**（翻刻確認）\n\n治痰飲為患、或嘔吐惡心、或頭眩心悸、或中脘不快、或發為寒熱、或因食生冷脾胃不和。\n\n**現代語訳**（訳：社員案）\n\n痰飲が病を起こし、あるいは嘔吐や吐き気があり、あるいはめまいや動悸があり、あるいはみぞおち（中脘）が不快で、あるいは悪寒・発熱を起こし、あるいは生ものや冷たいものを食べたために脾胃の調子が乱れたものを治す。\n\n### 注記\n- 『和剤局方』の条の最初の「或」（「或嘔吐惡心」）は、四庫全書本の翻刻では外字（SKchar 3021）で示されている。別の翻刻本と資料の書き下しの「或いは」により「或」とした（要原本照合）\n- 『和剤局方』の別の翻刻本（簡体字まじりで行の欠けがある本）では、主治の「因食生」の後の「冷脾胃」が欠け、服用法の「用水一盞」が「用水一錢」になっている。本文は四庫全書本の字を採った（要原本照合）\n- 『万病回春』の翻刻は簡体字の本で、原文は繁体字にそろえて書いた（属→屬、湿→濕、药→藥 など）。字形の判断には使えない（要原本照合）\n- 『万病回春』の条の前半（「痰は湿に属し…」）は、痰飲の篇で二陳湯の直前に太字で置かれた句（翻刻確認）\n- 2書の順は、現行エキス剤（ツムラ）と構成が一致する『万病回春』（陳皮を用い、烏梅を用いない）を先にした。資料は本方の出典を『和剤局方』とする", "出典": "### 原典の構成\n- 『和剤局方』：半夏（湯で7回洗う）・橘紅 各5両、白茯苓3両、甘草（炙る）1両半 の4味（翻刻確認）\n- 『万病回春』：陳皮（白を去る）・半夏（姜制）・白茯苓（皮を去る）・甘草 の4味。分量の記載はない（翻刻確認）\n\n### 原典の服用法\n- 『和剤局方』：㕮咀し、1回4銭を水1盞・生姜7片・烏梅1個と同じく6分に煎じ、滓を去って熱服する。時を問わない（翻刻確認。「時候」の「候」は翻刻では外字 SKchar 1974）\n- 『万病回春』：1剤を剉み、生姜3片を加えて水で煎じて服す（翻刻確認）。方後に多くの加減法が続き、烏梅は酒痰の加味の一つとして出る（翻刻確認）\n\n### 処方の変遷\n- 資料は本方の出典を『和剤局方』巻之四・痰飲 附 欬嗽とし、紹興続添方（1131〜62年）に属するとする（要確認）。別の翻刻本では二陳湯の前に「紹興續添方」の見出しがある（翻刻確認。四庫全書本には印がない）\n- 資料によれば、本方は小半夏加茯苓湯に陳皮・甘草を加えた処方。小半夏湯・小半夏加茯苓湯の出典は『金匱要略』痰飲咳嗽病脈証并治第十二（要原本照合）\n- 『備急千金要方』巻第十八・大腸腑・痰飲第六の小半夏湯は、半夏・生姜・橘皮の方で、方後に、仲景の方には橘皮・人参が入らない旨の注があるとされる（要原本照合）\n- 『聖済総録』巻第二十五・傷寒門・傷寒心悸の茯苓半夏湯は、赤茯苓・半夏・陳橘皮を姜煎する方で、二陳湯から甘草を去った形とされる（要原本照合）\n- 『和剤局方』の同じ巻の橘皮半夏湯は、陳皮・半夏 各7両を生姜10片で煎じる方で、二陳湯から茯苓・甘草を去った形（翻刻確認）\n- 『伝信適用方』巻上・治痰嗽の小半夏飲は、半夏・白茯苓・陳皮・甘草を姜煎温服する方で、橘紅が陳皮になり、烏梅は入らないとされる（要原本照合）\n- 『医塁元戎』巻八・太陰証には、『和剤局方』と同じ条文の易簡二陳湯が載り、陳皮・半夏・茯苓・甘草に姜・烏梅を加えて煎服するとされる（要原本照合）\n- 『万病回春』巻之二・痰飲の二陳湯は、橘紅でなく陳皮を用い、烏梅を用いず、生姜で煎服する（翻刻確認）。資料は、この条文がこれ以後の諸書に引用され、今日でもよく唱えられるとする\n- 現行エキス剤（ツムラ81）は7.5g中、半夏5.0g・茯苓5.0g・陳皮4.0g・甘草1.0g・生姜1.0g の5味（PMDA 添付文書 2023年12月改訂 第1版で確認）。『和剤局方』の橘紅は陳皮になり、烏梅は入らない。添付文書に出典の欄はない", "構成": "半夏・茯苓・陳皮・甘草・生姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "桂枝人参湯", "名前": "桂枝人参湯", "読み": "けいしにんじんとう", "ツムラ番号": "82", "出典": "傷寒論（巻第四・弁太陽病脈証并治下第七）／金匱玉函経（巻第三・弁太陽病形証治下第四／巻第七・方薬炮製）", "別名": "", "本文": {"条文": "### 『傷寒論』巻第四・弁太陽病脈証并治下第七\n\n**書き下し**（読み：社員案）\n太陽病、外証未だ除かざるに、而るに数（しばしば）之を下し、遂に協熱して利し、利下止まず、心下痞鞕し、表裏解せざる者は、桂枝人参湯之を主る。\n\n**原文**（翻刻確認）\n太陽病，外證未除，而數下之，遂協熱而利，利下不止，心下痞鞕，表裏不解者，桂枝人參湯主之。\n\n**現代語訳**（訳：社員案）\n太陽病で外証（表の証）がまだ除かれていないのに、何度も下したため、ついに熱を挟んで（協熱して）下痢し、下痢が止まらず、みぞおちがつかえて硬く、表も裏も解けていないものは、桂枝人参湯がこれを主治する。\n\n### 『金匱玉函経』巻第三・弁太陽病形証治下第四\n\n**書き下し**（読み：社員案）\n太陽病、外証未だ除かざるに、而るに数（しばしば）之を下し、遂に挾熱して利止まず、心下痞堅し、表裏解せざる者は、桂枝人参湯之を主る。\n\n**原文**（翻刻確認）\n太陽病，外證未除，而數下之，遂挾熱而利不止，心下痞堅，表裡不解者，桂枝人參湯主之。\n\n**現代語訳**（訳：社員案）\n太陽病で外証（表の証）がまだ除かれていないのに、何度も下したため、ついに熱を挟んで下痢が止まらず、みぞおちがつかえて硬く、表も裏も解けていないものは、桂枝人参湯がこれを主治する。\n\n### 注記\n- 『注解傷寒論』の四庫全書本（書名『傷寒論注釋』）巻四では「協」が「恊」と書かれる（字体の違い）。ほかの字は宋本と同じ（翻刻確認）\n- 『金匱玉函経』巻第三の条は宋本と比べ、「協熱」が「挾熱」、「利下不止」が「利不止」、「痞鞕」が「痞堅」となる（要原本照合）。「表裡」の「裡」は「裏」の字体の違いで、書き下しは「表裏」とした\n- 『金匱玉函経』の方（巻第七・方薬炮製の第十四）は宋本と同じ5味（翻刻確認）\n- 『金匱玉函経』巻第六・弁発汗吐下後病形証治第十九の再掲は「遂挾熱利而不止，心下痞堅，表裡不解，屬桂枝人參湯證」と書かれる（要原本照合）\n- 『千金翼方』巻第九・傷寒上・太陽病用陥胸湯法第六の桂枝人参湯の条は「遂に挟熱して」と書かれ、協熱の「協」は一般にこれに拠って「挟む」の意と解される（要原本照合）", "出典": "### 原典の構成\n- 『傷寒論』（宋本）：桂枝4両（別切）、甘草4両（炙）、白朮3両、人参3両、乾姜3両（翻刻確認）\n- 『金匱玉函経』巻第七・方薬炮製（桂枝人参湯方第十四）：桂枝・甘草（炙）各4両、人参・白朮・乾姜各3両（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』（宋本）：5味のうち、まず4味を水9升で煮て5升を取り、桂を入れて更に煮て3升を取り、滓を去り、1升を温服する。日に2回、夜に1回服す（翻刻確認）\n- 『金匱玉函経』：水9升で4味を煮て5升を取り、滓を去り、桂を入れて更に煮て3升を取り、滓を去り、1升を温服する。日に2回、夜に1回服す（翻刻確認）\n\n### 処方の変遷\n- 『傷寒論』の理中丸の湯法（人参・乾姜・甘草（炙）・白朮 各3両）に桂枝4両を加え、甘草を4両に増した構成（翻刻確認）\n- 『注解傷寒論』は「桂枝・甘草を理中湯に加う」とする（翻刻確認）\n- 『千金翼方』巻第九・傷寒上・太陽病用陥胸湯法第六にも桂枝人参湯として載る（要原本照合）\n- 『太平聖恵方』巻第十二・治傷寒心腹痞満諸方では、桂心・甘草・白朮・人参・乾姜を散として煎服する（要原本照合）\n- 逆挽湯（名古屋玄医）は本方に枳実・茯苓を加えた方で、『梧竹楼方函口訣』は本方を祖として組んだ方とする（要原本照合）\n- 現行エキス剤（ツムラ82）は 桂皮・甘草・蒼朮・人参・乾姜 の5味で、1日量7.5g中 ケイヒ4.0・カンゾウ3.0・ソウジュツ3.0・ニンジン3.0・カンキョウ2.0（g）の混合生薬の乾燥エキスを含む（PMDA 添付文書 2023年12月改訂 第1版で確認）。原典の白朮は蒼朮に、原典の「桂枝」は「ケイヒ」と書かれる。甘草は原典では桂枝と同量の4両だが、エキス剤では人参・蒼朮と同量の3.0g", "構成": "桂皮・甘草・蒼朮・人参・乾姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "抑肝散加陳皮半夏", "名前": "抑肝散加陳皮半夏", "読み": "よくかんさんかちんぴはんげ", "ツムラ番号": "83", "出典": "本朝経験方（北山人）／浅井家腹舌秘録（浅井図南）", "別名": "", "本文": {"条文": "### 『浅井家腹舌秘録』（浅井図南）・北山人の方\n\n**書き下し**（要原本照合）\n\n**原文**（要原本照合）\n\n**現代語訳**\n\n### 注記\n- 『浅井家腹舌秘録』には、左の臍の辺りから心下まで動気が盛んなものを肝木の虚に痰火が甚だしい証とし、北山人が常に抑肝散に陳皮（中）・半夏（大）を加えて数百人に効験を得た、一子相伝の方である、という趣旨の記載があり、腹図（資料の図25）が添えられるとされる（要原本照合。資料の書き下しによる）\n- 同書には続けて、臍の左側に動気がある者は肝気の虚で抑肝散を用いる条（図26）、臍の左に塊がある者は肝の邪で小柴胡湯に加味する条（図27）が並ぶとされる（要原本照合。資料の書き下しによる）\n- 『浅井家腹舌秘録』の原文の翻刻は維基文庫に見当たらない（2026-10-23 検索。要原本照合）", "出典": "### 原典の構成\n- 『浅井家腹舌秘録』：抑肝散に陳皮（中）・半夏（大）を加える（分量の数値の記載はない。要原本照合。資料の書き下しによる）\n\n### 原典の服用法\n\n### 処方の変遷\n- 資料の出典欄は「本朝経験方（北山人）」。抑肝散に陳皮・半夏を加えた日本の経験方とされる（要確認）\n- 北山人の姓名は不明。矢数道明は『北山医案』に陳皮・半夏の加味方がたびたび見えることから、北山友松子である可能性が高いとしたとされる（要確認）\n- もとの抑肝散の出典は抑肝散の項を参照\n- 現行エキス剤（ツムラ83）は7.5g中、半夏5.0g、蒼朮・茯苓 各4.0g、川芎・釣藤鈎・陳皮・当帰 各3.0g、柴胡2.0g、甘草1.5g の9味（PMDA 添付文書 2023年12月改訂 第1版で確認）。添付文書に出典の欄はない", "構成": "半夏・蒼朮・茯苓・川芎・釣藤鈎・陳皮・当帰・柴胡・甘草", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "大黄甘草湯", "名前": "大黄甘草湯", "読み": "だいおうかんぞうとう", "ツムラ番号": "84", "出典": "金匱要略（嘔吐噦下利病脈証治第十七）・外台秘要方（巻第八・胃反。必効の引用）", "別名": "", "本文": {"条文": "### 『金匱要略』嘔吐噦下利病脈証治第十七\n\n**書き下し**（読み：社員案）\n食し已りて即ち吐する者は、大黄甘草湯之を主る。（外台の方、又た吐水を治す）\n\n**原文**（翻刻確認）\n食已即吐者、大黃甘草湯主之。（外臺方、又治吐水）\n\n**現代語訳**（訳：社員案）\n食べ終わるとすぐに吐く者は、大黄甘草湯がこれを主治する。（『外台』の方。水を吐くものも治す）\n\n### 『外台秘要方』巻第八・痰飲胃反噎鯁等・胃反（必効の引用）\n\n**書き下し**（読み：社員案）\n又た胃反にて水を吐き及び食を吐するを療する方。\n\n**原文**（翻刻確認）\n又療胃反吐水及吐食方。\n\n**現代語訳**（訳：社員案）\nまた、胃反で水を吐き、食べたものを吐くものを治療する方。\n\n### 関連条文（同じ篇の胃反と欲吐の条）\n\n『金匱要略』嘔吐噦下利病脈証治第十七。資料が本方の条と比べて挙げる2条。\n\n**書き下し**（読み：社員案）\n趺陽の脈浮にして渋、浮なるは則ち虚と為し、渋なるは則ち脾を傷る。脾傷るれば則ち磨せず、朝に食して暮に吐し、暮に食して朝に吐し、宿穀化せず、名づけて胃反と曰う。脈緊にして渋なるは、其の病治し難し。\n\n病人吐せんと欲する者は、之を下すべからず。\n\n**原文**（翻刻確認）\n趺陽脈浮而澀、浮則為虛、澀則傷脾、脾傷則不磨、朝食暮吐、暮食朝吐、宿穀不化、名曰胃反。脈緊而澀、其病難治。\n\n病人欲吐者、不可下之。\n\n**現代語訳**（訳：社員案）\n趺陽の脈が浮で渋のとき、浮は虚であり、渋は脾が傷られたことを示す。脾が傷られると食べ物をこなせず、朝に食べたものを夕方に吐き、夕方に食べたものを朝に吐き、前日の穀物が消化されない。これを胃反という。脈が緊で渋のものは、その病は治りにくい。\n\n病人が吐こうとしているときは、下してはならない。\n\n### 注記\n- 本方の条の後の小字の注は、『金匱要略論註』の四庫全書本では「外臺又治吐水」と書かれ、「方」の字がない（要原本照合）。本文は維基文庫の『金匱要略』の字を採った\n- 胃反の条は、『金匱要略論註』の四庫全書本では「浮則為虚、虚則傷脾」と書かれ（『金匱要略』の翻刻は「澀則傷脾」）、「澀」を「濇」に作る（要原本照合）\n- 維基文庫の『金匱要略』の翻刻には大黄甘草湯方の構成・服用法の行がない。原典の構成・服用法は『金匱要略論註』の四庫全書本の本文による\n- 篇名は、維基文庫の『金匱要略』では「嘔吐噦下利病脈證並治第十七」、『金匱要略論註』の四庫全書本では「嘔吐噦下利病脉證治」。見出しは資料の篇名で書いた\n- 『外台秘要方』の方は方名がなく（「又…方」）、構成が同じ（大黄・甘草）なので条文の欄に置いた。四庫全書本の翻刻では「必効人參湯」の条の後の「又」の方として載り、方後の小字の注に「此本仲景傷寒論方並出第二卷中」とある（翻刻確認）", "出典": "### 原典の構成\n- 『金匱要略』：大黄4両、甘草1両（翻刻確認。『金匱要略論註』の四庫全書本の本文による）\n- 『外台秘要方』：大黄4両、甘草2両（炙）（翻刻確認）\n\n### 原典の服用法\n- 『金匱要略』：2味を水3升で煮て1升を取り、2回に分けて温服する（翻刻確認。『金匱要略論註』の四庫全書本の本文による）\n- 『外台秘要方』：2味を刻み、水3升で煮て1升を取り、滓を去って2回に分けて温服する。効けば2日おいてさらに1剤を服す。海藻・菘菜を忌む（翻刻確認）\n\n### 処方の変遷\n- 『肘後百一方』巻之四・治卒胃反嘔啘方第三十に、胃反で食を受け付けず、食べ終わるとすぐ吐き出すものを治す方として大黄4両・甘草2両が載るとされる（要原本照合）\n- 『千金翼方』巻第十五補益・補五蔵第四では、脾気が実するものの諸症と嘔吐・反胃に大黄6両の方が載り、食べてすぐ吐き大便が通じないものには甘草2両を加えて煮て2升半を取り、3回に分けて服すとされる（要原本照合）\n- 『医便』巻三・秋月諸症治例附の二黄散（一名陰陽黄附）は錦紋川大黄・大甘草節の2味で、発背・癰疽・疔瘡などの腫毒の初期に用いるとされる。甘草節がなければ効きが速くないとの追記がある（要原本照合）\n- 『有林福田方』巻之十・癰疽悪腫門・癰疽治方に、『道済方』の方として大黄甘草湯が癰疽の腫毒に載り、大黄・甘草を末として煎服し、下痢して腫れが引き痛みが減れば服用を止めるとされる（要原本照合）\n- 現行エキス剤（ツムラ84）は 大黄・甘草 の2味で、原典と同じ構成。1日量は大黄4.0g・甘草2.0gで、原典（大黄4両・甘草1両）より甘草の比が大きい（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "大黄・甘草", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "神秘湯", "名前": "神秘湯", "読み": "しんぴとう", "ツムラ番号": "85", "出典": "外台秘要方（巻九・久欬坐臥不得方）／浅田家方", "別名": "", "本文": {"条文": "### 『外台秘要方』巻九・久欬坐臥不得方\n\n**書き下し**（読み：社員案）\n備急、久しく欬して奔喘し、坐臥するを得ず、并びに喉裏に呀声ありて気絶するを療する方。\n\n**原文**（翻刻確認）\n備急療久欬奔喘坐臥不得并喉裏呀聲氣絶方\n\n**現代語訳**（訳：社員案）\n（『備急』の方）長く続く咳で激しく喘ぎ、座ることも横になることもできず、そのうえ喉の奥でぜいぜいと音がして、息が絶えそうになるものを治す方。\n\n### 『勿誤薬室方函』巻上・神秘湯（浅田家方）\n\n浅田宗伯『勿誤薬室方函』巻上の神秘湯に、『外台秘要方』と同様の条文と薬味が載り、その後に厚朴・甘草を加える加味が記されるとされる。内容は「出典」の見出しに記す（要原本照合）\n\n### 注記\n- 翻刻は「坐卧」と書く。本文は「臥」にした\n- 原文の頭の「備急」は、同じ門の直前の方が「集驗療…」で始まるのと同じく、引用元の名と読んだ。資料は「備急、久欬奔喘し…」と条文の一部として読む。どの書を指すかは確かめていない（要確認）\n- 方後の小字注に「張文仲同、出第三巻中」とある（翻刻確認）", "出典": "### 原典の構成\n- 『外台秘要方』：麻黄（去節）・乾蘇葉・橘皮 各3両、柴胡4両、杏仁4両（去尖皮両仁者、砕く）（翻刻確認）\n- 浅田家方（『勿誤薬室方函』）：上の5味に厚朴・甘草を加える（要原本照合）\n\n### 原典の服用法\n- 『外台秘要方』：刻み、水6升で煮て2升半を取り、3回に分けて服す。2剤を服せば必ず治り、はなはだ効がある（翻刻確認）\n\n### 処方の変遷\n- 『外台秘要方』巻九の方は麻黄・乾蘇葉・橘皮・柴胡・杏仁の5味で、厚朴・甘草を含まない（翻刻確認）\n- 同じ門の直前に『集験』の方として、主治がほぼ同じで乾蘇葉の代わりに紫菀を用いる5味の方（麻黄・杏仁・紫菀 各3両、柴胡・橘皮 各4両）が載る（翻刻確認）\n- 浅田宗伯『勿誤薬室方函』巻上・神秘湯には、厚朴・甘草を加える加味と、刪繁が生姜・石膏を加えて橘皮湯と名づけることが記されるとされる。資料は、5味の原方に厚朴・甘草を加えたのは浅田宗伯で、これで現在の構成ができたとする（要原本照合）\n- 資料は、浅田宗伯は『勿誤薬室方函口訣』巻之下で、厚朴を加えるのは『易簡方』の降気湯の意に基づくとしたとする（要原本照合）\n- 『外台秘要方』巻十・肺熱兼欬方に、刪繁の橘皮湯（橘皮・杏仁・柴胡・麻黄・乾蘇葉・母薑・石膏の7味）が載り、方後注に「母薑、千金は宿薑と云う」とある（翻刻確認）。資料は『備急千金要方』巻第十七・肺虚実第二にも橘皮湯として載るとする（要原本照合）\n- 同名異方：『外台秘要方』巻十・上気及気逆急牽縄不得臥方に、千金の上気して臥すことができないものを治す神秘方（橘皮・生姜・紫蘇・人参・五味子 各3両）が載り、注に一方は桔梗があって五味子がないとある（翻刻確認）。資料は『備急千金要方』巻第十七・積気第五の神秘方、『三因極一病証方論』巻之十三の神秘湯（橘皮・桔梗・紫蘇・人参・五味子）なども挙げる（要原本照合）\n- 現行エキス剤（ツムラ85）は 麻黄5.0・杏仁4.0・厚朴3.0・陳皮2.5・甘草2.0・柴胡2.0・蘇葉1.5g の7味（PMDA 添付文書 2023年12月改訂 第1版で確認）。原典の橘皮・乾蘇葉は、資料では陳皮・蘇葉として扱われる", "構成": "麻黄・杏仁・厚朴・陳皮・甘草・柴胡・蘇葉", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "当帰飲子", "名前": "当帰飲子", "読み": "とうきいんし", "ツムラ番号": "86", "出典": "厳氏済生方（巻之六・瘡疥論治）", "別名": "当帰引子", "本文": {"条文": "### 『厳氏済生方』巻之六・瘡疥論治\n\n**書き下し**（読み：社員案）\n心血凝滞し、内に風熱を蘊み、皮膚に発見し、遍身の瘡疥、或いは腫れ、或いは痒く、或いは膿水浸淫し、或いは赤疹㾦㿔を発するを治す。\n\n**原文**（翻刻確認）\n治心血凝滯、内蘊風熱、發見皮膚、遍身瘡疥、或腫或痒、或膿水浸淫、或發赤疹㾦㿔。\n\n**現代語訳**（訳：社員案）\n心の血が凝り滞り、体の内に風熱がこもって皮膚に現れ、全身に瘡疥ができて、腫れたり、かゆかったり、膿や汁がじくじくと広がったり、赤い発疹や㾦㿔が出たりするものを治す。\n\n### 注記\n- 方名は、四庫全書本の翻刻では「當歸引子」。簡体字の別の翻刻本では「当归饮子」（要原本照合）。見出しは販売名の「当帰飲子」、四庫全書本の「当帰引子」は別名に入れた\n- 四庫全書本（8巻）では巻八の疥の論の後に載る（翻刻確認）。資料は巻之六・瘡疥論治とする（要原本照合）\n- 「浸淫」は、四庫全書本の翻刻では「浸滛」（字体の違い。要原本照合）\n- 「㾦㿔」は、資料ではルビ「ハイライ」の付いた2字で書かれる。字形は要原本照合\n- 簡体字の別の翻刻本は主治の文が「或发赤」で切れていて、その後の字がない（翻刻確認）", "出典": "### 原典の構成\n- 『厳氏済生方』：当帰（蘆を去る）・白芍薬・川芎・生地黄（洗う）・白蒺藜（炒って尖を去る）・防風（蘆を去る）・荊芥穂 各1両、何首烏・黄耆（蘆を去る）・甘草（炙る） 各半両（翻刻確認）\n\n### 原典の服用法\n- 『厳氏済生方』：㕮咀し、1回4銭を水1盞半に生姜5片を入れて8分まで煎じ、滓を去って温服する。時候に拘らない（翻刻確認）\n\n### 処方の変遷\n- 本方は四物湯に蒺藜子・防風・荊芥・何首烏・黄耆・甘草を加えた方。四物湯の出典は『理傷続断方』（要原本照合）\n- 『世医得効方』巻第十九・瘡腫科・諸瘡には当帰飲の名で、ほぼ同じ条文・同じ薬味・生姜で煎じる指示で載る（要原本照合）\n- 『名方類証医書大全』巻十九・瘡疥・瘡疹には当帰飲子として同じ10味が載り、主治の文の「赤疹㾦㿔を発する」の句がない（要原本照合）\n- 『奇効良方』巻之五十四・瘡瘍門、『丹渓心法』巻四・諸瘡痛八十四、『済世全書』巻之八・疥瘡には当帰飲子として同じ10味が載り、水煎のほか末として服してもよいとする（要原本照合）\n- 『薛氏医案』巻四十八・婦人良方・瘡瘍門、『景岳全書』巻六十四・外科鈐古方には当帰飲の名で載る（要原本照合）\n- 『医学入門』七巻上・外科用薬賦・瘡疥の当帰飲は、当帰・白芍・川芎・生地・防風・荊芥・蒺藜 各1銭、何首烏・黄耆・甘草 各5分を生姜で煎じて服す（要原本照合）\n- 『外科正宗』巻之四・疥瘡論第七十八には消風散に続いて当帰飲子が載る（要原本照合）\n- 『太平聖恵方』巻第六十九・治婦人風瘙痒諸方の何首烏散（何首烏・防風・白蒺藜・枳殻・天麻・胡麻・白僵蚕・茺蔚子・蔓荊子）と、『太平恵民和剤局方指南総論』巻下・論婦人諸疾の四物湯加荊芥が、本方に影響を与えた可能性があるとされる。確証はない（要原本照合）\n- 現行エキス剤（ツムラ86）は 当帰・地黄・蒺藜子・芍薬・川芎・防風・何首烏・黄耆・荊芥・甘草 の10味で、原典の生姜は入らない（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "当帰・地黄・蒺藜子・芍薬・川芎・防風・何首烏・黄耆・荊芥・甘草", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "六味丸", "名前": "六味丸", "読み": "ろくみがん", "ツムラ番号": "87", "出典": "小児薬証直訣（巻下）", "別名": "", "本文": {"条文": "### 『小児薬証直訣』巻下・諸方（銭乙）\n\n**書き下し**（読み：社員案）\n\n地黄丸　腎怯にして失音し、囟開きて合わず、神不足し、目中に白睛多く、面色白き等を治する方。\n\n上を末と為し、煉蜜にて丸とすること梧子大の如くし、空心に温水にて化して三丸を下す。\n\n**原文**（翻刻確認）\n\n地黃丸　治腎怯失音，囟開不合，神不足，目中白睛多，面色白等方。\n\n上為末，煉蜜丸，如梧子大，空心，溫水化下三丸。\n\n**現代語訳**（訳：社員案）\n\n地黄丸は、腎が怯弱で声が出ず（失音）、囟門（ひよめき）が開いたまま閉じず、神（精神の働き）が足りず、目に白目が多く、顔色が白いものなどを治す方である。\n\n（服用法）以上を末とし、練った蜂蜜で梧桐の実ほどの大きさの丸剤とし、空腹時に温水で溶かして3丸を服す。\n\n### 関連条文（巻上・腎虚）\n\n『小児薬証直訣』巻上・脈証治法の腎虚の条。資料（論考㉑）が『勿誤薬室方函』に引かれた条として挙げる。\n\n**書き下し**（読み：社員案）\n\n児、本より虚怯にして、胎気の成らざるに由れば、則ち神不足す。目中に白睛多く、其の顱即ち解け（囟開くなり）、面色白し。此れ皆養い難く、縦い長ずるも八八の数を過ぎず。若し色欲を恣にすること多ければ、四旬に及ばずして亡ぶ。或いは病に因りて腎虚を致す者有るは、非なり。又、腎気不足すれば則ち下竄す。蓋し骨重くして惟だ下に墜ちんと欲して身を縮むるなり。腎水は陰なり、腎虚すれば則ち明を畏る。皆宜しく腎を補うべし。地黄丸之を主る。\n\n**原文**（翻刻確認）\n\n兒本虛怯，由胎氣不成，則神不足。目中白睛多，其顱即解，（囟開也，）面色白。此皆難養，縱長不過八八之數。若恣色欲多，不及四旬而亡。或有因病而致腎虛者，非也。又腎氣不足，則下竄，蓋骨重惟欲墜於下而縮身也。腎水，陰也，腎虛則畏明，皆宜補腎，地黃丸主之。\n\n**現代語訳**（訳：社員案）\n\n小児がもともと虚弱で、胎内で気が十分に成らなかったために、神が足りない。目に白目が多く、頭蓋の縫合が開き（囟門が開いていること）、顔色が白い。これらはみな育てにくく、たとえ成長しても八八の数（64歳）を越えない。もし色欲をほしいままにすることが多ければ、四旬（40歳）に及ばずに亡くなる。病気によって腎虚になったものもあるというのは誤りである。また、腎気が不足すると下竄する（下へ逃れ込もうとする）。思うに骨が重くて、ただ下に落ちようとして身を縮めるのである。腎水は陰であり、腎が虚すと明るさを嫌う。みな腎を補うのがよい。地黄丸がこれを主治する。\n\n### 関連条文（巻上・諸疳）\n\n『小児薬証直訣』巻上・諸疳のうち、地黄丸を用いる4条。資料（論考❹）が肝疳・腎疳・筋疳・骨疳として挙げる。\n\n**書き下し**（読み：社員案）\n\n肝疳、白膜睛を遮るは、当に肝を補うべし。地黄丸之を主る。\n\n腎疳、極めて痩せ、身に瘡疥有るは、当に腎を補うべし。地黄丸之を主る。\n\n筋疳、瀉血して痩するは、当に肝を補うべし。地黄丸之を主る。\n\n骨疳、喜んで冷地に臥すは、当に腎を補うべし。地黄丸之を主る。\n\n**原文**（翻刻確認）\n\n肝疳，白膜遮睛，當補肝，地黃丸主之。\n\n腎疳，極瘦，身有瘡疥，當補腎，地黃丸主之。\n\n筋疳，瀉血而瘦，當補肝，地黃丸主之。\n\n骨疳，喜臥冷地，當補腎，地黃丸主之。\n\n**現代語訳**（訳：社員案）\n\n肝疳で白い膜が黒目を覆うものは、肝を補うべきである。地黄丸がこれを主治する。\n\n腎疳でひどく痩せ、体に瘡や疥（かさ）があるものは、腎を補うべきである。地黄丸がこれを主治する。\n\n筋疳で下血して痩せるものは、肝を補うべきである。地黄丸がこれを主治する。\n\n骨疳で好んで冷たい地面に寝るものは、腎を補うべきである。地黄丸がこれを主治する。\n\n### 注記\n- 方名：翻刻は「地黃丸」、資料の書き下しは「地黄円」（要原本照合）\n- 「面色白」：資料の書き下しは「面色㿠白」。維基文庫の翻刻（巻下の主治・巻上の腎虚の条とも）は「面色白」で㿠の字がない。本文は翻刻の字を採った（要原本照合）\n- 「囟」：資料は「顖」と書く。字体の違い\n- 書名：維基文庫のページ名は『小兒藥證真訣』（『小兒藥證直訣』から転送）。著者は銭乙、宋（翻刻確認）\n- 維基文庫の翻刻は簡体字の混じる本（周学海の按語「學海案」を含む）で、原文は繁体字にそろえて書いた（开→開、泽泻→澤瀉、炼→煉、温→溫、纵→縱、过→過、窜→竄、坠→墜、于→於、缩→縮、阴→陰、补→補、当→當、极→極、疮→瘡、泻→瀉、卧→臥 など）。字形の判断には使えない（要原本照合）。句読点は翻刻のもの", "出典": "### 原典の構成\n- 『小児薬証直訣』巻下：熟地黄8銭、山萸肉・乾山薬 各4銭、沢瀉・牡丹皮・白茯苓（皮を去る） 各3銭（翻刻確認）\n\n### 原典の服用法\n- 『小児薬証直訣』巻下：末とし、煉蜜で梧子大の丸剤とし、空腹時に温水で溶かして3丸を服す（翻刻確認）\n\n### 処方の変遷\n- 『金匱要略』中風歴節病脈証并治第五の崔氏八味丸は 乾地黄・山茱萸・薯蕷・沢瀉・茯苓・牡丹皮・桂枝・附子（炮） の8味（翻刻確認）。資料は、本方は歴史的にはこの崔氏八味丸から桂枝・附子を除いて銭乙が工夫した処方とする（要原本照合）\n- 原典は熟地黄を用いる。『金匱要略』の崔氏八味丸は乾地黄（翻刻確認）\n- 原典での方名は地黄丸。資料は、本方は地黄円・地黄丸・六味地黄丸・六味丸・金匱腎気丸などと呼ばれるが、金匱腎気丸の名は八味地黄丸を指すことが多いとする（要原本照合）\n- 資料は、王履『医経溯洄集』巻之二・八味丸用沢瀉論が地黄円を六味地黄丸と名づけた最初の書とする（要原本照合）\n- 『薛氏医案』巻四十八・婦人良方に「六味丸　一名六味地黄丸」として載るとされる（要原本照合）\n- 『張氏医通』巻十六・祖方では銭氏六味丸（一名六味地黄丸）として載り、湯に作ったものを生料六味丸と名づけるとされる（要原本照合）\n- 現行エキス剤（ツムラ87）は 地黄・山茱萸・山薬・沢瀉・茯苓・牡丹皮 の6味。1日量7.5g中、ジオウ5.0・サンシュユ3.0・サンヤク3.0・タクシャ3.0・ブクリョウ3.0・ボタンピ3.0g の混合生薬の乾燥エキス3.75gを含む（PMDA 添付文書 2023年12月改訂 第1版で確認）。添付文書の地黄は「日局ジオウ」で、熟地黄・乾地黄の別は書かれない。資料は、エキス製剤では熟地黄の代わりに乾地黄が配合されているとする（要確認）", "構成": "地黄・山茱萸・山薬・沢瀉・茯苓・牡丹皮", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "二朮湯", "名前": "二朮湯", "読み": "にじゅつとう", "ツムラ番号": "88", "出典": "万病回春（巻之五・臂痛）", "別名": "", "本文": {"条文": "### 『万病回春』巻之五・臂痛\n\n**書き下し**（読み：社員案）\n臂痛は、湿痰の経絡に横行するに因るなり。二朮湯　痰飲にて双臂痛む者を治す。又、手臂痛むを治す。是れ上焦の湿痰、経絡の中に横行して痛を作すなり。\n\n**原文**（翻刻確認）\n臂痛者、因湿痰横行経絡也。二朮湯　治痰飲双臂痛者、又治手臂痛、是上焦湿痰横行経絡中作痛也。\n\n**現代語訳**（訳：社員案）\n臂（うで）の痛みは、湿痰が経絡の中を横に行きわたることによる。二朮湯は、痰飲のために両腕が痛むものを治す。また、手や腕が痛むものを治す。これは上焦の湿痰が経絡の中を横に行きわたって痛みを起こすのである。\n\n### 注記\n- 「臂痛者、因湿痰横行経絡也」は、臂痛の門の中で二朮湯の前に置かれた見出しの句（翻刻確認）\n- 維基文庫の『万病回春』は簡体字の翻刻で、本文は新字体に直した（字体の違い）\n- 「作痛」は、資料の書き下しでは「痛みを為せば」と読まれる（要原本照合）。資料が引く『医学正伝』『済世全書』の同じ句は「痛みを作せば」と読まれる\n- 「威霊仙」は、資料の引用では「葳霊仙」と書かれる箇所がある（要原本照合）", "出典": "### 原典の構成\n- 『万病回春』：蒼朮（米泔に浸して炒る）1銭半、白朮（去芦）・南星・陳皮・茯苓（去皮）・香附・酒芩・威霊仙・羌活・甘草 各1銭、半夏（姜製）2銭（翻刻確認）\n\n### 原典の服用法\n- 『万病回春』：1剤に刻み、生姜を入れて煎じて服す（翻刻確認）\n\n### 処方の変遷\n- 二陳湯（半夏・陳皮・茯苓・甘草・生姜）に白朮・天南星・香附子・黄芩・威霊仙・羌活・蒼朮を加えた方。二陳湯の出典は『和剤局方』（要原本照合）\n- 資料の出典欄は『和剤局方』『丹渓心法』を挙げる。ここでは二朮湯の方名と現行エキス剤と同じ構成を載せる『万病回春』を出典とした（要確認）\n- 資料は、蒼朮と白朮を含むことから龔廷賢が二朮湯と名付けたとし、出典は一般に『万病回春』とされるとする（要原本照合）\n- 資料は、『丹渓心法』巻四・痛風六十三の臂痛方（方名なし。蒼朮・半夏・南星・白朮・酒芩・香附・陳皮・茯苓・威霊仙・甘草を姜で煎じる）に「別本には羌活一銭を加う」とあり、別本の方は『万病回春』の二朮湯と同じなので、二朮湯そのものの出典は『丹渓心法』だとする（要原本照合）\n- 資料は、『丹渓心法附余』巻四にも同じ臂痛方が、『金匱鈎玄』巻第二・痛風には羌活と生姜を欠く同じ薬味の方が載るとする（要原本照合）\n- 資料は、『丹渓治法心要』巻四・臂痛第四十九に、上焦の湿が経絡に横行するものに二陳湯へ蒼朮・香附・威霊仙・酒芩・南星・白朮を加えて生姜で煎服する記載があるとする（要原本照合）\n- 資料は、『医学正伝』巻之四・痛風に本方から羌活を去った方が二朮湯と同じ主治の句とともに載り、続いて二陳湯に酒芩・羌活・威霊仙を加えた加味二陳湯が載るとする（要原本照合）\n- 資料は、『済世全書』巻之五・臂痛の臂痛湯は二朮湯と同じ主治・薬味で「加羌活」と書き分け、『寿世保元』巻之五・臂痛では羌活をほかの薬と同等に書くとする（要原本照合）\n- 資料は、『東医宝鑑』外形篇巻之四・手の半夏芩朮湯は本方から羌活を去った方で、もとは『医学正伝』によるとする（要原本照合）\n- 資料は、『伝信適用方』『厳氏済生方』の導痰湯、『丹渓心法』巻二・痰の方名のない方（南星・橘紅・赤茯苓・枳殻・甘草・半夏）や湿痰を治す丸剤（蒼朮・白朮・香附・白芍）を、二陳湯とは別の本方への流れとして挙げる（要原本照合）\n- 現行エキス剤（ツムラ88）は 半夏4.0g、蒼朮3.0g、威霊仙・黄芩・香附子・陳皮・白朮・茯苓・天南星・和羌活 各2.5g、甘草・生姜 各1.0g の12味（PMDA 添付文書 2023年12月改訂で確認）。羌活の代わりに和羌活が入る", "構成": "半夏・蒼朮・威霊仙・黄芩・香附子・陳皮・白朮・茯苓・甘草・生姜・天南星・和羌活", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "治打撲一方", "名前": "治打撲一方", "読み": "ぢだぼくいっぽう", "ツムラ番号": "89", "出典": "一本堂医事説約（打撲。香川修庵）／勿誤薬室方函（巻上）", "別名": "", "本文": {"条文": "### 『一本堂医事説約』打撲\n\n**書き下し**（要原本照合）\n\n**原文**（要原本照合）\n\n**現代語訳**\n\n### 『勿誤薬室方函』巻上・治打撲一方\n\n**書き下し**（要原本照合）\n\n**原文**（要原本照合）\n\n**現代語訳**\n\n### 注記\n- 『一本堂医事説約』打撲には方名がなく「一方」とだけあり、萍蓬・樸樕・川芎・桂枝・大黄・丁香・甘草を挙げ、日が久しいものには附子を加えるとする（要原本照合。資料の書き下しによる）\n- 『一本堂医事説約』の頭註に、別本には苹（川骨）がないとする記載がある（要原本照合。資料の書き下しによる）\n- 『勿誤薬室方函』巻上には「治打撲一方」の名で「香川」の方として同じ7味が載り、日が久しいものには附子を加えるとする（要原本照合。資料の書き下しによる）\n- 『一本堂医事説約』『勿誤薬室方函』の原文の翻刻は維基文庫に見当たらない（2026-10-22 検索。要原本照合）。資料には両書とも書き下しの引用だけで原文（漢文）の引用がないので、書き下し・原文・現代語訳は翻刻待ち\n- 資料は萍蓬（萍蓬根）を川骨の別名とする（要確認）", "出典": "### 原典の構成\n- 『一本堂医事説約』打撲：萍蓬・樸樕・川芎・桂枝（中）・大黄（小）・丁香・甘草（少）の7味。日久しき者は附子を加える（要原本照合）\n- 同上、資料の表18の分量：萍蓬・川芎・桂枝・樸樕 各中、大黄 小、丁香・甘草 各少、附子 或（要原本照合）\n- 『勿誤薬室方函』巻上：萍蓬・樸樕・川芎・桂枝・大黄・丁香・甘草 の7味（分量は資料に記載なし）。日久しき者には附子を加える（要原本照合）\n\n### 原典の服用法\n\n### 処方の変遷\n- 『一本堂医事説約』は香川修庵の書で、延享元年（1744）序とされる（要原本照合）\n- 資料は、『一本堂医事説約』には方名がなく、治打撲一方という方名は香川修庵の命名ではないとする。方名は『勿誤薬室方函』巻上に「香川」の方として載る（要原本照合）\n- 前身の方：香川修庵の『一本堂雑話』打撲に二方が載る。一つは茯苓（大）・萍蓬（大）・川芎（中）・桂枝（中）・丁香（五枚）で、樸樕を加えてもよく、大便が結するものは大黄を加える。もう一つは萍蓬根（大）・樸樕（大）・川芎・桂枝（中）・大黄（中）・甘草（少）（要原本照合）\n- 資料は、『一本堂雑話』は写本で成書年不詳だが、二方の変遷から1744年より早い作と推定する（要確認）\n- 資料は、『一本堂医事説約』の頭註の別本に川骨がないとする記載を、刊行時に古写本を校勘した際、一部の写本に川骨を配さない記述があったことによるものとする（要確認）\n- 現行エキス剤（ツムラ89）は7.5g中、桂皮・川芎・川骨・樸樕 各3.0g、甘草1.5g、大黄・丁子 各1.0g の7味（PMDA 添付文書 2023年12月改訂 第1版で確認）。添付文書に出典の欄はない\n- 原典の萍蓬は川骨、桂枝は桂皮、丁香は丁子にあたる（要確認）\n- 資料の組成は桜皮を括弧付きで挙げ、原典では加味されず、樸樕の代わりに用いられることもあるとする（要確認）", "構成": "桂皮・川芎・川骨・樸樕・甘草・大黄・丁子", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "清肺湯", "名前": "清肺湯", "読み": "せいはいとう", "ツムラ番号": "90", "出典": "万病回春（巻之二・咳嗽）／一貫堂方", "別名": "", "本文": {"条文": "### 『万病回春』巻之二・咳嗽\n\n**書き下し**（読み：社員案）\n痰嗽する者は、嗽動けば便ち痰声有り、痰出づれば嗽止む、是れなり（嗽して痰多き者は、是れ脾虚なり）。肺脹して嗽する者は、嗽すれば則ち喘満し気急するなり（喘急して眠るを得ざる者は治し難し）。久嗽止まずして労と成り、若しくは久嗽して声唖れ、或いは喉に瘡を生ずる者は、是れ火、肺金を傷るなり（倶に之を治し難し。若し血気衰敗し、声、音を失う者も、亦た治し難きなり。以上の三条は、倶に後方に宜し）。\n\n清肺湯　一切の咳嗽、上焦の痰盛んなるを治す。\n\n**原文**（翻刻確認）\n痰嗽者、嗽動便有痰聲、痰出嗽止是也（嗽而痰多者、是脾虛也）。肺脹嗽者、嗽則喘滿氣急也（喘急不得眠者難治）。久嗽不止成勞、若久嗽聲啞、或喉生瘡者、是火傷肺金也（俱難治之。若血氣衰敗、聲失音者、亦難治也。以上三條、俱宜後方）。\n\n清肺湯　治一切咳嗽、上焦痰盛。\n\n**現代語訳**（訳：社員案）\n痰嗽とは、咳が出ると痰の音がし、痰が出ると咳が止まるものである（咳をして痰が多いものは脾虚である）。肺脹の咳とは、咳をすると喘いで胸が張り、息が急になるものである（喘ぎが急で眠れないものは治りにくい）。長引く咳が止まらずに労となり、あるいは長引く咳で声がかれ、あるいは喉に瘡ができるものは、火が肺金を傷ったものである（いずれも治りにくい。もし血気が衰え、声が出なくなったものも、また治りにくい。以上の三条には、いずれも次の方がよい）。\n\n清肺湯：あらゆる咳嗽で、上焦に痰が盛んなものを治す。\n\n### 注記\n- 『万病回春』の翻刻は簡体字の本で、原文は繁体字にそろえて書いた（痰声→痰聲、脾虚→脾虛、劳→勞 など）。字形の判断には使えない（要原本照合）\n- 清肺湯の主治の句の前に置かれた三条は、末尾に「以上三條、俱宜後方」とあり、次の清肺湯を指すので、条文に含めた（翻刻確認）\n- 字の異同：翻刻の「成勞」を資料は「労怯」、「血氣」を「気血」、「聲失音」を「声唖・失音」、「以上」を「已上」とする。本文は翻刻の字を採った（要原本照合）", "出典": "### 原典の構成\n- 『万病回春』巻之二・咳嗽：黄芩（去朽心）1銭半、桔梗（去芦）・茯苓（去皮）・陳皮（去白）・貝母（去心）・桑白皮 各1銭、当帰・天門冬（去心）・山梔・杏仁（去皮尖）・麦門冬（去心） 各7分、五味子7粒、甘草3分（翻刻確認）\n\n### 原典の服用法\n- 『万病回春』巻之二・咳嗽：刻んで生姜・大棗とともに煎じ、食後に服す（翻刻確認）\n- 方後に9条の加減が続く。痰が咯出しないものは栝楼・枳実・竹瀝を加えて五味子を去る、咳嗽喘急には蘇子・竹瀝を加えて桔梗を去る、痰火の咳嗽で面赤く身熱し紅痰を咯出するものは芍薬・生地黄・紫菀・阿膠・竹瀝を加えて五味子・杏仁・貝母・桔梗を去る、など（翻刻確認）\n\n### 処方の変遷\n- 資料は、本方の出典は一般に『万病回春』とされるとする（要原本照合）\n- 『万病回春』の本方は13味を姜・棗で煎じる方で、竹茹は入らない。方後の加減の条にはたびたび竹瀝が出る（翻刻確認）\n- 資料は、『明医雑著』咳嗽に「主方　杏仁五味子湯」（杏仁・白茯苓・橘紅・五味子・桔梗・甘草）と15条の加減が載り、その加減の文が『万病回春』咳嗽の各条に部分的に反映されているので、龔廷賢が杏仁五味子湯から清肺湯を創案したとする（要原本照合）\n- 現行の清肺湯は竹茹を加えた一貫堂方。資料は、矢数道明『漢方の臨牀』第9巻第2号「清肺湯の運用について」に、本方は一貫堂時代に森道伯が頻りに用いていたとあり、『漢方一貫堂医学』第五編・肺結核の治験例に、竹茹を加えた清肺湯（黄芩・桔梗・陳皮・桑白皮・貝母・杏仁・梔子・天門冬・大棗・竹茹 各2.0、茯苓・当帰・麦門冬 各3.0、五味子・生姜 各1.5、甘草1.0）が載るとする（要原本照合）\n- 資料は、竹茹の加味は、森道伯が竹瀝の常時の入手が難しいため竹茹を用い、さらに経験から竹茹を本方に常に加えていたことによるとし、今日の清肺湯は『明医雑著』→『万病回春』→一貫堂方と変遷して完成したとする（要原本照合）\n- 『万病回春』には同名で構成の違う清肺湯がほかに2方ある。巻之二・喘急の清肺湯（火喘を治す）：片黄芩1銭、山梔子・枳実・桑白皮・陳皮・白茯苓・杏仁・蘇子・麦門冬・貝母 各8分、沈香・辰砂 各5分（翻刻確認）。巻之四・失血の清肺湯（先に痰を吐き後に血を見わすのは積熱）：茯苓・陳皮・当帰・生地黄・芍薬・天門冬・麦門冬・黄芩・山梔・紫菀・阿膠・桑白皮 各等分、甘草は半量、烏梅1個を、棗2枚とともに水で煎じる（翻刻確認）\n- 資料は、同じ巻之四・失血に、便血を治す清肺湯（温清飲加地楡・槐角・柏葉・阿膠）も載るとする。維基文庫の翻刻の失血の門には見当たらない（要原本照合）\n- 現行エキス剤（ツムラ）は9.0g中、当帰・麦門冬・茯苓 各3.0g、黄芩・桔梗・杏仁・山梔子・桑白皮・大棗・陳皮・天門冬・貝母 各2.0g、甘草・五味子・生姜 各1.0g、竹茹2.0g の16味（PMDA 添付文書 2023年12月改訂 第1版で確認）。添付文書に出典の欄はない", "構成": "当帰・麦門冬・茯苓・黄芩・桔梗・杏仁・山梔子・桑白皮・大棗・陳皮・天門冬・貝母・甘草・五味子・生姜・竹茹", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "竹筎温胆湯", "名前": "竹筎温胆湯", "読み": "ちくじょうんたんとう", "ツムラ番号": "91", "出典": "扶寿精方（傷寒続添）・寿世保元（乙集巻之二・傷寒）", "別名": "竹茹温胆湯", "本文": {"条文": "### 『扶寿精方』傷寒続添\n\n**書き下し**（要原本照合）\n\n**原文**（要原本照合）\n\n**現代語訳**\n\n### 『寿世保元』乙集巻之二・傷寒\n\n**書き下し**（読み：社員案）\n一に論ず。傷寒、日数過多にして、其の熱退かず、夢寐寧からず、心驚恍惚とし、煩躁して痰多きは、竹茹温胆湯に宜し。\n\n**原文**（翻刻確認）\n一論傷寒日數過多、其熱不退、夢寐不寧、心驚恍惚、煩躁多痰、宜竹茹溫膽湯。\n\n**現代語訳**（訳：社員案）\n一つの論。傷寒で日数が多く経っても熱が退かず、眠っても夢を見て安らかでなく、胸がどきどきとして驚きやすくぼんやりし、もだえ苦しんで痰が多いものには、竹茹温胆湯がよい。\n\n### 注記\n- 『扶寿精方』の原文の翻刻は、維基文庫の検索（2026-10-22。「扶壽精方」「竹茹溫膽湯」）では見当たらなかった。資料には書き下しだけがある（要原本照合）\n- 『寿世保元』の維基文庫の翻刻は未校訂の本で、簡体字と繁体字が混ざり、巻・篇の区切りがない。原文は社員が繁体字にそろえた。字形の判断には使えない（要原本照合）。巻・篇（乙集巻之二・傷寒）は資料による（要原本照合）\n- 字の異同：『寿世保元』の「夢寐」を、資料の書き下しは「夢味」とし、資料の論考は『扶寿精方』との違いを「味⇒寐」とする。本文は翻刻の字を採った（要原本照合）\n- 方名の「竹筎」は資料と添付文書の一般的名称の字。『寿世保元』の翻刻は「竹茹」と書く。原文・書き下しは翻刻の字にし、「竹茹温胆湯」を別名に入れた\n- 『寿世保元』の方は本方と同名・同構成なので、条文の欄に出典として置いた。『万病回春』の同名の方は麦門冬を含まず構成が違うので、処方の変遷に書いた", "出典": "### 原典の構成\n- 『扶寿精方』傷寒続添：柴胡・枳実・半夏・竹茹・陳皮・茯苓・桔梗・香附・甘草・人参・麦門冬・黄連（分量は資料に記載がない。要原本照合）\n- 『寿世保元』：柴胡1銭、竹茹2銭、桔梗1銭、枳実（麩炒）1銭、黄連1銭、人参1銭、麦門冬（去心）5分、陳皮1銭、半夏（姜炒）8分、茯苓1銭、甘草2銭、香附8分（翻刻確認）\n\n### 原典の服用法\n- 『扶寿精方』：生姜・大棗とともに煎じて服す（要原本照合）\n- 『寿世保元』：一剤を刻み、生姜3片・棗2枚を入れて水で煎じ、温服する（翻刻確認）\n\n### 処方の変遷\n- 資料の出典欄は『備急千金要方』『三因極一病証方論』『世医得効方』『袖珍方』『扶寿精方』の5書。前の4書の方は温胆湯・加味温胆湯で、竹茹温胆湯の名が出るのは『扶寿精方』から（要原本照合）\n- 『備急千金要方』第十二・胆虚実の温胆湯は、大病の後の虚煩して眠れないもの（胆寒）を治す。半夏・竹茹・枳実 各2両、橘皮3両、甘草1両、生姜4両の6味。注に「一本に茯苓2両・紅棗12枚あり」とある（翻刻確認）\n- 資料は、『外台秘要方』第十七巻・病後不得眠方に千金方と同じ条文と薬味が「集験温胆湯」の名で載るとする（要原本照合）\n- 資料は、『三因方』巻之十・驚悸証治の温胆湯は半夏・竹茹・枳実・橘皮・甘草・白茯苓・生姜・大棗の8味（二陳湯に竹茹・枳実・大棗を加えた形）で、心胆虚怯して事に触れて驚きやすいなどの精神的な症状を主とするとする（要原本照合）\n- 資料は、『世医得効方』巻第九・虚煩の温胆湯は三因方の温胆湯に人参を加えた方とする（要原本照合）\n- 資料は、『袖珍方』巻之一・傷寒の加味温胆湯（秘方）は世医得効方の温胆湯に柴胡・桔梗・香附子・麦門冬を加えた方で、後の『丹渓心法附余』巻之一にそのまま引かれるとする（要原本照合）\n- 資料は、『扶寿精方』傷寒続添に竹茹温胆湯が柴胡・枳実・半夏・竹茹・陳皮・茯苓・桔梗・香附・甘草・人参・麦門冬・黄連を姜・棗で煎服する方として載り、『万病回春』『寿世保元』より明らかに早い登載とする。資料の表17では、袖珍方の加味温胆湯との違いは黄連の有無だけ。初刊は嘉靖9年（1530）、杏雨書屋に万暦元年（1573）の重刊本があるとする（要原本照合）\n- 『万病回春』巻之二・傷寒（附傷風）の竹茹温胆湯は、傷寒で日数が経っても熱が退かず、夢寐が安らかでなく、心悸・恍惚し、煩躁して痰が多く眠れないものを治す方で、柴胡・竹茹・桔梗・枳実・黄連・人参・陳皮・半夏・茯苓・香附・甘草の11味を生姜・棗とともに煎じる。麦門冬を含まない（翻刻確認）。同じ篇で直前に置かれた温胆湯の方後に「心胆虚怯し、事に触れて驚き易きは、麦門冬・人参・柴胡・桔梗を加う」とある（翻刻確認）\n- 『古今医鑑』巻之三・傷寒の温胆湯は、虚煩して眠れないものを治す。陳皮・半夏・茯苓・枳実 各2銭、竹茹1銭、甘草5分に酸棗仁（炒）2銭を加え、生姜3片で煎じる。心胆虚怯して事に触れて驚きやすいものには麦門冬・柴胡・人参・桔梗を加える（翻刻確認）\n- 資料は、和田東郭『蕉窓雑話』初編の附方に「十一味温胆湯」（回春の竹茹温胆湯）として、柴胡・香附子・人参・黄連・甘草・竹茹・桔梗・陳皮・半夏・茯苓・枳実に姜・棗を加える方が載るとする（要原本照合）\n- 現行エキス剤（ツムラ91）は7.5g中、半夏5.0g、柴胡・麦門冬・茯苓 各3.0g、桔梗・枳実・香附子・陳皮 各2.0g、黄連・甘草・生姜・人参 各1.0g、竹茹3.0g の13味で、大棗は入らない（PMDA 添付文書 2023年12月改訂 第1版で確認）。添付文書に出典の欄はない", "構成": "半夏・柴胡・麦門冬・茯苓・桔梗・枳実・香附子・陳皮・黄連・甘草・生姜・人参・竹茹", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "滋陰至宝湯", "名前": "滋陰至宝湯", "読み": "じいんしほうとう", "ツムラ番号": "92", "出典": "万病回春（巻之六・婦人科・虚労）", "別名": "", "本文": {"条文": "### 『万病回春』巻之六・婦人科・虚労\n\n**書き下し**（読み：社員案）\n虚労にて熱嗽し汗有る者。滋陰至宝湯　婦人の諸虚百損、五労七傷、経脈調わず、肢体羸瘦するを治す。此の薬、専ら経水を調え、血脈を滋し、虚労を補い、元気を扶け、脾胃を健やかにし、心肺を養い、咽喉を潤し、頭目を清し、心慌を定め、神魄を安んじ、潮熱を退け、骨蒸を除き、喘嗽を止め、痰涎を化し、盗汗を収め、泄瀉を住め、鬱気を開き、腹痛を療し、胸膈を利し、煩渇を解し、寒熱を散じ、体疼を祛る。甚だ奇効有り。\n\n**原文**（翻刻確認）\n虛勞熱嗽有汗者。滋陰至寶湯　治婦人諸虛百損、五勞七傷、經脈不調、肢體羸瘦。此藥專調經水、滋血脈、補虛勞、扶元氣、健脾胃、養心肺、潤咽喉、清頭目、定心慌、安神魄、退潮熱、除骨蒸、止喘嗽、化痰涎、收盜汗、住泄瀉、開鬱氣、療腹痛、利胸膈、解煩渴、散寒熱、祛體疼、甚有奇效。\n\n**現代語訳**（訳：社員案）\n虚労で熱があって咳をし、汗の出るもの。滋陰至宝湯は、婦人のさまざまな虚損や五労七傷で、月経が整わず、手足や体がやせ衰えたものを治す。この薬はもっぱら月経を整え、血脈を潤し、虚労を補い、元気を助け、脾胃を丈夫にし、心肺を養い、咽喉を潤し、頭や目をすっきりさせ、胸のざわつきを鎮め、精神を安らかにし、潮熱を退け、骨蒸（骨の内から蒸されるような熱）を除き、喘ぎや咳を止め、痰を消し、盗汗を収め、下痢を止め、鬱した気を開き、腹痛を治し、胸のつかえを通じ、煩わしい口渇を解き、寒気と熱を散らし、体の痛みを除く。たいへんよく効く。\n\n### 注記\n- 『万病回春』の条は「虚労にて熱嗽し汗有る者」の見出しの下に、逍遙散に続けて載る（翻刻確認）\n- 『万病回春』の翻刻は「開鬱氣、療腹痛、利胸膈」の順で、「甚有奇效」で終わる。資料が引く『万病回春』の条は「鬱気を開き、胸膈を利し、腹痛を療し」の順で、「大いに奇効有り。尽くは述ぶる能わず」で終わる（要原本照合）\n- 維基文庫の『萬病回春』は簡体字の本で、原文は社員が繁体字にそろえた。字形は要原本照合", "出典": "### 原典の構成\n- 『万病回春』：当帰（酒洗）・白朮（芦を去る）・白芍（酒炒）・白茯苓（皮を去る）・陳皮・知母（生用。最も能く虚中の火を瀉す）・貝母（心を去る）・香附（童便炒）・地骨皮（骨を去る）・麦門冬（心を去る） 各8分、薄荷・柴胡（酒炒）・甘草 各3分（翻刻確認）\n\n### 原典の服用法\n- 『万病回春』：1剤に刻み、煨生姜3片を用いて水で煎じ、温服する（翻刻確認）\n\n### 処方の変遷\n- 逍遙散に陳皮・貝母・香附子・地骨皮・知母・麦門冬を加えた方。逍遙散の出典は『太平恵民和剤局方』巻之九・婦人諸疾（附産図）（要原本照合）\n- 『世医得効方』巻十五・産科兼婦人雑病科・煩熱には逍遙散が載り、白茯苓・白朮・当帰・白芍薬・北柴胡・甘草を姜・麦門冬で煎じ、「一方には知母・地骨皮を加う」とある（要原本照合）\n- 本方の出典は従来『万病回春』巻之六・婦人科・虚労とされる\n- 『古今医鑑』巻之十一・婦人科・虚労には、維基文庫の翻刻では「済陰至宝丹（雲林製）」の名で、同じ主治（婦人の諸虚百損・五労七傷・経脈不調・肢体羸瘦など）と同じ13味の方が載る。当帰・白朮は1銭（『万病回春』は8分）、地骨皮は「皮を去る」（『万病回春』は「骨を去る」）とし、煨生姜3片で水煎して温服する。条の字は「定心悸」「安神魂」「止泄瀉」（『万病回春』は「定心慌」「安神魄」「住泄瀉」）で、「大有奇效、不可盡述」で終わる（翻刻確認。翻刻は簡体字から直した本で字形は要原本照合）。資料は、同書巻之十一・婦人科虚労では滋陰至宝湯で方名の下に「雲林製」とあり、八巻本では巻之六・婦人虚労に済陰至宝湯として載るとする（要原本照合）。『古今医鑑』の収載が『万病回春』より早いとされる（要確認）\n- 龔廷賢の『雲林神彀』巻之三・婦人科虚労には「滋陰至宝」として薬味だけが挙がる。『寿世保元』庚集七巻・婦人科虚労には『万病回春』と同じ条文・薬味の方が済陰至宝丹の名で載る（要原本照合）\n- 『済世全書』巻之六・婦人科調経の済陰至宝丹は同名だが、薬味が大きく異なる（要原本照合）\n- 現行エキス剤（ツムラ92）は 香附子・柴胡・地骨皮・芍薬・知母・陳皮・当帰・麦門冬・白朮・茯苓・貝母・甘草・薄荷 の13味で、原典の煨生姜は入らない（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "香附子・柴胡・地骨皮・芍薬・知母・陳皮・当帰・麦門冬・白朮・茯苓・貝母・甘草・薄荷", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "滋陰降火湯", "名前": "滋陰降火湯", "読み": "じいんこうかとう", "ツムラ番号": "93", "出典": "万病回春（巻之四・虚労）", "別名": "", "本文": {"条文": "### 『万病回春』巻之四・虚労\n\n**書き下し**（読み：社員案）\n陰虚火動し、発熱咳嗽し、吐痰喘急し、盗汗して口乾くを治す。此の方、六味地黄丸と相兼ねて之を服すれば、大いに虚労を補う。神効あり。\n\n**原文**（翻刻確認）\n治陰虛火動、發熱咳嗽、吐痰喘急、盜汗口乾。此方與六味地黃丸相兼服之、大補虛勞、神效。\n\n**現代語訳**（訳：社員案）\n陰が虚して火が動き、発熱して咳をし、痰を吐いて喘ぎが急で、寝汗が出て口が渇くものを治す。この方を六味地黄丸と併せて服用すれば、大いに虚労を補う。すぐれた効き目がある。\n\n### 注記\n- 『万病回春』の翻刻は簡体字の本で、原文は繁体字にそろえて書いた（阴虚→陰虛、盗汗→盜汗、口干→口乾 など）。字形の判断には使えない（要原本照合）\n- 条の前に、虚労の門の見出しの句「虛勞者、陰虛而相火動也（陰虛火動者難治、虛勞不受補者難治）」が置かれる（翻刻確認）\n- 『万病回春』では本方は虚労の門のほか、火証・発熱・失血・眩暈・濁証・遺溺・小便閉などの門にも「方見虛勞」（火証の門では「方見勞瘵」）として挙げられ、門ごとの加減が書かれる（翻刻確認）", "出典": "### 原典の構成\n- 『万病回春』巻之四・虚労：当帰（酒洗）1銭2分、白芍（酒洗）2銭3分、生地黄8分、熟地黄（姜汁炒）・天門冬（去心）・麦門冬（去心）・白朮（去芦） 各1銭、陳皮7分、黄柏（去皮、蜜水炒）・知母 各5分、甘草（炙）5分（翻刻確認）\n\n### 原典の服用法\n- 『万病回春』巻之四・虚労：1剤に刻み、生姜3片・大棗1枚を入れて水で煎じる。服すときに竹瀝・童便・姜汁を少し入れて一緒に服す（翻刻確認）\n- 方後に、骨蒸労熱には地骨皮・柴胡を加える、数剤で熱が退かなければ炒黒乾姜3分を加える、などの加減が続く（翻刻確認）\n\n### 処方の変遷\n- 資料は、本方は元々『十薬神書』（葛可久）の戊字号に胚胎し、『十薬神書』→『明医雑著』→『古今医鑑』→『万病回春』と伝わったとし、戊字号を加減して採用したのは王節斎であるとする（要原本照合）\n- 資料は、『十薬神書』の戊字号（頭注に保真湯）を、労証を治す当帰・人参・生地黄・熟地黄・白朮・黄耆・赤茯苓・白茯苓・甘草・陳皮・厚朴・赤芍薬・白芍薬・天門冬・麦門冬・黄柏・五味子・柴胡・地骨皮・知母の20味を姜・棗で煎服する方とし、『万病回春』の滋陰降火湯の11味はすべてこれに含まれるとする（要原本照合）\n- 『明医雑著』巻一・労瘵に、色欲過度による陰虚火動の病（睡中盗汗・午後発熱・咳嗽など）を治す方として、生地黄（酒洗）・甘草（炙）・乾姜（炮） 各5分、川芎・熟地黄 各1銭、白芍薬（炒）1銭3分、陳皮7分、当帰・白朮 各1銭3分、黄柏（蜜水浸炙）7分、知母（蜜水浸拌炒）・天門冬（去心皮） 各1銭、生姜3片を水で煎じ、空腹時に温服する方が載る（翻刻確認）。竹瀝・童便・姜汁の記載はない（翻刻確認）。同じ労瘵の条の後段に「葛可久《十藥神書》方可次第检用」とある（翻刻確認）\n- 資料は、『明医雑著』のこの方を「主方　補陰瀉火湯」の方名の下に載るとする。維基文庫の翻刻（薛己注本）の該当箇所には方名が見当たらない（要原本照合）\n- 『古今医鑑』（龔信）巻之七・虚労に滋陰降火湯があり、「王節齋曰」として『明医雑著』の労瘵の文を引く。構成は当帰身（酒洗）1銭2分、川芎1銭、白芍薬（酒炒）1銭、生地黄（酒洗）5分、熟地黄（姜汁炒）1銭、天門冬1銭、黄柏（蜜炙）7分、知母（蜜炙）1銭、陳皮7分、白朮1銭3分、乾姜（炒黒）3分、甘草（炙）5分で、生姜で煎じ、竹瀝・童便・姜汁を加えて服す（翻刻確認）\n- 資料は、『古今医鑑』の滋陰降火湯から川芎・乾姜を去り、麦門冬・大棗を加えたものが『万病回春』の方であるとする（要原本照合）。『古今医鑑』と『万病回春』の翻刻の構成を比べると、この違いと一致する（翻刻確認）\n- 資料は、『医便』巻二・夏月諸症治例と『済世全書』巻之四・労瘵にも、構成の異なる滋陰降火湯が載るとする（要原本照合）\n- 資料は、黄柏・知母・甘草は李東垣『蘭室秘蔵』巻之六・自汗門の正気湯で、盗汗を治すとあるとする（要原本照合）\n- 現行エキス剤（ツムラ）は7.5g中、蒼朮3.0g、地黄・芍薬・陳皮・天門冬・当帰・麦門冬 各2.5g、黄柏・甘草・知母 各1.5g の10味（PMDA 添付文書 2023年12月改訂 第1版で確認）。原典の白朮は蒼朮になり、地黄は1品目で、生姜・大棗は入らない。添付文書に出典の欄はない", "構成": "蒼朮・地黄・芍薬・陳皮・天門冬・当帰・麦門冬・黄柏・甘草・知母", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "五虎湯", "名前": "五虎湯", "読み": "ごことう", "ツムラ番号": "95", "出典": "古今医鑑（巻之四・喘急）／仁斎直指附遺方論（巻八・喘嗽・附諸方）", "別名": "", "本文": {"条文": "### 『古今医鑑』巻之四・喘急\n\n**書き下し**（読み：社員案）\n傷寒の喘急を治す。\n\n**原文**（翻刻確認）\n治傷寒喘急。\n\n**現代語訳**（訳：社員案）\n傷寒で、喘いで息が急迫するものを治す。\n\n### 『仁斎直指附遺方論』巻八・喘嗽・附諸方\n\n**書き下し**（読み：社員案）\n五虎湯、喘急・痰気を治す。\n\n**原文**（翻刻確認）\n五虎湯治喘急痰氣\n\n**現代語訳**（訳：社員案）\n五虎湯は、喘いで息が急迫し、痰がからむものを治す。\n\n### 注記\n- 『古今医鑑』では、構成の末尾に桑白皮が「加桑皮」と別に書かれる（翻刻確認）。資料は、原方の薬味は麻黄・杏仁・石膏・甘草・細茶の5味で、桑白皮は一方として加えたものと読む\n- 維基文庫の『古今医鑑』（16巻の本）では、方名の下に批注「按此方治感寒作喘之劑」がある（翻刻確認）。資料は、「按ずるに右方は寒に感じて喘を作すを治するの剤」の句は八巻本の方後にあり、十六巻本には記載がないとする（要原本照合）\n- 維基文庫の『古今医鑑』は「繁体化」の本で、字形の判断には使えない\n- 『古今医鑑』喘急の篇では、方の前の「治」の段の末に、喘には熱喘・冷喘・水喘停飲の三つがあるとする句がある（翻刻確認）。資料は、十六巻本では五虎湯の直前にこの句があるとする\n- 『仁斎直指附遺方論』の条は、巻八・喘嗽の「附諸方」に置かれる（翻刻確認）。維基文庫の四庫全書本は書名を『仁斎直指』とし、巻頭に「宋 楊士瀛 撰」「明 朱崇正 附遺」とある（翻刻確認）\n- 『仁斎直指附遺方論』の篇名「喘嗽証治」は、維基文庫の本では「喘」の次の字が外字になっている（要原本照合）", "出典": "### 原典の構成\n- 『古今医鑑』：麻黄（去節）5銭・杏仁（去皮）2銭・石膏（煨）5銭・甘草1銭・細茶1撮、加桑白皮1銭（原文は「桑皮」）（翻刻確認）\n- 『仁斎直指附遺方論』：麻黄7分・杏仁（去皮尖）1銭・甘草4分・細茶（炒）8分・白石膏1銭5分（翻刻確認）\n\n### 原典の服用法\n- 『古今医鑑』：刻み、生姜3片・葱白3茎を入れて水で煎じ、熱服する（翻刻確認）\n- 『仁斎直指附遺方論』：1服とし、白水で煎じる（翻刻確認）\n\n### 処方の変遷\n- 麻杏甘石湯に桑白皮を加えた方。麻杏甘石湯の出典は『傷寒論』の麻黄杏仁甘草石膏湯（翻刻確認）\n- 『仁斎直指附遺方論』の五虎湯は麻黄・杏仁・甘草・細茶・白石膏の5味で、桑白皮を含まない（翻刻確認）。資料は、これを麻杏甘石湯加細茶とし、本方はまず同書で示され、のちに『古今医鑑』で「加桑皮」と工夫されたとする\n- 資料は、本方は従来『万病回春』が出典とされてきたが、それ以前に『古今医鑑』に載っているとする\n- 『万病回春』巻之二・喘急の五虎湯：麻黄3銭・杏仁（去皮尖、炒）3銭・石膏5銭・甘草1銭・細茶1撮、加桑白皮1銭。痰があれば二陳湯を加えて和す。刻んで1剤とし、生姜3片・葱白3根で煎じて熱服し、のちに小青竜湯加杏仁を用いる（翻刻確認）\n- 資料は、『古今医鑑』には王肯堂訂補の十六巻本と、それ以前の八巻本（万暦4年〔1576〕龔廷賢自序の新刊本）があり、八巻本では巻之二・喘急に収載され、薬味の欄は麻黄・杏仁・石膏・甘草・細茶のみで、方後に「桑白皮一銭半を加えて尤も妙」とあるとする（要原本照合）\n- 『古今医鑑』巻之四・哮吼に五虎二陳湯（雲林製）があり、哮吼・喘急・痰盛を治し、麻黄・杏仁・石膏・橘皮・半夏・茯苓・甘草・人参・木香・沈香・細茶を、生姜・葱白・蜜を入れて水煎する（翻刻確認）。桑白皮は入らない。資料は、これを五虎湯の原方に元々桑白皮が入っていなかったことの傍証とする（資料は蜜に触れていない）\n- 資料は、『傷寒総病論』巻第四の「煩喘を定むる麻黄甘草湯」（麻黄・杏仁・桑白皮・甘草）を本方去石膏とし、麻杏甘石湯にこの方を合方したものが本方という解釈も成り立つとする（要原本照合）\n- 現行エキス剤（ツムラ95）は 石膏10.0・杏仁4.0・麻黄4.0・桑白皮3.0・甘草2.0g の5味で、細茶は入らない（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "石膏・杏仁・麻黄・桑白皮・甘草", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "柴朴湯", "名前": "柴朴湯", "読み": "さいぼくとう", "ツムラ番号": "96", "出典": "本朝経験方", "別名": "", "本文": {"条文": "", "出典": "### 原典の構成\n\n### 原典の服用法\n\n### 処方の変遷\n- 小柴胡湯と半夏厚朴湯の合方で、資料の出典欄は「本朝経験方」（日本の経験方）。資料は、もとの2方の原典には合方投与の記載はないとする\n- 小柴胡湯の出典は『傷寒論』（弁太陽病脈証并治中第六ほか）、半夏厚朴湯の出典は『金匱要略』婦人雑病脈証并治第二十二（翻刻確認）。資料は小柴胡湯の出典に『金匱要略』も挙げる\n- 『外台秘要方』巻七・心腹脹満及鼓脹方に、心腹脹満を療する柴胡厚朴湯（柴胡・厚朴・茯苓・橘皮・紫蘇・生姜・檳榔の7味）がある（翻刻確認）。方名は柴胡と厚朴によるが、構成は今日の柴朴湯と異なる\n- 戴元礼『証治類方』巻七・寒熱門・瘧には「柴朴湯」の方名だけがあって薬味を欠き、同じく『証治要訣』巻七・寒熱門・瘧寒熱にも柴朴湯が出るが薬味は不明とされる（要原本照合）\n- 『証治準縄』類方・巻二十・諸中門・瘧の柴朴湯は、柴胡・独活・前胡・黄芩・蒼朮・厚朴・陳皮・半夏麹・白茯苓・藿香・甘草で、生姜を方後に加えるとされる（要原本照合）\n- 『祖剤』巻之一・仲景小柴胡湯に「《和剤》柴朴湯」として、柴平湯から人参を去り独活・前胡・茯苓・藿香を加え瘧を治す方が載るが、『和剤局方』には柴朴湯は見当たらないとされる（要原本照合）\n- 北山友松子編『衆方規矩刪補』巻之上・小柴胡湯の加減方に柴朴湯（風湿・諸瘧を治す）が引かれ、『衆方規矩』ではこの方は削られているとされる（要原本照合）\n- 湯本求真『皇漢医学』第弐巻に、小柴胡湯に半夏厚朴湯を合用する記載があるとされる（要原本照合）\n- 『漢方治療の方証吟味』に、小柴胡湯合半夏厚朴湯を柴朴湯と名付けて用いるとの記載があり、資料はこれを今日の柴朴湯の方名の由来とする（要原本照合）\n- 現行エキス剤（ツムラ96）は 柴胡7.0・半夏5.0・茯苓5.0・黄芩3.0・厚朴3.0・大棗3.0・人参3.0・甘草2.0・蘇葉2.0・生姜1.0g の10味（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "柴胡・半夏・茯苓・黄芩・厚朴・大棗・人参・甘草・蘇葉・生姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["出典", "構成", "方意", "諸家の論"]}, {"file": "大防風湯", "名前": "大防風湯", "読み": "だいぼうふうとう", "ツムラ番号": "97", "出典": "太平恵民和剤局方（巻之一・諸風 附脚気）／是斎百一選方（巻之三・第四門）", "別名": "", "本文": {"条文": "### 『太平恵民和剤局方』巻之一・諸風 附脚気\n\n**書き下し**（読み：社員案）\n風を袪り気を順らし、血脈を活かし、筋骨を壮んにし、寒湿を除き、冷気を逐う。又、痢を患いて後、脚痛み瘓弱して行履すること能わざるを治す。名づけて痢風と曰う。或いは両膝腫大して痛み、髀脛枯腊し、但だ皮骨を存し、拘攣跧臥して屈伸すること能わず。名づけて鶴膝風と曰う。之を服すれば気血流暢し、肌肉漸く生じ、自然に行履すること故の如し。\n\n**原文**（翻刻確認）\n袪風順氣、活血脉、壯筋骨、除寒濕、逐冷氣。又治患痢後脚痛瘓弱、不能行履、名曰痢風。或两膝腫大痛、髀脛枯腊、但存皮骨、拘攣跧卧、不能屈伸、名曰鶴膝風。服之氣血流暢、肌肉漸生、自然行履如故。\n\n**現代語訳**（訳：社員案）\n風を除き、気をめぐらせ、血脈を活発にし、筋骨を強くし、寒湿を除き、冷えの気を追い払う。また、痢病を患った後に脚が痛み、萎えて弱り、歩くことができないものを治す。これを痢風という。あるいは両膝が腫れて大きくなって痛み、股とすねがやせ細って皮と骨だけが残り、引きつって縮こまって臥し、曲げ伸ばしができないもの、これを鶴膝風という。これを服すると気血がのびやかに流れ、筋肉がしだいについて、自然にもとのように歩けるようになる。\n\n### 『是斎百一選方』巻之三・第四門\n\n**書き下し**（読み：社員案）\n風を祛り気を順らし、血脈を活かし、筋骨を壮んにし、寒湿を除き、冷気を逐う。善法寺の僧如真師の孫遂良、紹熙壬〔欠〕痢の後、足履瘓弱し、遂に鶴膝風と成る。両膝腫大して痛み、髀脛枯腊し、但だ皮骨を存するのみ。拘攣蜷〔欠〕屈伸すること能わず、人の抱持するを待ちて而る後に能く起く。此の如くすること数月、分として廃人と為る。淮東の趙徳遠参議の甥、李廿七〔欠〕此の方。之を服して気血流暢し、肌肉漸く生じ、遂に能く良く行き、剤を終えずして平復すること故の如し。真に奇方なり。\n\n**原文**（翻刻確認。欠字あり、要原本照合）\n祛風順氣、活血脉、壯筋骨、除寒濕、逐冷氣。善法寺僧如真師孫遂良、紹熙壬〔欠〕痢之後、足履瘓弱、遂成鶴膝風、兩膝腫大而痛、髀脛枯腊、但存皮骨而已、拘攣蜷〔欠〕能屈伸、待人抱持而後能起、如此數月、分為廢人。淮東趙德遠參議之甥、李廿七〔欠〕此方、服之、氣血流暢、肌肉漸生、遂能良行、不終劑平復如故、真奇方也。\n\n**現代語訳**（訳：社員案）\n風を除き、気をめぐらせ、血脈を活発にし、筋骨を強くし、寒湿を除き、冷えの気を追い払う。善法寺の僧、如真師の孫の遂良は、紹熙壬〔欠〕に痢を患った後、足が萎えて弱り、ついに鶴膝風となった。両膝が腫れて大きくなって痛み、股とすねがやせ細って皮と骨だけになった。引きつって縮こまり〔欠〕曲げ伸ばしができず、人に抱えてもらってやっと起き上がれた。こうした状態が数か月続き、廃人になるものと思っていた。淮東の趙徳遠参議の甥の李廿七が〔欠〕この方を（伝えた）。これを服すると気血がのびやかに流れ、筋肉がしだいについて、ついにうまく歩けるようになり、一剤を飲み終えないうちにもとどおりに回復した。まことに奇方である。\n\n### 注記\n- 『和剤局方』の原文は四庫全書本の翻刻による。ただし「髀脛」は、四庫全書本の翻刻では「脾脛」で文が通らないため、別の翻刻本（維基文庫『太平惠民和劑局方』）・資料の書き下し・『是斎百一選方』の翻刻の「髀脛」を採った。翻刻の「脾脛」は誤りとみられる（要原本照合）\n- 別の翻刻本（簡体字まじりで行の欠けがある）では、ほかに「袪風」は「祛風」、「瘓弱」は「痪弱」と書かれる（要原本照合）\n- 『是斎百一選方』の翻刻は簡体字の本で、原文は繁体字にそろえて書いた（祛风→祛風、气→氣、鹤膝风→鶴膝風、痪→瘓 など）。字形の判断には使えない（要原本照合）\n- 『是斎百一選方』の翻刻には欠字が3か所ある（〔欠〕で示した）。資料の書き下しでは、それぞれ「紹熙壬子の年、痢を患う」「拘攣跧臥し、屈伸すること能わず」「李廿七官人にして以って此の方を恵む」に当たる（要原本照合）。資料は紹熙壬子を1192年とする\n- 『是斎百一選方』の「蜷」は、資料の書き下しでは「跧」（要原本照合）\n- 「淮東趙德遠參議之甥」の句読は翻刻の校訂者のもの。資料は「淮東の趙徳は遠参議の甥なり」と読む（要原本照合）\n- 別の翻刻本の『和剤局方』では、大防風湯の前に「〔續添諸局經驗秘方〕」の見出しがある。四庫全書本にはこの見出しがない（翻刻確認）", "出典": "### 原典の構成\n- 『和剤局方』：熟乾地黄（洗）・防風（去蘆）・杜仲（去麄皮、炒りて糸を断つ）・川当帰（洗）・黄耆（微炙）・白芍薬・白朮 各2両、羌活（去蘆）・牛膝（去蘆）・人参（去蘆）・甘草（炙） 各1両、附子（炮、去皮臍）・川芎（撫芎は用うべからず） 各1両半（翻刻確認）\n- 『是斎百一選方』：防風（去芦）・白朮・杜仲（去粗皮、炒、糸を断つ、秤）・川当帰（洗）・熟乾地黄（洗）・白芍薬・黄耆（微炒、秤） 各2両、羌活（去芦）・牛膝（去芦）・甘草（炒）・人参（去芦、秤） 各1両（翻刻確認）。翻刻には附子・川芎がなく、黄耆は「黄」の1字のみ。資料は附子・川芎を含む13味とし、方後の調理も含めて『和剤局方』と全く同一とする（要原本照合）\n\n### 原典の服用法\n- 『和剤局方』：粗末とし、1回5銭を水1盞半に、銭の大きさの生姜7片・大棗1枚を入れて8分まで煎じ、滓を去って温服する。空腹時・食前に（翻刻確認）\n- 『是斎百一選方』：粗末とし、よく混ぜ合わせ、1回5銭を水1盞半に、生姜7片・大棗1枚を入れて8分まで煎じ、滓を去って温服する（翻刻確認）\n- 『是斎百一選方』の方後には、前にまた人が「四物湯を煎じて四斤丸を下す」法を言ったが、遂良はすでに安らかになっていたので服さなかった、と追記され、四斤丸は脚気が往来して相搏ち痛むものを治すと注される（翻刻確認。資料の書き下しでは「四斤元」）\n\n### 処方の変遷\n- 資料は、本方の出典は従来『和剤局方』巻之一・諸風 附脚気とされ、『和剤局方』の続添諸局経験秘方（1241〜52年）に収載されているとする（要原本照合）\n- 資料は、実際の出典は『和剤局方』収載より半世紀ほど前の『是斎百一選方』巻之三・第四門（中風・癱瘓・風癇・暗風・痛風・手麻・足弱・寒湿痺・臂腿骨痛・鶴膝風）で、組成は方後の調理も含めて『和剤局方』と同一であり、『和剤局方』が採録したとする。条文中の記述からは本方の出典は趙徳方というべきか、ともする（要原本照合。第四門の門名は翻刻確認）\n- 資料の出典欄には『理傷続断方』が挙がるが、維基文庫の『仙授理傷續斷秘方』の翻刻には大防風湯は見当たらない（翻刻確認）。四物湯の出典は『理傷続断方』・『和剤局方』（このアプリの四物湯の項）\n- 資料は、本方を四物湯合附子人参湯に防風・杜仲・黄耆・羌活・牛膝・大棗を加味した処方とする（要確認）\n- 原典では地黄は熟乾地黄で、乾姜ではなく生姜を用いる（翻刻確認）。資料は、薬効上は乾姜の方がよいとする\n- 現行エキス剤（ツムラ97）は10.5g中、黄耆・地黄・芍薬・蒼朮・当帰・杜仲・防風 各3.0g、川芎2.0g、甘草・羌活・牛膝・大棗・人参 各1.5g、乾姜1.0g、ブシ末1.0g の15味（PMDA 添付文書 2023年12月改訂 第1版で確認）。原典の白朮は蒼朮に、生姜は乾姜になっている。添付文書に出典の欄はない", "構成": "黄耆・地黄・芍薬・蒼朮・当帰・杜仲・防風・川芎・甘草・羌活・牛膝・大棗・人参・乾姜・附子（ブシ末）", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "黄耆建中湯", "名前": "黄耆建中湯", "読み": "おうぎけんちゅうとう", "ツムラ番号": "98", "出典": "金匱要略（血痺虚労病脈証并治第六）／太平恵民和剤局方（巻五・補虚損）", "別名": "", "本文": {"条文": "### 『金匱要略』血痺虚労病脈証并治第六\n\n**書き下し**（読み：社員案）\n虚労、裏急、諸の不足は、黄耆建中湯之を主る。\n\n（原注）小建中湯の内に於いて黄耆一両半を加え、余は上法に依る。気短、胸満する者は生姜を加え、腹満する者は棗を去り茯苓一両半を加う。及び肺の虚損不足を療し、気を補うには半夏三両を加う。\n\n**原文**（翻刻確認）\n虛勞裏急、諸不足、黃耆建中湯主之。\n\n（原注）於小建中湯內加黃耆一兩半、餘依上法。氣短胸滿者加生薑、腹滿者去棗加茯苓一兩半、及療肺虛損不足、補氣加半夏三兩。\n\n**現代語訳**（訳：社員案）\n虚労で、裏急（腹がひきつれる）があり、もろもろの不足があるものは、黄耆建中湯が主治する\n\n（原注）小建中湯に黄耆1両半を加え、ほかは前の小建中湯の法に従う。息切れして胸が張るものには生姜を加え、腹が張るものには大棗を去って茯苓1両半を加える。肺の虚損・不足を治して気を補うには半夏3両を加える\n\n### 『太平恵民和剤局方』巻五・補虚損（附 骨蒸）\n\n**書き下し**（読み：社員案）\n男子・女人の諸の虚不足、小腹急痛し、脇肋䐜脹し、臍下虚満し、胸中煩悸し、面色萎黄し、唇口乾燥し、力少なく身重く、胸満短気し、腰背強痛し、骨肉酸疼し、行動すれば喘乏し、飲食すること能わざるを治す。或いは労傷過度に因り、或いは病後復せざるに因るも、並びに宜しく之を服すべし。\n\n**原文**（翻刻確認）\n治男子女人諸虛不足、小腹急痛、脇肋䐜脹、臍下虛滿、胸中煩悸、面色萎黄、唇口乾燥、少力身重、胸滿短氣、腰背強痛、骨肉酸疼、行動喘乏、不能飲食。或因勞傷過度、或因病後不復、並宜服之。\n\n**現代語訳**（訳：社員案）\n男女のさまざまな虚弱・不足で、下腹が急迫して痛み、脇腹が張り、臍の下が虚して膨れ、胸の中がもだえて動悸し、顔色が萎えて黄ばみ、唇や口が乾き、力がなく体が重く、胸が張って息切れし、腰や背中がこわばって痛み、骨や肉がだるく痛み、動くと息が切れ、飲食ができないものを治す。過労によるものも、病後に回復しないものも、いずれもこれを服するのがよい。\n\n### 注記\n- 原注は条文に続く小字双行の注（資料の記載）\n- 原典の構成の小建中湯の甘草は、『金匱要略』の小建中湯方では3両（翻刻確認）、『傷寒論』（宋本）の小建中湯方では2両（要原本照合）。本文は『金匱要略』の値をとった\n- 『和剤局方』の条は、四庫全書本の翻刻から取った。方名は翻刻では「黄茋建中湯」と書かれる（字体の違い）。門名は翻刻では「治諸虛　附　骨蒸」、資料では「補虚損 附 骨蒸」\n- 『和剤局方』の「勞傷過度」の「過」と、服用法の「餳」は、四庫全書本の翻刻では外字で字が確かめられない。資料の書き下しの字を置いた（要原本照合）\n- 『和剤局方』の「虛」「面」「乾」「胸」「強」は、四庫全書本の翻刻では「虗」「靣」「亁」「胷」「强」と書かれる（字体の違い）\n- 『和剤局方』の「或因病後不復」は、資料の書き下しでは「病後に常に復さざる」と「常」が入る（要原本照合）", "出典": "### 原典の構成\n- 『金匱要略』：小建中湯（桂枝3両（去皮）・甘草3両（炙）・大棗12枚・芍薬6両・生姜3両・膠飴1升）に黄耆1両半を加える（翻刻確認）\n- 『金匱要略』の加減：気短・胸満には生姜を加える。腹満には大棗を去り茯苓1両半を加える。肺の虚損・不足を治し気を補うには半夏3両を加える（翻刻確認）\n- 『和剤局方』：黄耆・肉桂（去粗皮）各3両、甘草（炙）2両、白芍薬6両（翻刻確認）。服用時に生姜・大棗・餳を加える（服用法を参照）\n\n### 原典の服用法\n- 『金匱要略』：小建中湯の法に依る。水7升で煮て3升を取り、滓を去り、膠飴を入れて再び弱火にかけて溶かし、1升を温服、日に3回（翻刻確認）\n- 『金匱要略』の小建中湯の条の注に、嘔家には甘いため建中湯を用いてはならないとある（翻刻確認）\n- 『和剤局方』：粗散とし、1回3銭を水1盞半に生姜3〜4片・大棗1枚を入れて共に煎じ、1中盞を取って滓を漉し去り、餳を少し入れて再び煎じて溶かし、やや熱いうちに空腹時・食前に服す（翻刻確認。「餳」は要原本照合）\n\n### 処方の変遷\n- 原典の注のとおり、小建中湯に黄耆を加えた方（翻刻確認）\n- 『備急千金要方』第十九・腎蔵・補腎第八の黄耆建中湯方には、嘔には生姜を倍にし、腹満には大棗を去り茯苓4両を加える加減法が付く（要原本照合）\n- 『仁斎直指附遺方論』巻三・湿・中湿証治の黄耆建中湯は、黄耆・辣桂・甘草・白芍薬で、膠飴を用いない（要原本照合）\n- 『万安方』（梶原性全）巻第十四上・虚労門上・諸虚労通薬の黄耆建中湯（良験方）は、白芍薬・黄耆・桂心・甘草を生姜・大棗で煎じ、飴を少し入れて溶かす（要原本照合）\n- 『万安方』巻十四下の黄耆建中湯（必用方）は、乾大棗・生姜・黄耆・甘草・官桂・白芍薬・人参・半夏で、膠飴または糯米餳を入れる（要原本照合）\n- 『衆方規矩』（曲直瀬道三原著・曲直瀬玄朔増補）巻之中・自汗盗汗の黄耆建中湯は膠飴を用いない（要原本照合）\n- 『療治経験筆記』（津田玄仙）巻之五・六・汗門の黄耆建中湯は、黄耆・桂・芍薬・生姜・大棗・膠飴で甘草を用いない（要原本照合）\n- 『普済本事方』（許叔微）巻第八・傷寒時疫上に、建中湯に当帰・黄耆を加えた黄耆建中加当帰湯がある（要原本照合）\n- 『千金要方』に引かれる『古今録験方』の加減（乾姜を生姜に代え当帰4両を加える）は、実際上は華岡青洲の帰耆建中湯にあたると資料はする（要確認）\n- 現行エキス剤（ツムラ98）は 芍薬・黄耆・桂皮・大棗・甘草・生姜 の混合生薬の乾燥エキスに膠飴（日局コウイ）を加えたもの。1日量は芍薬6.0・黄耆4.0・桂皮4.0・大棗4.0・甘草2.0・生姜1.0g、コウイ10.0g（PMDA 添付文書 2023年12月改訂で確認）", "構成": "芍薬・黄耆・桂皮・大棗・甘草・生姜・膠飴", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "小建中湯", "名前": "小建中湯", "読み": "しょうけんちゅうとう", "ツムラ番号": "99", "出典": "傷寒論（巻第三・弁太陽病脈証并治中第六）／金匱要略（血痺虚労病脈証并治第六・黄疸病脈証并治第十五・婦人雑病脈証并治第二十二）", "別名": "", "本文": {"条文": "### 『傷寒論』巻第三・弁太陽病脈証并治中第六\n\n**書き下し**（読み：社員案）\n傷寒、陽脈渋、陰脈弦なるは、法として当に腹中急痛すべし。先ず小建中湯を与え、差えざる者は、小柴胡湯を与えて之を主る。\n\n**原文**（翻刻確認）\n傷寒、陽脈澀、陰脈弦、法當腹中急痛、先與小建中湯、不差者、與小柴胡湯主之。\n\n**現代語訳**（訳：社員案）\n傷寒で、陽脈が渋、陰脈が弦であるものは、法則として腹の中がひきつれるように痛むはずである。まず小建中湯を与え、治らないものには小柴胡湯を与えて主治させる。\n\n**書き下し**（読み：社員案）\n傷寒二三日、心中悸して煩する者は、小建中湯之を主る。\n\n**原文**（翻刻確認）\n傷寒二三日、心中悸而煩者、小建中湯主之。\n\n**現代語訳**（訳：社員案）\n傷寒にかかって二、三日で、胸のうちが動悸して煩わしく落ち着かないものは、小建中湯がこれを主治する。\n\n### 『金匱要略』血痺虚労病脈証并治第六\n\n**書き下し**（読み：社員案）\n虚労、裏急し、悸し、衄し、腹中痛み、夢に失精し、四肢痠疼し、手足煩熱し、咽乾き口燥くは、小建中湯之を主る。\n\n**原文**（翻刻確認）\n虛勞裏急、悸、衄、腹中痛、夢失精、四肢痠疼、手足煩熱、咽乾口燥、小建中湯主之。\n\n**現代語訳**（訳：社員案）\n虚労で、裏急（腹がひきつれる）し、動悸がし、鼻血が出て、腹の中が痛み、夢を見て精を漏らし、手足がだるく痛み、手足がほてり、咽が乾き口が乾燥するものは、小建中湯がこれを主治する。\n\n### 『金匱要略』黄疸病脈証并治第十五\n\n**書き下し**（読み：社員案）\n男子の黄、小便自利するは、当に虚労の小建中湯を与うべし。\n\n（原注）方は虚労中に見ゆ。\n\n**原文**（翻刻確認）\n男子黃、小便自利、當與虛勞小建中湯。\n\n（原注）方見虛勞中。\n\n**現代語訳**（訳：社員案）\n男子の黄（黄疸）で、尿が自然によく出るものには、虚労の小建中湯を与えるべきである。\n\n（原注）方は虚労の篇に見える。\n\n### 『金匱要略』婦人雑病脈証并治第二十二\n\n**書き下し**（読み：社員案）\n婦人の腹中痛むは、小建中湯之を主る。\n\n**原文**（翻刻確認）\n婦人腹中痛、小建中湯主之。\n\n**現代語訳**（訳：社員案）\n婦人で腹の中が痛むものは、小建中湯がこれを主治する。\n\n### 注記\n- 『傷寒論』の1条目の「澀」は、資料の書き下しでは「濇」と書かれる（要原本照合）。書き下しは新字体の「渋」とした\n- 『金匱要略』血痺虚労の条の「痠疼」は、資料の書き下しでは「酸疼」と書かれる（要原本照合）\n- 原典の構成の甘草は、『傷寒論』（宋本）では2両、『金匱要略』では3両（翻刻確認）。書ごとに分けて載せた\n- 資料は、『金匱要略』の小建中湯方の小字注「嘔家は建中湯を用うべからず。甜きを以っての故也」に続けて、『千金』の文（男女の積冷・気滞などで虚損したものを治し、黄耆建中湯と名づけ、人参2両を加える旨）があるとする。維基文庫の『金匱要略』の翻刻には「嘔家不可用建中湯，以甜故也。」までしかない（要原本照合）", "出典": "### 原典の構成\n- 『傷寒論』（宋本）：桂枝3両（去皮）、甘草2両（炙）、大棗12枚（擘）、芍薬6両、生姜3両（切）、膠飴1升（翻刻確認）\n- 『金匱要略』：桂枝3両（去皮）、甘草3両（炙）、大棗12枚、芍薬6両、生姜3両、膠飴1升（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』（宋本）：6味を水7升で煮て3升を取り、滓を去り、飴を入れて再び弱火にかけて溶かし、1升を温服、日に3回。嘔家（よく吐く人）には建中湯を用いてはならない、甘いためである、と添える（翻刻確認）\n- 『金匱要略』：6味を水7升で煮て3升を取り、滓を去り、膠飴を入れて再び弱火にかけて溶かし、1升を温服、日に3回。小字の注に、嘔家には甘いため建中湯を用いてはならないとある（翻刻確認）\n\n### 処方の変遷\n- 『傷寒論』（宋本）の桂枝加芍薬湯（桂枝3両・芍薬6両・甘草2両・生姜3両・大棗12枚）に膠飴1升を加えた構成にあたる（翻刻確認）\n- 『備急千金要方』巻第三・婦人方中・心腹痛第四には、産後に少腹痛に苦しむものを治す芍薬湯として同じ6味が載り、資料は甘草2両・膠飴8両・生姜3両とする（要原本照合）\n- 『備急千金要方』巻第十九・腎蔵・補腎第八には、男女の積労・虚損を小建中湯で治すとする記載がある（要原本照合）\n- 『肘後百一方』巻之四・治虚損羸痩不堪労動方第三十三にも、ほぼ同じ文が載るとされる（要原本照合）\n- 『千金翼方』巻第九・傷寒上・太陽病雑療法第七では、「傷寒二三日、心中悸して煩する者」の条に小建中湯が載り、資料は甘草2両・大棗11枚・生姜3両で、ほかは同じとする（要原本照合）\n- 『外台秘要方』第十七巻・虚労下・虚労心腹痛方には、『古今録験』の芍薬湯として、虚労で腹中が痛み、夢に失精し、四肢が痛み、手足が煩熱し、咽が乾き口が燥くもの、あわせて婦人の少腹痛を治す方が載る。服薬は「日に三、夜に一」。小字注に仲景の小建中湯方で、もとは甘草2両・生姜3両とあるが、ここでは甘草3両・生姜4両とされる（要原本照合）\n- 『薛氏医案』巻二十五・明医雑著・附方では、『金匱要略』血痺虚労の条を適応証として引き、小建中湯から膠飴を去り阿膠を加えた処方にしているとされる（要原本照合）\n- 本方証で虚寒が明らかなときに大建中湯を合方したものを中建中湯、人参湯を合方したものを建理湯、さらに附子末を加えたものを附子建中湯と呼ぶとされる（要確認）\n- 現行エキス剤（ツムラ99）は 芍薬・桂皮・大棗・甘草・生姜 の混合生薬の乾燥エキスに膠飴（日局コウイ）を加えたもの。1日量15.0g中、シャクヤク6.0・ケイヒ4.0・タイソウ4.0・カンゾウ2.0・ショウキョウ1.0g の混合生薬の乾燥エキス3.75gと、日局コウイ10.0gを含む（PMDA 添付文書 2023年12月改訂 第1版で確認）。原典の「桂枝」は、添付文書では「ケイヒ」と書かれる", "構成": "芍薬・桂皮・大棗・甘草・生姜・膠飴", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "大建中湯", "名前": "大建中湯", "読み": "だいけんちゅうとう", "ツムラ番号": "100", "出典": "金匱要略（腹満寒疝宿食病脈証并治第十）", "別名": "", "本文": {"条文": "### 『金匱要略』腹満寒疝宿食病脈証并治第十\n\n**書き下し**（読み：社員案）\n心胸中大いに寒えて痛み、嘔して飲食すること能わず、腹中満ち、上衝して皮起こり、出で見われて頭足有り、上下痛みて触れ近づくべからざるは、大建中湯之を主る。\n\n**原文**（翻刻確認）\n心胸中大寒痛、嘔不能飲食、腹中滿、上衝皮起、出見有頭足、上下痛而不可觸近、大建中湯主之。\n\n**現代語訳**（訳：社員案）\n胸から心窩部にかけてひどく冷えて痛み、吐いて飲食ができず、腹の中が張り、突き上げて皮が盛り上がり、頭や足があるようなものが現れ出て見え、上下に痛んで触れることも近づけることもできないものは、大建中湯がこれを主治する。\n\n### 注記\n- 「腹中滿」は、維基文庫の『金匱要略』の翻刻による。四部叢刊本（明嘉靖俞橋刊本の影印）の翻刻は「腹中寒」で、資料の書き下しも「腹中の寒上衝し」と「寒」の字で読む（要原本照合）\n- 「大建中湯主之」は、四部叢刊本の翻刻では「冝用後湯」（後の湯を用うべし）として、続けて大建中湯方を載せる（要原本照合）\n- 資料は篇名を「腹満寒疝宿食病脉証第十」とする。維基文庫の『金匱要略』の翻刻は「腹滿寒疝宿食病脈證並治第十」、四部叢刊本の翻刻は「腹滿寒疝宿食病脉證治第十」（「宿」は異体字）。篇名は前者に従った（翻刻確認）\n- 原典の構成・服用法は、維基文庫の『金匱要略』の翻刻には大建中湯方が載っていないため、四部叢刊本の翻刻から取った\n- 蜀椒の小字注は、四部叢刊本の翻刻では「汁」の1字（双行の片方が空）で注として通らないため、資料の「去汗」（蜀椒二合、去汗）を原典の構成に採った。翻刻の「汁」は誤りとみられる（要原本照合）\n- 四部叢刊本の翻刻は「乾姜」を「乾　姜」、「再服」を「𠕂服」、「微火」を「㣲火」と書く。字体だけの違い（要原本照合）", "出典": "### 原典の構成\n- 『金匱要略』（四部叢刊本）：蜀椒2合（汗を去る）、乾姜4両、人参2両、膠飴1升（翻刻確認。蜀椒の注は資料の字（要原本照合））\n\n### 原典の服用法\n- 『金匱要略』（四部叢刊本）：3味を水4升で煮て2升を取り、滓を去り、膠飴1升を入れ、弱火で煎じて1升半を取り、2回に分けて温服する。飯を炊くほどの間をおいて粥2升を飲むとよい。その後さらに服し、1日の間は糜（かゆ）を食べ、温かく覆う（翻刻確認）\n\n### 処方の変遷\n- 『備急千金要方』巻第十六・胃腑・痼冷積熱第八に大建中湯が載り、組成は原典と同じとされる（要原本照合）\n- 『備急千金要方』巻第十九・腎蔵・補腎第八にも大建中湯が2通り載るとされる。一つは甘草・人参・半夏・生姜・蜀椒・飴糖、もう一つは飴糖・黄耆・遠志・当帰・沢瀉・芍薬・人参・竜骨・甘草・生姜・大棗（要原本照合）\n- 同じ巻第十九の前者の大建中湯の後の条には、裏急拘引には芍薬・桂心各3両、手足が厥し腰背が冷えるものには附子1枚、労するものには黄耆1両を加えるとあるとされる（要原本照合）\n- 後者の大建中湯は『千金翼方』巻第十五・補益・五蔵気虚第五にも同名で載るとされる（要原本照合）\n- 大塚敬節は、小建中湯合大建中湯から膠飴を去り、生姜を去って乾姜を入れた処方を中建中湯と名づけて用いたとされる（『日本東洋医学会誌』第17巻第4号。要原本照合）\n- 現行エキス剤（ツムラ100）は 乾姜・人参・山椒 の混合生薬の乾燥エキスに膠飴（日局コウイ）を加えたもの。1日量15.0g中、カンキョウ5.0・ニンジン3.0・サンショウ2.0g の混合生薬の乾燥エキス1.25gと、日局コウイ10.0gを含む（PMDA 添付文書 2023年12月改訂 第1版で確認）。原典の「蜀椒」は、添付文書では「サンショウ」と書かれる", "構成": "乾姜・人参・山椒・膠飴", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "升麻葛根湯", "名前": "升麻葛根湯", "読み": "しょうまかっこんとう", "ツムラ番号": "101", "出典": "閻氏小児方論（升麻葛根湯。専治麻痧初編 巻二の閻氏孝忠附方）／太平恵民和剤局方（巻二・傷寒 附 中暑）", "別名": "", "本文": {"条文": "### 『閻氏小児方論』（閻孝忠）升麻葛根湯\n\n**書き下し**（読み：社員案）\n傷寒・温疫の風熱、壮熱・頭痛・肢体痛し、瘡疹已に発し未だ発せざるを治す。並びに宜しく之を服すべし。\n\n**原文**（翻刻確認）\n治傷寒溫疫風熱、壯熱頭痛肢體痛、瘡疹已發未發、並宜服之。\n\n**現代語訳**（訳：社員案）\n傷寒・温疫の風熱で、高い熱が出て頭痛や手足・身体の痛みがあり、瘡疹がすでに出たものもまだ出ないものも治す。いずれもこれを服用するのがよい。\n\n### 『太平恵民和剤局方』巻二・傷寒 附 中暑\n\n**書き下し**（読み：社員案）\n大人・小児の時気・瘟疫、頭痛発熱し、肢体煩疼するを治す。及び瘡疹已に発し、及び未だ発せざる、疑弐の間、並びに宜しく之を服すべし。\n\n**原文**（翻刻確認）\n治大人小兒時氣瘟疫、頭痛發熱、肢體煩疼、及瘡疹已發、及未發疑貳之間、並宜服之。\n\n**現代語訳**（訳：社員案）\n大人や小児の時気（季節の流行病）・瘟疫で、頭痛・発熱があり、手足や身体がわずらわしく痛むものを治す。また瘡疹がすでに出たものも、まだ出ずに疑わしい間のものも、いずれもこれを服用するのがよい。\n\n### 注記\n- 『閻氏小児方論』の原文は、清・凌徳『専治麻痧初編』巻二の「閻氏孝忠附方」に収められた翻刻で確かめた。翻刻は簡体字のため本文は旧字体に直して置いた。字形の判断には使えない（要原本照合）\n- 『閻氏小児方論』の条は、翻刻では「升麻葛根湯」の前に、瘡疹が出ようとして見分けがつかないうちは升麻葛根湯などを服させ、已発・未発ともに宜しいとする文があり、「大人同じ」と続く（翻刻確認）\n- 『和剤局方』の方後は、翻刻では「以病身清凉為度」（病身が清涼となるのを度とする）。資料の書き下しでは「病気去り、身清涼なるを以って度と為す」と「去」がある形で読まれる（要原本照合）\n- 資料の出典欄は『小児斑疹備急方論』だけで、資料は閻氏・局方の条を方名の由来として挙げる。『小児斑疹備急方論』の方は升麻散の名なので、処方の変遷に置いた\n- 条文の順：閻氏・局方とも現行エキス剤と同じ升麻・葛根・芍薬・甘草で（生姜は現行エキス剤だけにある）、構成一致の出典が2つある。資料が挙げる順（閻氏が先）にした（要確認）", "出典": "### 原典の構成\n- 『閻氏小児方論』：升麻・乾葛・芍薬・甘草（炙）各半両（翻刻確認）\n- 『和剤局方』：升麻・葛根・白芍薬・甘草（炙）各10両（翻刻確認）\n\n### 原典の服用法\n- 『閻氏小児方論』：粗末とし、1回4銭を水1盞半で1盞に煎じ、大小を量って与え、時を問わず温服する（翻刻確認）\n- 『和剤局方』：粗末とし、1回3銭を水1盞半で煎じて1中盞を取り、滓を去り、やや熱くして時を問わず服す。日に2〜3回。病身が清涼となるのを度とし、小児は年齢により加減して与える（翻刻確認。「不拘時」の次の1字は翻刻で外字になっていて読めない）\n\n### 処方の変遷\n- 董汲『小児斑疹備急方論』（北宋。翻刻の巻末に元祐8年（1093）の銭乙の題がある）の薬方に升麻散の名で載る。疹疱がまだ出ず疑わしい間で身熱が傷寒・温疫に似るもの、および瘡子がすでに出て発熱するものを治し、升麻・芍薬・葛根（剉み炒る）・甘草（炙）各1両を細末とし、2歳の児に1回2銭を水1盞で5分に煎じて温服し、日に3回・夜に1回服す。生姜は入らない（翻刻確認。『専治麻痧初編』巻二に収められた翻刻による）。資料の出典欄はこの書だが、方名が違うので条文の欄には置かない\n- 同時代の閻孝忠の書（『閻氏小児方論』）に升麻葛根湯の方名で載り、今日の方名はこれに由来するとされる（翻刻確認）\n- 『和剤局方』巻二・傷寒 附 中暑にも升麻葛根湯の名で載る（翻刻確認）\n- 『傷寒活人書』巻第十六の巻首には升麻湯の名で、傷寒・中風の頭痛・憎寒壮熱などと小児・大人の瘡疹に用いる条があるとされる（要原本照合）\n- 生姜を加えて煎じる指示は『扶寿精方』の升麻湯や『万病回春』巻之二・傷寒の升麻葛根湯などに見えるとされる（要原本照合）\n- 現行エキス剤（ツムラ101）は 葛根・芍薬・升麻・甘草・生姜 の5味で、原典にない生姜を含む（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "葛根・芍薬・升麻・甘草・生姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "当帰湯", "名前": "当帰湯", "読み": "とうきとう", "ツムラ番号": "102", "出典": "小品方（巻第一・治心痛腹脹満冷痛諸方）／外台秘要方（巻七・心腹痛及脹満痛方。小品方の引用）／備急千金要方（巻十三・心腹痛第六）", "別名": "", "本文": {"条文": "### 『小品方』巻第一・治心痛腹脹満冷痛諸方\n\n**書き下し**（読み：社員案）\n当帰湯、心腹絞痛し、諸もろの虚冷の気満つるを主る方。\n\n**原文**（翻刻確認）\n當歸湯、主心腹絞痛、諸虚冷氣滿方。\n\n**現代語訳**（訳：社員案）\n当帰湯。胸から腹にかけて絞られるように痛み、さまざまな虚して冷えた気が満ちるものを主治する処方。\n\n### 『外台秘要方』巻七・心腹痛及脹満痛方（『小品方』の引用）\n\n**書き下し**（読み：社員案）\n小品の当帰湯、心腹絞痛し、諸もろの虚冷の気満つるを療する方。\n\n**原文**（翻刻確認）\n小品當歸湯、療心腹絞痛、諸虚冷氣滿方。\n\n**現代語訳**（訳：社員案）\n『小品方』の当帰湯。胸から腹にかけて絞られるように痛み、さまざまな虚して冷えた気が満ちるものを治す処方。\n\n### 『備急千金要方』巻十三・心臓・心腹痛第六\n\n**書き下し**（読み：社員案）\n心腹絞痛し、諸もろの虚冷の気満ちて痛むを治する方。\n\n**原文**（翻刻確認）\n治心腹絞痛諸虛冷氣滿痛方。\n\n**現代語訳**（訳：社員案）\n胸から腹にかけて絞られるように痛み、さまざまな虚して冷えた気が満ちて痛むものを治す処方。\n\n### 注記\n- 『小品方』の翻刻（維基文庫）は簡体字で（「当归汤，主心腹绞痛，诸虚冷气满方」）、底本の記載がない。原文は字体を直して示した。字形の判断は要原本照合\n- 『小品方』の篇名は、翻刻では「治心痛腹胀满冷痛诸方」、資料では「治心腹脹満冷痛諸方」（要原本照合）\n- 主治の文の動詞は、『小品方』が「主」、『外台秘要方』が「療」、『備急千金要方』が「治」（翻刻確認）\n- 主治の文の末は、『小品方』『外台秘要方』が「氣滿方」、『備急千金要方』が「氣滿痛方」（翻刻確認）\n- 『外台秘要方』は外台が『小品方』から引いた形で「小品當歸湯」と書き、方後の小字注に「古今録験・千金も同じ」とある（翻刻確認）", "出典": "### 原典の構成\n- 『小品方』：当帰3両、乾姜4両、甘草2両、芍薬3両、厚朴3両、黄□2両、蜀椒1…（翻刻確認）。翻刻は「蜀椒（一」で行が切れ、分量の続きと残りの3味が欠ける。「黄□」は翻刻で1字空白。方後に「凡十物」とある。資料は10味を当帰・乾姜・甘草・芍薬・厚朴・黄耆・蜀椒・半夏・桂心・人参とし、分量は挙げない（要原本照合）\n- 『外台秘要方』（『小品方』の引用）：当帰3両、乾姜4両、甘草3両（炙）、芍薬2両、厚朴3両（炙）、黄耆2両、蜀椒1両（汗）、半夏3両（洗）、肉桂3両、人参3両（翻刻確認）\n- 『備急千金要方』：当帰・芍薬・厚朴・半夏 各2両、桂心・甘草・黄耆・人参 各3両、乾姜4両、蜀椒1両（翻刻確認）\n\n### 原典の服用法\n- 『小品方』：10味を水1斗で煮て3升2合を取る。強い人は1升、羸せた人は8合を服す。大いに冷える者は附子1枚を加える（翻刻確認）\n- 『外台秘要方』（『小品方』の引用）：10味を切り、水1斗で煮て3升2合を取る。強い人は1升、羸せた人は8合を服す。大いに冷える者は附子1枚（炮）を加える。海藻・菘菜・羊肉・餳・生葱を忌む（翻刻確認）\n- 『備急千金要方』：10味を㕮咀し、水1斗で煮て3升2合を取り、4回に分けて服す。羸弱の人は6回に分ける。方後の小字注に、人が冷えるなら附子1枚を加えるとよいとある（翻刻確認）。小字注が引く書名は翻刻では「短劇」、資料では『小品方』。「人冷」は資料では「大いに冷ゆれば」（要原本照合）\n\n### 処方の変遷\n- 資料は、本方は従来『備急千金要方』巻十三・心腹痛第六の当帰湯が出典と考えられ「千金当帰湯」と呼ばれることが多いが、陳延之撰『小品方』に載り、『千金方』『外台秘要方』以前に『小品方』に収載されていたことが明らかで、『外台秘要方』にならい「小品当帰湯」と呼ぶ方が適当とする（要確認）\n- 資料は、『小品方』は昭和59年に北里研究所附属東洋医学総合研究所によって、前田育徳会尊経閣文庫蔵の古鈔巻子本の中から残巻が見つかったとする（要確認）\n- 『備急千金要方』同篇には、本方に続いて当帰を主とする「又方」が5方、温中当帰湯・羊肉当帰湯が並ぶ（翻刻確認）。資料は同篇に同名異方が9方載るとする（要確認）\n- 同篇の又方（久寒宿疾、胸腹中痛、短気、時に滞下痢するものを治す。当帰・桂心・乾姜・附子）の小字注に、范汪方には附子がなく甘草2両があり、虚冷激痛の甚だしい者には黄耆・芍薬各2両を加えるとある（翻刻確認）。資料は、この范汪方の当帰・桂心・乾姜・甘草・黄耆・芍薬が本方の構成薬味にあたるとする（要確認）\n- 同篇の又方（寒冷腹中痛を治す。当帰・桂心・甘草・人参・生姜・半夏・小麦・呉茱萸）は、小字注で呉茱萸湯の名とされる（翻刻確認）。『小品方』の同じ篇に「茱萸湯」として、『外台秘要方』巻七・腹痛方に「小品療寒冷腹痛茱茰湯方」として載る（翻刻確認）\n- 同篇の又方（冷気が脇下を往来し胸膈を衝いて痛み、脇背に引いて悶えるものを治す。当帰・桂心・人参・甘草・呉茱萸・芍薬・大黄・茯苓・枳実・乾姜）の小字注に、外台の仲景方には茯苓・枳実がないとある（翻刻確認）。『外台秘要方』巻七・腹痛方には、張文仲の当帰大黄（冷気が腰背・肋下に牽引して腹内が痛むものを療す。当帰・芍薬・桂心・乾姜・茱茰・人参・大黄・甘草）として茯苓・枳実のない形で載る（翻刻確認。翻刻は方名を「張文仲當歸大黄」とし「湯」の字がない）。同巻・胸脇痛及妨悶方には、千金の当帰湯として茯苓・枳実を含む形で載る（翻刻確認）\n- 資料は、『備急千金要方』巻三・婦人方中・心腹痛第四の当帰湯（当帰・生姜・芍薬・羊肉）は『金匱要略』の当帰生姜羊肉湯にあたり、同巻・中風第三の蜀椒湯（蜀椒・芍薬・当帰・半夏・甘草・桂心・人参・茯苓・蜜・生姜汁）は本方去厚朴・黄耆・乾姜加茯苓・蜜・生姜汁で、『千金翼方』巻六・心痛第五にも同じ薬味で載るとする（要原本照合）\n- 資料は、『聖済総録』巻四十三・心中寒の当帰湯（当帰・桂・甘草・乾姜）、『普済方』巻二百四十八・寒疝心腹痛の当帰湯（本方去芍薬加青橘皮・附子・生姜）は同名の別方とする（要原本照合）\n- 資料は、浅田宗伯『勿誤薬室方函』巻上に「当帰湯 千金」として10味が載り、附子の加減も記されるとする（要原本照合）\n- 現行エキス剤（ツムラ102）は 当帰・半夏・桂皮・厚朴・芍薬・人参・黄耆・乾姜・山椒・甘草 の10味（PMDA 添付文書 2023年12月改訂 第1版で確認）。原典の蜀椒は、添付文書では山椒（サンショウ）。添付文書に出典の欄はない", "構成": "当帰・半夏・桂皮・厚朴・芍薬・人参・黄耆・乾姜・山椒・甘草", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "酸棗仁湯", "名前": "酸棗仁湯", "読み": "さんそうにんとう", "ツムラ番号": "103", "出典": "金匱要略（血痹虚労病脈証并治第六）", "別名": "酸棗湯", "本文": {"条文": "### 『金匱要略』血痹虚労病脈証并治第六\n\n**書き下し**（読み：社員案）\n虚労、虚煩して眠るを得ざるは、酸棗仁湯之を主る。\n\n**原文**（翻刻確認）\n虚労虚煩不得眠、酸棗仁湯主之。\n\n**現代語訳**（訳：社員案）\n虚労で、虚煩して眠ることができないものは、酸棗仁湯がこれを主治する。\n\n### 注記\n- 方名：維基文庫の『金匱要略』の翻刻は「酸棗仁湯主之」「酸棗仁湯方」。四部叢刊本（明・俞橋刊本の影印）の翻刻は「酸棗湯主之」「酸棗湯方」で、資料も原典での方名を酸棗湯とする（要原本照合）。本文は1本の翻刻（維基文庫の『金匱要略』）の字を採り、見出しは添付文書の販売名（ツムラ酸棗仁湯エキス顆粒）にそろえ、酸棗湯は別名に入れた\n- 字体：翻刻は「虛勞」（四部叢刊本は「虚劳」）。本文は新字体にした\n- 方の末尾の小字「深師有生薑二兩」（深師には生姜2両がある）は両方の翻刻にある（翻刻確認）", "出典": "### 原典の構成\n- 『金匱要略』：酸棗仁2升、甘草1両、知母2両、茯苓2両、芎藭2両。原注に「深師には生姜2両有り」（翻刻確認）\n- 酸棗仁の量は、四部叢刊本の翻刻では1升（要原本照合）。四部叢刊本の翻刻は知母を「知毋」と書く\n\n### 原典の服用法\n- 『金匱要略』：5味を水8升で、まず酸棗仁を煮て6升とし、諸薬を入れて煮て3升を取り、3回に分けて温服する（翻刻確認）\n\n### 処方の変遷\n- 『備急千金要方』巻第十二・胆腑・胆虚実第二の酸棗湯は、酸棗人・人参・桂心・生姜・石膏・茯苓・知母・甘草で、原典の方から川芎を去り人参・桂心・生姜・石膏を加えた方（要原本照合）\n- 『外台秘要方』第十七巻・虚労下・虚労虚煩不得眠方の深師小酸棗湯は、酸棗人・知母・生姜・甘草・茯苓・芎藭で、原典の方に生姜を加えた方（原注にいう深師の方）。方後に「一方には桂2両を加う」（要原本照合）\n- 『太平聖恵方』巻第三・治胆虚不得睡諸方には、酸棗仁1味を散とし竹葉湯で調下する方がある（要原本照合）\n- 『傷寒活人書』巻第十八の酸棗湯は、原典の5味に乾姜・麦門冬を加えた方（要原本照合）\n- 『医塁元戎』巻九・少陰証の活人酸棗仁湯も原典の方に麦門冬・乾姜を加えた方で、ここには『金匱要略』の方そのものは載っていない（要原本照合）\n- 『聖済総録』巻第四十二・胆門の胆熱多睡の酸棗仁湯、『万病回春』巻之四・不寐の酸棗仁湯（酸棗仁・人参・白茯苓）、『景岳全書』巻之十八・不寐の酸棗仁湯・秘伝酸棗仁湯などは、原典とは構成の違う同名の方（要原本照合）\n- 『医方簡義』（王清源）巻四・肝症の酸棗仁湯は、茯神・炙甘草・知母・棗仁・川芎で、肝虚の不眠に用いる。痰があれば姜・半夏・橘紅を加える（要原本照合）\n- 現行エキス剤（ツムラ103）は 酸棗仁10g・茯苓5g・川芎3g・知母3g・甘草1g（PMDA 添付文書、2023年12月改訂）。原典の芎藭は川芎として入る", "構成": "酸棗仁・茯苓・川芎・知母・甘草", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "辛夷清肺湯", "名前": "辛夷清肺湯", "読み": "しんいせいはいとう", "ツムラ番号": "104", "出典": "外科正宗（巻之四・鼻痔）", "別名": "", "本文": {"条文": "### 『外科正宗』巻之四・鼻痔（辛夷清肺飲）\n\n**書き下し**（読み：社員案）\n肺熱の鼻内の瘜肉、初め榴子の如く、日後漸く大にして孔竅を閉塞し、気宣通せざる者を治す。之を服す。\n\n**原文**（翻刻確認）\n治肺熱鼻内瘜肉、初如榴子、日後漸大、閉塞孔竅、氣不宣通者服之。\n\n**現代語訳**（訳：社員案）\n肺熱による鼻の中の瘜肉（鼻の中にできる肉のかたまり）で、はじめはザクロの種のようだが、日がたつにつれて次第に大きくなり、鼻の穴をふさいで、気が通らなくなったものを治す。これを服用させる。\n\n### 関連条文（鼻痔の総論）\n\n**書き下し**（読み：社員案）\n鼻痔は、肺気清からず、風湿鬱滞するに由りて成る。鼻内の瘜肉、結して榴子の如く、漸く大にして下垂し、孔竅を閉塞し、気をして宣通するを得ざらしむ。内に辛夷清肺飲を服し、外に硇砂散を以て日を逐いて之に点ずれば、漸く化して水と為り、乃ち愈ゆ。兼ねて飲食を節し、厚味を断ち、急暴を戒め、房欲を省けば、愈えて後、庶わくは再び発せざらん。\n\n**原文**（翻刻確認）\n鼻痔者、由肺氣不清、風濕鬱滯而成、鼻内瘜肉結如榴子、漸大下垂、閉塞孔竅、使氣不得宣通。内服辛夷清肺飲、外以硇砂散逐日點之、漸化爲水乃愈。兼節飲食、斷厚味、戒急暴、省房欲、愈後庶不再發。\n\n**現代語訳**（訳：社員案）\n鼻痔は、肺の気が清らかでなく、風湿が鬱滞してできる。鼻の中の瘜肉が固まってザクロの種のようになり、次第に大きくなって垂れ下がり、鼻の穴をふさいで、気が通らないようにする。内には辛夷清肺飲を服し、外には硇砂散で毎日これに点ずれば、次第に溶けて水となり、治る。あわせて飲食を節制し、味の濃いものを断ち、せっかちで荒々しいふるまいを戒め、房事を控えれば、治った後、再発しないことが望める。\n\n### 注記\n- 原典の方名は辛夷清肺「飲」\n- 翻刻（維基文庫）では「瘜」「硇」の字が欠けて「鼻内肉」「砂散」となっている。資料の書き下し（瘜肉・硇砂散）に合わせて補った（要原本照合）\n- 翻刻は簡体字の混じる本で、原文は繁体字にそろえて書いた（渐→漸、闭→閉、窍→竅、郁→鬱 など）。字形の判断には使えない（要原本照合）\n- 論の番号：資料は「鼻痔第五十七」、翻刻は「鼻痔第五十二」。表題には巻と論名だけを書いた（要原本照合）\n- 方名の後に方歌「辛夷清肺飲、黃芩百合山梔知母稱。麥冬甘草石膏等、升麻枇葉一同論。」が置かれる（翻刻確認）\n- 外用の硇砂散は 硇砂1銭・軽粉3分・冰片5厘・雄黄3分 を末とし、草の茎に付けて痔の上に1日5、6回点ずる（翻刻確認。「硇」の字は翻刻で欠けるため要原本照合）", "出典": "### 原典の構成\n- 『外科正宗』巻之四・鼻痔：辛夷6分、黄芩・山梔・麦門冬・百合・石膏・知母 各1銭、甘草5分、枇杷葉3片（毛を去る）、升麻3分（翻刻確認）\n\n### 原典の服用法\n- 『外科正宗』巻之四・鼻痔：水2鍾で煎じて8分とし、食後に服す（翻刻確認）\n\n### 処方の変遷\n- 原典の『外科正宗』（明・陳実功、1617年）では辛夷清肺飲の名で、甘草を含む10味（翻刻確認）\n- 『医宗金鑑』外科巻五・鼻部・鼻痔にも、鼻痔に内服として辛夷清肺飲、外用として硇砂散を用いる記載があるとされる（要原本照合）\n- 『観聚方要補』巻七・鼻病には原典と同じ条文で載るが、方名は辛夷清肺散で、服用法は原典と同じ水煎服とされる（要原本照合）\n- 『勿誤薬室方函』巻上には辛夷清肺湯の名で出典を『外科正宗』として載り、原典から甘草を除いた9味とされる。資料は、現行エキス剤に甘草が入らないのはこの影響とする（要原本照合）\n- 資料は、これらの記載から方名が辛夷清肺飲→散→湯と変遷したとする（要原本照合）\n- 現行エキス剤（ツムラ104）は 石膏・麦門冬・黄芩・山梔子・知母・百合・辛夷・枇杷葉・升麻 の9味で、甘草は入っていない（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "石膏・麦門冬・黄芩・山梔子・知母・百合・辛夷・枇杷葉・升麻", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "通導散", "名前": "通導散", "読み": "つうどうさん", "ツムラ番号": "105", "出典": "理傷続断方（医治整理補接次第口訣・大成湯）／万病回春（巻之八・折傷）", "別名": "", "本文": {"条文": "### 『理傷続断方』医治整理補接次第口訣\n\n原典の方名は「大成湯（一名大承気湯）」（翻刻確認）\n\n**書き下し**（読み：社員案）\n\n傷損極めて重く、大小便通ぜざる者に応じて、方に此れを服す。木通を加えて煎ずべし。如し未だ通ぜずんば朴硝を加え、大小便の通ずるを俟ちて、方に損薬を服すべし。損薬は酒を用いて煎ずべからず、愈々通ぜず。然れども亦須く人の肥弱を量りて用うべし。孕婦・小児の如きは服する莫かれ。\n\n（方後）此れ乃ち専ら男子の傷重く、瘀血散ぜず、腹肚膨脹し、大小便通ぜず、心腹に上攻し、悶乱して死に至る者を治す。急ぎ此の薬を将て瘀血を通下したる後、方に損薬を服すべし。\n\n**原文**（翻刻確認）\n\n應傷損極重、大小便不通者、方服此。可加木通煎。如未通加朴硝、俟大小便通、方可服損藥。損藥不可用酒煎、愈不通矣。然亦須量人肥弱用、如孕婦小兒莫服。\n\n（方後）此乃專治男子傷重瘀血不散、腹肚膨脹、大小便不通、上攻心腹、悶亂至死者。急將此藥通下瘀血後、方可服損藥。\n\n**現代語訳**（訳：社員案）\n\n外傷が極めて重く、大小便が出ないものに対して、はじめてこれを服す。木通を加えて煎じてよい。もしまだ通じなければ朴硝を加え、大小便が通じるのを待ってから、はじめて損薬（外傷の薬）を服す。損薬は酒で煎じてはならない。ますます通じなくなる。しかし、やはり人の肥え方・弱さを量って用いるべきで、妊婦や小児には服させてはならない。\n\n（方後）これはもっぱら、男子の外傷が重く、瘀血が散らず、腹が膨れて張り、大小便が出ず、心腹に突き上げ、もだえ苦しんで死に至るものを治す。急いでこの薬で瘀血を下した後に、はじめて損薬を服す。\n\n### 『万病回春』巻之八・折傷\n\n**書き下し**（読み：社員案）\n\n（折傷の冒頭）折傷は多く瘀血凝滞有るなり。（宜しく童便・黄酒各一鍾を用いて和して温服すべし。最も能く瘀を散じ滞を消し、効あり。）\n\n通導散　跌撲傷損極めて重く、大小便通ぜず、乃ち瘀血散ぜず、肚腹膨脹し、心腹に上攻し、悶乱して死に至る者を治す。先ず此の薬を服して死血・瘀血を打ち下し、然る後に方に補損の薬を服すべし。酒を用うべからず、飲めば愈々通ぜず。亦人の虚実を量りて用う。\n\n**原文**（翻刻確認）\n\n折傷者、多有瘀血凝滯也。（宜用童便、黃酒各一鍾和而溫服、最能散瘀消滯、效。）\n\n通導散　治跌撲傷損極重、大小便不通、乃瘀血不散、肚腹膨脹、上攻心腹、悶亂至死者、先服此藥打下死血、瘀血、然後方可服補損藥。不可用酒、飲愈不通矣。亦量人虛實而用。\n\n**現代語訳**（訳：社員案）\n\n（折傷の冒頭）折傷には多く瘀血の凝滞がある。（童便と黄酒を各1鍾ずつ混ぜて温服するのがよい。最もよく瘀血を散らし滞りを消し、効がある。）\n\n通導散は、打撲・外傷が極めて重く、大小便が出ず、すなわち瘀血が散らず、腹が膨れて張り、心腹に突き上げ、もだえ苦しんで死に至るものを治す。まずこの薬を服して死血・瘀血を下し、その後にはじめて損傷を補う薬を服す。酒を用いてはならない。飲めばますます通じなくなる。また人の虚実を量って用いる。\n\n### 関連条文（『理傷続断方』医治整理補接次第口訣の条）\n\n**書き下し**（読み：社員案）\n\n凡そ損じて大小便通ぜざれば、未だ便ち損薬を服すべからず。蓋し損薬は酒を用うれば必ず熱す。且く四物湯を服し、更に如何を看よ。又大成湯に木通を加えて服す。如し大小便尚お未だ通ぜずんば、又朴硝を加う。大小便通ずるを待ちて後、却って損薬を服す。\n\n**原文**（翻刻確認）\n\n凡損、大小便不通、未可便服損藥、蓋損藥用酒必熱。且服四物湯、更看如何。又服大成湯加木通。如大小便尚未通、又加朴硝。待大小便通後、却服損藥。\n\n**現代語訳**（訳：社員案）\n\n外傷で大小便が出ないときは、すぐに損薬を服してはならない。損薬は酒を用いるので必ず熱をもつからである。ひとまず四物湯を服させ、さらに様子を見る。また大成湯に木通を加えて服させる。もし大小便がまだ通じなければ、さらに朴硝を加える。大小便が通じるのを待ってから、改めて損薬を服す。\n\n### 注記\n- 『理傷続断方』の翻刻（維基文庫『仙授理傷續斷秘方』）と『万病回春』の翻刻は簡体字の本で、原文は繁体字にそろえて書いた（伤→傷、损→損、药→藥、闷→悶、乱→亂、胀→脹、凝滞→凝滯、黄→黃、钟→鍾、虚→虛 など）。字形の判断には使えない（要原本照合）\n- 2書の順は、資料の出典欄（『理傷続断方』）を先にした。どちらの書の構成も枳殻を用い、現行エキス剤（枳実）とは一致しない（要確認）\n- 『万病回春』の「不可用酒、飲愈不通矣」は翻刻の句読に従った。資料は「酒飲用ゆべからず。愈々通ぜず」と、「酒飲」で切って読む（要原本照合）\n- 『理傷続断方』の大成湯は、資料の引用では方名が〔大成湯〕と括弧で示され、「一名大承気湯」が条の頭に続く。翻刻では方名の下に「（一名大承氣湯）」とある\n- 資料の引用（永類鈐方の引く文）では、関連条文に当たる文の「大成湯」が「大承気湯」と書かれ、「且服四物湯、更看如何」に当たる句がない（要原本照合）", "出典": "### 原典の構成\n- 『理傷続断方』（大成湯）：大黄4両、川芒硝・甘草・陳皮・紅花・当帰・蘇木・木通 各2両、枳殻4両、厚朴 少許 の10味（翻刻確認。厚朴は翻刻では「浓朴」と書かれ、簡体字化のときの誤りとみられる。要原本照合）\n- 『万病回春』（通導散）：大黄・芒硝・枳殻 各2銭、厚朴・当帰・陳皮・木通・紅花・蘇木 各1銭、甘草 の10味（翻刻確認。甘草の分量は翻刻に記載がない。厚朴は翻刻では「浓朴」。要原本照合）\n\n### 原典の服用法\n- 『理傷続断方』：上の品を刻み、1回2銭を水1盞半で1沸するまで煎じ、滓を去って温服する。時を問わない（翻刻確認。翻刻は「上件 咀」で、咀の前の1字が欠けている。要原本照合）\n- 『万病回春』：1剤に刻み、水で煎じて熱服する。通じるのを限度とする。妊婦・小児は服してはならない（翻刻確認）\n\n### 処方の変遷\n- 原典の方名は大成湯（一名大承気湯）で、『理傷続断方』医治整理補接次第口訣に載る（翻刻確認）。翻刻の『仙授理傷續斷秘方』は唐代・藺道人の書とされ、序には唐の会昌年間の頭陀（藺道人）が彭叟に方を授けたとある（翻刻確認）\n- 資料によれば、『理傷続断方』は洪武28年（1395）に印書家の謝安達が『仙伝外科集験方』『秘伝外科方』と合刊して印行し（洪武版本）、その後も正統年間・弘治年間に刊行された（要原本照合）\n- 『永類鈐方』巻之二十二・傷折風損に、『理傷続断方』からの引用として、損傷で大小便が通じないとき実する者は大承気湯に木通を加えて下し、なお通じなければ芒硝を加える、という文が載る。資料は、彭氏家伝は同書の序で彭氏が藺道人から伝授を受けたと明言しているとする（要原本照合）\n- 『古今医鑑』巻之十六・折傷に、通導散の方名で載る。条文は『万病回春』とほぼ同じで、「死血・瘀血」が「瘀血」となり、「不可用酒…亦量人虚実而用」の句がない。構成は大黄・芒硝・枳殻 各4両、厚朴・当帰・陳皮・木通・紅花・蘇木・甘草 各2両で、1両に刻んで水で煎服する（翻刻確認）。資料は、本方は『万病回春』より早く『古今医鑑』に収載されているとする\n- 『万病回春』巻之八・折傷に通導散の方名で載る（翻刻確認）。資料は、通導散の方名に変えたのは龔廷賢であり、元来は大成湯であるとする（要原本照合）\n- 資料によれば、『万病回春』の30年後に刊行された『外科正宗』巻之四・跌撲第六十三と杖瘡第六十五には、大成湯の方名で同じ方が載る（要原本照合）。維基文庫の翻刻では篇名は「跌扑第五十八」で、構成は陳皮・当帰・蘇木・木通・紅花・厚朴・甘草 各1銭、枳殻2銭、大黄3銭、朴硝2銭（翻刻確認。篇の番号が資料と違う）\n- 資料によれば、『簡明医彀』巻之四・傷損の主方は大黄・枳殻・当帰尾・厚朴・陳皮・甘草梢・紅花・蘇木・木通で、通導散去芒硝にあたり、方後の加減法で大便が通じなければ芒硝を加える（要原本照合）\n- 資料によれば、『瘍科方筌』打撲 杖瘡の大成湯は枳殻ではなく枳実で処方されている（要原本照合）\n- 資料によれば、『衆方規矩』には収載されていないが、『刪補古今方彙』『重訂古今方彙』には採録されている（要原本照合）\n- 資料によれば、一貫堂（森道伯）では大承気湯→加味承気湯（大承気湯加当帰・紅花・甘草）→通導散の順に処方解説が展開され、一貫堂方では通常、枳殻・枳実を両味処方する。それ以外では枳実・枳殻のいずれかを配するだけである（要原本照合）\n- 現行エキス剤（ツムラ105）

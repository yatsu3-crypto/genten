.brand{display:flex;align-items:center;gap:11px}

<script id="genten-data" type="application/json">{"built": "2026-10-24", "edition": "public", "sections": ["条文", "出典", "構成", "方意", "諸家の論", "院長メモ"], "entries": [{"file": "葛根湯", "名前": "葛根湯", "読み": "かっこんとう", "ツムラ番号": "1", "出典": "傷寒論（巻第三・弁太陽病脈証并治中第六）／金匱要略（痙湿暍病脈証并治第二）", "別名": "", "本文": {"条文": "### 『傷寒論』巻第三・弁太陽病脈証并治中第六\n\n**書き下し**（読み：社員案）（1条目：項背強）\n太陽病、項背強ばること几几、汗無く悪風するは、葛根湯之を主る。\n\n**原文**（翻刻確認）\n太陽病，項背強几几，無汗惡風，葛根湯主之。\n\n**現代語訳**（訳：社員案）\n太陽病で、うなじから背中が几几とこわばり、汗が出ず、風を嫌うものは、葛根湯が主治する。\n\n**書き下し**（読み：社員案）（2条目：合病の自下利。1条目の方の後に続く）\n太陽と陽明との合病の者は、必ず自下利す。葛根湯之を主る。\n\n**原文**（翻刻確認）\n太陽與陽明合病者，必自下利，葛根湯主之。\n\n**現代語訳**（訳：社員案）\n太陽と陽明の合病のものは、必ずひとりでに下痢する。葛根湯が主治する。\n\n### 『金匱要略』痙湿暍病脈証并治第二\n\n**書き下し**（読み：社員案）\n太陽病、汗無くして小便反って少なく、気胸に上衝し、口噤して語るを得ず、剛痙を作さんと欲するは、葛根湯之を主る。\n\n**原文**（翻刻確認）\n太陽病，無汗而小便反少，氣上衝胸，口噤不得語，欲作剛痙，葛根湯主之。\n\n**現代語訳**（訳：社員案）\n太陽病で、汗が出ないのに尿がかえって少なく、気が胸に突き上げ、口を食いしばってものが言えず、剛痙を起こしかけているものは、葛根湯が主治する。\n\n### 注記\n- 「几几」は資料のルビで「キキ」と読む\n- 『傷寒論』の2条はどちらも宋本の翻刻と、四庫全書本『傷寒論注釈』（成無己注）の翻刻で同じ句（翻刻確認）\n- 四庫全書本『傷寒論注釈』の翻刻は「強」を「强」、「麻黃」を「麻黄」の字形で書く（要原本照合）\n- 『金匱要略』の篇名は、資料の中で「痙湿暍病脈証第二」と「痙湿暍病脈証治第二」の2通りに書かれる。翻刻は「痙濕暍病脈證並治第二」（翻刻確認）\n- 『金匱要略』の巻数は資料に記載がない（要確認）\n- 葛根湯方の煎じ方で、麻黄・葛根を先に煮て減らす水の量は、宋本『傷寒論』の翻刻では「減六升」（要原本照合）。本文は、『金匱要略』の翻刻・四庫全書本『傷寒論注釈』と、宋本の翻刻のほかの方（桂枝加葛根湯・葛根加半夏湯など）の「減二升」を採った\n- 『金匱要略』と四庫全書本『傷寒論注釈』の葛根湯方には「㕮咀」と「不須啜粥、餘如桂枝湯法將息及禁忌」の句があり、宋本『傷寒論』の翻刻にはない（要原本照合）\n- 四庫全書本『傷寒論注釈』の翻刻は桂枝を「桂」と書く（要原本照合）", "出典": "### 原典の構成\n- 『傷寒論』（宋本）：葛根4両、麻黄3両（去節）、桂枝2両（去皮）、生姜3両（切）、甘草2両（炙）、芍薬2両、大棗12枚（擘）（翻刻確認）\n- 『金匱要略』：葛根4両、麻黄3両（去節）、桂枝2両（去皮）、芍薬2両、甘草2両（炙）、生姜3両（切）、大棗12枚（擘）（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』（宋本）：7味を水1斗で、まず麻黄・葛根を煮て2升減らし（宋本の翻刻の「6升」は注記）、白い泡を去る。残りの薬を入れて3升に煮つめ、滓を去って1升を温服する。衣をかけてわずかに汗ばむ程度の汗をとる（翻刻確認）\n- 『金匱要略』：7味を刻み、水1斗で、まず麻黄・葛根を煮て2升減らし、泡を去る。残りの薬を入れて3升に煮つめ、滓を去って1升を温服する。衣をかけてわずかに汗ばむ程度の汗をとる。粥をすする必要はなく、ほかは桂枝湯の法に従って養生と禁忌を守る（翻刻確認）\n\n### 処方の変遷\n- 桂枝湯（桂皮・生姜・甘草・芍薬・大棗）に葛根・麻黄を加えた処方\n- 『太平恵民和剤局方』巻之二・傷寒附中暑には、葛根・麻黄・黄芩・芍薬・甘草・肉桂を粗末とし、棗を入れて煎じる「葛根解肌湯」が載るとされる（要原本照合）\n- 『丹渓心法附余』巻之一・外感門上には、傷寒の項に原典どおり7味の葛根湯、温熱病の項に『和剤局方』の葛根解肌湯が載るとされる。おおむね黄芩の有無で傷寒の薬と温熱病の薬が分けられている（要原本照合）\n- 現行エキス剤（ツムラ1）は 葛根・大棗・麻黄・甘草・桂皮・芍薬・生姜 の7味（PMDA 添付文書 2026年8月改訂 第2版で確認）。原典の「桂枝」は、資料の組成欄では「桂皮」と書かれる", "構成": "葛根・大棗・麻黄・甘草・桂皮・芍薬・生姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論", "院長メモ"]}, {"file": "葛根湯加川芎辛夷", "名前": "葛根湯加川芎辛夷", "読み": "かっこんとうかせんきゅうしんい", "ツムラ番号": "2", "出典": "本朝経験方", "別名": "", "本文": {"条文": "", "出典": "### 原典の構成\n\n### 原典の服用法\n\n### 処方の変遷\n- 葛根湯に川芎・辛夷を加えた加味方で、資料の出典欄は「本朝経験方」（日本の経験方）。創製者は不明とされ、多紀元簡編の書『本朝経験方』を指すものではないとされる（要確認）\n- もとの葛根湯の出典は『傷寒論』巻第三・弁太陽病脈証并治中第六と『金匱要略』痙湿暍病脈証并治第二（条文は葛根湯の項を参照）\n- 吉益東洞『方機』の葛根湯の条には応鐘散（芎黄散：大黄・川芎）の兼用が示され、葛根湯に川芎・大黄を加えた形で処方されていたとされる（要原本照合）\n- 原南陽『叢桂亭医事小言』巻之四下には、葛根湯・五物解毒湯に辛夷を加える用い方が載るとされる（要原本照合）\n- 浅田宗伯『勿誤薬室方函口訣』巻之上の葛根湯の項には、川芎・大黄を加えて脳漏・眼耳痛を治すとあるとされる（要原本照合）\n- 現行エキス剤（ツムラ2）は 葛根・大棗・麻黄・甘草・桂皮・芍薬・辛夷・川芎・生姜 の9味（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "葛根・大棗・麻黄・甘草・桂皮・芍薬・辛夷・川芎・生姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["出典", "構成", "方意", "諸家の論"]}, {"file": "乙字湯", "名前": "乙字湯", "読み": "おつじとう", "ツムラ番号": "3", "出典": "叢桂亭医事小言（巻之七・叢桂亭蔵方）／浅田家方", "別名": "", "本文": {"条文": "### 『叢桂亭医事小言』巻之七・叢桂亭蔵方（原南陽）\n\n**書き下し**\n乙字湯　痔疾、脱肛痛楚、或いは下血腸風、或いは前陰痒痛する者を理する方。\n\n（方後）諸瘡疥、洗伝の薬を禁ず。下部の瘡疥、最も之を忌む。誤りて枯薬洗伝し、頓に愈えて後、上逆鬱冒す。気癖の如く繊憂細慮し、或いは心気不定の如き者、并びに之を主る。而して長強に灸す。傷風下血、久服して効無き者は理中湯に宜し。\n\n**原文**（要原本照合）\n資料に原文の記載がない（要確認）\n\n**現代語訳**（訳：社員案）\n乙字湯　痔疾、脱肛の痛み苦しみ、あるいは下血・腸風、あるいは前陰の痒みや痛みがある者を治める処方。\n\n（方後）諸々の瘡疥には、洗ったり塗ったりする薬を禁じる。下部の瘡疥ではとりわけこれを忌む。誤って枯らす薬で洗ったり塗ったりし、急に治った後に、上逆して鬱冒する。気癖のように細かなことを思い悩み、あるいは心気が定まらないような者も、併せてこれを主治する。そして長強に灸をする。傷風による下血で、長く服用しても効かない者には理中湯がよい。\n\n### 『勿誤薬室方函』巻上（浅田家方）\n\n浅田宗伯『勿誤薬室方函』巻上の乙字湯は出典を南陽とし、上の方後の文のうち「洗伝の薬を禁ず。下部の瘡疥、最も之を忌む」と「而して長強に灸す。傷風下血、久服して効無き者は理中湯に宜し」を除いて引く。構成は原方と異なり、内容は「出典」の見出しに記す（要原本照合）\n\n### 注記\n- 書き下しは資料（sources/２.pdf の本の83頁）に引かれたもの。原文は資料になく、維基文庫にも翻刻が見当たらない（要原本照合）\n- 「洗伝」の「伝」は資料の表記のまま（要原本照合）\n- 原方の薬味は、資料の『叢桂亭医事小言』の引用では柴胡・黄芩・升麻・大黄・甘草・大棗・生姜の7味だが、津田玄仙『療治経験筆記』巻之九の引用は「原南陽の乙字湯の六味」とされる（要原本照合）", "出典": "### 原典の構成\n- 『叢桂亭医事小言』（原南陽の原方）：柴胡・黄芩 各7分、升麻・大黄・大棗 各4分、甘草3分、生姜2分（要原本照合）\n- 『勿誤薬室方函』（浅田家方）：柴胡・大黄・升麻・黄芩・甘草・当帰（分量は資料に記載なし）（要原本照合）\n\n### 原典の服用法\n\n### 処方の変遷\n- 「乙字湯」の名は、原南陽の蔵方の五十八方を甲字湯（瘀血）・乙字湯（痔疾）・丙字湯（諸淋）・丁字湯（澼嚢）…と名付けたうちの2番目であることによる（要原本照合）\n- 『叢桂亭医事小言』の原方には当帰が入っていない（要原本照合）\n- 『勿誤薬室方函』巻上の乙字湯は、原方から大棗・生姜を去り当帰を加えた加減方である（要原本照合）\n- 現行エキス剤（ツムラ3）は 当帰・柴胡・黄芩・甘草・升麻・大黄 の6味で、浅田家方と同じ顔ぶれ。大棗・生姜は入っていない（添付文書 2023年12月改訂 第1版で確認）", "構成": "当帰・柴胡・黄芩・甘草・升麻・大黄", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["出典", "構成", "方意", "諸家の論"]}, {"file": "安中散", "名前": "安中散", "読み": "あんちゅうさん", "ツムラ番号": "5", "出典": "太平恵民和剤局方（巻三・一切気門）／原南陽方", "別名": "", "本文": {"条文": "### 『太平恵民和剤局方』巻三・一切気門\n\n**書き下し**（読み：社員案）\n遠年日近の脾疼・翻胃（反胃）、口に酸水を吐し、寒邪の気、内に留滞し、停積消えず、胸膈脹満し、腹脇を攻刺し、悪心嘔逆し、面黄ばみ肌痩せ、四肢倦怠するを治す。又、婦人の血気刺痛、小腹腰に連なり、攻疰重痛するを治す。並びに能く之を治す。\n\n**原文**（翻刻確認）\n治遠年日近脾疼翻胃、口吐酸水、寒邪之氣留滯於内、停積不消、胸膈脹滿、攻刺腹脇、惡心嘔逆、面黄肌痩、四肢倦怠。又治婦人血氣刺痛、小腹連腰、攻疰重痛、並能治之。\n\n**現代語訳**（訳：社員案）\n長年続くものも近ごろ起きたものも、胃の痛みや翻胃（反胃。食べたものを吐く）で、口から酸っぱい水を吐き、寒邪の気が体内に留まって滞り、停滞したものが消えず、胸や膈が張って膨れ、腹や脇腹を刺すように痛み、吐き気がして嘔吐し、顔色が黄ばんで痩せ、手足がだるいものを治す。また、婦人の血気による刺すような痛みで、下腹が腰に連なって、差し込むように重く痛むものを治す。いずれもよく治す。\n\n### 『証治摘要』巻上・嘔吐反胃膈噎（原南陽方）\n\n中川成章『証治摘要』に、縮砂を加えた8味の安中散が原南陽の方として引かれている。引かれているのは構成と用法で、内容は「出典」の見出しに記す（要原本照合）\n\n### 注記\n- 「翻胃」は、四庫全書本の『和剤局方』では「翻胃」（翻刻確認）、同じ主治を載せる『普済方』では「反胃」（翻刻確認）、資料の書き下しでは「飜胃」と書かれる。書き下しはどちらにも決めず「翻胃（反胃）」とした\n- 「遠年日近」は、四庫全書本の『和剤局方』では「逺年近日」と書かれる（要原本照合）。資料と別の翻刻本（「远年日近」）に合わせ、本文は「遠年日近」を採った\n- 「攻疰重痛」の「疰」は、別の翻刻本では「注」と書かれる（要原本照合）\n- 原南陽方の「縮砂」は、資料の引用では「宿砂」と書かれる（要原本照合）", "出典": "### 原典の構成\n- 『和剤局方』：延胡索（去皮）・良姜（炒）・乾姜（炮）・茴香（炒）・肉桂 各5両、牡蛎（煅）4両、甘草（炒）10両（翻刻確認）\n- 原南陽方（『証治摘要』の引用）：甘草10両、縮砂・延胡索・良姜・乾姜・茴香・桂枝 各5両、牡蛎4両（要原本照合）\n\n### 原典の服用法\n- 『和剤局方』：細末とし、1回2銭を熱酒で服す。婦人は淡醋湯（薄めた酢）で服す。酒を飲まない者は塩湯で服す。時を問わず服用（翻刻確認）\n- 原南陽方（『証治摘要』の引用）：末とし、1回2銭を熱酒で服す。縮砂を去り牡蛎を3倍にして水で煎じて服す法もある（要原本照合）\n\n### 処方の変遷\n- 安中散は『和剤局方』の宝慶年間（1225〜1227年）の増補（宝慶新増方）に属する（翻刻確認。四庫全書本には宝慶新増の印がない）\n- 『和剤局方』の安中散は乾姜を含み縮砂を含まない7味（翻刻確認）\n- 縮砂を加えた8味の安中散は、中川成章『証治摘要』に原南陽の方として引かれる。原南陽自身の著書には見当たらないとされる（要原本照合）\n- 原南陽『叢桂亭医事小言』巻之四上・噎膈反胃には、牡蛎を3倍にした安中散を癖嚢病に用いる記載があるとされる（要原本照合）\n- 浅田宗伯『勿誤薬室方函』巻上には局方の安中散から乾姜を去り縮砂を加えた方、巻下・散薬部には局方の方そのものが載るとされる（要原本照合）\n- 現行エキス剤（ツムラ5）は 桂皮・延胡索・牡蛎・茴香・甘草・縮砂・良姜 の7味で、乾姜は入っていない（PMDA 添付文書 2023年12月改訂で確認）。縮砂入りの8味から乾姜を去って7味にしたのは浅田宗伯とする説がある（要確認）", "構成": "桂皮・延胡索・牡蛎・茴香・甘草・縮砂・良姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "十味敗毒湯", "名前": "十味敗毒湯", "読み": "じゅうみはいどくとう", "ツムラ番号": "6", "出典": "勿誤薬室方函（巻上）", "別名": "", "本文": {"条文": "### 『勿誤薬室方函』巻上・十味敗毒湯\n\n**書き下し**（要原本照合）\n\n**原文**（要原本照合）\n\n**現代語訳**\n\n### 注記\n- 『勿誤薬室方函』巻上の十味敗毒湯は「青洲」の方とされ、癰疽や諸々の瘡腫の初期で、増寒・壮熱して痛むものを治すとする（要原本照合。資料の書き下しによる）\n- 『勿誤薬室方函』の原文の翻刻は維基文庫に見当たらない（2026-10-22 検索。要原本照合）。資料は書き下しだけを引き、原文（漢文）の引用はない", "出典": "### 原典の構成\n- 『勿誤薬室方函』巻上：柴胡・独活・桔梗・川芎・甘草・荊芥・防風・桜皮・茯苓・生姜 の10味。今は樸樕で桜皮に代えるとする（分量は資料に記載なし）（要原本照合）\n\n### 原典の服用法\n\n### 処方の変遷\n- 『瘍科方筌』癰疽に十味敗毒散（家方）があり、癰疽や諸般の瘡腫の初起で、憎寒・壮熱して焮痛するものを治すとし、柴胡・桔梗・羌活・川芎・荊芥・防風・茯苓・甘草・桜筎・生姜 の10味を水で煎じて服す（分量は資料に記載なし）。同書の疔瘡にも同じ薬味の十味敗毒散があり、諸々の疔で発熱・悪寒して頭痛し、焮腫・疼痛するものを治すとする（要原本照合。資料の書き下しによる）。方名（散）と構成（羌活・桜筎）が現行エキス剤と違うので条文の欄には置かない。資料は「桜筎」を『勿誤薬室方函』の「桜皮」と同じものとして比べている（要確認）。資料の書き下しでは、『勿誤薬室方函』は「増寒」、『瘍科方筌』は「憎寒」と書かれる（要原本照合）\n- 本方は、もとは『万病回春』巻之八・癰疽の荊防敗毒散に由来するとされる。華岡青洲がこれから独活・羌活を羌活に、柴胡・前胡を柴胡にまとめ、薄荷・連翹・枳殻・金銀花を除き、桜皮を加えて十味敗毒散を創製したとされる（要原本照合）\n- 資料は、荊防敗毒散自体も先人の方を継承改変したものとする。『和剤局方』巻之二・傷寒附中暑の人参敗毒散（人参・茯苓・甘草・前胡・芎藭・羌活・独活・桔梗・柴胡・枳殻を細末とし、生姜・薄荷を調理として水煎）、『小児薬証直訣』巻下の敗毒散（同じ薬味と調理）、『医学正伝』巻之八・痘疹の荊防敗毒散（同じ薬味に荊芥・防風を加え、調理薬の指示なし）、『薛氏医案』巻十・口歯類要・附方并註の人参敗毒散（局方の10味を水煎服し、小字双行で防風・荊芥を加えて荊防敗毒散と名づくとする）、『摂生衆妙方』巻之八・諸瘡門の荊防敗毒散（人参を去る）を経て、『万病回春』の荊防敗毒散（人参を去ったまま最も多味で、生姜を調理とする）に至る（要原本照合）\n- 『一本堂医事説約』家方四剤の排毒剤は、茯苓・独活・桔梗・川芎・枳実・柴胡（升麻に代えることもある）・甘草・生姜の8味（要原本照合）。『徽癘新書』理徽・方剤の荊防排毒剤は、排毒剤に荊芥・防風を加えた方（要原本照合）\n- 資料は、十味敗毒散は荊防排毒剤から独活を去って羌活に代え、枳実を去って桜筎を加えた処方にあたり、荊防排毒剤から枳実を去り樸樕を加えると『勿誤薬室方函』の十味敗毒湯になるとする。『瘍科方筌』の成立年が不詳のため、荊防排毒剤と十味敗毒散の先後は不明だが、『一本堂医事説約』の影響は確実とする（要原本照合）\n- 浅田宗伯『雑病翼方』巻之五・瘡癰の本朝経験十味敗毒湯は、主治が『勿誤薬室方函』とほぼ同じで、薬味は『瘍科方筌』の方と同一。資料は、『雑病翼方』は『勿誤薬室方函』より早く成り、浅田宗伯も当初は『瘍科方筌』の方どおりに処方していたとする（要原本照合）\n- 『勿誤薬室方函』の方は、『瘍科方筌』の方の羌活を独活に、桜皮を樸樕に変えたもので、資料はこの改変を浅田宗伯の経験によるものとする（要原本照合）\n- 『瘍科方筌』癰疽には人参敗毒散（局）も載り、柴胡・羌活・独活・茯苓・川芎・前胡・人参・枳実・桔梗・薄荷・甘草を姜煎する。疔瘡には十味敗毒散に続いて荊防敗毒散が載り、荊芥・防風・柴胡・羌活・独活・茯苓・川芎・前胡・人参・桔梗・枳実・薄荷・甘草を姜煎し、一方は人参がなく連翹・金銀花があるとする（要原本照合）\n- 同名異方：有持桂里『校正方輿輗』巻之十四・癰疽の十一味敗毒湯（羌活・桔梗・芎藭・柴胡・荊芥・防風・甘草・連翹・茯苓・枳実・金銀花。生姜で水煎し、大便が通じなければ大黄・芒消を加える）が、『証治摘要』巻下・方輿所載後世方では同じ配合のまま十味敗毒湯の名で載る（要原本照合）\n- 現行エキス剤（ツムラ6）は7.5g中、桔梗・柴胡・川芎・茯苓・樸樕 各3.0g、独活・防風 各1.5g、甘草・荊芥・生姜 各1.0g の10味（PMDA 添付文書 2023年12月改訂 第1版で確認）。羌活ではなく独活、桜皮ではなく樸樕が入る。添付文書に出典の欄はない\n- 資料は、今日のエキス製剤はすべて独活で、桜皮か樸樕かはメーカーによって分かれ、樸樕を用いるメーカーは一社だけとする（要確認）", "構成": "桔梗・柴胡・川芎・茯苓・樸樕・独活・防風・甘草・荊芥・生姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "八味地黄丸", "名前": "八味地黄丸", "読み": "はちみじおうがん", "ツムラ番号": "7", "出典": "金匱要略（中風歴節病第五・血痺虚労病第六・痰飲咳嗽病第十二・消渇小便不利淋病第十三・婦人雑病第二十二）", "別名": "", "本文": {"条文": "### 『金匱要略』中風歴節病脈証并治第五（附方）\n\n**書き下し**（読み：社員案）\n\n崔氏八味丸　脚気上りて入り、少腹不仁なるを治す。\n\n右八味、之を末とし、煉蜜にて和して丸とすること梧子大、酒にて十五丸を下し、日に再服す。\n\n**原文**（翻刻確認）\n\n崔氏八味丸：治腳氣上入，少腹不仁。\n\n上八味，末之，煉蜜和丸，梧子大。酒下十五丸，日再服。\n\n**現代語訳**（訳：社員案）\n\n崔氏八味丸は、脚気が上って入り、下腹部の感覚が鈍くなった（少腹不仁）ものを治す。\n\n（服用法）以上8味を末とし、練った蜂蜜で梧桐の実ほどの大きさの丸剤とし、酒で15丸を服し、1日2回服す。\n\n### 『金匱要略』血痺虚労病脈証并治第六\n\n**書き下し**（読み：社員案）\n\n虚労、腰痛み、少腹拘急し、小便不利する者は、八味腎気丸之を主る。\n\n右八味、之を末とし、煉蜜にて和して丸とすること梧子大、酒にて十五丸を下し、加えて二十五丸に至る。日に再服す。\n\n**原文**（翻刻確認）\n\n虛勞腰痛，少腹拘急，小便不利者，八味腎氣丸主之。\n\n上八味末之，煉蜜和丸梧子大，酒下十五丸，加至二十五丸，日再服。\n\n**現代語訳**（訳：社員案）\n\n虚労で、腰が痛み、下腹部がひきつれ（少腹拘急）、小便の出が悪いものは、八味腎気丸がこれを主治する。\n\n（服用法）以上8味を末とし、練った蜂蜜で梧桐の実ほどの大きさの丸剤とし、酒で15丸を服し、25丸まで増やす。1日2回服す。\n\n### 『金匱要略』痰飲咳嗽病脈証并治第十二\n\n**書き下し**（読み：社員案）\n\n夫れ短気して微飲有るは、当に小便より之を去るべし。苓桂朮甘湯之を主る。腎気丸も亦之を主る。\n\n**原文**（翻刻確認）\n\n夫短氣有微飲，當從小便去之，苓桂朮甘湯主之；腎氣丸亦主之。\n\n**現代語訳**（訳：社員案）\n\n息切れがして軽い水飲（微飲）があるものは、小便から水を去るべきである。苓桂朮甘湯がこれを主治する。腎気丸もまたこれを主治する。\n\n### 『金匱要略』消渇小便不利淋病脈証并治第十三\n\n**書き下し**（読み：社員案）\n\n男子の消渇、小便反って多く、飲むこと一斗なるを以て、小便すること一斗なるは、腎気丸之を主る。\n\n**原文**（翻刻確認）\n\n男子消渴，小便反多，以飲一斗，小便一斗，腎氣丸主之。\n\n**現代語訳**（訳：社員案）\n\n男子の消渇で、小便がかえって多く、1斗を飲めば小便も1斗出るものは、腎気丸がこれを主治する。\n\n### 『金匱要略』婦人雑病脈証并治第二十二\n\n**書き下し**（読み：社員案）\n\n問いて曰く、婦人の病、飲食故の如く、煩熱して臥するを得ず、而るに反って倚息する者は、何ぞや。師の曰く、此れを転胞と名づく。溺するを得ざるなり。胞系了戻するを以ての故に此の病を致す。但だ小便を利すれば則ち愈ゆ。宜しく腎気丸之を主るべし。\n\n**原文**（翻刻確認）\n\n問曰：婦人病飲食如故，煩熱不得臥，而反倚息者，何也？師曰：此名轉胞，不得溺也。以胞系了戾，故致此病。但利小便則愈，宜腎氣丸主之。\n\n**現代語訳**（訳：社員案）\n\n問う。婦人の病で、飲食はふだんどおりなのに、煩熱して横になれず、かえって物に寄りかかって息をする（倚息）のはなぜか。師が答える。これを転胞という。尿が出ないのである。胞系がねじれもつれる（了戻）ために、この病になる。ただ小便を通じさせれば治る。腎気丸でこれを主治するのがよい。\n\n### 注記\n- 崔氏八味丸の条は、中風歴節病の篇の末の「附方」の中にある（翻刻確認）\n- 方の載る所：通行本の翻刻は第五（崔氏八味丸）と第六（腎気丸方）に方を載せる。四部叢刊本の翻刻は第六の条の後に方を載せず小字注「方見脚氣中」だけを置き、方は第五と第二十二に載る（翻刻確認）\n- 第六・第十二・第十三の条の後には「方見腳氣中」（方は脚気の中に見える）、第二十二の条の後には「方見虛勞中」の小字注がある（通行本の翻刻。翻刻確認）\n- 第十二の条の小字注は、四部叢刊本の翻刻では「方見胸氣中」（要原本照合）\n- 「少腹不仁」（第五）：四部叢刊本の翻刻では「小腹不仁」（要原本照合）\n- 「煉蜜和丸」：四部叢刊本の翻刻では第五・第二十二とも「煉和丸」で「蜜」の字がない（要原本照合）\n- 「胞系」（第二十二）：四部叢刊本の翻刻では「胞絲」（要原本照合）\n- 篇名：第十三の篇名は通行本の翻刻では「消渴小便不利淋病」、四部叢刊本の翻刻と資料では「消渴（消渇）小便利淋病」（要原本照合）。第十二の篇名の「咳嗽」は、四部叢刊本の翻刻と資料では「欬嗽」\n- 字体だけの違い：四部叢刊本の翻刻では第二十二の「倚」「宜」、第十三の「氣」が異体字（画面のフォントで表示できない字があるため、ここには写さない）。「渇／渴」「脈／脉」「并／並」「戻／戾」も字体の違い\n- 原文は通行本（維基文庫『金匱要略』）の翻刻による。句読点は翻刻のもの", "出典": "### 原典の構成\n- 『金匱要略』血痺虚労病（腎気丸方）：乾地黄8両、山薬・山茱萸 各4両、沢瀉・牡丹皮・茯苓 各3両、桂枝・附子（炮） 各1両（翻刻確認）\n- 中風歴節病の崔氏八味丸も同じ分量で、山薬を「薯蕷」と書く（翻刻確認）。四部叢刊本の翻刻では第五・第二十二とも「署蕷」（要原本照合）\n\n### 原典の服用法\n- 『金匱要略』血痺虚労病：8味を末とし、煉蜜で梧子大の丸剤とし、酒で15丸を服し、25丸まで増やし、1日2回服す（翻刻確認）\n- 中風歴節病の崔氏八味丸では「加至二十五丸」の句がなく、酒で15丸を1日2回服す（翻刻確認）\n\n### 処方の変遷\n- 原典での方名は崔氏八味丸・八味腎気丸・腎気丸で、『金匱要略』の5か所に載る（翻刻確認）\n- 資料は、組成の上では六味丸に桂皮・附子を加えた処方にあたるとする（歴史的には逆）\n- 『肘後百一方』巻之四に張仲景の八味腎気丸方として載り、長く服すには附子を去って五味子を加えるとされる（要原本照合）。『備急千金要方』巻十九・補腎第八にも八味腎気丸として載り、方後の小字注に附子を去り五味子を加える法が記されるとされる（要原本照合）\n- 原典は乾地黄を用いるが、『太平聖恵方』巻第九十八の地黄円、『聖済総録』巻第五十八・五十九（消渇門）の八味丸・地黄丸では熟地黄が用いられるとされる（要原本照合）\n- 『薛氏医案』では八味地黄丸の名で、六味地黄丸に肉桂・附子各1両を加えた方とされる（要原本照合）。「八味地黄丸」の名がどの書に始まるかは資料に記載がない（要確認）\n- 原典の桂枝は、現行エキス剤では桂皮（日局ケイヒ）\n- 現行エキス剤（ツムラ7）は 地黄・山茱萸・山薬・沢瀉・茯苓・牡丹皮・桂皮・附子（ブシ末） の8味。1日量7.5g中、ジオウ6.0・サンシュユ3.0・サンヤク3.0・タクシャ3.0・ブクリョウ3.0・ボタンピ2.5・ケイヒ1.0・ブシ末0.5g の混合生薬の乾燥エキス4.0gを含む（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "地黄・山茱萸・山薬・沢瀉・茯苓・牡丹皮・桂皮・附子（ブシ末）", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "大柴胡湯", "名前": "大柴胡湯", "読み": "だいさいことう", "ツムラ番号": "8", "出典": "傷寒論（弁太陽病脈証并治中第六・弁太陽病脈証并治下第七）、金匱要略（腹満寒疝宿食病脈証并治第十）、肘後百一方（巻之二・治傷寒時気温病方第十三）", "別名": "", "本文": {"条文": "### 『傷寒論』弁太陽病脈証并治中第六\n\n**書き下し**（読み：社員案）\n太陽病、経を過ぐること十余日、反って二三之を下し、後四五日、柴胡の証仍お在る者は、先ず小柴胡湯を与う。嘔止まず、心下急、鬱鬱として微煩する者は、未だ解せずと為すなり。大柴胡湯を与えて之を下せば則ち愈ゆ。\n\n**原文**（翻刻確認）\n太陽病、過經十餘日、反二三下之。後四五日、柴胡證仍在者、先與小柴胡湯。嘔不止、心下急、鬱鬱微煩者、為未解也、與大柴胡湯下之則愈。\n\n**現代語訳**（訳：社員案）\n太陽病で、病の経過が十日余りを過ぎたのに、かえって二度、三度と下し、その後四、五日たっても柴胡の証がなお残っている者には、まず小柴胡湯を与える。（それでも）吐き気が止まらず、みぞおちが急迫し（心下急）、鬱々としてわずかに胸苦しい者は、まだ治っていないのである。大柴胡湯を与えてこれを下せば治る。\n\n### 『傷寒論』弁太陽病脈証并治下第七\n\n**書き下し**（読み：社員案）\n傷寒十余日、熱結して裏に在り、復た往来寒熱する者は、大柴胡湯を与う。但だ結胸して大熱無き者は、此れ水結して胸脇に在りと為すなり。但だ頭に微しく汗出づる者は、大陥胸湯之を主る。\n\n**原文**（翻刻確認）\n傷寒十餘日、熱結在裏、復往來寒熱者、與大柴胡湯。但結胸、無大熱者、此為水結在胸脅也、但頭微汗出者、大陷胸湯主之。\n\n**現代語訳**（訳：社員案）\n傷寒にかかって十日余り、熱が結ぼれて裏にあり、さらに悪寒と発熱が交互に起こる（往来寒熱）者には、大柴胡湯を与える。ただ結胸があって大熱のない者は、水が結ぼれて胸脇にあるのである。ただ頭にだけわずかに汗が出る者は、大陥胸湯がこれを主治する。\n\n### 『金匱要略』腹満寒疝宿食病脈証并治第十\n\n**書き下し**（読み：社員案）\n之を按じて心下満痛する者は、此れ実と為すなり。当に之を下すべし。大柴胡湯に宜し。\n\n**原文**（翻刻確認）\n按之心下滿痛者、此為實也、當下之、宜大柴胡湯。\n\n**現代語訳**（訳：社員案）\n押さえるとみぞおちが張って痛む者は、実証である。これを下すべきで、大柴胡湯がよい。\n\n### 『肘後百一方』巻之二・治傷寒時気温病方第十三\n\n**書き下し**（読み：社員案）\n若し熱実有りて、汗を得るも解せず、復た満痛し、煩躁して謬語せんと欲する者は、大柴胡湯を服すべし。\n\n**原文**（翻刻確認）\n若有熱實、得汗不解、復滿痛、煩躁、欲謬語者、可服大柴胡湯。\n\n**現代語訳**（訳：社員案）\nもし熱が実して、汗が出ても治らず、また張って痛み、もだえ苦しんでうわごとを口走りそうになる者には、大柴胡湯を服用させるとよい。\n\n### 注記\n- 太陽病中篇の条は、『傷寒論注釋』の四庫全書本（金・成無己注）巻三では「與大柴胡下之則愈」と「湯」の字がない（要原本照合）。『金匱玉函経』では「及二三下之」「嘔止小安、其人鬱郁微煩者、為末解、與大柴胡湯下之、愈」と書かれる（要原本照合）。本文は宋本の字を採った\n- 太陽病下篇の条は、『傷寒論注釋』巻四で字が同じ（翻刻確認。胸／胷、陷／䧟、微／㣲 などの字体の差のみ）。『金匱玉函経』では「熱結在裡、復往來寒熱、當與大柴胡湯。但結胸無大熱、此為水結在胸脅。頭微汗出」と書かれる（要原本照合）\n- 『肘後百一方』の条は、維基文庫の『肘後備急方』四庫全書本 巻二の翻刻による。翻刻は「復滿痛」、資料の書き下しは「腹満痛し」と「腹」の字で読む（要原本照合）。方名の後の「方」の字は本文に入れなかった（翻刻は「可服大柴胡湯方」に続けて構成を書く）", "出典": "### 原典の構成\n- 『傷寒論』：柴胡半斤、黄芩3両、芍薬3両、半夏半升（洗）、生姜5両（切）、枳実4枚（炙）、大棗12枚（擘）の7味。方後に「一方、大黄2両を加う。若し加えざれば、恐らくは大柴胡湯と為さず」とある（翻刻確認）\n- 『金匱要略』：維基文庫の翻刻の腹満寒疝宿食病篇には、この条の後に方が載っていない（要原本照合）\n- 『肘後百一方』：柴胡半斤、大黄2両、黄芩3両、芍薬2両、枳実10枚、半夏5両（洗う）、生姜5両、大棗12枚の8味（翻刻確認。「棗」は翻刻では外字）\n- 『傷寒論注釋』巻三は大黄2両を方の中に並べ、方後は「右七味……一方用大黄二兩、若不加大黄、恐不為大柴胡湯也」とする（翻刻確認）。『金匱玉函経』は大黄2両を入れた8味で、生姜を3両とし、方後に「一方無大黄、然不加不得名大柴胡湯也」とする（要原本照合）\n\n### 原典の服用法\n- 『傷寒論』：水1斗2升で煮て6升を取り、滓を去り、再び煎じて3升を取り、1升を温服する。日に3回服す（翻刻確認）\n- 宋本の翻刻では「再煎（取三升）」と「取三升」が括弧に入っている。『傷寒論注釋』巻三には「取三升」がなく「再煎温服一升」とある（翻刻確認）。『金匱玉函経』は「再煎取三升、溫服一升」で、日に3回の句がない（要原本照合）\n- 『肘後百一方』：水1斗で煮て4升を取り、4回に分けて服す。少し下痢するはずである（翻刻確認）\n\n### 処方の変遷\n- 構成は小柴胡湯（柴胡・黄芩・人参・半夏・甘草・生姜・大棗）から人参・甘草を除き、芍薬・枳実・大黄を加えたもの。原典の生姜は小柴胡湯の3両に対して5両（翻刻確認）\n- 『太平聖恵方』巻第十一・治傷寒心悸諸方の大柴胡湯方は、柴胡・黄芩・赤芍薬・半夏・赤茯苓・枳実・檳榔・白朮を散とし、姜棗で煎服する同名異方とされる（要原本照合）\n- 『易簡方』増損飲子治法三十首の柴胡湯（実際は小柴胡湯）は、人参を去り枳実半両・大黄1両を加えて大柴胡湯と名づけるとされる。通常の大柴胡湯から芍薬を去り甘草を加えた形に当たる（要原本照合）\n- 『方意弁義』巻之六の大柴胡湯は柴胡・黄芩・半夏・甘草・大黄・枳実とされ、『易簡方』の大柴胡湯と同じ構成とされる（要原本照合）\n- 『扶寿精方』傷寒 続添の大柴胡湯は、8味から大棗を去った処方とされる（要原本照合）\n- 『陰証略例』伊尹湯液論例は、許学士の言として、伊尹湯液論では大柴胡湯は8味で、監本には大黄がなく7味とする（要原本照合）\n- 『傷寒論類方』柴胡湯類四は、この方にはもと大黄2両があり、「若し大黄を加えずんば恐らくは大柴胡為らざるなり」は王叔和の言であるとする（要原本照合）\n- 『頓医抄』巻第四傷寒上の大柴胡湯は、柴胡・黄芩・芍薬・半夏・枳実・生姜・大棗・大黄を㕮咀して煎服するとされる（要原本照合）\n- 現行エキス剤（ツムラ8）は 柴胡・半夏・黄芩・芍薬・大棗・枳実・生姜・大黄 の8味で、大黄を含む（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "柴胡・半夏・黄芩・芍薬・大棗・枳実・生姜・大黄", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "小柴胡湯", "名前": "小柴胡湯", "読み": "しょうさいことう", "ツムラ番号": "9", "出典": "傷寒論（弁太陽病脈証并治中第六・弁太陽病脈証并治下第七・弁厥陰病脈証并治第十二）、金匱要略（黄疸病脈証并治第十五・嘔吐噦下利病脈証治第十七・婦人雑病脈証并治第二十二）、肘後百一方（巻之二・治傷寒時気温病方第十三）", "別名": "", "本文": {"条文": "### 『傷寒論』弁太陽病脈証并治中第六\n\n**書き下し**（読み：社員案）\n傷寒五六日、中風、往来寒熱し、胸脇苦満し、嘿嘿として飲食を欲せず、心煩して喜（しばしば）嘔し、或いは胸中煩して嘔せず、或いは渇し、或いは腹中痛み、或いは脇下痞鞕し、或いは心下悸して小便利せず、或いは渇せずして身に微熱有り、或いは咳する者は、小柴胡湯之を主る。\n\n**原文**（翻刻確認）\n傷寒五六日、中風、往來寒熱、胸脅苦滿、嘿嘿不欲飲食、心煩喜嘔。或胸中煩而不嘔、或渴、或腹中痛、或脅下痞鞕、或心下悸、小便不利、或不渴、身有微熱、或咳者、小柴胡湯主之。\n\n**現代語訳**（訳：社員案）\n傷寒にかかって五、六日、あるいは中風にかかって（五、六日たち）、悪寒と発熱が交互に起こり（往来寒熱）、胸から脇にかけて張って苦しく（胸脇苦満）、黙りこんで飲食を欲しがらず、胸苦しくてしばしば吐き気がする。あるいは胸中が苦しいが吐かない、あるいは口が渇く、あるいは腹中が痛む、あるいは脇の下がつかえて硬い、あるいはみぞおちが動悸して小便が出にくい、あるいは口は渇かず身体に微熱がある、あるいは咳が出る。このような者は、小柴胡湯がこれを主治する。\n\n### 『傷寒論』弁太陽病脈証并治下第七\n\n**書き下し**（読み：社員案）\n傷寒五六日、頭汗出で、微しく悪寒し、手足冷え、心下満ち、口に食を欲せず、大便鞕く、脈細なる者は、此れ陽微結と為す。必ず表有り、復た裏有るなり。脈沈も亦裏に在るなり。汗出づるは陽微と為す。仮令純陰結ならば、復た外証有るを得ず、悉く入りて裏に在り。此れ半ば裏に在り半ば外に在りと為すなり。脈沈緊と雖も、少陰病と為すを得ず。然る所以の者は、陰は汗有るを得ず、今頭汗出づ、故に少陰に非ざるを知るなり。小柴胡湯を与うべし。設し了了たらざる者は、屎を得て解す。\n\n**原文**（翻刻確認）\n傷寒五六日、頭汗出、微惡寒、手足冷、心下滿、口不欲食、大便鞕、脈細者、此為陽微結、必有表、復有裏也。脈沉、亦在裏也。汗出、為陽微。假令純陰結、不得復有外證、悉入在裏、此為半在裏半在外也。脈雖沉緊、不得為少陰病。所以然者、陰不得有汗、今頭汗出、故知非少陰也。可與小柴胡湯、設不了了者、得屎而解。\n\n**現代語訳**（訳：社員案）\n傷寒にかかって五、六日、頭に汗が出て、わずかに悪寒がし、手足が冷え、みぞおちが張り、食べたがらず、大便が硬く、脈が細い者は、陽微結（陽の邪がわずかに結ぼれたもの）である。必ず表の証があり、また裏の証もある。脈が沈であるのもやはり裏にあるからである。汗が出るのは陽微のためである。もし純粋な陰結であれば、外の証があるはずはなく、すべて裏に入っている。これは半ば裏にあり、半ば外にあるものである。脈が沈緊であっても少陰病とはしない。そのわけは、陰証では汗が出ないはずなのに、いま頭に汗が出ているので、少陰ではないとわかるからである。小柴胡湯を与えてよい。もしそれでもすっきりしない者は、便が出れば治る。\n\n### 『金匱要略』黄疸病脈証并治第十五\n\n**書き下し**（読み：社員案）\n諸々の黄、腹痛みて嘔する者は、柴胡湯に宜し。（必ず小柴胡湯なり。方は嘔吐中に見ゆ。）\n\n**原文**（翻刻確認）\n諸黃、腹痛而嘔者、宜柴胡湯。（必小柴胡湯、方見嘔吐中。）\n\n**現代語訳**（訳：社員案）\nさまざまな黄疸で、腹が痛んで嘔吐する者には、柴胡湯がよい。（注：必ず小柴胡湯である。処方は嘔吐の篇に見える。）\n\n### 『金匱要略』嘔吐噦下利病脈証治第十七\n\n**書き下し**（読み：社員案）\n嘔して発熱する者は、小柴胡湯之を主る。\n\n**原文**（翻刻確認）\n嘔而發熱者、小柴胡湯主之。\n\n**現代語訳**（訳：社員案）\n吐き気があって発熱する者は、小柴胡湯がこれを主治する。\n\n### 『金匱要略』婦人雑病脈証并治第二十二\n\n**書き下し**（読み：社員案）\n婦人中風、七八日、続いて寒熱を来たし、発作に時有り、経水適々断つ。此れ熱血室に入ると為す。其の血必ず結す。故に瘧状の如く、発作に時有らしむ。小柴胡湯之を主る。（方は嘔吐中に見ゆ。）\n\n**原文**（翻刻確認）\n婦人中風、七八日續來寒熱、發作有時、經水適斷、此為熱入血室、其血必結、故使如瘧狀、發作有時、小柴胡湯主之。（方見嘔吐中。）\n\n**現代語訳**（訳：社員案）\n婦人が中風にかかって七、八日、引き続いて悪寒と発熱が起こり、決まった時に発作し、月経がちょうど止まった。これは熱が血室に入ったものである。その血は必ず結ぼれるので、瘧（おこり）のように決まった時に発作させる。小柴胡湯がこれを主治する。（注：処方は嘔吐の篇に見える。）\n\n### 『肘後百一方』巻之二・治傷寒時気温病方第十三\n\n**書き下し**（読み：社員案）\n三日已上、七八日に至りて解せざる者は、小柴胡湯を服すべし。柴胡八両、人参・甘草・黄芩各三両、生薑八両（無き者は乾薑三両）、半夏五両（湯にて之を洗う）、大棗十二枚。水九升にて煮て二升半を取り、分かちて三服と為す。微しく覆いて汗を取ること半日、須臾にして便ち差ゆ。若し好からざれば、更に一剤を作る。\n\n**原文**（翻刻確認）\n三日已上至七八日不解者、可服小柴胡湯。柴胡八兩、人參、甘草、黄芩各三兩、生薑八兩（無者乾薑三兩）、半夏五兩（湯洗之）、大棗十二枚。水九升、煮取二升半、分為三服、微覆取汗半日、須臾便差。若不好、更作一劑。\n\n**現代語訳**（訳：社員案）\n（傷寒・時気・温病で）3日以上たち、7〜8日になっても治らない者は、小柴胡湯を服用するとよい。柴胡8両、人参・甘草・黄芩 各3両、生姜8両（なければ乾姜3両）、半夏5両（湯で洗う）、大棗12枚。水9升で煮て2升半を取り、3回に分けて服す。軽く覆って半日汗を取れば、まもなく治る。もしよくならなければ、さらに1剤を作る。\n\n### 関連条文（柴胡の証の見方）\n\n『傷寒論』弁太陽病脈証并治中第六。最初の条の二丁後にあり、胸脇苦満にこだわらない根拠として資料が挙げる条。\n\n**書き下し**（読み：社員案）\n傷寒、中風、柴胡の証有るは、但一証を見わせば便ち是なり。必ずしも悉くは具わらず。凡そ柴胡湯の病証にして之を下し、若し柴胡の証罷まざる者は、復た柴胡湯を与う。必ず蒸蒸として振い、却って復た発熱し汗出でて解す。\n\n**原文**（翻刻確認）\n傷寒中風、有柴胡證、但見一證便是、不必悉具。凡柴胡湯病證而下之、若柴胡證不罷者、復與柴胡湯、必蒸蒸而振、卻復發熱汗出而解。\n\n**現代語訳**（訳：社員案）\n傷寒でも中風でも、柴胡の証があるときは、そのうち一つの証が見られればそれでよく、すべてがそろう必要はない。およそ柴胡湯の病証なのにこれを下し、なお柴胡の証がやんでいない者には、再び柴胡湯を与える。すると必ず蒸すように熱して震え、かえって再び発熱し、汗が出て治る。\n\n### 関連条文（嘔して発熱する者）\n\n『傷寒論』弁太陽病脈証并治下第七。陽微結の条の直後の条で、資料が『金匱要略』嘔吐篇の条と関連するとして挙げる。後半の結胸・痞の文（大陥胸湯・半夏瀉心湯）は略す。\n\n**書き下し**（読み：社員案）\n傷寒五六日、嘔して発熱する者は、柴胡湯の証具わる。而るに他薬を以て之を下し、柴胡の証仍お在る者は、復た柴胡湯を与う。此れ已に之を下すと雖も、逆と為さず。必ず蒸蒸として振い、却って発熱し汗出でて解す。\n\n**原文**（翻刻確認）\n傷寒五六日、嘔而發熱者、柴胡湯證具、而以他藥下之、柴胡證仍在者、復與柴胡湯。此雖已下之、不為逆、必蒸蒸而振、卻發熱汗出而解。\n\n**現代語訳**（訳：社員案）\n傷寒にかかって五、六日、吐き気があって発熱する者は、柴胡湯の証がそろっている。それなのに他の薬で下し、柴胡の証がなお残っている者には、再び柴胡湯を与える。すでに下したとはいえ誤治とはならない。必ず蒸すように熱して震え、かえって発熱し、汗が出て治る。\n\n### 注記\n- 弁太陽病中篇の最初の条は、『注解傷寒論』の四庫全書本（書名『傷寒論注釋』）巻三では「黙黙」「胷脇」「欬」と書かれ、末尾が「與小柴胡主之」となっている（要原本照合）。『金匱玉函経』では冒頭が「中風五六日、傷寒、往來寒熱」で、「脅下痞堅」「心中悸」「外有微熱」と書かれる（要原本照合）。本文は宋本の字を採った\n- 「喜嘔」の「喜」は資料のルビに従い「しばしば」と読んだ\n- 陽微結の条は、宋本の翻刻と『傷寒論注釋』巻四で字が同じ（翻刻確認。脈／脉、沉／沈、微／㣲 などの字体の差のみ）。『金匱玉函経』では「大便堅」「其脈細」「沉亦為病在裡」「半在外半在裡」と書かれる（要原本照合）\n- 「嘔して発熱する者」の条は、『傷寒論』弁厥陰病脈証并治第十二と『金匱玉函経』にも同じ字で載る（翻刻確認）\n- 婦人雑病篇の条は、『傷寒論』弁太陽病脈証并治下第七にもほぼ同文で載り、そこでは「續得寒熱」「經水適斷者」と書かれる（翻刻確認。『金匱玉函経』も同じ）。本文は『金匱要略』の字を採り、「續得寒熱」は異同として残す（要原本照合）\n- 但見一証の条は、『金匱玉函経』では「有小柴胡證」と書かれる（要原本照合）。『傷寒論注釋』巻三では「卻復發熱」が「却發熱」（要原本照合）\n- 『金匱要略』の各条の注は「方は嘔吐中に見ゆ」とするが、維基文庫の『金匱要略』の翻刻の嘔吐噦下利病篇には、この条のあとに方が載っていない（要原本照合）\n- 『肘後百一方』の条は、維基文庫の四庫全書本（書名『肘後備急方』巻二・晋 葛洪 撰）の翻刻で確かめた。翻刻では「大棗」の「棗」が外字（表示できない字）になっている。資料の「大棗」の字を置いた（要原本照合）。「煮」は翻刻では「煑」と書かれる（字体の違い）\n- 『肘後百一方』の条は、資料は処方の変遷の書として挙げる（資料の出典欄は『傷寒論』『金匱要略』）。同名・同構成の方なので条文の欄に置いた。条文の順は、構成一致の出典が3書あるので、資料の出典欄の2書を先にし、『肘後百一方』を後ろにした（要確認）", "出典": "### 原典の構成\n- 『傷寒論』：柴胡半斤、黄芩3両、人参3両、半夏半升（洗）、甘草3両（炙）、生姜3両（切）、大棗12枚（擘）（翻刻確認）\n- 『肘後百一方』：柴胡8両、人参・甘草・黄芩 各3両、生姜8両（なければ乾姜3両）、半夏5両（湯で洗う）、大棗12枚（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』：7味を水1斗2升で煮て6升を取り、滓を去り、再び煎じて3升を取り、1升を温服する。日に3回服す（翻刻確認）\n- 方後の加減法（翻刻確認）：胸中煩して嘔しない者は半夏・人参を去り栝楼実1枚を加える。渇する者は半夏を去り、人参を前と合わせて4両半とし、栝楼根4両を加える。腹中痛む者は黄芩を去り芍薬3両を加える。脇下痞鞕する者は大棗を去り牡蛎4両を加える。心下悸して小便利しない者は黄芩を去り茯苓4両を加える。渇せず外に微熱ある者は人参を去り桂枝3両を加え、温覆して微しく汗すれば愈える。咳する者は人参・大棗・生姜を去り五味子半升・乾姜2両を加える\n- 『肘後百一方』：水9升で煮て2升半を取り、3回に分けて服す。軽く覆って半日汗を取る。よくならなければさらに1剤を作る（翻刻確認）\n\n### 処方の変遷\n- 『肘後百一方』巻之二・治傷寒時気温病方第十三では、3日以上7〜8日に至って解しない者に小柴胡湯を用い、柴胡を8両、生姜を8両とし、軽く覆って半日汗を取る（翻刻確認。条文の欄に載せた）\n- 『備急千金要方』巻第十 傷寒下・労復第二では黄竜湯の名で、傷寒が治った後に再び頭痛・壮熱・煩悶するものに用いる（「仲景、小柴胡湯と名づく」と注）。柴胡1斤、人参・甘草 各2両、生姜4両のほかは原典と同量で、加減法は「嘔せずして渇する者は半夏を去り栝楼根4両を加う」とされる（要原本照合）\n- 『外台秘要方』第二巻 傷寒下・傷寒煩渇方では古今録験の黄竜湯として原典と同じ量で載り、羊肉・餳・海藻・菘菜を忌むとされる。同書第一巻 傷寒上は千金翼方の文として原典の条文・薬味・加減法を引き、「崔氏、深師同じ」と注する。続く崔氏方には柴胡を前胡に代えた小前胡湯が載るとされる（要原本照合）\n- 『太平聖恵方』巻第九・治傷寒六日諸方の小柴胡湯方は柴胡・黄芩・赤芍薬・半夏・枳実・人参・甘草を散とし生姜で煎服する同名異方とされる。巻第十一・治傷寒潮熱不退諸方の黄芩散は黄芩・柴胡・人参・半夏・甘草・麦門冬を散とし生姜・棗で煎服するとされる（要原本照合）\n- 『傷寒六書』巻之三・諸方の和解散は柴胡・黄芩・人参・半夏・甘草を生姜・棗で煎服するとされる（要原本照合）\n- 『万安方』巻第三十三・婦人三・妊娠中風の黄竜湯は柴胡・黄芩・人参・甘草で、小柴胡湯から半夏を除いた方とされる（要原本照合）\n- 現行エキス剤（ツムラ9）は 柴胡・半夏・黄芩・大棗・人参・甘草・生姜 の7味で、原典と同じ構成（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "柴胡・半夏・黄芩・大棗・人参・甘草・生姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "柴胡桂枝湯", "名前": "柴胡桂枝湯", "読み": "さいこけいしとう", "ツムラ番号": "10", "出典": "傷寒論（弁太陽病脈証并治下第七・弁発汗後病脈証并治第十七）／金匱要略（腹満寒疝宿食病脈証治第十。外台秘要方の引用）／外台秘要方（巻七・寒疝腹痛方。仲景傷寒論の引用）", "別名": "", "本文": {"条文": "### 『傷寒論』弁太陽病脈証并治下第七\n\n**書き下し**（読み：社員案）\n傷寒六七日、発熱し、微しく悪寒し、支節煩疼し、微しく嘔し、心下支結し、外証未だ去らざる者は、柴胡桂枝湯之を主る。\n\n**原文**（翻刻確認）\n傷寒六七日、發熱、微惡寒、支節煩疼、微嘔、心下支結、外證未去者、柴胡桂枝湯主之。\n\n**現代語訳**（訳：社員案）\n傷寒にかかって六、七日たち、発熱し、わずかに悪寒がし、四肢の関節がひどく痛み、わずかに吐き気があり、みぞおちがつかえて結ぼれ（心下支結）、表の証がまだ去っていない者は、柴胡桂枝湯がこれを主治する。\n\n### 『傷寒論』弁発汗後病脈証并治第十七\n\n**書き下し**（読み：社員案）\n発汗多く、亡陽し、譫語する者は、下すべからず。柴胡桂枝湯を与え、其の栄衛を和し、以て津液を通ずれば、後に自ら愈ゆ。\n\n**原文**（翻刻確認）\n發汗多亡陽、譫語者、不可下、與柴胡桂枝湯。和其榮衛、以通津液、後自愈。\n\n**現代語訳**（訳：社員案）\n発汗が多すぎて陽気を失い（亡陽）、うわごとを言う者は、下してはならない。柴胡桂枝湯を与えて営衛を調和させ、津液を通じさせれば、その後自然に治る。\n\n### 『金匱要略』腹満寒疝宿食病脈証治第十（附方）\n\n**書き下し**（読み：社員案）\n外台の柴胡桂枝湯方。心腹卒中して痛む者を治す。\n\n**原文**（翻刻確認）\n外臺柴胡桂枝湯方、治心腹卒中痛者。\n\n**現代語訳**（訳：社員案）\n『外台秘要方』の柴胡桂枝湯の処方。胸から腹にかけて急に起こった痛み（心腹の卒中痛）を治す。\n\n### 『外台秘要方』巻七・寒疝腹痛方\n\n**書き下し**（読み：社員案）\n又、寒疝にて腹中痛む者を療する柴胡桂枝湯方。\n\n**原文**（翻刻確認）\n又療寒疝腹中痛者柴胡桂枝湯方。\n\n**現代語訳**（訳：社員案）\nまた、寒疝で腹の中が痛む者を治療する柴胡桂枝湯の処方。\n\n### 注記\n- 弁太陽病篇の条は、宋本の翻刻・『注解傷寒論』の四庫全書本（書名『傷寒論注釋』）巻四・『金匱玉函経』で字が同じ（翻刻確認）。『金匱玉函経』の可発汗の篇に重ねて載る同じ条は「微惡風」「屬柴胡桂枝湯證」と書かれる（要原本照合）\n- 弁発汗後病篇の条は、『金匱玉函経』では「亡陽狂語者」「可與柴胡桂枝湯」「和其營衛」と書かれる（要原本照合）。本文は宋本の字を採った\n- 『金匱要略』の方名は、四部叢刊本（明・俞橋刊本）の翻刻では「外䑓柴胡桂湯方」と「枝」の字がない（要原本照合）。維基文庫の『金匱要略』の翻刻には附方が載っておらず通行本の字を確かめられないため、本文は資料の方名「柴胡桂枝湯」を採った（要原本照合）。䑓／臺は字体の違い\n- 『金匱要略』の方は『外台秘要方』からの附方。『外台秘要方』の四庫全書本 巻七・寒疝腹痛方では、仲景傷寒論の方として柴胡桂枝湯方が載る（翻刻確認）\n- 『外台秘要方』の条の「又」は、この門で「仲景傷寒論」と書名を挙げた二物大烏頭煎の条から「又」で続く条で、同じ書の方を引くことを示す。構成は桂枝が「桂心」と書かれるほかは『傷寒論』と同じ9味（翻刻確認）。方後の末尾に「並出第十五卷中」の注がある（翻刻確認）", "出典": "### 原典の構成\n- 『傷寒論』：桂枝1両半（去皮）、芍薬1両半、黄芩1両半、人参1両半、甘草1両（炙）、半夏2合半（洗）、大棗6枚（擘）、生姜1両半（切）、柴胡4両（翻刻確認）\n- 『金匱要略』：柴胡4両、黄芩・人参・芍薬・桂枝・生姜 各1両半、甘草1両、半夏2合半、大棗6枚（翻刻確認。四部叢刊本の本文による。半夏は翻刻では2合で、『傷寒論』『外台秘要方』と一致する2合半を採った。2合は異同（要原本照合））\n- 『外台秘要方』：柴胡4両、大棗6枚、黄芩1両半、人参1両半、甘草1両（炙）、半夏2合半、桂心・生姜 各1両半、芍薬1両半（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』：9味を水7升で煮て3升を取り、滓を去り、1升を温服する（翻刻確認）。方後に「本云：人參湯，作如桂枝法，加半夏、柴胡、黃芩；復如柴胡法，今用人參，作半劑」とある（翻刻確認）\n- 『金匱要略』：9味を水6升で煮て3升を取り、1升を温服する。日に3回服す（翻刻確認。四部叢刊本の本文による）。水の量は『傷寒論』の7升、『外台秘要方』の8升と異なる（要原本照合）\n- 『外台秘要方』：9味を水8升で煮て3升を取り、滓を去り、1升を温服する。日に3回服す。方後に『傷寒論』の本云と同じ趣旨の「又云：人參湯作如桂枝法加半夏茈胡黄芩復如茈胡湯法今著人參作半劑」と、海藻・菘菜・羊肉・生葱などの禁忌がある（翻刻確認）\n\n### 処方の変遷\n- 構成は小柴胡湯と桂枝湯を合わせた形で、柴胡・黄芩・人参・半夏（小柴胡湯）、桂枝・芍薬（桂枝湯）、甘草・生姜・大棗（両方に共通）の9味\n- 『外台秘要方』巻七・寒疝腹痛方は、仲景傷寒論の方として寒疝で腹中が痛む者に用いる。『金匱要略』の附方はこの方を引く（条文は上の欄）\n- 『太平聖恵方』巻第八・傷寒三陰三陽応用湯散諸方では小柴胡桂枝湯の名で、柴胡・桂枝・黄芩・人参・半夏・赤芍薬・甘草を散とし、生姜・棗で煎服するとされる（要原本照合）\n- 『三因極一病証方論』巻之四・傷風証治では柴胡加桂湯の名で、少陽の傷風に柴胡・半夏・甘草・芍薬・黄芩・人参・桂を㕮咀し、姜棗で煎服するとされる（要原本照合）\n- 『仁斎直指附遺方論』巻十八・腎気では、柴胡桂枝湯を腎気の冷熱が調わない証に用い、柴胡・人参・桂枝・白芍薬・生姜・半夏・黄芩・甘草を棗で煎ずるとされる（要原本照合）\n- 『普済方』巻二百四十八・□疝門（□は資料の字が判読できない。要確認）・寒疝心腹痛では柴胡湯の名で、寒疝の心腹痛に柴胡・大棗・黄芩・人参・甘草・半夏・桂・芍薬を散とし、姜で煎ずるとされる（要原本照合）\n- 『医学綱目』（楼英編撰）巻之三十・傷寒部・太陽病、『傷寒論条弁』巻之二では柴胡加桂枝湯の名で載るとされる（要原本照合）\n- 現行エキス剤（ツムラ10）は 柴胡・半夏・黄芩・甘草・桂皮・芍薬・大棗・人参・生姜 の9味で、原典と同じ構成（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "柴胡・半夏・黄芩・甘草・桂皮・芍薬・大棗・人参・生姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "柴胡桂枝乾姜湯", "名前": "柴胡桂枝乾姜湯", "読み": "さいこけいしかんきょうとう", "ツムラ番号": "11", "出典": "傷寒論（弁太陽病脈証并治下第七）／金匱要略（瘧病脈証并治第四・外台秘要方の引用）", "別名": "柴胡桂姜湯", "本文": {"条文": "### 『傷寒論』弁太陽病脈証并治下第七\n\n**書き下し**（読み：社員案）\n傷寒五六日、已に汗を発して復た之を下し、胸脇満微結し、小便利せず、渇して嘔せず、但だ頭汗出で、往来寒熱し、心煩する者は、此れ未だ解せずと為すなり。柴胡桂枝乾姜湯之を主る。\n\n**原文**（翻刻確認）\n傷寒五六日、已發汗而復下之、胸脅滿微結、小便不利、渴而不嘔、但頭汗出、往來寒熱、心煩者、此為未解也、柴胡桂枝乾薑湯主之。\n\n**現代語訳**（訳：社員案）\n傷寒にかかって5〜6日、すでに発汗させ、さらにこれを下したところ、胸脇部が張って軽く結ぼれ、小便が出にくく、口が渇くが吐き気はなく、頭にだけ汗が出て、悪寒と発熱が交互に起こり、胸苦しくもだえる者は、まだ病が解けていない。柴胡桂枝乾姜湯がこれを主治する。\n\n### 『金匱要略』瘧病脈証并治第四・附方（『外台秘要方』柴胡桂姜湯）\n\n**書き下し**（読み：社員案）\n柴胡桂姜湯。瘧、寒多く微しく熱有り、或いは但だ寒して熱せざるを治す。一剤を服して神の如し。\n\n**原文**（翻刻確認）\n柴胡桂薑湯：治瘧寒多微有熱、或但寒不熱。服一劑如神。\n\n**現代語訳**（訳：社員案）\n柴胡桂姜湯。瘧で、寒けが多く熱はわずかなもの、あるいは寒けだけで熱が出ないものを治す。1剤を服用すると神のように効く。\n\n### 注記\n- 『金匱要略』では方名を「柴胡桂姜湯」とし、瘧病篇の末尾に『外台秘要方』の方として附されている（翻刻確認）\n- 『金匱要略』の「服一劑如神」は、資料によれば小字双行の注として書かれる（要原本照合）\n- 『傷寒論』の条は、『注解傷寒論』の四庫全書本（書名『傷寒論注釋』）巻四では「胷脇滿㣲結」と書かれる。字体だけの違いなので本文は新字体にした（翻刻確認）\n- 宋本『傷寒論』の翻刻では、構成の黄芩が「黃岑」と書かれる（要原本照合）。薬名として通らないため翻刻の誤りとみて、『傷寒論注釋』・『金匱要略』の翻刻と資料の「黄芩」を原典の構成に採った\n- 『傷寒論注釋』では栝楼根が「括蔞根」と書かれる（要原本照合）\n- 『外台秘要方』第二巻に引く同じ条では「傷寒六七日」「胸脇満結」と書かれるとされる（要原本照合）", "出典": "### 原典の構成\n- 『傷寒論』：柴胡半斤、桂枝3両（皮を去る）、乾姜2両、栝楼根4両、黄芩3両、牡蛎2両（熬る）、甘草2両（炙る）（翻刻確認）\n- 『金匱要略』：柴胡半斤、桂枝3両（皮を去る）、乾姜2両、栝楼根4両、黄芩3両、牡蛎3両（熬る）、甘草3両（炙る）（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』：7味を水1斗2升で煮て6升を取り、滓を去り、再び煎じて3升を取る。1升を温服し、日に3回服す。初めて服すると微しく煩し、また服して汗が出れば治る（翻刻確認）\n- 『金匱要略』：『傷寒論』と同じ。水1斗2升で煮て6升を取り、滓を去り、再び煎じて3升を取り、1升を温服し、日に3回服す。初めて服すると微しく煩し、また服して汗が出れば治る（翻刻確認）\n\n### 処方の変遷\n- 『傷寒論』と『金匱要略』では、牡蛎と甘草の量が違う（『傷寒論』は各2両、『金匱要略』は各3両）（翻刻確認）\n- 『外台秘要方』第二巻・傷寒下・傷寒小便不利方には、仲景傷寒論の引用として「小柴胡桂姜湯」の名で載り、桂枝が桂心となるほかは原典と同じ薬味とされる（要原本照合）\n- 『鶏峰普済方』巻第十四・治瘧には「姜桂湯」の名で載り、柴胡桂枝乾姜湯と同じ方とされる（要原本照合）\n- 『金匱要略』瘧病篇の附方で本方の一つ前に載る柴胡去半夏加栝蔞湯（柴胡・人参・黄芩・甘草・栝蔞根・生姜・大棗）は、構成が比較的本方に近いとされる（構成は翻刻確認。評価は要原本照合）\n- 『導水瑣言』には本方に茯苓を加えた姜桂加茯苓湯が載り、方後に、脇下に上衝する者は呉茱萸を、脈が一層虚候を見わし心下の和し難い者は附子を加えるとされる（要原本照合）\n- 『勿誤薬室方函口訣』巻之上・緩中湯の条では、高階の緩痃湯は本方に鼈甲・芍薬を加えたものとされる（要原本照合）\n- 現行エキス剤（ツムラ11）は 柴胡・黄芩・栝楼根・桂皮・牡蛎・乾姜・甘草 の7味で、原典と同じ構成（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "柴胡・黄芩・栝楼根・桂皮・牡蛎・乾姜・甘草", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "柴胡加竜骨牡蛎湯", "名前": "柴胡加竜骨牡蛎湯", "読み": "さいこかりゅうこつぼれいとう", "ツムラ番号": "12", "出典": "傷寒論（弁太陽病脈証并治中第六）", "別名": "", "本文": {"条文": "### 『傷寒論』弁太陽病脈証并治中第六\n\n**書き下し**（読み：社員案）\n傷寒八九日、之を下し、胸満煩驚し、小便利せず、譫語し、一身尽く重く、転側すべからざる者は、柴胡加竜骨牡蛎湯之を主る。\n\n**原文**（翻刻確認）\n傷寒八九日、下之、胸滿煩驚、小便不利、譫語、一身盡重、不可轉側者、柴胡加龍骨牡蠣湯主之。\n\n**現代語訳**（訳：社員案）\n傷寒にかかって八、九日たち、これを下したところ、胸が張って煩わしく驚きやすくなり、小便の出が悪く、うわごとを言い、全身がことごとく重く、寝返りを打つことができないものは、柴胡加竜骨牡蛎湯がこれを主治する。\n\n### 注記\n- 『傷寒論注釋』（『注解傷寒論』）の四庫全書本 巻三では、条文の字は同じで、「胸」を「胷」、「譫語」を「讝語」と書く（翻刻確認。字体の違いのみ）\n- 『金匱玉函経』巻二・弁太陽病形証治第三では、「不可轉側者」が「不可轉側」と書かれる（「者」の字がない）（要原本照合）。同書巻六・弁発汗吐下後病形証治第十九にも「一身不可轉側、屬柴胡加龍骨牡蠣湯證」の形で重出し、「盡重」の句がない（要原本照合）\n- 資料は、宋本の方の後に「本云う、柴胡湯と。今、竜骨等を加う」の文があるとする。維基文庫の宋本の翻刻には見当たらない（要原本照合）\n- 「牡蠣」は書き下しでは新字体の「牡蛎」とした", "出典": "### 原典の構成\n- 『傷寒論』（宋本）：柴胡4両、竜骨・黄芩・生姜（切）・鉛丹・人参・桂枝（去皮）・茯苓 各1両半、半夏2合半（洗）、大黄2両、牡蛎1両半（熬）、大棗6枚（擘）の12味（翻刻確認）\n- 『傷寒論注釋』四庫全書本 巻三（成本）には黄芩がなく11味（翻刻確認）。半夏は2合と書かれる（要原本照合）\n- 『金匱玉函経』巻七は鉛丹を「黄丹」と書く（要原本照合）。ほかの味と分量は宋本と同じ\n\n### 原典の服用法\n- 『傷寒論』（宋本）：12味を水8升で煮て4升を取り、大黄を碁石のように切って入れ、さらに1、2沸させて滓を去り、1升を温服する（翻刻確認）\n- 『傷寒論注釋』四庫全書本は「十一味」「更煮一二沸」と書く（要原本照合）\n- 『金匱玉函経』は、4升を取ったあと大黄を入れてさらに煮て2升を取り、滓を去って1升を温服するとし、方後に「本方は柴胡湯の内に竜骨・牡蛎・黄丹・桂・茯苓・大黄を加う。今分かちて半剤と作す」とある（要原本照合）\n\n### 処方の変遷\n- 小柴胡湯から甘草を去り、竜骨・牡蛎・桂皮・茯苓・大黄を加えた構成（資料の解説）。原典にはさらに鉛丹が入るが、鉛中毒を恐れて現在は普通入れない（資料の論考①）\n- 成本（『注解傷寒論』）には黄芩がない。『傷寒論輯義』（多紀元簡）巻二は黄芩を記して「成本無し」と注し、『訂字標注傷寒論』（小原良直訂正）・『類聚方』・『校正方輿輗』・『勿誤薬室方函』巻上の本方にも黄芩がないとされる（要原本照合）\n- 『傷寒論集成』巻之三は、方名からすれば小柴胡湯に二物を加えるべきで、鉛丹・桂皮・茯苓・大黄の四味や、大黄を後から入れる煎法は仲景の本来のものではないとする（要原本照合）\n- 現行エキス剤（ツムラ12）は 柴胡5.0・半夏4.0・桂皮3.0・茯苓3.0・黄芩2.5・大棗2.5・人参2.5・牡蛎2.5・竜骨2.5・生姜1.0g（1日量7.5g中、乾燥エキス4.5g。PMDA 添付文書 2023年12月改訂 第1版で確認）。原典の鉛丹・大黄を含まず、桂枝が桂皮となる。添付文書に出典の欄はない\n- 資料は、エキス製剤は一社が大黄を入れないだけで、他社は宋本による同一組成とする（要確認）", "構成": "柴胡・半夏・桂皮・茯苓・黄芩・大棗・人参・牡蛎・竜骨・生姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "半夏瀉心湯", "名前": "半夏瀉心湯", "読み": "はんげしゃしんとう", "ツムラ番号": "14", "出典": "傷寒論（弁太陽病脈証并治下第七）、金匱要略（嘔吐噦下利病脈証治第十七）", "別名": "", "本文": {"条文": "### 『傷寒論』弁太陽病脈証并治下第七\n\n**書き下し**（読み：社員案）\n傷寒五六日、嘔して発熱する者は、柴胡湯の証具わる。而るに他薬を以て之を下し、柴胡の証仍お在る者は、復た柴胡湯を与う。此れ已に之を下すと雖も、逆と為さず。必ず蒸蒸として振い、却って発熱し汗出でて解す。若し心下満して鞕痛する者は、此れ結胸と為すなり。大陥胸湯之を主る。但だ満して痛まざる者は、此れ痞と為す。柴胡は之を与うるに中らず。半夏瀉心湯に宜し。\n\n**原文**（翻刻確認）\n傷寒五六日、嘔而發熱者、柴胡湯證具、而以他藥下之、柴胡證仍在者、復與柴胡湯。此雖已下之、不為逆、必蒸蒸而振、卻發熱汗出而解。若心下滿而鞕痛者、此為結胸也、大陷胸湯主之。但滿而不痛者、此為痞、柴胡不中與之、宜半夏瀉心湯。\n\n**現代語訳**（訳：社員案）\n傷寒にかかって五、六日、嘔吐して発熱する者は、柴胡湯の証がそろっている。それなのに他の薬で下し、なお柴胡の証が残っている者には、もう一度柴胡湯を与える。これはすでに下してはいるが、逆治とはしない。必ず蒸し上がるように熱くなって震え、かえって発熱し汗が出て治る。もしみぞおちが張って硬く痛む者は、結胸であり、大陥胸湯がこれを主治する。ただ張るだけで痛まない者は痞であり、柴胡湯を与えるのは当たらない。半夏瀉心湯がよい。\n\n### 『金匱要略』嘔吐噦下利病脈証治第十七\n\n**書き下し**（読み：社員案）\n嘔して腸鳴し、心下痞する者は、半夏瀉心湯之を主る。\n\n**原文**（翻刻確認）\n嘔而腸鳴、心下痞者、半夏瀉心湯主之。\n\n**現代語訳**（訳：社員案）\n嘔吐して腸が鳴り、みぞおちがつかえる者は、半夏瀉心湯がこれを主治する。\n\n### 注記\n- 『傷寒論』の条は、『注解傷寒論』の四庫全書本（書名『傷寒論注釋』）巻四でも字が同じ（翻刻確認。鞕／胷、瀉／㵼などの字形の差のみ）\n- 『傷寒論』の条は、『金匱玉函経』では「若心下滿而堅痛者」「若但滿而不痛者」「柴胡不復中與也」「半夏瀉心湯主之」「此雖以下之」と書かれる（要原本照合）。本文は宋本の字を採った\n- 甘草の量は、宋本の翻刻では「黄芩・乾姜・人参・甘草（炙）各3両」。『傷寒論注釋』の四庫全書本では甘草2両と書かれる（要原本照合）。本文は宋本と『金匱要略』の翻刻に合う3両を採った\n- 大棗の枚数は、宋本と『金匱要略』の翻刻では12枚。『金匱玉函経』では16枚、『金匱要略論註』（徐彬註）の四庫全書本では10枚と書かれる（要原本照合）\n- 半夏の量は、宋本と『金匱要略』の翻刻では半升。『金匱要略論註』の四庫全書本では「半觔」と書かれる（要原本照合）\n- 服用法の「去滓、再煎」は、『傷寒論注釋』の四庫全書本・『金匱玉函経』・『金匱要略』の翻刻では「再煮」と書かれる（要原本照合）。本文は宋本の字を採った\n- 維基文庫の『金匱要略』の翻刻（繁体字）には半夏瀉心湯方の構成・服用法の行がない。『金匱要略』の原典の構成・服用法は、維基文庫の『金匱要略方論』の翻刻（簡体字・未校訂）による", "出典": "### 原典の構成\n- 『傷寒論』：半夏半升（洗）、黄芩・乾姜・人参・甘草（炙）各3両、黄連1両、大棗12枚（擘）（翻刻確認）\n- 『金匱要略』：半夏半升（洗）、黄芩3両、乾姜3両、人参3両、黄連1両、大棗12枚、甘草3両（炙）（翻刻確認。『金匱要略方論』の翻刻による）\n\n### 原典の服用法\n- 『傷寒論』：7味を水1斗で煮て6升を取り、滓を去り、再び煎じて3升を取り、1升を温服する。日に3回服す（翻刻確認）\n- 『金匱要略』：7味を水1斗で煮て6升を取り、滓を去って再び煮て3升を取り、1升を温服する。日に3回服す（翻刻確認。『金匱要略方論』の翻刻による）\n\n### 処方の変遷\n- 構成の上では、黄連湯から桂皮を去り黄芩を加えた方、また小柴胡湯から柴胡・生姜を去り黄連・乾姜を加えた方にあたる\n- 『傷寒論』の生姜瀉心湯は本方の乾姜を1両に減らし生姜4両を加えた8味、甘草瀉心湯は甘草を4両に増やした方（翻刻確認。宋本の翻刻の甘草瀉心湯方には人参がなく6味）\n- 『備急千金要方』巻第十・傷寒下・傷寒不発汗変成狐惑病第四の瀉心湯は、本方と同じ7味で、下痢が止まず腹中が硬く嘔吐して腸鳴するものに用いる。方後の注に、仲景はこれを半夏瀉心と名づけるとある（要原本照合）\n- 『太平聖恵方』巻第十三・治傷寒結胸諸方の半夏湯方は、本方に赤茯苓を加えて散とし、棗を入れて煎服する（要原本照合）\n- 同巻・治傷寒百合病諸方の半夏散方は、本方に百合を加えて散とし、棗・生姜を入れて煎服する（要原本照合）\n- 同巻・治傷寒狐惑病諸方の半夏散方は、本方から大棗を去った6味を散とし、生姜を入れて煎服する（要原本照合）\n- 『牛山方考』巻之上・小柴胡湯では、小柴胡湯から柴胡を去り乾姜・黄連を加えたものを半夏瀉心湯と名づける（生姜は残す）（要原本照合）\n- 現行エキス剤（ツムラ14）は 半夏・黄芩・乾姜・甘草・大棗・人参・黄連 の7味で、原典と同じ構成（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "半夏・黄芩・乾姜・甘草・大棗・人参・黄連", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "黄連解毒湯", "名前": "黄連解毒湯", "読み": "おうれんげどくとう", "ツムラ番号": "15", "出典": "肘後百一方（巻二・治傷寒時気温病方第十三）／外台秘要方（巻一・崔氏方の引用）", "別名": "", "本文": {"条文": "### 『肘後百一方』巻二・治傷寒時気温病方第十三\n\n**書き下し**（読み：社員案）\n若し已に六七日、熱極まり、心下煩悶し、狂言して鬼を見、起ちて走らんと欲す。……又方、黄連三両、黄檗・黄芩各二両、梔子十四枚、水六升もて煎じて二升を取り、分けて再服す。煩嘔して眠るを得ざるを治す。\n\n**原文**（翻刻確認）\n若已六七日、熱極、心下煩悶、狂言見鬼、欲起走。……又方、黄連三兩、黄檗・黄芩各二兩、梔子十四枚、水六升、煎取二升、分再服。治煩嘔不得眠。\n\n**現代語訳**（訳：社員案）\n発病してすでに6〜7日たち、熱が極まって、みぞおちが苦しく悶え、うわごとを言って幻を見、起き上がって走り出そうとするもの。……別の方として、黄連3両、黄檗・黄芩各2両、梔子14枚を水6升で煎じて2升を取り、2回に分けて服す。胸苦しくて吐き気があり、眠れないものを治す。\n\n### 『外台秘要方』巻一・崔氏方\n\n**書き下し**（読み：社員案）\n又、前軍督護劉車なる者、時疾を得て三日、已に汗して解す。飲酒に因りて復た劇しく、煩悶・乾嘔に苦しみ、口燥きて呻吟し、錯語して臥するを得ず。余思いて此の黄連解毒湯方を作る。\n\n一服して目明らかに、再服して粥を進め、此に於いて漸く差ゆ。余以て凡そ大熱盛んにして、煩嘔・呻吟し、錯語して眠るを得ざるを療するに、皆佳し。伝えて諸人に語り、之を用いて亦効あり。此れ直ちに熱毒を解し、酷熱を除く。必ずしも飲酒して劇しき者ならず、此の湯もて療すること五日中に神効あり。豬肉・冷水を忌む。\n\n**原文**（翻刻確認）\n又前軍督護劉車者、得時疾三日、已汗解、因飲酒復劇、苦煩悶乾嘔、口燥呻吟、錯語不得卧、余思作此黄連解毒湯方。\n\n一服目明、再服進粥、於此漸差。余以療凡大熱盛、煩嘔呻吟、錯語不得眠、皆佳。傳語諸人、用之亦效。此直解熱毒、除酷熱、不必飲酒劇者、此湯療五日中神效。忌豬肉冷水。\n\n**現代語訳**（訳：社員案）\n前軍督護の劉車という者が、流行病にかかって3日目に、発汗してすでに治っていたが、飲酒によって再びひどくなり、胸苦しい悶えと空えずきに苦しみ、口が乾いてうめき、うわごとを言って横になれなかった。そこで私はこの黄連解毒湯を考えて作った。1回服すと目がはっきりし、2回服すと粥が食べられるようになり、そこから次第に治った。私はこれを用いて、およそ高熱が盛んで、胸苦しく吐き気があってうめき、うわごとを言って眠れないものを治したが、いずれもよく効いた。人々に伝えたところ、用いた者にもやはり効いた。これは直ちに熱毒を解き、激しい熱を除く。飲酒でひどくなったものでなくても、この湯で治療すれば5日のうちに著しく効く。豚肉と冷水を避ける。\n\n### 注記\n- 『肘後百一方』では本方に方名がない。「若已六七日…欲起走」の条の下に並ぶ「又方」の一つとして載り、最後に「治煩嘔不得眠」とある（翻刻確認）\n- 方名「黄連解毒湯」は『外台秘要方』巻一の崔氏方に出る（翻刻確認）\n- 翻刻のページ名は『肘後備急方』（四庫全書本、晋・葛洪撰）。同書の提要に、陶弘景が補って『肘後百一方』とし、楊用道が附広したとある（翻刻確認）\n- 『外台秘要方』の「復劇」の「劇」は、四庫全書本の翻刻では外字のため確認できず、別の翻刻本では「劇」（要原本照合）\n- 『外台秘要方』の「乾嘔」は、別の翻刻本では「幹嘔」と書かれる（機械的な繁体化によるものとみられる。要原本照合）\n- 『外台秘要方』の「余」は、四庫全書本では「余」、別の翻刻本では「餘」（要原本照合）\n- 『外台秘要方』の構成の「黄柏」は、四庫全書本では「黄蘗」と書かれる（要原本照合）", "出典": "### 原典の構成\n- 『肘後百一方』：黄連3両、黄檗（黄柏）・黄芩 各2両、梔子14枚（翻刻確認）\n- 『外台秘要方』（崔氏方）：黄連3両、黄芩・黄柏 各2両、梔子14枚（擘く）（翻刻確認）\n\n### 原典の服用法\n- 『肘後百一方』：水6升で煎じて2升を取り、2回に分けて服す（翻刻確認）\n- 『外台秘要方』（崔氏方）：4味を刻み、水6升で煮て2升を取り、2回に分けて服す。猪肉・冷水を忌む（翻刻確認）\n\n### 処方の変遷\n- 『肘後百一方』に方名のない「又方」として4味が載り、『外台秘要方』巻一の崔氏方で「黄連解毒湯」の名が付く（翻刻確認）\n- 『傷寒活人書』巻十八にも同じ主治で収載される（要原本照合）\n- 劉完素『黄帝素問宣明論方』巻四・熱論では、黄連・黄柏・黄芩・大黄の大金花丸から大黄を去り梔子を加えたものを梔子金花丸とし、巻六・傷寒方では黄連解毒湯を茶と共に煎服する。腹満・嘔吐などに半夏・厚朴・茯苓を加え生姜で煎じる半夏黄連解毒湯の記載もある（要原本照合）\n- 劉完素『傷寒直格方』巻下では、細末にして水で丸じ温水で服す法を載せる（要原本照合）\n- 書によって梔子金花丸に大黄を含むものと含まないものがあり、方名は錯雑している（要原本照合）\n- 『万病回春』巻二・傷寒には柴胡・連翹を加えた6味の黄連解毒湯、同書の火証にはさらに芍薬を加えた方が載る。後者は後の一貫堂の四物黄連解毒湯のもとになったとされる（要原本照合）\n- 『外科正宗』巻二・疔瘡論では、連翹・甘草・牛蒡子を加えて灯心で煎服する（要原本照合）\n- 現行エキス剤（ツムラ15）は 黄芩3.0・黄連2.0・山梔子2.0・黄柏1.5g（7.5g中）の4味（PMDA 添付文書 2023年12月改訂で確認）。原典は黄連が最も多い", "構成": "黄芩・黄連・山梔子・黄柏", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "半夏厚朴湯", "名前": "半夏厚朴湯", "読み": "はんげこうぼくとう", "ツムラ番号": "16", "出典": "金匱要略（婦人雑病脈証并治第二十二）", "別名": "", "本文": {"条文": "### 『金匱要略』婦人雑病脈証并治第二十二\n\n**書き下し**（読み：社員案）\n婦人、咽中に炙臠有るが如きは、半夏厚朴湯之を主る。\n\n**原文**（翻刻確認）\n婦人咽中如有炙臠，半夏厚朴湯主之。\n\n**現代語訳**（訳：社員案）\n婦人で、のどの中に炙った肉の切れ端があるように感じるものは、半夏厚朴湯がこれを主治する。\n\n### 注記\n- 方の見出し「半夏厚朴湯方」の下に小字の注「千金作胸満心下堅咽中□□如有炙肉吐之不出吞之不下」がある（『千金』には、胸満して心下堅く、咽中□□として炙肉有るが如く、之を吐けども出でず、之を呑めども下らず、と作る）。維基文庫の『金匱要略』（通行本）の翻刻には方の部分が載っていない（翻刻確認）\n- 上の注の□□は、『金匱要略方論』（未校訂の簡体字本）の翻刻では「占占」、四部叢刊本の翻刻では「帖帖」と書かれ、資料は「怗怗」と書く（要原本照合）\n- 「炙臠」は、四庫全書本『金匱要略論註』の翻刻では「灸臠」と書かれる（要原本照合）\n- 四部叢刊本の翻刻では半夏の分量が見えない。半夏1升は『金匱要略方論』（簡体字本）と四庫全書本『金匱要略論註』の翻刻で確かめた（要原本照合）\n- 煮る水の量は、四庫全書本『金匱要略論註』の翻刻では「水一斗」と書かれる（要原本照合）", "出典": "### 原典の構成\n半夏1升、厚朴3両、茯苓4両、生姜5両、乾蘇葉2両（翻刻確認）\n\n### 原典の服用法\n5味を水7升で煮て4升を取り、温めて4回に分けて服す。昼に3回、夜に1回服す（翻刻確認）\n\n### 処方の変遷\n- 七気湯・大七気湯・四七湯・厚朴半夏湯などの別名で呼ばれるとされる（要原本照合）\n- 『備急千金要方』巻第三・婦人方中・雑治第八に、胸満して心下堅く咽中に炙臠があるようなものを治す半夏厚朴湯が原典と同じ5味で載り、方後に「一方では蘇葉・生姜なし」とあるとされる（要原本照合）\n- 『三因極一病証方論』巻之八・七気証治には、半夏厚朴湯が「大七気湯」の名で載るとされる（要原本照合）\n- 『易簡方』増損飲子治法三十首には「四七湯」として、半夏・茯苓・厚朴・紫蘇葉を姜棗で煎じて服す方が載るとされる。『婦人大全良方』巻之六・衆疾門・婦人風痰方論第十五と『類編朱氏集験医方』巻之四・脾胃門は、これを転載・節録しているとされる（要原本照合）\n- 『和剤局方』巻之四・痰飲 附 咳嗽にも四七湯が載り、続添諸局経験秘方（1241〜1252年）に属するとされる（要原本照合）\n- 『普済方』巻三百二十一・婦人諸疾門・小便不通には、瑞竹堂方に出る四七湯として、半夏・厚朴・赤茯苓・紫蘇葉・甘草・香附子に琥珀末を加える方が載るとされる。構成は本方と異なる（要原本照合）\n- 現行エキス剤（ツムラ16）は 半夏6.0・茯苓5.0・厚朴3.0・蘇葉2.0・生姜1.0g の5味（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "半夏・茯苓・厚朴・蘇葉・生姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "五苓散", "名前": "五苓散", "読み": "ごれいさん", "ツムラ番号": "17", "出典": "傷寒論（弁太陽病脈証并治中第六）／金匱要略（痰飲咳嗽病脈証并治第十二）／備急千金要方（巻第九・傷寒上・発汗散第四）", "別名": "", "本文": {"条文": "### 『傷寒論』弁太陽病脈証并治中第六\n\n**書き下し**（読み：社員案）\n太陽病、発汗の後、大いに汗出で、胃中乾き、煩躁して眠るを得ず、水を飲むを得んと欲する者は、少少与えて之を飲ましめ、胃気をして和せしむれば則ち愈ゆ。若し脈浮、小便利せず、微熱して消渇する者は、五苓散之を主る。\n\n**原文**（翻刻確認）\n太陽病、發汗後、大汗出、胃中乾、煩躁不得眠、欲得飲水者、少少與飲之、令胃氣和則愈。若脈浮、小便不利、微熱消渴者、五苓散主之。\n\n**現代語訳**（訳：社員案）\n太陽病で発汗させた後、大いに汗が出て、胃の中が乾き、煩躁して眠れず、水を飲みたがるものには、少しずつ与えて飲ませ、胃気を調和させれば治る。もし脈が浮で、尿の出が悪く、微熱があって消渇する（しきりに渇いて水を飲む）ものは、五苓散がこれを主治する。\n\n**書き下し**（読み：社員案）\n発汗し已りて、脈浮数、煩渇する者は、五苓散之を主る。\n\n**原文**（翻刻確認）\n發汗已、脈浮數、煩渴者、五苓散主之。\n\n**現代語訳**（訳：社員案）\n発汗し終えて、脈が浮数で、煩渇する（ひどく口が渇いて苦しむ）ものは、五苓散がこれを主治する。\n\n**書き下し**（読み：社員案）\n傷寒、汗出でて渇する者は、五苓散之を主る。渇せざる者は、茯苓甘草湯之を主る。\n\n**原文**（翻刻確認）\n傷寒汗出而渴者、五苓散主之。不渴者、茯苓甘草湯主之。\n\n**現代語訳**（訳：社員案）\n傷寒で、汗が出て口が渇くものは、五苓散がこれを主治する。渇かないものは、茯苓甘草湯がこれを主治する。\n\n**書き下し**（読み：社員案）\n中風発熱し、六七日解せずして煩し、表裏の証有り、渇して水を飲まんと欲し、水入れば則ち吐する者は、名づけて水逆と曰う。五苓散之を主る。\n\n**原文**（翻刻確認）\n中風發熱、六七日不解而煩、有表裏證、渴欲飲水、水入則吐者、名曰水逆、五苓散主之。\n\n**現代語訳**（訳：社員案）\n中風で発熱し、六、七日たっても解けずに煩躁し、表と裏の両方の証があり、口が渇いて水を飲みたがるが、水が入るとすぐに吐くものを、水逆という。五苓散がこれを主治する。\n\n### 『金匱要略』痰飲咳嗽病脈証并治第十二\n\n**書き下し**（読み：社員案）\n仮令えば瘦人、臍下に悸有り、涎沫を吐して癲眩するは、此れ水なり。五苓散之を主る。\n\n**原文**（翻刻確認）\n假令瘦人臍下有悸、吐涎沫而癲眩、此水也、五苓散主之。\n\n**現代語訳**（訳：社員案）\nたとえば痩せた人で、臍の下に動悸があり、泡のようなよだれを吐いて癲眩する（めまいがする）のは、水によるものである。五苓散がこれを主治する。\n\n### 『備急千金要方』巻第九・傷寒上・発汗散第四\n\n**書き下し**（読み：社員案）\n五苓散　時行の熱病、但だ狂言し煩躁して安からず、精彩・言語、人と相当たらざる者を主る方。\n\n**原文**（翻刻確認）\n五苓散　主時行熱病但狂言煩躁、不安、精彩言語不與人相當者方。\n\n**現代語訳**（訳：社員案）\n流行性の熱病で、ただうわごとを言い、もだえて落ち着かず、表情や言葉が人と噛み合わないものを主治する方。\n\n### 関連条文（誤治の例）\n\n『傷寒論』弁太陽病脈証并治下第七。熱病に冷水を吹きかけ・注ぐ誤治の例として資料が挙げる条。\n\n**書き下し**（読み：社員案）\n病陽に在らば、応に汗を以て之を解すべし。反って冷水を以て之に潠ぎ、若しくは之に灌げば、其の熱劫かされて去るを得ず、彌いよ更に益ます煩し、肉上粟起し、意に水を飲まんと欲するも、反って渇せざる者は、文蛤散を服す。若し差えざる者は、五苓散を与う。\n\n**原文**（翻刻確認）\n病在陽、應以汗解之、反以冷水潠之、若灌之、其熱被劫、不得去、彌更益煩、肉上粟起、意欲飲水、反不渴者、服文蛤散。若不差者、與五苓散。\n\n**現代語訳**（訳：社員案）\n病が陽にあるときは、汗によって解すべきである。それなのにかえって冷水を吹きかけたり注いだりすると、その熱が抑え込まれて去ることができず、ますます煩躁し、皮膚に粟粒のようなものが立ち、気持ちでは水を飲みたいのにかえって渇かないものは、文蛤散を服す。もし治らないものには、五苓散を与える。\n\n### 注記\n- 資料は、宋本の最初の条（太陽病、発汗後…）の直後に小字双行で「即猪苓散是」（即ち猪苓散是なり）の注があるとする。維基文庫の宋本の翻刻には見当たらない（要原本照合）\n- 最初の条の「五苓散主之」は、『注解傷寒論』の四庫全書本（書名『傷寒論注釋』）巻三と『金匱玉函経』では「與五苓散主之」と書かれる（要原本照合）\n- 2番目の条の「發汗已、脈浮數」は、『金匱玉函経』では「發汗後、脈浮而數」と書かれる（要原本照合）\n- 4番目の条の「水入則吐者、名曰水逆」は、『金匱玉函経』では「水入即吐、此為水逆」と書かれる（要原本照合）\n- 「乾」は『金匱玉函経』の翻刻では「干」と書かれる（字体の違い）\n- 関連条文の宋本の条は、このあと「寒實結胸、無熱證者、與三物小陷胸湯、白散亦可服」と続く。五苓散に関わる部分までを載せた（翻刻確認）\n- 関連条文は、『金匱玉函経』では「反以水潠之」「皮上粟起」などと書かれる（要原本照合）。『傷寒論注釋』巻四は宋本と同じ（劫／刼の字体の差のみ。翻刻確認）\n- 宋本の方の茯苓は、維基文庫の翻刻では「株茯苓十八銖」と書かれる。『傷寒論注釋』巻三・『金匱玉函経』は「茯苓十八銖」で、原典の構成は茯苓とした（要原本照合）。沢瀉は『傷寒論注釋』巻三では「一兩六銖半」、桂枝は両書とも「桂」と書かれる（要原本照合）\n- 『金匱要略』の条の「瘦人」「癲眩」について、資料は『医宗金鑑』が「瘦」は「病」、「癲」は「巓」の伝写の誤りとすることを引く（要原本照合）\n- 『備急千金要方』の方は桂枝を「桂心」と書き、白朮を用いる。生薬の種類は宋本の方と同じ（翻刻確認）\n- 3書の順は、宋本『傷寒論』・『金匱要略』・『備急千金要方』の順にした。3書とも現行エキス剤（ツムラ）と同じ5味（朮の白／蒼の違いのみ）で、構成一致の出典が複数あるため、基準では順が決まらない（要確認）\n- 宋本にはほかにも五苓散の条がある（弁太陽病脈証并治下第七、弁陽明病脈証并治第八、弁霍乱病脈証并治第十三。翻刻確認）。『金匱要略』では消渇小便不利淋病脈証并治第十三にも2条ある（翻刻確認）", "出典": "### 原典の構成\n- 『傷寒論』：猪苓18銖（去皮）、沢瀉1両6銖、白朮18銖、茯苓18銖、桂枝半両（去皮）（翻刻確認）\n- 『金匱要略』：痰飲咳嗽病の篇の方は、維基文庫の翻刻には見当たらない（要原本照合）\n- 『備急千金要方』：猪苓・白朮・茯苓 各18銖、桂心12銖、沢瀉30銖（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』：5味を搗いて散とし、白飲（重湯）で方寸匕を和して服す。日に3回。暖かい水を多く飲み、汗が出れば愈える。法のとおりに養生する（翻刻確認）\n- 『備急千金要方』：5味を治めて篩にかけ、水で方寸匕を服す。日に3回。多く水を飲み、汗が出れば愈える（翻刻確認）\n\n### 処方の変遷\n- 構成上は四苓湯（猪苓・沢瀉・白朮・茯苓）に桂皮を加えた方だが、歴史的には本方のほうが古い（資料の解説）\n- 『備急千金要方』は巻第九・傷寒上・発汗散第四（条文の欄に載せた）のほか、巻第十・傷寒下・傷寒発黄第五にも五苓散の名で載る。資料は、巻第十の方は黄疸を主って小便を利する方で、各味の配合量が多いとする（要原本照合）\n- 『太平聖恵方』では巻第九・巻第十に猪苓散の名で同じ5味が載る。巻第十・治傷寒中風諸方には葛根を加えた6味の猪苓散、巻第十二・治傷寒霍乱諸方には沢瀉の代わりに甘草を入れた方があるとする（要原本照合）\n- 『傷寒直格方』巻下・諸証薬石分剤では、方後に滑石・阿膠を加える加減が書かれる。資料は五苓散加滑石・阿膠を五苓散合猪苓湯とする（要原本照合）\n- 現行の医療用エキス剤（ツムラ17）は 沢瀉4.0g、蒼朮・猪苓・茯苓 各3.0g、桂皮1.5g の5味。原典の白朮の代わりに蒼朮が入る（PMDA 添付文書 2023年12月改訂で確認）", "構成": "沢瀉・蒼朮・猪苓・茯苓・桂皮", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "桂枝加朮附湯", "名前": "桂枝加朮附湯", "読み": "けいしかじゅつぶとう", "ツムラ番号": "18", "出典": "方機（桂枝湯の条）", "別名": "", "本文": {"条文": "### 『方機』桂枝湯の条\n\n**書き下し**（要原本照合）\n\n**原文**（要原本照合）\n\n**現代語訳**\n\n### 注記\n- 『方機』の桂枝湯の条は、桂枝加朮附湯を湿家の骨節疼痛、半身不随・口眼喎斜、頭疼、身体麻痺、激しい頭痛などに挙げる（要原本照合。資料の論考②の引用による）\n- 資料は、この条で各症に応鐘散・七宝丸・南呂丸・紫円などを兼用するとする（要原本照合）\n- 『方機』の条は「朮」とだけ書き、蒼朮か白朮かを書かない（要原本照合）", "出典": "### 原典の構成\n- 『傷寒論』（宋本）桂枝加附子湯（もとの方）：桂枝3両（去皮）、芍薬3両、甘草2両（炙）、生姜3両（切）、大棗12枚（擘）、附子1枚（炮、去皮、破八片）（翻刻確認）\n- 『方機』：桂枝加附子湯に朮を加える。朮・附子の分量は資料に記載がない（要原本照合）\n\n### 原典の服用法\n- 『傷寒論』（宋本）桂枝加附子湯（もとの方）：6味を水7升で煮て3升を取り、滓を去って1升を温服する（翻刻確認）\n\n### 処方の変遷\n- 桂枝加附子湯に朮を加えた加味方。桂枝加附子湯の出典は『傷寒論』巻第二・弁太陽病脈証并治上第五で、太陽病で発汗して汗が漏れて止まらず、悪風し、小便が出にくく、四肢が軽くひきつって屈伸しにくいものを主治する（翻刻確認）\n- 資料の出典欄は『傷寒論』『方機』の2書を挙げる。桂枝加朮附湯の名が出るのは『方機』の桂枝湯の条（要原本照合）\n- 『方機』の著者・成立年は資料に記載がない（要確認）\n- 『類聚方広義』（上）の桂枝加附子湯にも、この方に朮を加えて桂枝加朮附子湯と名づけるとある（要原本照合）\n- 現行エキス剤（ツムラ）は 桂皮・芍薬・蒼朮・大棗・甘草・生姜・ブシ末 の7味で、朮は蒼朮、附子はブシ末（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "桂皮・芍薬・蒼朮・大棗・甘草・生姜・附子（ブシ末）", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "小青竜湯", "名前": "小青竜湯", "読み": "しょうせいりゅうとう", "ツムラ番号": "19", "出典": "傷寒論（巻第三・弁太陽病脈証并治中第六）／金匱要略（痰飲咳嗽病脈証并治第十二）／備急千金要方（第九 傷寒方上・発汗吐下後第九）", "別名": "", "本文": {"条文": "### 『傷寒論』巻第三・弁太陽病脈証并治中第六\n\n**書き下し**（読み：社員案）（1条目：表解せず心下に水気有り）\n傷寒、表解せず、心下に水気有り、乾嘔し、発熱して咳し、或いは渇し、或いは利し、或いは噎し、或いは小便利せず、少腹満し、或いは喘する者は、小青竜湯之を主る。\n\n**原文**（翻刻確認）\n傷寒表不解，心下有水氣，乾嘔，發熱而咳，或渴，或利，或噎，或小便不利，少腹滿，或喘者，小青龍湯主之。\n\n**現代語訳**（訳：社員案）\n傷寒で、表証が解けず、みぞおちに水気があって、からえずきし、発熱して咳が出る。あるいはのどが渇き、あるいは下痢し、あるいはのどがつかえ、あるいは尿の出が悪くて下腹が張り、あるいは喘鳴するものは、小青竜湯が主治する。\n\n**書き下し**（読み：社員案）（2条目：咳して微喘。1条目の方の後に続く）\n傷寒、心下に水気有り、咳して微しく喘し、発熱して渇せず。湯を服し已りて渇する者は、此れ寒去りて解せんと欲するなり。小青竜湯之を主る。\n\n**原文**（翻刻確認）\n傷寒心下有水氣，咳而微喘，發熱不渴。服湯已，渴者，此寒去欲解也。小青龍湯主之。\n\n**現代語訳**（訳：社員案）\n傷寒で、みぞおちに水気があり、咳が出て軽く喘鳴し、発熱するがのどは渇かない。湯を飲み終えてのどが渇くものは、寒が去って治ろうとしているのである。小青竜湯が主治する。\n\n### 『金匱要略』痰飲咳嗽病脈証并治第十二\n\n**書き下し**（読み：社員案）（溢飲）\n溢飲を病む者は、当に其の汗を発すべし。大青竜湯之を主る。小青竜湯も亦之を主る。\n\n**原文**（翻刻確認）\n病溢飲者，當發其汗，大青龍湯主之；小青龍湯亦主之。\n\n**現代語訳**（訳：社員案）\n溢飲を病むものは、汗を出させるべきである。大青竜湯が主治する。小青竜湯もまたこれを主治する。\n\n**書き下し**（読み：社員案）（咳逆倚息）\n咳逆倚息して臥するを得ざるは、小青竜湯之を主る。（方は上に見ゆ）\n\n**原文**（翻刻確認）\n咳逆倚息不得臥，小青龍湯主之。（方見上。）\n\n**現代語訳**（訳：社員案）\n咳き込んで気が突き上げ、物に寄りかかって息をし、横になることができないものは、小青竜湯が主治する。（方は上に載る）\n\n### 『備急千金要方』第九 傷寒方上・発汗吐下後第九\n\n**書き下し**（読み：社員案）\n傷寒、表未だ解せず、心下に水気有り、乾嘔し発熱して咳し、或いは渇し、或いは痢し、或いは噎し、或いは小便利せず、小腹満し、或いは喘する者を治する方。\n\n**原文**（翻刻確認）\n治傷寒表未解，心下有水氣，乾嘔發熱而咳，或渴或痢或噎或小便不利、小腹滿或喘者方。\n\n**現代語訳**（訳：社員案）\n傷寒で、表証がまだ解けず、みぞおちに水気があって、からえずきし、発熱して咳が出る。あるいはのどが渇き、あるいは下痢し、あるいはのどがつかえ、あるいは尿の出が悪くて下腹が張り、あるいは喘鳴するものを治す方。\n\n### 関連条文（溢飲の定義）\n\n『金匱要略』痰飲咳嗽病脈証并治第十二。資料が溢飲の説明として引く四飲の条のうち、溢飲の句。\n\n**書き下し**（読み：社員案）\n飲水流行して四肢に帰し、当に汗出づべくして汗出でず、身体疼重するは、之を溢飲と謂う。\n\n**原文**（翻刻確認）\n飲水流行，歸於四肢，當汗出而不汗出，身體疼重，謂之溢飲。\n\n**現代語訳**（訳：社員案）\n飲んだ水が流れて手足に行きわたり、汗が出るはずなのに出ず、体が痛んで重いものを、溢飲という。\n\n### 注記\n- 1条目の「咳」は、四庫全書本『傷寒論注釈』（成無己注）の翻刻と資料では「欬」（要原本照合）。2条目も同じ。本文は宋本の翻刻の字を採った\n- 宋本の方後の加減法の末尾「且蕘花不治利，麻黃主喘。今此語反之，疑非仲景意。」に続く林億の小字注は、資料（論考⑥）によれば「豈に仲景の意に非ざるや」と疑問を投げかけるものだが、維基文庫の宋本の翻刻には見当たらない（要原本照合）\n- 宋本『傷寒論』の翻刻は煎じ方を「以水一升，先煮麻黃，減二升」と書く（要原本照合）。本文は、四庫全書本『傷寒論注釈』と四部叢刊本『金匱要略方論』の翻刻の「以水一斗」を採った\n- 宋本の翻刻は「取三升」、四庫全書本『傷寒論注釈』と四部叢刊本『金匱要略方論』の翻刻は「煮取三升」（要原本照合）\n- 四庫全書本『傷寒論注釈』の翻刻では半夏が「半斤」（要原本照合）。本文は宋本の翻刻・四部叢刊本『金匱要略方論』の翻刻・資料の「半升」を採った。また同書の翻刻は加減法を注の中に置き、微利 → 渇 → 噎 → 小便不利 → 喘の順で書く（要原本照合）\n- 『金匱要略』の通行本の翻刻には、溢飲の条の後に小青竜湯方の本文がない。四部叢刊本の翻刻（巻中）では溢飲の条の後に大青竜湯方・小青竜湯方が続く（翻刻確認）\n- 四部叢刊本『金匱要略方論』の翻刻では五味子が「半斤」（要原本照合）。本文は宋本『傷寒論』の翻刻と資料の「半升」を採った\n- 四部叢刊本の翻刻では、溢飲の条は「大青龍湯主之○小青龍湯亦主之」と○で区切られる（翻刻確認）\n- 咳逆倚息の条は、四部叢刊本の翻刻では「欬逆𠋣息不得卧」と書かれ、小字注は「方見上文肺癰中」（要原本照合）。通行本・四部叢刊本とも、この条は附方（外台茯苓飲）の後に置かれる（翻刻確認）\n- 『金匱要略』の篇名は、資料では「痰飲欬嗽病脉証并治第十二」。翻刻は「痰飲咳嗽病脈證並治第十二」（翻刻確認）\n- 『金匱要略』婦人雑病脈証并治第二十二にも、婦人が涎沫を吐くのに医者が誤って下した条で「当先治其吐涎沫，小青龍湯主之」とある（翻刻確認）。資料は挙げていないため条文の欄には上げていない（要確認）\n- 『備急千金要方』の条は、宋本の「表不解」を「表未解」、「或利」を「或痢」、「少腹滿」を「小腹滿」に作る（翻刻確認）\n- 『備急千金要方』の方後の「相去十里許複服之」の「許」を、資料は「頃」とする（要原本照合）。本文は翻刻の字を採った", "出典": "### 原典の構成\n- 『傷寒論』（宋本）：麻黄3両（去節）、芍薬3両、細辛3両、乾姜3両、甘草3両（炙）、桂枝3両（去皮）、五味子半升、半夏半升（洗）（翻刻確認）\n- 『金匱要略』：麻黄3両（去節）、芍薬3両、五味子半升、乾姜3両、甘草3両（炙）、細辛3両、桂枝3両（去皮）、半夏半升（湯洗）（要原本照合。四部叢刊本の翻刻では五味子半斤。注記）\n- 『備急千金要方』：桂心・麻黄・甘草・乾姜・芍薬・細辛 各3両、五味子・半夏 各半両（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』（宋本）：8味を水1斗で、まず麻黄を煮て2升減らし、上の泡を去る。残りの薬を入れて3升に煮つめ、滓を去って1升を温服する（宋本の翻刻の「水1升」は注記）。加減法：渇く者は半夏を去り栝楼根3両を加える。微しく下痢する者は麻黄を去り蕘花を鶏卵1個ほど（熬って赤くする）加える。噎する者は麻黄を去り附子1枚（炮）を加える。小便が出にくく下腹が張る者は麻黄を去り茯苓4両を加える。喘する者は麻黄を去り杏仁半升（皮尖を去る）を加える。方後に「蕘花は利を治さず、麻黄は喘を主る。今この語はこれに反しており、仲景の意ではないと疑われる」とある（翻刻確認）\n- 『金匱要略』：8味を水1斗で、まず麻黄を煮て2升減らし、上の泡を去る。残りの薬を入れて3升に煮つめ、滓を去って1升を温服する（要原本照合。四部叢刊本の翻刻による）\n- 『備急千金要方』：8味を刻み、水1斗で麻黄を煮て2升減らし、上の泡を去る。諸薬を入れて3升に煮つめ、3回に分けて服す。十里ほど行く間をおいて次を服す。加減法：渇く者は半夏を去り栝楼根3両を加える。微しく下痢すれば麻黄を去り蕘花を鶏卵1個ほど（熬って赤くする）加える。噎すれば附子1枚を加える。小便が出にくく下腹が張る者は麻黄を去り茯苓4両を加える。喘すれば麻黄を去り杏仁半升を加える。しばしば用いて神効がある、とある（翻刻確認）\n\n### 処方の変遷\n- 麻黄湯の加減方とも、桂枝湯の加減方とも、桂麻各半湯の加減法ともいわれる（資料の記載）\n- 『金匱要略』肺痿肺癰咳嗽上気病脈証并治第七には、肺脹で咳して上気し、煩躁して喘し、脈が浮で心下に水がある者を治す方として、小青竜湯に石膏2両を加えた小青竜加石膏湯が載る（翻刻確認）\n- 『備急千金要方』の小青竜湯は同じ8味で、半夏・五味子が各半両と少ない（条文の欄・原典の構成を参照）\n- 『医心方』（丹波康頼）巻第九・治咳嗽方第一には、『小品方』の沃雪湯（上気して息臥できず、喉中が水鶏の声のようで、気が絶えそうな者を治す。麻黄・細辛・五味子・乾姜・半夏・桂心。一名投杯湯）が引かれるとされる。小青竜湯から芍薬・甘草を去った構成（要原本照合）\n- 『外台秘要方』第十巻 肺痿肺気上気咳嗽・上気喉中水鶏鳴方には、『古今録験方』の沃雪湯（一名投杯麻黄湯。『集験方』『経心録』『范汪方』も同じとされる）と、それに続いて投杯湯（小青竜湯去芍薬加款冬花・紫菀・杏人）が載るとされる（要原本照合）\n- 『聖済総録』巻第六十七 諸気門・上気には、上気して息できず喉咽が利しない者を治す沃雪湯方が載り、先の沃雪湯から乾姜を去り、姜棗を入れて煎服するとされる（要原本照合）\n- 現行エキス剤（ツムラ19）は 半夏・乾姜・甘草・桂皮・五味子・細辛・芍薬・麻黄 の8味（PMDA 添付文書 2023年12月改訂 第1版で確認）。原典の「桂枝」は、資料の組成欄では「桂皮」と書かれる", "構成": "半夏・乾姜・甘草・桂皮・五味子・細辛・芍薬・麻黄", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "防已黄耆湯", "名前": "防已黄耆湯", "読み": "ぼういおうぎとう", "ツムラ番号": "20", "出典": "金匱要略（痙湿暍病脈証并治第二）／金匱要略（水気病脈証并治第十四）／金匱要略（水気病脈証并治第十四・附方『外台』の引用）", "別名": "", "本文": {"条文": "### 『金匱要略』痙湿暍病脈証并治第二（風湿の条）\n\n**書き下し**（読み：社員案）\n風湿、脈浮にして身重く、汗出でて悪風する者は、防己黄耆湯之を主る。\n\n**原文**（翻刻確認）\n風濕，脈浮身重，汗出惡風者，防己黃耆湯主之。\n\n**現代語訳**（訳：社員案）\n風湿の病で、脈が浮で体が重く、汗が出て風を嫌う者は、防己黄耆湯がこれを主治する。\n\n### 『金匱要略』水気病脈証并治第十四（風水の条）\n\n**書き下し**（読み：社員案）\n風水、脈浮にして身重く、汗出でて悪風する者は、防己黄耆湯之を主る。腹痛には芍薬を加う。\n\n**原文**（翻刻確認）\n風水，脈浮身重，汗出惡風者，防己黃耆湯主之。腹痛加芍藥。\n\n**現代語訳**（訳：社員案）\n風水の病で、脈が浮で体が重く、汗が出て風を嫌う者は、防己黄耆湯がこれを主治する。腹痛があれば芍薬を加える。\n\n### 『金匱要略』水気病脈証并治第十四・附方（『外台』防己黄耆湯）\n\n**書き下し**（読み：社員案）\n風水にて、脈浮なるは表に在りと為す。其の人或いは頭に汗出で、表に他病無く、病者但だ下のみ重きは、腰従り以上は和すと為し、腰以下は当に腫れて陰に及び、以て屈伸し難かるべきを治す。\n\n**原文**（翻刻確認）\n《外臺》防己黃耆湯：治風水，脈浮為在表，其人或頭汗出，表無他病，病者但下重，從腰以上為和，腰以下當腫及陰，難以屈伸。\n\n**現代語訳**（訳：社員案）\n風水で、脈が浮であるのは病が表にあるとする。その人はときに頭に汗が出るが、表にはほかの病がなく、病人はただ下半身だけが重いもので、腰から上は調っているとし、腰から下は腫れて陰部にまで及び、そのため曲げ伸ばしがしにくいはずのものを治す。\n\n### 注記\n- 方名・生薬名の「防己」は、維基文庫『金匱要略』の翻刻の字を本文に採った。四部叢刊本（明嘉靖俞橋刊本の影印）の翻刻では、痙湿暍病の条・方は「防巳」、水気病の方名は「防已」、その生薬名は「防巳」と書かれる。簡体字の『金匱要略方論』の翻刻では「防己」と「防已」が混在する（要原本照合）\n- 現行エキス剤の添付文書（ツムラ20）と資料は「防已」と書く。方剤名と構成の生薬名は添付文書の字にそろえた\n- 「黃耆」は、四部叢刊本の翻刻の水気病の条・方では「黃𦒿」「黄𦒿」と書かれる（要原本照合）\n- 水気病の条の「腹痛加芍藥」は、簡体字の『金匱要略方論』の翻刻では「腹痛者加芍药」と書かれる（要原本照合）\n- 附方の条の後ろに、簡体字の『金匱要略方論』の翻刻では「方は風湿の中に見ゆ」の注がある。維基文庫『金匱要略』の翻刻にはない（要原本照合）\n- 附方の条は、『外台秘要方』巻二十・風水方の深師の木防己湯の条とほぼ同文（「出典」の処方の変遷を参照）", "出典": "### 原典の構成\n- 『金匱要略』痙湿暍病第二：防己1両、甘草半両（炒）、白朮7銭半、黄耆1両1分（去蘆）。煎じるときに生姜4片、大棗1枚を入れる（翻刻確認）\n- 『金匱要略』水気病第十四：防己1両、黄耆1両1分、白朮3分、甘草半両（炙）。煎じるときに生姜4片、棗1枚を入れる（翻刻確認。四部叢刊本の翻刻による。維基文庫『金匱要略』の翻刻にはこの方が載らない）\n- 『金匱要略』水気病第十四・附方（『外台』防己黄耆湯）：方は載らない（翻刻確認）\n\n### 原典の服用法\n- 『金匱要略』痙湿暍病第二：麻豆大に刻み、1回5銭匕を取り、生姜4片・大棗1枚と水1盞半で8分に煎じ、滓を去って温服する。しばらくしてもう1回服す。喘する者は麻黄半両、胃中和せざる者は芍薬3分、気上衝する者は桂枝3分、下に陳寒有る者は細辛3分を加える。服した後、虫が皮の中を這うように感じ、腰から下が氷のように冷える。その後、布団の上に坐り、もう1枚の布団を腰から下に巻いて温め、少し汗をかかせると治る（翻刻確認）\n- 『金匱要略』水気病第十四：刻んで1回5銭匕を取り、生姜4片・棗1枚と水1盞半で8分に煎じ取り、滓を去って温服する。しばらくしてもう1回服す（翻刻確認。四部叢刊本の翻刻による）\n\n### 処方の変遷\n- 白朮の量は、痙湿暍病第二の方では7銭半、水気病第十四の方では3分と違う（翻刻確認）\n- 附方の『外台』防己黄耆湯は、『外台秘要方』巻二十・風水方に深師の「木防己湯」として載る。木防己4両、黄芪5両、白朮4両、甘草2両（炙）、生姜3両、大棗12枚の6味を刻み、水6升で2升に煮て3回に分けて服す。喘には麻黄、身重く胃中和せざるには芍薬、気上衝には桂心、下に久寒には細辛を加える。海藻・菘菜・桃・李・雀肉などを忌み、小字注に「此れ本は仲景の傷寒論の方」とある（翻刻確認。四庫全書本）\n- 現行エキス剤（ツムラ20）は7.5g中、黄耆5.0g、防已5.0g、蒼朮3.0g、大棗3.0g、甘草1.5g、生姜1.0g の6味。原典の白朮は蒼朮になっている（PMDA 添付文書 2023年12月改訂 第1版で確認）。添付文書に出典の欄はない", "構成": "黄耆・防已・蒼朮・大棗・甘草・生姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "小半夏加茯苓湯", "名前": "小半夏加茯苓湯", "読み": "しょうはんげかぶくりょうとう", "ツムラ番号": "21", "出典": "金匱要略（痰飲咳嗽病脈証并治第十二）", "別名": "小半夏茯苓湯", "本文": {"条文": "### 『金匱要略』痰飲咳嗽病脈証并治第十二\n\n**書き下し**（読み：社員案）\n卒かに嘔吐し、心下痞し、膈間に水有りて、眩悸する者は、小半夏加茯苓湯之を主る。\n\n**原文**（翻刻確認）\n卒嘔吐、心下痞、膈間有水、眩悸者、小半夏加茯苓湯主之。\n\n**現代語訳**（訳：社員案）\n急に嘔吐し、みぞおちがつかえ、膈のあたりに水があって、めまいと動悸がする者は、小半夏加茯苓湯がこれを主治する。\n\n**書き下し**（読み：社員案）\n先に渇して後に嘔するは、水心下に停まると為す。此れ飲家に属す。小半夏茯苓湯之を主る。（方は上に見ゆ）\n\n**原文**（翻刻確認）\n先渴後嘔、為水停心下、此属飲家、小半夏茯苓湯主之。（方見上）\n\n**現代語訳**（訳：社員案）\n先に口が渇き、その後に嘔吐するのは、水がみぞおちに停まっているためである。これは飲家（水飲の病のある人）に属する。小半夏茯苓湯がこれを主治する（処方は前に見える）。\n\n### 注記\n- 1条目は、四部叢刊本（明・俞橋刊本の影印）の翻刻では「卒嘔心下痞膈間有水眩悸者半夏加茯苓湯主之」で、「吐」の字がなく、方名を「半夏加茯苓湯」とする（要原本照合）。四部叢刊本でも方の見出しは「小半夏加茯苓湯方」（翻刻確認）。本文は維基文庫の『金匱要略』の字を採った\n- 2条目の方名は両方の翻刻とも「小半夏茯苓湯」（翻刻確認）。字体：維基文庫は「屬」、四部叢刊本は「属」。本文は新字体にした\n- 『備急千金要方』巻第十八・大腸腑・痰飲第六では、この3条が1条にまとめられ、「嘔家本渴」に当たる所が「嘔家不渇」（嘔家は渇せず）と正反対になるとされる（要原本照合）\n- 維基文庫の『金匱要略』の翻刻には小半夏加茯苓湯方の構成・服用法の行がない。原典の構成・服用法は四部叢刊本の翻刻による", "出典": "### 原典の構成\n- 『金匱要略』：半夏1升、生姜半斤、茯苓3両（原注に「一法4両」）（翻刻確認。四部叢刊本の翻刻による）\n\n### 原典の服用法\n- 『金匱要略』：3味を水7升で煮て1升5合を取り、2回に分けて温服する（翻刻確認。四部叢刊本の翻刻による）\n\n### 処方の変遷\n- 同じ篇の小半夏湯（半夏1升・生姜半斤。水7升で煮て1升半を取り、2回に分けて温服）に茯苓を加えた方（翻刻確認。四部叢刊本の翻刻による）\n- 同じ篇の小半夏湯の条（嘔家は本来渇くが、反って渇かないのは心下に支飲があるため、小半夏湯が主る）には、小字注で『千金』はこれを小半夏加茯苓湯とする、とある（翻刻確認。四部叢刊本の翻刻の注は「千金云小半夏湯加茯苓」（要原本照合））。資料はこの条も本方の条文とみなすとする\n- 原典には小半夏加茯苓湯のほか、半夏加茯苓湯・小半夏茯苓湯の名でも記されるとされる（要原本照合）\n- 『備急千金要方』巻第十八・大腸腑・痰飲第六には、同じ篇の茯苓湯（胸膈に痰が満ちるものを主る）として、小半夏加茯苓湯に桂心を加えた方が載るとされる（要原本照合）\n- 『傷寒活人書』巻第十八では、大半夏湯（痰飲と脾胃不和を治す）が半夏・白茯苓・生姜各1分で、熱痰には炙甘草を加え、脾胃不和には甘草を去って陳橘皮を入れるとされる。同巻の小半夏加茯苓湯は、諸々の嘔噦・心下堅痞・膈間に水痰があって眩悸する者に、半夏・白茯苓を生姜汁とともに煎じる。半夏生姜湯は小半夏湯の別名（要原本照合）\n- 『太平恵民和剤局方』巻之二・傷寒附中暑の消暑円は、半夏・茯苓・甘草を末とし生姜汁で丸とし、傷暑の発熱・頭痛を治すとされる。巻之四・痰飲附咳嗽の茯苓半夏湯は、茯苓・半夏を末とし姜で煎じ、停痰・留飲による胸膈満悶・咳嗽・嘔吐・息切れ・悪心で飲食が下らないものを治すとされる（要原本照合）\n- 『三因極一病証方論』巻之五・傷暑証治の消毒円は、半夏・茯苓・甘草を蜜丸とし、中暑の煩渇・暈眩・寒熱を治すとされる（要原本照合）\n- 現行エキス剤（ツムラ21）は 半夏・茯苓・生姜 の3味で、原典と同じ構成（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "半夏・茯苓・生姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "消風散", "名前": "消風散", "読み": "しょうふうさん", "ツムラ番号": "22", "出典": "外科正宗（巻之四・疥瘡論）", "別名": "", "本文": {"条文": "### 『外科正宗』巻之四・疥瘡論\n\n**書き下し**（読み：社員案）\n風湿、血脉に浸淫して瘡疥を生ずるを致し、搔痒絶えざる、及び大人・小児の風熱の癮疹、遍身の雲片斑点、乍ち有り乍ち無きを治す。并びに効あり。\n\n**原文**（翻刻確認）\n治風濕浸淫血脉、致生瘡疥、搔痒不絕、及大人小兒風熱癮疹、遍身雲片斑點、乍有乍無、并效。\n\n**現代語訳**（訳：社員案）\n風湿が血脈にしみこんで広がり、瘡や疥ができて、かゆくて掻くのが止まないもの、および大人・小児の風熱による癮疹で、全身に雲のちぎれたような斑点が出たり消えたりするものを治す。いずれにも効く。\n\n### 注記\n- 『外科正宗』の翻刻は簡体字の混じる本で、原文は明らかな簡体字だけを繁体字に直して書いた（绝→絕、儿→兒、瘾→癮、云→雲、点→點）。「脉」「痒」「并」は翻刻の字のまま。字形の判断には使えない（要原本照合）\n- 論の番号：資料は「疥瘡論第七十八」、翻刻は「疥瘡論第七十三」（翻刻の第七十八は凍風）。表題には巻と論名だけを書いた（要原本照合）\n- 方名の後に方歌「消風散內歸生地、蟬脫荊防蒼苦參。胡麻知母牛蒡等、石膏甘草木通行。」が置かれる（翻刻確認）\n- 同書の鈕扣風・歯病・陰瘡の篇にも消風散の名が出る（「見疥瘡門」）。鈕扣風の篇では、甚だしい者は消風散を服すとする（翻刻確認）", "出典": "### 原典の構成\n- 『外科正宗』巻之四・疥瘡論：当帰・生地黄・防風・蝉脱・知母・苦参・胡麻・荊芥・蒼朮・牛蒡子・石膏 各1銭、甘草・木通 各5分（翻刻確認）\n\n### 原典の服用法\n- 『外科正宗』巻之四・疥瘡論：水2鍾で煎じて8分とし、食遠（食事から間をあけて）服す（翻刻確認）\n\n### 処方の変遷\n- 『医宗金鑑』外科巻四・編輯外科心法要訣・項部・鈕扣風にも、『外科正宗』と同じ処方の消風散が載る。『外科正宗』は単に甘草とするが、『医宗金鑑』は生甘草とする（要原本照合）\n- 資料は本方の成立に関わる方として次を挙げる。『傷寒活人書』巻第二十一の鼠粘子湯（鼠粘子・甘草・防風・荊芥穂。鼠粘子は牛蒡子の別名で、4味とも本方の構成生薬）（要原本照合）\n- 『太平恵民和剤局方』巻之一・諸風 附 脚気の苦参円にも、本方の苦参・荊芥の2味が入る（要原本照合）\n- 『奇効良方』（方賢撰）巻之六十五・瘡疹出太盛解毒第九の消毒散（牛蒡子・甘草・荊芥）・化斑散（石膏・知母）も本方の構成生薬だが、もとは痘瘡の方で、資料は本方への関与は何とも言えないとする（要原本照合）\n- 『医学正伝』巻之八・痘疹門には鼠粘子湯が消毒飲として載り、同じ箇所に二物湯（蝉脱・甘草）も載る。消毒飲は『明医指掌』巻六・斑疹証十一にも消毒飲子として載る（要原本照合）\n- 同名異方：『和剤局方』の原書・五巻本にすでに消風散が載るが、白茯苓・芎藭・羌活・人参・荊芥・防風・藿香葉・蝉殻・白僵蚕・甘草・厚朴・陳皮で、茶清で調下する別の方。本方と共通する生薬は4味だけ（要原本照合）\n- 『外科正宗』以降も、『重訂古今方彙』頭痛、『景岳全書』巻之五十六・散陣、『医方集解』祛風之剤は、消風散として局方の消風散を載せる（要原本照合）\n- 現行エキス剤（ツムラ22）は7.5g中、地黄・石膏・当帰 各3.0g、牛蒡子・蒼朮・防風・木通 各2.0g、胡麻・知母 各1.5g、甘草・苦参・荊芥・蝉退 各1.0g の13味（PMDA 添付文書 2023年12月改訂 第1版で確認）。原典の13味と同じ生薬で、分量の比が異なる。添付文書に出典の欄はない", "構成": "地黄・石膏・当帰・牛蒡子・蒼朮・防風・木通・胡麻・知母・甘草・苦参・荊芥・蝉退", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "当帰芍薬散", "名前": "当帰芍薬散", "読み": "とうきしゃくやくさん", "ツムラ番号": "23", "出典": "金匱要略（婦人妊娠病脈証并治第二十・婦人雑病脈証并治第二十二）", "別名": "", "本文": {"条文": "### 『金匱要略』婦人妊娠病脈証并治第二十\n\n**書き下し**（読み：社員案）\n婦人懐妊し、腹中㽲痛するは、当帰芍薬散之を主る。\n\n**原文**（翻刻確認）\n婦人懷妊，腹中㽲痛，當歸芍藥散主之。\n\n**現代語訳**（訳：社員案）\n婦人が妊娠して、腹の中がひきつれるように痛む（㽲痛）ものは、当帰芍薬散がこれを主治する。\n\n### 『金匱要略』婦人雑病脈証并治第二十二\n\n**書き下し**（読み：社員案）\n婦人の腹中の諸疾痛は、当帰芍薬散之を主る。\n\n**原文**（翻刻確認）\n婦人腹中諸疾痛，當歸芍藥散主之。\n\n**現代語訳**（訳：社員案）\n婦人の腹の中のさまざまな痛みは、当帰芍薬散がこれを主治する。\n\n### 注記\n- 妊娠篇の条の「懐妊」は、四部叢刊本（明嘉靖俞橋刊本の影印）の翻刻では「懐娠」（要原本照合）\n- 「㽲痛」の「㽲」は、2つの翻刻とも「㽲」。資料は「疞痛（キュウツウ）」と書く（要原本照合）\n- 雑病篇の条の方は、四部叢刊本の翻刻では「見前姙娠中」（前の妊娠の篇に見える）の小字注で、妊娠篇の方を指す（翻刻確認）", "出典": "### 原典の構成\n- 『金匱要略』：当帰3両、芍薬1斤、茯苓4両、白朮4両、沢瀉半斤、芎藭半斤（翻刻確認）\n- 四部叢刊本の翻刻には、芎藭の下に「一作三两」（一本に3両に作る）の小字注がある（翻刻確認）\n\n### 原典の服用法\n- 『金匱要略』：6味を杵いて散とし、方寸匕を取って酒で和し、1日3回服す（翻刻確認）\n\n### 処方の変遷\n- 資料は、本方を四物湯去地黄（当帰・芍薬・川芎）と四苓湯去猪苓（茯苓・白朮・沢瀉）を合わせた構成にあたるとする（成立の順は逆）\n- 『三因極一病証方論』巻之十七・腹痛下利治法に当帰芍薬散として載り、妊娠の腹中絞痛・心下急満、産後の血暈による内虚・気乏、崩中・久痢を治すとされる。方後に『元和紀用経』を引き、本はもと六気経緯円という名で、安期先生が李少君に賜った久餌の薬であり、のちに仲景が増減して婦人の懐妊腹痛の方としたとする。芍薬4両・沢瀉・茯苓・川芎各1両・当帰・白朮各2両を蜜丸として服してもよいとも記すとされる（要原本照合）\n- 『三因極一病証方論』巻之十八・虚渇証治に六気経緯円として載るとされる（要原本照合）\n- 唐・王冰撰『元和紀用経』に六気経緯丸として6味が載り、方後に安期生が李少君に賜った久餌の薬で、のちに仲景が増減して女人の懐妊の腹痛に用いたとされる。資料の表では分量は芍薬8・当帰4・白朮4・茯苓2・沢瀉2・川芎2両（要原本照合）\n- 『太平恵民和剤局方』巻之九・婦人諸疾（附産図）に載り、条文・方後の文は『三因方』と同じとされる。続添諸局経験秘方（1241〜1252年）に属するとされる（要原本照合）\n- 『婦人大全良方』巻之十二・妊娠心腹痛方論第十二に『三因方』からの引用として載り、「心下急満」を「心下急痛」とするなど字句が一部改められるとされる（要原本照合）\n- 『厳氏済生方』巻之九・婦人論・校正時賢胎前十八論治に当帰芍薬湯の名で載り、妊娠の腹中疞痛で下痢して心下急満するものを治し、同じ6味を細末として温酒または米飲で調服するとされる（要原本照合）\n- 当帰・川芎の2味の方として、『婦人大全良方』巻之二・通用方序論第五の仏手散（川芎2両・当帰3両）と、同じ所で一方として挙げる芎帰湯（2味を等分）、『聖済総録』巻第一百五十五・妊娠門・妊娠腹痛の芎藭散（芎藭・当帰各1両）があるとされる（要原本照合）\n- 現行エキス剤（ツムラ23）は 芍薬・蒼朮・沢瀉・茯苓・川芎・当帰 の6味。1日量7.5g中、シャクヤク4.0・ソウジュツ4.0・タクシャ4.0・ブクリョウ4.0・センキュウ3.0・トウキ3.0g の混合生薬の乾燥エキス4.0gを含む。原典の白朮は、ツムラの添付文書では蒼朮（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "芍薬・蒼朮・沢瀉・茯苓・川芎・当帰", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "加味逍遙散", "名前": "加味逍遙散", "読み": "かみしょうようさん", "ツムラ番号": "24", "出典": "万病回春（巻之六・婦人科・虚労）", "別名": "", "本文": {"条文": "### 『万病回春』巻之六・婦人科・虚労（逍遙散の条）\n\n**書き下し**（読み：社員案）\n虚労にて熱嗽し汗有る者。逍遙散　肝脾の血虚して発熱し、或いは潮熱し、或いは自汗・盗汗し、或いは頭痛・目眩し、或いは怔忡して寧からず、煩赤して口乾き、或いは月経調わず、或いは肚腹痛みを作し、或いは小腹重墜して水道渋痛し、或いは腫痛して膿を出だし、内熱して渇を作すを治す。（方後に）牡丹皮・梔子（炒）を加え、加味逍遙散と名づく。\n\n**原文**（翻刻確認）\n虛勞熱嗽有汗者。逍遙散　治肝脾血虛發熱、或潮熱、或自汗盜汗、或頭痛目眩、或怔忡不寧、煩赤口乾、或月經不調、或肚腹作痛、或小腹重墜水道澀痛、或腫痛出膿、内熱作渴。（方後）加牡丹皮、梔子炒、名加味逍遙散。\n\n**現代語訳**（訳：社員案）\n虚労で熱があって咳をし、汗の出るもの。逍遙散は、肝脾の血虚で発熱し、あるいは潮熱し、あるいは自汗・盗汗し、あるいは頭痛・めまいがし、あるいは動悸がして落ち着かず、顔が赤く口が乾き、あるいは月経が整わず、あるいは腹が痛み、あるいは下腹が重く下がる感じがして尿の出が渋って痛み、あるいは腫れて痛み膿が出て、内に熱があって口が渇くものを治す。（方の後に）牡丹皮・山梔子（炒）を加えたものを加味逍遙散と名づける。\n\n### 注記\n- 『万病回春』の条は逍遙散の条で、加味逍遙散は方後の「牡丹皮・梔子（炒）を加え、加味逍遙散と名づく」の一句だけで示される。加味逍遙散だけの条はない（翻刻確認）\n- 『万病回春』の「煩赤口乾」は、『内科摘要』の加味逍遙散の条では「頰赤口乾」（要原本照合）\n- 『万病回春』の「目眩」は、『内科摘要』では「目澀」。『万病回春』の条には『内科摘要』の「晡熱」がない（翻刻確認）\n- 維基文庫の『萬病回春』は簡体字の本で、原文は社員が繁体字に直した。字形（澀／渋など）は要原本照合", "出典": "### 原典の構成\n- 『万病回春』巻之六・虚労：逍遙散（当帰（酒洗）・白芍（酒炒）・白朮（土炒）・白茯苓・柴胡（酒炒） 各1銭、甘草（炙）5分）に牡丹皮・梔子（炒）を加える。加える量の記載はない（翻刻確認）\n\n### 原典の服用法\n- 『万病回春』：1剤に刻み、煨姜1片・薄荷少々を入れて水で煎じて服す（翻刻確認）\n\n### 処方の変遷\n- 原方は逍遙散。逍遙散の出典は『太平恵民和剤局方』巻之九・婦人諸疾（附産図）で、甘草・芍薬・当帰・茯苓・白朮・柴胡を粗末とし、煨生姜・薄荷で煎服する。資料は、『和剤局方』には加味逍遙散は載らず、逍遙散は原書五巻本に登載されるとする（要原本照合）\n- 資料の出典欄には『太平恵民和剤局方』『薛氏医案』『万病回春』が並ぶ。『和剤局方』は原方の逍遙散の出典にあたる\n- 『聖済総録』巻第百五十・婦人血風門には、逍遙飲が2方載る。婦人血風走注の方は柴胡・白茯苓・赤芍薬・白朮・当帰を粗く搗き、生姜・棗・甘草で煎服する。婦人血風身体骨節疼痛の方は白茯苓・柴胡・白朮・当帰・赤芍薬・甘草を粗く搗いて煎服する（要原本照合）\n- 『世医得効方』（危亦林編撰）巻第十五・産科兼婦人雑病科・癲狂には同名の加味逍遙散があり、局方の逍遙散の6味に姜・麦門冬を調理とし、遠志・桃仁・蘇木・紅花を加える（要原本照合）\n- 逍遙散に牡丹皮・山梔子を加えたのは薛己で、『内科摘要』巻下・各症方薬に載る。当帰・芍薬・茯苓・白朮（炒）・柴胡 各1銭、牡丹皮・山梔（炒）・甘草（炙） 各5分の8味を水で煎じて服し、生姜・薄荷が入らない。肝脾の血虚による発熱・潮熱・晡熱、自汗・盗汗、頭痛・目のしぶり、怔忡、頬の赤みと口の乾き、月経不順と腹痛、小腹の重墜と排尿の渋痛、腫痛・出膿、内熱と口渇などの症を治す（翻刻確認）\n- 『女科撮要』附方并注（薛己）の加味逍遙散は、甘草（炙）・当帰（炒）・芍薬（酒炒）・茯苓・白朮（炒）・柴胡 各1銭、牡丹皮・山梔（炒） 各5分の8味を水で煎じて服し、生姜・薄荷が入らない。血虚で熱があり全身がかゆい、口や喉が乾く、発熱・盗汗、食少・嗜臥、小便の渋滞などの症を治す。続けて「逍遙散は前方から丹皮・山梔を去る」とある（翻刻確認）\n- 『保嬰撮要』（薛鎧）脇癰の加味逍遙散は、小児の肝脾血虚・内熱による脇腹痛などの症を治し、方は同書の発熱不止の項に載る（当帰・甘草（炙）・芍薬（酒拌）・茯苓・白朮（炒） 各1銭、柴胡・牡丹皮・山梔（炒） 各7分の8味を4剤に分けて水で煎じて服す）。生姜・薄荷が入らない（翻刻確認）。巻三・天釣内釣の項の方では柴胡が1銭。脇癰の巻は、維基文庫の本では巻十三、資料は巻十一とする（要原本照合）\n- 資料は、『明医雑著』附方の加味逍遙散は「姜水煎服」で生姜はあるが薄荷はないとする（要原本照合）\n- 資料は、『薛氏医案』十六種のうち『保嬰粋要』『保嬰金鏡録』『銭氏小児直訣』『小児痘疹方論』にも加味逍遙散が載るとする（要原本照合）\n- 『万病回春』巻之六・婦人科・虚労の逍遙散は、煨姜・薄荷を入れて煎じ、牡丹皮・梔子を加えて加味逍遙散とする（翻刻確認）。資料は、ここで初めて十味の加味逍遙散が登載されたとする\n- 資料は、張三錫『医学六要』治法彙七巻・婦人門・経水の逍遙散の条に「丹皮・梔子加うるは更に佳し」とあるとする（要原本照合）\n- 現行エキス剤（ツムラ24）は 柴胡・芍薬・蒼朮・当帰・茯苓・山梔子・牡丹皮・甘草・生姜・薄荷 の10味で、朮は蒼朮（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "柴胡・芍薬・蒼朮・当帰・茯苓・山梔子・牡丹皮・甘草・生姜・薄荷", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "桂枝茯苓丸", "名前": "桂枝茯苓丸", "読み": "けいしぶくりょうがん", "ツムラ番号": "25", "出典": "金匱要略（婦人妊娠病脈証并治第二十）", "別名": "", "本文": {"条文": "### 『金匱要略』婦人妊娠病脈証并治第二十\n\n**書き下し**（読み：社員案）\n婦人宿より癥病有り、経断ちて未だ三月に及ばずして、漏下を得て止まず、胎動きて臍上に在る者は、癥痼の害と為す。妊娠六月にして動く者、前の三月経水利せし時ならば、胎なり。血を下す者、断ちて後の三月は衃なり。血止まざる所以の者は、其の癥去らざるが故なり。当に其の癥を下すべし。桂枝茯苓丸之を主る。\n\n**原文**（翻刻確認）\n婦人宿有癥病、經斷未及三月、而得漏下不止、胎動在臍上者、為癥痼害。妊娠六月動者、前三月經水利時、胎也。下血者、後斷三月衃也。所以血不止者、其癥不去故也、當下其癥、桂枝茯苓丸主之。\n\n**現代語訳**（訳：社員案）\n婦人にもとから癥病（腹中のしこり）があり、月経が止まってまだ3か月にならないのに不正出血が続いて止まらず、胎動が臍より上にあるものは、癥痼（古くからのしこり）の害である。妊娠6か月で胎動するものは、月経が止まる前の3か月の月経が順調であったなら、胎児である。出血するものは、月経が止まった後の3か月のものは衃（凝血）である。出血が止まらないのは、その癥が去らないためである。その癥を下すべきで、桂枝茯苓丸がこれを主治する。\n\n### 注記\n- 「後斷三月衃也」の「衃」は、維基文庫の『金匱要略』・四部叢刊本の2つの翻刻とも「衃」。資料は「不血也」とする（要原本照合）\n- 「胎也」は、四部叢刊本（明嘉靖俞橋刊本の影印）の翻刻では「胎」で「也」の字がない（要原本照合）\n- 四部叢刊本の翻刻は「宿」を異体字（画面のフォントにない字）、「妊娠」を「姙娠」、「為」を「爲」と書く。字体だけの違い（要原本照合）", "出典": "### 原典の構成\n- 『金匱要略』：桂枝、茯苓、牡丹（心を去る）、桃仁（皮・尖を去り、熬る）、芍薬 各等分（翻刻確認）\n\n### 原典の服用法\n- 『金匱要略』：5味を末とし、煉蜜で兎の糞の大きさの丸とする。毎日食前に1丸を服す。効かなければ3丸まで増やす（翻刻確認）\n- 四部叢刊本の翻刻は「煉和丸」で「蜜」の字がない。また「兎屎」と書く（要原本照合）\n\n### 処方の変遷\n- 『婦人大全良方』巻之十二・妊娠誤服毒薬傷動胎気方第十に、同じ方が奪命円の名で載る（要原本照合）\n- 『万病回春』巻之六・産育に、同じ方が催生湯の名で載る。『婦人大全良方』『万病回春』とも、芍薬は赤芍薬、桂枝は桂心または官桂とする（要原本照合）\n- 『松原一閑斎先生古医方則』湯液部の桂枝茯苓湯は、桂枝・茯苓・桃仁・芍薬・大黄で、桂枝茯苓丸料去牡丹皮加大黄にあたる（要原本照合）\n- 『産科発蒙』巻二・妊娠数堕胎第十四の大黄茯苓丸は、大黄・茯苓・桂枝・芍薬・桃仁・牡丹皮で、桂枝茯苓丸加大黄にあたる（要原本照合）\n- 『叢桂亭医事小言』巻之七・叢桂亭蔵方の冒頭の甲字湯は、桂枝茯苓丸に生姜・甘草を加えた方（要原本照合）\n- 現行エキス剤（ツムラ25）は 桂皮・芍薬・桃仁・茯苓・牡丹皮 の5味で各3.0g。原典の5味と同じ生薬を等量で配合する（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "桂皮・芍薬・桃仁・茯苓・牡丹皮", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "桂枝加竜骨牡蛎湯", "名前": "桂枝加竜骨牡蛎湯", "読み": "けいしかりゅうこつぼれいとう", "ツムラ番号": "26", "出典": "金匱要略（血痺虚労病脈証并治第六）", "別名": "", "本文": {"条文": "### 『金匱要略』血痺虚労病脈証并治第六\n\n**書き下し**（読み：社員案）\n夫れ失精家は、少腹弦急し、陰頭寒え、目眩し（一に目眶痛むに作る）、髪落つ。脈極めて虚芤遅なるは、清穀・亡血・失精と為す。脈諸の芤動微緊を得るは、男子は失精し、女子は夢交す。桂枝加竜骨牡蛎湯之を主る。\n\n**原文**（翻刻確認）\n夫失精家少腹弦急，陰頭寒，目眩（一作目眶痛），髮落，脈極虛芤遲，為清穀亡血，失精。脈得諸芤動微緊，男子失精，女子夢交，桂枝加龍骨牡蠣湯主之。\n\n**現代語訳**（訳：社員案）\nそもそも失精（精液が漏れ出る）が常となっている者は、下腹部がひきつって張り、陰茎の先が冷え、目がくらみ（一本では「眼窩が痛む」とする）、髪が抜ける。脈が極めて虚で芤・遅であるものは、清穀（不消化の下痢）・亡血・失精である。脈にもろもろの芤・動・微・緊が現れるものは、男子は失精し、女子は夢で交わる。桂枝加竜骨牡蛎湯がこれを主治する。\n\n### 注記\n- 四部叢刊本（明嘉靖俞橋刊本の影印）の翻刻では、「少腹」が「小腹」、方名が「桂枝龍骨牡蠣湯主之」（「加」の字がない）と書かれる（要原本照合）\n- 「脈極虛芤遲，為清穀亡血，失精。脈得諸芤動微緊」の句の切り方・読み方には諸説がある。書き下しは翻刻（通行本）の句読に従った\n- 「牡蠣」は書き下しでは新字体の「牡蛎」とした", "出典": "### 原典の構成\n- 『金匱要略』血痺虚労病第六：桂枝・芍薬・生姜 各3両、甘草2両、大棗12枚、竜骨・牡蛎 各3両（翻刻確認）\n- 四部叢刊本の翻刻では、竜骨・牡蛎に分量の記載がない（要原本照合）\n\n### 原典の服用法\n- 7味を水7升で煮て3升を取り、3回に分けて温服する（翻刻確認）\n\n### 処方の変遷\n- 桂枝・芍薬・生姜・甘草・大棗の分量は『傷寒論』（宋本）の桂枝湯方（桂枝3両・芍薬3両・甘草2両・生姜3両・大棗12枚）と同じで、これに竜骨・牡蛎各3両を加えた形（翻刻確認）\n- 方名の下の小字注に、『小品』では虚弱で浮熱があり汗が出る者には桂を除いて白薇・附子各3分を加え、これを二加竜骨湯というとある（翻刻確認。四部叢刊本の翻刻は「白薇」を「白㣲」と書く。要原本照合）\n- 『外台秘要方』第十六巻・虚労夢泄精方は、深師の桂心湯（桂心・牡蛎・芍薬・竜骨・甘草・大棗・生姜の7味）を載せ、四条後に小品の竜骨湯（同じく7味）と、桂を除いて白薇・附子を加える二加竜骨湯の記載がある。桂心湯と竜骨湯は薬味の量までは一致しない（要原本照合）\n- 資料は類似処方として、『傷寒論』巻第三・弁太陽病脈証并治中第六の桂枝去芍薬加蜀漆牡蛎竜骨救逆湯（桂枝・甘草・生姜・大棗・牡蛎・蜀漆・竜骨の7味。傷寒で脈浮、火で迫劫して亡陽し、驚狂して臥起不安の者を主る）と、桂枝甘草竜骨牡蛎湯（桂枝・甘草・牡蛎・竜骨の4味。火逆を下し、焼針によって煩躁する者を主る）を挙げる（翻刻確認）\n- 『万病回春』巻之四・汗証の白竜湯は、本方から生姜を除いた処方で、男子の失精・女子の夢交・自汗・盗汗を治すとされる（要原本照合）\n- 現行エキス剤（ツムラ26）は 桂皮4.0・芍薬4.0・大棗4.0・牡蛎3.0・竜骨3.0・甘草2.0・生姜1.5g（1日量7.5g中、乾燥エキス3.25g。PMDA 添付文書 2023年12月改訂 第1版で確認）。原典の桂枝が桂皮となる。添付文書に出典の欄はない", "構成": "桂皮・芍薬・大棗・牡蛎・竜骨・甘草・生姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "麻黄湯", "名前": "麻黄湯", "読み": "まおうとう", "ツムラ番号": "27", "出典": "傷寒論（巻第三・弁太陽病脈証并治中第六）", "別名": "", "本文": {"条文": "### 『傷寒論』巻第三・弁太陽病脈証并治中第六\n\n**書き下し**（読み：社員案）（1条目：頭痛・身疼・無汗而喘）\n\n太陽病、頭痛、発熱、身疼き、腰痛み、骨節疼痛し、悪風し、汗無くして喘する者は、麻黄湯之を主る。\n\n**原文**（翻刻確認）\n\n太陽病，頭痛，發熱，身疼，腰痛，骨節疼痛，惡風，無汗而喘者，麻黃湯主之。\n\n**現代語訳**（訳：社員案）\n\n太陽病で、頭痛と発熱があり、体が痛み、腰が痛み、関節が痛み、風を嫌い、汗が出ずに喘する（息が苦しくぜいぜいする）ものは、麻黄湯が主治する。\n\n**書き下し**（読み：社員案）（2条目：太陽と陽明の合病。1条目の方の後に続く）\n\n太陽と陽明との合病、喘して胸満する者は、下すべからず。麻黄湯に宜し。\n\n**原文**（翻刻確認）\n\n太陽與陽明合病，喘而胸滿者，不可下，宜麻黃湯。\n\n**現代語訳**（訳：社員案）\n\n太陽と陽明の合病で、喘して胸が張って苦しいものは、下してはならない。麻黄湯がよい。\n\n**書き下し**（読み：社員案）（3条目：十日以後で脈但浮。2条目に続く）\n\n太陽病、十日已に去り、脈浮細にして臥すことを嗜む者は、外已に解するなり。設し胸満脇痛する者は、小柴胡湯を与う。脈但浮なる者は、麻黄湯を与う。\n\n**原文**（翻刻確認）\n\n太陽病，十日已去，脈浮細而嗜臥者，外已解也。設胸滿脅痛者，與小柴胡湯。脈但浮者，與麻黃湯。\n\n**現代語訳**（訳：社員案）\n\n太陽病で十日以上たち、脈が浮いて細く、横になりたがるものは、表の病はすでに解けている。もし胸が張って脇が痛むものには、小柴胡湯を与える。脈がただ浮いているだけのものには、麻黄湯を与える。\n\n### 『傷寒論』巻第五・弁陽明病脈証并治第八\n\n**書き下し**（読み：社員案）\n\n陽明病、脈浮、汗無くして喘する者は、汗を発すれば則ち愈ゆ。麻黄湯に宜し。\n\n**原文**（翻刻確認）\n\n陽明病，脈浮，無汗而喘者，發汗則愈，宜麻黃湯。\n\n**現代語訳**（訳：社員案）\n\n陽明病で、脈が浮き、汗が出ずに喘するものは、発汗させれば治る。麻黄湯がよい。\n\n### 『傷寒論』巻第七・弁可発汗病脈証并治第十六\n\n**書き下し**（要原本照合）\n\n**原文**（要原本照合）\n\n**現代語訳**\n\n### 『備急千金要方』巻第九 傷寒上・発汗湯第五（参考）\n\n**書き下し**（読み：社員案）\n\n傷寒、頭及び腰痛み、身体骨節疼き、発熱悪寒し、汗せずして喘するを治する方。\n\n**原文**（翻刻確認）\n\n治傷寒頭及腰痛，身體骨節疼，發熱惡寒，不汗而喘方。\n\n**現代語訳**（訳：社員案）\n\n傷寒で、頭と腰が痛み、体や関節が痛み、発熱して寒けがし、汗が出ずに喘するものを治す方。\n\n### 注記\n- 可発汗篇の条は、維基文庫の宋本『傷寒論』の翻刻では可発汗篇が冒頭の数条しかなく見当たらない。四庫全書本『傷寒論注釈』巻七の可発汗篇も、三陰三陽篇にある条は重ねて載せないと注して、この条を載せない。原文・書き下し・現代語訳は空欄（要原本照合）。資料（論考③）によれば、脈浮緊を風と寒、衛と栄に配し、栄衛ともに病んで骨節煩疼するものは発汗すべきで、麻黄湯がよいとする条\n- 可発汗篇が巻第七にあることは宋本の翻刻の巻の見出しで確認した（翻刻確認）。資料は巻を書かない\n- 3条目の「十日已去」は宋本の翻刻の字（翻刻確認）。資料の書き下しは「十日以って去り」で「以」と読める（要原本照合）\n- 陽明病の条は、宋本の翻刻では頭に「二三五、」の番号が付く。翻刻で付けられた条の番号とみて、本文には採らなかった（要確認）\n- 『傷寒論』1条目は「悪風」、『備急千金要方』は「発熱悪寒」で、資料の著者はこの違いを両条のいちばん大きな差とする（資料の記載）\n- 『備急千金要方』の篇名は、翻刻では巻の題が「第九 傷寒方上」、篇の題が「發汗湯第五」。資料は「巻第九 傷寒上・発汗湯第五」と書く（翻刻確認）\n- 『備急千金要方』は資料の出典欄にないが、資料が出典の条文と並べて挙げ、資料の著者は本方の条文としてはこちらがふさわしいとするので、参考として載せた（要確認）", "出典": "### 原典の構成\n- 『傷寒論』（宋本）：麻黄3両（去節）、桂枝2両（去皮）、甘草1両（炙）、杏仁70個（去皮尖）（翻刻確認）\n- 『備急千金要方』：麻黄3両、桂枝・甘草 各1両、杏仁70枚（喘が甚だしくなければ50枚）（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』（宋本）：4味を水9升で、まず麻黄を煮て2升減らし、上の泡を去る。残りの薬を入れて2升半に煮つめ、滓を去って8合を温服する。衣をかけてわずかに汗ばむ程度の汗をとる。粥をすする必要はない。ほかは桂枝湯の法に従って養生する（翻刻確認）\n- 『備急千金要方』：4味を刻み、水9升で麻黄を煮て2升減らし、泡を去る。残りの薬を入れて2升半に煮つめ、絞って滓を去り、8合を服し、衣をかけて汗をかかせる（翻刻確認。「刻み」に当たる字は翻刻では「咀」の1字で、前の1字が欠ける。要原本照合）\n\n### 処方の変遷\n- 『傷寒論』では、弁太陽病脈証并治中第六の3条のほか、弁陽明病脈証并治第八、弁可発汗病脈証并治第十六などに載る（資料の記載）\n- 『肘後百一方』巻之三・治卒上気咳嗽方第二十三には、卒かに上気して息が鳴り絶えそうなものを治す方の又方として、麻黄湯の4味を散として温服する指示があり、少し前の卒かに乏気して肩で息をするものを治す方の又方にも麻黄湯が指示されるが、いずれも方名はないとされる（要原本照合）\n- 『備急千金要方』巻第二十五 備急・卒死第一には、卒死・気絶を救う還魂湯の名で本方そのものが載るとされる（要原本照合）。『金匱要略』雑療方第二十三の還魂湯は麻黄・杏仁・甘草の3味とされる（要原本照合）\n- 『備急千金要方』巻第五下 少小嬰孺方下・欬嗽第六の麻黄湯は、麻黄・甘草・桂心・五味子・半夏・生姜の同名異方とされる（要原本照合）。資料は、麻黄湯去杏仁加半夏・生姜・五味子で、小青竜湯去細辛・芍薬・乾姜加生姜とする。『小児衛生総微論方』巻第十四の麻黄湯はこれを引いたものとされる（要原本照合）\n- 『備急千金要方』巻第十八 大腸腑・欬嗽第五の麻黄散は、麻黄湯の4味を末とし、気が上る時に臨んで服す頓服の用法とされる（要原本照合）\n- 『外台秘要方』第一巻 傷寒上・深師方の麻黄解肌湯は、麻黄・甘草・杏仁・桂心を煎服する方で、小字注に仲景の麻黄湯・『千金翼』と同じとあるとされる（要原本照合）\n- 『外台秘要方』第二巻 傷寒下・傷寒中風方には、仲景『傷寒論』の麻黄湯が「発熱悪風」の条文で載り、「臣億等」の小字注に、麻黄湯は傷寒を主って中風を主らず、中風には前の桂枝湯を服すべしとあるとされる（要原本照合）\n- 『外台秘要方』第十巻には、深師の麻黄湯（4味に生姜を加えて煎服）と麻黄散（4味を末とし頓服）が載るとされる（要原本照合）\n- 麻黄・杏仁・甘草の3味の方は、『博済方』巻三・欬嗽の華蓋散、『太平恵民和剤局方』巻之二・傷寒 附 中暑の三拗湯、『証治準縄』巻二十三・類方・諸気門・咳嗽の三物湯（生姜で煎服）にも載るが、それぞれ修治法は同じではないとされる（要原本照合）\n- 『太平聖恵方』巻第八・傷寒三陰三陽応用湯散諸方の麻黄湯方は、麻黄・桂枝・杏人・甘草を散として姜棗で煎服する。巻第十・治傷寒中風諸方には麻黄湯方が載り、その7方後に麻黄湯加石膏を姜棗で煎服する方（大青竜湯に当たる）が載るとされる（要原本照合）\n- 『聖済総録』巻第四十八 肺蔵門・肺気喘急の如聖飲は、麻黄湯そのものとされる（要原本照合）\n- 『銭氏小児薬証直訣』巻下と『太平恵民和剤局方』巻之二・傷寒 附 中暑の麻黄湯は、いずれも麻黄・肉桂・甘草・杏仁の4味で、桂枝ではなく肉桂を用いるとされる（要原本照合）\n- 『医学正伝』巻之一・傷寒二の麻黄湯の項では、本方から桂枝・杏仁・甘草を去り細辛・附子を加える方（麻黄附子細辛湯）、桂枝・杏仁を去り甘草を倍にして附子を加える方（麻黄附子甘草湯）、桂枝を去り薏苡仁を加える方（麻杏薏甘湯）が示されるとされる（要原本照合）\n- 現行エキス剤（ツムラ27）は7.5g中、杏仁5.0g・麻黄5.0g・桂皮4.0g・甘草1.5g の4味（PMDA 添付文書 2023年12月改訂 第1版で確認）。原典の「桂枝」は、添付文書では「桂皮」。添付文書に出典の欄はない", "構成": "杏仁・麻黄・桂皮・甘草", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "越婢加朮湯", "名前": "越婢加朮湯", "読み": "えっぴかじゅつとう", "ツムラ番号": "28", "出典": "金匱要略（水気病脈証并治第十四）／金匱要略（中風歴節病脈証并治第五・千金方の引用）", "別名": "", "本文": {"条文": "### 『金匱要略』水気病脈証并治第十四（裏水の条）\n\n**書き下し**（読み：社員案）\n裏水なる者は、一身面目黄腫し、其の脈沈、小便不利す、故に水を病ましむ。仮如し小便自利すれば、此れ津液を亡う、故に渇せしむるなり。越婢加朮湯之を主る。（方は下に見ゆ）\n\n**原文**（翻刻確認）\n裏水者，一身面目黃腫，其脈沉，小便不利，故令病水。假如小便自利，此亡津液，故令渴也。越婢加朮湯主之。（方見下）\n\n**現代語訳**（訳：社員案）\n裏水とは、全身と顔・目が黄色く腫れ、脈は沈で、小便の出が悪いもので、そのために水の病となる。もし小便が自然によく出るなら、それは津液を失っているので、口が渇くようになる。越婢加朮湯がこれを主治する。\n\n### 『金匱要略』水気病脈証并治第十四（裏水の条・2か所目）\n\n**書き下し**（読み：社員案）\n裏水は、越婢加朮湯之を主る。甘草麻黄湯も亦之を主る。\n\n**原文**（翻刻確認）\n裏水，越婢加朮湯主之；甘草麻黃湯亦主之。\n\n**現代語訳**（訳：社員案）\n裏水には越婢加朮湯が主治する。甘草麻黄湯もまたこれを主治する。\n\n### 『金匱要略』中風歴節病脈証并治第五・附方（『千金方』越婢加朮湯）\n\n**書き下し**（読み：社員案）\n肉極にて、熱すれば則ち身体の津脱し、腠理開きて汗大いに泄れ、厲風の気あり、下焦の脚弱きを治す。\n\n**原文**（翻刻確認）\n治肉極，熱則身體津脫，腠理開，汗大泄，厲風氣，下焦腳弱。\n\n**現代語訳**（訳：社員案）\n肉極で、熱があると体の津液が抜け出し、腠理（皮膚のきめ）が開いて汗が大量に漏れ、厲風の気があり、下半身の脚が弱いものを治す。\n\n### 関連条文（越婢湯の条）\n\n**書き下し**（読み：社員案）\n風水、悪風し、一身悉く腫れ、脈浮にして渇せず、続いて自ずから汗出で、大熱無きは、越婢湯之を主る。\n\n**原文**（翻刻確認）\n風水惡風，一身悉腫，脈浮不渴，續自汗出，無大熱，越婢湯主之。（「惡風」は要原本照合）\n\n**現代語訳**（訳：社員案）\n風水で、風を嫌い、全身がことごとく腫れ、脈は浮で口は渇かず、汗が絶えず自然に出て、ひどい熱のないものは、越婢湯が主治する。\n\n### 注記\n- 「朮」は、四部叢刊本（明嘉靖俞橋刊本の影印）の翻刻では「术」と書かれる（要原本照合）\n- 千金方越婢加朮湯の「肉極」は、四部叢刊本の翻刻では「内極」と書かれる（要原本照合）\n- 越婢湯の条の「惡風」は、四部叢刊本の翻刻では「急風」と書かれる（要原本照合）\n- 千金方越婢加朮湯の生姜は、越婢湯本体と一致する3両（四部叢刊本の翻刻）を本文に採った。別の翻刻本では2両（要原本照合）\n- 千金方越婢加朮湯の煎じ方の「先煮麻黃去沫」は、四部叢刊本の翻刻では「去上沫」と書かれる（要原本照合）\n- 「一身面目黃腫」の「黃」は『脈経』では「洪」とされる（要原本照合。資料50頁の引用による）\n- 越婢湯の条は越婢加朮湯の元の方の条として載せた。越婢加朮湯の方はこの条の後ろの越婢湯の方に朮を加えたものとして示される（「出典」を参照）", "出典": "### 原典の構成\n- 『金匱要略』水気病第十四（越婢加朮湯）：越婢湯（麻黄6両、石膏半斤、生姜3両、大棗15枚、甘草2両）に白朮4両を加える（翻刻確認）\n- 『金匱要略』中風歴節病第五・附方（『千金方』越婢加朮湯）：麻黄6両、石膏半斤、生姜3両、甘草2両、白朮4両、大棗15枚（翻刻確認。生姜の異同は条文の注記を参照）\n\n### 原典の服用法\n- 『金匱要略』水気病第十四（越婢湯の方）：5味を水6升で、まず麻黄を煮て上の泡を去り、残りの薬を入れて3升に煮詰め、3回に分けて温服する。悪風する者は附子1枚（炮）を加える。風水には朮4両を加える（古今録験）（翻刻確認）\n- 越婢加朮湯は越婢湯の方の中に白朮4両を加えるとだけあり、別の煎じ方の記載はない（翻刻確認）\n- 『金匱要略』中風歴節病第五・附方（『千金方』越婢加朮湯）：6味を水6升で、まず麻黄を煮て上の泡を去り、残りの薬を入れて3升に煮詰め、3回に分けて温服する。悪風には附子1枚（炮）を加える（翻刻確認）\n\n### 処方の変遷\n- 水気病第十四の越婢加朮湯の条には「方は下に見ゆ」とあり、方は越婢湯の後ろに「越婢湯の中に白朮4両を加える。また脚気の中にも見える」という注で示される（翻刻確認）\n- 越婢湯の方後に、風水には朮4両を加えるという『古今録験』の注がある（翻刻確認）\n- 中風歴節病第五の附方に、『千金方』の越婢加朮湯として同じ6味が肉極の方として載る（翻刻確認）\n- 原典の朮は、越婢加朮湯の方後注と『千金方』の附方では「白朮」、越婢湯の方後の『古今録験』の注では「朮」とだけ書かれる（翻刻確認）\n- 現行エキス剤（ツムラ28）は 石膏・麻黄・蒼朮・大棗・甘草・生姜 の6味で、朮は蒼朮（PMDA 添付文書 2023年12月改訂で確認）", "構成": "石膏・麻黄・蒼朮・大棗・甘草・生姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "麦門冬湯", "名前": "麦門冬湯", "読み": "ばくもんどうとう", "ツムラ番号": "29", "出典": "金匱要略（肺痿肺癰咳嗽上気病脈証并治第七）", "別名": "", "本文": {"条文": "### 『金匱要略』肺痿肺癰咳嗽上気病脈証并治第七\n\n**書き下し**（読み：社員案）\n大逆上気し、咽喉利せず、逆を止め気を下す者は、麦門冬湯之を主る。\n\n**原文**（翻刻確認）\n大逆上氣，咽喉不利，止逆下氣者，麥門冬湯主之。\n\n**現代語訳**（訳：社員案）\n気がひどく上へ突き上げ、のどの通りが悪いもので、その逆を止め気を下すべきものは、麦門冬湯がこれを主治する。\n\n### 注記\n- 条文は維基文庫の『金匱要略』の翻刻と四部叢刊本（明嘉靖俞橋刊本の影印）の翻刻で字が同じ（翻刻確認。句読点の有無のみ）\n- 原典の構成・服用法は、維基文庫の『金匱要略』の翻刻には載っておらず、四部叢刊本の翻刻から取った（要確認）\n- 「棗」は、四部叢刊本の翻刻では異体字（一般的な書体では表示できない字）で書かれる（要原本照合）\n- 「大逆上気」の「大」を「火」の誤りとして「火逆上気」と読む注釈書がある（『医宗金鑑』『金匱要略註解』など。要原本照合）。本文は翻刻の「大」を採った", "出典": "### 原典の構成\n- 『金匱要略』：麦門冬7升、半夏1升、人参2両、甘草2両、粳米3合、大棗12枚（翻刻確認。四部叢刊本）\n\n### 原典の服用法\n- 『金匱要略』：6味を水1斗2升で煮て6升を取り、1升を温服する。日に3回、夜に1回服す（翻刻確認。四部叢刊本）\n\n### 処方の変遷\n- 『備急千金要方』巻第十八・大腸腑・咳嗽第五にも同じ主治の麦門冬湯方があり、麦門冬は汁3升とする（要原本照合）\n- 道蔵本の系統を引く万治二年翻刻本『千金方』巻之五十七・咳嗽第五では、主治の句が「気を下し、逆を止め」を先にした順で書かれ、麦門冬は汁2升とする（要原本照合）\n- 『聖済総録』巻第九十三・骨蒸伝尸門・骨蒸煩渇の麦門冬湯は、骨蒸の口の乾きと渇に用いる方で、麦門冬・甘草・半夏を粗く搗き、生姜・棗・竹葉・粳米を加えて煎服する。『金匱要略』の方から人参を去り竹葉・生姜を加えた構成（要原本照合）\n- 現行エキス剤（ツムラ29）は 麦門冬・粳米・半夏・大棗・甘草・人参 の6味で、原典と同じ生薬（PMDA 添付文書 2023年12月改訂で確認）", "構成": "麦門冬・粳米・半夏・大棗・甘草・人参", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "真武湯", "名前": "真武湯", "読み": "しんぶとう", "ツムラ番号": "30", "出典": "傷寒論（弁太陽病脈証并治中第六・弁少陰病脈証并治第十一）", "別名": "玄武湯", "本文": {"条文": "### 『傷寒論』弁太陽病脈証并治中第六\n\n**書き下し**（読み：社員案）\n太陽病、汗を発し、汗出でて解せず、其の人仍お発熱し、心下悸し、頭眩し、身瞤動し、振振として地に擗たんと欲する者は、真武湯之を主る。\n\n**原文**（翻刻確認）\n太陽病發汗、汗出不解、其人仍發熱、心下悸、頭眩、身瞤動、振振欲擗地者、真武湯主之。\n\n**現代語訳**（訳：社員案）\n太陽病で発汗させ、汗は出たが治らず、その人はなお発熱し、心窩部が動悸し、めまいがし、体がぴくぴくと動き（身瞤動）、ふらふらとして地に倒れ伏しそうになる者は、真武湯がこれを主治する。\n\n### 『傷寒論』弁少陰病脈証并治第十一\n\n**書き下し**（読み：社員案）\n少陰病、二三日已まず、四五日に至り、腹痛し、小便利せず、四肢沈重疼痛し、自ら下利する者は、此れ水気有りと為す。其の人或いは咳し、或いは小便利し、或いは下利し、或いは嘔する者は、真武湯之を主る。\n\n**原文**（翻刻確認）\n少陰病、二三日不已、至四五日、腹痛、小便不利、四肢沉重疼痛、自下利者、此為有水氣。其人或咳、或小便利、或下利、或嘔者、真武湯主之。\n\n**現代語訳**（訳：社員案）\n少陰病で、二、三日たっても治らず、四、五日になって腹が痛み、小便の出が悪く、手足が重だるく痛み、自然に下痢する者は、水気があるためである。その人が、あるいは咳をし、あるいは小便がよく出、あるいは下痢し、あるいは嘔吐する者は、真武湯がこれを主治する。\n\n### 注記\n- 太陽病の条は、宋本の翻刻と『注解傷寒論』の四庫全書本（書名『傷寒論注釋』）巻三で字が同じ（翻刻確認）。ただし『傷寒論注釋』の翻刻は「頭眩」の「眩」が外字のため表示されず、この1字は確かめられない（要原本照合）\n- 『金匱玉函経』では太陽病の条が「發其汗而不解」「頭眩身瞤而動」と書かれる。同書の発汗後の篇の再掲では「其人發熱」「振振欲僻地者、屬真武湯證」と書かれる（要原本照合）。本文は宋本の字を採った\n- 少陰病の条は、『金匱玉函経』では「四肢沉重、疼痛而利」「或小便自利」と書かれる（要原本照合）。本文は宋本の字を採った\n- 資料は「咳」を「欬」と書く。欬／咳は字体の違いで、本文は翻刻の「咳」を採った。沉／沈も字体の違いで、書き下しは「沈」とした\n- 方後の加減の最初の句は、宋本の翻刻では「苦咳者」と書かれる。続く3句がいずれも「若」で始まり、『金匱玉函経』の翻刻と資料の書き下しが「若咳者」（若し欬する者）であるため、原典の服用法は「若咳者」の読みにした（要原本照合）\n- 『金匱玉函経』の方では、附子は「一枚、炮」だけで「去皮、破八片」がない（翻刻確認）。加減の最後の句は「足前成半斤」と書かれる（要原本照合）", "出典": "### 原典の構成\n- 『傷寒論』：茯苓・芍薬・生姜（切る）各3両、白朮2両、附子1枚（炮じ、皮を去り、8片に破る）（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』：5味を水8升で煮て3升を取り、滓を去り、7合を温服する。日に3回服す（翻刻確認）\n- 方後の加減（弁少陰病脈証并治第十一）：咳する者は五味子半升、細辛・乾姜各1両を加える。小便利する者は茯苓を去る。下利する者は芍薬を去り、乾姜2両を加える。嘔する者は附子を去り、生姜を加えて前と合わせて半斤とする（翻刻確認。最初の句の字は条文の注記を参照）\n\n### 処方の変遷\n- 資料によれば古名は玄武湯で、宋の時代に宣祖の諱を避けて玄武を真武に改めたという（要確認）\n- 『千金翼方』巻第十・傷寒下・少陰病状第二は玄武湯の名で少陰病の条を載せ、薬味は原典と同じ。条の中の「或いは小便利し」が「或いは小便利せず」となり、条の後ろに「利止まず、便膿血の者は桃花湯に宜し」が続く（要原本照合）\n- 『太平聖恵方』巻第八・傷寒三陰三陽応用湯散諸方の玄武湯方は、赤茯苓・赤芍薬・附子・白朮を散とし、姜・棗を入れて煎服する。同書巻第九・治傷寒三日候諸方の赤茯苓散は、赤茯苓・赤芍薬・白朮・附子・乾姜を散とし、姜を入れて煎じ、傷寒3日で腹痛し小便利せずして嘔する者に用いる（要原本照合）\n- 『医塁元戎』巻九・少陰証は仲景真武湯の5味を載せた後に易簡真武湯（茯苓・芍薬・熟附・白朮を㕮咀して姜煎）を挙げ、虚労の人が発熱して自利し、時に増寒するものにも宜しいとして固真湯と名づける（要原本照合）\n- 現行エキス剤（ツムラ30）は 茯苓4.0・芍薬3.0・蒼朮3.0・生姜1.5・ブシ末0.5g（7.5g中。PMDA 添付文書 2023年12月改訂 第1版で確認）。原典の白朮が蒼朮になっている", "構成": "茯苓・芍薬・蒼朮・生姜・附子（ブシ末）", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "呉茱萸湯", "名前": "呉茱萸湯", "読み": "ごしゅゆとう", "ツムラ番号": "31", "出典": "傷寒論（弁陽明病脈証并治第八・弁少陰病脈証并治第十一・弁厥陰病脈証并治第十二）、金匱要略（嘔吐噦下利病脈証治第十七）、傷寒活人書（巻第十五）", "別名": "茱萸湯", "本文": {"条文": "### 『傷寒論』弁陽明病脈証并治第八\n\n**書き下し**（読み：社員案）\n穀を食して嘔せんと欲するは、陽明に属するなり。呉茱萸湯之を主る。湯を得て反って劇しき者は、上焦に属するなり。\n\n**原文**（翻刻確認）\n食穀欲嘔、屬陽明也、吳茱萸湯主之。得湯反劇者、屬上焦也。\n\n**現代語訳**（訳：社員案）\n穀物を食べると吐きそうになるのは、陽明に属する。呉茱萸湯がこれを主治する。湯（呉茱萸湯）を飲んでかえって激しくなる者は、上焦に属する。\n\n### 『傷寒論』弁少陰病脈証并治第十一\n\n**書き下し**（読み：社員案）\n少陰病、吐利し、手足逆冷し、煩躁して死せんと欲する者は、呉茱萸湯之を主る。\n\n**原文**（翻刻確認）\n少陰病、吐利、手足逆冷、煩躁欲死者、吳茱萸湯主之。\n\n**現代語訳**（訳：社員案）\n少陰病で、吐いて下痢し、手足が冷え切り、もだえ苦しんで死にそうなほどの者は、呉茱萸湯がこれを主治する。\n\n### 『傷寒論』弁厥陰病脈証并治第十二\n\n**書き下し**（読み：社員案）\n乾嘔し、涎沫を吐し、頭痛する者は、呉茱萸湯之を主る。\n\n**原文**（翻刻確認）\n乾嘔、吐涎沫、頭痛者、吳茱萸湯主之。\n\n**現代語訳**（訳：社員案）\n物を吐かずにえずき、よだれや泡状のつばを吐き、頭痛する者は、呉茱萸湯がこれを主治する。\n\n### 『金匱要略』嘔吐噦下利病脈証治第十七\n\n**書き下し**（読み：社員案）\n嘔して胸満する者は、茱萸湯之を主る。\n乾嘔し、涎沫を吐し、頭痛する者は、茱萸湯之を主る。\n\n**原文**（翻刻確認）\n嘔而胸滿者、茱萸湯主之。\n乾嘔、吐涎沫、頭痛者、茱萸湯主之。（方見上）\n\n**現代語訳**（訳：社員案）\n嘔吐して胸が張って苦しい者は、茱萸湯がこれを主治する。\n物を吐かずにえずき、よだれや泡状のつばを吐き、頭痛する者は、茱萸湯がこれを主治する（処方は前の条に見える）。\n\n### 『傷寒活人書』巻第十五\n\n**書き下し**（読み：社員案）\n呉茱萸湯　穀を食して嘔せんと欲するは、陽明に属するなり。呉茱萸湯之を主る。湯を得て反って劇しき者は、上焦に属するなり（陽明に属す）。少陰病、吐利し、手足逆冷し、煩躁して死せんと欲する者、……\n\n**原文**（要原本照合）\n吳茱萸湯　食穀欲嘔、屬陽明也、吳茱萸湯主之。得湯反劇者、屬上焦也（屬陽明）。少陰病、吐利、手足逆冷、煩躁欲死者、……\n\n**現代語訳**（訳：社員案）\n呉茱萸湯。穀物を食べると吐きそうになるのは、陽明に属する。呉茱萸湯がこれを主治する。湯を飲んでかえって激しくなる者は、上焦に属する（陽明に属す）。少陰病で、吐いて下痢し、手足が冷え切り、もだえ苦しんで死にそうなほどの者は、……（翻刻はここで切れている）\n\n### 注記\n- 『金匱要略』では方名を「茱萸湯」とする（翻刻確認）。乾嘔・吐涎沫・頭痛の条は、『傷寒論』弁厥陰病篇の条と方名だけが違う\n- 陽明病篇の条は、『注解傷寒論』の四庫全書本（書名『傷寒論注釋』）巻五・『金匱玉函経』では「食穀欲嘔者」と「者」がある（要原本照合）。『金匱玉函経』は「属陽明」の後の「也」と、「属上焦」の後の「也」がない（要原本照合）。本文は宋本の字を採った\n- 少陰病篇の条は、『金匱玉函経』では「而手足逆冷」と「而」がある（要原本照合）\n- 厥陰病篇の条は、『金匱玉函経』では「乾嘔吐涎沫、而復頭痛」と書かれる（要原本照合）\n- 『金匱要略』の乾嘔の条は、『金匱要略論註』の四庫全書本では「涎沬」と書かれる（要原本照合）\n- 維基文庫の『金匱要略』の翻刻には茱萸湯の方（構成・服用法）が載っていない。原典の構成・服用法は『金匱要略論註』の四庫全書本の本文による\n- 『傷寒活人書』の翻刻（維基文庫『傷寒類證活人書』）は「未校訂」の表示がある簡体字の本で、原文は繁体字にそろえて書いた。字形の判断には使えない（要原本照合）\n- 『傷寒活人書』の条は、翻刻では少陰病の句が「煩躁欲死者，」で切れ、次の行に「吴茱萸」の3字だけがあって構成の行に続く。少陰病の句の結び（方名と「主之」、小字の注）は翻刻では確かめられない。資料の引用では、少陰病の条の後に小字で「少陰に属す」の注がある（要原本照合）\n- 『傷寒活人書』の方は人参・呉茱萸の2味を本体とし、方後で生姜・大棗を入れて煎じる。生姜・大棗の有無は構成の違いに数えない（取りまとめ側の基準）ので、同構成として条文の欄に置いた\n- 条文の順：3書とも現行エキス剤と同じ構成で、構成一致の出典が複数あるため基準では順が決まらない。『傷寒論』『金匱要略』『傷寒活人書』の順にした（要確認）", "出典": "### 原典の構成\n- 『傷寒論』：呉茱萸1升（洗）、人参3両、生姜6両（切）、大棗12枚（擘）（翻刻確認）\n- 『金匱要略』：呉茱萸1升、人参3両、生姜6両、大棗12枚（翻刻確認。『金匱要略論註』の四庫全書本の本文による）\n- 『傷寒活人書』：人参1両（芦を去る）、呉茱萸1両6銭5分（湯で3遍洗う）。煎じるときに生姜4片・棗1枚を入れる（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』：4味を水7升で煮て2升を取り、滓を去り、7合を温服する。日に3回服す（翻刻確認）\n- 『金匱要略』：4味を水5升で煮て3升を取り、7合を温服する。日に3回服す（翻刻確認。『金匱要略論註』の四庫全書本の本文による）\n- 『傷寒活人書』：麻豆の大きさに剉み、1回4銭に生姜4片・棗1枚を入れ、水2盞半で8分まで煎じ、滓を去って2回に分けて服す（翻刻確認）\n\n### 処方の変遷\n- 『金匱要略』では方名を茱萸湯とする（翻刻確認）\n- 『肘後百一方』巻之四・治卒胃反嘔啘方第三十に、食後に酸っぱいものがこみ上げて胸が苦しいものを治す方として呉茱萸湯が挙がるとされる（要原本照合）\n- 『太平聖恵方』巻第十二・治傷寒厥逆諸方では、傷寒で手足が厥逆し、涎沫を嘔吐して頭痛するものに呉茱萸・人参を散とし、生姜・棗を入れて煎服する方が載り、方名は付かないとされる。同じ門の7つ前の呉茱萸湯方は、傷寒の吐利・手足逆冷・心煩悶絶に呉茱萸・棗・甘草・生姜・人参・厚朴を用いる（甘草・厚朴が加わる）とされる（要原本照合）\n- 『傷寒活人書』巻第十五では、人参・呉茱萸を姜棗で煎服する（条文の欄に載せた。翻刻確認）\n- 『太医院経験奇効良方大全』（董宿輯録・方賢続補）巻之二十・霍乱門には、同名の呉茱萸湯が2方載るとされる。1つは呉茱萸・木瓜・食塩を炒り焦がして煎服する霍乱吐瀉の方、もう1つは呉茱萸・当帰・桂心・芍薬・細辛・木通・甘草を生姜・紅棗で煎服する方（要原本照合）\n- 『医学正伝』巻之四・頭痛門では、厥陰の頭項強痛・痰沫を吐す・厥冷して脈浮緩のものに、呉茱萸・生姜・人参を棗で煎ずるとされる（要原本照合）\n- 『扶寿精方』傷寒では、少陰の頭疼・吐利の後、手足厥冷・煩躁して死せんと欲し、嘔して胸満するものに呉茱萸・生姜・人参を棗で煎ずるとされる（要原本照合）\n- 『医方考』（呉崑）巻之五・七疝門には、本方に附子を加えた呉茱萸加附子湯が載るとされる（要原本照合）\n- 現行エキス剤（ツムラ31）は 大棗・呉茱萸・人参・生姜 の4味で、原典と同じ構成（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "大棗・呉茱萸・人参・生姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "人参湯", "名前": "人参湯", "読み": "にんじんとう", "ツムラ番号": "32", "出典": "金匱要略（胸痺心痛短気病脈証并治第九）", "別名": "", "本文": {"条文": "### 『金匱要略』胸痺心痛短気病脈証并治第九\n\n**書き下し**（読み：社員案）\n胸痹、心中痞し、留気結ぼれて胸に在り、胸満ち、脅下より逆して心を搶くは、枳実薤白桂枝湯之を主る。人参湯も亦之を主る。\n\n**原文**（翻刻確認）\n胸痹心中痞，留氣結在胸，胸滿，脅下逆搶心，枳實薤白桂枝湯主之；人參湯亦主之。\n\n**現代語訳**（訳：社員案）\n胸痹で、胸の中がつかえ、とどこおった気が胸に結ぼれ、胸が張り、脇の下から気が逆上して心（胸）を突き上げるものは、枳実薤白桂枝湯がこれを主治する。人参湯もまたこれを主治する。\n\n### 注記\n- 『傷寒論』の同じ4味の方は方名が「理中丸」（方後に湯法として理中湯）なので、条文の欄には置かず処方の変遷に書いた（翻刻確認）\n- 原文は維基文庫の『金匱要略』の翻刻による。この翻刻には「留氣結在胸」の後に後から書き込まれた注（「宜作胸痹心中痞氣，氣結在胸」の旨）が混ざっており、本文には採らなかった\n- 四部叢刊本（明嘉靖俞橋刊本の影印）の翻刻では「搶」が「槍」と書かれ、資料の書き下しも「心を槍く」とする（要原本照合）\n- 同じ条の四部叢刊本の翻刻は「痹」を「痺」、「胸滿」を「𦚾滿」、「脅」を「脇」と書く。字体だけの違い（要原本照合）\n- 資料は篇名を「胸痺心痛短気病脉証治第九」とする。四部叢刊本の翻刻も「胸痺心痛短氣病脉證治第九」で、維基文庫の『金匱要略』の翻刻は「胸痹心痛短氣病脈證並治第九」。篇名は後者に従った（翻刻確認）\n- 原典の構成・服用法は、維基文庫の『金匱要略』の翻刻には人参湯方が載っていないため、四部叢刊本の翻刻から取った", "出典": "### 原典の構成\n- 『金匱要略』（四部叢刊本）人参湯：人参・甘草・乾姜・白朮 各3両。甘草に「炙」の注はない（翻刻確認）\n\n### 原典の服用法\n- 『金匱要略』（四部叢刊本）：4味を水8升で煮て3升を取り、1升を温服する。日に3回服す（翻刻確認）\n\n### 処方の変遷\n- 『傷寒論』巻第七・弁霍乱病脈証并治第十三には、同じ4味（人参・乾姜・甘草（炙）・白朮 各3両）の方が理中丸の名で載る。霍乱で頭痛・発熱し身疼痛して、熱が多く水を飲みたがるものは五苓散、寒が多く水を用いないものは理中丸が主る、とする。蜜で鶏卵の黄身ほどの丸とするのを本とし、方後に湯法（水8升で煮て3升を取り、1升を日に3回温服する。いわゆる理中湯）と、臍上の動悸・吐・下痢・悸・渇・腹痛・寒・腹満に応じた加減法を記す（翻刻確認）\n- 同書巻第七・弁陰陽易差後労復病脈証并治第十四には、大病が治った後にしきりに唾が出て久しくすっきりせず、胸上に寒があるものは丸薬で温めるべきで理中丸がよい、とある。巻第四・弁太陽病脈証并治下第七には、下痢に理中を与えてかえって甚だしくなった誤治の例（理中は中焦を理めるが、この下痢は下焦にあるので赤石脂禹余糧湯が主る）がある（翻刻確認）\n- 『肘後百一方』巻之二・治卒霍乱諸急方第十二の崔氏理中丸方は、甘草3両・乾姜・人参・白朮各1両を蜜丸として服す。続く四順湯（乾姜・甘草・人参・附子 各2両）は、『傷寒論』の加減法の「腹満するものは朮を去り附子1枚を加える」を四順湯と名づけたものとされる（要原本照合）\n- 『備急千金要方』巻第三・婦人方中・虚損第一の四順理中丸方は、甘草2両・人参・白朮・乾姜各1両を蜜丸とする（要原本照合）\n- 『備急千金要方』巻第二十・膀胱腑・霍乱第六の治中湯は、人参・乾姜・白朮・甘草 各3両を㕮咀して煎服し、霍乱で吐下し、脹満して食が消えず、心腹が痛むものを主る（要原本照合）\n- 『備急千金要方』巻第二十四・解毒并雑治・解五石毒第三の理中湯方は、人参・甘草・白朮 各3両・乾姜2両を㕮咀して煎服する（要原本照合）\n- 『外台秘要方』巻第六・霍乱及嘔吐の霍乱吐痢方に崔氏理中丸、同巻の霍乱臍上築方に理中湯去朮加桂と理中湯方が載る。両方の用量は、前者の乾姜と後者の人参が各2両のほかは全て3両で、前者の乾姜は3両とする記載もあるとされる（要原本照合）\n- 『旅舎備要方』霍乱の丸方は、人参・白朮・乾姜・甘草（炙）各1両（要原本照合）\n- 『小児薬証直訣』巻下の調中湯は、人参（去蘆）・白朮・乾姜（炮）各3両・甘草（炙）減半を細末として円とし、食前に温水で服す（要原本照合）\n- 『閻氏小児方論』治小児吐瀉の理中円は、人参（去蘆）・白朮・乾姜（炮）・甘草（炙）各1両を蜜丸とする（要原本照合）\n- 『薛氏医案』巻四・女科撮要・附方并註の人参理中湯は、人参・白朮・乾姜・甘草を姜棗で煎服する（要原本照合）\n- 『寿世保元』乙集巻之二・中寒の理中湯は生姜・大棗を方後の調理として加え、『万病回春』は原典どおりの4味とされる（要原本照合）\n- 『金匱要略浅註』胸痺心痛短気病脈証并治第九は、人参湯方として桂枝人参湯を載せるとされる（要原本照合）\n- 現行エキス剤（ツムラ32）は 乾姜・甘草・蒼朮・人参 の4味で、1日量7.5g中 カンキョウ3.0・カンゾウ3.0・ソウジュツ3.0・ニンジン3.0（g）の混合生薬の乾燥エキス2.5gを含む（PMDA 添付文書 2023年12月改訂 第1版で確認）。原典の白朮は蒼朮になっている", "構成": "乾姜・甘草・蒼朮・人参", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "大黄牡丹皮湯", "名前": "大黄牡丹皮湯", "読み": "だいおうぼたんぴとう", "ツムラ番号": "33", "出典": "金匱要略（瘡癰腸癰浸淫病脈証并治第十八）", "別名": "大黄牡丹湯", "本文": {"条文": "### 『金匱要略』瘡癰腸癰浸淫病脈証并治第十八\n\n**書き下し**（読み：社員案）\n腸癰の者は、少腹腫痞し、之を按ずれば即ち痛むこと淋の如く、小便自ら調い、時時発熱し、自汗出でて、復た悪寒す。其の脈遅緊の者は、膿未だ成らず、之を下すべし、当に血有るべし。脈洪数の者は、膿已に成る、下すべからざるなり。大黄牡丹湯之を主る。\n\n**原文**（翻刻確認）\n腸癰者、少腹腫痞、按之即痛如淋、小便自調、時時發熱、自汗出、復惡寒。其脈遲緊者、膿未成、可下之、當有血。脈洪數者、膿已成、不可下也、大黃牡丹湯主之。\n\n**現代語訳**（訳：社員案）\n腸癰（腸の癰）の病人は、下腹部が腫れてつかえ、押すとすぐに淋（排尿痛のある病）のように痛むが、小便はふつうに出る。ときどき発熱し、自然に汗が出て、また悪寒がする。脈が遅く緊であるものは、膿がまだできていないので下してよく、血が下るはずである。脈が洪数であるものは、膿がすでにできているので下してはならない。大黄牡丹湯がこれを主治する。\n\n### 注記\n- 原典の方名は「大黄牡丹湯」。現行エキス剤の名は大黄牡丹皮湯\n- 四部叢刊本（明嘉靖俞橋刊本の影印）の翻刻は「少腹」を「小腹」とする（要原本照合）\n- 四部叢刊本の翻刻は「熱」「緊」を異体字（𤍠・𦂳）で書き、「已」を「巳」と刻す。字体だけの違い（要原本照合）\n- 「按之即痛如淋、小便自調」は、維基文庫の翻刻の句読では「按之即痛如淋」で切れる。資料は「之を按ずれば即痛む。淋の如けれども小便自ずから調う」と、「即痛」で切って読む（要原本照合）", "出典": "### 原典の構成\n- 『金匱要略』：大黄4両、牡丹1両、桃仁50箇、瓜子半升、芒消3合（翻刻確認）\n- 資料は桃仁を「五十枚」とする。翻刻2本はいずれも「五十箇」（要原本照合）\n\n### 原典の服用法\n- 『金匱要略』：5味を水6升で煮て1升を取り、滓を去り、芒消を入れて再び煎じて沸かし、頓服する。膿があれば下る。続く句は翻刻では「如先膿、當下血」（翻刻確認）\n- 「如先膿」を、資料は「如し膿無くんば当に血を下すべし」と、「先」を「無」にあたる字として読む（要原本照合）\n- 四部叢刊本の翻刻は「再煎沸」を「丹煎沸」とする（要原本照合）\n- 服用回数の指定はない（頓服）\n\n### 処方の変遷\n- 『備急千金要方』巻第二十三・痔漏・腸癰第二に、腸癰を治す大黄牡丹湯方として、大黄4両・牡丹3両・桃人50枚・瓜子1升・芒消2両が載り、方後に膿血が下るとある。小字双行で、刪繁方は芒硝半合・瓜子5合を用い、劉涓子は消石3合を用いるとし、肘後は瓜子湯と名づけるとある（要原本照合）\n- 『劉涓子鬼遺方』巻第三に、腸癰を治す大黄湯として、大黄2両・牡丹3両・芥子半升・硝石3合・桃仁50枚が載る（要原本照合）\n- 『外科正宗』巻之三・腸癰論第三十三・腸癰主治方の大黄湯は、『劉涓子鬼遺方』の大黄湯と同じ薬味で、硝石に代えて朴硝とする。同書の腸癰主治方に大黄牡丹皮湯は載らない（要原本照合）\n- 現行エキス剤（ツムラ33）は 冬瓜子6.0・桃仁4.0・牡丹皮4.0・大黄2.0・無水芒硝1.8g の5味（PMDA 添付文書 2023年12月改訂 第1版で確認）。原典の瓜子・芒消は、資料の組成では冬瓜子・芒硝と書かれる（要確認）\n- 資料は、芒硝・消石・朴消は古くから非常に混乱しているとする（要原本照合）", "構成": "冬瓜子・桃仁・牡丹皮・大黄・無水芒硝", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "白虎加人参湯", "名前": "白虎加人参湯", "読み": "びゃっこかにんじんとう", "ツムラ番号": "34", "出典": "傷寒論（弁太陽病脈証并治上第五・弁太陽病脈証并治下第七・弁陽明病脈証并治第八）／金匱要略（痙湿暍病脈証并治第二・消渇小便不利淋病脈証并治第十三）", "別名": "", "本文": {"条文": "### 『傷寒論』弁太陽病脈証并治上第五\n\n**書き下し**（読み：社員案）\n桂枝湯を服し、大いに汗出でて後、大いに煩渇して解せず、脈洪大なる者は、白虎加人参湯之を主る。\n\n**原文**（翻刻確認）\n服桂枝湯、大汗出後、大煩渴不解、脈洪大者、白虎加人參湯主之。\n\n**現代語訳**（訳：社員案）\n桂枝湯を服用して大いに汗が出た後、ひどく口が渇いて煩わしさが治まらず、脈が洪大の者は、白虎加人参湯がこれを主治する。\n\n### 『傷寒論』弁太陽病脈証并治下第七\n\n**書き下し**（読み：社員案）\n傷寒、若しくは吐し若しくは下して後、七八日解せず、熱結んで裏に在り、表裏倶に熱し、時時悪風し、大いに渇し、舌上乾燥して煩し、水数升を飲まんと欲する者は、白虎加人参湯之を主る。\n傷寒、大熱無く、口燥渇し、心煩し、背微しく悪寒する者は、白虎加人参湯之を主る。\n傷寒、脈浮、発熱して汗無く、其の表解せざるは、白虎湯を与うべからず。渇して水を飲まんと欲し、表証無き者は、白虎加人参湯之を主る。\n\n**原文**（翻刻確認）\n傷寒若吐若下後、七八日不解、熱結在裏、表裏俱熱、時時惡風、大渴、舌上乾燥而煩、欲飲水數升者、白虎加人參湯主之。\n傷寒無大熱、口燥渴、心煩、背微惡寒者、白虎加人參湯主之。\n傷寒、脈浮、發熱無汗、其表不解、不可與白虎湯。渴欲飲水、無表證者、白虎加人參湯主之。\n\n**現代語訳**（訳：社員案）\n傷寒で、吐かせたり下したりした後、七八日たっても治らず、熱が結ぼれて裏にあり、表も裏もともに熱し、時々風を嫌がり、ひどく口が渇き、舌の上が乾いて煩わしく、水を数升も飲みたがる者は、白虎加人参湯がこれを主治する。\n傷寒で、体表にひどい熱はなく、口が乾いて渇き、胸苦しく煩わしく、背中がわずかに寒けを感じる者は、白虎加人参湯がこれを主治する。\n傷寒で、脈が浮き、発熱して汗がなく、表証がまだ解けていないものには、白虎湯を与えてはならない。口が渇いて水を飲みたがり、表証がない者は、白虎加人参湯がこれを主治する。\n\n### 『傷寒論』弁陽明病脈証并治第八\n\n**書き下し**（読み：社員案）\n若し渇して水を飲まんと欲し、口乾き舌燥く者は、白虎加人参湯之を主る。\n\n**原文**（翻刻確認）\n若渴欲飲水、口乾舌燥者、白虎加人參湯主之。\n\n**現代語訳**（訳：社員案）\nもし口が渇いて水を飲みたがり、口が乾いて舌が乾燥する者は、白虎加人参湯がこれを主治する。\n\n### 『金匱要略』痙湿暍病脈証并治第二\n\n**書き下し**（読み：社員案）\n太陽の中熱は、暍是れなり。汗出でて悪寒し、身熱して渇するは、白虎加人参湯之を主る。\n\n**原文**（翻刻確認）\n太陽中熱者、暍是也。汗出惡寒、身熱而渴、白虎加人參湯主之。\n\n**現代語訳**（訳：社員案）\n太陽の中熱とは、暍（暑さによる病）のことである。汗が出て寒けがし、体が熱して口が渇くものは、白虎加人参湯がこれを主治する。\n\n### 『金匱要略』消渇小便不利淋病脈証并治第十三\n\n**書き下し**（読み：社員案）\n渇して水を飲まんと欲し、口乾き舌燥く者は、白虎加人参湯之を主る。（方は中暍の中に見ゆ）\n\n**原文**（翻刻確認）\n渴欲飲水、口乾舌燥者、白虎加人參湯主之。（方見中暍中。）\n\n**現代語訳**（訳：社員案）\n口が渇いて水を飲みたがり、口が乾いて舌が乾燥する者は、白虎加人参湯がこれを主治する（処方は中暍の条に見える）。\n\n### 注記\n- 『金匱要略』痙湿暍病篇の条は、宋本『傷寒論』の弁痙湿暍脈証第四にも同じ文で載る（翻刻確認）。『注解傷寒論』の四庫全書本（書名『傷寒論注釋』）巻二では「其人汗出惡寒身熱而渴也」と書かれ、白虎加人参湯の名は注の中にだけ出る（要原本照合）\n- 太陽病上篇の条は、『金匱玉函経』では「若脈洪大者」と「若」がある（要原本照合）\n- 太陽病下篇の最初の条は、『注解傷寒論』の四庫全書本 巻四では「傷寒病若吐若下後」と「病」がある（要原本照合）。『金匱玉函経』は「裏」を「裡」と書く（要原本照合）\n- 太陽病下篇の2番目の条は、『金匱玉函経』では「口燥渴而煩、其背微惡寒者」と書かれる（要原本照合）\n- 太陽病下篇の3番目の条は、『注解傷寒論』の四庫全書本 巻四・『金匱玉函経』では「其表不解者」と「者」がある（要原本照合）。『金匱玉函経』は末尾を「白虎湯主之」とする（要原本照合）\n- 『傷寒論』の服用法は、宋本の翻刻（太陽病上篇の方）では「日二服」で、本文はこれを採った。『金匱要略』『金匱玉函経』の白虎加人参湯方と、宋本『傷寒論』の白虎湯方は「日三服」（要原本照合）\n- 甘草の「炙」と石膏の「綿裹」は宋本『傷寒論』の方にあり、『金匱要略』の翻刻の方にはない（翻刻確認）。『金匱玉函経』の方は人参・石膏・知母・甘草・粳米の順で、炙・碎の注がない（翻刻確認）\n- 資料は、太陽病下篇の最初の条の方後に、立夏の後・立秋の前に服すべきで立秋の後は服すべからず、正月・二月・三月や諸々の亡血虚家には与えるべからず、とする注意があるとする（要原本照合）。維基文庫の宋本の翻刻では、この条の後に方・方後の文がなく確かめられない。『金匱玉函経』には別の条として「凡用白虎湯，立夏後至立秋前得用之，立秋後不可服也」「春三月病常苦裡冷，白虎湯亦不可與，與之則嘔利而腹痛」「諸亡血虛家，亦不可與白虎湯，得之腹痛而利者，急當溫之」がある（翻刻確認）", "出典": "### 原典の構成\n- 『傷寒論』：知母6両、石膏1斤（砕き、綿で包む）、甘草（炙）2両、粳米6合、人参3両（翻刻確認）\n- 『金匱要略』：知母6両、石膏1斤（砕く）、甘草2両、粳米6合、人参3両（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』：5味を水1斗で煮て、米が煮えて湯ができたら滓を去り、1升を温服する。日に2回服す（翻刻確認）\n- 『金匱要略』：5味を水1斗で煮て、米が煮えて湯ができたら滓を去り、1升を温服する。日に3回服す（翻刻確認）\n\n### 処方の変遷\n- 白虎湯（知母・石膏・甘草・粳米）に人参3両を加えた方。宋本『傷寒論』の後の巻には「於白虎湯方內，加人參三兩，餘依白虎湯法」とも書かれる（翻刻確認）\n- 資料は、『金匱要略』には白虎人参湯の方名でも収載されているとする（要原本照合。維基文庫の『金匱要略』の翻刻では2条とも白虎加人參湯）\n- 『備急千金要方』巻第九・発汗吐下後第九には、『傷寒論』太陽病下篇・陽明病篇の4条がほぼ同文で載るが、「白虎加人参湯之を主る」がすべて「白虎湯に宜し」に改められているとされる（要原本照合）\n- 『太平聖恵方』巻第九・治傷寒七日候諸方の知母散は白虎加人参湯に葛根を加えた方、巻第十・治傷寒煩渇諸方の人参散は人参・知母・甘草・石膏を散とし生姜で煎服、石膏湯方は石膏・知母・地骨皮・甘草・人参を散とし粳米を入れて煎服、巻第十一・治陽毒傷寒諸方の白虎湯は人参を含まないとされる（要原本照合）\n- 『傷寒活人書』巻第十八の化班湯は、人参・石膏・萎蕤・知母・甘草に糯米を入れて煎ずるとされる（要原本照合）\n- 『小児衛生総微論方』巻第八・瘡疹論の白虎化斑湯は、瘡疹が赤黒く出切らず、毒が盛んで煩躁するものに白虎加人参湯を指示するとされる（要原本照合）\n- 『素問病機気宜保命集』巻下・消渇論第二十三の人参石膏湯は、膈消で上焦が煩渇するものに人参・石膏・知母・甘草を用いるとされる（要原本照合）\n- 『丹渓心法』巻二・斑疹七では、本方が化癍湯の名で収載されているとされる（要原本照合）\n- 『医方考』巻之一・暑門の人参白虎湯（人参・石膏・知母・甘草）、巻之二・癍疹門の化癍湯（石膏・人参・知母・甘草）、『医学六要』治法彙四巻・暑門の人参白虎湯（人参・知母・石膏・甘草に粳米一撮）、古林見宜『医療選方』五巻・痘疹の化斑湯（石膏・知母・人参・甘草）がある、とされる（要原本照合）\n- 現行エキス剤（ツムラ34）は 石膏・粳米・知母・甘草・人参 の5味で、原典と同じ構成（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "石膏・粳米・知母・甘草・人参", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "四逆散", "名前": "四逆散", "読み": "しぎゃくさん", "ツムラ番号": "35", "出典": "傷寒論（弁少陰病脈証并治第十一）／金匱玉函経（巻第四・弁少陰病形証治第八／巻第八・方薬炮製）", "別名": "", "本文": {"条文": "### 『傷寒論』弁少陰病脈証并治第十一\n\n**書き下し**（読み：社員案）\n少陰病、四逆し、其の人或いは咳し、或いは

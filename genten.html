更吐也；面色反有熱色者，未欲解也，以其不能得小汗出，身必癢，宜桂枝麻黃各半湯。\n\n**現代語訳**（訳：社員案）\n太陽病にかかって八、九日たち、瘧（おこり）のように発熱と悪寒があり、熱が多く寒けは少なく、病人は嘔かず、便通はおのずからふだんどおりになろうとしていて、一日に二、三回発作が起こる。脈が微かで緩やかなものは、治ろうとしているとみる。脈が微かで悪寒するものは、陰陽ともに虚しているので、このうえ発汗・瀉下・催吐をしてはならない。顔色がかえって熱を帯びているものは、まだ治ろうとしていない。少し汗を出すことができないために、からだが必ずかゆくなる。桂枝麻黄各半湯がよい。\n\n### 『金匱玉函経』巻第二・弁太陽病形証治第三\n\n**書き下し**（読み：社員案）\n太陽病、之を得て八九日、瘧状の如く、発熱して悪寒し、熱多くして寒少なく、其の人嘔せず、清便自ずから調い、日に二三発す。脈微緩なる者は愈えんと欲すと為す。脈微にして悪寒するは、此れ陰陽倶に虚す。復た吐下発汗すべからざるなり。面反って熱色有る者は、未だ解せんと欲せずと為す。其の小汗出づるを得ること能わざるを以て、身必ず当に痒かるべし。桂枝麻黄各半湯之を主る。\n\n**原文**（翻刻確認）\n太陽病，得之八九日，如瘧狀，發熱而惡寒，熱多而寒少，其人不嘔，清便自調，日二三發，脈微緩者為欲愈。脈微而惡寒，此陰陽俱虛，不可復吐下發汗也，面反有熱色者，為未欲解，以其不能得小汗出，身必當癢，桂枝麻黃各半湯主之。\n\n**現代語訳**（訳：社員案）\n太陽病にかかって八、九日たち、瘧（おこり）のようで、発熱して悪寒し、熱が多く寒けは少なく、病人は嘔かず、便通はおのずから整い、一日に二、三回発作が起こる。脈が微かで緩やかなものは、治ろうとしているとみる。脈が微かで悪寒するのは、陰陽ともに虚しているので、このうえ催吐・瀉下・発汗をしてはならない。顔がかえって熱を帯びているものは、まだ治ろうとしていないとみる。少し汗を出すことができないために、からだが必ずかゆくなるはずである。桂枝麻黄各半湯が主治する。\n\n### 注記\n- 原典での方名は桂枝麻黄各半湯。桂麻各半湯は略称\n- 四庫全書本『傷寒論注釈』（成無己注）巻二の翻刻も同じ句（翻刻確認）。字体の違い（癢／痒、虛／虚など）のみ\n- 『金匱玉函経』の「為未欲解」の「未」は、翻刻では「末」。文が通らないため誤りとみて、宋本『傷寒論』の字を採った（要原本照合）\n- 『金匱玉函経』は資料の出典欄にないが、同名・同構成の方なので条文の欄に置いた（院長の基準、2026-10-23）\n- 宋本の方の後には林億らの謹按があり、各半湯というより合半湯と言うほうがよいとする、と資料はいう。維基文庫の宋本の翻刻にはこの注が載っていない（要原本照合）\n- 宋本の巻第十に再掲された方は、麻黄の「去節」の位置と杏仁の数え方（枚／箇）が異なるが、分量は同じ（要原本照合）", "出典": "### 原典の構成\n- 『傷寒論』（宋本）：桂枝1両16銖（去皮）、芍薬・生姜（切）・甘草（炙）・麻黄（去節）各1両、大棗4枚（擘）、杏仁24枚（湯に浸し、皮尖と双仁のものを去る）（翻刻確認）\n- 『金匱玉函経』巻第七・方薬炮製（桂枝麻黄各半湯方第二）：桂枝（翻刻では銖数の字が崩れて読めない。要原本照合）、芍薬・生姜・甘草（炙）・麻黄 各1両、大棗4枚、杏仁24枚（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』（宋本）：7味を水5升で、まず麻黄を1、2回沸騰させて上の泡を去る。残りの薬を入れて1升8合に煮つめ、滓を去って6合を温服する（翻刻確認）\n- 『金匱玉函経』：7味を㕮咀し、水5升で、まず麻黄を1、2回沸騰させて上の泡を去る。残りの薬を入れて1升8合に煮つめ、滓を去って6合を温服する。もとは2湯を各3合ずつ合わせて6合とし頓服したが、今は1方にまとめた、と方後にある（翻刻確認）\n\n### 処方の変遷\n- 桂枝湯と麻黄湯を各1/3量ずつ合わせて新しい方としたもの\n- 『太平聖恵方』巻第八・傷寒三陰三陽応用湯散諸方の桂枝麻黄湯方（桂枝・麻黄・赤芍薬・杏仁 各1両、甘草半両。散とし姜棗で煎服）は、構成生薬が本方と同じ。同書巻第十一・治陽毒傷寒諸方の桂枝麻黄散は、桂枝・麻黄・甘草・赤芍薬・葛根・杏仁 各1両を散とし姜で煎服する（要原本照合）\n- 『丹渓手鏡』巻之中・傷寒方論一では、桂枝湯（桂枝・芍薬・甘草・姜棗 各3銭）に麻黄2銭・杏仁12枚を加えたものを桂麻各半湯と名づける（要原本照合）\n- 『金鏡内台方議』巻之一では、一名を麻黄芍薬湯とし、桂枝湯中に麻黄・杏仁を加えたものとする（要原本照合）\n- 『医学入門』三巻下・傷寒用薬賦の桂麻各半湯は、麻黄1銭半、桂枝・芍薬・杏仁 各1銭、甘草7分、姜3片、棗2枚を煎服する（要原本照合）\n- ツムラの医療用エキス剤はない。医療用は〔東洋〕桂麻各半湯エキス細粒（東洋薬行）の1品目で、1日量4.5g中に 桂枝3.5・芍薬2・生姜（生ショウキョウ）2・甘草2・麻黄2・大棗2・杏仁2.5（g）の混合生薬の水製エキスを含む（PMDA 添付文書 2023年10月改訂 第1版で確認）", "構成": "桂枝・芍薬・生姜・甘草・麻黄・大棗・杏仁", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "梔子柏皮湯", "名前": "梔子柏皮湯", "読み": "ししはくひとう", "ツムラ番号": "", "出典": "傷寒論（弁陽明病脈証并治第八）", "別名": "", "本文": {"条文": "### 『傷寒論』弁陽明病脈証并治第八\n\n**書き下し**（読み：社員案）\n傷寒、身黄ばみ、発熱するは、梔子柏皮湯之を主る。\n\n**原文**（翻刻確認）\n傷寒、身黃、發熱、梔子柏皮湯主之。\n\n**現代語訳**（訳：社員案）\n傷寒で、からだが黄色くなり、発熱するものは、梔子柏皮湯がこれを主治する。\n\n### 注記\n- 宋本の翻刻では、条文の方名は「梔子柏皮湯」、方の見出しは「梔子檗皮湯方」、構成の生薬名は「黃檗」と書かれる（翻刻確認）。本文は条文の字を採った\n- 『注解傷寒論』の四庫全書本（書名『傷寒論注釋』）巻五では、方名が「梔子蘗皮湯」、生薬名が「黄蘗」と書かれる。条文は「傷寒身黄發熱者」と「者」の字がある（要原本照合）。本文は宋本の字を採った\n- 『金匱玉函経』の条（陽明病の篇）では、方名が「梔子檗皮湯」と書かれる（要原本照合）\n- 『金匱玉函経』巻第七・方薬炮製では「梔子黄檗湯」の名で載り、梔子14枚（擘）・黄檗2両16銖・甘草1両（炙）を㕮咀して煮る。梔子の数と黄檗の量が宋本と異なる（要原本照合）。本文の構成は、宋本と『注解傷寒論』で一致する値を採った", "出典": "### 原典の構成\n- 『傷寒論』：肥梔子15箇（擘）、甘草1両（炙）、黄檗（黄柏）2両（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』：3味を水4升で煮て1升半を取り、滓を去り、分けて温めて2回に服す（翻刻確認）\n\n### 処方の変遷\n- 『金匱玉函経』巻第七・方薬炮製では梔子黄檗湯と名づけられる（翻刻確認）。分量の違いは条文の注記を参照\n- 『肘後百一方』巻之四・治卒発黄疸諸黄病第三十一では、黄汗の方の又方として甘草・梔子・黄柏を水煎して服し、温病の発黄も治すとされる（要原本照合）\n- 『千金翼方』巻第九・傷寒上・陽明病状第八では、傷寒で黄を発するものに梔子柏皮湯として梔子・甘草・黄柏が示されるとされる（要原本照合）\n- 『太平聖恵方』巻第十・治傷寒煩躁諸方では、方名なしで、傷寒の発汗後に身熱が退かず心神が煩躁するものに、梔子人・甘草・黄柏を散として水煎服するとされる（要原本照合）\n- 『鶏峰普済方』第十巻・血では柏皮湯の名で本方が収載されるとされる（要原本照合）\n- 『黄帝素問宣明論方』巻之六・傷寒方と巻之八・水湿門では、頭に微しく汗し、小便が利して微しく黄を発するもの（湿熱が相搏つこと微しいもの）に、黄柏・甘草・大梔子が示されるとされる（要原本照合）\n- 『傷寒直格方』巻下・諸証薬石分剤の茵蔯湯の解説のなかで、同様の軽い発黄に大山梔子・甘草・黄柏の梔子柏皮湯がよいとされる（要原本照合）\n- 『類聚方広義』（下）では、眼球が黄赤して熱痛がひどいものや胞瞼の糜爛・痒痛などに、枯礬を少し加えて洗う外用（洗眼）の用法が載るとされる（要原本照合）\n- 賀川玄迪『産論翼』では、本方合三黄瀉心湯（黄連解毒湯合大黄甘草湯と同じ構成）が第六和剤湯と名づけられるとされる（要原本照合）\n- 医療用エキス剤はツムラにはなく、小太郎漢方製薬の「コタロー梔子柏皮湯エキス細粒」がある（識別コード N314。1日量6.0g中、日局サンシシ3.0・カンゾウ1.0・オウバク2.0g。PMDA 添付文書 2023年1月改訂 第1版で確認）。原典と同じ3味。添付文書に出典の欄はない", "構成": "山梔子・甘草・黄柏", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "芍薬甘草附子湯", "名前": "芍薬甘草附子湯", "読み": "しゃくやくかんぞうぶしとう", "ツムラ番号": "", "出典": "傷寒論（弁太陽病脈証并治中第六）", "別名": "", "本文": {"条文": "### 『傷寒論』弁太陽病脈証并治中第六\n\n**書き下し**（読み：社員案）\n発汗し、病解せず、反って悪寒する者は、虚するが故なり。芍薬甘草附子湯之を主る。\n\n**原文**（翻刻確認）\n發汗、病不解、反惡寒者、虛故也。芍藥甘草附子湯主之。\n\n**現代語訳**（訳：社員案）\n発汗させたが病が治らず、かえって悪寒するものは、虚しているためである。芍薬甘草附子湯がこれを主治する。\n\n### 関連条文（本方の条の二条後）\n\n『傷寒論』弁太陽病脈証并治中第六。資料が「表実」の意味を説明するために挙げる条。\n\n**書き下し**（読み：社員案）\n発汗の後、悪寒する者は、虚するが故なり。悪寒せず、但だ熱する者は、実なり。当に胃気を和すべし。調胃承気湯を与う。\n\n**原文**（翻刻確認）\n發汗後惡寒者、虛故也。不惡寒但熱者、實也。當和胃氣、與調胃承氣湯。\n\n**現代語訳**（訳：社員案）\n発汗の後に悪寒するものは、虚しているためである。悪寒せずただ熱するものは、実である。胃気を和すべきで、調胃承気湯を与える。\n\n### 注記\n- 本方の条は、宋本の翻刻と『注解傷寒論』の四庫全書本（書名『傷寒論注釋』）巻三で字が同じ（翻刻確認。虛／虚などの字形の差のみ）\n- 『金匱玉函経』では条の初めが「發其汗不解、而反惡寒者」と書かれる（要原本照合）。本文は宋本の字を採った\n- 資料によれば、宋本では方の後に「疑うらくは仲景の方に非ず」と付記される。維基文庫の宋本の翻刻の方後にはこの句が見当たらず、『傷寒論注釋』四庫全書本の方後には「疑非仲景意」とある（要原本照合）\n- 資料によれば、弁発汗後病脈証并治第十七にも同じ条があり、条の最後が「属芍薬甘草附子湯」となり、甘草に炙の細註がない。維基文庫の宋本の翻刻はこの篇を1条しか載せておらず、確かめられない（要原本照合）\n- 『金匱玉函経』の方は、芍薬・甘草各1両、附子1枚（炮）で、㕮咀して水3升で煮て1升3合を取り、3回に分けて温服する（要原本照合）。原典の構成・服用法は宋本の値を採った\n- 『傷寒論注釋』四庫全書本の服用法は「分温服」で「三」の字がない（要原本照合）", "出典": "### 原典の構成\n- 『傷寒論』：芍薬・甘草（炙）各3両、附子1枚（炮じ、皮を去り、8片に破る）（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』：3味を水5升で煮て1升5合を取り、滓を去り、3回に分けて温服する（翻刻確認）\n\n### 処方の変遷\n- 芍薬甘草湯（芍薬・甘草）に附子を加えた構成\n- 資料によれば、原典の芍薬甘草湯は「白芍薬・甘草（炙）」と指示されるのに対し、本方は「芍薬」と指示される（要原本照合）\n- 『類聚方広義』（下）は本方に大黄を加えて芍薬甘草附子大黄湯と名づける（要原本照合）\n- 医療用エキス剤は、三和芍薬甘草附子湯エキス細粒（1日量4.5g中、日局シャクヤク5.0g・日局カンゾウ5.0g・日局加工ブシ1.0g。PMDA 添付文書 2026年8月改訂 第3版で確認）。ツムラの医療用製剤は見当たらない（KEGG MEDICUS、2026-10-22）", "構成": "芍薬・甘草・附子（加工ブシ）", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "四苓湯", "名前": "四苓湯", "読み": "しれいとう", "ツムラ番号": "", "出典": "内外傷弁惑論（巻下・随時用薬）", "別名": "", "本文": {"条文": "### 『内外傷弁惑論』巻下・随時用薬（李杲）\n\n**書き下し**（読み：社員案）\n冷飲に傷られて悪寒せざる者、腹中も亦た寒を覚えず、惟だ夯悶して身重きを覚え、飲食化せざる者、或いは小便利せざるを治するには、去桂五苓散を煎じ、前に依りて斟酌して之を服す。\n\n**原文**（翻刻確認）\n治傷冷飲不惡寒者、腹中亦不覺寒、惟覺夯悶身重、飲食不化者、或小便不利、煎去桂五苓散、依前斟酌服之。\n\n**現代語訳**（訳：社員案）\n冷たい飲み物に傷られたが悪寒がなく、腹の中にも冷えを感じず、ただ重苦しく悶えて（夯悶）体が重く感じ、飲食物が消化されないもの、あるいは尿の出が悪いものを治すには、去桂五苓散（五苓散から桂を去ったもの）を煎じ、前の条にならって分量を加減して服す。\n\n### 注記\n- 本方は原典では「去桂五苓散」の名で載り、四苓散・四苓湯の名ではない（翻刻確認）\n- 「腹中」は、維基文庫の四庫全書本の翻刻では「服中」と書かれる（要原本照合）。資料と、維基文庫のもう一つの翻刻（未校訂本）は「腹中」\n- 資料は所在を「巻之二・随時用薬」とする。維基文庫の翻刻（上・中・下の3巻）では巻下に載る（要原本照合）\n- 「前に依りて」の「前」は、同じ随時用薬の最初の条「治傷冷飲者、以五苓散每服三錢或四錢匕、加生薑煎服之。」（冷飲に傷られた者を治するには、五苓散を毎服三銭或いは四銭匕、生姜を加え煎じて之を服す）を指すと読める（翻刻確認）", "出典": "### 原典の構成\n- 『内外傷弁惑論』：「去桂五苓散」とだけあり、各味・分量の記載はない（翻刻確認）\n- 同書同巻の五苓散の方：沢瀉2両5銭、猪苓・茯苓・白朮 各1両5銭、桂1両（翻刻確認）\n\n### 原典の服用法\n- 『内外傷弁惑論』：去桂五苓散を煎じ、前の条（五苓散を1回3銭または4銭匕、生姜を加えて煎じて服す）にならって斟酌して服す（翻刻確認）\n- 同書同巻の五苓散の方の服用法は、細末とし、1回2銭を熱湯で調えて服し、時を問わない。服し終えたら熱湯を多く飲み、汗が出れば愈える（翻刻確認）\n\n### 処方の変遷\n- 構成上は五苓散から桂皮を去った方。資料の出典欄には『傷寒論』『金匱要略』も挙がるが、これらは五苓散の出典で、四苓散・四苓湯の名は両書には載らない（資料の論考による。要確認）\n- 『内外傷弁惑論』巻下・随時用薬に「去桂五苓散」の名で載る（翻刻確認）。資料は、本方の出典を『温疫論』とするのは誤りで、それより早い本書によるとする\n- 『儒門事親』（張子和）巻之十一には「減桂五苓散」「五苓散去猪苓」の表現があり、資料は『内外傷弁惑論』の去桂五苓散への一段階とする（要原本照合）\n- 『丹渓心法』巻二・泄瀉十に四苓散の名で載り、附方に「四苓散、即ち五苓散の内、桂を去る」とある（要原本照合）\n- 『温疫論』（呉有性）下巻・論飲の四苓散は、茯苓・沢瀉・猪苓・陳皮の4味で、白朮がなく陳皮が入る別の構成。従来はこれが本方の出典とされてきた（要原本照合）\n- 『勿誤薬室方函』巻上は四苓散の出典を『温疫論』としつつ、薬味を猪苓・沢瀉・白朮・茯苓とする。資料はこれを錯誤とする（要原本照合）\n- 医療用製剤はツムラにはなく、大杉製薬の「オースギ四苓湯細粒（調剤用）」がある（識別コード SG-140。1日量3.0g中、日局タクシャ末・ブクリョウ末・ソウジュツ末・チョレイ末 各0.75g の生薬末製剤。PMDA 添付文書 2022年12月改訂 第1版で確認）。原典の白朮の代わりに蒼朮が入る。添付文書に出典の欄はない", "構成": "沢瀉・茯苓・蒼朮・猪苓", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "大柴胡湯去大黄", "名前": "大柴胡湯去大黄", "読み": "だいさいことうきょだいおう", "ツムラ番号": "", "出典": "傷寒論（弁太陽病脈証并治中第六）", "別名": "", "本文": {"条文": "### 『傷寒論』弁太陽病脈証并治中第六\n\n**書き下し**（読み：社員案）\n太陽病、経を過ぐること十余日、反って二三之を下し、後四五日、柴胡の証仍お在る者は、先ず小柴胡湯を与う。嘔止まず、心下急、鬱鬱微煩する者は、未だ解せずと為すなり。大柴胡湯を与えて之を下せば則ち愈ゆ。\n\n**原文**（翻刻確認）\n太陽病、過經十餘日、反二三下之。後四五日、柴胡證仍在者、先與小柴胡湯。嘔不止、心下急、鬱鬱微煩者、為未解也、與大柴胡湯下之則愈。\n\n**現代語訳**（訳：社員案）\n太陽病で、経を過ぎて十日余りたつのに、かえって二、三度これを下した。その後四、五日たっても柴胡の証がなお残っているものには、まず小柴胡湯を与える。嘔吐が止まらず、心下（みぞおち）が急迫し、気分がふさいで少しもだえるものは、まだ解していないのである。大柴胡湯を与えてこれを下せば治る。\n\n### 注記\n- 資料は、本方をもともと宋本『傷寒論』の大柴胡湯そのもの（大黄を含まない7味）とし、『傷寒論』の大柴胡湯の条文は全て本方の条文でもあるとする。ここには資料が解説で引く弁太陽病脈証并治中第六の条だけを載せた\n- 『注解傷寒論』（四庫全書本『傷寒論注釈』巻三）の翻刻は「與大柴胡湯下之」を「與大柴胡下之」とし、「湯」の字がない（要原本照合）\n- 『金匱玉函経』の翻刻は「反二三下之」を「及二三下之」、「嘔不止、心下急、鬱鬱微煩者」を「嘔止小安、其人鬱郁微煩者」、「與大柴胡湯下之則愈」を「與大柴胡湯下之、愈」とする（要原本照合）", "出典": "### 原典の構成\n- 『傷寒論』：柴胡半斤、黄芩3両、芍薬3両、半夏半升（洗）、生姜5両（切）、枳実4枚（炙）、大棗12枚（擘）の7味（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』：7味を水1斗2升で煮て6升を取り、滓を去り、再び煎じて（3升を取り）、1升を温服する。日に3服（翻刻確認）\n- 方後に「一方、加大黃二兩。若不加、恐不爲大柴胡湯」（一方に大黄2両を加う。若し加えざれば、恐らくは大柴胡湯と為さず）とある（翻刻確認）\n- 宋本の翻刻では「取三升」が括弧に入る。『注解傷寒論』（四庫全書本）の翻刻にはこの3字がない（翻刻確認）\n\n### 処方の変遷\n- 大柴胡湯から大黄を去った構成。宋本『傷寒論』の大柴胡湯方は大黄を含まない7味で、方後に大黄を加える一方を挙げる（翻刻確認）\n- 『注解傷寒論』（四庫全書本『傷寒論注釈』巻三）の大柴胡湯方は、薬味の末に大黄2両を並べながら方後は「右七味」とし、「一方用大黄二兩、若不加大黄恐不為大柴胡湯也」とする（翻刻確認）\n- 『金匱玉函経』の大柴胡湯方は大黄2両を含む8味で、方後に「一方無大黃、然不加不得名大柴胡湯也」とする（翻刻確認）。生姜は3両（要原本照合）\n- 『外台秘要方』第一巻・傷寒上・崔氏方に、柴胡を前胡に代えた大前胡湯が載り、大黄の加味は記されない。胡洽は張仲景に出づとする（要原本照合）\n- 『太平聖恵方』巻第八・傷寒三陰三陽応用湯散諸方の大柴胡湯方は、柴胡・枳実・黄芩・赤芍薬・半夏を散とし、姜棗で煎服する。大黄を含まない（要原本照合）\n- 『三因極一病証方論』巻之四・傷寒証治の大柴胡湯は、柴胡・黄芩・赤芍薬・半夏・枳実を姜棗で煎服する。大黄を含まない（要原本照合）\n- 『医方類聚』巻之五十四・傷寒門二十八・通真子傷寒括要の大柴胡湯は、柴胡・枳殻・黄芩・赤芍薬・半夏を姜棗で煎服する。枳実に代えて枳殻を用い、大黄を含まない（要原本照合）\n- 『古今名医方論』巻三の大柴胡湯は、柴胡半斤・半夏半斤・黄芩3両・芍薬3両・枳実4枚・生姜5両・大棗12枚で、半夏を「半升」でなく「半斤」とする（要原本照合）\n- 『傷寒約編』巻之四・大柴胡湯証の大柴胡湯は、柴胡・白芍・黄芩・枳実・半夏・生姜とする（要原本照合）\n- 医療用エキス剤はツムラにはなく、小太郎漢方製薬の「コタロー大柴胡湯去大黄エキス細粒」がある（識別コード N319。1日量9.0g中、日局サイコ6.0・ハンゲ4.0・ショウキョウ1.0・オウゴン3.0・シャクヤク3.0・タイソウ3.0・キジツ2.0g。PMDA 添付文書 2023年7月改訂 第1版で確認）。添付文書に出典の欄はない", "構成": "柴胡・半夏・生姜・黄芩・芍薬・大棗・枳実", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "腸癰湯", "名前": "腸癰湯", "読み": "ちょうようとう", "ツムラ番号": "", "出典": "集験方（医心方 巻第十五・治腸癰方第十二の引用）、備急千金要方（巻第二十三・痔漏・腸癰第二）", "別名": "", "本文": {"条文": "### 『集験方』（『医心方』巻第十五・治腸癰方第十二の引用）\n\n**書き下し**（読み：社員案）\n腸癰を治する湯方。\n\n**原文**（翻刻確認）\n治腸癰湯方\n\n**現代語訳**（訳：社員案）\n腸癰を治す煎じ薬の処方。\n\n### 『備急千金要方』巻第二十三・痔漏・腸癰第二\n\n腸癰湯方の「又方」として薏苡仁・牡丹・桃仁・瓜瓣の4味が載り、方後に次の小字注がある。\n\n**書き下し**（読み：社員案）\n姚氏は桃仁を用いず、李仁を用う。崔氏は芒硝二両有りて云う、腹中疞痛し、煩満して安からず、或いは脹満して飲食を下さず、小便渋る。此の病は多く是れ腸癰なるも、人多く識らず、と。\n\n**原文**（翻刻確認）\n姚氏不用桃仁、用李仁。崔氏有芒硝二兩、云、腹中疞痛、煩滿不安、或脹滿不下飲食、小便澀。此病多是腸癰、人多不識。\n\n**現代語訳**（訳：社員案）\n姚氏は桃仁を用いず、李仁を用いる。崔氏の方には芒硝2両があり、こう言う。腹の中が痛み（疞痛）、煩わしく満ちて落ち着かず、あるいは腹が脹って飲食が下らず、小便が出渋る。この病の多くは腸癰であるが、多くの人はそれと気づかない。\n\n### 注記\n- 『医心方』の翻刻（維基文庫）は簡体字で書かれている。原文は字体を直して示した。字形の判断は要原本照合\n- 資料は『医心方』の薬味を「薏苡人・牡丹皮・桃人・冬瓜人」と書く。翻刻は「薏苡仁・牡丹皮・桃仁・冬瓜仁」（要原本照合）\n- 資料は、高文鋳輯校『集験方』巻第四・治肺痿、肺癰及腸癰方にも「腸癰を治する湯方」として載るとする（要原本照合）\n- 「腹中疞痛」の「疞」は資料の字。『備急千金要方』の翻刻は「腹中」と「痛」の間が1字空白で、文が通らないので資料の字を本文に採った（要原本照合）\n- 『備急千金要方』の翻刻は「人多不識。」に続けて「婦人產」とあり、その後が欠けて次の方の文（凡腸癰…）に続いている。資料（本の794頁）はこの後に、婦人の産後の虚熱の者の多くがこの病になること、癰疽でなくてもこの薬を服して害はないことを述べる句を挙げる（要原本照合）\n- 資料は「煩毒安からず」「飲食を思わず」と読む。翻刻は「煩滿不安」「不下飲食」（要原本照合）\n- 資料は「桃人」「李人」と書く。翻刻は「桃仁」「李仁」（要原本照合）\n- 資料は、山田業広『九折堂読書記千金方』に、諸本は「李人」を「杏人」に作るとあることを引く（要原本照合）", "出典": "### 原典の構成\n- 『集験方』（『医心方』の引用）：薏苡仁1升、牡丹皮3両、桃仁3両、冬瓜仁1升（翻刻確認）\n- 『備急千金要方』：薏苡仁1升、牡丹・桃仁 各3両、瓜瓣2升（翻刻確認）\n- 資料は『備急千金要方』の薬味を「薏苡仁・牡丹皮・桃仁・瓜瓣人」と書き、分量は挙げない（要原本照合）\n\n### 原典の服用法\n- 『集験方』（『医心方』の引用）：4味を水6升で煮て2升を取り、2回に分けて服す（翻刻確認）\n- 『備急千金要方』：4味を咀み、水6升で煮て2升を取り、2回に分けて服す（翻刻確認）。翻刻は「咀」の前の1字が空白（要原本照合）\n\n### 処方の変遷\n- 資料は、『集験方』は北周の姚僧垣の撰で、すでに亡佚しているとする。本方は『医心方』（丹波康頼）の引用と高文鋳の輯校本で伝わる（要確認）\n- 資料は、藤原佐世『日本国見在書目録』医方家に「集験方十二 姚僧垣撰」とあり、『集験方』は日本に伝来していたとする（要原本照合）\n- 資料は、『備急千金要方』の小字注「姚氏は桃仁を用いず、李仁を用う」から、『集験方』に李仁を用いる別本があったとみる（要確認）\n- 『金匱要略』肺痿肺癰欬嗽上気病脉証治第七の千金葦茎湯（葦茎・薏苡仁・桃仁・瓜瓣）と、瘡癰腸癰浸淫病脉証并治第十八の大黄牡丹湯について、資料は、千金葦茎湯去葦茎合大黄牡丹皮湯去大黄・芒硝が腸癰湯にあたるとする（要原本照合）\n- 『聖済総録』巻第一百二十九・癰疽門・腸癰に、大黄牡丹湯方に続いて、腸癰を治す薏苡仁湯方として載る（要原本照合）\n- 『全生指迷方』巻四・婦人科に、瓜子湯として載る（要原本照合）\n- 『三因極一病証方論』巻之十五・腸癰証治に、薏苡仁湯（薏苡仁・牡丹皮・桃仁・瓜瓣仁）として載る。同書巻之十三・肺癰証治の葦葉湯は薏苡仁・瓜瓣仁・桃仁に葦葉を入れる（要原本照合）\n- 『世医得効方』巻第十九・瘡腫科・腸癰に、薏苡湯として載る（要原本照合）\n- 『外科発揮』巻四・腸癰の薏苡仁湯・瓜子仁湯、『外科正宗』巻之三・腸癰論第三十三の瓜蔞子湯は、薏苡仁・桃仁・牡丹皮・瓜蔞仁で、冬瓜子に代えて瓜蔞仁を用いる。『外科正宗』の次の方の薏苡仁湯は瓜蔞子湯加白芍（要原本照合）\n- 資料は、この芍薬を加えた方を浅田宗伯が瓜蔞仁を冬瓜子に戻し、腸癰湯加芍薬として浅田流でよく用いるとする（要確認）\n- 『張氏医通』巻十四・腸癰門に、薏苡瓜瓣湯（千金）として載る（要原本照合）\n- 『備急千金要方』巻第二十三・腸癰第二には、本方の少し後に、瓜子3升を搗いて末とし、水3升で煮て1升半を取り、3回に分けて服す「又方」（瓜子の単味）が載る（翻刻確認）\n- 資料は、冬瓜子・瓜子・冬瓜仁・瓜瓣・瓜瓣仁はいずれも同一の薬味とする（要確認）\n- 医療用エキス剤はツムラにはなく、小太郎漢方製薬のコタロー腸癰湯エキス細粒（識別コード N320）がある。1日量6.0g中、薏苡仁9.0・冬瓜子6.0・桃仁5.0・牡丹皮4.0g の4味（KEGG MEDICUS と PMDA 添付文書 2023年1月改訂 第1版で 2026-10-23 確認）。添付文書に出典の欄はない", "構成": "薏苡仁・冬瓜子・桃仁・牡丹皮", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "当帰芍薬散加附子", "名前": "当帰芍薬散加附子", "読み": "とうきしゃくやくさんかぶし", "ツムラ番号": "", "出典": "古方括要（巻之下・外科・鶴膝風）", "別名": "", "本文": {"条文": "### 『古方括要』巻之下・外科・鶴膝風\n\n**書き下し**（要原本照合）\n\n**原文**（要原本照合）\n\n**現代語訳**\n\n### 関連条文（附子湯の条）\n\n『金匱要略』婦人妊娠病脈証并治第二十。当帰芍薬散の条の二条前にあり、妊娠中に附子を用いる例として資料が挙げる条。\n\n**書き下し**（読み：社員案）\n婦人懐娠六七月、脈弦にして発熱し、其の胎愈々脹り、腹痛悪寒する者は、少腹扇の如し。然る所以の者は、子臓開くが故なり。当に附子湯を以て其の臓を温むべし。（方未だ見えず）\n\n**原文**（翻刻確認）\n婦人懷娠六七月、脈弦發熱、其胎愈脹、腹痛惡寒者、少腹如扇、所以然者、子臟開故也、當以附子湯溫其臟。（方未見）\n\n**現代語訳**（訳：社員案）\n妊娠六、七か月の婦人で、脈が弦で発熱し、胎がますます張り、腹が痛んで悪寒するものは、下腹部が扇であおがれるようである。そうなるわけは、子臓が開いているからである。附子湯でその臓を温めるべきである（方はまだ見当たらない）。\n\n### 注記\n- 『古方括要』の原文の翻刻は、維基文庫の検索（2026-10-23）では見当たらなかった。資料には書き下しだけがある（要原本照合）\n- 附子湯の条の「方未見」は、翻刻では小字の注として書かれる（翻刻確認）\n- 『金匱要略』の附子湯は方が載っていない。資料は『傷寒論』弁少陰病脈証并治第十一の附子湯（少陰病、之を得て一二日、口中和し、其の背悪寒する者）と同じ方とみる。『傷寒論』の附子湯は附子2枚（炮、皮を去り八片に破る）・茯苓3両・人参2両・白朮4両・芍薬3両（翻刻確認）", "出典": "### 原典の構成\n- 『古方括要』：分量は資料に記載がない（要原本照合）\n- もとの当帰芍薬散（『金匱要略』婦人妊娠病脈証并治第二十）：当帰3両、芍薬1斤、茯苓4両、白朮4両、沢瀉半斤、芎藭半斤（翻刻確認）\n\n### 原典の服用法\n- もとの当帰芍薬散（『金匱要略』）：6味を杵いて散とし、方寸匕を取って酒で和し、日に3回服す（翻刻確認）\n\n### 処方の変遷\n- 当帰芍薬散に附子を加えた構成。当帰芍薬散加附子湯とも称される（資料の論考①）\n- 当帰芍薬散の出典は『金匱要略』で、婦人妊娠病脈証并治第二十の「婦人懐妊、腹中㽲痛」の条と、婦人雑病脈証并治第二十二の「婦人腹中諸疾痛」の条に載る（翻刻確認）\n- 資料の出典欄は『金匱要略』『古方括要』の2書を挙げる。当帰芍薬散加附子の名で処方されるのは『古方括要』巻之下・外科・鶴膝風で、資料はここで初めて本方が処方されるとする（要原本照合）\n- 『古方括要』の著者は資料では古矢知白とされる。成立年は資料に記載がない（要確認）\n- 『類聚方広義』（下）未試十八方・当帰芍薬散（尾台榕堂）には、下利止まず悪寒する者には附子を加え、下利せず大便秘する者には大黄を加えるとの指示がある（要原本照合）\n- 『鶏峰普済方』巻第十六・婦人の附子当帰元は当帰・芍薬・附子・白朮で、資料は当帰芍薬散加附子去川芎・茯苓・沢瀉とも表せるとする（要原本照合）\n- 医療用エキス剤はツムラにはなく、三和生薬の三和当帰芍薬散加附子エキス細粒（識別コード S-29）がある（KEGG MEDICUS と PMDA で 2026-10-23 確認）\n- 三和のエキス細粒は1日量9g中にトウキ3.0・センキュウ3.0・シャクヤク6.0・ブクリョウ4.5・ビャクジュツ4.5・タクシャ3.5・加工ブシ1.0g（PMDA 添付文書 2026年8月改訂 第3版で確認）。添付文書は、妊婦または妊娠している可能性のある女性には投与しないことが望ましいとする（加工ブシの副作用があらわれやすくなるため）", "構成": "当帰・川芎・芍薬・茯苓・白朮・沢瀉・附子（加工ブシ）", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "附子人参湯", "名前": "附子人参湯", "読み": "ぶしにんじんとう", "ツムラ番号": "", "出典": "千金翼方（巻第十八・雑病上・霍乱第一）", "別名": "", "本文": {"条文": "### 『千金翼方』巻第十八・雑病上・霍乱第一\n\n理中丸の方後の加減のうち、「若し体冷え、微しく汗し、腹中寒ゆる」ものに附子を加える条。資料はここを本方の出典とする。\n\n**書き下し**（読み：社員案）\n理中丸。霍乱を主る臨時の方。人参・白朮・乾姜・甘草（炙る、各一両）。右四味、搗き篩いて末と為し、煉蜜にて和して丸とし弾丸の如くす。湯を取りて一丸を和して之を服す。日に十服す。吐多く痢少なき者は、枳実三枚を取り、炙りて四破し、水三升もて煮て一升を取り、一丸を和して之を服す。吐少なく痢多き者は、乾姜一両を加う。吐痢して乾嘔する者は、半夏半両を取り、洗いて滑を去り、水二升もて煮て一升を取り、一丸を和して之を服す。若し体疼痛して堪う可からざる者は、水三升もて棗三枚を煮て一升を取り、一丸を和して之を服す。若し吐痢大いに極まりて転筋する者は、韭汁を以て腹腎を洗うこと胸より足踝に至る。逆にすること勿かれ、即ち止む。若し体冷え、微しく汗し、腹中寒ゆるは、附子一枚を取り、炮じて皮を去り、四破し、水二升を以て煮て一升とし、一丸を和して服す。吐痢悉く止み、脈出でず体猶お冷ゆる者は、諸湯を服して之を補う可し。\n\n**原文**（翻刻確認）\n理中丸。主霍亂臨時方。人參　白朮　乾薑　甘草（炙，各一兩）上四味，搗篩為末，煉蜜和丸如彈丸。取湯和一丸服之，日十服。吐多痢少者取枳實三枚炙，四破，水三升，煮取一升，和一丸服之；吐少痢多者，加乾薑一兩；吐痢乾嘔者，取半夏半兩，洗去滑，水二升，煮取一升，和一丸服之；若體疼痛，不可堪者，水三升，煮棗三枚，取一升，和一丸服之；若吐痢大極轉筋者，以韭汁洗腹腎從胸至足踝，勿逆即止，若體冷微汗，腹中寒，取附子一枚，炮去皮，四破，以水二升，煮一升和一丸服；吐痢悉止，脉不出體猶冷者，可服諸湯補之。\n\n**現代語訳**（訳：社員案）\n理中丸。霍乱を治める臨時の方。人参・白朮・乾姜・甘草（炙る）各1両。以上の4味を搗いて篩い、粉末にし、煉った蜜で弾丸ほどの大きさの丸にする。湯で1丸を溶いて服用し、1日に10回服む。嘔吐が多く下痢が少ないものは、枳実3枚を炙って四つに割り、水3升で煮て1升を取り、1丸を溶いて服む。嘔吐が少なく下痢が多いものは、乾姜1両を加える。嘔吐・下痢があって空えずきするものは、半夏半両を洗ってぬめりを取り、水2升で煮て1升を取り、1丸を溶いて服む。からだが痛んで耐えられないものは、水3升で棗3枚を煮て1升を取り、1丸を溶いて服む。嘔吐・下痢がひどく極まってこむら返りするものは、韭（にら）の汁で腹と腰を胸から足くるぶしまで洗う。逆向きに洗わなければすぐに止まる。からだが冷え、少し汗が出て、腹の中が冷えるものは、附子1枚を炮じて皮を去り、四つに割って、水2升で煮て1升とし、1丸を溶いて服む。嘔吐・下痢がすべて止まっても、脈が出ずからだがなお冷えるものは、ほかの湯剤を服んで補うのがよい。\n\n### 注記\n- 維基文庫の『千金翼方』卷18 の翻刻は簡体字の本で、原文は繁体字にそろえて書いた（参→參、术→朮、干姜→乾薑、两→兩、炼→煉、枣→棗、肾→腎、转→轉、体→體 など）。「脉」は翻刻の字のまま。字形の判断には使えない（要原本照合）\n- 方名：翻刻は「理中丸」、資料は「理中円」と書く（要原本照合）\n- 「吐少痢多者，加乾薑一兩」：資料の書き下しは「乾姜一両を取り、水二升煮て一升とし、一丸を和して服す」とし、翻刻にない煎じ方の句がある（要原本照合）\n- 「吐痢乾嘔者」：資料の書き下しは「頻りに吐利し、乾嘔する者」で、翻刻にない「頻りに」がある（要原本照合）\n- 「若吐痢大極轉筋者」：資料の書き下しは「若し大いに吐利し、転筋する者」（要原本照合）\n- 「勿逆即止」：資料の書き下しは「逆すること勿くば即ちに止む」。社員案は「逆にすること勿かれ、即ち止む」と読んだ（要確認）\n- 「痢」は資料の書き下しでは「利」（要原本照合）", "出典": "### 原典の構成\n- 『千金翼方』理中丸：人参・白朮・乾姜・甘草（炙）各1両。加減で附子1枚（炮じて皮を去り、四破）を煎じた汁で1丸を服す（翻刻確認）\n\n### 原典の服用法\n- 『千金翼方』：4味を搗いて篩い、煉蜜で弾丸大の丸とし、湯で1丸を和して服す。日に10服。体が冷え、微かに汗し、腹中が寒えるものは、附子1枚（炮じて皮を去り四破）を水2升で煮て1升とし、1丸を和して服す（翻刻確認）\n\n### 処方の変遷\n- 人参湯（理中丸）に附子を加えた構成。一般には附子理中湯の方名がよく知られる（資料の解説）\n- 人参湯の出典は『傷寒論』（理中丸。方後に湯法）と『金匱要略』（人参湯）（翻刻確認）\n- 『傷寒論』理中丸の方後の加減に、腹満するものは朮を去り附子1枚を加えるとある（翻刻確認）。資料はこれを本方成立の起点とする。構成は理中丸去朮加附子で、薬味の上では四逆加人参湯と同じになる（資料の論考❺）\n- 『傷寒総病論』巻三・発汗吐下後雑病証では、理中丸の調理法の中で、寒があって腹満して痛むもの・四肢拘急するもの・下利して転筋するものに生附子2枚を加えて湯とする。同書の原序には元符三年（1100）の黄庭堅の序が付くとされる（要原本照合）\n- 『旅舎備要方』霍乱にも、丸方（人参湯の4味）の後に、体が冷え、微かに汗し、腹中が寒えるものに附子1枚を加える加減がある。資料は『旅舎備要方』を1093年近傍の刊とし、『千金翼方』から引いたものとする（要原本照合）\n- 『太平恵民和剤局方』巻之五・治痼冷 附 消渇に附子理中丸（人参・附子・乾姜・甘草・白朮を細末とし、蜜丸を煎服）があり、一般にはこれが出典とされる。資料は『和剤局方』原書五巻本（大観年間 1107〜1110年の刊行）に収載とする（要原本照合）\n- 『閻氏小児方論』の附子理中丸（人参・白朮・乾姜・甘草・黒附子）、『仁斎直指附遺方論』巻十三・霍乱吐瀉・吐瀉証治の加減理中湯の加減（寒気によるものに附子1両を加えて附子理中湯と名づける）も本方の出典とされることがある（要原本照合）\n- 『千金翼方』の同じ霍乱第一には、続いて四順湯（大附子1枚・乾姜3両・人参・甘草（炙）各1両）が載る（翻刻確認）\n- 医療用エキス剤はツムラにはなく、三和生薬の三和附子理中湯エキス細粒がある（KEGG MEDICUS と PMDA で 2026-10-23 確認）。添付文書の方名は附子理中湯\n- 三和のエキス細粒は1日量4.5g中にニンジン3.0・カンゾウ3.0・ビャクジュツ3.0・カンキョウ3.0g と、識別コード S-09 の製品は加工ブシ1.0g（2025年9月改訂 第2版）、識別コード EK-410 の製品はブシ1.0g（2023年10月改訂 第1版）。添付文書は、妊婦または妊娠している可能性のある女性には投与しないことが望ましいとする（ブシの副作用があらわれやすくなるため）", "構成": "人参・甘草・白朮・乾姜・附子", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}]}</script>
<script>
var DATA = JSON.parse(document.getElementById("genten-data").textContent);
var $ = function(s){ return document.querySelector(s); };

function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
/* 検索用：カタカナ→ひらがな、全角英数→半角、空白除去 */
function norm(s){
  return String(s||"").toLowerCase()
    .replace(/[ァ-ヶ]/g, function(c){ return String.fromCharCode(c.charCodeAt(0)-0x60); })
    .replace(/[！-～]/g, function(c){ return String.fromCharCode(c.charCodeAt(0)-0xfee0); })
    .replace(/\s+/g, "");
}
DATA.entries.forEach(function(e){
  e._idx = norm([e["名前"], e["別名"], e["読み"], e["ツムラ番号"], e["出典"], e["本文"]["構成"]].join(" "));
});
var TODO = '<span class="todo">要確認</span>';
var LOCAL = DATA.edition === "local";
/* 本文中の「要確認」「要原本照合」を目立たせる（エスケープ後の文字列に使う） */
/* 確認の段階：要確認・要原本照合（未確認・朱）→ 翻刻確認（金茶）→ 院長確認（松葉）。読み：社員案・訳：社員案（藍） */
var FLAG_RE = /（(要確認|要原本照合)）|(要確認|要原本照合)/g;
var MARK_RE = /（(要確認|要原本照合|翻刻確認|院長確認|読み：社員案|訳：社員案)）|(要確認|要原本照合|翻刻確認|院長確認|読み：社員案|訳：社員案)/g;
var MARK_CLASS = {"翻刻確認":" hon", "院長確認":" ok", "読み：社員案":" yomi", "訳：社員案":" yomi"};
function flagify(html){
  return html.replace(MARK_RE, function(_, a, b){ var t = a || b; return '<span class="flag' + (MARK_CLASS[t] || "") + '">' + t + '</span>'; });
}

/* 本文の Markdown を表示用に変換する（### 見出し・**太字**・表・箇条書き・段落のみ） */
function inline(s){ return flagify(esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")); }
function cells(line){ return line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(function(c){ return c.trim(); }); }
var TBL_SEP = /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/;
function md(text){
  var lines = text.split("\n"), out = [], i = 0, m, buf;
  var isBlock = function(l){ return !l.trim() || /^#{3,6}\s/.test(l) || /^\s*\|/.test(l) || /^\s*[-*]\s+/.test(l); };
  while (i < lines.length){
    var l = lines[i];
    if (!l.trim()){ i++; continue; }
    if ((m = l.match(/^#{3,6}\s+(.*)$/))){
      out.push("<h4>" + inline(m[1]) + "</h4>"); i++;
      /* 中身のない小見出し（資料にない項目）には「要確認」を出す */
      var j = i; while (j < lines.length && !lines[j].trim()) j++;
      if (j >= lines.length || /^#{3,6}\s/.test(lines[j])) out.push("<p>" + TODO + "</p>");
      continue;
    }
    if (/^\s*\|/.test(l)){
      buf = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) buf.push(lines[i++]);
      var head = buf.length > 1 && TBL_SEP.test(buf[1]) ? cells(buf[0]) : null;
      var rows = buf.filter(function(r, j){ return !(head && j < 2); });
      out.push('<div class="tbl"><table>' +
        (head ? "<thead><tr>" + head.map(function(c){ return "<th>" + inline(c) + "</th>"; }).join("") + "</tr></thead>" : "") +
        "<tbody>" + rows.map(function(r){ return "<tr>" + cells(r).map(function(c, j){
          /* data-label：カード表示のときに列名を出す。blank：中身が「—」だけの欄はカードでは隠す */
          return "<td" + (head && head[j] ? ' data-label="' + esc(head[j]) + '"' : "") + (/^[—-]?$/.test(c) ? ' class="blank"' : "") + ">" + inline(c) + "</td>";
        }).join("") + "</tr>"; }).join("") +
        "</tbody></table></div>");
      continue;
    }
    if (/^\s*[-*]\s+/.test(l)){
      buf = [];
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) buf.push("<li>" + inline(lines[i++].replace(/^\s*[-*]\s+/, "")) + "</li>");
      out.push("<ul>" + buf.join("") + "</ul>");
      continue;
    }
    buf = [];
    while (i < lines.length && !isBlock(lines[i])) buf.push(inline(lines[i++]));
    out.push("<p>" + buf.join("<br>") + "</p>");
  }
  return out.join("");
}
function countFlags(e){
  return DATA.sections.reduce(function(n, k){ return n + (e["本文"][k].match(FLAG_RE) || []).length; }, 0);
}

function renderList(){
  var q = norm($("#q").value);
  var hits = DATA.entries.filter(function(e){ return !q || e._idx.indexOf(q) !== -1; });
  if (!DATA.entries.length){
    $("#count").textContent = "";
    $("#list").innerHTML = '<div class="listempty"><div class="big">🌼</div>まだ方剤が登録されていません<br>entries/ に方剤を足して build.py を実行してください</div>';
    return;
  }
  $("#count").textContent = q ? "該当 " + hits.length + " 件" : "方剤 " + hits.length + " 件";
  if (!hits.length){
    $("#list").innerHTML = '<div class="listempty"><div class="big">🔍</div>見つかりません</div>';
    return;
  }
  $("#list").innerHTML = hits.map(function(e){
    var sub = [e["読み"], e["出典"]].filter(Boolean).join("　");
    return '<button class="al" data-f="' + esc(e.file) + '">' +
      '<span class="num">' + (e["ツムラ番号"] ? esc(e["ツムラ番号"]) : "—") + '</span>' +
      '<span class="am"><span class="an" style="display:block">' + esc(e["名前"]) + '</span>' +
      '<span class="ax" style="display:block">' + (sub ? esc(sub) : "読み・出典 要確認") + '</span></span></button>';
  }).join("");
}

function renderDetail(e){
  var h = '<button class="back" onclick="history.length>1?history.back():go(\'\')">‹ 一覧へ</button>';
  h += '<div class="dhead"><h2>' + esc(e["名前"]) + '</h2>' +
    '<div class="yomi">' + (e["読み"] ? esc(e["読み"]) : TODO) + (e["別名"] ? '　別名 ' + esc(e["別名"]) : '') + '</div>' +
    '<div class="tags"><span class="pill num">ツムラ ' + (e["ツムラ番号"] ? esc(e["ツムラ番号"]) : "要確認") + '</span>' +
    '<span class="pill src">' + (e["出典"] ? esc(e["出典"]) : "出典 要確認") + '</span>' +
    (countFlags(e) ? '<span class="pill flagcount">要確認・要照合 ' + countFlags(e) + '</span>' : '') + '</div></div>';
  DATA.sections.forEach(function(k){
    var v = e["本文"][k], priv = e["非公開"].indexOf(k) !== -1;
    var body = v ? md(v) : (priv ? '<span class="privnote">手元版のみ</span>' : TODO);
    h += '<div class="sec' + (k === "条文" ? " jobun" : "") + (priv && LOCAL ? " priv" : "") + '"><h3>' + esc(k) +
      (priv && LOCAL ? '<span class="privbadge">非公開を含む</span>' : '') + '</h3>' +
      '<div class="body">' + body + '</div></div>';
  });
  $("#v-detail").innerHTML = h;
}

/* 画面の状態は URL ハッシュ（#<方剤ファイル名>）で表す */
function go(f){ location.hash = f ? encodeURIComponent(f) : ""; }
function route(){
  var f = decodeURIComponent(location.hash.slice(1));
  var e = DATA.entries.filter(function(x){ return x.file === f; })[0];
  $("#v-list").classList.toggle("on", !e);
  $("#v-detail").classList.toggle("on", !!e);
  if (e){ renderDetail(e); window.scrollTo(0, 0); }
}
$("#list").addEventListener("click", function(ev){
  var b = ev.target.closest(".al"); if (b) go(b.dataset.f);
});
$("#q").addEventListener("input", function(){ renderList(); if (location.hash) go(""); });
window.addEventListener("hashchange", route);
$("#built").textContent = "データ更新 " + DATA.built + (LOCAL ? "（手元版）" : "");
$("#edition").hidden = !LOCAL;
renderList(); route();
</script>
</body>
</html>

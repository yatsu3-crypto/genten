5味（PMDA 添付文書 2023年12月改訂 第1版で確認）。添付文書に出典の欄はない", "構成": "柴胡・黄芩・黄柏・黄連・栝楼根・甘草・桔梗・牛蒡子・山梔子・地黄・芍薬・川芎・当帰・薄荷・連翹", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "桂枝人参湯", "名前": "桂枝人参湯", "読み": "けいしにんじんとう", "ツムラ番号": "82", "出典": "傷寒論（巻第四・弁太陽病脈証并治下第七）", "本文": {"条文": "### 『傷寒論』巻第四・弁太陽病脈証并治下第七\n\n**書き下し**（読み：社員案）\n太陽病、外証未だ除かざるに、而るに数（しばしば）之を下し、遂に協熱して利し、利下止まず、心下痞鞕し、表裏解せざる者は、桂枝人参湯之を主る。\n\n**原文**（翻刻確認）\n太陽病，外證未除，而數下之，遂協熱而利，利下不止，心下痞鞕，表裏不解者，桂枝人參湯主之。\n\n**現代語訳**（訳：社員案）\n太陽病で外証（表の証）がまだ除かれていないのに、何度も下したため、ついに熱を挟んで（協熱して）下痢し、下痢が止まらず、みぞおちがつかえて硬く、表も裏も解けていないものは、桂枝人参湯がこれを主治する。\n\n### 注記\n- 『注解傷寒論』の四庫全書本（書名『傷寒論注釋』）巻四では「協」が「恊」と書かれる（字体の違い）。ほかの字は宋本と同じ（翻刻確認）\n- 『金匱玉函経』巻第三・弁太陽病形証治下第四の翻刻では「遂挾熱而利不止，心下痞堅」と書かれ、「協熱」が「挾熱」、「利下不止」が「利不止」、「痞鞕」が「痞堅」となる（要原本照合）\n- 『金匱玉函経』巻第六・弁発汗吐下後病形証治第十九の再掲は「遂挾熱利而不止，心下痞堅，表裡不解，屬桂枝人參湯證」と書かれる（要原本照合）\n- 『千金翼方』巻第九・傷寒上・太陽病用陥胸湯法第六の桂枝人参湯の条は「遂に挟熱して」と書かれ、協熱の「協」は一般にこれに拠って「挟む」の意と解される（要原本照合）", "出典": "### 原典の構成\n- 『傷寒論』（宋本）：桂枝4両（別切）、甘草4両（炙）、白朮3両、人参3両、乾姜3両（翻刻確認）\n- 『金匱玉函経』巻第七・方薬炮製（桂枝人参湯方第十四）：桂枝・甘草（炙）各4両、人参・白朮・乾姜各3両（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』（宋本）：5味のうち、まず4味を水9升で煮て5升を取り、桂を入れて更に煮て3升を取り、滓を去り、1升を温服する。日に2回、夜に1回服す（翻刻確認）\n- 『金匱玉函経』：水9升で4味を煮て5升を取り、滓を去り、桂を入れて更に煮て3升を取り、滓を去り、1升を温服する。日に2回、夜に1回服す（翻刻確認）\n\n### 処方の変遷\n- 『傷寒論』の理中丸の湯法（人参・乾姜・甘草（炙）・白朮 各3両）に桂枝4両を加え、甘草を4両に増した構成（翻刻確認）\n- 『注解傷寒論』は「桂枝・甘草を理中湯に加う」とする（翻刻確認）\n- 『千金翼方』巻第九・傷寒上・太陽病用陥胸湯法第六にも桂枝人参湯として載る（要原本照合）\n- 『太平聖恵方』巻第十二・治傷寒心腹痞満諸方では、桂心・甘草・白朮・人参・乾姜を散として煎服する（要原本照合）\n- 逆挽湯（名古屋玄医）は本方に枳実・茯苓を加えた方で、『梧竹楼方函口訣』は本方を祖として組んだ方とする（要原本照合）\n- 現行エキス剤（ツムラ82）は 桂皮・甘草・蒼朮・人参・乾姜 の5味で、1日量7.5g中 ケイヒ4.0・カンゾウ3.0・ソウジュツ3.0・ニンジン3.0・カンキョウ2.0（g）の混合生薬の乾燥エキスを含む（PMDA 添付文書 2023年12月改訂 第1版で確認）。原典の白朮は蒼朮に、原典の「桂枝」は「ケイヒ」と書かれる。甘草は原典では桂枝と同量の4両だが、エキス剤では人参・蒼朮と同量の3.0g", "構成": "桂皮・甘草・蒼朮・人参・乾姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "滋陰至宝湯", "名前": "滋陰至宝湯", "読み": "じいんしほうとう", "ツムラ番号": "92", "出典": "万病回春（巻之六・婦人科・虚労）／古今医鑑（巻之十一・婦人科・虚労）", "本文": {"条文": "### 『万病回春』巻之六・婦人科・虚労\n\n**書き下し**（読み：社員案）\n虚労にて熱嗽し汗有る者。滋陰至宝湯　婦人の諸虚百損、五労七傷、経脈調わず、肢体羸瘦するを治す。此の薬、専ら経水を調え、血脈を滋し、虚労を補い、元気を扶け、脾胃を健やかにし、心肺を養い、咽喉を潤し、頭目を清し、心慌を定め、神魄を安んじ、潮熱を退け、骨蒸を除き、喘嗽を止め、痰涎を化し、盗汗を収め、泄瀉を住め、鬱気を開き、腹痛を療し、胸膈を利し、煩渇を解し、寒熱を散じ、体疼を祛る。甚だ奇効有り。\n\n**原文**（翻刻確認）\n虛勞熱嗽有汗者。滋陰至寶湯　治婦人諸虛百損、五勞七傷、經脈不調、肢體羸瘦。此藥專調經水、滋血脈、補虛勞、扶元氣、健脾胃、養心肺、潤咽喉、清頭目、定心慌、安神魄、退潮熱、除骨蒸、止喘嗽、化痰涎、收盜汗、住泄瀉、開鬱氣、療腹痛、利胸膈、解煩渴、散寒熱、祛體疼、甚有奇效。\n\n**現代語訳**（訳：社員案）\n虚労で熱があって咳をし、汗の出るもの。滋陰至宝湯は、婦人のさまざまな虚損や五労七傷で、月経が整わず、手足や体がやせ衰えたものを治す。この薬はもっぱら月経を整え、血脈を潤し、虚労を補い、元気を助け、脾胃を丈夫にし、心肺を養い、咽喉を潤し、頭や目をすっきりさせ、胸のざわつきを鎮め、精神を安らかにし、潮熱を退け、骨蒸（骨の内から蒸されるような熱）を除き、喘ぎや咳を止め、痰を消し、盗汗を収め、下痢を止め、鬱した気を開き、腹痛を治し、胸のつかえを通じ、煩わしい口渇を解き、寒気と熱を散らし、体の痛みを除く。たいへんよく効く。\n\n### 『古今医鑑』巻之十一・婦人科・虚労\n\n**書き下し**（読み：社員案）\n済陰至宝丹（雲林製す）　婦人の諸虚百損、五労七傷、経脈調わず、肢体羸瘦するを治す。此の薬、専ら経水を調え、血脈を滋し、虚労を補い、元気を扶け、脾胃を健やかにし、心肺を養い、咽喉を潤し、頭目を清し、心悸を定め、神魂を安んじ、潮熱を退け、骨蒸を除き、喘嗽を止め、痰涎を化し、盗汗を収め、泄瀉を止め、鬱気を開き、胸膈を利し、腹痛を療し、煩渇を解し、寒熱を散じ、体疼を祛る。大いに奇効有り、尽くは述ぶべからず。\n\n**原文**（翻刻確認）\n濟陰至寶丹（雲林製）　治婦人諸虛百損、五勞七傷、經脈不調、肢體羸瘦。此藥專調經水、滋血脈、補虛勞、扶元氣、健脾胃、養心肺、潤咽喉、清頭目、定心悸、安神魂、退潮熱、除骨蒸、止喘嗽、化痰涎、收盜汗、止泄瀉、開鬱氣、利胸膈、療腹痛、解煩渴、散寒熱、祛體疼、大有奇效、不可盡述。\n\n**現代語訳**（訳：社員案）\n済陰至宝丹（雲林の作）は、婦人のさまざまな虚損や五労七傷で、月経が整わず、手足や体がやせ衰えたものを治す。この薬はもっぱら月経を整え、血脈を潤し、虚労を補い、元気を助け、脾胃を丈夫にし、心肺を養い、咽喉を潤し、頭や目をすっきりさせ、動悸を鎮め、精神を安らかにし、潮熱を退け、骨蒸を除き、喘ぎや咳を止め、痰を消し、盗汗を収め、下痢を止め、鬱した気を開き、胸のつかえを通じ、腹痛を治し、煩わしい口渇を解き、寒気と熱を散らし、体の痛みを除く。たいへんよく効き、言い尽くせない。\n\n### 注記\n- 『万病回春』の条は「虚労にて熱嗽し汗有る者」の見出しの下に、逍遙散に続けて載る（翻刻確認）\n- 『古今医鑑』の方名は、維基文庫の翻刻では「済陰至宝丹」。資料は、同書巻之十一・婦人科虚労では滋陰至宝湯で、方名の下に「雲林製」とあり、八巻本では巻之六・婦人虚労に済陰至宝湯として載るとする（要原本照合）\n- 『万病回春』の「定心慌」「安神魄」「住泄瀉」は、『古今医鑑』では「定心悸」「安神魂」「止泄瀉」（要原本照合）\n- 『万病回春』の翻刻は「開鬱氣、療腹痛、利胸膈」の順で、「甚有奇效」で終わる。資料が引く『万病回春』の条は「鬱気を開き、胸膈を利し、腹痛を療し」の順で、「大いに奇効有り。尽くは述ぶる能わず」で終わる（要原本照合）\n- 『古今医鑑』の「大有奇效、不可盡述」は、資料では『万病回春』の「尽くは述ぶる能わず」に対して「尽くは述ぶべからず」とされる（要原本照合）\n- 維基文庫の『萬病回春』は簡体字の本、『古今醫鑒』は簡体字から機械的に直した本（繁体化）で、原文は社員が繁体字にそろえた。字形は要原本照合", "出典": "### 原典の構成\n- 『万病回春』：当帰（酒洗）・白朮（芦を去る）・白芍（酒炒）・白茯苓（皮を去る）・陳皮・知母（生用。最も能く虚中の火を瀉す）・貝母（心を去る）・香附（童便炒）・地骨皮（骨を去る）・麦門冬（心を去る） 各8分、薄荷・柴胡（酒炒）・甘草 各3分（翻刻確認）\n- 『古今医鑑』：当帰（酒洗）1銭、白芍（酒炒）8分、白茯（皮を去る）8分、白朮（芦を去る）1銭、陳皮8分、知母（最も能く虚中の火を瀉す。生用）8分、貝母（心を去る）8分、香附（便制）8分、柴胡（酒炒）3分、薄荷3分、地骨皮（皮を去る）8分、甘草3分、麦門冬（心を去る）8分（翻刻確認）\n- 『万病回春』の当帰・白朮は8分、『古今医鑑』は1銭。地骨皮の修治は『万病回春』が「骨を去る」、『古今医鑑』が「皮を去る」（要原本照合）\n\n### 原典の服用法\n- 『万病回春』：1剤に刻み、煨生姜3片を用いて水で煎じ、温服する（翻刻確認）\n- 『古今医鑑』：1剤に刻み、煨生姜3片を用いて水で煎じ、温服する（翻刻確認）\n\n### 処方の変遷\n- 逍遙散に陳皮・貝母・香附子・地骨皮・知母・麦門冬を加えた方。逍遙散の出典は『太平恵民和剤局方』巻之九・婦人諸疾（附産図）（要原本照合）\n- 『世医得効方』巻十五・産科兼婦人雑病科・煩熱には逍遙散が載り、白茯苓・白朮・当帰・白芍薬・北柴胡・甘草を姜・麦門冬で煎じ、「一方には知母・地骨皮を加う」とある（要原本照合）\n- 本方の出典は従来『万病回春』巻之六・婦人科・虚労とされる。『古今医鑑』巻之十一・婦人科・虚労にも同じ13味の方が「雲林製」として載る（翻刻確認）。『古今医鑑』の収載が『万病回春』より早いとされる（要確認）\n- 龔廷賢の『雲林神彀』巻之三・婦人科虚労には「滋陰至宝」として薬味だけが挙がる。『寿世保元』庚集七巻・婦人科虚労には『万病回春』と同じ条文・薬味の方が済陰至宝丹の名で載る（要原本照合）\n- 『済世全書』巻之六・婦人科調経の済陰至宝丹は同名だが、薬味が大きく異なる（要原本照合）\n- 現行エキス剤（ツムラ92）は 香附子・柴胡・地骨皮・芍薬・知母・陳皮・当帰・麦門冬・白朮・茯苓・貝母・甘草・薄荷 の13味で、原典の煨生姜は入らない（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "香附子・柴胡・地骨皮・芍薬・知母・陳皮・当帰・麦門冬・白朮・茯苓・貝母・甘草・薄荷", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "滋陰降火湯", "名前": "滋陰降火湯", "読み": "じいんこうかとう", "ツムラ番号": "93", "出典": "万病回春（巻之四・虚労）", "本文": {"条文": "### 『万病回春』巻之四・虚労\n\n**書き下し**（読み：社員案）\n陰虚火動し、発熱咳嗽し、吐痰喘急し、盗汗して口乾くを治す。此の方、六味地黄丸と相兼ねて之を服すれば、大いに虚労を補う。神効あり。\n\n**原文**（翻刻確認）\n治陰虛火動、發熱咳嗽、吐痰喘急、盜汗口乾。此方與六味地黃丸相兼服之、大補虛勞、神效。\n\n**現代語訳**（訳：社員案）\n陰が虚して火が動き、発熱して咳をし、痰を吐いて喘ぎが急で、寝汗が出て口が渇くものを治す。この方を六味地黄丸と併せて服用すれば、大いに虚労を補う。すぐれた効き目がある。\n\n### 注記\n- 『万病回春』の翻刻は簡体字の本で、原文は繁体字にそろえて書いた（阴虚→陰虛、盗汗→盜汗、口干→口乾 など）。字形の判断には使えない（要原本照合）\n- 条の前に、虚労の門の見出しの句「虛勞者、陰虛而相火動也（陰虛火動者難治、虛勞不受補者難治）」が置かれる（翻刻確認）\n- 『万病回春』では本方は虚労の門のほか、火証・発熱・失血・眩暈・濁証・遺溺・小便閉などの門にも「方見虛勞」（火証の門では「方見勞瘵」）として挙げられ、門ごとの加減が書かれる（翻刻確認）", "出典": "### 原典の構成\n- 『万病回春』巻之四・虚労：当帰（酒洗）1銭2分、白芍（酒洗）2銭3分、生地黄8分、熟地黄（姜汁炒）・天門冬（去心）・麦門冬（去心）・白朮（去芦） 各1銭、陳皮7分、黄柏（去皮、蜜水炒）・知母 各5分、甘草（炙）5分（翻刻確認）\n\n### 原典の服用法\n- 『万病回春』巻之四・虚労：1剤に刻み、生姜3片・大棗1枚を入れて水で煎じる。服すときに竹瀝・童便・姜汁を少し入れて一緒に服す（翻刻確認）\n- 方後に、骨蒸労熱には地骨皮・柴胡を加える、数剤で熱が退かなければ炒黒乾姜3分を加える、などの加減が続く（翻刻確認）\n\n### 処方の変遷\n- 資料は、本方は元々『十薬神書』（葛可久）の戊字号に胚胎し、『十薬神書』→『明医雑著』→『古今医鑑』→『万病回春』と伝わったとし、戊字号を加減して採用したのは王節斎であるとする（要原本照合）\n- 資料は、『十薬神書』の戊字号（頭注に保真湯）を、労証を治す当帰・人参・生地黄・熟地黄・白朮・黄耆・赤茯苓・白茯苓・甘草・陳皮・厚朴・赤芍薬・白芍薬・天門冬・麦門冬・黄柏・五味子・柴胡・地骨皮・知母の20味を姜・棗で煎服する方とし、『万病回春』の滋陰降火湯の11味はすべてこれに含まれるとする（要原本照合）\n- 『明医雑著』巻一・労瘵に、色欲過度による陰虚火動の病（睡中盗汗・午後発熱・咳嗽など）を治す方として、生地黄（酒洗）・甘草（炙）・乾姜（炮） 各5分、川芎・熟地黄 各1銭、白芍薬（炒）1銭3分、陳皮7分、当帰・白朮 各1銭3分、黄柏（蜜水浸炙）7分、知母（蜜水浸拌炒）・天門冬（去心皮） 各1銭、生姜3片を水で煎じ、空腹時に温服する方が載る（翻刻確認）。竹瀝・童便・姜汁の記載はない（翻刻確認）。同じ労瘵の条の後段に「葛可久《十藥神書》方可次第检用」とある（翻刻確認）\n- 資料は、『明医雑著』のこの方を「主方　補陰瀉火湯」の方名の下に載るとする。維基文庫の翻刻（薛己注本）の該当箇所には方名が見当たらない（要原本照合）\n- 『古今医鑑』（龔信）巻之七・虚労に滋陰降火湯があり、「王節齋曰」として『明医雑著』の労瘵の文を引く。構成は当帰身（酒洗）1銭2分、川芎1銭、白芍薬（酒炒）1銭、生地黄（酒洗）5分、熟地黄（姜汁炒）1銭、天門冬1銭、黄柏（蜜炙）7分、知母（蜜炙）1銭、陳皮7分、白朮1銭3分、乾姜（炒黒）3分、甘草（炙）5分で、生姜で煎じ、竹瀝・童便・姜汁を加えて服す（翻刻確認）\n- 資料は、『古今医鑑』の滋陰降火湯から川芎・乾姜を去り、麦門冬・大棗を加えたものが『万病回春』の方であるとする（要原本照合）。『古今医鑑』と『万病回春』の翻刻の構成を比べると、この違いと一致する（翻刻確認）\n- 資料は、『医便』巻二・夏月諸症治例と『済世全書』巻之四・労瘵にも、構成の異なる滋陰降火湯が載るとする（要原本照合）\n- 資料は、黄柏・知母・甘草は李東垣『蘭室秘蔵』巻之六・自汗門の正気湯で、盗汗を治すとあるとする（要原本照合）\n- 現行エキス剤（ツムラ）は7.5g中、蒼朮3.0g、地黄・芍薬・陳皮・天門冬・当帰・麦門冬 各2.5g、黄柏・甘草・知母 各1.5g の10味（PMDA 添付文書 2023年12月改訂 第1版で確認）。原典の白朮は蒼朮になり、地黄は1品目で、生姜・大棗は入らない。添付文書に出典の欄はない", "構成": "蒼朮・地黄・芍薬・陳皮・天門冬・当帰・麦門冬・黄柏・甘草・知母", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "五虎湯", "名前": "五虎湯", "読み": "ごことう", "ツムラ番号": "95", "出典": "古今医鑑（巻之四・喘急）／仁斎直指附遺方論（巻八・喘嗽・附諸方）", "本文": {"条文": "### 『古今医鑑』巻之四・喘急\n\n**書き下し**（読み：社員案）\n傷寒の喘急を治す。\n\n**原文**（翻刻確認）\n治傷寒喘急。\n\n**現代語訳**（訳：社員案）\n傷寒で、喘いで息が急迫するものを治す。\n\n### 『仁斎直指附遺方論』巻八・喘嗽・附諸方\n\n**書き下し**（読み：社員案）\n五虎湯、喘急・痰気を治す。\n\n**原文**（翻刻確認）\n五虎湯治喘急痰氣\n\n**現代語訳**（訳：社員案）\n五虎湯は、喘いで息が急迫し、痰がからむものを治す。\n\n### 注記\n- 『古今医鑑』では、構成の末尾に桑白皮が「加桑皮」と別に書かれる（翻刻確認）。資料は、原方の薬味は麻黄・杏仁・石膏・甘草・細茶の5味で、桑白皮は一方として加えたものと読む\n- 維基文庫の『古今医鑑』（16巻の本）では、方名の下に批注「按此方治感寒作喘之劑」がある（翻刻確認）。資料は、「按ずるに右方は寒に感じて喘を作すを治するの剤」の句は八巻本の方後にあり、十六巻本には記載がないとする（要原本照合）\n- 維基文庫の『古今医鑑』は「繁体化」の本で、字形の判断には使えない\n- 『古今医鑑』喘急の篇では、方の前の「治」の段の末に、喘には熱喘・冷喘・水喘停飲の三つがあるとする句がある（翻刻確認）。資料は、十六巻本では五虎湯の直前にこの句があるとする\n- 『仁斎直指附遺方論』の条は、巻八・喘嗽の「附諸方」に置かれる（翻刻確認）。維基文庫の四庫全書本は書名を『仁斎直指』とし、巻頭に「宋 楊士瀛 撰」「明 朱崇正 附遺」とある（翻刻確認）\n- 『仁斎直指附遺方論』の篇名「喘嗽証治」は、維基文庫の本では「喘」の次の字が外字になっている（要原本照合）", "出典": "### 原典の構成\n- 『古今医鑑』：麻黄（去節）5銭・杏仁（去皮）2銭・石膏（煨）5銭・甘草1銭・細茶1撮、加桑白皮1銭（原文は「桑皮」）（翻刻確認）\n- 『仁斎直指附遺方論』：麻黄7分・杏仁（去皮尖）1銭・甘草4分・細茶（炒）8分・白石膏1銭5分（翻刻確認）\n\n### 原典の服用法\n- 『古今医鑑』：刻み、生姜3片・葱白3茎を入れて水で煎じ、熱服する（翻刻確認）\n- 『仁斎直指附遺方論』：1服とし、白水で煎じる（翻刻確認）\n\n### 処方の変遷\n- 麻杏甘石湯に桑白皮を加えた方。麻杏甘石湯の出典は『傷寒論』の麻黄杏仁甘草石膏湯（翻刻確認）\n- 『仁斎直指附遺方論』の五虎湯は麻黄・杏仁・甘草・細茶・白石膏の5味で、桑白皮を含まない（翻刻確認）。資料は、これを麻杏甘石湯加細茶とし、本方はまず同書で示され、のちに『古今医鑑』で「加桑皮」と工夫されたとする\n- 資料は、本方は従来『万病回春』が出典とされてきたが、それ以前に『古今医鑑』に載っているとする\n- 『万病回春』巻之二・喘急の五虎湯：麻黄3銭・杏仁（去皮尖、炒）3銭・石膏5銭・甘草1銭・細茶1撮、加桑白皮1銭。痰があれば二陳湯を加えて和す。刻んで1剤とし、生姜3片・葱白3根で煎じて熱服し、のちに小青竜湯加杏仁を用いる（翻刻確認）\n- 資料は、『古今医鑑』には王肯堂訂補の十六巻本と、それ以前の八巻本（万暦4年〔1576〕龔廷賢自序の新刊本）があり、八巻本では巻之二・喘急に収載され、薬味の欄は麻黄・杏仁・石膏・甘草・細茶のみで、方後に「桑白皮一銭半を加えて尤も妙」とあるとする（要原本照合）\n- 『古今医鑑』巻之四・哮吼に五虎二陳湯（雲林製）があり、哮吼・喘急・痰盛を治し、麻黄・杏仁・石膏・橘皮・半夏・茯苓・甘草・人参・木香・沈香・細茶を、生姜・葱白・蜜を入れて水煎する（翻刻確認）。桑白皮は入らない。資料は、これを五虎湯の原方に元々桑白皮が入っていなかったことの傍証とする（資料は蜜に触れていない）\n- 資料は、『傷寒総病論』巻第四の「煩喘を定むる麻黄甘草湯」（麻黄・杏仁・桑白皮・甘草）を本方去石膏とし、麻杏甘石湯にこの方を合方したものが本方という解釈も成り立つとする（要原本照合）\n- 現行エキス剤（ツムラ95）は 石膏10.0・杏仁4.0・麻黄4.0・桑白皮3.0・甘草2.0g の5味で、細茶は入らない（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "石膏・杏仁・麻黄・桑白皮・甘草", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "柴朴湯", "名前": "柴朴湯", "読み": "さいぼくとう", "ツムラ番号": "96", "出典": "本朝経験方", "本文": {"条文": "", "出典": "### 原典の構成\n\n### 原典の服用法\n\n### 処方の変遷\n- 小柴胡湯と半夏厚朴湯の合方で、資料の出典欄は「本朝経験方」（日本の経験方）。資料は、もとの2方の原典には合方投与の記載はないとする\n- 小柴胡湯の出典は『傷寒論』（弁太陽病脈証并治中第六ほか）、半夏厚朴湯の出典は『金匱要略』婦人雑病脈証并治第二十二（翻刻確認）。資料は小柴胡湯の出典に『金匱要略』も挙げる\n- 『外台秘要方』巻七・心腹脹満及鼓脹方に、心腹脹満を療する柴胡厚朴湯（柴胡・厚朴・茯苓・橘皮・紫蘇・生姜・檳榔の7味）がある（翻刻確認）。方名は柴胡と厚朴によるが、構成は今日の柴朴湯と異なる\n- 戴元礼『証治類方』巻七・寒熱門・瘧には「柴朴湯」の方名だけがあって薬味を欠き、同じく『証治要訣』巻七・寒熱門・瘧寒熱にも柴朴湯が出るが薬味は不明とされる（要原本照合）\n- 『証治準縄』類方・巻二十・諸中門・瘧の柴朴湯は、柴胡・独活・前胡・黄芩・蒼朮・厚朴・陳皮・半夏麹・白茯苓・藿香・甘草で、生姜を方後に加えるとされる（要原本照合）\n- 『祖剤』巻之一・仲景小柴胡湯に「《和剤》柴朴湯」として、柴平湯から人参を去り独活・前胡・茯苓・藿香を加え瘧を治す方が載るが、『和剤局方』には柴朴湯は見当たらないとされる（要原本照合）\n- 北山友松子編『衆方規矩刪補』巻之上・小柴胡湯の加減方に柴朴湯（風湿・諸瘧を治す）が引かれ、『衆方規矩』ではこの方は削られているとされる（要原本照合）\n- 湯本求真『皇漢医学』第弐巻に、小柴胡湯に半夏厚朴湯を合用する記載があるとされる（要原本照合）\n- 『漢方治療の方証吟味』に、小柴胡湯合半夏厚朴湯を柴朴湯と名付けて用いるとの記載があり、資料はこれを今日の柴朴湯の方名の由来とする（要原本照合）\n- 現行エキス剤（ツムラ96）は 柴胡7.0・半夏5.0・茯苓5.0・黄芩3.0・厚朴3.0・大棗3.0・人参3.0・甘草2.0・蘇葉2.0・生姜1.0g の10味（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "柴胡・半夏・茯苓・黄芩・厚朴・大棗・人参・甘草・蘇葉・生姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["出典", "構成", "方意", "諸家の論"]}, {"file": "黄耆建中湯", "名前": "黄耆建中湯", "読み": "おうぎけんちゅうとう", "ツムラ番号": "98", "出典": "金匱要略（血痺虚労病脈証并治第六）", "本文": {"条文": "### 『金匱要略』血痺虚労病脈証并治第六\n\n**書き下し**（読み：社員案）\n虚労、裏急、諸の不足は、黄耆建中湯之を主る。\n\n（原注）小建中湯の内に於いて黄耆一両半を加え、余は上法に依る。気短、胸満する者は生姜を加え、腹満する者は棗を去り茯苓一両半を加う。及び肺の虚損不足を療し、気を補うには半夏三両を加う。\n\n**原文**（翻刻確認）\n虛勞裏急、諸不足、黃耆建中湯主之。\n\n（原注）於小建中湯內加黃耆一兩半、餘依上法。氣短胸滿者加生薑、腹滿者去棗加茯苓一兩半、及療肺虛損不足、補氣加半夏三兩。\n\n**現代語訳**（訳：社員案）\n虚労で、裏急（腹がひきつれる）があり、もろもろの不足があるものは、黄耆建中湯が主治する\n\n（原注）小建中湯に黄耆1両半を加え、ほかは前の小建中湯の法に従う。息切れして胸が張るものには生姜を加え、腹が張るものには大棗を去って茯苓1両半を加える。肺の虚損・不足を治して気を補うには半夏3両を加える\n\n### 注記\n- 原注は条文に続く小字双行の注（資料の記載）\n- 原典の構成の小建中湯の甘草は、『金匱要略』の小建中湯方では3両（翻刻確認）、『傷寒論』（宋本）の小建中湯方では2両（要原本照合）。本文は『金匱要略』の値をとった", "出典": "### 原典の構成\n- 小建中湯（桂枝3両（去皮）・甘草3両（炙）・大棗12枚・芍薬6両・生姜3両・膠飴1升）に黄耆1両半を加える（翻刻確認）\n- 加減：気短・胸満には生姜を加える。腹満には大棗を去り茯苓1両半を加える。肺の虚損・不足を治し気を補うには半夏3両を加える（翻刻確認）\n\n### 原典の服用法\n- 小建中湯の法に依る：水7升で煮て3升を取り、滓を去り、膠飴を入れて再び弱火にかけて溶かし、1升を温服、日に3回（翻刻確認）\n- 小建中湯の条の注に、嘔家には甘いため建中湯を用いてはならないとある（翻刻確認）\n\n### 処方の変遷\n- 原典の注のとおり、小建中湯に黄耆を加えた方（翻刻確認）\n- 『備急千金要方』第十九・腎蔵・補腎第八の黄耆建中湯方には、嘔には生姜を倍にし、腹満には大棗を去り茯苓4両を加える加減法が付く（要原本照合）\n- 『太平恵民和剤局方』巻之五・補虚損（附 骨蒸）の黄耆建中湯は、白芍薬・肉桂・黄耆・甘草を生姜・大棗で煎じ、餳を少し入れて再び煎じる（要原本照合）\n- 『仁斎直指附遺方論』巻三・湿・中湿証治の黄耆建中湯は、黄耆・辣桂・甘草・白芍薬で、膠飴を用いない（要原本照合）\n- 『万安方』（梶原性全）巻第十四上・虚労門上・諸虚労通薬の黄耆建中湯（良験方）は、白芍薬・黄耆・桂心・甘草を生姜・大棗で煎じ、飴を少し入れて溶かす（要原本照合）\n- 『万安方』巻十四下の黄耆建中湯（必用方）は、乾大棗・生姜・黄耆・甘草・官桂・白芍薬・人参・半夏で、膠飴または糯米餳を入れる（要原本照合）\n- 『衆方規矩』（曲直瀬道三原著・曲直瀬玄朔増補）巻之中・自汗盗汗の黄耆建中湯は膠飴を用いない（要原本照合）\n- 『療治経験筆記』（津田玄仙）巻之五・六・汗門の黄耆建中湯は、黄耆・桂・芍薬・生姜・大棗・膠飴で甘草を用いない（要原本照合）\n- 『普済本事方』（許叔微）巻第八・傷寒時疫上に、建中湯に当帰・黄耆を加えた黄耆建中加当帰湯がある（要原本照合）\n- 『千金要方』に引かれる『古今録験方』の加減（乾姜を生姜に代え当帰4両を加える）は、実際上は華岡青洲の帰耆建中湯にあたると資料はする（要確認）\n- 現行エキス剤（ツムラ98）は 芍薬・黄耆・桂皮・大棗・甘草・生姜 の混合生薬の乾燥エキスに膠飴（日局コウイ）を加えたもの。1日量は芍薬6.0・黄耆4.0・桂皮4.0・大棗4.0・甘草2.0・生姜1.0g、コウイ10.0g（PMDA 添付文書 2023年12月改訂で確認）", "構成": "芍薬・黄耆・桂皮・大棗・甘草・生姜・膠飴", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "酸棗仁湯", "名前": "酸棗仁湯", "読み": "さんそうにんとう", "ツムラ番号": "103", "出典": "金匱要略（血痹虚労病脈証并治第六）", "本文": {"条文": "### 『金匱要略』血痹虚労病脈証并治第六\n\n**書き下し**（読み：社員案）\n虚労、虚煩して眠るを得ざるは、酸棗仁湯之を主る。\n\n**原文**（翻刻確認）\n虚労虚煩不得眠、酸棗仁湯主之。\n\n**現代語訳**（訳：社員案）\n虚労で、虚煩して眠ることができないものは、酸棗仁湯がこれを主治する。\n\n### 注記\n- 方名：維基文庫の『金匱要略』の翻刻は「酸棗仁湯主之」「酸棗仁湯方」。四部叢刊本（明・俞橋刊本の影印）の翻刻は「酸棗湯主之」「酸棗湯方」で、資料も原典での方名を酸棗湯とする（要原本照合）。本文は維基文庫の『金匱要略』の字を採った\n- 字体：翻刻は「虛勞」（四部叢刊本は「虚劳」）。本文は新字体にした\n- 方の末尾の小字「深師有生薑二兩」（深師には生姜2両がある）は両方の翻刻にある（翻刻確認）", "出典": "### 原典の構成\n- 『金匱要略』：酸棗仁2升、甘草1両、知母2両、茯苓2両、芎藭2両。原注に「深師には生姜2両有り」（翻刻確認）\n- 酸棗仁の量は、四部叢刊本の翻刻では1升（要原本照合）。四部叢刊本の翻刻は知母を「知毋」と書く\n\n### 原典の服用法\n- 『金匱要略』：5味を水8升で、まず酸棗仁を煮て6升とし、諸薬を入れて煮て3升を取り、3回に分けて温服する（翻刻確認）\n\n### 処方の変遷\n- 『備急千金要方』巻第十二・胆腑・胆虚実第二の酸棗湯は、酸棗人・人参・桂心・生姜・石膏・茯苓・知母・甘草で、原典の方から川芎を去り人参・桂心・生姜・石膏を加えた方（要原本照合）\n- 『外台秘要方』第十七巻・虚労下・虚労虚煩不得眠方の深師小酸棗湯は、酸棗人・知母・生姜・甘草・茯苓・芎藭で、原典の方に生姜を加えた方（原注にいう深師の方）。方後に「一方には桂2両を加う」（要原本照合）\n- 『太平聖恵方』巻第三・治胆虚不得睡諸方には、酸棗仁1味を散とし竹葉湯で調下する方がある（要原本照合）\n- 『傷寒活人書』巻第十八の酸棗湯は、原典の5味に乾姜・麦門冬を加えた方（要原本照合）\n- 『医塁元戎』巻九・少陰証の活人酸棗仁湯も原典の方に麦門冬・乾姜を加えた方で、ここには『金匱要略』の方そのものは載っていない（要原本照合）\n- 『聖済総録』巻第四十二・胆門の胆熱多睡の酸棗仁湯、『万病回春』巻之四・不寐の酸棗仁湯（酸棗仁・人参・白茯苓）、『景岳全書』巻之十八・不寐の酸棗仁湯・秘伝酸棗仁湯などは、原典とは構成の違う同名の方（要原本照合）\n- 『医方簡義』（王清源）巻四・肝症の酸棗仁湯は、茯神・炙甘草・知母・棗仁・川芎で、肝虚の不眠に用いる。痰があれば姜・半夏・橘紅を加える（要原本照合）\n- 現行エキス剤（ツムラ103）は 酸棗仁10g・茯苓5g・川芎3g・知母3g・甘草1g（PMDA 添付文書、2023年12月改訂）。原典の芎藭は川芎として入る", "構成": "酸棗仁・茯苓・川芎・知母・甘草", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "牛車腎気丸", "名前": "牛車腎気丸", "読み": "ごしゃじんきがん", "ツムラ番号": "107", "出典": "厳氏済生方（水腫論治）", "本文": {"条文": "### 『厳氏済生方』水腫論治（厳用和）\n\n**書き下し**（読み：社員案）\n\n加味腎気丸　腎虚して腰重く脚腫れ、小便利せざるを治す。\n\n右、細末と為し、煉蜜にて丸と為すこと桐子大の如くし、毎服七十丸、空心に米飲にて下す。\n\n**原文**（翻刻確認）\n\n加味腎氣丸　治腎虛腰重脚腫、小便不利。\n\n右為細末、煉蜜為丸如桐子大、每服七十丸、空心米飲下。\n\n**現代語訳**（訳：社員案）\n\n加味腎気丸は、腎が虚して腰が重く、脚がむくみ、小便の出が悪いものを治す。\n\n（服用法）以上を細かい末とし、練った蜂蜜で桐の実ほどの大きさの丸剤とし、1回70丸を空腹時に米の重湯で服す。\n\n### 注記\n- 方名：資料は「加味腎気円」とする。維基文庫の2つの翻刻（四庫全書本と簡体字の本）はどちらも「加味腎気丸」（要原本照合）\n- 「脚腫」：簡体字の本では「脚重」（要原本照合）\n- 「桐子大」：簡体字の本では「梧桐子大」（要原本照合）\n- 『厳氏済生方』の巻：資料は巻之五・水腫論治とする。維基文庫の四庫全書本では卷四・水腫、簡体字の本では水腫門・水腫論治（要原本照合）\n- 原文は四庫全書本の翻刻による。句読点は社員が付けた", "出典": "### 原典の構成\n- 『厳氏済生方』水腫論治：附子（炮）2両、白茯苓・沢瀉・山茱萸（肉を取る）・山薬（炒る）・車前子（酒で蒸す）・牡丹皮（木を去る） 各1両、官桂（火を見ず）・川牛膝（蘆を去り、酒に浸す）・熟地黄 各半両（翻刻確認）\n- 附子の量は簡体字の本の「炮，二两」による。四庫全書本の翻刻では「炮二箇」（要原本照合）\n- 白茯苓の「去皮」の注は簡体字の本にだけあり、四庫全書本にはない（翻刻確認）\n\n### 原典の服用法\n- 『厳氏済生方』：細末とし、煉蜜で桐子大の丸剤とし、1回70丸を空腹時に米飲（重湯）で服す（翻刻確認）\n\n### 処方の変遷\n- 本方は『金匱要略』の腎気丸（八味地黄丸）に牛膝・車前子を加えた方。『金匱要略』では中風歴節病脈証并治第五に崔氏八味丸、血痺虚労病脈証并治第六に八味腎気丸、婦人雑病脈証并治第二十二に腎気丸として載り、いずれも同じ方（翻刻確認）\n- 『金匱要略』の腎気丸は 乾地黄・山薬・山茱萸・沢瀉・牡丹皮・茯苓・桂枝・附子（炮） の8味（翻刻確認）\n- 『厳氏済生方』では「加味腎気丸」の名で、腎虚の腰重・脚腫・小便不利を治す10味の方として載る（翻刻確認）\n- 本方には別名が多く、資料は加味腎気円・加味腎気丸・済生腎気丸・加減済生腎気丸・加味八味丸・金匱腎気丸・加減金匱腎気丸などを挙げる。「牛車腎気丸」の名がどの書に始まるかは資料に記載がない（要確認）\n- 明代の『薛氏医案』（薛己）では加減済生腎気丸・加減金匱腎気丸の名で載り、主治に脾腎の虚、肚腹の腫脹、四肢の浮腫、喘急・痰盛、水症・蠱症が加わるとされる（要原本照合）。『万病回春』巻之四・補益の加減金匱腎気丸も同じ系統とされる（要原本照合）\n- 資料は、『厳氏済生方』の方と『薛氏医案』の方とでは、概ね前者は附子が多く後者は熟地黄・白茯苓が多く、エキス製剤は後者に近いとする（要原本照合）\n- 現行エキス剤（ツムラ107）は 地黄・牛膝・山茱萸・山薬・車前子・沢瀉・茯苓・牡丹皮・桂皮・附子（ブシ末） の10味（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "地黄・牛膝・山茱萸・山薬・車前子・沢瀉・茯苓・牡丹皮・桂皮・附子（ブシ末）", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "三黄瀉心湯", "名前": "三黄瀉心湯", "読み": "さんおうしゃしんとう", "ツムラ番号": "113", "出典": "金匱要略（驚悸吐衄下血胸満瘀血病脈証并治第十六・婦人雑病脈証并治第二十二）", "本文": {"条文": "### 『金匱要略』驚悸吐衄下血胸満瘀血病脈証并治第十六\n\n**書き下し**（読み：社員案）\n心気不足し、吐血・衄血するは、瀉心湯之を主る。\n\n**原文**（翻刻確認）\n心氣不足、吐血、衄血、瀉心湯主之。\n\n**現代語訳**（訳：社員案）\n心気が不足して、吐血や鼻出血をする者は、瀉心湯がこれを主治する。\n\n### 『金匱要略』婦人雑病脈証并治第二十二\n\n**書き下し**（読み：社員案）\n婦人、涎沫を吐す。医反って之を下し、心下即ち痞す。当に先ず其の涎沫を吐するを治すべし。小青竜湯之を主る。涎沫止みて、乃ち痞を治す。瀉心湯之を主る。\n\n**原文**（翻刻確認）\n婦人吐涎沫、醫反下之、心下即痞、當先治其吐涎沫、小青龍湯主之。涎沫止、乃治痞、瀉心湯主之。\n\n**現代語訳**（訳：社員案）\n婦人がよだれや泡状のつばを吐いているのに、医者がかえってこれを下したため、すぐにみぞおちがつかえた。まずその涎沫を吐くのを治すべきで、小青竜湯がこれを主治する。涎沫が止んでから、つかえを治す。瀉心湯がこれを主治する。\n\n### 注記\n- 原典の方名は瀉心湯（翻刻確認）。三黄瀉心湯は後の呼び名\n- 第十六篇の条について、資料は方の後に小字双行で「亦霍乱を治す」とあるとする。維基文庫の『金匱要略』の翻刻にはこの注がない（要原本照合）\n- 第十六篇の「心気不足」は、『備急千金要方』巻第十三の瀉心湯では「心気不定」と書かれるとされる（要原本照合）", "出典": "### 原典の構成\n- 『金匱要略』：大黄2両、黄連1両、黄芩1両（翻刻確認）\n\n### 原典の服用法\n- 『金匱要略』：3味を水3升で煮て1升を取り、頓服する（翻刻確認）\n\n### 処方の変遷\n- 資料の出典欄は「伊尹湯液論、『金匱要略』」。資料は、仲景の方は伊尹の湯液に基づくとする諸書の説を引く（要確認）\n- 『傷寒論』弁太陽病脈証并治下第七の大黄黄連瀉心湯は、大黄2両・黄連1両の2味で、麻沸湯2升に漬けて須臾にして絞り、滓を去って分けて温めて2回に服す（翻刻確認）。資料は、宋本ではこの方の後に林億等の注があり、諸本はみな2味だが、次の附子瀉心湯が大黄・黄連・黄芩・附子を用いるので前の方にも黄芩があったのだろうとする、と引く。維基文庫の宋本の翻刻にはこの注がない（要原本照合）。附子瀉心湯の構成に黄芩1両があることは翻刻で確かめた（翻刻確認）\n- 『備急千金要方』巻第十三・心虚実第二の瀉心湯は、心気不定で吐血・衄血するものを治すとされる。同書巻第十・傷寒発黄第五の三黄散は、黄疸で身体と顔が黄色いものに3味を散または丸として用いるとされる（要原本照合）\n- 『肘後百一方』巻之五・治腸癰肺癰方第三十七では、30年治らない悪瘡に大黄・黄芩・黄連各1両を散とし、瘡を洗って振りかける外用の方が載り、黄柏を等分加えてもよいとされる（要原本照合）\n- 『千金方』巻第二十一・消渇第一の三黄丸は、男子の五労七傷・消渇、婦人の帯下などに用い、季節で分量を変えるとされる。春は黄芩4両・大黄3両・黄連4両、夏は黄芩6両・大黄1両・黄連7両、秋は黄芩6両・大黄2両・黄連3両、冬は黄芩3両・大黄5両・黄連2両（要原本照合）\n- 『傷寒総病論』巻第三・心下痞証、『傷寒活人書』巻第十・巻第十四では、大黄黄連瀉心湯（大黄黄連黄芩瀉心湯）として大黄・黄連・黄芩の3味が示されるとされる（要原本照合）\n- 『太平恵民和剤局方』巻之六・積熱の三黄円は、三焦の積熱（上焦は目の赤い腫れ・口舌の瘡、中焦は胸のもだえ・食欲不振、下焦は尿の赤渋・便秘）や痔疾・鮮血の下血を治すとされる（要原本照合）\n- 『御薬院方』巻之七・治積熱門の三黄丸は、吐血・黄疸・熱病を治すとされる。同書巻之十・治眼目門の消毒散は黄芩・黄柏・大黄で、別の構成（要原本照合）\n- 『医塁元戎』巻三・陽明証では、大黄2両・黄連1両に黄芩を加えて伊尹三黄湯とするとされる（要原本照合）\n- 『衛生宝鑑』巻十三・心下痞では大黄黄連瀉心湯として3味を示し、伊尹湯液論の大黄黄連黄芩湯は3味で、監本に黄芩がないのは脱落とする注があるとされる。同書巻十四・黄疸論の黄連散は大黄・黄連・甘草・黄芩で、本方に甘草を加えた構成（要原本照合）\n- 『張氏医通』巻十六・祖方の伊尹三黄湯は、倉公は火斉湯、『金匱要略』は瀉心湯と名づけるとし、三焦の実熱で煩躁・便秘するものを治すとされる（要原本照合）\n- 賀川玄迪『産論翼』では第二和剤湯と名づけられ、辰砂を加えて用いるとされる（要原本照合）\n- 片倉鶴陵『産科発蒙』巻二・子癇第二の鉄砂三黄湯は、本方に鉄砂を加えた方とされる（要原本照合）\n- 現行エキス剤（ツムラ113）は 黄芩・黄連・大黄 各3.0g の3味で、原典と同じ3味。原典は大黄が黄連・黄芩の倍量で、エキス剤は等量（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "黄芩・黄連・大黄", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "柴苓湯", "名前": "柴苓湯", "読み": "さいれいとう", "ツムラ番号": "114", "出典": "世医得効方（巻二・痎瘧）／太平恵民和剤局方指南総論（巻中・論傷寒証候）", "本文": {"条文": "### 『世医得効方』巻二・痎瘧\n\n**書き下し**（読み：社員案）\n小柴胡湯と五苓散とを合和し、柴苓湯と名づく。傷風・傷暑、瘧を治して大いに効あり。毎服、薑三片、麦門冬二十粒（心を去る）、地骨皮少許にて煎じ、温服す。（方は傷寒熱証類に見ゆ。五苓散の方は傷暑類。）\n\n**原文**（翻刻確認）\n小柴胡湯與五苓散合和、名柴苓湯。治傷風傷暑瘧大效。毎服薑三片、麥門冬二十粒（去心）、地骨皮少許、煎温服。（方見傷寒熱證類、五苓散方傷暑類）\n\n**現代語訳**（訳：社員案）\n小柴胡湯と五苓散を合わせたものを柴苓湯という。傷風・傷暑や瘧を治すのに大いに効がある。1回分ごとに生姜3片、麦門冬20粒（芯を除く）、地骨皮少量を加えて煎じ、温かくして服す。（小柴胡湯の方は傷寒熱証類に、五苓散の方は傷暑類に載る。）\n\n### 『太平恵民和剤局方』指南総論巻中・論傷寒証候\n\n**書き下し**（読み：社員案）\n和解の証候を論ず。傷寒・傷風、往来寒熱し、胸脇の間痛み、乾嘔し及び大便秘する者は、小柴胡湯一貼を用うべし。病重き者は并せて半貼を服して方に効あり。或いは渇を言う者、或いは小便渋るは、兼ねて五苓散を服す。\n\n**原文**（翻刻確認）\n論和解證候。傷寒傷風、往來寒熱、胸脇間痛、乾嘔及大便秘者、可用小柴胡湯一貼。病重者并服半貼方效。或言渇者、或小便澀、兼服五苓散。\n\n**現代語訳**（訳：社員案）\n和解の証候について論じる。傷寒・傷風で、寒熱が往来し、胸脇のあたりが痛み、からえずきがあり、また大便が秘結するものには、小柴胡湯1貼を用いるとよい。病が重いものは、さらに半貼をあわせて服すと効く。あるいは口の渇きを訴えるもの、あるいは尿の出が渋るものは、あわせて五苓散を服す。\n\n### 注記\n- 『世医得効方』の条は、同じ段の藿香正気散の加減の後に続けて書かれる。小柴胡湯・五苓散の分量は書かれず、それぞれ傷寒熱証類・傷暑類の方を見るよう注がある（翻刻確認）。翻刻では小柴胡湯は巻一の傷寒・陽証、五苓散は巻二の傷暑にある\n- 『世医得効方』の門：資料は巻第二・痎瘧・久瘧とする。翻刻では痎瘧の見出しの下で、久瘧の方（丁香煑散など）の後に「通治瘧疾…」の句があり、その後に柴苓湯の条が置かれる（要原本照合）\n- 『世医得効方』の「治傷風傷暑瘧大效」は、傷風・傷暑・瘧を並べて読むか、傷風・傷暑による瘧と読むかを原文からは決めにくい（要確認）。条は痎瘧の門にある（翻刻確認）\n- 『世医得効方』の「毎服」の分量（合和した散を1回に何銭用いるか）は書かれない（翻刻確認）\n- 『太平恵民和剤局方』指南総論の見出しは、維基文庫の四庫全書本の翻刻では「論解和證候」と書かれる（要原本照合）。同じ段の末尾に「乃和解證也」とあり、資料の書き下しも「和解の証候」とするので、「和解」を本文に採った\n- 「證候」の「候」は、翻刻では外字で表されている（要原本照合）\n- 「并服半貼」は、資料の書き下しでは「再び半貼を服して」と読まれる（要原本照合）。「可用小柴胡湯一貼」は、資料の書き下しでは「小柴胡湯一貼を与うべし」と読まれる（要原本照合）\n- 「往」「胸」は、翻刻ではそれぞれ「徃」「胷」と書かれる（字体の違い）\n- 『太平恵民和剤局方』指南総論の条には「柴苓湯」の方名はなく、小柴胡湯に五苓散を兼ねて服す記載である（翻刻確認）\n- 条文の順：『世医得効方』は柴苓湯の方名の出典で、構成は小柴胡湯と五苓散の合和（麦門冬・地骨皮は煎じるときに加える）。『太平恵民和剤局方』指南総論は兼用の記載で、成立は『世医得効方』より早い（資料）。『世医得効方』を先頭にした（要確認）", "出典": "### 原典の構成\n- 『世医得効方』：小柴胡湯と五苓散を合和する。合和の割合は書かれない（翻刻確認）\n- 元の方（『世医得効方』）：小柴胡湯（巻一・傷寒・陽証）は柴胡2両（去蘆）、半夏6銭（湯洗七次）、黄芩・人参（去蘆）・粉草 各3銭。五苓散（巻二・傷暑）は沢瀉2両半、桂心1両、猪苓（去皮）・赤茯苓（去皮）・白朮（去蘆） 各1両半（翻刻確認）\n- 『太平恵民和剤局方』指南総論：小柴胡湯1貼（病が重ければ半貼を併せて服す）と五苓散の兼用。分量の記載はない（翻刻確認）\n\n### 原典の服用法\n- 『世医得効方』：毎服、生姜3片・麦門冬20粒（去心）・地骨皮少許を入れて煎じ、温服する（翻刻確認）\n- 元の方（『世医得効方』）：小柴胡湯は剉散とし、毎5銭を水1盞半に生姜5片・棗1枚を入れて6分まで煎じ、食前に服す。五苓散は末とし、毎服2銭を沸湯で調下し、時を拘らない（翻刻確認）\n\n### 処方の変遷\n- 小柴胡湯と五苓散の合方。資料は、小柴胡湯・五苓散はともに『傷寒論』『金匱要略』を出典とするが、それらの原典には合方投与は記載されていないとする。小柴胡湯・五苓散の条と方は『傷寒論』弁太陽病脈証并治中第六にある（翻刻確認）\n- 『傷寒論』弁太陽病脈証并治中第六の小柴胡湯の方後の加減に「若心下悸、小便不利者、去黄芩、加茯苓四兩」とある（翻刻確認）\n- 資料は、『太平聖恵方』巻第十七・治熱病二日諸方に、熱病二日で頭痛・口苦があり発汗を経ても解さないものに柴胡散（柴胡・人参・甘草・黄芩・赤茯苓・半夏を散とし、葱白・生姜で煎服）を服すとあるとする（要原本照合）\n- 資料は、『三因極一病証方論』巻之四・傷寒証治・小柴胡湯の加減に、心下悸し小便利せざるには茯苓1両を加えるとあり、黄芩の減去の記載はないとする（要原本照合）\n- 資料は、『仁斎直指附遺方論』巻八・声音・声音証治に、小柴胡湯に茯苓を加えて煎じる方があるとし、いずれも五苓散合方の一端をうかがわせるとする（要原本照合）\n- 『太平恵民和剤局方』指南総論巻中に、小柴胡湯を用い、渇や小便が渋るものには五苓散を兼ねて服す記載がある（翻刻確認）。資料は、指南総論は『世医得効方』より約130年早く世に出ており、柴苓湯の先駆的用法とする\n- 『世医得効方』（元・危亦林撰。翻刻確認）巻二で、小柴胡湯と五苓散を合和して柴苓湯と名づける。煎じるときに麦門冬・地骨皮を加える（翻刻確認）。資料は、我が国では通常は麦門冬・地骨皮を加えずに用いているとする\n- 現行の医療用エキス剤（ツムラ114）は 柴胡7.0g、沢瀉・半夏 各5.0g、黄芩・蒼朮・大棗・猪苓・人参・茯苓 各3.0g、甘草・桂皮 各2.0g、生姜1.0g の12味（PMDA 添付文書 2023年12月改訂 第1版で確認）。原典の五苓散の白朮の代わりに蒼朮が入る", "構成": "柴胡・半夏・茯苓・沢瀉・猪苓・蒼朮・人参・黄芩・甘草・大棗・桂皮・生姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "胃苓湯", "名前": "胃苓湯", "読み": "いれいとう", "ツムラ番号": "115", "出典": "医塁元戎（巻四・陽明証）／古今医鑑（巻五・泄瀉）／万病回春（巻三・泄瀉）", "本文": {"条文": "### 『医塁元戎』巻四・陽明証\n\n**書き下し**（読み：社員案）\n五苓・平胃各半の散、生薑にて調服し、心下の水を治す。五苓に石膏・寒水石・甘草を加えて甘露飲と為す。亦た心下の水、並びに飲酒して水瀉する者を治す。生薑にて三五銭を調え、清濁立ちどころに分かる。\n\n**原文**（翻刻確認）\n五苓平胃各半散、生薑調服、治心下水。五苓加石膏寒水石甘草、為甘露飲、亦治心下水並飲酒水瀉者、生薑調三五錢、清濁立分。\n\n**現代語訳**（訳：社員案）\n五苓散と平胃散を半分ずつ合わせた散を、生姜で溶いて服用し、心下の水を治す。五苓散に石膏・寒水石・甘草を加えると甘露飲となり、これも心下の水と、飲酒して水様の下痢をするものを治す。生姜で3〜5銭を溶いて服すと、清濁がたちまち分かれる。\n\n### 『古今医鑑』巻五・泄瀉\n\n**書き下し**（読み：社員案）\n暑に中り湿に傷られ、飲を停め食を夾み、脾胃和せず、腹痛泄瀉し、渇を作し、小便利せず、水穀化せず、陰陽分かれざるを治す。\n\n**原文**（翻刻確認）\n治中暑傷濕、停飲夾食、脾胃不和、腹痛泄瀉、作渴、小便不利、水穀不化、陰陽不分。\n\n**現代語訳**（訳：社員案）\n暑さに当たり湿に傷られ、水飲が停滞したうえに飲食の停滞も挟まり、脾胃が調和せず、腹痛して下痢し、口が渇き、尿の出が悪く、飲食物が消化されず、陰陽が分かれないものを治す。\n\n### 『万病回春』巻三・泄瀉\n\n**書き下し**（読み：社員案）\n泄瀉、清濁分かれざる者は、湿多くして五瀉を成すなり。胃苓湯　脾胃和せず、腹痛泄瀉し、水穀化せず、陰陽分かれざるを治す。\n\n**原文**（翻刻確認）\n泄瀉清濁不分者、濕多成五瀉也。胃苓湯　治脾胃不和、腹痛泄瀉、水穀不化、陰陽不分。\n\n**現代語訳**（訳：社員案）\n泄瀉で清濁が分かれないものは、湿が多くて五種の下痢となったものである。胃苓湯は、脾胃が調和せず、腹痛して下痢し、飲食物が消化されず、陰陽が分かれないものを治す。\n\n### 注記\n- 『医塁元戎』の条には「胃苓湯」の方名がない（翻刻確認）\n- 『医塁元戎』の「瀉」は、維基文庫の本（12巻本・四庫全書本とも）では「㵼」と書かれる（字体の違い）\n- 『医塁元戎』の「生薑調三五錢、清濁立分」が甘露飲だけにかかるのか、五苓平胃各半散にもかかるのかは、原文からは決めにくい（要原本照合）\n- 『万病回春』の胃苓湯の条には、『古今医鑑』の「中暑傷湿、停飲夾食」「作渇、小便不利」の句がない（翻刻確認）\n- 『万病回春』の「泄瀉清濁不分者、湿多成五瀉也」は、泄瀉の門の中で胃苓湯の前に置かれた見出しの句（翻刻確認）\n- 「停飲夾食」の「夾」は、書によって「挾」とも書かれる（要原本照合）。『醫方集解』（清・汪昂）は「停飲夾食」と書く（翻刻確認）\n- 『古今医鑑』の「泄瀉」は、資料の書き下しでは「洩瀉」と書かれる（要原本照合）\n- 『古今医鑑』の巻数は、維基文庫の本では本文が巻之五・泄瀉、冒頭の目次では巻三に洩瀉とある（翻刻確認）。資料は巻之五・泄瀉とする\n- 『古今医鑑』は龔信の撰で、序に「家君暨廷賢所編輯」とあり、子の龔廷賢も編纂に関わる（翻刻確認）。『万病回春』は龔廷賢（明）の著（翻刻確認）", "出典": "### 原典の構成\n- 『医塁元戎』：五苓散・平胃散 各半（翻刻確認）\n- 『古今医鑑』：蒼朮（米泔浸）・厚朴（姜汁炒）・陳皮・猪苓・沢瀉・白朮（炒）・白茯苓・白芍（炒） 各1銭、肉桂・甘草（炙） 各3分（翻刻確認）\n- 『万病回春』：蒼朮（米泔制）・厚朴（姜汁炒）・陳皮・猪苓・沢瀉・白朮（去芦）・茯苓（去皮）・白芍（煨） 各1銭、肉桂・甘草（炙） 各2分（翻刻確認）\n\n### 原典の服用法\n- 『医塁元戎』：散とし、生姜で調服する（翻刻確認）\n- 『古今医鑑』：1剤に刻み、生姜・棗を入れて水で煎じ、温服する（翻刻確認）\n- 『万病回春』：1剤に刻み、生姜・棗を入れて煎じ、空腹時に温服する（翻刻確認）\n\n### 処方の変遷\n- 平胃散と五苓散の合方。資料は、本方の出典は平胃散・五苓散の出典の上に成り立ち、そのうえで芍薬を含むかどうかで二つに分かれるとする\n- 五苓散の出典は『傷寒論』『金匱要略』（翻刻確認）。平胃散の出典は『博済方』『簡要済衆方』（要原本照合）。どちらも資料の出典欄に胃苓湯の出典と並べて挙げられている\n- 芍薬を含まない系統：『医塁元戎』（王好古・元）巻四・陽明証に「五苓平胃各半散」がある。胃苓湯の方名はない（翻刻確認）\n- 資料は、『医塁元戎』の原序に丁酉（1237年）、跋に辛卯（1231年）に成書したが元藁を盗まれて丁酉春に再編したとあり、現在の12巻本は顧遂が嘉靖22年（1543）に刊行し、万暦21年（1593）に屠本畯が重刊したものとする\n- 資料は、『医塁元戎』の一巻本・巻第八・太陰証・平胃散加減例に、平胃散を五苓散と半分ずつ合わせたものを対金飲子とする記載があるとする（要原本照合。維基文庫の四庫全書本12巻には見当たらない）\n- 資料は、羅天益『衛生宝鑑』巻十六・泄痢門・濡泄の対金飲子を、平胃散5銭・五苓散2銭半・草豆蔲5銭を姜・棗で煎服する方とする（要原本照合）\n- 『婦人大全良方』（陳自明）巻八に胃苓散があり、「治夏秋之間脾胃傷冷水穀不分泄瀉不止」「五苓散　平胃散」「右合和薑棗煎空心服妙陳日華方」とある（翻刻確認）。資料はこれを、胃苓湯がもとは胃苓散という方名だった根拠とする\n- 『世医得効方』巻五に「胃苓湯」の名で五苓散と平胃散を合わせて用いる記載がある（翻刻確認）。同書の著者・時代は要確認。分量の「二銭合和」の読み（各2銭か合わせて2銭か）は要原本照合\n- 『丹渓心法』（朱震亨）にも「胃苓湯」の名で五苓散と平胃散を合わせる記載がある（翻刻確認）\n- 資料は、朱佐『類編朱氏集験医方』巻之四・脾胃門の虚腫に、胃苓丸を腫れに用い、木通湯で呑み下す記載があるとする（要原本照合）\n- 『薛氏医案』巻六十では胃苓散とも呼び、末にして蜜丸にしたものを胃苓膏とする（翻刻確認）。資料は、ここの薬味は白朮・茯苓・沢瀉・厚朴・猪苓・陳皮・甘草・桂で、蒼朮を含まないとする（要原本照合）\n- 芍薬を含む系統：『古今医鑑』巻五・『万病回春』巻三の胃苓湯には白芍が入る（翻刻確認）。資料は、芍薬を含む胃苓湯の出典は従来『万病回春』とされてきたが、薬味は両書で同じで、『古今医鑑』の刊行は『万病回春』より11年早いとする\n- 資料は、呉尚黙訂『丹渓手鏡』巻之中・泄瀉二十六の平胃五苓散（平胃散・五苓散・白朮・芍薬・甘草）にも芍薬が入るとし、同書は明の天啓元年（1621）の撰とする（要原本照合）\n- 現行の医療用エキス剤（ツムラ115）は 蒼朮・厚朴・陳皮・猪苓・沢瀉・白朮・茯苓 各2.5g、桂皮2.0g、生姜・大棗 各1.5g、甘草1.0g の11味で、芍薬は入っていない（PMDA 添付文書 2023年12月改訂で確認）\n- 資料の組成欄は、芍薬を括弧で囲んで示し、本方を「五苓散合平胃散（加芍薬）」と説明する。そのうえで、現在は芍薬を配合した医療用エキス製剤はないとする\n- 資料は、かつては芍薬を含まない胃苓湯と含む胃苓湯の両方が医療用エキス製剤として薬価収載されていたが、芍薬を含む製剤は平成24年（2012）3月31日に経過措置期間が終わって薬価削除になった（そのメーカーは一般用漢方製剤として芍薬を含む胃苓湯を販売している）とする。このため資料は、現在の医療用エキス製剤胃苓湯の最終的な出典を『医塁元戎』とする", "構成": "蒼朮・厚朴・陳皮・猪苓・沢瀉・白朮・茯苓・桂皮・生姜・大棗・甘草", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "黄連湯", "名前": "黄連湯", "読み": "おうれんとう", "ツムラ番号": "120", "出典": "傷寒論（弁太陽病脈証并治下第七）", "本文": {"条文": "### 『傷寒論』弁太陽病脈証并治下第七\n\n**書き下し**（読み：社員案）\n傷寒、胸中に熱有り、胃中に邪気有り、腹中痛み、嘔吐せんと欲する者は、黄連湯之を主る。\n\n**原文**（翻刻確認）\n傷寒、胸中有熱、胃中有邪氣、腹中痛、欲嘔吐者、黄連湯主之。\n\n**現代語訳**（訳：社員案）\n傷寒で、胸の中に熱があり、胃の中に邪気があって、腹が痛み、吐きそうになる者は、黄連湯が主治する。\n\n### 注記\n- 宋本の翻刻では、方の服用法の後に林億らの「疑うらくは仲景の方に非ず」の注は見当たらない。資料は原典の後条文の最後にこの注があるとする（要原本照合）\n- 成無己『注解傷寒論』巻第四ではこの注がない（翻刻確認）。資料も同じ指摘をしている\n- 「胸中」は通行本（宋本）の字を採った。四庫全書本の成無己注本では「胷中」と書かれる（要原本照合）\n- 服用法は宋本の「温服、昼三、夜二」を採った。成無己注本では「温服一升、日に三服、夜に二服」と1回量が書かれる（要原本照合）", "出典": "### 原典の構成\n- 『傷寒論』：黄連3両、甘草（炙）3両、乾姜3両、桂枝（去皮）3両、人参2両、半夏（洗）半升、大棗（擘）12枚（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』：7味を水1斗で煮て6升を取り、滓を去って温服する。昼に3回、夜に2回（翻刻確認）\n\n### 処方の変遷\n- 『傷寒論』の半夏瀉心湯（黄連1両・黄芩3両）から黄芩を去り桂枝を加え、黄連を3両に増やした形。徐大椿『傷寒類方』瀉心湯類は「半夏瀉心湯去黄芩加桂枝」とする（半夏瀉心湯の構成は翻刻確認。『傷寒類方』は要原本照合）\n- 『祖剤』巻之一は、伊尹甘草瀉心湯を祖とし、黄連湯を半夏瀉心湯に黄連2両・桂枝3両を加え人参1両を減じた方として載せる。黄芩を去ることには触れない（要原本照合）\n- 東洞は、林億の「仲景の方に非ず」の注にかかわらず『類聚方』に本方を採っている。東洞がこの注のない成無己本を拠りどころにしていたためとされる（要原本照合）\n- 現行エキス剤（ツムラ120）は 半夏・黄連・乾姜・甘草・桂皮・大棗・人参 の7味。半夏6.0g、他の6味は各3.0g（PMDA 添付文書 2023年12月改訂 第1版で確認）。原典の桂枝は桂皮、人参は原典の2両に対し他の薬と同量になっている", "構成": "半夏・黄連・乾姜・甘草・桂皮・大棗・人参", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "三物黄芩湯", "名前": "三物黄芩湯", "読み": "さんもつおうごんとう", "ツムラ番号": "121", "出典": "金匱要略（婦人産後病脈証并治第二十一・千金方の引用）", "本文": {"条文": "### 『金匱要略』婦人産後病脈証并治第二十一・附方（『千金』三物黄芩湯）\n\n**書き下し**（読み：社員案）\n千金三物黄芩湯、婦人草蓐に在りて、自ら発露して風を得、四肢苦だ煩熱するを治す。頭痛する者には小柴胡湯を与え、頭痛まず但だ煩する者は、此の湯之を主る。\n\n**原文**（翻刻確認）\n千金三物黄芩湯，治婦人在草蓐，自發露得風，四肢苦煩熱，頭痛者與小柴胡湯，頭不痛但煩者，此湯主之。\n\n**現代語訳**（訳：社員案）\n『千金』の三物黄芩湯。婦人が産褥にあって、自分から身をさらして風に当たり、手足がひどく煩わしくほてるものを治す。頭痛するものには小柴胡湯を与え、頭痛がなくただ煩わしいものは、この湯が主治する。\n\n### 注記\n- 『金匱要略』の附方に『千金』の方として引かれる（翻刻確認）\n- 維基文庫の『金匱要略』（通行本）の翻刻には婦人産後病篇の附方が載っておらず、条文・構成・服用法は四部叢刊本（明嘉靖俞橋刊本の影印）の翻刻だけで確かめた\n- 「發」「熱」は、四部叢刊本の翻刻では異体字で書かれる（字体の違い。要原本照合）\n- 方後の「蟲」は、四部叢刊本の翻刻では「䖝」と書かれ、「吐」は異体字の画像で示される（字体の違い。要原本照合）\n- 句読点は社員が付けた。「頭痛者與小柴胡湯」を前の句に続けて読むか、新しい句として読むかで書き下しが変わる。社員案は新しい句として読んだ（要確認）", "出典": "### 原典の構成\n- 『金匱要略』：黄芩1両、苦参2両、乾地黄4両（翻刻確認。四部叢刊本の翻刻だけで確かめた）\n\n### 原典の服用法\n- 『金匱要略』：3味を水8升で煮て2升を取り、1升を温服する。多くは虫を吐下する（翻刻確認）\n\n### 処方の変遷\n- 『金匱要略』では婦人産後病脈証并治第二十一の附方に「千金三物黄芩湯」として載る（翻刻確認）\n- 『備急千金要方』巻第三・婦人方中・中風第三に、同じ主治で黄芩・苦参各2両、乾地黄4両として載り、条文の後に「多くは虫を吐下す」とある（要原本照合）\n- 『肘後百一方』巻之二・治傷寒時気温病方第十三に、傷寒で5〜6日以上たった者に苦参2両・黄芩2両・生地黄半斤の方が載る。産褥とは関係のない条（要原本照合）\n- 『備急千金要方』巻第十・傷寒下・傷寒雑治第一の苦参湯は、熱病5〜6日以上を治し、苦参3両・黄芩2両・生地黄8両（要原本照合）\n- 『太平聖恵方』巻第十七・治熱病三日諸方の苦参散は、苦参・黄芩・甘草を煎じて生地黄汁を入れて服す（要原本照合）\n- 『外台秘要方』第三巻・天行病発汗等方に、三物黄芩湯が苦参湯の名で載る（要原本照合）\n- 『婦人大全良方』巻之二十二・産後傷寒方論第一に、原典とほぼ同じ条文で載るが、虫に関する記載はない（要原本照合）\n- 現行エキス剤（ツムラ121）は 地黄・黄芩・苦参 の3味（PMDA 添付文書 2023年12月改訂 第1版で確認。販売名は「三物黄ごん湯」と書かれる）", "構成": "地黄・黄芩・苦参", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "桂枝茯苓丸加薏苡仁", "名前": "桂枝茯苓丸加薏苡仁", "読み": "けいしぶくりょうがんかよくいにん", "ツムラ番号": "125", "出典": "叢桂亭医事小言（巻之七・叢桂亭蔵方・甲字湯の方後）", "本文": {"条文": "### 『叢桂亭医事小言』巻之七・叢桂亭蔵方・甲字湯（方後）\n\n**書き下し**（要原本照合）\n\n**原文**（要原本照合）\n\n**現代語訳**\n\n### 注記\n- 『叢桂亭医事小言』の原文の翻刻は、維基文庫の検索（2026-10-22）では見当たらなかった。資料には書き下しだけがある（要原本照合）\n- 甲字湯は瘀血を治める方とされ、その方後に諸病への加減が並ぶ。その中の、腸癰には薏苡仁を加え、膿がすでにできた者にはさらに大黄を加えるという加減が本方にあたる（要原本照合。資料の論考⑧による）", "出典": "### 原典の構成\n- 『叢桂亭医事小言』：甲字湯に薏苡仁を加える。甲字湯は桂枝茯苓丸に甘草・生姜を加えたもの（要原本照合。資料の論考⑧による。各生薬の分量は資料に記載がない）\n\n### 原典の服用法\n\n### 処方の変遷\n- 資料の出典欄は『金匱要略』『叢桂亭医事小言』の2書を挙げる。桂枝茯苓丸加薏苡仁にあたる方が出るのは『叢桂亭医事小言』で、原南陽の家蔵方の甲字湯の方後に腸癰の加減として載る（要原本照合）\n- 桂枝茯苓丸の出典は『金匱要略』婦人妊娠病脈証并治第二十（翻刻確認）\n- 原典の甲字湯には甘草・生姜が入るとされる（要原本照合。資料の論考⑧による）。現行エキス剤には甘草・生姜は入らない（PMDA 添付文書で確認）\n- 『叢桂亭医事小言』巻之四上・腸癰に、甲字湯に大黄・薏苡仁を加えて与えた症例が載る（要原本照合）\n- 『臨床漢方医典』盲腸炎には甲字湯加薏苡仁が「甲字湯」の名で載る（要原本照合）\n- 厚生労働省医薬食品局の公定の処方名は「桂枝茯苓丸料加薏苡仁」（要確認。資料の論考①による。KEGG DRUG D06950 の名称も桂枝茯苓丸料加薏苡仁）\n- 現行エキス剤（ツムラ125）は 薏苡仁・桃仁・桂皮・茯苓・芍薬・牡丹皮 の6味で、桂枝茯苓丸の5味に薏苡仁を加えたもの（PMDA 添付文書 2023年12月改訂で確認）", "構成": "桂皮・茯苓・牡丹皮・桃仁・芍薬・薏苡仁", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "啓脾湯", "名前": "啓脾湯", "読み": "けいひとう", "ツムラ番号": "128", "出典": "聖済総録／内経拾遺方論（巻之一・二陽病第六）／古今医鑑（巻之十三・傷食）／万病回春（巻之七・泄瀉）", "本文": {"条文": "### 『内経拾遺方論』巻之一・二陽病第六 主肺脾\n\n**書き下し**（要原本照合）\n\n**原文**（要原本照合）\n\n**現代語訳**\n\n### 『古今医鑑』巻之十三・傷食\n\n**書き下し**（読み：社員案）\n啓脾丸　食を消し、泄を止め、吐を止め、疳を消し、黄を消し、脹を消し、腹痛を定め、元気を益し、脾胃を健やかにす。\n\n**原文**（翻刻確認）\n啓脾丸　消食、止泄、止吐、消疳、消黄、消脹、定腹痛、益元気、健脾胃。\n\n**現代語訳**（訳：社員案）\n啓脾丸は、食べたものを消化させ、下痢を止め、嘔吐を止め、疳を消し、黄を消し、腹の張りを消し、腹痛を鎮め、元気を益し、脾胃を丈夫にする。\n\n### 『万病回春』巻之七・小児科・泄瀉\n\n**書き下し**（読み：社員案）\n啓脾丸　食を消し瀉を止め、吐を止め疳を消し、黄を消し脹を消し、腹痛を定め、脾を益し胃を健やかにす。\n\n**原文**（翻刻確認）\n啓脾丸　消食止瀉、止吐消疳、消黄消脹、定腹痛、益脾健胃。\n\n**現代語訳**（訳：社員案）\n啓脾丸は、食べたものを消化させて下痢を止め、嘔吐を止めて疳を消し、黄を消して腹の張りを消し、腹痛を鎮め、脾を益して胃を丈夫にする。\n\n### 注記\n- 『内経拾遺方論』の原文の翻刻は、維基文庫の検索（2026-10-22）では見当たらなかった。資料には啓脾丸の条の書き下しと薬味・用法の要約だけがあり、分量の記載はない（要原本照合）\n- 『内経拾遺方論』の啓脾丸の条には、出所として『経験良方』（資料の引用では《経験良法》）が記される（要原本照合）\n- 『古今医鑑』は「止泄」「益元気、健脾胃」、『万病回春』は「止瀉」「益脾健胃」と書く（翻刻確認）\n- 『万病回春』の維基文庫の本は簡体字で、『古今医鑑』の維基文庫の本は「繁体化」の表示がある。どちらも字形の判断には使えない。本文は新字体にした\n- 『古今医鑑』は龔信の撰、『万病回春』は龔廷賢（明）の著（翻刻確認）", "出典": "### 原典の構成\n- 『内経拾遺方論』：人参・白朮・白茯（苓）・乾山薬・蓮肉・山楂・甘草・陳皮・沢瀉（要原本照合。資料の論考⑥による。各生薬の分量は資料に記載がない）\n- 『古今医鑑』：人参1両、白朮（去芦）1両、山楂（去核取肉、炙）5銭、陳皮（炙）5銭、沢瀉（炙）5銭、甘草（炙）5銭、白茯苓（去皮）1両、乾山薬1両、蓮肉（去心皮）1両（翻刻確認）\n- 『万病回春』：人参・白朮（去芦、炒）・白茯苓・山薬（炒）・蓮肉（去心） 各1両、山楂肉・陳皮・沢瀉・甘草（炙） 各5銭（翻刻確認）\n\n### 原典の服用法\n- 『内経拾遺方論』：細末とし、荷葉を煮た湯で炊いた飯で丸とする（要原本照合。資料の論考⑥による）\n- 『古今医鑑』：細末とし、煉蜜で緑豆大の丸とする。1回30〜40丸を空腹時に米湯で服す。餅にして米飲で研いて溶かして服してもよい。小児が常に食傷の諸疾を患うときに服すとたちまち治る（翻刻確認）\n- 『万病回春』：末とし、煉蜜で梧桐子大の丸とする。1回20〜30丸を空腹時に米湯で服す。米湯で研いて服してもよい。小児が常に傷食を患うときに服すとたちまち治る（翻刻確認）\n- 『万病回春』の「或米湯研下服亦可」の「研下」は、資料の書き下しでは「研化」と書かれる（要原本照合）。『古今医鑑』は「以米飲研化服」（翻刻確認）\n\n### 処方の変遷\n- 資料は、本方を四君子湯に山薬・蓮肉・山楂子・陳皮・沢瀉を加えた処方とする。四君子湯の出典は資料に記載がない（要確認）\n- 資料の出典欄は『聖済総録』『内経拾遺方論』の2書を挙げる。論考（本の294〜300頁）には『聖済総録』の啓脾丸についての記載がない（要確認）\n- 原典はいずれも啓脾丸（丸剤）として載る（翻刻確認。『内経拾遺方論』は要原本照合）\n- 資料は、本方の出典は従来『万病回春』巻之七・泄瀉とされてきたが、『古今医鑑』巻之十三・傷食に同じ条文と薬味があり、その薬味の後に『万病回春』の方後の文とほぼ同じ指示があるとする（翻刻で両書の条を確認）\n- 資料は、『医学入門』巻六・雑病用薬賦・泄瀉の啓脾丸を、人参・白朮・茯苓・山薬・蓮肉 各1両、陳皮・沢瀉・山査・甘草 各5銭を末とし、蜜で弾子大の丸とし、1丸を空腹時に米飲で溶かして服す方とし、『医学入門』の刊年は『古今医鑑』の刊年（1577）の2年前とする（要原本照合）\n- 資料は、張時徹『摂生衆妙方』巻之十・小児門の小児啓脾丸に、『古今医鑑』『医学入門』と同じ薬味が載り、『古今医鑑』はこの書から引いたものとする（要原本照合）\n- 資料は、『扶寿精方』小児門の啓脾丸も同じ薬味で、米湯で溶かして服すとし、同書は嘉靖九年（1530）初刊で『摂生衆妙方』より20年早いとする（要原本照合）\n- 資料は、駱竜吉『内経拾遺方論』巻之一・二陽病第六 主肺脾に啓脾丸があり、点校説明によれば巻之一は駱氏の原著にあたるので、従来の『万病回春』から308年、『摂生衆妙方』から271年さかのぼるとする（要原本照合）\n- 資料は、『済世全書』巻之二・坎集・泄瀉に同じ方が参朮健脾丸の名で載るとし、『万病回春』巻之三・泄瀉の参朮健脾丸は処方内容が異なるとする（要原本照合）\n- 資料は、王璆『是斎百一選方』巻之二・第三門の啓脾元（人参・白朮・青皮・神麹・麦糵・陳皮・厚朴・縮砂仁・乾姜・甘草）を、『内経拾遺方論』の方とは同名異方とする（要原本照合）\n- 現行エキス剤（ツムラ128）は 蒼朮・茯苓 各4.0g、山薬・人参・蓮肉 各3.0g、山査子・沢瀉・陳皮 各2.0g、甘草1.0g の9味で、原典の白朮の代わりに蒼朮が入り、生姜・大棗は入らない（PMDA 添付文書 2023年12月改訂で確認）", "構成": "蒼朮・茯苓・山薬・人参・蓮肉・山査子・沢瀉・陳皮・甘草", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "桂枝加芍薬大黄湯", "名前": "桂枝加芍薬大黄湯", "読み": "けいしかしゃくやくだいおうとう", "ツムラ番号": "134", "出典": "傷寒論（巻第六・弁太陰病脈証并治第十）", "本文": {"条文": "### 『傷寒論』巻第六・弁太陰病脈証并治第十\n\n**書き下し**（読み：社員案）\n本太陽病、医反って之を下し、爾るに因りて腹満し時に痛む者は、太陰に属するなり。桂枝加芍薬湯之を主る。大いに実痛する者は、桂枝加大黄湯之を主る。\n\n**原文**（翻刻確認）\n本太陽病，醫反下之，因爾腹滿時痛者，屬太陰也，桂枝加芍藥湯主之；大實痛者，桂枝加大黃湯主之。\n\n**現代語訳**（訳：社員案）\nもとは太陽病であったのに、医師がかえって下したため、腹が張って時に痛むものは、太陰に属する。桂枝加芍薬湯が主治する。ひどく実して痛むものは、桂枝加大黄湯が主治する。\n\n### 関連条文（続く条）\n\n**書き下し**（読み：社員案）\n太陰の病為る、脈弱く、其の人続いて自ら便利す。設し当に大黄・芍薬を行るべき者は、宜しく之を減ずべし。其の人胃気弱く、動じ易きを以ての故なり。\n\n**原文**（翻刻確認）\n太陰為病，脈弱，其人續自便利，設當行大黃、芍藥者，宜減之，以其人胃氣弱，易動故也。\n\n**現代語訳**（訳：社員案）\n太陰の病で、脈が弱く、その人がひき続き自然に下痢しているとき、もし大黄・芍薬を用いるべき場合でも、量を減らすのがよい。その人は胃気が弱く、動揺しやすいからである。\n\n### 注記\n- 本方は条の後半（大いに実痛する者）に当たる。条の前半は桂枝加芍薬湯の条で、同じ条にまとめて書かれている（翻刻確認）\n- 原典の方名は桂枝加大黄湯（翻刻確認）\n- 『金匱玉函経』巻第四・弁太陰病形証治第七の翻刻では、同じ条が「太陽病，醫反下之，因爾腹滿時痛者，屬太陰也，桂枝加芍藥湯主之。大實痛者，桂枝加大黃湯主之。」で、冒頭の「本」がない（翻刻確認）\n- 『金匱玉函経』巻第六・弁発汗吐下後病形証治第十九の翻刻では「太陽病，醫反下之，因腹滿時痛，為屬太陰，屬桂枝加芍藥湯證，其大實痛，屬桂枝加大黃湯證。」と書かれ、「爾」がなく「為屬太陰」となる（要原本照合）\n- 関連条文は、『金匱玉函経』巻第四の翻刻では「以」がなく「其人胃氣弱易動故也」とし、条の後に小字で「下利，先煎芍藥三沸。」の注がある（翻刻確認）", "出典": "### 原典の構成\n- 『傷寒論』（宋本）巻第六：桂枝3両（去皮）、大黄2両、芍薬6両、甘草2両（炙）、生姜3両（切）、大棗12枚（擘）（翻刻確認）\n- 『金匱玉函経』巻第七・方薬炮製（桂枝加大黄湯方第十三）：桂枝3両、芍薬6両、生姜3両、甘草2両（炙）、大棗12枚、大黄3両（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』（宋本）：6味を水7升で煮て3升を取り、滓を去って1升を温服し、1日3回服す（翻刻確認）\n- 『金匱玉函経』：6味を㕮咀し、水7升で煮て3升を取り、滓を去って1升を温服する（翻刻確認）\n\n### 処方の変遷\n- 桂枝加芍薬湯（桂枝湯の芍薬を倍にしたもの）に大黄を加えた構成（翻刻確認）\n- 大黄の量は、宋本巻第六では2両、宋本巻第十・弁発汗吐下後脈証并治第二十二の再掲では1両、『金匱玉函経』では3両と、書と巻で異なる。本文は現行エキス剤の比（芍薬6：大黄2）と一致する巻第六の2両を採った（巻第十の1両は要原本照合）\n- 原典の方名は桂枝加大黄湯で、『類聚方』では桂枝加芍薬大黄湯の名で載る（要原本照合）\n- 『傷寒活人書』巻第十二の桂枝加大黄湯は、桂枝6分・芍薬3両・甘草1両・大黄2両で、大実痛には大黄を1両半加え、羸者には減ずるとする（要原本照合）\n- 『景岳全書』巻之五十六・散陣の桂枝加大黄湯は、桂枝湯に大黄1両を加えたもので、芍薬を倍にしていない（要原本照合）\n- 現行エキス剤（ツムラ134）は 芍薬・桂皮・大棗・甘草・大黄・生姜 の6味で、1日量7.5g中 シャクヤク6.0・ケイヒ4.0・タイソウ4.0・カンゾウ2.0・ダイオウ2.0・ショウキョウ1.0（g）の混合生薬の乾燥エキスを含む（PMDA 添付文書 2023年12月改訂 第1版で確認）。原典の「桂枝」は、添付文書では「ケイヒ」と書かれる", "構成": "芍薬・桂皮・大棗・甘草・大黄・生姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "加味帰脾湯", "名前": "加味帰脾湯", "読み": "かみきひとう", "ツムラ番号": "137", "出典": "薛氏医案（内科摘要・各症方薬）／薛氏医案（口歯類要・附方并注）／薛氏医案（明医雑著・附方）／薛氏医案（保嬰撮要・巻三・天釣内釣）", "本文": {"条文": "### 『内科摘要』各症方薬（薛己）\n\n**書き下し**（要原本照合）\n\n**原文**（要原本照合）\n資料に原文の記載がない（要確認）\n\n**現代語訳**\n\n### 『口歯類要』附方并注（薛己）\n\n**書き下し**（要原本照合）\n\n**原文**（要原本照合）\n資料に原文の記載がない（要確認）\n\n**現代語訳**\n\n### 『明医雑著』附方（王綸撰・薛己訂）\n\n**書き下し**（要原本照合）\n\n**原文**（要原本照合）\n資料に原文の記載がない（要確認）\n\n**現代語訳**\n\n### 『保嬰撮要』巻三・天釣内釣（薛氏医案）\n\n**書き下し**（要原本照合）\n\n**原文**（要原本照合）\n資料に原文の記載がない（要確認）\n\n**現代語訳**\n\n### 注記\n- 4書とも、資料（sources/３.pdf の本の111〜112頁）には書き下しの引用だけがあり、原文はない。翻刻で原文を確かめられなかったため、公開側の書き下し・現代語訳は空欄にした。資料の書き下しは手元版に置く（要原本照合）\n- 4書とも、加味帰脾湯は帰脾湯（「前方」）の後に項を改めて載り、帰脾湯に薬を加えたものとして示される（要原本照合）\n- 『保嬰撮要』の方は、茯苓ではなく茯神を用いる（要原本照合）", "出典": "### 原典の構成\n- 『内科摘要』各症方薬：前方（帰脾湯）に柴胡・山梔を加える（分量の記載は資料にない）（要原本照合）\n- 『口歯類要』附方并注：前方（帰脾湯）に柴胡・丹皮・山梔を加える（分量の記載は資料にない）（要原本照合）\n- 『明医雑著』附方：前方（帰脾湯）に牡丹皮・山梔 各1銭を加える（要原本照合）\n- 『保嬰撮要』巻三・天釣内釣：加味薬は牡丹皮・山梔子で、茯苓ではなく茯神を用いる（分量の記載は資料にない）（要原本照合）\n\n### 原典の服用法\n\n### 処方の変遷\n- 加味帰脾湯は、帰脾湯に諸薬を加えた方（要原本照合）\n- 資料の出典欄には『聖済総録』『厳氏済生方』『玉機微義』『薛氏医案』が並ぶ。帰脾湯そのものの出典は、帰脾湯を登録するときに帰脾湯の側に載せる（要確認）\n- 『薛氏医案』には3通りの加味帰脾湯がある。柴胡・山梔子を加えるもの（『内科摘要』『女科撮要』『正体類要』『婦人良方』『銭氏小児直訣』）、柴胡・牡丹皮・山梔子を加えるもの（『口歯類要』）、牡丹皮・山梔子を加えるもの（『明医雑著』『保嬰撮要』）。このうち『銭氏小児直訣』と『保嬰撮要』は茯苓でなく茯神を用いる（要原本照合）\n- 一部の書は本方の出典を『済世全書』とするが、『薛氏医案』の諸書にすでに収載されている（要確認）\n- 『古今医鑑』巻之十一・婦人科虚労の「加味帰脾湯」は、薬味が帰脾湯と同じで加味薬がない（要原本照合）\n- 『医宗必読』巻之八・心腹諸痛の「加味帰脾湯」は、帰脾湯に煨姜・菖蒲・桂心を加えたもので、柴胡・山梔を加える者もあると注される（要原本照合）\n- 現行エキス剤（ツムラ137）は 黄耆・柴胡・酸棗仁・蒼朮・人参・茯苓・竜眼肉・遠志・山梔子・大棗・当帰・甘草・生姜・木香 の14味で、柴胡・山梔子を加える系統。牡丹皮は入らず、朮は蒼朮（PMDA 添付文書 2023年12月改訂 第1版で確認）", "構成": "黄耆・柴胡・酸棗仁・蒼朮・人参・茯苓・竜眼肉・遠志・山梔子・大棗・当帰・甘草・生姜・木香", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "桔梗湯", "名前": "桔梗湯", "読み": "ききょうとう", "ツムラ番号": "138", "出典": "傷寒論（弁少陰病脈証并治第十一）／金匱要略（肺痿肺癰咳嗽上気病脈証并治第七）", "本文": {"条文": "### 『傷寒論』弁少陰病脈証并治第十一\n\n**書き下し**（読み：社員案）\n少陰病、二三日、咽痛む者は、甘草湯を与うべし。差えざる者は、桔梗湯を与う。\n\n**原文**（翻刻確認）\n少陰病、二三日、咽痛者、可与甘草湯。不差者、与桔梗湯。\n\n**現代語訳**（訳：社員案）\n少陰病で二、三日たち、咽が痛むものには、甘草湯を与えてよい。治らないものには、桔梗湯を与える。\n\n### 『金匱要略』肺痿肺癰咳嗽上気病脈証并治第七\n\n**書き下し**（読み：社員案）\n咳して胸満し、振寒して脈数、咽乾きて渇せず、時に濁唾腥臭を出だし、久久にして膿を吐くこと米粥の如き者は、肺癰と為す。桔梗湯之を主る。\n\n**原文**（翻刻確認）\n咳而胸満、振寒脈数、咽乾不渇、時出濁唾腥臭、久久吐膿如米粥者、為肺癰、桔梗湯主之。\n\n**現代語訳**（訳：社員案）\n咳をして胸が張って苦しく、寒気がして震え、脈は速く、咽は乾くが渇きはなく、ときどき濁った生臭い痰を出し、長く続いて米の粥のような膿を吐くものは、肺癰である。桔梗湯がこれを主治する。\n\n### 注記\n- 『傷寒論』の条は、維基文庫の宋本の翻刻で確かめた（翻刻確認）。翻刻の字は「與」で、本文は新字体にした。翻刻の条番号は三一一。甘草湯の条と同じ条\n- 『金匱要略』の条は、維基文庫の「金匱要略」の翻刻で確かめた（翻刻確認）。翻刻の字は「咳而胸滿，振寒脈數，咽乾不渴」などで、本文は新字体にした\n- 四部叢刊本『金匱要略方論』（明・兪橋刊本）の翻刻では、この条が「欬而胸滿振脉寒數…桔便湯主之」となっている。「振脉寒數」（振寒脈数）と「桔便湯」（桔梗湯）は異同として残す（要原本照合）。欬／咳は字体の差\n- 四部叢刊本の翻刻では、方名の下に小字で「亦治血痺」（亦た血痺を治す）とある（翻刻確認）。維基文庫の「金匱要略」の翻刻には、桔梗湯方の構成・服用法そのものが載っていない\n- 条文の順は、資料の出典欄の順（『傷寒論』が先）に仮に置いた。添付文書に出典の欄がなく、両書の構成も同じため、基準では決められない（要確認）", "出典": "### 原典の構成\n- 『傷寒論』：桔梗1両、甘草2両（炙の指示なし）（翻刻確認）\n- 『金匱要略』：桔梗1両、甘草2両（炙の指示なし）（翻刻確認。四部叢刊本）\n\n### 原典の服用法\n- 『傷寒論』：2味を水3升で煮て1升を取り、滓を去り、2回に分けて温服する（翻刻確認）\n- 『金匱要略』：2味を水3升で煮て1升を取り、2回に分けて温服する（翻刻確認。四部叢刊本）。続けて、服すと膿血を吐くとある（要原本照合。翻刻は「則吐膿血色」で末字が通らない）\n\n### 処方の変遷\n- 甘草湯に桔梗を加えた方。『傷寒論』では、甘草湯で治らない咽痛に与える方として甘草湯の条に続いて載る（翻刻確認）\n- 『外台秘要方』巻第一は『千金翼方』を引いて桔梗湯方を載せ、大桔梗1両・甘草（炙）3両とする。『千金翼方』巻第十・傷寒下・少陰病状第二の桔梗湯方には炙の字がない（要原本照合）\n- 『外台秘要方』第十巻・肺癰方は『集験』の桔梗湯方を載せ、桔梗2両（『千金』『古今方』は1両）・甘草（炙）2両とする。同じ巻に、『古今録験』の同名の桔梗湯方（桔梗・白朮・当帰・地黄・甘草・敗醤・薏苡仁・桑白皮）もある（要原本照合）\n- 『太平聖恵方』巻第八では甘草桔梗湯の名で甘草（炙）1両・桔梗1両、巻第十では桔梗散の名で桔梗1両・甘草（生用）2両・苦参半両とする（要原本照合）\n- 『和剤局方』巻之七・咽喉口歯の如聖湯は桔梗湯にあたり、甘草は炒とされる（要原本照合）\n- 『鶏峰普済方』巻第十一では国老湯の名で載る（要原本照合）\n- 医療用エキス剤は、ツムラ桔梗湯エキス顆粒（医療用）（ツムラ番号138。1日量7.5g中、日局カンゾウ3.0g・日局キキョウ2.0g。PMDA 添付文書 2023年12月改訂 第1版で確認）。添付文書に出典の欄はない。原典の桔梗1両・甘草2両とは比が異なる", "構成": "桔梗・甘草", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "黄芩湯", "名前": "黄芩湯", "読み": "おうごんとう", "ツムラ番号": "", "出典": "傷寒論（弁太陽病脈証并治下第七）", "本文": {"条文": "### 『傷寒論』弁太陽病脈証并治下第七\n\n**書き下し**（読み：社員案）\n太陽と少陽との合病、自下利する者は、黄芩湯を与う。若し嘔する者は、黄芩加半夏生姜湯之を主る。\n\n**原文**（翻刻確認）\n太陽與少陽合病、自下利者、與黃芩湯。若嘔者、黃芩加半夏生薑湯主之。\n\n**現代語訳**（訳：社員案）\n太陽と少陽の合病で、自然に下痢するものには黄芩湯を与える。もし嘔吐するものは、黄芩加半夏生姜湯がこれを主治する。\n\n### 関連条文（誤治の例）\n\n『傷寒論』弁厥陰病脈証并治第十二。黄芩湯で解熱させてはいけない例として資料が挙げる条。\n\n**書き下し**（読み：社員案）\n傷寒、脈遅なること六七日、而るに反って黄芩湯を与えて其の熱を徹す。脈遅は寒と為す。今黄芩湯を与えて復た其の熱を除けば、腹中応に冷ゆべく、当に食すること能わざるべし。今反って能く食す。此れを除中と名づく。必ず死す。\n\n**原文**（翻刻確認）\n傷寒脈遲、六七日、而反與黃芩湯徹其熱。脈遲為寒、今與黃芩湯復除其熱、腹中應冷、當不能食。今反能食、此名除中、必死。\n\n**現代語訳**（訳：社員案）\n傷寒で脈が遅のまま六、七日たっているのに、かえって黄芩湯を与えてその熱を取り去った。脈遅は寒である。いま黄芩湯を与えてさらにその熱を除けば、腹中は冷えるはずで、食べられなくなるはずである。ところがかえって食べられる。これを除中といい、必ず死ぬ。\n\n### 注記\n- 太陽少陽合病の条は、宋本の翻刻・『注解傷寒論』の四庫全書本（書名『傷寒論注釋』）巻四・『金匱玉函経』で字が同じ（翻刻確認。黄／黃の字形の差のみ）\n- 大棗の枚数は、維基文庫の宋本の翻刻では「二十枚」と書かれる。同じ条の黄芩加半夏生姜湯（宋本）、『注解傷寒論』の四庫全書本、『金匱玉函経』ではいずれも「十二枚」で、原典の構成は12枚とした（要原本照合）\n- 除中の条は、『金匱玉函経』では「今與黃芩湯」が「而與黃芩湯」、「此名除中」が「此為除中」と書かれる（要原本照合）。本文は宋本の字を採った", "出典": "### 原典の構成\n- 『傷寒論』：黄芩3両、芍薬2両、甘草2両（炙）、大棗12枚（擘）（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』：4味を水1斗で煮て3升を取り、滓を去り、1升を温服する。日に2回、夜に1回服す（翻刻確認）\n\n### 処方の変遷\n- 芍薬甘草湯（芍薬・甘草）に黄芩・大棗を加えた構成。主薬は黄芩\n- 『太平聖恵方』（王懐隠等）巻第八・傷寒三陰三陽応用湯散諸方の黄芩湯方は黄芩・赤芍薬・甘草の3味で大棗を含まず、散として煎服する（要原本照合）\n- 『小児衛生総微論方』（撰者不詳）巻第七・傷寒論の黄芩湯も黄芩・赤芍薬・甘草の3味を㕮咀して煎服し、傷寒の口舌の諸病（舌黄・舌黒・舌腫・舌裂・芒刺・舌上出血）と鼻衄に用いる（要原本照合）\n- 『扶寿精方』（呉旻）傷寒では、4味はそのままで黄芩芍薬湯と名を変え、姜を入れて煎じる（要原本照合）\n- 曲直瀬道三口授『師語録』巻下一の芍薬黄芩湯は黄芩・芍薬・茯苓・甘草で、黄芩湯から大棗を去り茯苓を加えた方（要原本照合）\n- 『金匱要略』に載る黄芩湯は『外台秘要方』の黄芩湯で、本方とは別方（六物黄芩湯とも呼ばれる）（要原本照合）\n- 医療用エキス剤は見当たらない（KEGG MEDICUS の医療用医薬品で該当0件、2026-10-21。PMDA 添付文書は未確認）。資料の組成は黄芩4・芍薬3・甘草3・大棗4（単位の記載なし。要確認）", "構成": "黄芩・芍薬・甘草・大棗（要確認）", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "葛根加朮附湯", "名前": "葛根加朮附湯", "読み": "かっこんかじゅつぶとう", "ツムラ番号": "", "出典": "方機（葛根湯の条）", "本文": {"条文": "### 『方機』葛根湯の条\n\n**書き下し**（要原本照合）\n\n**原文**（要原本照合）\n\n**現代語訳**\n\n### 注記\n- 『方機』の葛根湯の条は「朮」とだけ書き、蒼朮か白朮かを書かない（要原本照合。資料の論考②による）\n- 『方機』の条は、葛根湯の方の中に朮・附子を加えるとし、「加朮附湯」の名で腫脹・疼痛・頑腫悪腫・丹毒の類などに挙げ、紫円の兼用を添える（要原本照合。資料の引用は途中を省いている）", "出典": "### 原典の構成\n- 『方機』：葛根湯の方の中に朮・附子 各4分を加える（要原本照合）\n\n### 原典の服用法\n\n### 処方の変遷\n- 葛根湯に朮・附子を加えた加味方。葛根湯の出典は『傷寒論』巻第三・弁太陽病脈証并治中第六と『金匱要略』痙湿暍病脈証并治第二で、葛根湯の条文は葛根湯の項に載せる\n- 資料の出典欄は『傷寒論』『金匱要略』『方機』の3書を挙げる。葛根加朮附湯の名が出るのは『方機』の葛根湯の条（要原本照合）\n- 『方機』の著者・成立年は資料に記載がない（要確認）\n- 『類聚方広義』（上）の葛根湯の頭注にも、本方に朮附を加えて葛根加朮附湯と名づけるとある（要原本照合）\n- 構成は、桂枝加朮附湯（桂皮・芍薬・甘草・生姜・大棗・蒼朮・附子）に葛根・麻黄を加えたものと同じになる\n- 医療用エキス剤はツムラにはなく、三和生薬の「三和葛根加朮附湯エキス細粒」がある（KEGG MEDICUS と PMDA で 2026-10-22 確認）\n- 三和葛根加朮附湯エキス細粒は 葛根・麻黄・桂皮・甘草・芍薬・大棗・生姜・蒼朮・加工ブシ の9味で、朮は蒼朮、附子は加工ブシ（PMDA 添付文書 2025年10月改訂 第2版で確認）", "構成": "葛根・麻黄・桂皮・甘草・芍薬・大棗・生姜・蒼朮・附子（加工ブシ）", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "甘草湯", "名前": "甘草湯", "読み": "かんぞうとう", "ツムラ番号": "", "出典": "傷寒論（弁少陰病脈証并治第十一）／金匱要略（肺痿肺癰咳嗽上気病脈証并治第七・附方、千金方の引用）", "本文": {"条文": "### 『傷寒論』弁少陰病脈証并治第十一\n\n**書き下し**（読み：社員案）\n少陰病、二三日、咽痛む者は、甘草湯を与うべし。差えざる者は、桔梗湯を与う。\n\n**原文**（翻刻確認）\n少陰病、二三日、咽痛者、可與甘草湯。不差者、與桔梗湯。\n\n**現代語訳**（訳：社員案）\n少陰病で二、三日たち、咽が痛むものには、甘草湯を与えてよい。治らないものには、桔梗湯を与える。\n\n### 『金匱要略』肺痿肺癰咳嗽上気病脈証并治第七・附方\n\n**書き下し**（読み：社員案）\n『千金』甘草湯。\n\n**原文**（翻刻確認）\n《千金》甘草湯。\n\n**現代語訳**（訳：社員案）\n『千金方』の甘草湯。\n\n### 注記\n- 『傷寒論』の条は、維基文庫の宋本の翻刻で確かめた（翻刻確認。與／与の字体の差のみ）。翻刻の条番号は三一一\n- 『金匱要略』の千金甘草湯は、維基文庫の翻刻では方名の後に主治の文がなく、すぐに構成・服用法が続く（翻刻確認）。主治の文がある本があるかは確かめていない（要原本照合）\n- 『金匱要略』の篇名は、資料では「肺痿肺癰欬嗽上気病脉証治第七」、翻刻では「肺痿肺癰咳嗽上氣病脈證並治第七」と書かれる。本文は翻刻の篇名を新字体にして採った（要原本照合）", "出典": "### 原典の構成\n- 『傷寒論』：甘草2両（炙の指示なし）（翻刻確認）\n- 『金匱要略』（千金甘草湯）：甘草（分量の記載なし）（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』：1味を水3升で煮て1升半を取り、滓を去り、7合を温服する。日に2回服す（翻刻確認）\n- 『金匱要略』（千金甘草湯）：1味を水3升で煮て半分に減らし、3回に分けて温服する（翻刻確認）\n\n### 処方の変遷\n- 甘草1味の方。『傷寒論』の甘草湯方の甘草には「炙」の指示がない（翻刻確認）\n- 『備急千金要方』巻第十七・肺臓・肺痿第六に甘草湯方がある（要原本照合）\n- 『千金翼方』（孫思邈）巻第十五・補益・補五蔵第四では温液湯の名で載り、甘草は3両。『千金方』では2両（要原本照合）\n- 『外台秘要方』第十巻・肺痿方は『千金』を引いて甘草湯方を載せ、甘草は炙と指示される（要原本照合）\n- 『三因極一病証方論』（陳無択）巻之十三・肺痿証治にも温液湯の名で載り、甘草は炙と指示される（要原本照合）\n- 医療用エキス剤は、クラシエ甘草湯エキス細粒（1日量6.0g中、日局カンゾウ8.0g。PMDA 添付文書 2023年10月改訂 第1版で確認）。ツムラの医療用製剤は見当たらない（KEGG MEDICUS、2026-10-22）", "構成": "甘草", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "桔梗石膏", "名前": "桔梗石膏", "読み": "ききょうせっこう", "ツムラ番号": "", "出典": "一本堂医事説約（小児科・口瘡重舌）", "本文": {"条文": "### 『一本堂医事説約』小児科・口瘡重舌（香川修庵）\n\n**書き下し**（要原本照合）\n\n**原文**（要原本照合）\n\n**現代語訳**\n\n### 注記\n- 『一本堂医事説約』小児科・口瘡重舌の条は、小児の夜啼きと重舌を述べ、その後に方名のない「一方」として石膏・桔梗・甘草を挙げる（要原本照合。資料の書き下しによる）\n- 原文の翻刻は維基文庫に見当たらない（2026-10-22 検索。要原本照合）", "出典": "### 原典の構成\n- 『一本堂医事説約』：石膏・桔梗・甘草（分量は資料に記載なし）（要原本照合）\n\n### 原典の服用法\n\n### 処方の変遷\n- 原方は方名のない「一方」で、石膏・桔梗・甘草の3味。現行エキス剤の桔梗・石膏の2味とは甘草の有無が異なる（要原本照合）\n- 和田東郭『蕉窓方意解』巻之下・駆風解毒湯は、駆風解毒湯に石膏（大）・桔梗（中）を加えて纏喉風（咽喉の腫痛）に用いたとする（要原本照合）\n- 『勿誤薬室方函口訣』巻之上・駆風解毒湯は、葛根湯加桔石、駆風解毒湯加桔石の用法を挙げ、後者を東郭の工夫として引く（要原本照合）\n- 以後、葛根湯・小柴胡湯・駆風解毒湯・黄連解毒湯・当帰芍薬散などに加える加味方として用いられた例が多い（要確認。資料の論考による）\n- 医療用エキス剤はツムラにはなく、小太郎漢方製薬の「コタロー桔梗石膏エキス細粒」がある（識別コード N324。1日量6.0g中、日局キキョウ3.0g・日局セッコウ10.0g。PMDA 添付文書 2023年1月改訂 第1版で確認）。添付文書に出典の欄はない\n- ツムラには加味方の「ツムラ小柴胡湯加桔梗石膏エキス顆粒（医療用）」がある（KEGG MEDICUS で 2026-10-22 確認）", "構成": "桔梗・石膏", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "芎帰調血飲", "名前": "芎帰調血飲", "読み": "きゅうきちょうけついん", "ツムラ番号": "", "出典": "古今医鑑（巻之十二・産後）／万病回春（巻之六・産後）", "本文": {"条文": "### 『古今医鑑』巻之十二・産後\n\n**書き下し**（読み：社員案）\n芎帰調血飲（西園公の方）　産後の一切の諸病、気血虚損し、脾胃怯弱し、或いは悪露行らず、或いは血を去ること過多、或いは飲食節を失い、或いは怒気相冲き、以て発熱悪寒、自汗口乾、心煩喘急、心腹疼痛、脇肋脹満、頭暈眼花、耳鳴、口噤して語らず、昏憒等の証を致すを治す。\n\n**原文**（翻刻確認）\n芎歸調血飲（西園公方）　治產後一切諸病、氣血虛損、脾胃怯弱、或惡露不行、或去血過多、或飲食失節、或怒氣相冲、以致發熱惡寒、自汗口乾、心煩喘急、心腹疼痛、脅肋脹滿、頭暈眼花、耳鳴、口噤不語、昏憒等證。\n\n**現代語訳**（訳：社員案）\n芎帰調血飲（西園公の方）。産後のあらゆる病で、気血が虚して損なわれ、脾胃が弱く、あるいは悪露が下りず、あるいは出血が多すぎ、あるいは飲食の節度を失い、あるいは怒りの気が突き上げて、そのために発熱・悪寒、自汗・口の渇き、胸苦しさ・喘ぎ、胸腹部の痛み、脇の張り、めまい・目のかすみ、耳鳴り、口を食いしばって話さない、意識がぼんやりする、などの症状を来すものを治す。\n\n### 『万病回春』巻之六・産後\n\n**書き下し**（読み：社員案）\n芎帰補血湯　産後の一切の諸病、気血虚損し、脾胃怯弱し、或いは悪露行らず、或いは血を去ること過多、或いは飲食節を失い、或いは怒気相冲き、以て発熱悪寒、自汗口乾、心煩喘急、心腹疼痛、脇肋脹満、頭暈眼花、耳鳴、口噤して語らず、昏憒等の症を致すを治す。\n\n**原文**（翻刻確認）\n芎歸補血湯　治產後一切諸病、氣血虛損、脾胃怯弱、或惡露不行、或去血過多、或飲食失節、或怒氣相冲、以致發熱惡寒、自汗口乾、心煩喘急、心腹疼痛、脅肋脹滿、頭暈眼花、耳鳴、口噤不語、昏憒等症。\n\n**現代語訳**（訳：社員案）\n芎帰補血湯。産後のあらゆる病で、気血が虚して損なわれ、脾胃が弱く、あるいは悪露が下りず、あるいは出血が多すぎ、あるいは飲食の節度を失い、あるいは怒りの気が突き上げて、そのために発熱・悪寒、自汗・口の渇き、胸苦しさ・喘ぎ、胸腹部の痛み、脇の張り、めまい・目のかすみ、耳鳴り、口を食いしばって話さない、意識がぼんやりする、などの症状を来すものを治す。\n\n### 注記\n- 『万病回春』の方名は、維基文庫の翻刻では「芎歸補血湯」（芎归补血汤）。資料は同じ箇所を「芎帰調血飲」とし、方名の傍註に「西園公伝」があるとするが、翻刻には傍註がない（要原本照合）\n- 二書の条文は、末尾の「等證」（『古今医鑑』）と「等症」（『万病回春』）のほかは同じ字（翻刻確認）\n- 『古今医鑑』の翻刻は簡体字から繁体字に直した本で、字形の判断には使えない。「相冲」は翻刻の字のまま置いた（衝の字の異同は要原本照合）\n- 『古今医鑑』は龔信（明）の撰、『万病回春』は龔廷賢（明）の著（翻刻確認）。方名の下の「西園公方」の西園は、『万病回春』の序に龔廷賢の父「西園君」、巻末の志行紀に「父西園公」として出る（翻刻確認）\n- 二書の順は、刊行の早い『古今医鑑』を先にした（要確認）", "出典": "### 原典の構成\n- 『古今医鑑』：当帰・川芎・白朮・白茯苓・熟地・陳皮・香附（童便炒）・烏薬・乾姜（炒黒）・益母草・甘草・牡丹皮。分量の記載なし（翻刻確認）\n- 『万病回春』：当帰・川芎・白朮（去芦）・白茯苓（去皮）・熟地黄・陳皮・烏薬・香附（童便炒）・乾姜（炒黒）・益母草・牡丹皮・甘草。分量の記載なし（翻刻確認）\n\n### 原典の服用法\n- 『古今医鑑』：刻んで、生姜・棗を入れて煎じて服す。悪露が下りなければ益母草・牡丹皮を倍にし、童便・黄酒を加えて同服する。出血が多すぎれば川芎・当帰・乾姜を倍にする。ほかに飲食停滞・気悩・口噤・両脇痛・小腹陣痛・有汗・口乾苦の加味がある。産後はすぐに童便と熱酒を合わせて随意に飲めば百病を生じない、とも記す（翻刻確認）\n- 『万病回春』：1剤に刻み、生姜1片・棗1枚を入れて水で煎じ温服する。病をみて後に記す加減を行う（翻刻確認）\n\n### 処方の変遷\n- 資料は出典に『理傷続断方』『聖済総録』『扶寿精方』『古今医鑑』（龔信方）を挙げる。前の3書は、本方に至る流れの表に挙げられた四物湯・順気湯（四君子湯）・滋陽百補丸の書（要原本照合）\n- 本方は従来『万病回春』巻之六・産後が出典とされてきたが、それより前の『古今医鑑』巻之十二・産後に同じ条文で載り、方名の下に「西園公方」とある（翻刻確認）。資料はこれを龔信の創方の根拠とする\n- 『扶寿精方』婦人門の滋陽百補丸は、香附子・益母草・当帰・川芎・赤茯苓・白朮・白芍薬・人参・甘草・生地黄を煉蜜丸とし、白湯か酒で下す。資料は、四物湯合四君子湯（八珍湯）加香附子・益母草にあたり、嘉靖版は『古今医鑑』初刊の43年前の書とする（要原本照合）\n- 龔廷賢『寿世保元』庚集七巻・産後の帰朮保産湯は、当帰・川芎・白芍・熟地黄・白朮・白茯苓・陳皮・香附米・乾姜・甘草を姜棗で水煎する。本方から烏薬・益母草・牡丹皮を去り白芍を加えた形（要原本照合）\n- 『済世全書』巻之六離集・産後の芎帰調血飲は、当帰身・川芎・白芍・懐生地黄・白朮・白茯苓・陳皮・香附・甘草を姜棗で水煎する。『古今医鑑』の本方から烏薬・乾姜・益母草・牡丹皮を去り白芍を加えた形。資料は、元々は龔廷賢『種杏仙方』巻之三・産後に方名なしで記載されていたとする（要原本照合。方を指すのか、方後の注記を指すのかは資料の文から決めにくい。要確認）\n- 『医便』巻四・済陰類の済陰百補丸は、滋陽百補丸に玄胡索・木香を加えた形（要原本照合）\n- 『万病回春』の加減のうち、3番目（産後悪露不尽、胸腹飽悶疼痛、或いは腹中に塊有り、悪寒発熱）は本方に桃仁・紅花・肉桂・牛膝・枳殻・木香・玄胡索・童便・姜汁少許を加え熟地黄を去り、5番目（産後悪露不尽、瘀血上冲、昏迷して醒めず、腹満硬痛）は桃仁・紅花・肉桂・玄胡索・牛膝・童便・姜汁少許を加える（翻刻確認）。『古今医鑑』の本方の加減にはこの2方はない（翻刻確認）\n- 一貫堂の芎帰調血飲第一加減は、本方から熟地黄を去り、芍薬・乾地黄・桃仁・紅花・肉桂・牛膝・枳殻・木香・延胡索を加えたもの。資料は『万病回春』の3番目の加減より乾地黄・芍薬が多いとする（要原本照合）\n- 医療用エキス剤はツムラにはなく、太虎精堂製薬の「太虎堂のきゅう帰調血飲エキス顆粒」がある。1日量6.0g中、当帰・川芎・地黄・白朮・茯苓・陳皮・香附子・牡丹皮・烏薬 各2.0g、大棗・益母草 各1.5g、生姜・甘草 各1.0g の13味。原典の乾姜はなく、煎じるときの生姜・大棗が入る（PMDA 添付文書 2024年2月改訂 第1版・2023年10月改訂 第1版で確認）。添付文書に出典の欄はない", "構成": "当帰・川芎・地黄・白朮・茯苓・陳皮・香附子・牡丹皮・大棗・生姜・甘草・烏薬・益母草", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "九味檳榔湯", "名前": "九味檳榔湯", "読み": "くみびんろうとう", "ツムラ番号": "", "出典": "外台秘要方（巻七・檳榔湯）／山脇東洋方／原南陽方（叢桂亭医事小言 巻之三・脚気）／勿誤薬室方函（巻上）", "本文": {"条文": "### 『勿誤薬室方函』巻上・九味檳榔湯\n\n**書き下し**（要原本照合）\n\n**原文**（要原本照合）\n\n**現代語訳**\n\n### 『叢桂亭医事小言』巻之三・脚気（原南陽）\n\n**書き下し**（要原本照合）\n\n**原文**（要原本照合）\n\n**現代語訳**\n\n### 関連条文（元の方：『外台秘要方』巻七・腹内諸気及脹不下食方の檳榔湯）\n\n**書き下し**（読み：社員案）\n又、心頭冷えて硬く、結ぼれて痛むを療し、気を下す檳榔湯方。檳榔十顆、生薑・青木香各三両、橘皮・枳実（炙る）・甘草（炙る）・大黄各二両。右七味、切り、水六升を以て煮て二升半を取り、滓を絞り去り、分かちて温め三服す。服するに別に人の行くこと四五里の如くして一服を進め、微利を取る。生菜・熱麫・炙肉・海藻・菘菜等を忌む。\n\n**原文**（翻刻確認）\n又療心頭冷硬結痛下氣檳榔湯方。檳榔十顆、生薑・青木香各三兩、橘皮・枳實炙・甘草炙・大黄各二兩。右七味、切、以水六升、煮取二升半、絞去滓、分温三服、服別如人行四五里進一服、取微利。忌生菜・熱麫・炙肉・海藻・菘菜等。\n\n**現代語訳**（訳：社員案）\nまた、みぞおちが冷えて硬く、結ぼれて痛むものを治し、気を下す檳榔湯の方。檳榔10顆、生姜・青木香 各3両、橘皮・枳実（炙る）・甘草（炙る）・大黄 各2両。以上の7味を刻み、水6升で煮て2升半を取り、かすを絞って除き、温めて3回に分けて服す。1回服したら、人が4〜5里歩くほどの間をおいて次の1回を服し、軽い下痢を得るのを目安とする。生野菜・熱い麺・焼いた肉・海藻・菘菜などを避ける。\n\n### 注記\n- 『勿誤薬室方函』巻上の九味檳榔湯は「家方」とされ、脚気で腫満・短気するもの、および心腹が痞積して気血が凝滞するものを治すとする（要原本照合。資料の書き下しによる）\n- 『叢桂亭医事小言』巻之三・脚気の九味檳榔湯は、脚気で気血が凝滞するものを理すとする（要原本照合。資料の書き下しによる）\n- 『勿誤薬室方函』『叢桂亭医事小言』の原文の翻刻は維基文庫に見当たらない（2026-10-22 検索。要原本照合）\n- 『外台秘要方』の「檳榔」は、四庫全書本の翻刻では「㯽榔」と書かれる（要原本照合）\n- 『外台秘要方』の「青木香」は、資料の表では「木香」とされる（要原本照合）\n- 『外台秘要方』の条の「又」は、同じ門の先頭にある広済方を受ける。同門の方の末尾に「並出第二卷中」とある（翻刻確認）\n- 『外台秘要方』の門名「腹内諸気及脹不下食方」は翻刻で確かめた（翻刻確認）。資料の挙げる巻名「心痛心腹痛及寒疝」は翻刻で確かめていない（要原本照合）", "出典": "### 原典の構成\n- 『勿誤薬室方函』巻上：檳榔・大黄・厚朴・桂枝・橘皮・木香・蘇葉・甘草・生姜（分量は資料に記載なし）（要原本照合）\n- 『叢桂亭医事小言』巻之三：檳榔・橘皮・桂枝・木香・大黄・紫蘇・厚朴・枳実・生姜（分量は資料に記載なし）（要原本照合）\n- 『外台秘要方』巻七（元の方の檳榔湯）：檳榔10顆、生姜・青木香 各3両、橘皮・枳実（炙）・甘草（炙）・大黄 各2両（翻刻確認）\n\n### 原典の服用法\n- 『外台秘要方』巻七（元の方の檳榔湯）：7味を刻み、水6升で煮て2升半を取り、かすを絞り去り、温めて3回に分けて服す。服用の間は人が4〜5里歩くほどあけ、軽い下痢を得るのを目安とする。生菜・熱麫・炙肉・海藻・菘菜などを忌む（翻刻確認）\n\n### 処方の変遷\n- 『外台秘要方』巻七・腹内諸気及脹不下食方の檳榔湯（檳榔・生姜・青木香・橘皮・枳実・甘草・大黄の7味）に、山脇東洋が桂枝・紫蘇を加えて九味の方としたのが始まりとされる（要確認）。原南陽口授『復坐録』、『校正方輿輗』巻之十・脚気、今村了庵『脚気鉤要』巻上・併病がこの加味を伝える（要原本照合）\n- 『復坐録』『脚気鉤要』は元の方を「千金方」の七味檳榔湯とするため、本方の原方は『備急千金要方』出典と見なされてきた（要原本照合）\n- 山脇東洋『傷寒門温胆』は「檳榔湯　外台秘要」として檳榔・枳実・紫蘇・桂枝・陳皮・大黄・木香・甘草・生姜を、『方読弁解』中部中之一・心腹胸痛は外台の檳榔湯（7味）を載せる（要原本照合）\n- 山脇東門『東門先生方函』は東洋の方から甘草を去った8味とし、方名は九味檳榔湯のままとした（要原本照合）\n- 原南陽は東門の8味に厚朴を加えて再び9味とした（檳榔・橘皮・桂枝・木香・大黄・紫蘇・厚朴・枳実・生姜）。『復坐録』『叢桂亭医事小言』に載る（要原本照合）\n- この南陽の方から枳実を去り甘草を加えた9味（檳榔・大黄・厚朴・桂枝・甘草・木香・陳皮・紫蘇・生姜）が今日の九味檳榔湯にあたる。『東洋方函南門先生蔵方』、『療治経験筆記』巻之八・巻之九の脚気腫満短気に載る（巻之八は寛政七年〈1795〉の記録とされる）（要原本照合）\n- 『勿誤薬室方函』巻上はこの9味を「家方」として載せ、従来はこれが本方の出典とされてきた。方後に、大黄を去って呉茱萸・茯苓を加える加減を記す（要原本照合）\n- 『橘窓書影』巻之一には、九味檳榔湯去将加呉茱萸茯苓と九味檳榔湯加呉茱萸茯苓の治験があり、大黄の有無の2通りで用いられた（要原本照合。「去将」を大黄を去るとするのは資料の読み）。呉茱萸・茯苓の加味は和田東郭『蕉窓方意解』巻之上・柴胡桂枝乾姜湯の加味にならったものとされる（要確認）\n- 医療用エキス剤はツムラにはなく、小太郎漢方製薬の「コタロー九味檳榔湯エキス細粒」がある（識別コード N311。1日量6.0g中、ビンロウジ4.0・コウボク3.0・ケイヒ3.0・キッピ3.0・ソヨウ1.5・カンゾウ1.0・ダイオウ1.0・ショウキョウ1.0・モッコウ1.0・ゴシュユ1.0・ブクリョウ3.0g。PMDA 添付文書 2023年1月改訂 第1版で確認）。9味に呉茱萸・茯苓を加えた11味で、大黄も含む。添付文書に出典の欄はない", "構成": "檳榔子・厚朴・桂皮・橘皮・蘇葉・甘草・大黄・生姜・木香・呉茱萸・茯苓", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "桂枝加黄耆湯", "名前": "桂枝加黄耆湯", "読み": "けいしかおうぎとう", "ツムラ番号": "", "出典": "金匱要略（水気病脈証并治第十四）／金匱要略（黄疸病脈証并治第十五）", "本文": {"条文": "### 『金匱要略』水気病脈証并治第十四（黄汗の条）\n\n**書き下し**（読み：社員案）\n黄汗の病、両脛自ずから冷ゆ。仮令発熱するは、此れ歴節に属す。食し已りて汗出で、又身常に暮に盗汗出づる者は、此れ労気なり。若し汗出で已りて反って発熱する者は、久久にして其の身必ず甲錯す。発熱止まざる者は、必ず悪瘡を生ず。若し身重く、汗出で已りて輒ち軽き者は、久久にして必ず身瞤し、瞤すれば即ち胸中痛む。又腰より以上必ず汗出で、下に汗無く、腰髖弛痛し、物の皮中に在る有るが如き状あり。劇しき者は食する能わず、身疼重し、煩躁し、小便不利す。此れを黄汗と為す。桂枝加黄耆湯之を主る。\n\n**原文**（翻刻確認）\n黃汗之病，兩脛自冷；假令發熱，此屬歷節。食已汗出，又身常暮盜汗出者，此勞氣也。若汗出已反發熱者，久久其身必甲錯；發熱不止者，必生惡瘡。若身重，汗出已輒輕者，久久必身瞤，瞤即胸中痛，又從腰以上必汗出，下無汗，腰髖弛痛，如有物在皮中狀，劇者不能食，身疼重，煩躁，小便不利，此為黃汗，桂枝加黃耆湯主之。\n\n**現代語訳**（訳：社員案）\n黄汗の病では、両すねが自然に冷える。もし発熱するなら、それは歴節に属する。食べ終わると汗が出て、また体にいつも夕暮れに寝汗が出るものは、労気である。もし汗が出終わってかえって発熱するものは、長引くとその体は必ず甲錯する（皮膚が荒れてざらつく）。発熱が止まないものは、必ず悪瘡（たちの悪いできもの）を生じる。もし体が重く、汗が出終わるとすぐに軽くなるものは、長引くと必ず体がぴくぴくと動き、動くとすぐに胸の中が痛む。また腰から上には必ず汗が出て、下には汗がなく、腰と股関節がゆるむように痛み、皮膚の中に何か物があるような様子で、ひどいものは食べられず、体が痛んで重く、煩躁し、小便の出が悪い。これを黄汗とする。桂枝加黄耆湯がこれを主治する。\n\n### 『金匱要略』黄疸病脈証并治第十五\n\n**書き下し**（読み：社員案）\n諸病の黄家は、但其の小便を利す。仮令脈浮なれば、当に汗を以て之を解すべし。宜しく桂枝加黄耆湯之を主るべし。（方は水気病中に見ゆ）\n\n**原文**（翻刻確認）\n諸病黃家，但利其小便；假令脈浮，當以汗解之，宜桂枝加黃耆湯主之。（方見水氣病中。）\n\n**現代語訳**（訳：社員案）\nもろもろの病で黄を発する者は、ただその小便を通じさせる。もし脈が浮であれば、汗によってこれを解すべきである。桂枝加黄耆湯でこれを主治するのがよい。（方は水気病の中に見える）\n\n### 注記\n- 黄汗の条は、四部叢刊本（明嘉靖俞橋刊本の影印）の翻刻では、「若汗出已反發熱者」「若身重」の「若」がなく、「下無汗」が「不無汗」、「必身瞤，瞤即胸中痛」が「必身瞤即胸中痛」、「此為黃汗」が「為黃汗」、「煩躁」が「煩燥」と書かれる（要原本照合）\n- 黄汗の条の「此勞氣也」は、『金匱要略心典』の引用では「此榮氣也」とされる（要原本照合。資料205頁による）\n- 黄疸病の条の小字注「方見水氣病中」は、四部叢刊本の翻刻では「方見水病中」と書かれる（要原本照合）\n- 「黃耆」の「耆」は、四部叢刊本の翻刻では「𦒿」の字形で書かれる（要原本照合）\n- 方（構成・服用法）は、通行本の翻刻（維基文庫『金匱要略』）には載っておらず、四部叢刊本の翻刻だけから取った。方後の「湏飲𤍠稀粥」の「湏」は、資料の書き下しでは「須臾に」と読まれる（要原本照合）", "出典": "### 原典の構成\n- 『金匱要略』水気病第十四（四部叢刊本）：桂枝・芍薬 各3両、甘草2両、生姜3両、大棗12枚、黄耆2両（翻刻確認）\n- 『金匱要略』黄疸病第十五：方は水気病の中に見えるとあり、同じ方を用いる（翻刻確認）\n\n### 原典の服用法\n- 6味を水8升で煮て3升を取り、1升を温服する。熱い稀粥1升余りを飲んで薬力を助け、温服して微汗を取る。汗が出なければさらに服す（翻刻確認。「湏」の読みは条文の注記を参照）\n\n### 処方の変遷\n- 桂枝・芍薬・甘草・生姜・大棗の分量は『傷寒論』（宋本）の桂枝湯方（桂枝3両・芍薬3両・甘草2両・生姜3両・大棗12枚）と同じで、これに黄耆2両を加えた形（翻刻確認）\n- 方後の熱い稀粥で薬力を助ける法は、宋本の桂枝湯方の方後と同じ趣旨。桂枝湯方の方後にある「温覆」の語は、桂枝加黄耆湯の方後にはない（翻刻確認）\n- 『備急千金要方』巻第十・傷寒発黄第五は、黄汗を五種の黄の一つに挙げ、諸病の黄疸に桂枝加黄耆湯を宜しとする条を載せる（要原本照合）\n- 『外台秘要方』第四巻・温病及黄疸・黄汗方は、水気病の黄汗の条と同じ条を載せ、方名を「桂枝湯加黄耆五両」とし、薬味を桂心・芍薬・甘草・生姜・大棗・黄耆とする。方後に原典にない「覆いて微汗を取る」がある（要原本照合）\n- 現行エキス剤：ツムラの製剤はない（KEGG MEDICUS・PMDA で確認）。〔東洋〕桂枝加黄耆湯エキス細粒（東洋薬行、識別コード TY-026）は、1日量6.0g中にケイシ4.0・シャクヤク4.0・タイソウ4.0・生ショウキョウ4.0・カンゾウ2.0・オウギ2.0gの混合生薬の水製エキス3.6gを含む（PMDA 添付文書 2023年9月改訂 第1版で確認）。桂皮ではなくケイシ（局外生規）、ショウキョウではなく生ショウキョウを用いる", "構成": "桂枝・芍薬・大棗・生姜・甘草・黄耆", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "桂枝加葛根湯", "名前": "桂枝加葛根湯", "読み": "けいしかかっこんとう", "ツムラ番号": "", "出典": "傷寒論（巻第二・弁太陽病脈証并治上第五）", "本文": {"条文": "### 『傷寒論』巻第二・弁太陽病脈証并治上第五\n\n**書き下し**（読み：社員案）\n太陽病、項背強ばること几几、反って汗出で悪風する者は、桂枝加葛根湯之を主る。\n\n**原文**（翻刻確認）\n太陽病，項背強几几，反汗出惡風者，桂枝加葛根湯主之。\n\n**現代語訳**（訳：社員案）\n太陽病で、うなじから背中が几几とこわばり、かえって汗が出て風を嫌うものは、桂枝加葛根湯が主治する。\n\n### 注記\n- 宋本の翻刻と、四庫全書本『傷寒論注釈』（成無己注）巻二の翻刻で同じ句（翻刻確認。強／强の字形の差のみ）\n- 『金匱玉函経』の翻刻では、同じ条が「太陽病，項背強𠘧𠘧，而反汗出惡風，桂枝湯主之。《論》云：桂枝加葛根湯主之。」と書かれ、方名が桂枝湯で「几几」が「𠘧𠘧」、「而反」となる。同書の別の箇所では「反汗出惡風者，屬桂枝加葛根湯」（要原本照合）\n- 宋本の方の後には林億らの注があり、太陽中風の自汗には桂枝、傷寒の無汗には麻黄を用いるのに、証は汗出・悪風で方中に麻黄がある、と指摘すると資料はいう。維基文庫の宋本の翻刻にはこの注が載っていない（要原本照合）\n- 宋本の巻第七・弁可発汗病脈証并治第十六にも本方が載り、服用法の後半に「薬力を助く」の句が加わると資料はいう。維基文庫の宋本の翻刻ではこの篇が省略されていて確かめられない（要原本照合）\n- 宋本の翻刻では、服用法の最後に「諸湯皆彷此」の句が続く（要原本照合）。宋本の巻第十に再掲された方は、甘草に「炙」がなく、服用法が「餘如桂枝法」で終わる（要原本照合）", "出典": "### 原典の構成\n- 『傷寒論』（宋本）：葛根4両、麻黄3両（去節）、芍薬2両、生姜3両（切）、甘草2両（炙）、大棗12枚（擘）、桂枝2両（去皮）（翻刻確認）\n- 『金匱玉函経』巻第七・方薬炮製（桂枝加葛根湯方第十七）：桂枝3両、芍薬2両、甘草2両（炙）、生姜3両、大棗12枚、葛根4両（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』（宋本）：7味を水1斗で、まず麻黄・葛根を煮て2升減らし、上の泡を去る。残りの薬を入れて3升に煮つめ、滓を去って1升を温服する。衣をかけてわずかに汗ばむ程度の汗をとる。粥をすする必要はない。ほかは桂枝湯の法に従って養生と禁忌を守る（翻刻確認）\n- 『金匱玉函経』：6味を水9升で、まず葛根を煮て2升減らし、上の泡を去る。残りの薬を入れて3升に煮つめ、滓を去って1升を温服する。衣をかけてわずかに汗ばむ程度の汗をとる。粥をすする必要はなく、ほかは桂枝湯の法に従う（翻刻確認）\n\n### 処方の変遷\n- 桂枝湯に葛根を加えたもの、あるいは葛根湯から麻黄を除いたもの\n- 宋本『傷寒論』の方には麻黄が入るが、条文（汗出・悪風）と合わないため、古くから麻黄は誤りとして除いて解釈されてきた（要原本照合）。『金匱玉函経』の方は麻黄を含まない6味（翻刻確認）\n- 『太平聖恵方』巻第十・治傷寒中風諸方には、桂心・甘草・赤芍薬・葛根に生姜・棗を入れて煎じる方が載り、事実上の桂枝加葛根湯とされる（要原本照合）\n- 『傷寒活人書』巻第十二の桂枝加葛根湯は桂枝・甘草・芍薬・葛根・麻黄を姜棗で煎服する。注に「伊尹湯液論」では桂枝湯に葛根を加えるだけで、監本が麻黄を用いるのは誤りとある（要原本照合）\n- 『傷寒直格方』巻中では桂枝湯加葛根湯の名で載り、巻下・諸証薬石分剤では桂枝・芍薬・甘草・葛根を桂枝湯のように服すとされる（要原本照合）\n- ツムラの医療用エキス剤はない。医療用は〔東洋〕桂枝加葛根湯エキス細粒（東洋薬行）の1品目で、1日量6.0g中に 桂枝4・芍薬4・大棗4・生姜（生ショウキョウ）4・甘草2・葛根6（g）の混合生薬の水製エキスを含む（PMDA 添付文書 2023年9月改訂 第1版で確認）", "構成": "桂枝・芍薬・大棗・生姜・甘草・葛根", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "桂枝加厚朴杏仁湯", "名前": "桂枝加厚朴杏仁湯", "読み": "けいしかこうぼくきょうにんとう", "ツムラ番号": "", "出典": "傷寒論（巻第二・弁太陽病脈証并治上第五、巻第三・弁太陽病脈証并治中第六）", "本文": {"条文": "### 『傷寒論』巻第二・弁太陽病脈証并治上第五\n\n**書き下し**（読み：社員案）\n喘家は、桂枝湯を作りて厚朴・杏子を加うれば佳なり。\n\n**原文**（翻刻確認）\n喘家作，桂枝湯加厚朴、杏子佳。\n\n**現代語訳**（訳：社員案）\nもともと喘のある人には、桂枝湯を作るときに厚朴・杏子（杏仁）を加えるとよい。\n\n### 『傷寒論』巻第三・弁太陽病脈証并治中第六\n\n**書き下し**（読み：社員案）\n太陽病、之を下して微しく喘する者は、表未だ解せざるが故なり。桂枝加厚朴杏子湯之を主る。\n\n**原文**（翻刻確認）\n太陽病，下之微喘者，表未解故也，桂枝加厚朴杏子湯主之。\n\n**現代語訳**（訳：社員案）\n太陽病を下したあと、軽く喘するものは、表がまだ解けていないためである。桂枝加厚朴杏子湯が主治する。\n\n### 注記\n- 原典の方名は桂枝加厚朴杏子湯（宋本の翻刻で確認。翻刻確認）\n- 宋本の翻刻は1つ目の条を「喘家作，」と「作」の後で句を切る。句読点は校訂者のもので、書き下しは「作」を「桂枝湯を作る」に掛けて読んだ（要原本照合）\n- 『金匱玉函経』の翻刻では、2条とも「杏子」が「杏仁」で、方名は「桂枝加厚朴杏仁湯」。1つ目の条は「喘家，作桂枝湯加厚朴杏仁佳。」（要原本照合）\n- 『金匱玉函経』の翻刻の別の篇では、2つ目の条が「宜麻黃湯。又云：桂枝加厚朴杏子湯。」、また「屬桂枝湯證。（一云：麻黃湯證。）」となっている（要原本照合）\n- 四庫全書本『傷寒論注釈』（成無己注）巻二の翻刻では、1つ目の条が「喘家作桂枝湯加厚朴杏子仁」（要原本照合）\n- 宋本の巻第十に再掲された方は「桂枝湯方の内に厚朴二両、杏仁五十箇（去皮尖）を加え、余は前法に依る」で、杏仁の数を「枚」でなく「箇」とする（要原本照合）", "出典": "### 原典の構成\n- 『傷寒論』（宋本）巻第三：桂枝3両（去皮）、甘草2両（炙）、生姜3両（切）、芍薬3両、大棗12枚（擘）、厚朴2両（炙、去皮）、杏仁50枚（去皮尖）（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』（宋本）巻第三：7味を水7升で、とろ火で3升に煮つめ、滓を去って1升を温服する。衣をかけてわずかに汗ばむ程度の汗をとる（翻刻確認）\n\n### 処方の変遷\n- 桂枝湯に厚朴・杏仁を加えたもの\n- 『金匱玉函経』の翻刻では、方薬炮製の篇に本方の方が見当たらない（翻刻確認）\n- ツムラの医療用エキス剤はない。医療用は〔東洋〕桂枝加厚朴杏仁湯エキス細粒（東洋薬行）の1品目で、1日量7.5g中に 桂枝4・芍薬4・大棗4・生姜（生ショウキョウ）4・甘草2・厚朴4・杏仁4（g）の混合生薬の水製エキスを含む（PMDA 添付文書 2023年10月改訂 第1版で確認）", "構成": "桂枝・芍薬・大棗・生姜・甘草・厚朴・杏仁", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "桂枝加苓朮附湯", "名前": "桂枝加苓朮附湯", "読み": "けいしかりょうじゅつぶとう", "ツムラ番号": "", "出典": "方機（桂枝加朮附湯の条に続く条）", "本文": {"条文": "### 『方機』桂枝加朮附湯の条に続く条\n\n**書き下し**（要原本照合）\n\n**原文**（要原本照合）\n\n**現代語訳**\n\n### 注記\n- 『方機』の原文の翻刻は、維基文庫の検索（2026-10-22）では見当たらなかった。資料には書き下しだけがある（要原本照合）\n- 『方機』の条は、眼目が明らかでない者に応鐘散あるいは紫円、あるいは七宝丸の兼用を指示する（要原本照合。資料の論考①による）", "出典": "### 原典の構成\n- 『方機』：桂枝と芍薬は等量で各6分（要原本照合。資料の論考⑩による。ほかの生薬の分量は資料に記載がない）\n\n### 原典の服用法\n\n### 処方の変遷\n- 資料の出典欄は『傷寒論』『方機』の2書を挙げる。桂枝加苓朮附湯の名が出るのは『方機』で、桂枝加朮附湯の条に続く条（要原本照合）\n- 桂枝湯と桂枝加附子湯の出典は『傷寒論』巻第二・弁太陽病脈証并治上第五（翻刻確認）\n- 構成は桂枝加朮附湯（桂皮・芍薬・甘草・生姜・大棗・蒼朮・附子）に茯苓を加えたものと同じになる\n- 『方機』の著者・成立年は資料に記載がない（要確認）\n- 『類聚方広義』（上）の桂枝加附子湯の頭注は、心悸・目眩・身瞤動する者に茯苓を加えて桂枝加茯苓朮附子湯と名づけるとする（要原本照合）\n- 『古方括要』巻之上・雑病門・麻木は、桂枝加苓朮附湯を桂枝湯の方中に茯苓・白朮・附子を加えるものとする（要原本照合）\n- 『証治摘要』巻上・中風には桂枝加朮苓附湯の名で載る（要原本照合）\n- 『臨床漢方医典』脚気は、桂枝3分・芍薬5分とする（要原本照合）\n- 医療用エキス剤はツムラにはなく、クラシエ（クラシエ桂枝加苓朮附湯エキス細粒、識別コード KB-18・EK-18。ほかにエキス錠）と大杉製薬（オースギ桂枝加苓朮附湯エキスG、識別コード SG-18R）がある（KEGG MEDICUS と PMDA で 2026-10-22 確認）\n- クラシエのエキス細粒は1日量7.5g中にケイヒ4.0・シャクヤク4.0・タイソウ4.0・ショウキョウ1.0・カンゾウ2.0・ビャクジュツ4.0・ブクリョウ4.0・ブシ末0.5g（PMDA 添付文書 2023年10月改訂 第1版で確認）\n- オースギのエキスGは1日量9.0g中にケイヒ4・ショウキョウ1・タイソウ4・シャクヤク4・カンゾウ2・ブクリョウ4・ソウジュツ4・ブシ末1g（PMDA 添付文書 2022年1月改訂 第1版で確認）\n- 朮はクラシエが白朮、オースギが蒼朮。附子はどちらもブシ末で、1日量はクラシエ0.5g、オースギ1g", "構成": "桂皮・芍薬・甘草・生姜・大棗・蒼朮（白朮）・茯苓・附子（ブシ末）", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "桂芍知母湯", "名前": "桂芍知母湯", "読み": "けいしゃくちもとう", "ツムラ番号": "", "出典": "金匱要略（中風歴節病脈証并治第五）", "本文": {"条文": "### 『金匱要略』中風歴節病脈証并治第五\n\n**書き下し**（読み：社員案）\n諸の肢節疼痛し、身体魁羸し、脚腫れて脱するが如く、頭眩し短気し、温温として吐せんと欲するは、桂枝芍薬知母湯之を主る。\n\n**原文**（翻刻確認）\n諸肢節疼痛，身體魁羸，腳腫如脫，頭眩短氣，溫溫欲吐，桂枝芍藥知母湯主之。\n\n**現代語訳**（訳：社員案）\n多くの関節が痛み、体がやせ衰え（魁羸。語の解釈には諸説がある）、脚が腫れて抜け落ちそうなようで、めまいがして息切れし、むかむかと吐き気がするものは、桂枝芍薬知母湯がこれを主治する。\n\n### 注記\n- 「魁羸」は、四部叢刊本（明嘉靖俞橋刊本の影印）の翻刻では「尫羸」と書かれる（要原本照合）\n- 「欲吐」の「欲」は、四部叢刊本の翻刻では「𣣔」と書かれる（字体の違い。要原本照合）\n- 附子の分量は、通行本の翻刻の「2枚（炮）」を本文に採った。四部叢刊本の翻刻では「2両（炮）」（要原本照合）\n- 四部叢刊本の翻刻では、この条は前の「盛人脈澀小……此皆飲酒汗出當風所致」の条（太った人の歴節の条）と改行なしに続いて書かれる（翻刻確認）\n- 現行の方名の桂芍知母湯は、原典では桂枝芍薬知母湯と書かれる（翻刻確認）", "出典": "### 原典の構成\n- 『金匱要略』中風歴節病第五（桂枝芍薬知母湯）：桂枝4両、芍薬3両、甘草2両、麻黄2両、生姜5両、白朮5両、知母4両、防風4両、附子2枚（炮）（翻刻確認。附子の分量の異同は条文の注記を参照）\n\n### 原典の服用法\n- 『金匱要略』中風歴節病第五：9味を水7升で煮て2升に煮詰め、7合を温服し、1日3回服用する（翻刻確認）\n\n### 処方の変遷\n- 原典の方名は桂枝芍薬知母湯（翻刻確認）\n- 『三因極一病証方論』巻之三・歴節治法では芍薬知母湯の名で載り、8味を姜煎するとしたあと、一法に白朮・川芎・杏仁・半夏があるとする（要原本照合）\n- 『傷寒活人書』には桂枝芍薬知母湯は収載されていない（要原本照合）\n- 構成は、桂枝加朮附湯（桂皮・芍薬・甘草・生姜・大棗・朮・附子）から大棗を去り、麻黄・知母・防風を加えたものにあたる\n- 医療用エキス剤はツムラにはなく、三和生薬の三和桂芍知母湯エキス細粒（識別コード S-10）がある（KEGG MEDICUS と添付文書で 2026-10-22 確認）\n- 三和のエキス細粒は1日量9g中にケイヒ3.0・チモ3.0・ハマボウフウ3.0・ショウキョウ1.0・シャクヤク3.0・マオウ3.0・ビャクジュツ4.0・カンゾウ1.5・加工ブシ1.0g（添付文書 2025年10月改訂 第2版で確認）\n- 原典の防風は、エキス剤では浜防風（ハマボウフウ）、附子は加工ブシ。朮は原典・エキス剤とも白朮", "構成": "桂皮・芍薬・甘草・麻黄・白朮・知母・浜防風・附子（加工ブシ）・生姜", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "桂麻各半湯", "名前": "桂麻各半湯", "読み": "けいまかくはんとう", "ツムラ番号": "", "出典": "傷寒論（巻第二・弁太陽病脈証并治上第五）", "本文": {"条文": "### 『傷寒論』巻第二・弁太陽病脈証并治上第五\n\n**書き下し**（読み：社員案）\n太陽病、之を得て八九日、瘧状の如く、発熱悪寒し、熱多く寒少なく、其の人嘔せず、清便自ずから可ならんと欲し、一日に二三度発す。脈微緩なる者は、愈えんと欲すと為すなり。脈微にして悪寒する者は、此れ陰陽倶に虚す。更に汗を発し、更に下し、更に吐すべからざるなり。面色反って熱色有る者は、未だ解せんと欲せざるなり。其の小汗出づるを得ること能わざるを以て、身必ず痒し。桂枝麻黄各半湯に宜し。\n\n**原文**（翻刻確認）\n太陽病，得之八九日，如瘧狀，發熱惡寒，熱多寒少，其人不嘔，清便欲自可，一日二三度發。脈微緩者，為欲愈也；脈微而惡寒者，此陰陽俱虛，不可更發汗更下更吐也；面色反有熱色者，未欲解也，以其不能得小汗出，身必癢，宜桂枝麻黃各半湯。\n\n**現代語訳**（訳：社員案）\n太陽病にかかって八、九日たち、瘧（おこり）のように発熱と悪寒があり、熱が多く寒けは少なく、病人は嘔かず、便通はおのずからふだんどおりになろうとしていて、一日に二、三回発作が起こる。脈が微かで緩やかなものは、治ろうとしているとみる。脈が微かで悪寒するものは、陰陽ともに虚しているので、このうえ発汗・瀉下・催吐をしてはならない。顔色がかえって熱を帯びているものは、まだ治ろうとしていない。少し汗を出すことができないために、からだが必ずかゆくなる。桂枝麻黄各半湯がよい。\n\n### 注記\n- 原典での方名は桂枝麻黄各半湯。桂麻各半湯は略称\n- 四庫全書本『傷寒論注釈』（成無己注）巻二の翻刻も同じ句（翻刻確認）。字体の違い（癢／痒、虛／虚など）のみ\n- 『金匱玉函経』巻第二・弁太陽病形証治第三の翻刻では、「發熱而惡寒，熱多而寒少」「清便自調」「日二三發」「脈微而惡寒」「不可復吐下發汗也」「面反有熱色者，為末欲解」「身必當癢」と字句が異なり、結びは「桂枝麻黃各半湯主之」（要原本照合）\n- 宋本の方の後には林億らの謹按があり、各半湯というより合半湯と言うほうがよいとする、と資料はいう。維基文庫の宋本の翻刻にはこの注が載っていない（要原本照合）\n- 宋本の巻第十に再掲された方は、麻黄の「去節」の位置と杏仁の数え方（枚／箇）が異なるが、分量は同じ（要原本照合）", "出典": "### 原典の構成\n- 『傷寒論』（宋本）：桂枝1両16銖（去皮）、芍薬・生姜（切）・甘草（炙）・麻黄（去節）各1両、大棗4枚（擘）、杏仁24枚（湯に浸し、皮尖と双仁のものを去る）（翻刻確認）\n- 『金匱玉函経』巻第七・方薬炮製（桂枝麻黄各半湯方第二）：桂枝（翻刻では銖数の字が崩れて読めない。要原本照合）、芍薬・生姜・甘草（炙）・麻黄 各1両、大棗4枚、杏仁24枚（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』（宋本）：7味を水5升で、まず麻黄を1、2回沸騰させて上の泡を去る。残りの薬を入れて1升8合に煮つめ、滓を去って6合を温服する（翻刻確認）\n- 『金匱玉函経』：7味を㕮咀し、水5升で、まず麻黄を1、2回沸騰させて上の泡を去る。残りの薬を入れて1升8合に煮つめ、滓を去って6合を温服する。もとは2湯を各3合ずつ合わせて6合とし頓服したが、今は1方にまとめた、と方後にある（翻刻確認）\n\n### 処方の変遷\n- 桂枝湯と麻黄湯を各1/3量ずつ合わせて新しい方としたもの\n- 『太平聖恵方』巻第八・傷寒三陰三陽応用湯散諸方の桂枝麻黄湯方（桂枝・麻黄・赤芍薬・杏仁 各1両、甘草半両。散とし姜棗で煎服）は、構成生薬が本方と同じ。同書巻第十一・治陽毒傷寒諸方の桂枝麻黄散は、桂枝・麻黄・甘草・赤芍薬・葛根・杏仁 各1両を散とし姜で煎服する（要原本照合）\n- 『丹渓手鏡』巻之中・傷寒方論一では、桂枝湯（桂枝・芍薬・甘草・姜棗 各3銭）に麻黄2銭・杏仁12枚を加えたものを桂麻各半湯と名づける（要原本照合）\n- 『金鏡内台方議』巻之一では、一名を麻黄芍薬湯とし、桂枝湯中に麻黄・杏仁を加えたものとする（要原本照合）\n- 『医学入門』三巻下・傷寒用薬賦の桂麻各半湯は、麻黄1銭半、桂枝・芍薬・杏仁 各1銭、甘草7分、姜3片、棗2枚を煎服する（要原本照合）\n- ツムラの医療用エキス剤はない。医療用は〔東洋〕桂麻各半湯エキス細粒（東洋薬行）の1品目で、1日量4.5g中に 桂枝3.5・芍薬2・生姜（生ショウキョウ）2・甘草2・麻黄2・大棗2・杏仁2.5（g）の混合生薬の水製エキスを含む（PMDA 添付文書 2023年10月改訂 第1版で確認）", "構成": "桂枝・芍薬・生姜・甘草・麻黄・大棗・杏仁", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "梔子柏皮湯", "名前": "梔子柏皮湯", "読み": "ししはくひとう", "ツムラ番号": "", "出典": "傷寒論（弁陽明病脈証并治第八）", "本文": {"条文": "### 『傷寒論』弁陽明病脈証并治第八\n\n**書き下し**（読み：社員案）\n傷寒、身黄ばみ、発熱するは、梔子柏皮湯之を主る。\n\n**原文**（翻刻確認）\n傷寒、身黃、發熱、梔子柏皮湯主之。\n\n**現代語訳**（訳：社員案）\n傷寒で、からだが黄色くなり、発熱するものは、梔子柏皮湯がこれを主治する。\n\n### 注記\n- 宋本の翻刻では、条文の方名は「梔子柏皮湯」、方の見出しは「梔子檗皮湯方」、構成の生薬名は「黃檗」と書かれる（翻刻確認）。本文は条文の字を採った\n- 『注解傷寒論』の四庫全書本（書名『傷寒論注釋』）巻五では、方名が「梔子蘗皮湯」、生薬名が「黄蘗」と書かれる。条文は「傷寒身黄發熱者」と「者」の字がある（要原本照合）。本文は宋本の字を採った\n- 『金匱玉函経』の条（陽明病の篇）では、方名が「梔子檗皮湯」と書かれる（要原本照合）\n- 『金匱玉函経』巻第七・方薬炮製では「梔子黄檗湯」の名で載り、梔子14枚（擘）・黄檗2両16銖・甘草1両（炙）を㕮咀して煮る。梔子の数と黄檗の量が宋本と異なる（要原本照合）。本文の構成は、宋本と『注解傷寒論』で一致する値を採った", "出典": "### 原典の構成\n- 『傷寒論』：肥梔子15箇（擘）、甘草1両（炙）、黄檗（黄柏）2両（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』：3味を水4升で煮て1升半を取り、滓を去り、分けて温めて2回に服す（翻刻確認）\n\n### 処方の変遷\n- 『金匱玉函経』巻第七・方薬炮製では梔子黄檗湯と名づけられる（翻刻確認）。分量の違いは条文の注記を参照\n- 『肘後百一方』巻之四・治卒発黄疸諸黄病第三十一では、黄汗の方の又方として甘草・梔子・黄柏を水煎して服し、温病の発黄も治すとされる（要原本照合）\n- 『千金翼方』巻第九・傷寒上・陽明病状第八では、傷寒で黄を発するものに梔子柏皮湯として梔子・甘草・黄柏が示されるとされる（要原本照合）\n- 『太平聖恵方』巻第十・治傷寒煩躁諸方では、方名なしで、傷寒の発汗後に身熱が退かず心神が煩躁するものに、梔子人・甘草・黄柏を散として水煎服するとされる（要原本照合）\n- 『鶏峰普済方』第十巻・血では柏皮湯の名で本方が収載されるとされる（要原本照合）\n- 『黄帝素問宣明論方』巻之六・傷寒方と巻之八・水湿門では、頭に微しく汗し、小便が利して微しく黄を発するもの（湿熱が相搏つこと微しいもの）に、黄柏・甘草・大梔子が示されるとされる（要原本照合）\n- 『傷寒直格方』巻下・諸証薬石分剤の茵蔯湯の解説のなかで、同様の軽い発黄に大山梔子・甘草・黄柏の梔子柏皮湯がよいとされる（要原本照合）\n- 『類聚方広義』（下）では、眼球が黄赤して熱痛がひどいものや胞瞼の糜爛・痒痛などに、枯礬を少し加えて洗う外用（洗眼）の用法が載るとされる（要原本照合）\n- 賀川玄迪『産論翼』では、本方合三黄瀉心湯（黄連解毒湯合大黄甘草湯と同じ構成）が第六和剤湯と名づけられるとされる（要原本照合）\n- 医療用エキス剤はツムラにはなく、小太郎漢方製薬の「コタロー梔子柏皮湯エキス細粒」がある（識別コード N314。1日量6.0g中、日局サンシシ3.0・カンゾウ1.0・オウバク2.0g。PMDA 添付文書 2023年1月改訂 第1版で確認）。原典と同じ3味。添付文書に出典の欄はない", "構成": "山梔子・甘草・黄柏", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "芍薬甘草附子湯", "名前": "芍薬甘草附子湯", "読み": "しゃくやくかんぞうぶしとう", "ツムラ番号": "", "出典": "傷寒論（弁太陽病脈証并治中第六）", "本文": {"条文": "### 『傷寒論』弁太陽病脈証并治中第六\n\n**書き下し**（読み：社員案）\n発汗し、病解せず、反って悪寒する者は、虚するが故なり。芍薬甘草附子湯之を主る。\n\n**原文**（翻刻確認）\n發汗、病不解、反惡寒者、虛故也。芍藥甘草附子湯主之。\n\n**現代語訳**（訳：社員案）\n発汗させたが病が治らず、かえって悪寒するものは、虚しているためである。芍薬甘草附子湯がこれを主治する。\n\n### 関連条文（本方の条の二条後）\n\n『傷寒論』弁太陽病脈証并治中第六。資料が「表実」の意味を説明するために挙げる条。\n\n**書き下し**（読み：社員案）\n発汗の後、悪寒する者は、虚するが故なり。悪寒せず、但だ熱する者は、実なり。当に胃気を和すべし。調胃承気湯を与う。\n\n**原文**（翻刻確認）\n發汗後惡寒者、虛故也。不惡寒但熱者、實也。當和胃氣、與調胃承氣湯。\n\n**現代語訳**（訳：社員案）\n発汗の後に悪寒するものは、虚しているためである。悪寒せずただ熱するものは、実である。胃気を和すべきで、調胃承気湯を与える。\n\n### 注記\n- 本方の条は、宋本の翻刻と『注解傷寒論』の四庫全書本（書名『傷寒論注釋』）巻三で字が同じ（翻刻確認。虛／虚などの字形の差のみ）\n- 『金匱玉函経』では条の初めが「發其汗不解、而反惡寒者」と書かれる（要原本照合）。本文は宋本の字を採った\n- 資料によれば、宋本では方の後に「疑うらくは仲景の方に非ず」と付記される。維基文庫の宋本の翻刻の方後にはこの句が見当たらず、『傷寒論注釋』四庫全書本の方後には「疑非仲景意」とある（要原本照合）\n- 資料によれば、弁発汗後病脈証并治第十七にも同じ条があり、条の最後が「属芍薬甘草附子湯」となり、甘草に炙の細註がない。維基文庫の宋本の翻刻はこの篇を1条しか載せておらず、確かめられない（要原本照合）\n- 『金匱玉函経』の方は、芍薬・甘草各1両、附子1枚（炮）で、㕮咀して水3升で煮て1升3合を取り、3回に分けて温服する（要原本照合）。原典の構成・服用法は宋本の値を採った\n- 『傷寒論注釋』四庫全書本の服用法は「分温服」で「三」の字がない（要原本照合）", "出典": "### 原典の構成\n- 『傷寒論』：芍薬・甘草（炙）各3両、附子1枚（炮じ、皮を去り、8片に破る）（翻刻確認）\n\n### 原典の服用法\n- 『傷寒論』：3味を水5升で煮て1升5合を取り、滓を去り、3回に分けて温服する（翻刻確認）\n\n### 処方の変遷\n- 芍薬甘草湯（芍薬・甘草）に附子を加えた構成\n- 資料によれば、原典の芍薬甘草湯は「白芍薬・甘草（炙）」と指示されるのに対し、本方は「芍薬」と指示される（要原本照合）\n- 『類聚方広義』（下）は本方に大黄を加えて芍薬甘草附子大黄湯と名づける（要原本照合）\n- 医療用エキス剤は、三和芍薬甘草附子湯エキス細粒（1日量4.5g中、日局シャクヤク5.0g・日局カンゾウ5.0g・日局加工ブシ1.0g。PMDA 添付文書 2026年8月改訂 第3版で確認）。ツムラの医療用製剤は見当たらない（KEGG MEDICUS、2026-10-22）", "構成": "芍薬・甘草・附子（加工ブシ）", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}, {"file": "四苓湯", "名前": "四苓湯", "読み": "しれいとう", "ツムラ番号": "", "出典": "内外傷弁惑論（巻下・随時用薬）", "本文": {"条文": "### 『内外傷弁惑論』巻下・随時用薬（李杲）\n\n**書き下し**（読み：社員案）\n冷飲に傷られて悪寒せざる者、腹中も亦た寒を覚えず、惟だ夯悶して身重きを覚え、飲食化せざる者、或いは小便利せざるを治するには、去桂五苓散を煎じ、前に依りて斟酌して之を服す。\n\n**原文**（翻刻確認）\n治傷冷飲不惡寒者、腹中亦不覺寒、惟覺夯悶身重、飲食不化者、或小便不利、煎去桂五苓散、依前斟酌服之。\n\n**現代語訳**（訳：社員案）\n冷たい飲み物に傷られたが悪寒がなく、腹の中にも冷えを感じず、ただ重苦しく悶えて（夯悶）体が重く感じ、飲食物が消化されないもの、あるいは尿の出が悪いものを治すには、去桂五苓散（五苓散から桂を去ったもの）を煎じ、前の条にならって分量を加減して服す。\n\n### 注記\n- 本方は原典では「去桂五苓散」の名で載り、四苓散・四苓湯の名ではない（翻刻確認）\n- 「腹中」は、維基文庫の四庫全書本の翻刻では「服中」と書かれる（要原本照合）。資料と、維基文庫のもう一つの翻刻（未校訂本）は「腹中」\n- 資料は所在を「巻之二・随時用薬」とする。維基文庫の翻刻（上・中・下の3巻）では巻下に載る（要原本照合）\n- 「前に依りて」の「前」は、同じ随時用薬の最初の条「治傷冷飲者、以五苓散每服三錢或四錢匕、加生薑煎服之。」（冷飲に傷られた者を治するには、五苓散を毎服三銭或いは四銭匕、生姜を加え煎じて之を服す）を指すと読める（翻刻確認）", "出典": "### 原典の構成\n- 『内外傷弁惑論』：「去桂五苓散」とだけあり、各味・分量の記載はない（翻刻確認）\n- 同書同巻の五苓散の方：沢瀉2両5銭、猪苓・茯苓・白朮 各1両5銭、桂1両（翻刻確認）\n\n### 原典の服用法\n- 『内外傷弁惑論』：去桂五苓散を煎じ、前の条（五苓散を1回3銭または4銭匕、生姜を加えて煎じて服す）にならって斟酌して服す（翻刻確認）\n- 同書同巻の五苓散の方の服用法は、細末とし、1回2銭を熱湯で調えて服し、時を問わない。服し終えたら熱湯を多く飲み、汗が出れば愈える（翻刻確認）\n\n### 処方の変遷\n- 構成上は五苓散から桂皮を去った方。資料の出典欄には『傷寒論』『金匱要略』も挙がるが、これらは五苓散の出典で、四苓散・四苓湯の名は両書には載らない（資料の論考による。要確認）\n- 『内外傷弁惑論』巻下・随時用薬に「去桂五苓散」の名で載る（翻刻確認）。資料は、本方の出典を『温疫論』とするのは誤りで、それより早い本書によるとする\n- 『儒門事親』（張子和）巻之十一には「減桂五苓散」「五苓散去猪苓」の表現があり、資料は『内外傷弁惑論』の去桂五苓散への一段階とする（要原本照合）\n- 『丹渓心法』巻二・泄瀉十に四苓散の名で載り、附方に「四苓散、即ち五苓散の内、桂を去る」とある（要原本照合）\n- 『温疫論』（呉有性）下巻・論飲の四苓散は、茯苓・沢瀉・猪苓・陳皮の4味で、白朮がなく陳皮が入る別の構成。従来はこれが本方の出典とされてきた（要原本照合）\n- 『勿誤薬室方函』巻上は四苓散の出典を『温疫論』としつつ、薬味を猪苓・沢瀉・白朮・茯苓とする。資料はこれを錯誤とする（要原本照合）\n- 医療用製剤はツムラにはなく、大杉製薬の「オースギ四苓湯細粒（調剤用）」がある（識別コード SG-140。1日量3.0g中、日局タクシャ末・ブクリョウ末・ソウジュツ末・チョレイ末 各0.75g の生薬末製剤。PMDA 添付文書 2022年12月改訂 第1版で確認）。原典の白朮の代わりに蒼朮が入る。添付文書に出典の欄はない", "構成": "沢瀉・茯苓・蒼朮・猪苓", "方意": "", "諸家の論": "", "院長メモ": ""}, "非公開": ["条文", "出典", "構成", "方意", "諸家の論"]}]}</script>

/* 検索用：カタカナ→ひらがな、全角英数→半角、空白除去 */
function norm(s){
  return String(s||"").toLowerCase()
    .replace(/[ァ-ヶ]/g, function(c){ return String.fromCharCode(c.charCodeAt(0)-0x60); })
    .replace(/[！-～]/g, function(c){ return String.fromCharCode(c.charCodeAt(0)-0xfee0); })
    .replace(/\s+/g, "");
}
DATA.entries.forEach(function(e){
  e._idx = norm([e["名前"], e["読み"], e["ツムラ番号"], e["出典"], e["本文"]["構成"]].join(" "));
});
var TODO = '<span class="todo">要確認</span>';
var LOCAL = DATA.edition === "local";
/* 本文中の「要確認」「要原本照合」を目立たせる（エスケープ後の文字列に使う） */
/* 確認の段階：要確認・要原本照合（未確認・朱）→ 翻刻確認（金茶）→ 院長確認（松葉）。読み：社員案・訳：社員案（藍） */
var FLAG_RE = /（(要確認|要原本照合)）|(要確認|要原本照合)/g;
var MARK_RE = /（(要確認|要原本照合|翻刻確認|院長確認|読み：社員案|訳：社員案)）|(要確認|要原本照合|翻刻確認|院長確認|読み：社員案|訳：社員案)/g;
var MARK_CLASS = {"翻刻確認":" hon", "院長確認":" ok", "読み：社員案":" yomi", "訳：社員案":" yomi"};
function flagify(html){
  return html.replace(MARK_RE, function(_, a, b){ var t = a || b; return '<span class="flag' + (MARK_CLASS[t] || "") + '">' + t + '</span>'; });
}

/* 本文の Markdown を表示用に変換する（### 見出し・**太字**・表・箇条書き・段落のみ） */
function inline(s){ return flagify(esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")); }
function cells(line){ return line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(function(c){ return c.trim(); }); }
var TBL_SEP = /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/;
function md(text){
  var lines = text.split("\n"), out = [], i = 0, m, buf;
  var isBlock = function(l){ return !l.trim() || /^#{3,6}\s/.test(l) || /^\s*\|/.test(l) || /^\s*[-*]\s+/.test(l); };
  while (i < lines.length){
    var l = lines[i];
    if (!l.trim()){ i++; continue; }
    if ((m = l.match(/^#{3,6}\s+(.*)$/))){
      out.push("<h4>" + inline(m[1]) + "</h4>"); i++;
      /* 中身のない小見出し（資料にない項目）には「要確認」を出す */
      var j = i; while (j < lines.length && !lines[j].trim()) j++;
      if (j >= lines.length || /^#{3,6}\s/.test(lines[j])) out.push("<p>" + TODO + "</p>");
      continue;
    }
    if (/^\s*\|/.test(l)){
      buf = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) buf.push(lines[i++]);
      var head = buf.length > 1 && TBL_SEP.test(buf[1]) ? cells(buf[0]) : null;
      var rows = buf.filter(function(r, j){ return !(head && j < 2); });
      out.push('<div class="tbl"><table>' +
        (head ? "<thead><tr>" + head.map(function(c){ return "<th>" + inline(c) + "</th>"; }).join("") + "</tr></thead>" : "") +
        "<tbody>" + rows.map(function(r){ return "<tr>" + cells(r).map(function(c, j){
          /* data-label：カード表示のときに列名を出す。blank：中身が「—」だけの欄はカードでは隠す */
          return "<td" + (head && head[j] ? ' data-label="' + esc(head[j]) + '"' : "") + (/^[—-]?$/.test(c) ? ' class="blank"' : "") + ">" + inline(c) + "</td>";
        }).join("") + "</tr>"; }).join("") +
        "</tbody></table></div>");
      continue;
    }
    if (/^\s*[-*]\s+/.test(l)){
      buf = [];
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) buf.push("<li>" + inline(lines[i++].replace(/^\s*[-*]\s+/, "")) + "</li>");
      out.push("<ul>" + buf.join("") + "</ul>");
      continue;
    }
    buf = [];
    while (i < lines.length && !isBlock(lines[i])) buf.push(inline(lines[i++]));
    out.push("<p>" + buf.join("<br>") + "</p>");
  }
  return out.join("");
}
function countFlags(e){
  return DATA.sections.reduce(function(n, k){ return n + (e["本文"][k].match(FLAG_RE) || []).length; }, 0);
}

function renderList(){
  var q = norm($("#q").value);
  var hits = DATA.entries.filter(function(e){ return !q || e._idx.indexOf(q) !== -1; });
  if (!DATA.entries.length){
    $("#count").textContent = "";
    $("#list").innerHTML = '<div class="listempty"><div class="big">🌼</div>まだ方剤が登録されていません<br>entries/ に方剤を足して build.py を実行してください</div>';
    return;
  }
  $("#count").textContent = q ? "該当 " + hits.length + " 件" : "方剤 " + hits.length + " 件";
  if (!hits.length){
    $("#list").innerHTML = '<div class="listempty"><div class="big">🔍</div>見つかりません</div>';
    return;
  }
  $("#list").innerHTML = hits.map(function(e){
    var sub = [e["読み"], e["出典"]].filter(Boolean).join("　");
    return '<button class="al" data-f="' + esc(e.file) + '">' +
      '<span class="num">' + (e["ツムラ番号"] ? esc(e["ツムラ番号"]) : "—") + '</span>' +
      '<span class="am"><span class="an" style="display:block">' + esc(e["名前"]) + '</span>' +
      '<span class="ax" style="display:block">' + (sub ? esc(sub) : "読み・出典 要確認") + '</span></span></button>';
  }).join("");
}

function renderDetail(e){
  var h = '<button class="back" onclick="history.length>1?history.back():go(\'\')">‹ 一覧へ</button>';
  h += '<div class="dhead"><h2>' + esc(e["名前"]) + '</h2>' +
    '<div class="yomi">' + (e["読み"] ? esc(e["読み"]) : TODO) + '</div>' +
    '<div class="tags"><span class="pill num">ツムラ ' + (e["ツムラ番号"] ? esc(e["ツムラ番号"]) : "要確認") + '</span>' +
    '<span class="pill src">' + (e["出典"] ? esc(e["出典"]) : "出典 要確認") + '</span>' +
    (countFlags(e) ? '<span class="pill flagcount">要確認・要照合 ' + countFlags(e) + '</span>' : '') + '</div></div>';
  DATA.sections.forEach(function(k){
    var v = e["本文"][k], priv = e["非公開"].indexOf(k) !== -1;
    var body = v ? md(v) : (priv ? '<span class="privnote">手元版のみ</span>' : TODO);
    h += '<div class="sec' + (k === "条文" ? " jobun" : "") + (priv && LOCAL ? " priv" : "") + '"><h3>' + esc(k) +
      (priv && LOCAL ? '<span class="privbadge">非公開を含む</span>' : '') + '</h3>' +
      '<div class="body">' + body + '</div></div>';
  });
  $("#v-detail").innerHTML = h;
}

/* 画面の状態は URL ハッシュ（#<方剤ファイル名>）で表す */
function go(f){ location.hash = f ? encodeURIComponent(f) : ""; }
function route(){
  var f = decodeURIComponent(location.hash.slice(1));
  var e = DATA.entries.filter(function(x){ return x.file === f; })[0];
  $("#v-list").classList.toggle("on", !e);
  $("#v-detail").classList.toggle("on", !!e);
  if (e){ renderDetail(e); window.scrollTo(0, 0); }
}
$("#list").addEventListener("click", function(ev){
  var b = ev.target.closest(".al"); if (b) go(b.dataset.f);
});
$("#q").addEventListener("input", function(){ renderList(); if (location.hash) go(""); });
window.addEventListener("hashchange", route);
$("#built").textContent = "データ更新 " + DATA.built + (LOCAL ? "（手元版）" : "");
$("#edition").hidden = !LOCAL;
renderList(); route();
</script>
</body>
</html>
